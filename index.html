回想一下前面聽到的內容。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [218, 219, 220, 221]}, {"id": "side-南投縣-3", "title": "南投縣．車埕至東埔", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識南投縣的幾個地方：車埕、武界、埔里社、東埔。」", "stops": [{"placeId": 222, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『車埕』這個地方，是怎麼來的嗎？車埕因1914年埔里糖廠興建輕便鐵道運輸蔗糖，此地作為台車中繼休息與修理站，經常停放數百部台車而得名。", "車埕地名由來與日治時期的糖業與林業運輸密切相關：大正2年（1914年），為了運送埔里地區生產的蔗糖，總督府鋪設一條對外連接的輕便鐵道，車埕因地處交通要衝，被規劃為沿線重要的中繼休息站與修理站，經常有數百部人力輕便台車在此停放、調度，因而得名「車埕」，「埕」在閩南語中泛指開闊的空地或廣場，恰好貼合這裡作為台車調度場地的功能。隨著集集線鐵路的興建與延伸，", "車埕進一步發展成南投山區重要的木材集散與運輸重鎮，日治至戰後全盛時期，這裡林業加工廠林立，是木業經濟的核心地帶。隨著林業政策轉變與鐵路運輸功能式微，車埕一度沒落，近年透過保存舊車站建築、木業歷史廠房與周邊明潭水庫的湖光山色，成功轉型為集集線鐵路端點站的熱門觀光小鎮。"], "quiz": {"q": "關於「車埕」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "車埕因1914年埔里糖廠興建輕便鐵道運輸蔗糖，此地作為台車中繼休息與修理站，經常停放數百部台車而得名。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 2, "rightFb": "沒錯！車埕因1914年埔里糖廠興建輕便鐵道運輸蔗糖，此地作為台車中繼休息與修理站，經常停放數百部台車而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 223, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『武界』這個地方，是怎麼來的嗎？武界因位處泰雅族與布農族早年交戰後議和劃定的獵域界線而得名，另一說源自布農語「Vogai」，意指翻越山嶺或界線。", "武界地名由來主要有兩種說法：第一種說法指出，這裡是南投信義鄉與仁愛鄉的交界地帶，早年北側泰雅族與南側布農族時常因爭奪獵域而發生衝突，雙方經過協調後，議定以干卓萬山為界、互不越界，這條劃定的界線正好通過武界現址，因而得名「武界」；第二種說法則認為地名源自布農語「Buqaiz」（也拼寫作Vogai或Bogai）的音譯，意指「翻越某物」，例如翻過一座山頭或跨越一條界線，", "恰好呼應了武界地處山區要衝、族群往來必經之地的地理特徵。1919年，台灣總督府為統一管理布農族卓社群，推行「集團移住」政策，將原本分散各處的卓社群部落族人集中遷移到濁水溪沖積平原上安置，形成今日的武界部落（法治村），是台灣布農族分布最北的一支，如今武界因鄰近武界壩與雲龍瀑布，是南投縣深具原始風貌的部落型觀光景點。"], "quiz": {"q": "關於「武界」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「武界」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "武界因位處泰雅族與布農族早年交戰後議和劃定的獵域界線而得名，另一說源自布農語「Vogai」，意指翻越山嶺或界線。"], "correct": 3, "rightFb": "沒錯！武界因位處泰雅族與布農族早年交戰後議和劃定的獵域界線而得名，另一說源自布農語「Vogai」，意指翻越山嶺或界線。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 511, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『埔里社』這個地方，是怎麼來的嗎？埔里舊稱，因清代眉溪流域聚居多個平埔族社群，統稱埔里社，後成為漢人拓墾入山的重要據點。", "「埔里社」一詞在清代文獻中，其實兼指狹義的邵族「Poli社」本身，以及廣義涵蓋整個埔里盆地平埔族匯聚生活圈的行政區劃名稱，光緒元年（1875年）清廷在此設置「埔里社廳」，正是取後者的廣義用法，作為開山撫番政策下管理這片內山地帶的行政機構。埔里社廳的設立，標誌著埔里從原本邵族、泰雅族與陸續遷入的西部平埔族群共同生活的邊區地帶，", "正式納入清朝有效統治範圍的關鍵轉折點；官府同時在此築起土製城垣，稱為「大埔城」，作為行政中心的防禦屏障。日治時期，「埔里社」簡化為「埔里」，沿用至今。如今埔里鎮境內的地名如愛蘭（烏牛欄）、房里等，仍持續訴說著這段清代眾多平埔族社群因西部漢人拓墾壓力而遷徙匯聚於埔里盆地、形成獨特多元族群地景的歷史。"], "quiz": {"q": "關於「埔里社」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "埔里舊稱，因清代眉溪流域聚居多個平埔族社群，統稱埔里社，後成為漢人拓墾入山的重要據點。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！埔里舊稱，因清代眉溪流域聚居多個平埔族社群，統稱埔里社，後成為漢人拓墾入山的重要據點。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 512, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『東埔』這個地方，是怎麼來的嗎？信義鄉東埔村一帶，為布農族傳統部落所在地，因鄰近溫泉、風景秀麗而聞名。", "東埔位於南投縣信義鄉，是布農族傳統部落所在地，地處陳有蘭溪上游河谷地帶，因鄰近溫泉資源與壯麗山景，自日治時期以來便是知名的高山溫泉勝地，泉質屬弱鹼性碳酸氫鈉泉，是玉山國家公園西側入口的重要中繼站。境內的東埔吊橋橫跨八掌溪河谷，全長約200公尺，是台灣目前最高的吊橋之一，橋面採鏤空木質設計，", "可俯瞰橋下128公尺深的溪谷雲霧景致，吊橋入口的石雕山豬造型，也呼應了布農族傳統的狩獵文化意象。東埔部落至今仍保留布農族的祭儀傳統與八部合音（Pasibutbut）等珍貴無形文化資產，是南投縣信義鄉境內布農族文化與生態觀光資源兼具的代表性部落，也是攀登台灣最高峰玉山最主要的登山口之一。"], "quiz": {"q": "關於「東埔」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「東埔」市集而得名", "信義鄉東埔村一帶，為布農族傳統部落所在地，因鄰近溫泉、風景秀麗而聞名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！信義鄉東埔村一帶，為布農族傳統部落所在地，因鄰近溫泉、風景秀麗而聞名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [222, 223, 511, 512]}]}, "雲林縣": {"mainChains": [{"id": "main-雲林縣-1", "title": "雲林縣．斗六市至西螺鎮", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識雲林縣的幾個地方：斗六市、斗南鎮、虎尾鎮、西螺鎮。」", "stops": [{"placeId": 224, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『斗六市』這個地方，是怎麼來的嗎？斗六舊稱斗六門，源自平埔族洪雅族斗六社，一說因族人狩獵慶賀的呼聲而得名，一說因地處諸羅縣東方門戶而加「門」字。", "斗六舊稱「斗六門」，地名由來主要有兩種說法：一說源自平埔族洪雅族「斗六社」（原居於今斗六市柴裡一帶，即今三興里）的社名音譯；另一說則帶有生動的民俗色彩，指原住民族人出獵捕獲山鹿時，會發出「ㄉㄨ ㄌㄨ ㄇㄣˋ」的歡呼慶賀聲，先民便以此擬聲詞為地方命名。至於「門」字的由來，一般認為是因斗六門地處諸羅縣（今嘉義）東側進入內山地帶的門戶要衝，", "地勢險要、自古為兵家必爭之地，因而加上「門」字強調其關口地位，後來才簡化去除，成為今日的「斗六」。光緒13年（1887年）台灣建省，首任巡撫劉銘傳原擬在林圮埔（今南投竹山）雲林坪設縣治，因清水溪、濁水溪夏秋氾濫交通不便，光緒19年將縣治遷至斗六門，「雲林」之名卻因此隨縣治沿用下來，如今斗六市是雲林縣政府所在地，也是全縣唯一的市轄區。"], "quiz": {"q": "關於「斗六市」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "斗六舊稱斗六門，源自平埔族洪雅族斗六社，一說因族人狩獵慶賀的呼聲而得名，一說因地處諸羅縣東方門戶而加「門」字。", "因清代此地盛產某種作物，官府設「斗六市」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！斗六舊稱斗六門，源自平埔族洪雅族斗六社，一說因族人狩獵慶賀的呼聲而得名，一說因地處諸羅縣東方門戶而加「門」字。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 225, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『斗南鎮』這個地方，是怎麼來的嗎？斗南原稱他里霧，源自洪雅族「他里霧社」音譯，意指蒼莽草原，1920年因位居斗六之南而改稱斗南。", "斗南舊稱「他里霧」，源自平埔族洪雅族「他里霧社」（Tarubu或Dalivoe）的社名音譯，平埔語原意為「蒼莽草原」，反映當地早期未墾荒野的地貌特徵。根據荷蘭統治時期文獻記載，平埔族在雲林縣境內曾設有五個社，斗南地區便占有兩社：他里霧社與猴悶社（今將軍里溫厝角），其中他里霧社人數最多，原址即在今斗南市區與舊社里一帶，康熙23年（1684年）《福建通志》台灣府三縣圖中已見他里霧社的記載。1920年，", "日本殖民政府推行地方行政改制，因這一帶位於斗六以南，遂將「他里霧」改稱「斗南」；饒富趣味的是，日本本州青森縣陸奧市剛好也有一處相同讀音的「斗南藩」（となみはん），部分文獻認為這項巧合也促成了改名的選擇。斗南地處雲林縣交通地理中心，因縱貫鐵路、公路與糖廠小火車交會，長期是雲林對外的重要交通門戶。"], "quiz": {"q": "關於「斗南鎮」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["斗南原稱他里霧，源自洪雅族「他里霧社」音譯，意指蒼莽草原，1920年因位居斗六之南而改稱斗南。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因清代此地盛產某種作物，官府設「斗南鎮」市集而得名"], "correct": 0, "rightFb": "沒錯！斗南原稱他里霧，源自洪雅族「他里霧社」音譯，意指蒼莽草原，1920年因位居斗六之南而改稱斗南。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 226, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『虎尾鎮』這個地方，是怎麼來的嗎？虎尾舊稱五間厝，因清代僅有五棟草厝而得名，原稱「后尾」因與「虎」台語發音相近而訛傳為虎尾。", "虎尾地名的演變頗為曲折：清康熙56年（1717年），諸羅縣在此設「大坵田一堡」，因當地地形起伏如丘陵，最初稱為「大崙腳」；乾隆24年（1756年），福建人郭六才前來大崙腳開墾，在東北邊俗稱「后尾」之處興建五間草寮定居，這處聚落因而被稱為「五間厝」。日治時期，因當地台語發音的「后」與「虎」十分相近，加上日本人不熟悉台語、當地居民也未加以辨明澄清，「后尾」便逐漸被誤傳、書寫為「虎尾」，", "這種因語音訛傳而流傳至今的地名演變過程，是台灣地名史上相當特殊的案例。明治40年（1907年），大日本製糖株式會社選定五間厝設立糖廠，並設「五間厝驛」運輸蔗糖，1920年隨行政區改制正式定名「虎尾」，車站也隨之更名虎尾驛。如今虎尾因保存完整的日治糖廠建築群與郡役所等歷史建物，是雲林縣重要的歷史文化與教育重鎮。"], "quiz": {"q": "關於「虎尾鎮」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "虎尾舊稱五間厝，因清代僅有五棟草厝而得名，原稱「后尾」因與「虎」台語發音相近而訛傳為虎尾。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！虎尾舊稱五間厝，因清代僅有五棟草厝而得名，原稱「后尾」因與「虎」台語發音相近而訛傳為虎尾。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 227, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『西螺鎮』這個地方，是怎麼來的嗎？西螺源自平埔族巴布薩族「西螺社」，相傳因地形似田螺，與濁水溪對岸北斗（東螺）協議分稱西螺、東螺。", "西螺地名源自平埔族巴布薩族「西螺社」，該族人自稱居住地為「Soreau」。相傳三百多年前，這一帶的地形輪廓神似田螺，而濁水溪對岸的北斗一帶恰好也呈現類似的地形樣貌，兩地墾民於是協議，將位於溪流南端的一方稱為「西螺」，北端（今北斗）則稱為「東螺」，這種依相似地形、輔以方位區分兩地地名的方式，在台灣地名史上相當少見。西螺又有「螺陽」的雅稱，", "一說是依「北辰南陽」的方位命名，因西螺恰好位於濁水溪南畔；另一說則是開拓先民為追思福建原鄉「螺陽」（今福建惠安一帶）而取名，寄託思鄉之情。西螺因地處濁水溪畔，土壤肥沃，是台灣重要的蔬菜（尤其是西螺醬油與濁水米）產地，戰後興建的西螺大橋一度是東亞最長的橋樑，是連接雲林、彰化兩地的重要地標。"], "quiz": {"q": "關於「西螺鎮」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "西螺源自平埔族巴布薩族「西螺社」，相傳因地形似田螺，與濁水溪對岸北斗（東螺）協議分稱西螺、東螺。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因清代此地盛產某種作物，官府設「西螺鎮」市集而得名"], "correct": 1, "rightFb": "沒錯！西螺源自平埔族巴布薩族「西螺社」，相傳因地形似田螺，與濁水溪對岸北斗（東螺）協議分稱西螺、東螺。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [224, 225, 226, 227]}, {"id": "main-雲林縣-2", "title": "雲林縣．土庫鎮至大埤鄉", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識雲林縣的幾個地方：土庫鎮、北港鎮、古坑鄉、大埤鄉。」", "stops": [{"placeId": 228, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『土庫鎮』這個地方，是怎麼來的嗎？土庫舊稱塗庫，因是鹿港通北港必經之地，道路狹隘泥濘如穿「土褲」而得名，另一說源自洪雅族猴悶社自稱「土庫」音譯。", "土庫舊稱「塗庫」，地名由來主要有兩種說法：第一種說法從交通地形著眼，指這一帶是清代鹿港通往北港的必經之路，沿線兩側地勢高聳、中央低窪，且道路特別狹隘，每逢下雨便泥濘不堪，行人通過時往往泥水沒過小腿，猶如穿著沾滿泥巴的「土褲」，因而得名「塗褲莊」，後轉為「塗庫」；第二種說法則認為，地名源自當地平埔族洪雅族「猴悶社」自稱「土庫」的音譯轉化，", "與地形描述無關。1920年，日本殖民政府推行地方行政改制，將「塗庫」正式改稱「土庫」，沿用至今。土庫鎮地處雲林縣中央地帶，因土壤肥沃，是重要的花生、蒜頭與蔬果產地，加上鄰近的順天宮媽祖信仰，是雲林縣海線與山線交界的重要商業市鎮之一。"], "quiz": {"q": "關於「土庫鎮」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "土庫舊稱塗庫，因是鹿港通北港必經之地，道路狹隘泥濘如穿「土褲」而得名，另一說源自洪雅族猴悶社自稱「土庫」音譯。", "因清代此地盛產某種作物，官府設「土庫鎮」市集而得名"], "correct": 2, "rightFb": "沒錯！土庫舊稱塗庫，因是鹿港通北港必經之地，道路狹隘泥濘如穿「土褲」而得名，另一說源自洪雅族猴悶社自稱「土庫」音譯。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 229, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『北港鎮』這個地方，是怎麼來的嗎？北港舊稱笨港，因笨港溪氾濫將街市沖毀分為南北兩岸，北岸稱笨北港，簡稱北港，清代曾有「一府二笨三艋舺」之稱。", "北港舊稱「笨港」，這是台灣清領時期最重要的港口之一，享有「一府二笨三艋舺」的美譽，與台南府城、艋舺並列全台三大港市。「笨港」地名由來眾說紛紜，有一說認為源自平埔族語「Ponkan」的音譯，也有一說指當地多沙丘，形狀似「畚」箕而得名，古文獻中至少留下八種不同的地名解釋版本，至今仍無定論。乾隆15年（1750年），笨港溪（今北港溪）爆發山洪，將原本的笨港街沖毀，", "一分為二：溪南岸稱「笨南港」（簡稱南港，即今嘉義縣新港鄉南港村），溪北岸則稱「笨北港」，簡稱「北港」。其後因漳泉械鬥，漳州人另遷至北港東側的麻園寮居住，形成「新港」聚落（今嘉義新港鄉），這也是台灣「北港在南部、南港在北部」這個常令人困惑的地名謎題由來。北港朝天宮是全台歷史最悠久的媽祖廟之一，每年進香期間吸引數十萬信眾參與，是北港最重要的信仰與觀光資產。"], "quiz": {"q": "關於「北港鎮」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「北港鎮」市集而得名", "北港舊稱笨港，因笨港溪氾濫將街市沖毀分為南北兩岸，北岸稱笨北港，簡稱北港，清代曾有「一府二笨三艋舺」之稱。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！北港舊稱笨港，因笨港溪氾濫將街市沖毀分為南北兩岸，北岸稱笨北港，簡稱北港，清代曾有「一府二笨三艋舺」之稱。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 230, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『古坑鄉』這個地方，是怎麼來的嗎？古坑舊稱庵古坑，一說因移民在坑谷種植菴瓜而得名，一說源自打鐵店主人恩愛故事「尪婆仔坑」，因不雅日治時期改稱庵古坑。", "古坑鄉舊稱「庵古坑」，地名由來流傳兩種說法：第一種說法認為，早期入墾者在坑谷地帶種植一種稱為「菴瓜」的作物，因而以此為地名；第二種說法則帶有民間故事色彩，相傳古時此地住著一對恩愛的打鐵夫婦，其住處因而被稱為「打鐵坑」，因鄉民羨慕這對夫妻鶼鰈情深，又稱此地為「尪婆仔坑」，日治時期官方認為這個稱呼不夠文雅，遂改稱「庵古坑」，", "「庵」字帶有溫暖古窩的意涵。1920年，地方行政改制時進一步簡化為「古坑」，沿用至今。古坑鄉因地處阿里山山脈西麓，海拔落差大、氣候與土壤條件類似巴西頂級咖啡產區，發展出享譽全台的「古坑咖啡」，加上境內知名遊樂園劍湖山世界的加持，讓這個源自坑谷地形與打鐵夫妻傳說的山區鄉鎮，成為雲林縣最具知名度的觀光鄉鎮之一。"], "quiz": {"q": "關於「古坑鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "古坑舊稱庵古坑，一說因移民在坑谷種植菴瓜而得名，一說源自打鐵店主人恩愛故事「尪婆仔坑」，因不雅日治時期改稱庵古坑。"], "correct": 3, "rightFb": "沒錯！古坑舊稱庵古坑，一說因移民在坑谷種植菴瓜而得名，一說源自打鐵店主人恩愛故事「尪婆仔坑」，因不雅日治時期改稱庵古坑。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 231, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『大埤鄉』這個地方，是怎麼來的嗎？大埤舊稱大埤頭，一說因位於荷包連圳埤塘之頭而得名，一說因鄰近明末荷蘭人所建紅毛埤的頭頂位置而得名。", "大埤鄉舊稱「大埤頭」，地名由來主要有兩種說法：第一種說法指出，先民最初建村於灌溉水圳「荷包連圳」蓄水埤塘的源頭附近，這條水圳引倒孔溪之水向西北流向大埤頭匯入，因當地設有埤塘儲水，故稱「大埤頭」；第二種說法則追溯至明末荷蘭統治時期，指荷蘭人曾在大埤西北方興建一座蓄水埤塘「紅毛埤」（台灣民間慣以「紅毛」稱呼荷蘭人），", "而這處聚落恰好位於紅毛埤上游、埤塘頭頂的位置，居民便依此方位稱作「大埤頭庄」。無論何種說法為真，都反映了大埤鄉自清代以來便高度仰賴埤塘蓄水灌溉的農業發展背景。大埤鄉因土壤與氣候條件適宜，是台灣最重要的酸菜（大埤酸菜）產地，享有「酸菜的故鄉」美譽，每年生產的酸菜供應全台大部分市場需求。"], "quiz": {"q": "關於「大埤鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "大埤舊稱大埤頭，一說因位於荷包連圳埤塘之頭而得名，一說因鄰近明末荷蘭人所建紅毛埤的頭頂位置而得名。", "因清代此地盛產某種作物，官府設「大埤鄉」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！大埤舊稱大埤頭，一說因位於荷包連圳埤塘之頭而得名，一說因鄰近明末荷蘭人所建紅毛埤的頭頂位置而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [228, 229, 230, 231]}, {"id": "main-雲林縣-3", "title": "雲林縣．莿桐鄉至林內鄉", "kind": "main", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識雲林縣的幾個地方：莿桐鄉、林內鄉。」", "stops": [{"placeId": 232, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『莿桐鄉』這個地方，是怎麼來的嗎？莿桐原稱莿桐巷，因清康熙年間漢人村莊一巷兩側多莿桐樹而得名，1920年簡化為莿桐。", "莿桐鄉地名由來相對直白，源自當地早期的自然植被景觀：清康熙年間，這一帶已形成漢人聚居的村莊，村內一條主要巷道的兩側恰好種植著大量莿桐樹，先民依此特徵，將這處聚落稱為「莿桐巷」，莿桐是一種樹幹帶刺、春季開紅花的豆科植物，在台灣多地皆有以此命名的地名案例。1920年，日本殖民政府推行地方行政改制，", "將「莿桐巷」簡化為「莿桐」，沿用至今。莿桐鄉地處濁水溪沖積平原，因土壤肥沃、水源充沛，是雲林縣重要的水稻、花生與蔬果產區，境內饒平村（舊稱樹子腳）因客家移民拓墾歷史，也保留部分客家文化痕跡，讓這個因莿桐樹巷得名的平原鄉鎮，兼具農業生產與族群多元的地方特色。"], "quiz": {"q": "關於「莿桐鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「莿桐鄉」市集而得名", "莿桐原稱莿桐巷，因清康熙年間漢人村莊一巷兩側多莿桐樹而得名，1920年簡化為莿桐。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！莿桐原稱莿桐巷，因清康熙年間漢人村莊一巷兩側多莿桐樹而得名，1920年簡化為莿桐。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 233, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『林內鄉』這個地方，是怎麼來的嗎？林內因清朝以前是濃密如蔭的大片林野，閩人鄭萃徘率眾入墾後，因村莊建於森林之內而得名。", "林內鄉地名由來相對單純，這一帶在清代以前是林木蔥鬱、濃密如蔭的原始林野地帶。相傳來自福建漳浦的閩籍移民鄭萃徘，率眾前來此地開墾定居，在乾隆、嘉慶年間因協助平定地方民亂有功，獲得清廷封賞，家族從此在此傳家立業、人丁興旺，聚落人口逐漸集結成莊；由於這座村莊正是建立在原本茂密森林的內部，", "因而得名「林內」。林內鄉地處濁水溪出山口，是灌溉整個雲林平原的重要水利樞紐，境內的濁水溪引水工程與八堡圳系統，長期扮演彰雲平原農業命脈的角色；林內也是通往竹山、鹿谷等南投山區的交通門戶，鄰近的湖本村因螢火蟲生態保育聞名，是雲林縣重要的生態旅遊景點之一。"], "quiz": {"q": "關於「林內鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "林內因清朝以前是濃密如蔭的大片林野，閩人鄭萃徘率眾入墾後，因村莊建於森林之內而得名。", "因清代此地盛產某種作物，官府設「林內鄉」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！林內因清朝以前是濃密如蔭的大片林野，閩人鄭萃徘率眾入墾後，因村莊建於森林之內而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [232, 233]}], "sideQuests": [{"id": "side-雲林縣-1", "title": "雲林縣．二崙鄉至東勢鄉", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識雲林縣的幾個地方：二崙鄉、崙背鄉、麥寮鄉、東勢鄉。」", "stops": [{"placeId": 234, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『二崙鄉』這個地方，是怎麼來的嗎？二崙因聚落建於兩座沙丘（崙）之間而得名，舊稱義崙，因客語「義」與「二」同音而演變成今名。", "二崙鄉地名由來源自其地形特徵：這一帶因河流沖積作用，形成兩座相鄰的沙丘（閩南語稱「崙」），先民在這兩座沙丘之間建立聚落，因而得名「二崙」。二崙鄉境內另有舊稱「義崙」，這與早期入墾此地的客籍移民有關：客家話中「義」與「二」發音十分相近，因而「義崙」與「二崙」兩種寫法一度並存混用，後來才統一定名為「二崙」，", "這種因客語發音相近而產生地名混用現象的案例，在雲林縣崙背、二崙一帶的客家移民聚落中並不罕見。二崙鄉地處濁水溪沖積平原，因土壤肥沃、氣候溫和，是台灣重要的蔬菜與水稻產區，尤其以九層塔、韭菜花等特色蔬菜聞名，境內詔安客家文化保存完整，是雲林縣少數仍保留客家語言與習俗的鄉鎮之一。"], "quiz": {"q": "關於「二崙鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "二崙因聚落建於兩座沙丘（崙）之間而得名，舊稱義崙，因客語「義」與「二」同音而演變成今名。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！二崙因聚落建於兩座沙丘（崙）之間而得名，舊稱義崙，因客語「義」與「二」同音而演變成今名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 235, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『崙背鄉』這個地方，是怎麼來的嗎？崙背因聚落建於一座沙丘背後而得名，先民依沙丘南北兩面分別稱「崙前」「崙背」，本鄉多屬沙丘北側而得名崙背。", "崙背鄉地名由來源自當地沙丘地形的相對位置：開拓先民為躲避強勁的東北季風與洪水侵襲，選擇在地勢較高的沙丘偏南地帶優先定居，隨著人口增加，逐漸以這座沙丘為分界，將沙丘南面已開發的聚落稱為「崙前」，後續移居到沙丘北面的村莊則稱為「崙背」，「崙」即指沙丘，「背」則表示位於沙丘背面之意。由於崙背鄉境內大部分聚落偏屬沙丘北側區域，", "因而以「崙背」作為整個鄉的名稱。崙背鄉與鄰近的二崙鄉同屬雲林縣詔安客家移民的主要聚居地，客家語言與傳統習俗保存相對完整，加上濁水溪沖積帶來的肥沃土壤，是重要的蔬菜與水稻產地，境內每年舉辦的詔安客家文化活動，也讓這個因沙丘地形得名的平原鄉鎮，成為雲林縣客家文化的重要據點。"], "quiz": {"q": "關於「崙背鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「崙背鄉」市集而得名", "崙背因聚落建於一座沙丘背後而得名，先民依沙丘南北兩面分別稱「崙前」「崙背」，本鄉多屬沙丘北側而得名崙背。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！崙背因聚落建於一座沙丘背後而得名，先民依沙丘南北兩面分別稱「崙前」「崙背」，本鄉多屬沙丘北側而得名崙背。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 236, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『麥寮鄉』這個地方，是怎麼來的嗎？麥寮因清代墾殖初期有農民種植小麥、搭建草寮居住而得名。", "麥寮鄉地名由來相對單純直白，據傳清代墾殖初期，先民在這片濱海荒地上試種小麥等雜糧作物，並在田間搭建簡易草寮作為看顧作物與暫時棲身之用，這片以種麥、搭寮為特徵的聚落，因而得名「麥寮」，這種依作物與臨時建物命名地方的方式，在台灣沿海拓墾聚落中相當常見。麥寮鄉地處濁水溪出海口北側，", "因地勢低平、土壤含鹽分較高，早期農業發展條件較為嚴苛，居民多兼營漁業與耐鹽作物種植。1990年代，台塑六輕工業區選定在麥寮鄉外海填海造陸興建，帶動麥寮從傳統農漁業鄉鎮迅速轉型為雲林縣重要的石化工業重鎮，也讓這個源自種麥搭寮拓墾史的濱海鄉鎮，在產業發展上出現戲劇性的轉變。"], "quiz": {"q": "關於「麥寮鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "麥寮因清代墾殖初期有農民種植小麥、搭建草寮居住而得名。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！麥寮因清代墾殖初期有農民種植小麥、搭建草寮居住而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 237, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『東勢鄉』這個地方，是怎麼來的嗎？東勢因黃姓家族遷居於海豐港東側聚落，或因先民從海豐港登陸後在其東方立庄而得名，「勢」取閩南語方位與人旺勢振之意。", "東勢鄉地名由來有兩種說法：其一指出，清乾隆13年（1748年），一支黃姓家族遷入此地，隨著人口增加逐漸形成聚落，居民便以聚落所在的東側部分稱為「東勢厝」；另一說法則認為，早期移民多由「海豐港」（今地名已不存，位於東勢鄉西側沿海）登陸開墾，因這處聚落恰好位於海豐港的東方，", "故稱「東勢」，「勢」字在閩南語中除有方位之意，也隱含著人丁興旺、氣勢振興的吉祥寓意。東勢鄉地處雲林縣沿海平原地帶，因鄰近台西、麥寮等海口鄉鎮，同樣以農漁業為主要經濟活動，境內廣植花生、甘藷等耐旱耐鹽作物，是雲林縣典型的濱海農業鄉鎮之一。"], "quiz": {"q": "關於「東勢鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["東勢因黃姓家族遷居於海豐港東側聚落，或因先民從海豐港登陸後在其東方立庄而得名，「勢」取閩南語方位與人旺勢振之意。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 0, "rightFb": "沒錯！東勢因黃姓家族遷居於海豐港東側聚落，或因先民從海豐港登陸後在其東方立庄而得名，「勢」取閩南語方位與人旺勢振之意。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [234, 235, 236, 237]}, {"id": "side-雲林縣-2", "title": "雲林縣．褒忠鄉至四湖鄉", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識雲林縣的幾個地方：褒忠鄉、台西鄉、元長鄉、四湖鄉。」", "stops": [{"placeId": 238, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『褒忠鄉』這個地方，是怎麼來的嗎？褒忠原稱埔姜崙，因林爽文事件時，當地生員張源懃率鄉勇力抗叛軍有功，獲清廷賜「褒忠」二字為庄名。", "褒忠鄉舊稱「埔姜崙」，因最初移民在遍生埔姜（一種灌木植物）的沙丘（崙）上建立聚落而得名。乾隆51年（1786年）林爽文事件爆發，這場清代台灣規模最大的民變席捲全台，當地一位名為張源懃的生員（秀才），號召鄉勇數千人奮力抵抗叛軍侵擾，堅守鄉里數月之久，屢次擊退林爽文部隊的攻勢，事後更協助官府平定其他地區的動亂。事平之後，", "清廷除了封官獎賞張源懃之外，更特別賜予其居住地「褒忠」二字作為庄名，以表彰當地軍民對朝廷的忠誠貢獻，「埔姜崙」自此改稱「褒忠」。日治時期一度廢除褒忠舊名、恢復原稱埔姜崙，直到台灣光復後，才重新以「褒忠」定為鄉名，沿用至今，是雲林縣少數直接源自清代平亂事蹟、由官方賜名的鄉鎮地名。"], "quiz": {"q": "關於「褒忠鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "褒忠原稱埔姜崙，因林爽文事件時，當地生員張源懃率鄉勇力抗叛軍有功，獲清廷賜「褒忠」二字為庄名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！褒忠原稱埔姜崙，因林爽文事件時，當地生員張源懃率鄉勇力抗叛軍有功，獲清廷賜「褒忠」二字為庄名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 239, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『台西鄉』這個地方，是怎麼來的嗎？台西原稱海口厝，因地處舊虎尾溪出海口而得名，戰後因位於台灣島西側，與台北、台南、台東、台中相對稱而改名台西。", "台西鄉舊稱「海口厝」，這個地名直接描述了當地的地理位置：這一帶地處舊虎尾溪注入台灣海峽的出海口附近，先民依此地形特徵，將聚落稱為「海口厝」，這種以「海口」直接命名濱海聚落的方式，在台灣沿海地區相當普遍。台灣光復後，政府為了行政區劃命名的系統性考量，將原本的「海口厝」改稱為「台西」，取其位處台灣本島西側之意，", "與台北、台南、台東、台中等以方位命名的地名相互對稱、呼應。台西鄉地處濁水溪與北港溪之間的沿海地帶，因地層下陷與海水倒灌問題較為嚴重，加上漁業資源豐富，是雲林縣重要的漁業鄉鎮，台西海口生態園區與夕陽美景，也讓這個源自「海口」地形描述的濱海鄉鎮，發展出獨特的海線觀光魅力。"], "quiz": {"q": "關於「台西鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "台西原稱海口厝，因地處舊虎尾溪出海口而得名，戰後因位於台灣島西側，與台北、台南、台東、台中相對稱而改名台西。"], "correct": 3, "rightFb": "沒錯！台西原稱海口厝，因地處舊虎尾溪出海口而得名，戰後因位於台灣島西側，與台北、台南、台東、台中相對稱而改名台西。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 240, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『元長鄉』這個地方，是怎麼來的嗎？元長因清乾隆年間泉州人傅元掌率眾來此開墾建莊，鄉民感念其恩德，以其名「元掌」為莊名，後因諧音改稱元長。", "元長鄉地名由來直接紀念一位拓墾先驅：清乾隆6年（1741年），來自福建泉州府的傅元掌，率領族人渡海來到這片土地開墾，建立莊社，並熱心為地方公共事務服務，深受居民愛戴。傅元掌去世後，當地鄉民為感念他的開墾恩德與貢獻，便以其本名「元掌」作為莊名，這種直接以拓墾先賢姓名命名地方的案例，在雲林縣境內相當獨特，也反映了移民社會對開拓者的崇敬與紀念。至於「元掌」如何演變為今日的「元長」，", "說法有二：一說純粹是文字訛傳所致；另一說則指清嘉慶年間，當地居民曾協助平亂有功，獲清廷嘉許表揚，因「掌」與「長」發音相近，官方便將地名改為更具吉祥意涵的「元長」。元長鄉地處雲林縣西南沿海平原，是花生、蒜頭等雜糧作物的重要產地。"], "quiz": {"q": "關於「元長鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "元長因清乾隆年間泉州人傅元掌率眾來此開墾建莊，鄉民感念其恩德，以其名「元掌」為莊名，後因諧音改稱元長。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！元長因清乾隆年間泉州人傅元掌率眾來此開墾建莊，鄉民感念其恩德，以其名「元掌」為莊名，後因諧音改稱元長。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 241, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『四湖鄉』這個地方，是怎麼來的嗎？四湖因早期聚落沿境內四個潟湖陸化後遺留的池沼建立而得名。", "四湖鄉地名由來源自當地特殊的海岸地貌演變：這一帶原是台灣西南沿海常見的潟湖地形，隨著漫長歲月的泥沙淤積作用，這些潟湖逐漸陸化萎縮，僅在低窪處遺留下四個較大的淡水池沼，先民依傍這四處池塘建立聚落，因而得名「四湖」，鄰近的口湖、崙後湖、施厝湖等同樣帶有「湖」字的地名，", "都是同一套潟湖陸化過程留下的地形見證。四湖鄉地處雲林縣西南沿海地帶，因地層下陷與海水倒灌問題，加上鄰近的箔子寮漁港，是雲林縣重要的漁業與養殖鄉鎮，境內台灣寢具產業與周邊的花生、蒜頭等雜糧作物，共同構成四湖鄉多元的農漁業經濟樣貌。"], "quiz": {"q": "關於「四湖鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "四湖因早期聚落沿境內四個潟湖陸化後遺留的池沼建立而得名。", "因清代此地盛產某種作物，官府設「四湖鄉」市集而得名"], "correct": 2, "rightFb": "沒錯！四湖因早期聚落沿境內四個潟湖陸化後遺留的池沼建立而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [238, 239, 240, 241]}, {"id": "side-雲林縣-3", "title": "雲林縣．口湖鄉至石榴", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識雲林縣的幾個地方：口湖鄉、水林鄉、劍湖山、石榴。」", "stops": [{"placeId": 242, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『口湖鄉』這個地方，是怎麼來的嗎？口湖原稱烏麻園，因早期遍植烏麻而得名，後因四周魚池廣闊如湖，或因地處四湖等以湖為名的聚落群入口而改稱口湖。", "口湖鄉舊稱「烏麻園」，因早期這片土地上遍植一種稱為「烏麻」的作物而得名。關於後來改稱「口湖」的原因，主要有兩種說法：第一種說法指出，台灣光復後，這一帶因四周遍布廣闊如湖的魚塭養殖池，居民便依此景觀改稱「口湖」；第二種說法則從地理位置著眼，指這處聚落恰好位於四湖、後湖、內湖、施厝湖等一系列以「湖」為名的潟湖陸化聚落群的入口位置，", "因而得名「口湖」。口湖鄉地處雲林縣最西南端的沿海地帶，因地層下陷嚴重，加上1986年韋恩颱風重創當地養殖漁業，造成慘重傷亡，是台灣近代重大天然災害史上的傷痛記憶之一。如今口湖鄉以烏魚子、鰻魚等漁業養殖聞名，成龍濕地生態園區也是雲林縣重要的生態旅遊景點。"], "quiz": {"q": "關於「口湖鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「口湖鄉」市集而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "口湖原稱烏麻園，因早期遍植烏麻而得名，後因四周魚池廣闊如湖，或因地處四湖等以湖為名的聚落群入口而改稱口湖。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！口湖原稱烏麻園，因早期遍植烏麻而得名，後因四周魚池廣闊如湖，或因地處四湖等以湖為名的聚落群入口而改稱口湖。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 243, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『水林鄉』這個地方，是怎麼來的嗎？水林原稱水燦林，因早期是潟湖陸化後多沼澤地，沼澤內水漆樹（水燦）茂生而得名。", "水林鄉舊稱「水燦林」，這個地名描述了當地特殊的植被與地形演變：這一帶原本是台灣西南沿海常見的大片潟湖，隨著長期泥沙淤積而逐漸陸化，形成低窪多沼澤的地貌，沼澤地帶因而茂密生長著一種稱為「水漆」（水燦）的植物，這種植物生長於海泥濕地中，葉片布滿粗毛，觸碰後會引起皮膚腫痛過敏反應，", "與台灣民間俗稱「咬人狗」的植物有相似特性，先民依此特徵，將這片沼澤林地稱為「水燦林」，1920年簡化為「水林」。水林鄉與北港鎮同屬古笨港文化圈範圍，境內的番薯厝聚落更是知名藝人的故鄉，加上蕃薯、花生等雜糧作物種植興盛，是雲林縣沿海平原重要的農業鄉鎮之一。"], "quiz": {"q": "關於「水林鄉」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["水林原稱水燦林，因早期是潟湖陸化後多沼澤地，沼澤內水漆樹（水燦）茂生而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！水林原稱水燦林，因早期是潟湖陸化後多沼澤地，沼澤內水漆樹（水燦）茂生而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 244, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『劍湖山』這個地方，是怎麼來的嗎？劍湖山因山頂天然湖泊相傳鄭成功插劍求水湧泉成湖而得名，湖中原多無尾田螺，故舊稱珠螺湖。", "劍湖山地名源自古坑鄉永光村山頂上一座天然湖泊「劍湖」，關於這座湖的由來，流傳著兩種傳說：一說是玄天上帝出巡遊歷時，不慎將隨身寶劍遺落湖底；另一說則更廣為人知，相傳明鄭時期鄭成功行經此地時，將寶劍插立於大堀頂的台地上，劍拔出後泉水竟汩汩湧出、終年不絕，逐漸匯聚成湖，因而得名「劍湖」，這與台北劍潭、台中劍井等地流傳鄭成功插劍或拋劍的傳說，屬於同一類在台灣各地反覆出現的民族英雄地名附會現象。劍湖湖中原本棲息大量尾部退化的無尾田螺，", "因而又有「珠螺湖」的舊稱；也因湖水清澈見底，另稱「淨水湖」。1986年，企業家陳鏡村選在劍湖山附近的荒山野地開發遊樂園，1988年正式命名「劍湖山世界」對外營業，如今已是中南台灣規模最大的主題樂園之一，讓這座源自鄭成功傳說的山中湖泊，成為雲林縣最知名的觀光地標。"], "quiz": {"q": "關於「劍湖山」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "劍湖山因山頂天然湖泊相傳鄭成功插劍求水湧泉成湖而得名，湖中原多無尾田螺，故舊稱珠螺湖。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！劍湖山因山頂天然湖泊相傳鄭成功插劍求水湧泉成湖而得名，湖中原多無尾田螺，故舊稱珠螺湖。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 245, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『石榴』這個地方，是怎麼來的嗎？石榴班是斗六門出入內山的咽喉要地，地名最早見於清代諸羅縣志「石榴班陂」的水利工程記載，確切語源已難詳考。", "石榴班（今作石榴）是斗六市北側的傳統地域名稱，地名最早見於清代文獻《諸羅縣志》：「石榴班陂，在柴裡社東北，源由阿拔泉溪出，康熙49年（1710年），庄民合築」，可見早在18世紀初，這一帶便已因興建水利埤塘設施而留下「石榴班」的地名記錄，是雲林縣少數自清初沿用至今、未曾更名的古老地名之一。石榴班因地處斗六門進出阿里山內山地帶的咽喉要道，正是今日台3線石榴路的所在位置，", "自古便是交通往來的必經之地，光緒20年（1894年）《雲林縣采訪冊》記載當地已有五百三十戶、一千七百餘丁口，發展成僅次於斗六街本身的重要聚落。至於「石榴」二字的確切語源，究竟是因當地曾遍植石榴樹，或另有他解，文獻中並未明確記載，仍待進一步考證。如今石榴車站是雲林縣境內少數保留完整的鐵道車站建築之一，是鐵道迷造訪雲林時的重要景點。"], "quiz": {"q": "關於「石榴」（雲林縣）這個地名，下列何者才是真正的由來？", "opts": ["石榴班是斗六門出入內山的咽喉要地，地名最早見於清代諸羅縣志「石榴班陂」的水利工程記載，確切語源已難詳考。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「石榴」市集而得名", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！石榴班是斗六門出入內山的咽喉要地，地名最早見於清代諸羅縣志「石榴班陂」的水利工程記載，確切語源已難詳考。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [242, 243, 244, 245]}]}, "嘉義市": {"mainChains": [{"id": "main-嘉義市-1", "title": "嘉義市．西區至檜意森活村", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識嘉義市的幾個地方：西區、檜意森活村。」", "stops": [{"placeId": 247, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『西區』這個地方，是怎麼來的嗎？西區同樣源自嘉義古名「諸羅山」，1982年劃分行政區時，因位於中山路以西、地勢較為平坦而得名西區。", "西區與東區同樣源自「諸羅山」這個嘉義最古老的地名淵源，是1982年嘉義市升格省轄市後，行政區劃分東西兩區時所產生的行政區。西區地勢相對平坦開闊，清代嘉義築城時，城池格局在地圖上俯瞰形似一顆桃子，因而嘉義又有「桃城」的雅稱，這個別稱至今仍常見於地方文史介紹與商家命名之中。西區境內因阿里山森林鐵路的木材運輸與集散功能，", "日治時期發展出繁榮的木材加工產業，林森路一帶當年甚至被稱為「木材街」，木材行、製材工廠林立，帶動嘉義市商業的蓬勃發展，如今西區仍是嘉義市人口最稠密、商業機能最完整的行政區，嘉義火車站與周邊商圈也座落於此。"], "quiz": {"q": "關於「西區」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "西區同樣源自嘉義古名「諸羅山」，1982年劃分行政區時，因位於中山路以西、地勢較為平坦而得名西區。"], "correct": 3, "rightFb": "沒錯！西區同樣源自嘉義古名「諸羅山」，1982年劃分行政區時，因位於中山路以西、地勢較為平坦而得名西區。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 268, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『檜意森活村』這個地方，是怎麼來的嗎？檜意森活村因日治時期興建的官舍建材多取自阿里山檜木而稱「檜町」，是台灣保存最完整的林業宿舍建築群。", "檜意森活村所在的「檜町」，是日治時期因應阿里山林業開發而興建的官方宿舍聚落：1899年阿里山林場開始開發，總督府為運送珍貴的檜木資源，自1906年起興建阿里山森林鐵路，1914年全線通車，起點便設於嘉義市北門驛，木材由此運至嘉義集散加工，帶動嘉義躍升為當時台灣四大都市之一，享有「木材都市」的美稱。營林所自大正3年（1914年）起陸續興建職員宿舍群，因建材大量採用阿里山檜木，整片街區仿若檜木森林，", "因而得名「檜町」，範圍北側為基層職員宿舍、南側則是高級職等官舍，全區占地約3.4公頃，共存留65戶木造建築。戰後由台灣省林務局接收作為員工宿舍，2005年起陸續登錄為嘉義市歷史建築，2007年獲列入行政院振興經濟公共建設計畫，歷經整建修復，2013年以「檜意森活村」之名重新對外開放，成為台灣保存最完整、規模最大的日式林業官舍建築群，也是嘉義市重要的文創觀光景點。"], "quiz": {"q": "關於「檜意森活村」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "檜意森活村因日治時期興建的官舍建材多取自阿里山檜木而稱「檜町」，是台灣保存最完整的林業宿舍建築群。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！檜意森活村因日治時期興建的官舍建材多取自阿里山檜木而稱「檜町」，是台灣保存最完整的林業宿舍建築群。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [247, 268]}], "sideQuests": [{"id": "side-嘉義市-1", "title": "嘉義市．桃仔尾至彌陀路", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識嘉義市的幾個地方：桃仔尾、紅毛井、蘭潭、彌陀路。」", "stops": [{"placeId": 519, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『桃仔尾』這個地方，是怎麼來的嗎？清代嘉義城郊的舊街名，相傳因街尾一帶早期遍植桃樹而得名。", "桃仔尾與嘉義另一個廣為流傳的別稱「桃城」其實同出一源：清代嘉義築城時，城牆格局在地圖上俯瞰宛如一顆桃子的形狀，城池尾端收窄之處恰好對應街尾這片區域，因當地又遍植桃樹，居民便稱此地為「桃仔尾」，意指桃形城池的尾端地帶，而整座城池則因此獲得「桃城」的雅稱，這個別稱至今仍廣泛出現在嘉義的商家字號、糕餅名產與地方文史介紹中，", "例如知名的「桃城」系列伴手禮品牌，便是直接沿用這段清代城池形狀命名典故。桃仔尾所在的街區，清代是嘉義城郊的邊緣地帶，隨著城市發展逐漸融入嘉義市區範圍，如今雖已鮮少作為正式地名使用，但透過「桃城」這個文化符號，桃仔尾當年的城郭意象仍持續在嘉義的地方認同中流傳不輟。"], "quiz": {"q": "關於「桃仔尾」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["清代嘉義城郊的舊街名，相傳因街尾一帶早期遍植桃樹而得名。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因清代此地盛產某種作物，官府設「桃仔尾」市集而得名"], "correct": 0, "rightFb": "沒錯！清代嘉義城郊的舊街名，相傳因街尾一帶早期遍植桃樹而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 523, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『紅毛井』這個地方，是怎麼來的嗎？紅毛井為荷蘭人1657年在諸羅山社聚落中心開鑿的水井，因水質甘美列入諸羅八景「蘭井泉甘」，是嘉義市現存最古老的古蹟。", "紅毛井又稱蘭井，是荷蘭聯合東印度公司於1657年在諸羅山社聚落中心「中央廣場」開鑿的水井，當時荷蘭政務員與牧師已進駐此地治理傳教多年，因派駐人員日增，遂鑿此大井供應飲水需求。台灣民間慣以「紅毛」稱呼荷蘭人，故稱「紅毛井」。明鄭時期，鎮守諸羅山的部將吳智武曾加以整修；清乾隆27年（1762年），諸羅知縣衛克堉因井水甘美冠於全縣，", "以「蘭井泉甘」之名列入「諸羅八景」，附近街道也因此得名「蘭井街」。日治時期水質逐漸惡化，官署甚至張貼「不適飲用」告示，1928年一度遭磚石填塞荒廢，直到民國59年（1970年）嘉義市長許世賢重修此井並立碑紀念。紅毛井是嘉義市內留存最久的古蹟，2008年公告為歷史建築，見證了諸羅山從荷治聚落發展至今的三百餘年歷史。"], "quiz": {"q": "關於「紅毛井」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "紅毛井為荷蘭人1657年在諸羅山社聚落中心開鑿的水井，因水質甘美列入諸羅八景「蘭井泉甘」，是嘉義市現存最古老的古蹟。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！紅毛井為荷蘭人1657年在諸羅山社聚落中心開鑿的水井，因水質甘美列入諸羅八景「蘭井泉甘」，是嘉義市現存最古老的古蹟。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 524, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『蘭潭』這個地方，是怎麼來的嗎？蘭潭古稱紅毛埤，相傳為荷蘭人所鑿的埤塘，1942年整治為水庫，「蘭潭泛月」是諸羅八景之一，是嘉義市重要的水源地與觀光勝地。", "蘭潭位於嘉義市東郊山仔頂，古稱「紅毛埤」，相傳荷蘭統治時期，為確保灌溉水源穩定，在八掌溪上游築堰壩截流成埤，灌溉附近的「王田」，因漢人稱荷蘭人為「紅毛」而得名；此後清康熙34年（1695年），當地漢人與諸羅山社合作另築「番仔陂」（今北香湖公園），與紅毛埤分屬不同水利系統。日治昭和年間，因嘉義市民生用水激增，加上台灣拓殖株式會社設立的嘉義化學工場需要大量工業用水，", "遂於1942年在紅毛埤原址興建水庫，1944年完工，因潭水清澈、名稱典雅而改稱「蘭潭」，「蘭潭泛月」的皎潔夜色更被列入諸羅八景之一。如今蘭潭仍是嘉義地區自來水的主要供應源，環潭步道、蘭潭後山公園與藝術裝置「月影潭心」，讓蘭潭成為嘉義市民假日休閒的重要去處，也是嘉義大學鄰近的地標水域。"], "quiz": {"q": "關於「蘭潭」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "蘭潭古稱紅毛埤，相傳為荷蘭人所鑿的埤塘，1942年整治為水庫，「蘭潭泛月」是諸羅八景之一，是嘉義市重要的水源地與觀光勝地。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！蘭潭古稱紅毛埤，相傳為荷蘭人所鑿的埤塘，1942年整治為水庫，「蘭潭泛月」是諸羅八景之一，是嘉義市重要的水源地與觀光勝地。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 553, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『彌陀路』這個地方，是怎麼來的嗎？彌陀路因路底座落清乾隆17年創建的彌陀禪寺而得名，寺前八掌溪畔的「彌陀晨鐘」自日治時期起即列名嘉義八景，是嘉義市歷史最悠久的古剎之一。", "彌陀路地名由來，直接取自路底座落的一座嘉義市歷史最悠久的佛寺「彌陀禪寺」（又稱彌陀寺）：清乾隆17年（1752年），福建漳州府平和縣僧侶苑藏前來諸羅城南、八掌溪畔募建寺院，是彌陀禪寺創建之始，此後歷經乾隆37年、道光年間、明治42年（1909年）、昭和17年（1942年）等多次修建，大殿至今仍保留傳統閩南寺廟的建築風格。彌陀禪寺前臨八掌溪，溪畔早年設有義渡口，方便嘉義與台南之間往來，", "道光27年（1847年）地方仕紳集資購田收租，以租金聘僱船夫免費擺渡行旅，後人立碑紀念，這座「八掌溪義渡碑」如今已列為嘉義市三級古蹟；寺前吊橋因遠望白鷺凌空飛越溪面，又有「鷺橋觀浪」的雅稱。民國37年（1948年）與84年（1995年）兩度評選的嘉義八景，「彌陀晨鐘」皆雙雙入列，是嘉義八景中唯一的宗教類景觀，彌陀路也因這座古剎而得名，沿用至今。"], "quiz": {"q": "關於「彌陀路」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "彌陀路因路底座落清乾隆17年創建的彌陀禪寺而得名，寺前八掌溪畔的「彌陀晨鐘」自日治時期起即列名嘉義八景，是嘉義市歷史最悠久的古剎之一。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！彌陀路因路底座落清乾隆17年創建的彌陀禪寺而得名，寺前八掌溪畔的「彌陀晨鐘」自日治時期起即列名嘉義八景，是嘉義市歷史最悠久的古剎之一。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [519, 523, 524, 553]}, {"id": "side-嘉義市-2", "title": "嘉義市．嘉義舊監獄至嘉義公園", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識嘉義市的幾個地方：嘉義舊監獄、射日塔、北門驛、嘉義公園。」", "stops": [{"placeId": 554, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『嘉義舊監獄』這個地方，是怎麼來的嗎？嘉義舊監獄興建於日治大正8年（1919年），原稱「台南刑務所嘉義支所」，是目前全世界僅存兩座「賓夕凡尼亞式」放射狀監獄建築之一，如今轉型為獄政博物館。", "嘉義舊監獄興建於日治大正8年（1919年），歷時三年，於大正11年（1922年）竣工啟用，最初名稱為「台南刑務所嘉義支所」，承擔嘉義地區的司法矯正功能，民國83年因監獄遷至嘉義縣鹿草鄉而功成身退，原址因而閒置。這座監獄最珍貴之處，在於其建築工法完整採用18世紀末源自美國賓夕凡尼亞州的「賓夕凡尼亞式」放射狀監獄設計：獄方只需站在中央台，便能透過呈放射狀排列的走道，同時監看智舍、仁舍、勇舍等各分館的舍房動態，是極具效率的獄政管理建築典範，", "目前全世界僅存兩座這種形制的監獄，除嘉義舊監獄外，另一座位於日本北海道的網走監獄，兩者皆已轉型為對外開放的觀光景點。嘉義舊監獄於民國91年（2002年）公告為市定古蹟，94年（2005年）升格國定古蹟，歷經修復後於2011年以「獄政博物館」之姿重新對外開放，館內完整保留牢房、探監室、典獄長辦公室等空間，並展示各地監獄的技能訓練與更生輔導成果，是全台唯一可供民眾自由參觀的監獄建築。"], "quiz": {"q": "關於「嘉義舊監獄」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "嘉義舊監獄興建於日治大正8年（1919年），原稱「台南刑務所嘉義支所」，是目前全世界僅存兩座「賓夕凡尼亞式」放射狀監獄建築之一，如今轉型為獄政博物館。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！嘉義舊監獄興建於日治大正8年（1919年），原稱「台南刑務所嘉義支所」，是目前全世界僅存兩座「賓夕凡尼亞式」放射狀監獄建築之一，如今轉型為獄政博物館。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 558, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『射日塔』這個地方，是怎麼來的嗎？射日塔塔名取自台灣原住民「射日神話」，原址為日治時期嘉義神社本殿、戰後改建忠烈祠，1994年遭祝融焚毀後重建為塔，是嘉義市地標。", "射日塔位於嘉義公園內「山仔頂」一帶，塔址原是台灣原住民平埔族的祭壇所在，日治時期在此興建第二代「嘉義神社」本殿，戰後神社改建為嘉義市忠烈祠，直到1994年遭祝融之災焚毀。嘉義市政府原本計畫在公園內分別重建忠烈祠與新建高塔，卻因經費不足，最終變更設計，將兩項工程合而為一、共用結構體與基礎，由成功大學建築系林憲德教授與卓建光建築師規劃設計，1998年完工。「射日塔」之名取自台灣原住民流傳的「射日神話」：相傳古代天上有兩個太陽輪流出沒，", "酷熱難耐、河川乾涸，勇士們遂遠征射日，歷經世代傳承終於成功，這則神話蘊含繼往開來的傳承精神。塔身高62公尺、共12層，褐色鋁條紋理取材自阿里山神木外皮，中央留有高40公尺的「一線天」，彷彿被劈開的神木，內部懸掛仿剪紙藝術的巨型青銅雕刻描繪射日傳說；入口處立有象徵台灣守護神的雲豹銅雕，底層為忠烈祠、頂層設觀景咖啡廳，是嘉義市最具代表性的現代地標。"], "quiz": {"q": "關於「射日塔」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "射日塔塔名取自台灣原住民「射日神話」，原址為日治時期嘉義神社本殿、戰後改建忠烈祠，1994年遭祝融焚毀後重建為塔，是嘉義市地標。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「射日塔」市集而得名"], "correct": 1, "rightFb": "沒錯！射日塔塔名取自台灣原住民「射日神話」，原址為日治時期嘉義神社本殿、戰後改建忠烈祠，1994年遭祝融焚毀後重建為塔，是嘉義市地標。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 559, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『北門驛』這個地方，是怎麼來的嗎？北門驛是阿里山森林鐵路的起點車站，1912年落成，因位於清代諸羅城北門外而得名，是台灣林業運輸史上最重要的木造車站。", "北門驛因座落於清代諸羅城（嘉義古城）北門城外一帶而得名，「驛」則是日治時期對火車站的稱呼。1899年，日本政府發現阿里山蘊藏豐富的檜木資源，1906年起著手興建阿里山森林鐵路，1912年全線通車，北門驛正式落成啟用，成為這條鐵路的起點站與營林所辦公廳舍所在地。當年阿里山砍伐的檜木，皆須經由森林鐵路運抵北門驛集散，再轉運至嘉義製材所加工，使嘉義迅速躍升為台灣重要的「木材都市」，", "全盛時期林森路一帶木材行林立，被稱為「木材街」。北門驛站體採用阿里山檜木建造，是台灣現存最具代表性的木造車站之一，1998年曾遭祝融損毀，經修復後於2001年重新啟用，現已列為嘉義市市定古蹟。如今北門驛周邊串連檜意森活村、嘉義製材所等林業遺產，共同構成完整的阿里山林業文化聚落，見證嘉義與阿里山檜木百年來密不可分的產業淵源。"], "quiz": {"q": "關於「北門驛」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "北門驛是阿里山森林鐵路的起點車站，1912年落成，因位於清代諸羅城北門外而得名，是台灣林業運輸史上最重要的木造車站。"], "correct": 3, "rightFb": "沒錯！北門驛是阿里山森林鐵路的起點車站，1912年落成，因位於清代諸羅城北門外而得名，是台灣林業運輸史上最重要的木造車站。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 565, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『嘉義公園』這個地方，是怎麼來的嗎？嘉義公園座落於「山仔頂」丘陵地帶，因地勢高於市區而得名，日治明治43年（1910年）闢建，是台灣歷史最悠久的公園之一，園內史蹟遍布。", "嘉義公園座落於嘉義市東側俗稱「山仔頂」的丘陵地帶，因地勢相對高於市區平原而得名，日治明治43年（1910年）正式闢建，是台灣現存歷史最悠久的都市公園之一。園區佔地遼闊、古木參天，最特別的是園內史蹟密度極高，走一圈彷彿經歷一趟台灣史：有紀念清廷平定林爽文事件的「福康安紀功碑」、嘉慶年間的十二門清代古砲、全台第一座地震紀念碑「丙午烈震紀念碑」（記錄1906年梅山大地震）、紀念國共內戰一江山戰役的紀念碑、畫家陳澄波的畫架雕塑，", "以及國寶級的阿里山森林鐵道21號蒸汽火車頭。日治時期在此興建的嘉義神社雖已不存，社務所與齋館仍完整保留，現作為「嘉義市史蹟資料館」（昭和十八）使用，周邊石燈籠、狛犬、手水舍等附屬建物亦散布其間。加上1998年落成的射日塔與嘉義市孔廟，讓嘉義公園成為集自然綠意、歷史記憶與文化展演於一身的城市核心場域。"], "quiz": {"q": "關於「嘉義公園」（嘉義市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "嘉義公園座落於「山仔頂」丘陵地帶，因地勢高於市區而得名，日治明治43年（1910年）闢建，是台灣歷史最悠久的公園之一，園內史蹟遍布。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 2, "rightFb": "沒錯！嘉義公園座落於「山仔頂」丘陵地帶，因地勢高於市區而得名，日治明治43年（1910年）闢建，是台灣歷史最悠久的公園之一，園內史蹟遍布。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [554, 558, 559, 565]}]}, "嘉義縣": {"mainChains": [{"id": "main-嘉義縣-1", "title": "嘉義縣．太保市至大林鎮", "kind": "main", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識嘉義縣的幾個地方：太保市、朴子市、布袋鎮、大林鎮。」", "stops": [{"placeId": 248, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『太保市』這個地方，是怎麼來的嗎？太保原稱溝尾庄，因清代武將王得祿平定林爽文、蔡牽有功，獲封「太子太保」而得名，是嘉義縣政府所在地。", "太保市舊稱「溝尾庄」，是清代台籍官員中官位最高者王得祿的故鄉。王得祿生於乾隆35年（1770年），十七歲時林爽文事件爆發，他主動率眾五百人擔任聯絡官，其後參與五十九次戰鬥而嶄露頭角；嘉慶年間又協助平定海盜蔡牽，屢建戰功，官拜浙江提督；道光18年（1838年）返台後，清廷加封他「太子太保」銜，是清代台灣本土出身、武將位階最高的一人，", "逝後更追贈伯爵、太子太師銜。鄉民為感念這位鄉賢的殊榮，將他的出生地「溝尾庄」改稱「太保庄」，「太保」二字自此成為地名，與坊間戲稱不良少年的「太保」用語純屬巧合，並無關聯。民國80年（1991年），因嘉義縣政府遷至此地，太保鄉升格為縣轄市，如今是嘉義縣的行政中心，境內並設有故宮南院。"], "quiz": {"q": "關於「太保市」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "太保原稱溝尾庄，因清代武將王得祿平定林爽文、蔡牽有功，獲封「太子太保」而得名，是嘉義縣政府所在地。"], "correct": 3, "rightFb": "沒錯！太保原稱溝尾庄，因清代武將王得祿平定林爽文、蔡牽有功，獲封「太子太保」而得名，是嘉義縣政府所在地。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 249, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『朴子市』這個地方，是怎麼來的嗎？朴子舊稱朴仔腳，相傳康熙年間信眾迎請媽祖神像返鄉途中，在牛稠溪畔一棵朴子樹下休息，因而在樹下建廟供奉，聚落因此得名。", "朴子舊稱「朴仔腳」，這個地名源自一段媽祖信仰的傳說：康熙26年（1687年），半月庄人林馬自鹿港恭請媽祖神像返家奉祀，途經牛稠溪（今朴子溪）南畔時，在一棵朴子樹下稍作休息，沒想到附近居民聞訊而來，紛紛請求讓媽祖神像暫留供人膜拜，此後信眾便在這棵朴子樹下建廟安奉，地方也因這株神蹟樹木而得名「朴仔腳」，", "意指朴子樹下之地，後簡化為「朴子」。這座因媽祖駐蹕而生的廟宇，日後發展成香火鼎盛的配天宮，是朴子的信仰中心，也讓朴子市與媽祖信仰的淵源，比多數台灣媽祖廟的建廟故事更增添了幾分機緣巧合的色彩。朴子市因地處嘉南平原西側，是嘉義縣西部重要的行政與商業中心，嘉義縣議會即設於此。"], "quiz": {"q": "關於「朴子市」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "朴子舊稱朴仔腳，相傳康熙年間信眾迎請媽祖神像返鄉途中，在牛稠溪畔一棵朴子樹下休息，因而在樹下建廟供奉，聚落因此得名。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！朴子舊稱朴仔腳，相傳康熙年間信眾迎請媽祖神像返鄉途中，在牛稠溪畔一棵朴子樹下休息，因而在樹下建廟供奉，聚落因此得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 250, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『布袋鎮』這個地方，是怎麼來的嗎？布袋舊稱布袋嘴，因地形位於一處內灣北岸突出的尖嘴狀沙洲上，遠望形似布袋開口而得名，另有蚊港、松仔港等舊稱。", "布袋地名由來與其獨特的海岸地形有關：這一帶地處鹽水溪出海口北側，外圍環繞著沙嘴地形，深居潟湖之內，整體輪廓神似一只布袋，因而得名「布袋嘴」，「嘴」指沙洲向海突出的尖端部位。布袋在歷史上還曾有多個不同稱呼：因台灣與廈門之間的航運以布袋為捷徑，加上附近海水浴場一帶松樹蒼鬱，曾稱「松仔港」；又因港邊蚊蟲肆虐，", "夏季風平浪靜時更為猖獗，也曾被稱為「蚊港」；日治時期地方士紳更取佛教七福神中「布袋和尚」的雅號，延用「布袋」之名至今，文人雅士則稱之為「岱江」。布袋因優良的潟湖地形，自清代以來便是重要的曬鹽產地與漁港，如今以布袋鹽田生態、新鮮海產與嘉義布袋往返澎湖的客輪航線聞名，是嘉義縣濱海觀光的重要門戶。"], "quiz": {"q": "關於「布袋鎮」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["布袋舊稱布袋嘴，因地形位於一處內灣北岸突出的尖嘴狀沙洲上，遠望形似布袋開口而得名，另有蚊港、松仔港等舊稱。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 0, "rightFb": "沒錯！布袋舊稱布袋嘴，因地形位於一處內灣北岸突出的尖嘴狀沙洲上，遠望形似布袋開口而得名，另有蚊港、松仔港等舊稱。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 251, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『大林鎮』這個地方，是怎麼來的嗎？大林舊稱大莆林，因開墾之初是一片廣大的森林地帶而得名，另一說指移民多來自廣東潮州府大埔之林地。", "大林舊稱「大莆林」，地名由來主要有兩種說法：第一種說法認為，這一帶在漢人拓墾之初，原是一片範圍廣大的森林地帶，先民依此景觀特徵，稱之為「大莆林」，意指大片的森林；第二種說法則從移民原鄉出發，指出當地部分先民是來自廣東潮州府大埔縣「林地」一帶的客家移民，將原鄉地名與新墾地結合而成「大莆林」。1920年，", "日本殖民政府推行地方行政改制，將「大莆林」簡化為「大林」，沿用至今。大林鎮因地處嘉南平原與阿里山山區交界的緩坡地帶，土壤與氣候條件適合鳳梨與稻米種植，加上大林糖廠的設立，日治至戰後初期曾是嘉義地區重要的製糖重鎮，如今雖已停止製糖，舊廠區與周邊的鳳梨田景觀，仍是大林鎮重要的農業與工業歷史記憶。"], "quiz": {"q": "關於「大林鎮」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "大林舊稱大莆林，因開墾之初是一片廣大的森林地帶而得名，另一說指移民多來自廣東潮州府大埔之林地。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！大林舊稱大莆林，因開墾之初是一片廣大的森林地帶而得名，另一說指移民多來自廣東潮州府大埔之林地。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [248, 249, 250, 251]}, {"id": "main-嘉義縣-2", "title": "嘉義縣．民雄鄉至六腳鄉", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識嘉義縣的幾個地方：民雄鄉、溪口鄉、新港鄉、六腳鄉。」", "stops": [{"placeId": 252, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『民雄鄉』這個地方，是怎麼來的嗎？民雄舊稱打貓，源自平埔族洪雅族「打貓社」音譯，1920年因日語近音「民雄」（Tamio）較為文雅而改名。", "民雄舊稱「打貓」，源自平埔族洪雅族「打貓社」的社名音譯，是漢人尚未大規模入墾前，這片區域原住民聚落的所在地。1920年，日本殖民政府推行地方行政改制，考量「打貓」二字的台語發音，與日語中「民雄」（讀作Tamio）的發音頗為相近，加上「民雄」二字字面意涵較為正面吉祥，遂以此取代原本的「打貓」，這與高雄舊稱「打狗」被改為日語同音的「高雄」（Takao），", "屬於同一波日治時期「以雅音同化不雅地名」的地名政策案例。民雄鄉境內因舊時打貓社範圍廣闊，衍生出頂菜園、大丘園等多個舊地名；境內廣播電台密集設置的「民雄放送所」，以及以老鷹咖啡莊園聞名的鴨母寮，讓這個承載平埔族記憶的地名，同時發展出廣播文化與觀光農業的多元面貌，民雄鵝肉更是全台知名的地方美食。"], "quiz": {"q": "關於「民雄鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["民雄舊稱打貓，源自平埔族洪雅族「打貓社」音譯，1920年因日語近音「民雄」（Tamio）較為文雅而改名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 0, "rightFb": "沒錯！民雄舊稱打貓，源自平埔族洪雅族「打貓社」音譯，1920年因日語近音「民雄」（Tamio）較為文雅而改名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 253, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『溪口鄉』這個地方，是怎麼來的嗎？溪口舊稱雙溪口，因聚落建於石龜溪與三疊溪兩條溪流的匯合處而得名。", "溪口鄉地名由來源自其所在的河川匯流位置：這處聚落座落於石龜溪與三疊溪兩條溪流交會之處，先民依此地形特徵，將此地稱為「雙溪口」，意指兩溪匯合的口岸，後簡化為「溪口」，沿用至今，這種依溪流交會點命名地方的方式，在台灣各地相當常見。溪口鄉地處嘉南平原核心地帶，", "因濁水溪沖積帶來的肥沃土壤，加上灌溉水源充足，自清代以來便是重要的農業聚落，如今以稻米、蒜頭等農產聞名，是嘉義縣典型的平原農業鄉鎮之一，境內的五通宮等地方廟宇，也是居民重要的信仰中心。"], "quiz": {"q": "關於「溪口鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["溪口舊稱雙溪口，因聚落建於石龜溪與三疊溪兩條溪流的匯合處而得名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！溪口舊稱雙溪口，因聚落建於石龜溪與三疊溪兩條溪流的匯合處而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 254, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『新港鄉』這個地方，是怎麼來的嗎？新港因笨港遭洪水沖毀後，居民遷此另闢新港口而得名，原稱麻園寮，因早期遍植胡麻而得名。", "新港鄉地名由來，與清代笨港的一段水患遷徙史密切相關：這一帶原稱「麻園寮」，因乾隆初年當地遍地種植胡麻而得名。乾隆年間，原本聚居於笨南港的大批漳州移民，因笨港溪（今北港溪）氾濫沖毀街市，加上漳泉械鬥的威脅，被迫遷居至此另闢新的港口市街，久而久之發展成繁榮大鎮，因而得名「新港」；因與笨港淵源深厚，也曾稱「笨新港」，", "後因「笨」字不雅而僅稱「新港」。新港鄉境內的奉天宮，供奉的媽祖神像相傳與北港朝天宮同源，是嘉義地區香火鼎盛的媽祖信仰中心之一，每年與北港朝天宮之間仍保有密切的宗教文化交流，新港鄉也是知名文學家、雲門舞集創辦人林懷民的故鄉，「新港文教基金會」推動的社區營造，更讓新港成為台灣社區總體營造的重要典範。"], "quiz": {"q": "關於「新港鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["新港因笨港遭洪水沖毀後，居民遷此另闢新港口而得名，原稱麻園寮，因早期遍植胡麻而得名。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！新港因笨港遭洪水沖毀後，居民遷此另闢新港口而得名，原稱麻園寮，因早期遍植胡麻而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 255, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『六腳鄉』這個地方，是怎麼來的嗎？六腳原名六家佃，相傳明永曆年間陳士政等人招募六戶佃農入墾而得名，「家」與「腳」台語發音相近而轉為六腳。", "六腳鄉舊稱「六家佃」，相傳明永曆8年（1654年）閩籍漳州龍溪縣人陳士政等墾首，招募六戶佃農前來此地開墾，因而以「六家佃」為地名，其中「家」與「腳」在台語發音上十分相近，附近居民逐漸以諧音稱之為「六腳佃」，後簡化為「六腳」，沿用至今。六腳鄉地處嘉南平原西側，", "境內雙涵村保存的王得祿墓園，是全台規模數一數二的清代名墓，墓園周遭仍留有石翁仲、石馬、石羊、石虎等清代石刻，已列為國家一級古蹟，見證了太保市名人王得祿身後長眠於此的歷史淵源。六腳鄉因土壤肥沃，是嘉義縣重要的水稻與蔬果產區。"], "quiz": {"q": "關於「六腳鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["六腳原名六家佃，相傳明永曆年間陳士政等人招募六戶佃農入墾而得名，「家」與「腳」台語發音相近而轉為六腳。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！六腳原名六家佃，相傳明永曆年間陳士政等人招募六戶佃農入墾而得名，「家」與「腳」台語發音相近而轉為六腳。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [252, 253, 254, 255]}, {"id": "main-嘉義縣-3", "title": "嘉義縣．東石鄉至鹿草鄉", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識嘉義縣的幾個地方：東石鄉、義竹鄉、鹿草鄉。」", "stops": [{"placeId": 256, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『東石鄉』這個地方，是怎麼來的嗎？東石因清嘉慶末年福建泉州府晉江縣東石鎮的移民渡海來此，將故鄉地名移植於新墾漁村而得名。", "東石鄉地名由來，是台灣地名中「移民懷鄉命名」的典型案例：清嘉慶末年，來自福建泉州府晉江縣東石鎮的移民渡海來到這片沿海地帶，見當地地形與物產條件適合開闢魚塭、養殖牡蠣維生，便決定在此落腳定居，並將故鄉「東石」的地名直接移植到這處新開闢的漁村，藉此寄託對原鄉的思念之情，這種將原鄉地名複製到台灣新墾地的命名方式，", "也出現在雲南、大埔等地名的由來之中。東石鄉地處北港溪出海口南側，因潟湖與潮間帶地形發達，是台灣重要的牡蠣（蚵仔）養殖產地，享有「東石蚵」的美譽，加上東石漁人碼頭的觀光開發，讓這個承載泉州移民鄉愁的地名，發展成嘉義縣濱海漁業與觀光並重的重鎮。"], "quiz": {"q": "關於「東石鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["東石因清嘉慶末年福建泉州府晉江縣東石鎮的移民渡海來此，將故鄉地名移植於新墾漁村而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「東石鄉」市集而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 0, "rightFb": "沒錯！東石因清嘉慶末年福建泉州府晉江縣東石鎮的移民渡海來此，將故鄉地名移植於新墾漁村而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 257, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『義竹鄉』這個地方，是怎麼來的嗎？義竹原稱二竹圍，因是先民依序興建的第二座環植竹樹防禦聚落而得名，第一座稱頭竹圍。", "義竹鄉舊稱「二竹圍」，這個地名反映了清代沿海聚落防禦強風與盜匪的建村方式：這一帶因地處濱海地帶，冬季東北季風強勁，加上治安風險，先民習慣在聚落四周環植竹林作為防風、禦盜的天然屏障，稱為「竹圍」。這片區域最初建立的竹圍聚落稱為「頭竹圍」，隨後在其西南方另建的第二座竹圍聚落，", "便依序稱為「二竹圍」，後來才改稱較具正面意涵的「義竹圍」，簡化為「義竹」，沿用至今。義竹鄉地處嘉義縣最南端，因濱海地勢低窪，是嘉義縣重要的水稻、豆類與果蔗（可生食甘蔗）產地，境內的過路店、六桂等聚落，仍延續著清代竹圍防禦聚落一脈相承的拓墾記憶。"], "quiz": {"q": "關於「義竹鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「義竹鄉」市集而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "義竹原稱二竹圍，因是先民依序興建的第二座環植竹樹防禦聚落而得名，第一座稱頭竹圍。"], "correct": 3, "rightFb": "沒錯！義竹原稱二竹圍，因是先民依序興建的第二座環植竹樹防禦聚落而得名，第一座稱頭竹圍。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 258, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『鹿草鄉』這個地方，是怎麼來的嗎？鹿草原稱鹿仔草，因早期此地遍生一種鹿群喜食的植物「鹿仔草」（楮樹）而得名。", "鹿草鄉地名由來相當寫實：清代《臺灣府志》記載「鹿仔草即楮樹也，以其枝葉為鹿所嗜，因名之」，說明這一帶早期廣泛生長著楮樹，因其枝葉是野生梅花鹿群偏好的食物來源，先民便依此植物特徵，將此地稱為「鹿仔草」，1920年簡化為「鹿草」，沿用至今，這也從側面印證了清代嘉南平原一帶野生鹿群數量豐富、與台灣早期鹿皮貿易興盛的歷史背景相互呼應。鹿草鄉地處嘉南平原核心地帶，", "因土壤肥沃、水源充足，是嘉義縣重要的水稻與豆類產地，境內的圈仔內、後厝等聚落，仍保留著典型嘉南平原農村的聚落景觀與生活型態。"], "quiz": {"q": "關於「鹿草鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "鹿草原稱鹿仔草，因早期此地遍生一種鹿群喜食的植物「鹿仔草」（楮樹）而得名。", "因清代此地盛產某種作物，官府設「鹿草鄉」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！鹿草原稱鹿仔草，因早期此地遍生一種鹿群喜食的植物「鹿仔草」（楮樹）而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [256, 257, 258]}], "sideQuests": [{"id": "side-嘉義縣-1", "title": "嘉義縣．水上鄉至梅山鄉", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識嘉義縣的幾個地方：水上鄉、中埔鄉、竹崎鄉、梅山鄉。」", "stops": [{"placeId": 259, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『水上鄉』這個地方，是怎麼來的嗎？水上舊稱水堀頭，因地處灌溉水圳的源頭而得名，日治後依原意雅化為水上，意指位於水圳上源地帶。", "水上鄉舊稱「水堀頭」，這個地名直接描述了當地的水利地形特徵：這一帶恰好位於嘉南平原重要灌溉水圳的源頭處，「堀」意指水流匯聚或引水的坑窪之地，先民依此水利樞紐的地理位置，將此地稱為「水堀頭」。1920年，日本殖民政府推行地方行政改制，依循原本地名「位於水圳源頭」的意涵，", "將其雅化為「水上」，意指這處聚落位居水圳上游源頭地帶，沿用至今。水上鄉因地處嘉義市南側，是嘉義縣重要的交通門戶，境內設有嘉義機場與高鐵嘉義站，加上南靖糖廠（原稱蒜頭糖廠系統之一）等日治糖業設施舊址，讓水上鄉兼具傳統水利農業聚落與現代交通樞紐的雙重面貌。"], "quiz": {"q": "關於「水上鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「水上鄉」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "水上舊稱水堀頭，因地處灌溉水圳的源頭而得名，日治後依原意雅化為水上，意指位於水圳上源地帶。"], "correct": 3, "rightFb": "沒錯！水上舊稱水堀頭，因地處灌溉水圳的源頭而得名，日治後依原意雅化為水上，意指位於水圳上源地帶。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 260, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『中埔鄉』這個地方，是怎麼來的嗎？中埔因位處南南東方的頂埔與東北方竹崎鄉內埔的相對位置中央而得名，「埔」意指未開墾的荒地。", "中埔鄉地名由來源自清代拓墾聚落間的相對地理位置：「埔」字在閩南語中泛指尚未開墾的平坦荒地，中埔鄉恰好座落於南南東方的「頂埔」與東北方竹崎鄉境內「內埔」兩處埔地之間的中央位置，先民依此相對方位，將此地稱為「中埔」，這種依鄰近聚落相對位置命名地方的方式，", "反映了清代拓墾範圍逐步擴展、需要以既有地名為參照座標的普遍作法。中埔鄉地處嘉義縣東側丘陵與平原交界地帶，因氣候與土壤條件適宜，是知名的柿子（牛心柿）與冬筍產地，境內的觸口自然生態教育館與獼猴生態園區，是嘉義縣通往阿里山公路沿線重要的生態旅遊據點。"], "quiz": {"q": "關於「中埔鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["中埔因位處南南東方的頂埔與東北方竹崎鄉內埔的相對位置中央而得名，「埔」意指未開墾的荒地。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！中埔因位處南南東方的頂埔與東北方竹崎鄉內埔的相對位置中央而得名，「埔」意指未開墾的荒地。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 261, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『竹崎鄉』這個地方，是怎麼來的嗎？竹崎原稱竹頭崎庄，因全鄉多山坡地形，早期竹林遍布，砍伐開墾後遍地留存竹頭而得名。", "竹崎鄉地名由來相當直白：這一帶因地勢多屬丘陵山坡地形，早期竹林茂密叢生，先民入墾時大規模砍伐竹林、開闢為可耕作的坡地，砍伐後的坡地上遍布著大量竹頭殘株，因而得名「竹頭崎庄」，1920年簡化為「竹崎」，沿用至今。竹崎鄉地處嘉義縣通往阿里山的必經要道，", "境內海拔落差極大，從平原一路爬升至高山地帶，是阿里山森林鐵路行經的重要中繼站，也是知名景點奮起湖、太興岩等地的所在鄉鎮，加上木材、竹筍與高山茶等林業與農業資源，竹崎鄉可說是連結嘉南平原與阿里山山區的重要地理與交通樞紐。"], "quiz": {"q": "關於「竹崎鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "竹崎原稱竹頭崎庄，因全鄉多山坡地形，早期竹林遍布，砍伐開墾後遍地留存竹頭而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！竹崎原稱竹頭崎庄，因全鄉多山坡地形，早期竹林遍布，砍伐開墾後遍地留存竹頭而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 262, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『梅山鄉』這個地方，是怎麼來的嗎？梅山原稱梅仔坑，因位於倒孔溪南岸寬闊坑谷、早期廣植梅樹而得名，另一說因坑內有人販售米糜（粥）而稱糜仔坑。", "梅山鄉舊稱「梅仔坑」，地名由來主要有兩種說法：第一種說法指出，這一帶位於倒孔溪南岸一處寬闊的坑谷地形內，早期廣泛種植梅樹，梅花盛開時景色宜人，因而得名「梅仔坑」；第二種說法則別具生活趣味，指本地地處山腳地帶、是行旅往來必經之處，曾有人在溪畔搭屋販售「米糕粥」（閩南語稱粥為「糜」），因而被稱為「糜仔坑」，", "因發音相近，「糜仔坑」與「梅仔坑」兩種說法逐漸混用，1920年正式定名為「梅山」。梅山鄉地處嘉義縣東北側山區，是全台海拔最低的高山鄉鎮之一，因日出美景聞名的「小百岳」大尖山與瑞里、太平雲梯等景點，加上高山茶、甜柿等農特產，讓梅山鄉兼具生態觀光與精緻農業的發展優勢。"], "quiz": {"q": "關於「梅山鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "梅山原稱梅仔坑，因位於倒孔溪南岸寬闊坑谷、早期廣植梅樹而得名，另一說因坑內有人販售米糜（粥）而稱糜仔坑。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！梅山原稱梅仔坑，因位於倒孔溪南岸寬闊坑谷、早期廣植梅樹而得名，另一說因坑內有人販售米糜（粥）而稱糜仔坑。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [259, 260, 261, 262]}, {"id": "side-嘉義縣-2", "title": "嘉義縣．番路鄉至奮起湖", "kind": "side", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識嘉義縣的幾個地方：番路鄉、大埔鄉、阿里山鄉、奮起湖。」", "stops": [{"placeId": 263, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『番路鄉』這個地方，是怎麼來的嗎？番路因位居嘉義通往阿里山鄒族部落的必經道路上而得名，「番」為清代漢人對原住民的慣稱。", "番路鄉地名由來相對直白：這一帶清代因地處嘉南平原漢人聚落，通往阿里山鄒族傳統領域的必經要道之上，先民依此交通機能特徵，將此地稱為「番仔路」，「番」是清代漢人對原住民的慣用稱呼，「路」則指這條連接平地與山地的重要通道，後簡化為「番路」，", "沿用至今。番路鄉地處嘉義縣東側丘陵地帶，是嘉義市通往阿里山公路（台18線）沿線的重要門戶，因氣候與土壤條件適宜，是台灣重要的芒果與龍眼產地，境內觸口一帶的天長地久橋、獼猴保護區，也讓番路鄉成為嘉義市近郊熱門的生態休閒去處。"], "quiz": {"q": "關於「番路鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["番路因位居嘉義通往阿里山鄒族部落的必經道路上而得名，「番」為清代漢人對原住民的慣稱。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 0, "rightFb": "沒錯！番路因位居嘉義通往阿里山鄒族部落的必經道路上而得名，「番」為清代漢人對原住民的慣稱。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 264, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『大埔鄉』這個地方，是怎麼來的嗎？大埔鄉舊稱後大埔，因與台南東山鄉境內較早開發的大埔庄相對，本地位置較後，故稱後大埔，先民多來自廣東潮州府大埔縣。", "大埔鄉地名由來與移民原鄉及聚落開發先後順序皆有關聯：「大埔」原是廣東省潮州府下轄的一個縣名，清代大批來自大埔縣的客家移民渡海來台開墾時，習慣將原鄉地名移植到新墾地，作為對故土的追念；由於台南縣（今台南市）東山鄉境內，已有一處較早形成、同樣稱為「大埔庄」的聚落，為了區別兩地，", "本地便相對稱為「後大埔」，台南者則稱「前大埔」，1920年簡化為「大埔」，沿用至今。大埔鄉地處曾文溪上游、嘉義縣東南側山區，因大埔水庫（曾文水庫的重要調節水庫）的興建，加上高山茶產業的發展，如今是嘉義縣人口最少、卻擁有豐富水域生態景觀的山區鄉鎮。"], "quiz": {"q": "關於「大埔鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["大埔鄉舊稱後大埔，因與台南東山鄉境內較早開發的大埔庄相對，本地位置較後，故稱後大埔，先民多來自廣東潮州府大埔縣。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！大埔鄉舊稱後大埔，因與台南東山鄉境內較早開發的大埔庄相對，本地位置較後，故稱後大埔，先民多來自廣東潮州府大埔縣。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 265, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『阿里山鄉』這個地方，是怎麼來的嗎？阿里山鄉原名吳鳳鄉，紀念清代通事吳鳳，1989年因吳鳳「捨身取義」故事被指為虛構且醜化原住民，正式更名為阿里山鄉。", "阿里山鄉在1945年台灣光復後，最初命名為「吳鳳鄉」，是為了紀念清代擔任阿里山地區通事的吳鳳；官方教科書長期宣揚吳鳳「捨身取義、感化原住民革除出草陋習」的故事，並在鄉內設有吳鳳廟與銅像。然而，隨著原住民族權益意識抬頭，鄒族與學術界陸續提出質疑，指出這段廣為流傳的故事情節多有杜撰成分，且以「野蠻」形象醜化原住民族，經過長期的正名運動與社會討論，教育部於1980年代將教科書中的吳鳳故事刪除，", "鄉公所也在1989年3月正式將「吳鳳鄉」更名為「阿里山鄉」，改以境內最知名的地標「阿里山」為鄉名，這是台灣少數因歷史敘事爭議而修正行政區名稱的案例。「阿里山」之名本身則相傳源自鄒族一位傳說中的首領「阿巴里」，鄒族人稱其獵場為「阿里山」，如今阿里山鄉以日出雲海、森林鐵路與高山茶聞名，是全台最具代表性的高山觀光勝地之一。"], "quiz": {"q": "關於「阿里山鄉」（嘉義縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "阿里山鄉原名吳鳳鄉，紀念清代通事吳鳳，1989年因吳鳳「捨身取義」故事被指為虛構且醜化原住民，正式更名為阿里山鄉。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！阿里山鄉原名吳鳳鄉，紀念清代通事吳鳳，1989年因吳鳳「捨身取義」故事被指為虛構且醜化原住民，正式更名為阿里山鄉。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 266, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『奮起湖』這個地方，是怎麼來的嗎？奮起湖舊稱畚箕湖，因地形三面環山、中間下凹，狀如畚箕而得名，「湖」在此指盆地，非真有湖泊，後取諧音改為奮起湖。", "奮起湖並非真正的湖泊，其舊稱「畚箕湖」直接描述了當地的地形特徵：這處海拔約1405公尺的聚落，因大凍山、光崙山及摩天嶺三面環繞、中央低窪下凹，從高處俯瞰狀似農具「畚箕」，加上台語慣稱盆地為「湖仔」，因而得名「畚箕湖」；民國時期，地方認為此名不夠雅致，取「畚」與「奮」諧音、「箕」改為「起」，寓意「奮發圖強」，", "正式改稱「奮起湖」。奮起湖的興盛完全拜阿里山森林鐵路所賜：這裡是森林鐵路最大的中途站，早年蒸汽火 moji": "🍃", "pages": ["你知道『東區』這個地方，是怎麼來的嗎？東區源自清代台灣府城「東安坊」，是府城東側的行政區劃，因鄭經時期劃分四坊而得名。", "東區地名源自明鄭時期永曆18年（1664年），鄭經將承天府劃分為東安、西定、寧南、鎮北四坊時所設立的「東安坊」，是台南市最古老的行政區劃系統之一。清代台灣府與台灣縣治皆設於東安坊內，是當時全台的政治中心；乾隆15年，縣治雖遷往鎮北坊，東安坊仍持續是府城重要的核心地帶。1920年台南市正式定名後，", "東安坊一帶逐漸簡稱為「東區」。東區因鄰近成功大學，加上府城歷史尚未過度都市化的丘陵地帶，日治時期發展成文教機構聚集之地，境內的台南公園、大東夜市與東門城遺跡，讓東區兼具歷史底蘊與現代生活機能，是台南市人口最多的行政區之一。"], "quiz": {"q": "關於「東區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["東區源自清代台灣府城「東安坊」，是府城東側的行政區劃，因鄭經時期劃分四坊而得名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！東區源自清代台灣府城「東安坊」，是府城東側的行政區劃，因鄭經時期劃分四坊而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 272, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『南區』這個地方，是怎麼來的嗎？南區地名源自安平外海一連串沙洲「鯤鯓」，因沙洲狀似大魚（鯤）浮游海面而得名。", "南區地名與台南沿海特殊的沙洲地形密切相關：17世紀時，安平外海分布著七座相連的沙洲島，由北而南依序稱為一鯤鯓、二鯤鯓、三鯤鯓……直到七鯤鯓，因古人想像這些狹長的沙洲宛如神話中的大魚「鯤」浮游於海面，故以「鯤鯓」為名，今日南區境內的「鯤鯓里」正是這段沙洲地形歷史的直接見證。隨著台江內海逐漸淤積陸化，", "這些原本各自獨立的沙洲才與台灣本島相連。1920年台南市定名後，這片位於府城南側、涵蓋部分鯤鯓沙洲地帶的區域，正式劃為「南區」。南區因鄰近安平港與台南漁光島，是台南市重要的漁業與港口腹地，境內保留的鯤鯓王平和堂等廟宇，仍延續著這段與海共生的沙洲聚落信仰傳統。"], "quiz": {"q": "關於「南區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "南區地名源自安平外海一連串沙洲「鯤鯓」，因沙洲狀似大魚（鯤）浮游海面而得名。"], "correct": 3, "rightFb": "沒錯！南區地名源自安平外海一連串沙洲「鯤鯓」，因沙洲狀似大魚（鯤）浮游海面而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 273, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『北區』這個地方，是怎麼來的嗎？北區源自清代台灣府城「鎮北坊」，乾隆年間台灣縣治由東安坊遷此後，成為府城北側的行政核心。", "北區地名源自明鄭永曆18年劃設府城四坊之一的「鎮北坊」，意指鎮守府城北側的行政區劃。清乾隆15年（1750年），台灣縣治由東安坊遷移至鎮北坊，使這一帶躍升為府城行政與軍事的重要核心地帶，加上東安坊仍保有部分機能，「東安、鎮北二坊俱在今台南市」，這也是台南市自清代以來被稱為「府城」的由來之一。1920年台南市定名後，", "鎮北坊簡化為「北區」，沿用至今。北區境內的台南公園（前身為鎮北坊一帶）、開基天后宮、大觀音亭等歷史建築，見證了這片區域自清代以來作為府城行政核心的悠久歷史，如今北區也是台南市重要的住宅與商業機能區域。"], "quiz": {"q": "關於「北區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "北區源自清代台灣府城「鎮北坊」，乾隆年間台灣縣治由東安坊遷此後，成為府城北側的行政核心。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！ ：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [276, 277, 278, 279]}, {"id": "main-台南市-3", "title": "台南市．玉井區至仁德區", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識台南市的幾個地方：玉井區、楠西區、南化區、仁德區。」", "stops": [{"placeId": 280, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『玉井區』這個地方，是怎麼來的嗎？玉井舊稱噍吧哖，源自西拉雅族支族「大武壠」社群語言音譯，1920年因日語近似音改稱玉井，1915年噍吧哖事件為台灣武裝抗日最後一役。", "玉井區在荷蘭與清代文獻中稱為「大武壠」，是西拉雅族支族「四社熟番」中噍吧哖社、芒仔芒社、宵里社等部落的傳統領域。1920年，日本殖民政府推行地方行政改制，取「噍吧哖」（Tapani）的日語近似讀音「玉井」（Tamai），將地名雅化為玉井，沿用至今。玉井最為人所知的歷史事件，是1915年由余清芳、江定、羅俊等人發起的「噍吧哖事件」（又稱西來庵事件），", "這是台灣武裝抗日行動中規模最大、犧牲也最慘烈的一次，事件平定後，日方進行大規模報復性屠殺，遇難者估計逾千人，是台灣武裝抗日史畫下句點的關鍵事件。如今玉井以芒果產業聞名全台，享有「芒果的故鄉」美譽，每年舉辦芒果節推廣地方農特產。"], "quiz": {"q": "關於「玉井區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "玉井舊稱噍吧哖，源自西拉雅族支族「大武壠」社群語言音譯，1920年因日語近似音改稱玉井，1915年噍吧哖事件為台灣武裝抗日最後一役。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！玉井舊稱噍吧哖，源自西拉雅族支族「大武壠」社群語言音譯，1920年因日語近似音改稱玉井，1915年噍吧哖事件為台灣武裝抗日最後一役。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 281, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『楠西區』這個地方，是怎麼來的嗎？楠西舊稱茄拔，源自阿里山四社群「茄拔社」社名，因清代隸屬楠梓仙溪之西的「楠梓仙溪西里」而改稱楠西。", "楠西區舊稱「茄拔」，源自曹族（鄒族）支系阿里山四社群中「茄拔社」的社名音譯，是漢人入墾前這片丘陵地帶原住民的傳統聚落。清代，這一帶因地處楠梓仙溪（今旗山溪）西岸，行政區劃上隸屬「楠梓仙溪西里」，1920年，日本殖民政府推行地方改制，將此地名簡化為「楠西」，", "沿用至今。楠西區地處曾文水庫上游集水區，因氣候與土壤條件適宜，是台灣重要的芒果與楊桃產地，境內的曾文水庫、密枝里的萬佛寺與梅嶺風景區，讓楠西兼具水庫生態與丘陵農業觀光的多重魅力，是台南市東側山區重要的休閒農業鄉鎮。"], "quiz": {"q": "關於「楠西區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "楠西舊稱茄拔，源自阿里山四社群「茄拔社」社名，因清代隸屬楠梓仙溪之西的「楠梓仙溪西里」而改稱楠西。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！楠西舊稱茄拔，源自阿里山四社群「茄拔社」社名，因清代隸屬楠梓仙溪之西的「楠梓仙溪西里」而改稱楠西。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 282, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『南化區』這個地方，是怎麼來的嗎？南化舊稱南庄，因位於北寮（今北寮村）南方而得名，1920年取「南庄」之南與「內新化南里」之化，合稱南化。", "南化區舊稱「南庄」，這個地名由來源自其相對於鄰近聚落的地理位置：這一帶位處北方另一處聚落「北寮」的南側，先民依此方位關係，將此地稱為「南庄」。1920年，日本殖民政府推行地方行政改制時，取「南庄」的「南」字，加上此地清代隸屬「內新化南里」的「化」字，兩者組合成「南化」，", "這種截取兩個舊地名或行政區劃用字重新組合命名的方式，與苗栗寶山鄉（草山+寶斗仁）的命名邏輯相似。南化區地處台南市東側山區，因南化水庫的興建，是重要的水源保護區，加上龍眼、破布子等丘陵農產，是台南市面積廣闊卻人口稀少的山區鄉鎮之一。"], "quiz": {"q": "關於「南化區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["南化舊稱南庄，因位於北寮（今北寮村）南方而得名，1920年取「南庄」之南與「內新化南里」之化，合稱南化。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！南化舊稱南庄，因位於北寮（今北寮村）南方而得名，1920年取「南庄」之南與「內新化南里」之化，合稱南化。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 283, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『仁德區』這個地方，是怎麼來的嗎？仁德舊稱土庫，因是竹編塗泥、用來儲存穀物的庫倉而得名，1920年因明鄭時期隸屬仁德里而改稱仁德。", "仁德區舊稱「土庫」，這個地名描述了當地早期常見的穀物儲存設施：先民以竹子編織成籠狀結構，外層塗抹泥土加固防潮，作為儲藏稻穀的倉庫，這種「土庫」在當地數量眾多，因而成為地方代稱。1920年，日本殖民政府推行地方行政改制，考量此地明鄭時期隸屬「仁德里」的行政區劃淵源，", "取「仁德」二字重新命名，這與歸仁、新化等地同樣沿用明鄭教化政策下的舊里名。仁德區因鄰近台南市區與台南高鐵站，加上台南都會公園、十鼓文創園區（原仁德糖廠）等文創觀光設施，已從清代單純的穀倉聚落，發展成台南市重要的文創觀光與住宅衛星市鎮。"], "quiz": {"q": "關於「仁德區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「仁德區」市集而得名", "仁德舊稱土庫，因是竹編塗泥、用來儲存穀物的庫倉而得名，1920年因明鄭時期隸屬仁德里而改稱仁德。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！仁德舊稱土庫，因是竹編塗泥、用來儲存穀物的庫倉而得名，1920年因明鄭時期隸屬仁德里而改稱仁德。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [280, 281, 282, 283]}, {"id": "main-台南市-4", "title": "台南市．關廟區至麻豆區", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識台南市的幾個地方：關廟區、龍崎區、官田區、麻豆區。」", "stops": [{"placeId": 284, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『關廟區』這個地方，是怎麼來的嗎？關廟原名香洋，因清代此地遍植可製成染料的「香洋草」而得名，後因境內山西堂主祀關聖帝君香火鼎盛而改稱關廟。", "關廟區舊稱「香洋」，因清代此地廣泛種植一種可提煉染料的植物「香洋」（可能與大菁類似），先民依此經濟作物特徵，將此地稱為「香洋」。境內的「關廟村」因建有主祀關聖帝君的廟宇「山西堂」，香火十分鼎盛，隨著這座廟宇的知名度日益提升，逐漸取代原本的「香洋」，成為整個地區的代稱「關廟」，", "是台灣少數因廟宇香火鼎盛而直接影響地名演變的案例。關廟區因土壤與氣候條件適宜，是台灣重要的鳳梨與竹筍產地，尤其以關廟麵（一種日曬麵條）聞名全台，讓這個因染料作物與關帝信仰交織而成的地名，發展出獨具特色的地方農產與飲食文化。"], "quiz": {"q": "關於「關廟區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "關廟原名香洋，因清代此地遍植可製成染料的「香洋草」而得名，後因境內山西堂主祀關聖帝君香火鼎盛而改稱關廟。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！關廟原名香洋，因清代此地遍植可製成染料的「香洋草」而得名，後因境內山西堂主祀關聖帝君香火鼎盛而改稱關廟。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 285, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『龍崎區』這個地方，是怎麼來的嗎？龍崎因1920年行政改制，從轄內「龍船」與「崎頂」兩個舊地名中，各取一字組合而成。", "龍崎區地名由來相當特殊，是台灣地名中少見的「拼字組合」案例：1920年，日本殖民政府推行地方行政改制時，將轄內原有的「龍船」（因地形或傳說與龍舟相關而得名）與「崎頂」（意指崎嶇坡地的頂端）兩個舊地名，各取一字重新組合，正式定名為「龍崎」，沿用至今。龍崎區地處台南市東側惡地地形與丘陵交界地帶，", "因土壤貧瘠、農業發展受限，是台南市人口最少的行政區，卻擁有草山月世界惡地地形與竹林密布的獨特自然景觀，加上龍崎牛埔泥岩水土保持教學園區，讓這個因地名拼字而生的山區鄉鎮，成為認識台灣惡地地形與生態工法的重要場域。"], "quiz": {"q": "關於「龍崎區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「龍崎區」市集而得名", "龍崎因1920年行政改制，從轄內「龍船」與「崎頂」兩個舊地名中，各取一字組合而成。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！龍崎因1920年行政改制，從轄內「龍船」與「崎頂」兩個舊地名中，各取一字組合而成。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 286, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『官田區』這個地方，是怎麼來的嗎？官田舊稱官佃，源自荷蘭時期的「王田」制度，明鄭時期改為官方招募佃農耕作的官有田地而得名。", "官田區地名由來，源自台灣土地開發史上一項重要的土地制度演變：荷蘭統治時期，台灣土地名義上屬荷蘭東印度公司所有，稱為「王田」，農民須向公司繳納高額地租；明鄭政權接收台灣後，將原本的王田改為「官田」，招募移民前來耕作，這些耕作官有田地的佃農稱為「官佃」，這片區域便以此為地名。1920年，", "日本殖民政府推行地方行政改制，正式簡化定名為「官田」，沿用至今。官田區因地處嘉南平原水源豐沛地帶，是全台重要的菱角產地，享有「菱角的故鄉」美譽，境內的烏山頭水庫（珊瑚潭）與八田與一紀念園區，更見證了日治時期嘉南大圳的水利建設歷史。"], "quiz": {"q": "關於「官田區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "官田舊稱官佃，源自荷蘭時期的「王田」制度，明鄭時期改為官方招募佃農耕作的官有田地而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！官田舊稱官佃，源自荷蘭時期的「王田」制度，明鄭時期改為官方招募佃農耕作的官有田地而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 287, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『麻豆區』這個地方，是怎麼來的嗎？麻豆源自西拉雅族「麻豆社」，是台南四大社之一，地名意涵眾說紛紜，或指眼睛，或指港口，確切語源仍待考證。", "麻豆區地名源自西拉雅族「麻豆社」（Mattau）的社名音譯，是清代文獻記載台南平原西拉雅族四大社（新港、目加溜灣、蕭壠、麻豆）之一，勢力範圍涵蓋今麻豆一帶。關於「麻豆」的語意，學界說法不一：一說認為與西拉雅語中「眼睛」相關的詞彙有關；另有學者從地形推測，麻豆舊社緊鄰倒風內海港汊，可能與「港口」之意有關，", "但確切語源至今仍缺乏定論。荷蘭統治時期，麻豆社曾與荷蘭東印度公司爆發激烈的武裝衝突（麻豆社事件），是西拉雅族抵抗外來殖民勢力的重要歷史事件。如今麻豆以文旦柚聞名全台，享有「麻豆文旦」的美譽，加上麻豆代天府等信仰重鎮，是台南市曾文溪流域重 aceId": 290, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『七股區』這個地方，是怎麼來的嗎？七股原稱七股寮，清道光年間十六股首之一招佃開墾此地，因分得七股份額而得名，另一說為七位福建移民合股開闢魚塭而得名。", "七股區地名由來主要有兩種說法：第一種說法指出，清道光年間，這片台江內海浮覆地由官方招募十六股墾首前來開墾，其中一部分墾地依股份分配歸屬「七股」份額的佃戶所有，佃戶在此搭建茅寮聚居，因而得名「七股寮」，1920年簡化為「七股」；第二種說法則認為，這片新生海埔地形成後，曾有七位來自福建的移民結伴前來，", "合股開闢一處魚塭維生，因而得名「七股塭」，沿用演變為七股。七股區因台江內海長期淤積形成廣闊的潟湖與潮間帶地形，是全台最重要的黑面琵鷺度冬棲地，加上七股鹽山、七股潟湖等景觀，及虱目魚、牡蠣養殖產業，讓七股區兼具生態保育與漁業經濟的雙重價值。"], "quiz": {"q": "關於「七股區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "七股原稱七股寮，清道光年間十六股首之一招佃開墾此地，因分得七股份額而得名，另一說為七位福建移民合股開闢魚塭而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！七股原稱七股寮，清道光年間十六股首之一招佃開墾此地，因分得七股份額而得名，另一說為七位福建移民合股開闢魚塭而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 291, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『將軍區』這個地方，是怎麼來的嗎？將軍原稱漚汪，源自西拉雅族社名，因清康熙年間施琅將軍平台有功，獲賜此地為世襲業地而改稱將軍。", "將軍區舊稱「漚汪」，源自西拉雅族部落社名的音譯，是漢人入墾前這片濱海地帶原住民的傳統領域。康熙22年（1683年），施琅將軍率軍平定台灣有功，清廷將這片浮覆荒埔地賜予施琅作為世襲業地，施家因而成為當地最大的地主（大租戶），招募漳州、泉州移民前來墾耕，並向佃農收取俗稱「施侯租」的大租，", "這段歷史也讓「漚汪」逐漸改稱「將軍」，以紀念施琅將軍的封賜。道光年間，遠在北京的施琅後裔出售部分租館田地，僅保留少數租館持續收租。將軍區因濱臨台灣海峽，是台南市重要的漁業與虱目魚養殖鄉鎮，境內的將軍漁港、苓仔寮天后宮，也是地方信仰與漁業經濟的重要據點。"], "quiz": {"q": "關於「將軍區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "將軍原稱漚汪，源自西拉雅族社名，因清康熙年間施琅將軍平台有功，獲賜此地為世襲業地而改稱將軍。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！將軍原稱漚汪，源自西拉雅族社名，因清康熙年間施琅將軍平台有功，獲賜此地為世襲業地而改稱將軍。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [288, 289, 290, 291]}, {"id": "main-台南市-6", "title": "台南市．學甲區至後壁區", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識台南市的幾個地方：學甲區、北門區、新營區、後壁區。」", "stops": [{"placeId": 292, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『學甲區』這個地方，是怎麼來的嗎？學甲即西拉雅族「學甲社」譯音地名，一說即史料記載的「史椰甲社」，是台南平埔族聚落之一。", "學甲區地名源自西拉雅族部落社名的音譯，關於確切的族社對應，學界有不同看法，一說認為「學甲」即清代文獻中記載的「史椰甲社」，是台南平原西拉雅族眾多部落之一的音譯轉化，反映這片濱海平原在漢人大規模入墾之前，原是平埔族群生活繁衍之地。學甲區因地處將軍溪流域，", "清代以來便是重要的農漁業聚落，境內的學甲慈濟宮，主祀保生大帝，相傳其開基神像由白礁移民迎奉來台，是台灣保生大帝信仰的重要祖廟之一，每年上白礁謁祖祭典吸引大量信眾參與。學甲另以虱目魚產業聞名，享有「虱目魚的故鄉」美譽，是台南沿海重要的漁業經濟重鎮。"], "quiz": {"q": "關於「學甲區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "學甲即西拉雅族「學甲社」譯音地名，一說即史料記載的「史椰甲社」，是台南平埔族聚落之一。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 2, "rightFb": "沒錯！學甲即西拉雅族「學甲社」譯音地名，一說即史料記載的「史椰甲社」，是台南平埔族聚落之一。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 293, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『北門區』這個地方，是怎麼來的嗎？北門舊稱北門嶼，因地處倒風內海大潟湖北側門戶處的濱外沙洲而得名，另有位居府城北方、鄰近青峰闕北口等說法。", "北門區舊稱「北門嶼」，地名由來主要有幾種說法：一說這一帶原是清代倒風內海大潟湖內側的一處濱外沙洲，因地處潟湖北側門戶要衝，故稱北門；另有說法認為，是因這片沙洲位居台灣府城的北方而得名；還有一說與鄰近的「青峰闕」（潟湖北方出入口）地理位置有關。北門區因地勢低窪、土壤含鹽分高，", "清代以來便是重要的曬鹽產地，境內的井仔腳瓦盤鹽田是台灣現存最古老的鹽田之一，夕陽映照鹽田水面的景觀廣受攝影愛好者喜愛。北門區同時也是烏腳病盛行的歷史記憶所在地，早年因飲用含砷地下水導致烏腳病肆虐，如今設有台灣烏腳病醫療紀念館，見證這段公共衛生史的艱辛歷程。"], "quiz": {"q": "關於「北門區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "北門舊稱北門嶼，因地處倒風內海大潟湖北側門戶處的濱外沙洲而得名，另有位居府城北方、鄰近青峰闕北口等說法。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！北門舊稱北門嶼，因地處倒風內海大潟湖北側門戶處的濱外沙洲而得名，另有位居府城北方、鄰近青峰闕北口等說法。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 294, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『新營區』這個地方，是怎麼來的嗎？新營因明鄭時期屯辦何積善等人在舊營（今鹽水區）之外另闢新屯墾據點，相對於「舊營」而得名。", "新營區地名由來，源自明鄭時期屯田制度下聚落發展先後的相對關係：鄭氏政權在鹽水一帶（今鹽水區舊營里）最初設立屯田據點，稱為「舊營」；隨著拓墾範圍擴大，屯辦何積善等人另在此地開闢新的屯墾聚落，為與既有的舊營區別，便稱為「新營」，這種依開發先後順序、以新舊相對命名地方的方式，", "在台灣拓墾史上相當常見。新營區地處嘉南平原核心地帶，因鐵路縱貫線設站，加上糖業興盛，日治至戰後初期一度是台南縣治所在地，是嘉南平原北側重要的行政、商業與交通樞紐，境內的新營糖廠與台灣鹽博物館，也讓新營保有豐富的產業歷史記憶。"], "quiz": {"q": "關於「新營區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「新營區」市集而得名", "新營因明鄭時期屯辦何積善等人在舊營（今鹽水區）之外另闢新屯墾據點，相對於「舊營」而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！新營因明鄭時期屯辦何積善等人在舊營（今鹽水區）之外另闢新屯墾據點，相對於「舊營」而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 295, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『後壁區』這個地方，是怎麼來的嗎？後壁因聚落座落於另一處聚落後方的簡易草寮而得名，舊稱後壁寮。", "後壁區地名由來相對單純，源自清代拓墾聚落的相對位置：這處聚落座落於當地另一處較早開發聚落的後方，先民在此搭建簡易草寮居住開墾，因而得名「後壁寮」，1920年簡化為「後壁」，沿用至今，這種依相對方位加上臨時建物命名的方式，在台灣各地聚落發展中相當常見。後壁區地處嘉南平原精華地帶，", "因嘉南大圳灌溉系統完善，是台灣重要的優質稻米產區，享有「無米樂」的美譽（同名紀錄片即以後壁區菁寮里為背景拍攝），境內保存完整的菁寮老街、金德興藥舖等歷史街屋，加上黃家古厝等傳統建築，讓後壁區成為認識嘉南平原農村生活文化的重要據點。"], "quiz": {"q": "關於「後壁區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["後壁因聚落座落於另一處聚落後方的簡易草寮而得名，舊稱後壁寮。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！後壁因聚落座落於另一處聚落後方的簡易草寮而得名，舊稱後壁寮。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [292, 293, 294, 295]}, {"id": "main-台南市-7", "title": "台南市．白河區至下營區", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識台南市的幾個地方：白河區、東山區、六甲區、下營區。」", "stops": [{"placeId": 296, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『白河區』這個地方，是怎麼來的嗎？白河舊稱店仔口，因清乾隆年間吳姓商人在往來要道十字路口開設茶水店而得名，後因白水溪環村而流改稱白河。", "白河區舊稱「店仔口」，這個地名由來源自一段商旅往來的生活場景：清乾隆年間，白河是通往當時商業繁榮中心「下茄苳」的必經之路，一位吳姓異鄉人在往來要道的十字路口搭建簡易草廬，販售涼水、茶點，供南來北往的行旅休憩，「店仔口」便是指這處草廬商店的門口，久而久之成為整個聚落的代稱。地方人士後來認為「店仔口」一詞不夠文雅，", "加上白水溪由東向南、再向西環繞村落而流，溪水因流經石灰岩地質而略顯白濁，因而依此改稱「白河」，光復後正式定名白河鎮，2010年改制為白河區。白河因白河水庫與關子嶺溫泉聞名，加上全台最大的蓮花產區，是台南市著名的溫泉與生態觀光重鎮。"], "quiz": {"q": "關於「白河區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["白河舊稱店仔口，因清乾隆年間吳姓商人在往來要道十字路口開設茶水店而得名，後因白水溪環村而流改稱白河。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！白河舊稱店仔口，因清乾隆年間吳姓商人在往來要道十字路口開設茶水店而得名，後因白水溪環村而流改稱白河。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 297, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『東山區』這個地方，是怎麼來的嗎？東山原為西拉雅族支族洪雅族「哆囉嘓社」所在地，後因地名不雅改稱番社街，光復後因位居新營東方山區改稱東山。", "東山區在漢人入墾前，是洪雅族「哆囉嘓社」的傳統領域，隨著漢人移民日增，逐漸形成以原住民社名為基礎的「哆囉嘓庄」。此後地方一度改稱「番社街」，直接以「番社」（原住民聚落）指稱這片區域，但因「番社」一詞逐漸被認為帶有歧視意味且不夠文雅，光復後，鑑於這一帶恰好位於新營東方的丘陵山區，遂正式改稱「東山」，", "這種因原有地名不雅而依地理方位重新命名的案例，與台北古亭（鼓亭改古亭）等地名演變邏輯相似。東山區因丘陵地形、氣候涼爽，是台灣重要的咖啡與龍眼乾產地，境內東山吊神橋、崁頭山等景點，加上關子嶺溫泉區部分範圍，讓東山成為台南市東側山區兼具農業特色與生態旅 , "stops": [{"placeId": 300, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『柳營區』這個地方，是怎麼來的嗎？柳營舊稱查畝營，即明鄭時期勘查田畝的屯營之地，因當地居民多為劉姓、「劉」與「柳」同音而改稱柳營。", "柳營區舊稱「查畝營」，地名由來與明鄭時期的土地清丈制度有關：鄭氏政權在此設立屯田據點時，需詳細勘查、丈量田畝面積以利分配管理，這處負責勘查田畝事務的營區，因而得名「查畝營」；另一說則認為，此地可能與明鄭陸軍「柳宿鎮」的屯墾範圍相鄰而得名。「查畝營」這個地名沿用至大正9年（1920年），", "因當地居民以劉姓居多，「劉」與「柳」在台語發音上十分相近，地方遂順勢將地名改為「柳營庄」，戰後改制為柳營鄉，2010年改為柳營區。柳營區因劉氏家族興建的劉家古厝聞名，加上八翁牧場的鮮乳產業，是台南市嘉南平原上兼具歷史建築與酪農產業特色的鄉鎮。"], "quiz": {"q": "關於「柳營區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "柳營舊稱查畝營，即明鄭時期勘查田畝的屯營之地，因當地居民多為劉姓、「劉」與「柳」同音而改稱柳營。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！柳營舊稱查畝營，即明鄭時期勘查田畝的屯營之地，因當地居民多為劉姓、「劉」與「柳」同音而改稱柳營。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 301, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『鹽水區』這個地方，是怎麼來的嗎？鹽水舊稱鹽水港，因潮汐可上溯至此、海水略帶鹹味而得名，因港道彎曲如半月，又稱月津港。", "鹽水區舊稱「鹽水港」，明鄭時期稱為「奎壁庄」，清雍正9年（1731年）闢為台灣島內重要的貿易港口。這一帶因地處八掌溪支流出海口附近，海水漲潮時可沿港道上溯至此，河水因而略帶鹹味，加上與稍北的「淡水港」（今台南六甲一帶）相對而言水質偏鹹，因而得名「鹽水港」。由於這條港道環繞街區蜿蜒而流，", "整體形狀有如一輪半月，鹽水港因此又有「月津港」或「月港」的雅稱，這個充滿詩意的別稱至今仍常見於地方文化活動的命名中，如著名的「月津港燈節」。鹽水區因清代商業鼎盛，一度有「一府二鹿三艋舺四月津」的俗諺流傳，境內橋南老街、八角樓等古蹟，加上元宵節舉辦的鹽水蜂炮，是全台知名的民俗慶典活動。"], "quiz": {"q": "關於「鹽水區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "鹽水舊稱鹽水港，因潮汐可上溯至此、海水略帶鹹味而得名，因港道彎曲如半月，又稱月津港。", "因清代此地盛產某種作物，官府設「鹽水區」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！鹽水舊稱鹽水港，因潮汐可上溯至此、海水略帶鹹味而得名，因港道彎曲如半月，又稱月津港。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 302, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『善化區』這個地方，是怎麼來的嗎？善化因明鄭時期隸屬「善化里西堡」而得名，舊稱灣裡，源自西拉雅族「目加溜灣社」音譯。", "善化區舊稱「灣裡」，源自西拉雅族「目加溜灣社」（Bakaloan）的社名音譯簡化而來，是台南平原西拉雅族四大社之一的傳統領域。明鄭時期，這一帶行政區劃隸屬「善化里西堡」，1920年，日本殖民政府推行地方行政改制，取「善化里」的「善化」二字，正式取代原本的「灣裡」，", "成為今日通行的地名，這也讓善化與新化、歸仁、仁德等地一樣，沿用了明鄭時期帶有教化意涵的舊里名。善化區因鄰近曾文溪，土壤肥沃，加上善化糖廠與胡麻產業，是台南市重要的農業重鎮，境內慶安宮主祀西拉雅族與漢人共同信仰的神祇，也是了解台南平埔族漢化歷程的重要地方信仰據點。"], "quiz": {"q": "關於「善化區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["善化因明鄭時期隸屬「善化里西堡」而得名，舊稱灣裡，源自西拉雅族「目加溜灣社」音譯。", "因清代此地盛產某種作物，官府設「善化區」市集而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！善化因明鄭時期隸屬「善化里西堡」而得名，舊稱灣裡，源自西拉雅族「目加溜灣社」音譯。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [300, 301, 302]}], "sideQuests": [{"id": "side-台南市-1", "title": "台南市．大內區至安定區", "kind": "side", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識台南市的幾個地方：大內區、山上區、新市區、安定區。」", "stops": [{"placeId": 303, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『大內區』這個地方，是怎麼來的嗎？大內因楊姓兄弟自福建漳州遷來，兄長楊內住於內庄，因而得名，日治時期改稱大內，沿用至今。", "大內區舊稱「內庄」，相傳三百多年前，楊姓兩兄弟自福建漳州府龍溪縣渡海遷來此地拓墾：兄長名為楊內，居住在「內庄」；弟弟楊石則住在鄰近的「石仔瀨」，兩處聚落因兄弟關係密切，逐漸統稱為「內庄」，意指位於曾文溪河道與嘉義丘陵末端之間、地勢內側的聚落。日治時期，因「內庄」一詞過於簡略，", "取其舊稱「大內」（意指範圍較大的內側聚落），正式定名，光復後改制為大內鄉，2010年改為大內區。大內區地處曾文溪中游西岸，因河谷地形與惡地景觀交錯，是台灣重要的酪梨產地，境內的走馬瀨農場、二溪吊床式咖啡園等休閒農業設施，讓大內成為台南市山區兼具農業特色與觀光休閒的鄉鎮。"], "quiz": {"q": "關於「大內區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "大內因楊姓兄弟自福建漳州遷來，兄長楊內住於內庄，因而得名，日治時期改稱大內，沿用至今。"], "correct": 3, "rightFb": "沒錯！大內因楊姓兄弟自福建漳州遷來，兄長楊內住於內庄，因而得名，日治時期改稱大內，沿用至今。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 304, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『山上區』這個地方，是怎麼來的嗎？山上舊稱山仔頂，因全境屬丘陵地形，聚落多建於小山丘之上而得名，後簡化雅化為山上。", "山上區舊稱「山仔頂」，這個地名直接描述了當地的地形特徵：這一帶因地處丘陵地帶，境內分布著許多大小不一的小山丘，早期移民為避開低窪積水地帶，習慣將聚落建立在地勢較高的小山丘之上，因而得名「山仔頂」，後來才簡化改稱同義的「山上」，沿用至今。山上區地處曾文溪流域丘陵地帶，", "因水源與地質條件特殊，日治時期曾在此設立台灣第一座現代化淨水場「山上花園水道博物館」（原台南水道），供應府城自來水源，如今已轉型為國定古蹟與觀光景點。山上區也因惡地地形與龍湖岩等信仰據點，是台南市山區兼具工業遺產與自然景觀的鄉鎮。"], "quiz": {"q": "關於「山上區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "山上舊稱山仔頂，因全境屬丘陵地形，聚落多建於小山丘之上而得名，後簡化雅化為山上。", "因清代此地盛產某種作物，官府設「山上區」市集而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！山上舊稱山仔頂，因全境屬丘陵地形，聚落多建於小山丘之上而得名，後簡化雅化為山上。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 305, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『新市區』這個地方，是怎麼來的嗎？新市因荷蘭時期將原居當地的西拉雅族新港社人遷移至此另建新社而得名，另一說因商旅在此聚集買賣而形成新興市集。", "新市區地名由來主要有兩種說法：第一種說法認為，17世紀荷蘭統治台灣期間，將原本居住於他處的西拉雅族「新港社」族人遷移至此，另闢新的部落據點，因而得名「新市」；第二種說法則從商業角度出發，指相傳三百年前，山區居民搬運農產前往台南府城販售時，習慣在此地大樹下歇腳休息，", "因苦於周邊無處購買食物，便鼓勵鄰近新港社居民前來擺攤零售，漸漸聚集成一條小型街市，因而得名「新市」。新市區因鄰近台南科學園區（南科），加上新市糖廠與蕃薯厝聚落，已從清代的商旅休息站與部落遷居地，轉型為台南市重要的高科技產業重鎮。"], "quiz": {"q": "關於「新市區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「新市區」市集而得名", "新市因荷蘭時期將原居當地的西拉雅族新港社人遷移至此另建新社而得名，另一說因商旅在此聚集買賣而形成新興市集。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！新市因荷蘭時期將原居當地的西拉雅族新港社人遷移至此另建新社而得名，另一說因商旅在此聚集買賣而形成新興市集。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 306, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『安定區』這個地方，是怎麼來的嗎？安定原稱直加弄，源自西拉雅族「目加溜灣社」屬社社名，1920年因清代隸屬「安定東里」而改稱安定。", "安定區舊稱「直加弄」，這個地名源自西拉雅族「目加溜灣社」轄下一處屬社的社名音譯，與善化（原稱灣裡，同樣源自目加溜灣社）淵源深厚，兩地同屬西拉雅族目加溜灣社的傳統活動範圍。1920年，日本殖民政府推行地方行政改制，考量這一帶在清代隸屬「安定東里」的行政區劃，", "遂取「安定」二字重新命名，取代原本的「直加弄」，沿用至今。安定區地處曾文溪南岸沖積平原，因土壤肥沃、水源充足，是台南市重要的胡蘿蔔（安定蘿蔔）與蔬果產地，境內的蘇厝真護宮等地方廟宇，也是這片西拉雅族古老領域上，漢人移民信仰文化扎根發展的見證。"], "quiz": {"q": "關於「安定區」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "安定原稱直加弄，源自西拉雅族「目加溜灣社」屬社社名，1920年因清代隸屬「安定東里」而改稱安定。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！安定原稱直加弄，源自西拉雅族「目加溜灣社」屬社社名，1920年因清代隸屬「安定東里」而改稱安定。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [303, 304, 305, 306]}, {"id": "side-台南市-2", "title": "台南市．安平古堡至隆田", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識台南市的幾個地方：安平古堡、億載金城、林鳳營、隆田。」", "stops": [{"placeId": 307, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『安平古堡』這個地方，是怎麼來的嗎？安平古堡原為1624年荷蘭人興建的熱蘭遮城（Fort Zeelandia），1661年鄭成功攻克後改稱王城，是台灣最早的西式城堡建築。", "安平古堡的前身是荷蘭東印度公司於1624年起在大員沙洲興建的軍事堡壘，最初稱為「奧倫治城」，1627年改建為磚石構造的「熱蘭遮城」（Fort Zeelandia），作為荷蘭統治台灣近40年間的最高行政與軍事中心，城東並設有市鎮供對遠東貿易之用。永曆15年（1661年），鄭成功率軍經過九個月的圍城，迫使荷蘭東印度公司末任台灣長官揆一投降，", "結束荷蘭在台統治，鄭氏政權將熱蘭遮城改稱「安平鎮城」或「王城」，作為鄭氏三代的居城。清代因政治中心轉移至赤崁一帶，安平城逐漸傾頹荒廢；日治時期，城垣遺構多遭拆除挪用建材，僅存部分稜堡殘蹟，1930年代在城址上興建洋樓式瞭望台，即為今日安平古堡的主體建築樣貌，是全台歷史最悠久的城堡遺跡與熱門觀光地標。"], "quiz": {"q": "關於「安平古堡」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["安平古堡原為1624年荷蘭人興建的熱蘭遮城（Fort Zeelandia），1661年鄭成功攻克後改稱王城，是台灣最早的西式城堡建築。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！安平古堡原為1624年荷蘭人興建的熱蘭遮城（Fort Zeelandia），1661年鄭成功攻克後改稱王城，是台灣最早的西式城堡建築。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 308, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『億載金城』這個地方，是怎麼來的嗎？億載金城原稱二鯤鯓砲台，是清光緒元年沈葆楨聘請法國工程師設計監造的西式砲台，為台灣第一座newly式海防砲台。", "億載金城位於二鯤鯓沙洲之上，故初名「二鯤鯓砲台」，是清光緒元年（1875年），欽差大臣沈葆楨為因應牡丹社事件後台灣海防危機，聘請法國工程師帛爾陀（或譯必麒麟）設計監造的西式稜堡砲台，是台灣第一座採用歐式建築工法興建的近代化海防設施，也是全台現存最古老的西式砲台之一。城門上方沈葆楨親題「億載金城」匾額，取「億萬年屹立、堅固如金城」之意，", "寄託永固海疆的期許，這個充滿氣勢的題名此後便成為這座砲台廣為人知的正式名稱，逐漸取代原本依地理位置命名的「二鯤鯓砲台」。億載金城為方形稜堡砲台，四角凸出以利交叉火力防禦，外壕環繞、內置大砲，雖歷經多次戰事卻從未真正發揮實戰效果，如今已列為國定古蹟，是台南安平地區重要的歷史景點。"], "quiz": {"q": "關於「億載金城」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["億載金城原稱二鯤鯓砲台，是清光緒元年沈葆楨聘請法國工程師設計監造的西式砲台，為台灣第一座newly式海防砲台。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！億載金城原稱二鯤鯓砲台，是清光緒元年沈葆楨聘請法國工程師設計監造的西式砲台，為台灣第一座newly式海防砲台。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 309, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『林鳳營』這個地方，是怎麼來的嗎？林鳳營因明鄭部將林鳳率軍在此屯田開墾而得名，是明鄭時期軍屯制度留下的地名見證。", "林鳳營地名由來，直接紀念一位明鄭時期的軍事將領：鄭氏政權推行寓兵於農的屯田制度，命部將林鳳率領所屬軍隊在此地屯墾定居，這片由林鳳部隊開闢的屯墾區域，因而以其姓名命名為「林鳳營」，與新營、柳營、下營等地同樣源自明鄭時期軍事屯田制度所留下的地名系統，但林鳳營是少數直接以特定將領姓名命名、而非以屯營相對位置或勘查職務命名的案例。林鳳營地處後壁區與六甲區交界的嘉南平原地帶，", "因鐵路縱貫線在此設有林鳳營車站，加上林鳳營鮮乳等知名酪農產品的行銷，讓這個承載明鄭軍屯歷史記憶的地名，透過鮮乳品牌廣為現代消費者所知。"], "quiz": {"q": "關於「林鳳營」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "林鳳營因明鄭部將林鳳率軍在此屯田開墾而得名，是明鄭時期軍屯制度留下的地名見證。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！林鳳營因明鄭部將林鳳率軍在此屯田開墾而得名，是明鄭時期軍屯制度留下的地名見證。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 310, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『隆田』這個地方，是怎麼來的嗎？隆田舊稱番子田，因清代此地是平埔族麻豆社遷居的聚落而得名，1920年因「番子」不雅、且期許農業興隆改稱隆田。", "隆田舊稱「番子田」，這個地名直接反映了當地的族群歷史：清代這一帶原是漢人拓墾勢力擴張後，部分被迫遷徙的西拉雅族麻豆社人另闢新居的聚落，因當地漢人慣以「番子」稱呼原住民，加上此地是原住民開墾的田地，因而得名「番子田」。1920年，日本殖民政府推行地方行政改制，考量「番子」一詞帶有歧視意味且不甚雅觀，", "加上期許這片農地能持續豐收興隆，遂改稱「隆田」，沿用至今，這種因族群稱謂不雅而更名的案例，與台北「番社」改稱、彰化「番挖」改稱「芳苑」的邏輯相似。隆田因縱貫鐵路設站，加上鄰近官田菱角產區，是官田區重要的交通與農產集散據點。"], "quiz": {"q": "關於「隆田」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "隆田舊稱番子田，因清代此地是平埔族麻豆社遷居的聚落而得名，1920年因「番子」不雅、且期許農業興隆改稱隆田。"], "correct": 3, "rightFb": "沒錯！隆田舊稱番子田，因清代此地是平埔族麻豆社遷居的聚落而得名，1920年因「番子」不雅、且期許農業興隆改稱隆田。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [307, 308, 309, 310]}, {"id": "side-台南市-3", "title": "台南市．拔林至南科", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識台南市的幾個地方：拔林、保安、四草、南科。」", "stops": [{"placeId": 311, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『拔林』這個地方，是怎麼來的嗎？拔林地名由台語「芭樂林」音轉而來，因當地早期遍植番石榴（芭樂）成林而得名。", "拔林地名由來相對單純，源自台語發音的轉化：這一帶早期遍植番石榴（台語稱「芭樂」）樹木，成片林立，先民依此果樹景觀特徵，將此地稱為「芭樂林」，隨著時間演變，「芭樂」二字的台語發音逐漸轉音簡化為「拔林」，這種因植物名稱音轉而形成地名的案例，在台灣地名演變中相當常見。拔林地處善化區境內，", "因鄰近縱貫鐵路設有拔林車站，加上周邊肥沃的嘉南平原農地，是台南市重要的水稻與雜糧產區，這個源自芭樂林蔭的地名，如今雖已不見昔日大片芭樂林的景象，卻仍持續透過拔林車站的站名，訴說著這段與果樹相關的拓墾記憶。"], "quiz": {"q": "關於「拔林」（台南市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "拔林地名由台語「芭樂林」音轉而來，因當地早期遍植番石榴（芭樂）成林而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！拔林地名由台語「芭樂林」音轉而來，因當地早期遍植番石榴（芭樂）成林而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 312, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『保安』這個地方，是怎麼來的嗎？保安車站原稱車路墘，因車站緊鄰縱貫鐵路軌道旁（墘）而得名，因與台語「永保安康」諧音，成為熱門的祈福車票景點。", "保安車站原稱「車路墘」，這個地名直接描述了車站所在的地理位置：「車路」指鐵路軌道，「墘」在閩南語中意指邊緣或旁側，車路墘意指聚落緊鄰鐵路軌道旁側而得名，1962年，配合行政區劃調整，車站正式更名為「保安車站」，沿用至今。近年來，保安車站因站名的台語發音與「永保安康」的祝福語諧音相近，", "加上鄰近台南的「永康」車站，兩站車票組合起來恰好蘊含「永保安康」的美好寓意，與台中海線的「日南」「追分」車票（永保安康、永不分手）同樣蔚為風潮，吸引大量鐵道迷與遊客前來購買紀念車票祈福，讓這個原本單純描述鐵路位置的地名，意外成為 id": "main-高雄市-1", "title": "高雄市．鹽埕區至三民區", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識高雄市的幾個地方：鹽埕區、左營區、楠梓區、三民區。」", "stops": [{"placeId": 314, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『鹽埕區』這個地方，是怎麼來的嗎？鹽埕因明鄭時期漢人在此開闢鹽田曬鹽，閩南語稱曬鹽廣場為「埕」而得名，日治後成為高雄最早發展的行政與商業中心。", "鹽埕區地名由來相當直白：明鄭與清代時期，漢人在這片臨海地帶開闢大片鹽田，從事曬鹽產業，閩南語慣稱這種開闊平坦的曬鹽場地為「埕」，因而得名「鹽埕」。日治時期，隨著打狗港（今高雄港）的開發建設，鹽埕因鄰近港區而迅速發展成高雄最早的商業與行政中心，高雄州廳、高雄地方法院等重要官署皆設於此，", "銀樓、布莊林立，一度是全高雄最繁華的區域，享有「金融街」的美稱。戰後，隨著高雄市區向東擴張，加上前鎮、苓雅等新興商圈崛起，鹽埕逐漸沒落，如今則因駁二藝術特區、高雄關（打狗英國領事館文化園區）等歷史建築活化，重新以文創觀光的姿態展現這片曾經曬鹽產鹽之地的城市風華。"], "quiz": {"q": "關於「鹽埕區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "鹽埕因明鄭時期漢人在此開闢鹽田曬鹽，閩南語稱曬鹽廣場為「埕」而得名，日治後成為高雄最早發展的行政與商業中心。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！鹽埕因明鄭時期漢人在此開闢鹽田曬鹽，閩南語稱曬鹽廣場為「埕」而得名，日治後成為高雄最早發展的行政與商業中心。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 316, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『左營區』這個地方，是怎麼來的嗎？左營因明鄭時期實施屯田制度，「左衝鎮」部隊在此屯墾戍守而得名，清代並在此興建全台第一座土造縣城「鳳山舊城」。", "左營區地名源自明鄭時期的軍事屯田制度：鄭氏政權為鞏固台灣防務，將軍隊分區屯墾戍守，其中「左衝鎮」部隊奉命駐紮於此地開墾，因而得名「左營」，這與台南新營、下營、林鳳營等地同樣源自明鄭軍屯體制的地名系統一脈相承。康熙61年（1722年），清廷在左營興建鳳山縣城（今稱「鳳山舊城」），以三合土（俗稱咕咾石）夯築城垣，", "是台灣第一座具規模的土造縣城；乾隆51年（1786年）林爽文事件中，舊城遭攻破，福康安平亂後奏請將縣治遷往下埤頭街（今鳳山區），舊城自此逐漸沒落，僅留東門、南門城垣供後人憑弔。左營因日治及戰後長期為軍事重鎮，加上蓮池潭風景區與左營高鐵站的設立，是高雄市重要的交通樞紐與歷史古蹟聚集地。"], "quiz": {"q": "關於「左營區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "左營因明鄭時期實施屯田制度，「左衝鎮」部隊在此屯墾戍守而得名，清代並在此興建全台第一座土造縣城「鳳山舊城」。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！左營因明鄭時期實施屯田制度，「左衝鎮」部隊在此屯墾戍守而得名，清代並在此興建全台第一座土造縣城「鳳山舊城」。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 317, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『楠梓區』這個地方，是怎麼來的嗎？楠梓原稱楠仔坑，因當地溪畔遍植楠木、是楠木砍伐集散地而得名，日治時期簡化雅化為楠梓。", "楠梓區舊稱「楠仔坑」，這個地名直接反映了當地早期的自然植被與林業活動：這一帶溪流沿岸廣泛生長著楠木（一種質地堅硬的優良木材樹種），先民在此砍伐楠木並集中運送販售，因而得名「楠仔坑」，「坑」則指溪流沖刷形成的谷地。1920年，日本殖民政府推行地方行政改制，將「楠仔坑」簡化雅化為「楠梓」，", "沿用至今。楠梓區因鄰近後勁溪，日治時期起便是高雄重要的工業發展區域，戰後更因高雄煉油廠（中油楠梓廠）與加工出口區的設立，成為南台灣石化與電子產業的重鎮，加上國立中山大學、義守大學等高等院校進駐，讓楠梓區兼具工業生產與學術文教的雙重機能。"], "quiz": {"q": "關於「楠梓區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「楠梓區」市集而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "楠梓原稱楠仔坑，因當地溪畔遍植楠木、是楠木砍伐集散地而得名，日治時期簡化雅化為楠梓。"], "correct": 3, "rightFb": "沒錯！楠梓原稱楠仔坑，因當地溪畔遍植楠木、是楠木砍伐集散地而得名，日治時期簡化雅化為楠梓。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 318, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『三民區』這個地方，是怎麼來的嗎？三民舊稱三塊厝，因明鄭時期王、蔡、鄭三姓移民分別在此搭屋開墾而得名，戰後取「三民主義模範區」之意改稱三民。", "三民區舊稱「三塊厝」，地名由來與一段明鄭時期的墾拓歷史有關：相傳有王、蔡、鄭三個姓氏的移民隨鄭氏軍隊來台後，分別在此地不同區塊搭屋墾耕定居——王姓在東段「橋頭」、蔡姓在南段「海墘」、鄭姓在西北段「後角」，三姓族人各自建立起傳統的方塊型四合院聚落，因而得名「三塊厝」。台灣光復後，政府取建設「三民主義模範區」的政治理想，", "將原本的「三塊厝」正式改稱「三民區」，這種以政治理念重新命名地方、卻巧妙保留原有「三」字諧音的手法，是戰後台灣地名演變中相當特殊的案例。三民區因高雄火車站座落於此，加上高雄醫學大學等機構林立，是高雄市人口最多、也是全國人口數一數二的行政區。"], "quiz": {"q": "關於「三民區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["三民舊稱三塊厝，因明鄭時期王、蔡、鄭三姓移民分別在此搭屋開墾而得名，戰後取「三民主義模範區」之意改稱三民。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 0, "rightFb": "沒錯！三民舊稱三塊厝，因明鄭時期王、蔡、鄭三姓移民分別在此搭屋開墾而得名，戰後取「三民主義模範區」之意改稱三民。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [314, 316, 317, 318]}, {"id": "main-高雄市-2", "title": "高雄市．新興區至前鎮區", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識高雄市的幾個地方：新興區、前金區、苓雅區、前鎮區。」", "stops": [{"placeId": 319, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『新興區』這個地方，是怎麼來的嗎？新興原稱大港埔，因高雄河支流「𩻸港」（鯉魚港）流經此處未墾荒地（埔）而得名，戰後因區內蓬勃發展的新興氣象而改稱新興。", "新興區舊稱「大港埔」，相傳這條高雄河支流因棲息大量鯉魚（台語稱「𩻸仔」），加上民間流傳一則鯉魚精受媽祖庇佑、在此落地生根繁衍後代的傳說故事，這條支流因而被稱為「𩻸港」，沿岸未開墾的荒野平地則稱「𩻸港埔」，後演變為書寫較簡便的「大港埔」。台灣光復後，隨著這片區域逐漸繁榮發展，", "呈現一片新興蓬勃的氣象，政府便順勢將地名改為「新興區」，沿用至今。新興區因中山路、中正路口的大圓環（今高雄捷運美麗島站所在地）座落於此，加上五福商圈的興起，是高雄市區重要的商業與行政核心地帶，美麗島事件的歷史現場也位於本區境內。"], "quiz": {"q": "關於「新興區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "新興原稱大港埔，因高雄河支流「𩻸港」（鯉魚港）流經此處未墾荒地（埔）而得名，戰後因區內蓬勃發展的新興氣象而改稱新興。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！新興原稱大港埔，因高雄河支流「𩻸港」（鯉魚港）流經此處未墾荒地（埔）而得名，戰後因區內蓬勃發展的新興氣象而改稱新興。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 320, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『前金區』這個地方，是怎麼來的嗎？前金舊稱前矜，因面對鼓山、緊鄰愛河，取「面山矜河」之意而得名，另有部落依開發先後分為「前矜」「後矜」之說。", "前金區舊稱「前矜」，地名由來主要有兩種說法：第一種說法認為，這一帶因地理位置面對鼓山、緊鄰愛河（打狗川），先民取「面山矜河」的意境而得名「前矜」；第二種說法則從聚落發展先後出發，指這片區域最初分為「前矜」「後矜」兩個部落，其中前矜部落開發較早，逐漸發展成清代中葉統合而成的「前金庄」，", "「矜」與「金」發音相近，後續便簡化統一為較吉祥的「前金」。前金區地處高雄市區核心地帶，日治時期高雄州廳（今高雄市立歷史博物館）等重要官署設於此，加上五福商圈、大立百貨等商業機能，是高雄市行政文教與商業機能兼具的核心行政區。"], "quiz": {"q": "關於「前金區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "前金舊稱前矜，因面對鼓山、緊鄰愛河，取「面山矜河」之意而得名，另有部落依開發先後分為「前矜」「後矜」之說。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「前金區」市集而得名"], "correct": 1, "rightFb": "沒錯！前金舊稱前矜，因面對鼓山、緊鄰愛河，取「面山矜河」之意而得名，另有部落依開發先後分為「前矜」「後矜」之說。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 321, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『苓雅區』這個地方，是怎麼來的嗎？苓雅原稱苓仔寮，因清代漁民在此搭寮、以「苓仔」漁網捕魚曬網而得名，因地名欠雅，日治後改稱較文雅的苓雅寮。", "苓雅區舊稱「苓仔寮」，這個地名直接反映了當地早期的漁業活動：清代漁民習慣使用一種稱為「苓仔」的漁網具在此捕魚，並在岸邊搭建簡易草寮，作為曬網、整理漁獲的暫棲之所，因而得名「苓仔寮」。地方人士後來認為這個名稱不夠典雅，遂取諧音較為文雅的「能雅寮」，其後又改為「苓雅寮」，這一帶清代已是高雄地區重要的商業聚落，", "苓雅寮的商賈勢力甚至一度與鹽埕、旗後並駕齊驅。1946年，行政區域調整時，一度取「連續幽雅」之意定名「連雅區」，民國41年（1952年）再依市議會決議，改稱沿用至今的「苓雅區」。苓雅區因鄰近高雄軟體園區與夢時代購物中心，是高雄市重要的商業與住宅核心區域。"], "quiz": {"q": "關於「苓雅區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "苓雅原稱苓仔寮，因清代漁民在此搭寮、以「苓仔」漁網捕魚曬網而得名，因地名欠雅，日治後改稱較文雅的苓雅寮。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 2, "rightFb": "沒錯！苓雅原稱苓仔寮，因清代漁民在此搭寮、以「苓仔」漁網捕魚曬網而得名，因地名欠雅，日治後改稱較文雅的苓雅寮。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 322, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『前鎮區』這個地方，是怎麼來的嗎？前鎮因明鄭時期「援剿前鎮」部隊在此屯墾戍守而得名，是明鄭軍屯制度留下的地名見證。", "前鎮區地名源自明鄭時期的軍事屯田制度：鄭氏政權為鞏固台灣南部防務，派遣「援剿前鎮」部隊在此地屯墾戍守，這片由該部隊開闢的墾地，因而得名「前鎮」，與左營（左衝鎮）、燕巢（援剿中鎮、右鎮）等地同樣源自明鄭時期屯田制度下的軍事地名系統。境內前鎮港（前鎮河）自清代起便是重要的水路要道，", "可沿河上溯至下陂頭街（今鳳山區），是苓雅 ceneEmoji": "🌾", "pages": ["你知道『永安區』這個地方，是怎麼來的嗎？永安舊稱永安仔，因境內設有「新永安仔塭」與「舊永安仔塭」兩處魚塭，寓含永保平安之意，建鄉時遂以永安為地名。", "永安區舊稱「永安仔」，地名由來與當地的養殖漁業設施密切相關：這一帶境內設有「新永安仔塭」與「舊永安仔塭」兩處魚塭，「塭」是台灣沿海地區養殖魚蝦的人工水池，先民為這些魚塭命名時，特別選用寓含「永保平安」祝福之意的「永安」二字，反映了討海維生的漁民對出海作業、養殖經營平安順利的樸實期盼。建鄉之時，", "地方士紳便決定直接沿用這個充滿祝福意涵的「永安」，作為整個行政區的名稱。永安區地處高雄市西側濱海地帶，因鹽田與魚塭密布，加上永安漁港與台灣中油液化天然氣接收站的設立，是高雄市重要的漁業與能源產業重鎮。"], "quiz": {"q": "關於「永安區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["永安舊稱永安仔，因境內設有「新永安仔塭」與「舊永安仔塭」兩處魚塭，寓含永保平安之意，建鄉時遂以永安為地名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！永安舊稱永安仔，因境內設有「新永安仔塭」與「舊永安仔塭」兩處魚塭，寓含永保平安之意，建鄉時遂以永安為地名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 341, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『彌陀區』這個地方，是怎麼來的嗎？彌陀地名由來一說明鄭時期漢人在此供奉阿彌陀佛而得名，另一說源自古稱「瀰羅港」，可能是平埔族語言的音譯轉化。", "彌陀區地名由來主要有兩種說法：第一種說法指出，明鄭時期漢人移民入墾此地後，曾在當地供奉「阿彌陀佛」，信眾因而以佛號「彌陀」作為地名，寄託宗教信仰的虔誠；第二種說法則從語言學角度出發，指這一帶古稱「瀰羅港」，根據中央研究院學者的研究，這個古地名可能源自平埔族語言的音譯轉化，", "與佛教信仰未必有直接關聯。彌陀區地處高雄市西側濱海地帶，因潟湖與沙洲地形發達，是重要的虱目魚與烏魚養殖產地，加上彌陀漁港與海岸濕地生態，讓這個地名由來眾說紛紜的濱海鄉鎮，兼具漁業經濟與生態保育的多重面貌。"], "quiz": {"q": "關於「彌陀區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「彌陀區」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "彌陀地名由來一說明鄭時期漢人在此供奉阿彌陀佛而得名，另一說源自古稱「瀰羅港」，可能是平埔族語言的音譯轉化。"], "correct": 3, "rightFb": "沒錯！彌陀地名由來一說明鄭時期漢人在此供奉阿彌陀佛而得名，另一說源自古稱「瀰羅港」，可能是平埔族語言的音譯轉化。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 342, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『梓官區』這個地方，是怎麼來的嗎？梓官地名由來一說與修造船隻的官匠聚集有關，另一說因明鄭時期在地勢力最大者王梓，居民尊稱其為「梓官」而得名。", "梓官區地名由來主要有兩種說法：第一種說法認為，這一帶地名與修造船隻的官方工匠有關，相傳因負責修補軍用船艦的官匠聚集於此，因而得名「梓官」，「梓」在傳統工藝中常與木作、造船工匠相關聯；第二種說法則從人物角度出發，指鄭成功渡台後，這一帶以王梓的勢力最為顯赫，", "依循早年台灣民間對於有權勢、聲望之先民，慣於在其姓名後加一「官」字以示尊敬的習俗，居民尊稱王梓為「梓官」，這片區域便以此為地名。梓官區地處高雄市西側濱海地帶，因鄰近蚵仔寮漁港，是高雄市重要的漁業與海鮮餐飲聚落，享有「討海人的故鄉」美譽。"], "quiz": {"q": "關於「梓官區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "梓官地名由來一說與修造船隻的官匠聚集有關，另一說 aceId": 345, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『六龜區』這個地方，是怎麼來的嗎？六龜舊稱六龜里，一說源自鄒族支系芒仔芒社名譯音，一說因前後山巖相對形成六座山巖，狀似龜形而得名。", "六龜區舊稱「六龜里」，地名由來主要有兩種說法：第一種說法認為，「六龜里」一詞源自曹族（鄒族）四社番中「芒仔芒社」社名的音譯轉化；第二種說法則從地形出發，指這一帶前後山巖相對排列，恰好形成六座山巖，山勢輪廓神似烏龜的形狀，因而得名「六龜」，1920年簡化為「六龜」，", "沿用至今。六龜區地處荖濃溪中游山區，因溫泉資源豐富，寶來、不老溫泉等地是南台灣知名的溫泉觀光勝地，加上六龜山區盛產梅子、茶葉等高山農產，讓六龜成為兼具溫泉觀光與丘陵農業特色的山地鄉鎮，境內的六龜警備紀念公園，也見證了日治時期理蕃政策在這片山區留下的歷史痕跡。"], "quiz": {"q": "關於「六龜區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "六龜舊稱六龜里，一說源自鄒族支系芒仔芒社名譯音，一說因前後山巖相對形成六座山巖，狀似龜形而得名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 2, "rightFb": "沒錯！六龜舊稱六龜里，一說源自鄒族支系芒仔芒社名譯音，一說因前後山巖相對形成六座山巖，狀似龜形而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 346, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『甲仙區』這個地方，是怎麼來的嗎？甲仙舊稱甲仙埔，是阿里山四社番大武壟頭社人所建的聚落，地名可能是「傀儡楠梓仙」埔地一詞的縮讀簡化。", "甲仙區舊稱「甲仙埔」，這個地名的確切由來目前仍待進一步考證，一般認為是由阿里山四社番中「大武壟頭社」族人所建立的聚落發展而來；地方文史工作者推測，「甲仙埔」可能是「傀儡楠梓仙」（傀儡族在楠梓仙溪流域一帶的埔地）這個較長詞彙縮讀簡化而成的結果，因這一帶清代原是「傀儡番」（清代漢人對排灣、魯凱等族群的統稱）活動範圍，", "加上緊鄰楠梓仙溪。1920年簡化定名為「甲仙」，沿用至今。甲仙區地處楠梓仙溪上游山區，因氣候與土壤條件適宜，是台灣重要的芋頭產地，享有「芋筍之鄉」美譽，甲仙芋冰更是南台灣知名的地方特色美食，讓這個語源仍待考證的山區地名，發展出鮮明的農產與飲食文化印記。"], "quiz": {"q": "關於「甲仙區」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "甲仙舊稱甲仙埔，是阿里山四社番大武壟頭社人所建的聚落，地名可能是「傀儡楠梓仙」埔地一詞的縮讀簡化。"], "correct": 3, "rightFb": "沒錯！甲仙舊稱甲仙埔，是阿里山四社番大武壟頭社人所建的聚落，地名可能是「傀儡楠梓仙」埔地一詞的縮讀簡化。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [343, 344, 345, 346]}, {"id": "main-高雄市-9", "title": "高雄市．杉林區至桃源區", "kind": "main", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識高雄市的幾個地方：杉林區、內門區、茂林區、桃源區。」", "stops": [{"placeId": 347, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『杉林區』這個地方，是怎麼來的嗎？杉林舊稱山杉林，因這一帶原始景觀為山杉樹木蓊鬱蔥蘢、成林密布而得名。", "杉林區地名由來相對單純，源自當地早期的自然植被景觀：這一帶在漢人拓墾之前，原始山林中大量生長著杉木，樹林蓊鬱茂密、遮天蔽日，先民依此景觀特徵，將此地稱為「山杉林」，1920年簡化為「杉林」，沿用至今。杉林區地處楠梓仙溪沖積平原與丘陵交界地帶，因土壤肥沃，", "是高雄市重要的水稻、竹筍與香蕉產地。2009年八八
