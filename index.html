    ["高雄市","湖內區","大湖","湖內因境內有一處大湖沼、聚落建於湖岸內側而得名，另一說是合併長治、文賢兩地區名各取一字而成。","","湖內區地名由來主要有兩種說法：第一種說法認為，這一帶境內原有一處規模較大的湖沼濕地，先民選擇在湖岸內側地勢較高處建立聚落，因而得名「湖內」；第二種說法則從行政區劃合併的角度出發，指出這個地名可能是取「長治」（今大湖一帶）與「文賢」（今圍子一帶）兩個舊有地區名稱，各擷取部分字義組合而成。湖內區地處高雄市西南側濱海平原，因土壤與水文條件適宜，是台灣重要的番茄與蘆筍產地，加上鄰近的三奶壇慈濟宮等信仰中心，是高雄市典型的濱海農業鄉鎮，境內大湖遺址的考古發現，也顯示這片土地自史前時代便已有人類活動的悠久歷史。"],
    ["高雄市","茄萣區","茄萣樹","茄萣因地處一大片潟湖外側的沙嘴地帶，且早期遍生茄萣樹（海茄冬）而得名。","","茄萣區地名由來源自其獨特的海岸地形與植被：這一帶地處清代台江內海南側一大片潟湖外側的狹長沙嘴（沙洲）地帶，沙洲上廣泛生長著一種耐鹽的紅樹林植物「茄萣樹」（即海茄冬），先民依此植被特徵，將這片沙洲聚落稱為「茄萣」，沿用至今。茄萣區因濱臨台灣海峽，加上潟湖與潮間帶地形發達，自清代以來便是重要的漁業聚落，境內茄萣濕地是高雄市重要的候鳥棲息地，加上情人碼頭與台灣鯛（吳郭魚）養殖產業，讓這個因海茄冬樹得名的濱海鄉鎮，兼具生態保育與漁業經濟的雙重特色。"],
    ["高雄市","永安區","永安仔","永安舊稱永安仔，因境內設有「新永安仔塭」與「舊永安仔塭」兩處魚塭，寓含永保平安之意，建鄉時遂以永安為地名。","","永安區舊稱「永安仔」，地名由來與當地的養殖漁業設施密切相關：這一帶境內設有「新永安仔塭」與「舊永安仔塭」兩處魚塭，「塭」是台灣沿海地區養殖魚蝦的人工水池，先民為這些魚塭命名時，特別選用寓含「永保平安」祝福之意的「永安」二字，反映了討海維生的漁民對出海作業、養殖經營平安順利的樸實期盼。建鄉之時，地方士紳便決定直接沿用這個充滿祝福意涵的「永安」，作為整個行政區的名稱。永安區地處高雄市西側濱海地帶，因鹽田與魚塭密布，加上永安漁港與台灣中油液化天然氣接收站的設立，是高雄市重要的漁業與能源產業重鎮。"],
    ["高雄市","彌陀區","瀰羅港","彌陀地名由來一說明鄭時期漢人在此供奉阿彌陀佛而得名，另一說源自古稱「瀰羅港」，可能是平埔族語言的音譯轉化。","","彌陀區地名由來主要有兩種說法：第一種說法指出，明鄭時期漢人移民入墾此地後，曾在當地供奉「阿彌陀佛」，信眾因而以佛號「彌陀」作為地名，寄託宗教信仰的虔誠；第二種說法則從語言學角度出發，指這一帶古稱「瀰羅港」，根據中央研究院學者的研究，這個古地名可能源自平埔族語言的音譯轉化，與佛教信仰未必有直接關聯。彌陀區地處高雄市西側濱海地帶，因潟湖與沙洲地形發達，是重要的虱目魚與烏魚養殖產地，加上彌陀漁港與海岸濕地生態，讓這個地名由來眾說紛紜的濱海鄉鎮，兼具漁業經濟與生態保育的多重面貌。"],
    ["高雄市","梓官區","梓官","梓官地名由來一說與修造船隻的官匠聚集有關，另一說因明鄭時期在地勢力最大者王梓，居民尊稱其為「梓官」而得名。","","梓官區地名由來主要有兩種說法：第一種說法認為，這一帶地名與修造船隻的官方工匠有關，相傳因負責修補軍用船艦的官匠聚集於此，因而得名「梓官」，「梓」在傳統工藝中常與木作、造船工匠相關聯；第二種說法則從人物角度出發，指鄭成功渡台後，這一帶以王梓的勢力最為顯赫，依循早年台灣民間對於有權勢、聲望之先民，慣於在其姓名後加一「官」字以示尊敬的習俗，居民尊稱王梓為「梓官」，這片區域便以此為地名。梓官區地處高雄市西側濱海地帶，因鄰近蚵仔寮漁港，是高雄市重要的漁業與海鮮餐飲聚落，享有「討海人的故鄉」美譽。"],
    ["高雄市","旗山區","蕃薯寮","旗山原稱蕃薯寮，因清代初期移民在此搭寮種植蕃薯而得名，1920年因東北方旗尾山狀似清代蛟龍旗而改稱旗山。","","旗山區舊稱「蕃薯寮」，這個地名直接反映了清代初期移民的拓墾產業：先民入墾此地時，主要以種植蕃薯（甘藷）維生，並在田間搭建簡易草寮作為看顧作物與棲身之所，因而得名「蕃薯寮」。1920年，日本殖民政府推行地方行政改制，考量此地東北方有一座名為「旗尾山」的山峰，山勢起伏綿延，狀似清代軍旗上常見的蛟龍圖騰，遂取其山名意象，將「蕃薯寮」正式改稱「旗山」，沿用至今。旗山區因日治時期香蕉外銷興盛，享有「香蕉王國」美譽，境內保存完整的旗山老街（石拱迴廊亭仔腳建築）與旗山火車站（仿英國都鐸式建築），讓這個因蕃薯寮起家的山城小鎮，發展出獨具特色的歷史街區觀光資源。"],
    ["高雄市","美濃區","彌濃","美濃舊稱彌濃，一說源自曹族「美壟族」分布地，一說取自平埔族瀰力社與荖濃溪各一字，1735年林姓兄弟立碑「瀰濃」，日治時因懷念日本故鄉美濃而改今名。","","美濃區舊稱「彌濃」（瀰濃），地名由來眾說紛紜：一說指這一帶過去是曹族（鄒族）四社之一「美壟族」的分布領域；另一說則認為，地名可能取自平埔族「瀰力社」與鄰近「荖濃溪」的溪名，各擷取一字組合而成。清雍正13年（1735年），來自廣東的林姓兄弟渡海來此開墾，籌建土地伯公廟，其開基碑文上已可見「瀰濃」等字樣，「瀰濃」意謂當地水源豐沛、汲用不息，此後便正式定為庄名。甲午戰後，日本統治台灣期間，在台日人因思念故鄉日本九州「美濃市」山明水秀的景致，遂將「瀰濃」改稱發音相近的「美濃」，沿用至今。美濃因保存完整的客家六堆文化、紙傘工藝與美濃粄條聞名，是台灣客家文化的重要代表城鎮之一。"],
    ["高雄市","六龜區","六龜里","六龜舊稱六龜里，一說源自鄒族支系芒仔芒社名譯音，一說因前後山巖相對形成六座山巖，狀似龜形而得名。","","六龜區舊稱「六龜里」，地名由來主要有兩種說法：第一種說法認為，「六龜里」一詞源自曹族（鄒族）四社番中「芒仔芒社」社名的音譯轉化；第二種說法則從地形出發，指這一帶前後山巖相對排列，恰好形成六座山巖，山勢輪廓神似烏龜的形狀，因而得名「六龜」，1920年簡化為「六龜」，沿用至今。六龜區地處荖濃溪中游山區，因溫泉資源豐富，寶來、不老溫泉等地是南台灣知名的溫泉觀光勝地，加上六龜山區盛產梅子、茶葉等高山農產，讓六龜成為兼具溫泉觀光與丘陵農業特色的山地鄉鎮，境內的六龜警備紀念公園，也見證了日治時期理蕃政策在這片山區留下的歷史痕跡。"],
    ["高雄市","甲仙區","甲仙埔","甲仙舊稱甲仙埔，是阿里山四社番大武壟頭社人所建的聚落，地名可能是「傀儡楠梓仙」埔地一詞的縮讀簡化。","","甲仙區舊稱「甲仙埔」，這個地名的確切由來目前仍待進一步考證，一般認為是由阿里山四社番中「大武壟頭社」族人所建立的聚落發展而來；地方文史工作者推測，「甲仙埔」可能是「傀儡楠梓仙」（傀儡族在楠梓仙溪流域一帶的埔地）這個較長詞彙縮讀簡化而成的結果，因這一帶清代原是「傀儡番」（清代漢人對排灣、魯凱等族群的統稱）活動範圍，加上緊鄰楠梓仙溪。1920年簡化定名為「甲仙」，沿用至今。甲仙區地處楠梓仙溪上游山區，因氣候與土壤條件適宜，是台灣重要的芋頭產地，享有「芋筍之鄉」美譽，甲仙芋冰更是南台灣知名的地方特色美食，讓這個語源仍待考證的山區地名，發展出鮮明的農產與飲食文化印記。"],
    ["高雄市","杉林區","山杉林","杉林舊稱山杉林，因這一帶原始景觀為山杉樹木蓊鬱蔥蘢、成林密布而得名。","","杉林區地名由來相對單純，源自當地早期的自然植被景觀：這一帶在漢人拓墾之前，原始山林中大量生長著杉木，樹林蓊鬱茂密、遮天蔽日，先民依此景觀特徵，將此地稱為「山杉林」，1920年簡化為「杉林」，沿用至今。杉林區地處楠梓仙溪沖積平原與丘陵交界地帶，因土壤肥沃，是高雄市重要的水稻、竹筍與香蕉產地。2009年八八風災（莫拉克颱風）重創南台灣山區，杉林區月眉農場一帶因而興建「杉林大愛園區」，安置多個受災部落的居民，讓這個因杉木林蔭得名的山區鄉鎮，也承載著台灣近代重大風災的集體記憶與重建歷程。"],
    ["高雄市","內門區","羅漢門","內門舊稱羅漢門，源自馬卡道族對烏山山脈以東地區的稱呼，因清代在此駐兵設隘門而得名，以大崎為界分內外門。","","內門區舊稱「羅漢門」（羅漢內門），地名由來有兩種說法：第一種說法指出，「羅漢」一詞譯自平埔族馬卡道族對烏山山脈以東至楠梓仙溪一帶地區的稱呼，清代官府在此駐兵防守要道，因而加上「門」字；這片區域又以二仁溪與楠梓仙溪分水嶺上的「大崎」為界，以東稱「羅漢外門里」（今旗山一帶），以西則稱「羅漢內門里」，內門之名便由此而來。第二種說法則認為，是因曾有博學鴻儒隱居避世於此，故取名「羅漢門」，藉喻高人隱士雲集之地。內門區因宋江陣民俗文化與紫竹寺觀音信仰聞名全台，每年舉辦的「內門宋江陣嘉年華」是台灣重要的民俗文化盛事之一。"],
    ["高雄市","茂林區","多納/芒子社","茂林原稱多納，為日語「老人（老子）」的譯音，1957年因境內樹林茂密改稱茂林，另一說原名芒子社，因蚊蟲得名。","","茂林區地名由來有兩種說法：第一種說法指出，這一帶原稱「芒子社」（意近「蚊子社」），確切原意已不可考，後來可能因當地樹林茂盛而借用相近的字義轉為地名依據；第二種說法則指，日治時期此地稱為「多納」，是日語中意指「老人」或「老子」的譯音，反映魯凱族多納部落在此的悠久歷史。民國46年（1957年），政府考量境內山林茂密蔥鬱的自然景觀，將地名正式改為「茂林」，沿用至今，但「多納」之名仍保留作為境內知名部落與溫泉區的稱呼。茂林區因多納溫泉、紫斑蝶生態谷與魯凱族文化聞名，是高雄市著名的生態旅遊與原住民文化重鎮。"],
    ["高雄市","桃源區","雅你鄉","桃源原名雅你鄉，為布農族語「廣大」之意，1957年奉令取「世外桃源」的雅稱而改稱桃源。","","桃源區原名「雅你鄉」（Aini），是布農族語詞彙，意指「廣大」，反映這片位於荖濃溪上游的山地行政區幅員遼闊、群山環繞的地理特徵。民國46年（1957年），政府基於行政區劃命名雅化的考量，將原本音譯自布農族語的「雅你」，改為寓意「世外桃源」的「桃源」，這種將原住民語音譯地名替換為漢語吉祥意象的命名方式，在戰後台灣山地行政區重新命名的過程中相當普遍，也讓不少原有的原住民語地名逐漸被漢語雅稱取代。桃源區因南橫公路貫穿其間，加上梅山、藤枝等高山風景區，是高雄市面積最大、海拔落差最劇烈的山地原住民區，境內布農族部落文化與高山溫泉，是南橫公路沿線重要的生態與人文觀光資源。"],
    ["高雄市","那瑪夏區","三民鄉","那瑪夏原稱三民鄉，因境內民權、民族、民生三里皆冠「民」字、寓三民主義之意而得名，2008年因民眾要求正名為布農族語那瑪夏。","","那瑪夏區的地名演變，反映了台灣原住民族正名運動的歷程：戰後設鄉之初，因境內劃分有民權、民族、民生三個里別，皆冠有「民」字，地方政府便援引孫中山「三民主義」的政治理念，將這片以布農族、鄒族、排灣族居民為主的山地行政區，命名為「三民鄉」。隨著原住民族群自我認同意識抬頭，鄉民認為「三民」這個帶有漢人政治意涵的名稱，未能真正反映當地原住民族的文化主體性，經過長期的正名訴求，2008年正式將鄉名改為布農族語「那瑪夏」（Namasia），這個詞彙帶有部落起源與生命力的文化意涵，是台灣少數因原住民族正名運動而更改行政區名稱的成功案例。那瑪夏區因楠梓仙溪流域的高山溫泉與螢火蟲生態，是高雄市著名的生態旅遊山地原住民區。"],
    ["高雄市","哈瑪星","濱線","哈瑪星源自日語「濱線」（はません，Hamasen）音譯，因日治時期填海造陸興建通往港埠碼頭的臨港鐵路濱線而得名。","","哈瑪星地名直接借用自日語詞彙：日治時期，日本殖民政府在打狗港（今高雄港）西南側進行填海造陸工程，並鋪設一條連接縱貫鐵路與港埠碼頭的臨港鐵路支線，日語稱這種沿海岸鋪設、通往港埠的鐵路線為「濱線」（はません，讀音Hamasen），當地居民依台語發音直接音譯為「哈瑪星」，這片新生的填海市街便以此為名。哈瑪星是高雄現代化都市發展的起點，日治時期高雄州廳、警察署、驛站等重要機關皆設於此，是當時高雄最繁華的政經核心地帶，也是全台第一個依都市計畫概念興建的街區。如今哈瑪星因保存打狗鐵道故事館、武德殿等歷史建築，加上鄰近駁二藝術特區與西子灣，是高雄市重要的歷史街區與觀光景點。"],
    ["高雄市","愛河","打狗川/高雄川","愛河舊稱打狗川、高雄川，1948年因河畔一間「愛河遊船所」在颱風中招牌被吹落、僅存「愛河」二字而意外得名，成為高雄最浪漫的地標。","","愛河的名稱演變歷經多次更迭：清代文獻曾稱這條河為「硫磺水」「硫磺港」，日治時期因加以疏濬整治成運河，正式定名為「打狗川」，其後改稱「高雄川」，戰後初期沿用「高雄川」或稱「高雄河」。關於「愛河」這個充滿詩意名稱的由來，民間流傳最廣的說法是：民國37年（1948年），有人在河畔開設一間名為「愛河遊船所」的划船生意店家，供情侶划舟談情說愛，某次颱風過境，招牌上「遊船所」三字遭強風吹落，僅剩「愛河」二字懸掛橋畔，加上當地曾發生殉情事件經媒體以「愛河」為題報導，這個名稱便逐漸廣為流傳、深植人心。1970年，政府為向蔣中正夫婦祝壽，一度將河名改為「仁愛河」，1991年市議會順應民意，才又正式改回「愛河」，這段數度更名的歷程，恰好也映照出高雄近代政治社會的變遷軌跡。"],
    ["高雄市","駁二","第二號接駁倉庫","駁二源自「第二號接駁碼頭」倉庫，因日治時期興建、專供接駁轉運貨物的港埠倉庫群而得名，現已轉型為高雄重要的藝術特區。","","駁二地名由來相對單純直白：日治時期，高雄港區興建了一系列編號倉庫，專門作為貨物由船舶接駁上岸、轉運至鐵路或卡車的中繼儲放場所，這處倉庫因編號第二，被稱為「第二號接駁碼頭」倉庫，簡稱「駁二」。隨著高雄港區機能轉型，這些老舊倉庫一度面臨拆除命運，2000年代起，在地方文史工作者與藝術家的倡議下，市政府決定保留倉庫建築群並加以活化再利用，轉型為結合當代藝術展演、文創商店與親子遊憩空間的「駁二藝術特區」，是台灣港埠倉庫活化再生的成功典範之一。如今駁二因鄰近哈瑪星、西子灣與輕軌路線，已成為高雄市最具代表性的文創觀光地標，也是每年跨年城市光廊活動的重要場域。"],
    ["高雄市","西子灣","洋路灣","西子灣舊稱洋路灣，因日治時期文人取其夕陽美景媲美中國西湖、雅稱「西子」而得名，是高雄著名的夕陽觀賞勝地。","","西子灣地名由來主要有兩種說法：一說認為原名與「斜陽」的閩南語發音演變有關，因這處海灣以絕美的夕陽落日景致聞名，「斜陽」逐漸轉化為更具詩意的「西子」；另一說則指出，這一帶原稱「洋路灣」，可能與清代對外通商的洋人往來路徑有關，日治時期文人雅士見此地海灣景致秀麗，取中國古代美女「西施」（西子）的雅稱為喻，將「洋路灣」改稱「西子灣」，藉以比擬其如西湖般的秀麗風光。西子灣因鄰近國立中山大學與打狗英國領事館文化園區，加上礁岩海岸與絕佳的夕陽視野，是高雄市最富盛名的濱海觀光勝地之一，「西子灣夕照」更是高雄八景中歷久不衰的經典景致。"],
    ["高雄市","後勁","後勁","後勁因明鄭時期部隊在此駐紮屯墾，作為前線部隊的後備勁旅而得名，是明鄭軍屯地名系統的一員。","","後勁地名同樣源自明鄭時期的軍事屯田制度：鄭氏政權在此地駐紮部隊屯墾，作為支援前線作戰部隊的後備勁旅，因而得名「後勁」，與左營（左衝鎮）、前鎮（援剿前鎮）、仁武（仁武鎮）等地，共同構成高雄地區明鄭軍屯地名系統的重要一環，反映了鄭氏政權在這片土地上建立軍事屯墾防線的歷史佈局。後勁地處楠梓區境內，因鄰近後勁溪與中油高雄煉油廠（原日治時期海軍第六燃料廠），是台灣石化工業發展史上重要的產業地標；1987年，後勁居民為抗議煉油廠污染與遷廠承諾未兌現，發起長達多年的反五輕運動，是台灣環境運動史上重要的社區自主抗爭案例，讓這個源自明鄭屯田的古老地名，在當代台灣環保運動史上留下深刻印記。"],
    ["高雄市","凹子底","凹子底","凹子底因當地地勢中央低窪、四周較高，狀似凹陷的盆地地形而得名。","","凹子底地名由來相對直白，源自當地的地形特徵：這一帶因周邊地勢略高、中央區域相對低窪，形成類似淺盆的凹陷地形，先民依此地貌特徵，將此地稱為「凹子底」，意指位於凹陷地形底部的聚落，這種依地勢高低直接命名地方的方式，在台灣各地相當常見。凹子底地處高雄市鼓山區與左營區交界地帶，因高雄捷運紅線凹子底站的設置，加上凹子底森林公園、農十六重劃區的開發，已從原本低窪的農業地帶，轉型為高雄市近年發展最為蓬勃的新興住宅與商業重劃區之一，高雄市立圖書館總館等地標建築也座落於此，讓這個描述地形的舊地名，發展出與過去截然不同的現代都會風貌。"],
    ["高雄市","內惟","內惟","內惟因清代此地設有防禦性柵欄（惟），聚落建於柵欄內側而得名，境內內惟埤現已闢為美術館公園。","","內惟地名由來源自清代的聚落防禦設施：「惟」在此處意指柵欄或圍籬一類的防禦性建物，這一帶清代因鄰近漢人與原住民接觸的前緣地帶，先民為求自保，在聚落周圍設置柵欄防禦，這處建於柵欄內側的聚落，因而得名「內惟」。內惟境內原有一處埤塘「內惟埤」，是重要的灌溉水源，如今這片埤塘已整治闢建為「內惟埤文化園區」，園區內坐落著高雄市立美術館、雕塑公園等藝文設施，加上鄰近的忠烈祠、英國領事館舊址等歷史古蹟，讓內惟從清代具有防禦機能的柵欄聚落，轉型為高雄市重要的藝術文化與生態休憩重鎮，也讓埤塘與藝術館舍相互輝映，成為高雄市區獨特的水岸文化地景。"],
    ["高雄市","九曲堂","九曲堂","九曲堂因下淡水溪（今高屏溪）流經此處河道曲折蜿蜒、形成多處水塘而得名，是台灣鐵路史上重要的舊鐵橋所在地。","","九曲堂地名由來源自當地的河川地形特徵：下淡水溪（今高屏溪）流經此處時，因地勢與地質因素形成多處曲折蜿蜒的河道與水塘，先民依此蜿蜒曲折的水文景觀，將此地稱為「九曲堂」，「堂」在此可能指匯聚成塘的水域。九曲堂因地處下淡水溪西岸，是日治時期糖業鐵道與縱貫鐵路的重要交會點，1913年完工的下淡水溪鐵橋（今高屏舊鐵橋），是當時亞洲第一長的鐵路橋樑，連接九曲堂與屏東地區，對台灣南部的糖業運輸與城鄉往來貢獻卓著。如今舊鐵橋雖已功成身退，卻與周邊的鐵橋濕地公園共同保存下來，成為認識台灣鐵道工程史與高屏溪流域生態的重要景點，讓這個因河道曲折得名的地方，留下深刻的近代交通建設記憶。"],

    // --- 【屏東縣】 ---
    ["屏東縣","屏東市","阿猴","屏東市舊稱阿猴，源自平埔族馬卡道族「阿猴社」譯音，日治因猴字不雅改阿緱，後因地處半屏山（一說翠屏山）之東改稱屏東。","","屏東市舊稱「阿猴」，源自平埔族馬卡道族「阿猴社」（Akauw）的社名音譯，根據荷蘭時代戶口表記載，早在1647年便已出現「阿猴社」之名，可能是1636年從大崗山附近遷來的搭加里揚社改社名而成，是鳳山八社之一。1836年，仕紳集資興建城牆與四座城門以防禦盜賊械鬥，形成「阿猴城」。1905年，日本殖民政府考量「猴」字不甚雅觀，將字部件由「犭」改為「糸」，寫作「阿緱」。1920年，官方進一步以境內清嘉慶年間興建的「屏東書院」（今屏東孔廟）為靈感，正式改稱「屏東」；至於「屏」字的確切由來，一說是因地處高雄「半屏山」以東，另一派學者則主張應是因鄰近鳳山「翠屏岩」（觀音山）而得名，兩說法至今仍有爭議。屏東市因日照時數全台最長，享有「太陽城」美譽。"],
    ["屏東縣","潮州鎮","潮州(廣東原鄉)","潮州因清雍正4年廣東潮州府移民入墾此地，為紀念原鄉故里而沿用「潮州」為地名。","","潮州鎮地名由來，是台灣地名中典型的「移民懷鄉命名」案例：清雍正4年（1726年），來自廣東省潮州府的客家移民陸續渡海來到這片土地開墾定居，為了紀念自己的原鄉故里，便將新墾聚落直接命名為「潮州」，沿用至今，這種將原鄉地名移植到台灣新墾地的命名方式，與屏東佳冬（原稱源自原鄉茄苳）、台南東石（源自福建晉江東石鎮）等地名，屬於相同的思鄉命名邏輯。潮州鎮地處屏東平原中心地帶，因鐵路潮州線設站，加上地理位置適中，是屏東縣南部重要的交通樞紐與商業中心，境內的潮州鎮民族路夜市與胡家古厝等地標，也讓這個承載廣東移民鄉愁的城鎮，發展出屏東平原重要的生活機能核心地位。"],
    ["屏東縣","東港鎮","東津","東港舊稱東津，因清代帆船停靠港區恰好位於居民定居地東側而得名，另一說因位居中國大陸東方海港而得名。","","東港鎮地名由來主要有兩種說法：第一種說法指出，這一帶原是平埔族「放索社」的聚落領域，明末清初漸有漢人渡海而來，與福建的商業往來日益興盛，當時帆船停靠的港區恰好位於百姓定居地的東側，因而得名「東港」，古稱「東津」，「津」意指海邊渡口；第二種說法則從方位出發，認為是因這處港口位居中國大陸的東方海域而得名。東港鎮憑藉優良的漁港條件，是台灣黑鮪魚與櫻花蝦的重要產地，享有「黑鮪魚的故鄉」美譽，每年舉辦的黑鮪魚文化觀光季吸引大量遊客。境內的東隆宮迎王平安祭典（燒王船），是台灣王爺信仰中規模最盛大的祭典之一，已登錄為國家重要民俗，讓東港兼具漁業經濟與民間信仰的雙重文化底蘊。"],
    ["屏東縣","恆春鎮","瑯嶠","恆春舊稱瑯嶠，源自排灣族語對當地蘭科植物的稱呼，1874年牡丹社事件後，沈葆楨見此地四季如春而奏請設縣，改稱恆春。","","恆春鎮舊稱「瑯嶠」，這個地名源自排灣族語對當地盛產的一種蘭科植物的稱呼，也是排灣族對這片區域的傳統稱呼。同治13年（1874年），日本藉牡丹社事件出兵攻打台灣南部原住民部落，事件平息後，欽差大臣沈葆楨親自巡視這片土地，見當地氣候溫暖宜人、四季如春，加上此地戰略位置重要，便奏請清廷在此設縣，並取「四季恆春」之意，正式將「瑯嶠」改稱「恆春」，同時興建恆春古城，是台灣少數保存完整的清代縣城城垣之一。恆春因擁有國境之南的絕美海岸線與墾丁國家公園，加上恆春民謠與思想起等傳統音樂文化，是台灣最富盛名的度假觀光勝地，每年吸引大量國內外遊客造訪。"],
    ["屏東縣","萬丹鄉","萬舟","萬丹地名由來一說因清代商船在萬丹溪貿易形成萬舟景觀、後諧音改丹，一說源自西拉雅平埔族「上下淡水社」合稱音譯。","","萬丹鄉地名由來主要有兩種說法：第一種說法指出，清同治年間，兩岸商船經常在萬丹小溪（今大湖橋一帶）進行貿易往來，形成內港榮景，當時船隻雲集、蔚為「萬舟」景觀，因而得名，後來因高雄港、東港相繼興起，萬丹港逐漸沒落，「舟」字才改為諧音的「丹」字；第二種說法則認為，這一帶原是西拉雅平埔族的居住地，「萬丹」可能是當地「Moanun社」與「上下淡水兩社」（Paugdaudang）名稱合併音譯而來。萬丹鄉地處屏東平原核心地帶，因土壤肥沃，是全台重要的紅豆與棗子產地，享有「紅豆的故鄉」美譽，每年舉辦紅豆牛奶節推廣地方農特產，讓這個曾經舟楫雲集的內港市街，轉型為屏東平原重要的農業重鎮。"],
    ["屏東縣","長治鄉","長興","長治舊稱長興，可能源自清代拓墾時期的墾號名稱，戰後取「長治久安」之意改稱長治。","","長治鄉這一帶原是西拉雅平埔族的傳統居住地之一，明清時期及台灣光復前後，陸續有大批漢人移入開墾，光復之前這片區域稱為「長興庄」，「長興」一詞可能源自當初拓墾組織的墾號名稱，寄託墾民期盼事業長久興旺的願景。台灣光復後，地方基於期盼社會「長治久安」的願景，正式將「長興」改稱為「長治」，沿用至今，這種截取原有地名部分字義、賦予新政治期許意涵的命名方式，在戰後台灣地名演變中相當常見。長治鄉地處屏東平原北側，因土壤肥沃、氣候溫和，是重要的檳榔、蓮霧與網室木瓜產地，加上屏東科技大學等院校進駐，是屏東縣北側重要的農業與文教重鎮。"],
    ["屏東縣","麟洛鄉","玲路","麟洛因清康熙年間客籍墾首開圳時掘出大烏龜，地理師認為「麟趾呈祥」而得名，原為西拉雅族麟洛社所在地。","","麟洛鄉這一帶原是西拉雅平埔族的傳統活動領域，可能存在一處稱為「麟洛」的平埔族社，清代文獻曾記為「玲路」。清康熙年間，來自廣東嘉應州的客籍先賢徐俊良率眾來此開墾，在開鑿灌溉水圳的過程中，意外挖掘出一隻大烏龜，當時的地理師認為，凡是出現大龜之地，必定也會有麒麟出沒，是「麟趾呈祥」的風水寶地，於是取地名為「麟落庄」，後來才改稱發音相近的「麟洛」，沿用至今，這種因風水傳說命名地方的方式，在台灣客家聚落地名中頗具特色。麟洛鄉地處屏東平原北側客家六堆文化區範圍內，是重要的檳榔與蓮霧產地，保留完整的客家夥房建築與傳統習俗。"],
    ["屏東縣","九如鄉","九塊厝","九如舊稱九塊厝，相傳最初由九戶人家遷來此地定居而得名，因「九塊」不雅，取《詩經》「三多九如」之意改稱九如。","","九如鄉舊稱「九塊厝」，這個地名直接反映了清代拓墾初期的聚落規模：相傳最初僅有九戶人家遷居至此開墾定居，因而以實際戶數為地名，這種依開墾戶數命名地方的方式，與高雄五塊厝、六腳鄉六家佃等地名，屬於相同的計量式命名邏輯。地方人士後來有感「九塊」二字過於直白、不夠典雅，遂取《詩經．小雅》中「如山如阜，如岡如陵，如川之方至，以莫不增；如月之恆，如日之升，如南山之壽，不騫不崩；如松柏之茂，無不爾或承」典故中連用九個「如」字祝壽的「三多九如」吉祥寓意，將地名改為「九如」，既保留原本的「九」字，又賦予長壽吉祥的美好祝願。九如鄉地處隘寮溪沖積扇，是屏東縣重要的椰子與檸檬產地。"],
    ["屏東縣","里港鄉","阿里港","里港舊稱阿里港，相傳一名為「阿里」的年輕人在此販賣冷飲起家、帶動商業繁榮而得名，另一說源自魯凱族「傀儡」音譯。","","里港鄉舊稱「阿里港」，地名由來主要有兩種說法：第一種說法帶有濃厚的生活趣味，相傳清康熙年間，一名喚作「阿里」的年輕人來到此地謀生，以販賣冷飲維生，隨著人潮聚集、商業逐漸繁榮，乾隆年間這處聚落便以「阿里港」為名；第二種說法則從族群角度出發，指漢人與平埔族尚未移入之前，曾有清代文獻稱為「傀儡」的原住民族群（可能是魯凱族）居住於此，漢人依其族稱音譯為「阿里」，加上聚落建於隘寮溪之南，因而合稱「阿里港」。1920年，日本殖民政府簡化為「里港」，沿用至今。里港鄉因黑豆與粄條聞名，是屏東平原北側重要的客家與河洛族群交融的農業鄉鎮。"],
    ["屏東縣","鹽埔鄉","鹹埔莊","鹽埔因明代福建移民以十車食鹽外加菸酒火柴，向平埔族換取這片位於山地與平原間的荒埔而得名，另一說因溪埔地含鹽分重而得名。","","鹽埔鄉地名由來主要有兩種說法：第一種說法帶有濃厚的交易色彩，相傳明代福建移民葉唐山，以十台車份量的食鹽，外加一車菸酒火柴，向原本居住此地的平埔族交換這片介於山地與平原之間的草埔地，因當地地形屬於「埔」（未開墾的草原地帶），加上是以食鹽交換而來，因而得名「鹽埔」；第二種說法則從土壤特性出發，指這一帶溪埔地含鹽分較重，故稱「鹹埔莊」，後來才改稱較為文雅的「鹽埔」。鹽埔鄉地處隘寮溪沖積平原，因土壤肥沃，是屏東縣重要的檳榔、椰子與蜜棗產地。"],
    ["屏東縣","高樹鄉","大車路","高樹原名大車路，因道路寬闊可容多輛牛車並行而得名，另有一說因庄頭大木棉樹高聳如車蓋，或因高地河階水量充沛、林木高大而改稱高樹。","","高樹鄉原名「大車路」，因這條聯外道路寬闊，可同時容納多輛牛車並行通過而得名。關於後來改稱「高樹」的原因，主要有兩種說法：一說是庄頭曾有一株高大的木棉樹，樹身雄偉挺拔，樹冠形狀宛如一頂碩大的車蓋，因而得名「高樹」；另一說則從地理環境出發，指漢人開墾初期，選擇在地勢較高的河階台地建立聚落，加上這一帶河川網絡縱橫、水量充沛，孕育出高大茂密的樹林景觀，因而得名。高樹鄉地處隘寮溪沖積扇頂端，因水源豐沛、土壤肥沃，是屏東縣重要的鳳梨與檳榔產地，也是全台最大的檳榔產區之一。"],
    ["屏東縣","萬巒鄉","萬鰻","萬巒地名一說因先民見大武山峰巒綿延如萬座山巒而得名，一說因當地盛產鰻魚，「萬鰻」因客語發音近似轉為萬巒。","","萬巒鄉地名由來主要有兩種說法：第一種說法充滿詩意，相傳先民初入墾此地時，遙望大武山脈翠峰綿延起伏，宛如萬座山巒層疊而立，因而以「萬巒」為地名；第二種說法則帶有生活趣味，指清代這一帶溪流水塘中隨處可捕捉到鰻魚，居民因而稱此處為「萬鰻」，因客家話中「鰻」與「巒」發音十分相近，逐漸演變為今日的「萬巒」。萬巒鄉是屏東縣客家六堆文化區的核心聚落之一，以萬巒豬腳聞名全台，加上萬金天主堂（台灣現存最古老的天主教堂之一）與五溝水客家聚落，讓萬巒兼具客家傳統文化與多元宗教信仰的豐富人文底蘊。"],
    ["屏東縣","內埔鄉","內埔","內埔因先民在茂密森林中開闢出的旱田（客語稱埔），且位於森林內部而得名，清康熙年間由閩粵移民墾成。","","內埔鄉地名由來相對直白：這一帶早年是一片茂密的原始森林，最早入墾的先民在森林中間披荊斬棘，開闢出一片可耕作的旱田，客家話稱這種未開墾轉而闢成的旱地為「埔」，因這片埔地深藏於森林內部，因而得名「內埔」，意指位居內側森林之中的未墾埔地，清康熙年間由閩、粵籍移民共同開墾而成。內埔鄉是屏東縣客家六堆文化區中「後堆」的核心聚落，境內的六堆天后宮、內埔老街與台灣糖業博物館，加上檳榔、可可等農產，讓內埔成為認識屏東客家拓墾史與六堆聯防文化的重要據點。"],
    ["屏東縣","竹田鄉","頓物庄","竹田舊稱頓物，因是商家囤積貨物（頓物）之處而得名，日治時期因竹林多於水田而改稱竹田。","","竹田鄉地名由來主要有兩種說法：第一種說法指出，這一帶清代曾有一條熱鬧街道，路旁商家習慣在此囤積存放各類貨品物資，「頓物」在此意指堆放囤積貨物，因而得名「頓物庄」，日治時期考量此地竹林分布多於水田，取「竹是農村、田是農田」的意象，將地名改為「竹田」；第二種說法則認為，本地原稱「頓物潭」，昔日有池沼濕地，是居民丟棄廢棄雜物之處，故有此稱，1920年同樣改稱較為典雅的「竹田」。竹田鄉是屏東縣客家六堆文化區中「中堆」的核心聚落，境內竹田火車站與西勢忠義祠（六堆忠義祠），是了解客家先民拓墾與聯防歷史的重要地標。"],
    ["屏東縣","新埤鄉","新埤頭","新埤因清代客家移民興建人工蓄水池（埤）後，在其前方建立新聚落，與內埔鄉老埤南北對稱而得名新埤頭，日治簡化為新埤。","","新埤鄉地名由來源自清代客家移民的水利拓墾工程：先民為了灌溉農田，在此興建人工蓄水池「埤」，並在埤塘前方建立新的聚落，因與內埔鄉境內另一處較早開發的「老埤」（老埤頭）南北相互對稱，這處新建的聚落便被稱為「新埤頭」，1920年，日本殖民政府推行地方行政改制，簡化去除「頭」字，改稱「新埤」，沿用至今。新埤鄉是屏東縣客家六堆文化區中「先鋒堆」的所在地，因土壤與氣候條件適宜，是台灣重要的檳榔與蓮霧產地，境內的餉潭、萬隆等聚落，也保留著客家先民依水築埤、拓墾定居的歷史記憶。"],
    ["屏東縣","枋寮鄉","枋仔樹","枋寮因清初此地林木茂盛、盛產可製木板的檀木（俗稱枋仔樹），先民砍伐後搭建工寮暫住而得名。","","枋寮鄉地名由來相對直白：清代初期，這一帶山林茂密，盛產一種質地優良、可製作木板的樹種「檀木」，當地俗稱這類木材為「枋仔樹」，先民入墾時，砍伐這些樹木製成木板，並就地搭建簡易工寮暫時棲身，隨著人口聚集逐漸發展成聚落，因而得名「枋寮」，意指以木板搭建工寮居住之地。枋寮鄉地處屏東縣西南沿海地帶，是南迴鐵路與南迴公路的重要起點，因鄰近台灣海峽，是黑珍珠蓮霧與漁業養殖的重要產地，享有「黑珍珠的故鄉」美譽，加上枋寮鐵路藝術村，讓這個因搭建木板工寮得名的聚落，發展成屏東縣南側重要的交通門戶與農漁業重鎮。"],
    ["屏東縣","新園鄉","新園","新園因明末福建移民將高屏溪畔原野開墾為新闢的田園（旱田）而得名。","","新園鄉地名由來相對單純：明末，來自福建的黃姓等移民渡海來到高屏溪畔，將這片原本荒蕪的原野逐步開墾為可耕作的田園，至清乾隆年間，這片墾地大多已開發完成，並陸續形成多個村莊聚落，因這些村莊是建立在新闢成的田園（旱田稱為「園」）之上，因而得名「新園」，沿用至今。新園鄉地處高屏溪出海口北岸，因土壤肥沃、水源充足，是屏東縣重要的水稻與蓮霧產地，境內的鹽埔漁港與高屏溪畔的自行車道，也讓新園兼具傳統農業聚落與濱溪休閒觀光的雙重風貌。"],
    ["屏東縣","崁頂鄉","崁頂","崁頂因地勢較周邊高亢，雨季河水氾濫時此處不易淹水，故取「地勢高聳頂端」之意得名。","","崁頂鄉地名由來源自其獨特的地形優勢：這一帶四周地勢低平，加上河流經過，每逢雨季容易氾濫成災，唯獨這處聚落所在的位置地勢較為高亢，即使暴雨來襲也少受水患侵擾，先民依此優越的地理條件，將此地稱為「崁頂」，取其「地勢高聳、宜於居住的頂端之地」之意，這種依相對地勢高低命名地方、藉以凸顯免受水患威脅優勢的方式，在台灣沿海與河濱平原地帶相當常見。崁頂鄉地處東港溪下游沖積平原，因土壤肥沃，是屏東縣重要的水稻與蓮霧產地，也是屏東平原南側典型的農業鄉鎮之一。"],
    ["屏東縣","林邊鄉","林仔邊","林邊因這一帶早期林木茂盛，先民在森林邊緣地帶建立聚落而得名，日治時期統一稱為林邊。","","林邊鄉地名由來與大樹區、林園區等地相似，皆源自早期茂密的森林景觀：這一帶在漢人拓墾之初，原是林木蔥鬱的原始林地，先民考量深入林地開墾風險較高，選擇在森林邊緣地帶建立聚落、逐步向內拓展，因而得名「林仔邊」，日治時期以「林邊」統一稱呼這處行政區，沿用至今。林邊鄉地處東港溪與林邊溪之間的沿海沖積平原，因地勢低窪，加上地層下陷問題，早年曾因養殖漁業超抽地下水而導致嚴重水患，如今則以蓮霧、櫻花蝦及淺坪式養殖漁業聞名，境內崎峰社區更以彩繪村活化滯洪池周邊社區，讓林邊從水患陰影中逐步轉型為兼具農漁業與社區營造特色的濱海鄉鎮。"],
    ["屏東縣","南州鄉","溪州","南州原名溪州，因位於溪流沖積沙洲（溪州）南岸而得名，因台灣多地皆稱溪州易生混淆，加上地處台灣南端而改稱南州。","","南州鄉原名「溪州」，因這片區域地處東港溪沖積沙洲南岸地帶，先民依此地形特徵，將此地稱為「溪州」，最初隸屬於林邊鄉管轄，後來才劃分出來獨立設鄉。由於台灣各地有為數不少同樣稱為「溪州」的地名（如彰化縣亦有溪州鄉），容易造成行政區劃與郵務往來的混淆，加上這處溪州地處屏東平原南端，地方遂決定將鄉名改為「南州」，既保留原本方位的意涵，又能與台灣其他溪州地名有所區隔。南州鄉因土壤肥沃，是屏東縣重要的甘蔗、蓮霧與檳榔產地，境內南州糖廠舊址與鐵馬道，也讓南州保留了部分糖業歷史的產業記憶。"],
    ["屏東縣","佳冬鄉","茄苳腳","佳冬原稱六根，因當地遍植茄苳樹而稱茄苳腳，日治時期因台語「茄苳」與日語「佳冬」發音相近而改稱佳冬。","","佳冬鄉舊稱「六根」，另一說地名源自當地馬卡道族「茄藤社」，因「茄藤」與樹名「茄苳」發音相近，加上這一帶開拓初期四周遍植茄苳樹，因而得名「茄苳腳」，意指茄苳樹下的聚落。日治時期推行地方行政簡化改制，因台語「茄苳」的發音與日語「佳冬」（かとう）十分相近，遂以同音異義的方式，將地名正式改為「佳冬」，沿用至今，這種因語音相近而改字、卻與原始茄苳樹意涵脫鉤的命名演變，與燕巢（援剿諧音）屬於相似的案例。佳冬鄉是屏東縣客家六堆文化區中「左堆」的核心聚落，境內佳冬蕭家古厝是台灣保存最完整的五堆式客家夥房建築之一，也是國定古蹟。"],
    ["屏東縣","琉球鄉","小琉球","琉球即小琉球，因島嶼形似一顆漂浮海面的圓球、面積狹小而得名，相傳清乾隆年間高雄漁民李月老最早登島開墾。","","琉球鄉地名由來相對直白：這座位於屏東縣西南外海的珊瑚礁島嶼，因整體輪廓渾圓，遠望宛如一顆漂浮在海面上的球體，加上面積狹小，因而得名「小琉球」，以與更早見於史籍、指稱台灣本島或琉球群島的「大琉球」有所區別。相傳清乾隆20年（1755年），一位居住在打狗港（今高雄港）、名叫李月老的漁民，最早登上這座孤島從事開墾與漁業活動，逐漸吸引更多移民前來定居。1920年，日本殖民政府簡化地名為「琉球鄉」，沿用至今。琉球鄉因擁有花瓶石、美人洞等珊瑚礁地質景觀，加上綠蠵龜棲息海域，是台灣離島觀光與生態保育的重要據點。"],
    ["屏東縣","車城鄉","車城","車城因清代先民為抵禦原住民攻擊，以載運農作物的牛車環繞聚落圍成防禦城牆而得名。","","車城鄉地名由來，源自清代先民就地取材的防禦智慧：這一帶因地處恆春半島前緣，時常面臨原住民出草侵擾的威脅，先民便將平日用來載運農作物的牛車，環繞聚落排列圍成臨時防禦城牆，抵禦外敵攻擊，因而得名「車城」；民間也流傳先民曾在一次遭遇突襲的危急時刻，急中生智以牛車圍城成功擊退攻勢，因而以此命名紀念這段驚險的拓墾歷程。車城鄉因地處恆春半島門戶，福安宮（土地公廟）是全台規模最大的土地公廟之一，加上四重溪溫泉與國立海洋生物博物館，是恆春半島北側重要的信仰、溫泉與海洋教育觀光重鎮。"],
    ["屏東縣","滿州鄉","蚊蟀埔","滿州原稱蚊蟀埔，源自排灣族語形容獵獲過剩、棄置腐爛發出臭氣的譯音，因字義不雅，1920年改稱滿州。","","滿州鄉舊稱「蚊蟀埔」，這個地名由來頗具生活趣味：這一帶原是排灣族的傳統獵場，族人狩獵豐收時，往往獵獲數量遠超過所需食用份量，多餘的獵物只能棄置在原野上任其腐敗，日積月累造成陣陣難聞的臭氣瀰漫，排灣族語中形容「臭氣」的詞彙音譯為「蚊蟀」，這片區域因而得名「蚊蟀埔」。1920年，日本殖民政府推行地方行政改制，考量「蚊蟀」二字字義不甚雅觀，遂以同音異義的方式，改稱較為中性文雅的「滿州」，沿用至今。滿州鄉因位處恆春半島東側，是台灣賞鷹勝地，每年秋季灰面鵟鷹過境時吸引大量賞鳥人士造訪，加上港口吊橋與哭麒麟等自然景觀，是恆春半島重要的生態觀光鄉鎮。"],
    ["屏東縣","枋山鄉","崩山","枋山相傳因古時附近有山突然崩裂而稱崩山，因字義不吉，取閩南語諧音改稱枋山。","","枋山鄉地名由來，相傳與一起古代山崩事件有關：這一帶附近曾有一座山頭無預警發生大規模崩裂，先民目睹這起驚人的自然災變後，便將此地命名為「崩山」，直接記錄下這段山崩的歷史記憶。然而，「崩山」二字帶有不祥的意涵，容易讓人聯想到災禍與厄運，地方後來便以閩南語發音相近的「枋山」取代，既保留原本的地名發音，又避開了「崩」字的負面聯想，這種因避諱不吉字義而改用諧音字的命名方式，在台灣地名演變中相當常見。枋山鄉地處恆春半島西側沿海，因南迴公路貫穿其間，加上愛文芒果與洋蔥產業，是連接屏東平原與恆春半島的重要交通門戶。"],
    ["屏東縣","三地門鄉","音斯笛摩兒","三地門原名音斯笛摩兒，是魯凱族「三地門社」聚落，舊稱山豬毛社，光復後取其漢譯簡稱三地鄉，後改為三地門鄉。","","三地門鄉地名源自原住民族語音譯：這片山區原是魯凱族「三地門社」的傳統聚落所在地，原名「音斯笛摩兒」（或譯音斯的摩兒），舊時漢人也稱這一帶為「山豬毛社」，反映此地山林間野豬出沒頻繁的生態特徵。台灣光復後，這片區域正式設鄉，取原住民語地名的漢譯簡稱，定名為「三地鄉」，後來才改稱更貼近原名發音的「三地門鄉」，沿用至今。三地門鄉因是進入北大武山區的門戶要衝，加上排灣族與魯凱族多元的石板屋建築、琉璃珠工藝與原住民文化園區，是屏東縣最具代表性的原住民文化與生態觀光重鎮之一。"],
    ["屏東縣","霧台鄉","霧臺社","霧台原為魯凱族「傀儡」群霧臺社所在地，魯凱語意指由許多小社聚集而成的大社。","","霧台鄉地名源自魯凱族語彙：這片山區原是清代漢人文獻中稱為「傀儡」族群（即今魯凱族）的傳統領域，境內的「霧臺社」在魯凱族語中，意指由多個規模較小的部落聚落，共同匯聚組合而成的一個規模較大的社群，反映了魯凱族傳統社會中部落聯合的組織型態。台灣光復後，這片區域獨立設鄉，直接沿用原有的部落名稱「霧臺」，定名為「霧台鄉」。霧台鄉地處中央山脈南段深山，是屏東縣海拔最高、也是屏東縣境內魯凱族的主要分布區域，境內好茶部落的石板屋聚落遺址（舊好茶）已列為國定古蹟，加上神山部落、阿禮部落等傳統聚落，讓霧台成為台灣魯凱族文化保存最完整的重要據點。"],
    ["屏東縣","瑪家鄉","瑪家雜牙雜牙","瑪家原為西排灣族「瑪家雜牙雜牙」社所在地，排灣語意指傾斜的山坡地。","","瑪家鄉地名源自排灣族語彙：這片山區原是西排灣族「瑪家雜牙雜牙」社的傳統聚落領域，這個較長的原住民語詞彙，在排灣族語中意指「傾斜的山坡地」，貼切描述了這一帶山區地形起伏、坡度陡峭的地貌特徵。台灣光復後，這片區域獨立設鄉，取原有部落名稱的簡稱，正式定名為「瑪家鄉」，沿用至今。瑪家鄉因鄰近三地門鄉，同屬屏東縣北部排灣族的主要分布區域，境內的台灣原住民族文化園區，是全台規模最大、展示原住民族文化最完整的主題園區之一，加上北葉部落、瑪家部落等傳統聚落，讓瑪家成為認識排灣族傳統文化與工藝的重要窗口。"],
    ["屏東縣","泰武鄉","大武","泰武因位於北大武山與南大武山之間，戰後為與台東縣大武鄉區別而改稱泰武。","","泰武鄉地名由來，源自一次因應行政區重名而進行的更名：這片山區地處北大武山與南大武山之間的排灣族傳統領域，原本地名同樣與「大武」相關，然而由於台東縣境內已設有「大武鄉」，兩地名稱過於相近，容易在行政公文與郵政往來上造成混淆，台灣光復後，這片區域便改稱「泰武鄉」，以與台東大武鄉作出區隔，這種因行政區重名而更改鄉名的案例，與屏東泰武、苗栗西湖鄉（原四湖鄉）等地，屬於相同的命名調整邏輯。泰武鄉是屏東縣排灣族重要的傳統領域之一，境內佳平部落的排灣族古老頭目家屋，加上泰武國小的古謠傳唱，讓泰武成為保存排灣族傳統音樂文化的重要據點。"],
    ["屏東縣","來義鄉","來社","來義日治時期稱為來社，含有重義氣、倫理及情感之意，光復後為求發音方便而改稱來義。","","來義鄉地名由來相對單純：這片山區在日治時期稱為「來社」，這個稱呼蘊含著重視義氣、倫理綱常與族群情感的深刻意涵，反映排灣族傳統社會中重視部落倫理與族人情誼的價值觀。台灣光復後，考量「來社」的稱呼在發音與書寫上較為拗口，地方便將其改稱發音更為順口的「來義」，這種為求發音便利而微調用字、卻保留原有精神意涵的命名調整方式，在台灣地名演變中相當常見。來義鄉是屏東縣排灣族重要的傳統領域，境內古樓部落保留完整的排灣族五年祭（竹竿祭）文化，是台灣原住民族祭典中極具代表性的宗教儀式之一。"],
    ["屏東縣","春日鄉","喀蘇柏幹","春日境內排灣族「喀蘇柏幹」大社，因日語「春日」讀音Kasuga與社名相近，日治時期簡化為春日。","","春日鄉地名由來，源自一次因日語發音巧合而生的地名轉化：這片位於中央山脈西側山區的排灣族傳統領域，境內有一處規模較大的部落「喀蘇柏幹」大社，日治時期，日本殖民政府發現這個原住民語社名的發音，與日語中「春日」（讀作Kasuga）一詞十分相近，便順勢以日語漢字「春日」取代原本的原住民語地名，這種借用發音相近的日語詞彙、賦予原住民語地名嶄新漢字書寫的命名方式，是日治時期台灣地名雅化過程中相當獨特的案例。春日鄉因歸崇溫泉與排灣族傳統石板屋部落聞名，是屏東縣南側重要的原住民文化與生態觀光鄉鎮。"],
    ["屏東縣","獅子鄉","獅頭山","獅子因鄉內獅子頭一帶有一座形似獅子的小山丘（獅頭山），且鄉公所座落於此而得名。","","獅子鄉地名由來源自當地的地形意象：這片山區境內的獅子村附近，有一座外形輪廓神似獅子的小山丘，因而被稱為「獅頭山」，因鄉公所行政中心恰好座落於這座山丘所在的聚落，整個行政區便以「獅子」為名，沿用至今，這種依境內知名地標山形直接命名整個行政區的方式，在台灣山地鄉鎮地名中相當常見。獅子鄉地處中央山脈南段西側，是排灣族傳統領域，因南迴公路貫穿其間，加上內獅、外獅等部落與草埔溫泉，是連接枋寮與台東大武之間的重要山區交通門戶，也是屏東縣境內排灣族文化與生態資源豐富的山地鄉鎮。"],
    ["屏東縣","牡丹鄉","新保將/牡丹社","牡丹地名一說由排灣族語「新保將」翻譯而來、加上境內盛產野牡丹而得名，一說源自排灣族牡丹社分佈地簡稱。","","牡丹鄉地名由來主要有兩種說法：第一種說法指出，地名可能是由原住民語「新保將」音譯轉化而來，加上這片山區境內確實廣泛生長著野生牡丹花，因而得名「牡丹」；第二種說法則從部落分布出發，指這一帶原是排灣族「蘇卡蘇卡羅雷」支族下轄「趴立拉力克牡丹社」的傳統聚落領域，簡稱「牡丹」而成為地名。牡丹鄉因1874年爆發震驚國際的「牡丹社事件」而聞名於世：琉球宮古島漁民因船難登岸，遭當地原住民誤殺，日本藉此出兵攻台，成為近代中日台三方關係史上的重要轉折點，也促使清廷加強對台灣的治理與開發。如今牡丹鄉境內的石門古戰場，仍是見證這段歷史事件的重要遺址。"],
    ["屏東縣","墾丁","墾丁","墾丁因1877年清廷招撫局自廣東潮州募集壯丁到此開墾荒地，為紀念這些開墾壯丁（墾丁）而得名。","","墾丁地名由來，直接紀念一段清代官方招墾的歷史：光緒3年（1877年），清廷招撫局有感於恆春半島土地尚待開發，特地從廣東潮州一帶招募大批青壯年男丁，遠渡重洋來到這片區域從事墾荒工作，這些篳路藍縷、以啟山林的開墾壯丁，為紀念他們胼手胝足的拓墾貢獻，這片土地便被命名為「墾丁」，直接以「開墾」與「壯丁」兩個詞彙組合而成，是台灣少數直接以拓墾者身分（而非姓氏或籍貫）命名地方的案例。墾丁因擁有珊瑚礁地形、白沙灘與熱帶海洋生態，加上1984年成立的墾丁國家公園，是台灣本島唯一涵蓋熱帶海域生態的國家公園，也是全台最富盛名的度假觀光勝地，每年吸引大量國內外遊客造訪。"],
    ["屏東縣","鵝鑾鼻","Galangepi","鵝鑾鼻源自排灣族語「Galangepi」，意指「船帆」，因西側香蕉灣有形似船帆的巨石而得名，「鼻」指岬角，清代舊稱沙馬磯頭。","","鵝鑾鼻是台灣本島最南端的岬角，其名稱由來源自排灣族語「Galangepi」，意思是「船帆」：這片岬角西側的香蕉灣海岸，矗立著一顆造型酷似船帆的巨大礁石，排灣族人依此特徵稱呼這顆巨石，這塊礁石因而也被稱為「船帆石」；台語中則習慣以「鼻」指稱物體向外突出、形似鼻子的部位，正如「貓鼻頭」的命名邏輯，「鵝鑾鼻」便是指這處形似船帆、向海突出的岬角地帶。清代文獻中，這片區域更早則被記載為「沙馬磯」或「沙馬磯頭」，據信與地脈直通呂宋島的傳說有關，但現今學界對沙馬磯頭究竟是指鵝鑾鼻或鄰近的貓鼻頭，仍未有定論。1867年羅發號事件後，1883年在此建成的鵝鑾鼻燈塔，是台灣最南端、也是全台光力最強的燈塔，如今已成為墾丁國家公園最具代表性的地標之一。"],
    ["屏東縣","歸來","歸來","歸來相傳因胡姓兄弟遷居他處後，見此地水土宜人又重新遷回定居，因而得名「歸來」，寓意遊子歸鄉之意。","","歸來地名由來，相傳與一段先民遷徙又折返的故事有關：據傳早年有胡姓兩兄弟渡海來到這片土地開墾定居，其後因故遷居他處另謀發展，然而經過一段時間後，兄弟倆思念這片土地的水土環境，認為此地更適宜安身立命，於是決定重新遷回原本的墾地定居，鄉里便以「歸來」為這片土地命名，紀念這段遊子去而復返的拓墾歷程，這種以先民具體遷徙經歷命名地方的方式，為屏東市周邊地名增添了幾分人情故事的溫度。歸來地處屏東市南側，因鄰近縱貫鐵路歸來車站，加上蓮霧與檳榔等農產，是屏東市郊區重要的住宅與農業生活圈。"],
    ["屏東縣","西勢","西勢","西勢因地處屏東平原客家聚落分布範圍的西側而得名，是六堆客家文化區中常見的方位型地名。","","西勢地名由來相對單純，源自其相對於周邊客家聚落的方位：這一帶因地處屏東平原客家六堆聚落分布範圍的西側地帶，先民依此相對位置，將此地稱為「西勢」，「勢」在此處作為方位詞的後綴使用，這種依方位直接命名地方的方式，在台灣客家聚落地名中相當常見，類似的地名邏輯也可見於台灣其他地區的「西勢」「東勢」等地名。西勢地區因是六堆客家文化圈的一部分，境內保留部分傳統客家夥房建築與信仰習俗，加上鄰近的忠義祠等六堆重要地標，讓西勢成為屏東平原客家拓墾史與聚落分布研究中，一處具有方位參照意義的地名。"],
    ["屏東縣","加祿","加祿(排灣族社名)","加祿源自排灣族部落社名的音譯，是枋寮鄉境內排灣族傳統聚落所在地，地名沿用至今。","","加祿地名源自排灣族部落社名的音譯，是漢人尚未大規模入墾枋寮一帶之前，這片區域排灣族傳統聚落的所在地，反映了恆春半島北側枋寮沿海地帶，同樣曾是原住民族生活領域的歷史痕跡。隨著漢人移民逐漸遷入拓墾，加祿的原住民語地名仍持續沿用，成為枋寮鄉境內饒富原住民語言色彩的地名之一。加祿地區因鄰近南迴鐵路加祿車站，是連接屏東平原與恆春半島、南迴鐵公路沿線的重要中繼站之一，境內仍可見排灣族文化與漢人拓墾聚落交融並存的地方風貌，是了解恆春半島北端族群互動歷史的重要據點。"],

    // --- 【宜蘭縣】 ---
    ["宜蘭縣","宜蘭市","五圍","宜蘭市舊稱五圍，因位居適中、噶瑪蘭通判楊廷理築土城時遍植九芎樹而雅稱九芎城，光緒元年設縣，取「蘭」字加「宜」字定名宜蘭。","","宜蘭市清嘉慶7年（1802年）漢人拓墾至此，依結首制開墾順序稱為「五圍」。嘉慶17年（1812年）噶瑪蘭設廳後，官方認為五圍地處適中、腹地開闊，適合建築城垣，遂委由知府楊廷理督造土城；當時台灣西部城池多以刺竹圍築，楊廷理卻認為宜蘭盛產的九芎樹木質堅實、隨栽即活，比插竹為城更加堅固耐久，因而遍植九芎樹作為城牆屏障，其詩作〈重定噶瑪蘭全圖偶成〉更留下「他日濃陰懷舊澤，聽人談說九芎城」的詩句，後人便據此將宜蘭城稱為「九芎城」，但學者考證指出，這其實是後人依詩意附會而成的浪漫想像，官方文獻中未必真正如此稱呼。光緒元年（1875年），清廷正式設縣，取原名「蛤仔難」「噶瑪蘭」中的「蘭」字，加上寓意美好的「宜」字，定名「宜蘭縣」，沿用至今。"],
    ["宜蘭縣","羅東鎮","羅東(猴子譯音)","羅東源自噶瑪蘭平埔族語，因當地一塊巨石形狀似猴，族語稱猴子發音近似「羅東」而得名。","","羅東地名由來，源自平埔族噶瑪蘭族語言的音譯：相傳這一帶境內道路旁有一塊天然巨石，外形輪廓神似猴子蹲踞的姿態，噶瑪蘭族語言中稱呼猴子的發音，恰好與漢字「羅東」的讀音十分相近，先民依此音譯將這片區域命名為「羅東」，這種依動物外形巨石命名地方、又巧妙融入原住民語音譯的方式，在宜蘭地名史上獨具特色。羅東因地處蘭陽平原中心地帶，加上羅東林場（原太平山林場貯木池）的設立，日治時期一度是台灣三大林業重鎮之一，如今羅東林業文化園區已轉型為結合生態與歷史的觀光景點，加上羅東夜市的高人氣，讓羅東成為蘭陽平原上重要的商業與觀光核心城鎮。"],
    ["宜蘭縣","蘇澳鎮","蘇澳","蘇澳因清嘉慶年間泉州人蘇士尾（一說蘇阿玉）首先率眾入墾此處港澳而得名。","","蘇澳地名由來，直接紀念一位開拓先驅：相傳清嘉慶年間，一位名叫蘇士尾（另有蘇阿玉、蘇高等不同人名版本）的泉州人，率領壯丁最早進入這片海灣地帶開墾定居，因這處地形屬於三面環山、一面向海的天然港灣，閩南語稱這種港灣地形為「澳」，先民便將蘇姓拓墾者的姓氏與地形特徵結合，命名為「蘇澳」，這與台北貴子坑周邊「蘇厝」等地名，同屬以拓墾者姓氏直接命名地方的案例。蘇澳因擁有優良的天然深水港灣，是台灣少數水泥、造紙等重工業與遠洋漁業並存的港埠城鎮，加上境內南方澳漁港、蘇澳冷泉（全球罕見的碳酸氫鈉冷泉）等特色資源，是宜蘭縣南側重要的產業與觀光重鎮。"],
    ["宜蘭縣","頭城鎮","頭圍/頭城","頭城因清嘉慶元年吳沙率眾入墾蘭陽平原時，於此地最先築土圍防禦而得名，是漢人開發蘭陽平原的第一站。","","頭城地名由來，源自漢人開發蘭陽平原的歷史起點：清嘉慶元年（1796年），漳州人吳沙率領大批漳、泉、粵籍移民，越過三貂嶺進入蘭陽平原展開拓墾，在今日頭城一帶最先建立防禦性的土圍聚落，作為向南拓展的根據地，因是這波拓墾行動的第一個據點，因而得名「頭城」；此後移民依開墾先後順序，陸續建立二圍、三圍、四圍、五圍（今宜蘭市）等聚落。關於「頭城」是否曾稱「頭圍」，地方史家考證後意見不一：《頭城鎮志》主張頭城自始便稱頭城，另有研究則認為漢人入墾之初確實依結首制稱為頭圍，這場「雙包案」式的地名考據爭論，至今仍未有定論。頭城因清代擁有烏石港，一度享有「石港春帆」的美稱與「小蘇州」之譽，是蘭陽平原最早發展的繁榮市街。"],
    ["宜蘭縣","礁溪鄉","礁溪","礁溪因當地溪谷平時水量稀少、呈現乾涸礫石狀態，台語「礁」即為「乾」之意而得名。","","礁溪地名由來相對直白，源自當地的水文特徵：這一帶溪流因地質與地形因素，平常水量十分稀少，溪床裸露的礫石清晰可見，呈現乾涸的狀態，台語中「礁」字正是「乾」的意思，先民依此水文特徵，將這條時常乾涸見底的溪流稱為「礁溪」，這片區域也因而得名。饒富趣味的是，這片表面看似缺水的乾溪地帶，地底下卻蘊藏豐沛的溫泉資源，礁溪溫泉屬於少見的平地溫泉，泉質清澈無色無味，是台灣少數市區內即可體驗溫泉泡湯的鄉鎮，加上五峰旗瀑布、林美石磐步道等自然景觀，讓礁溪從乾涸缺水的地表印象，意外發展成宜蘭縣最負盛名的溫泉觀光重鎮。"],
    ["宜蘭縣","壯圍鄉","壯圍","壯圍因清代吳沙之子吳光裔招募壯丁拓墾，依序劃分壯一至壯七等墾地分賞壯丁，統稱壯圍而得名。","","壯圍鄉地名由來，與吳沙家族拓墾蘭陽平原的歷史直接相關：吳沙率眾開墾頭城一帶後，其子吳光裔（一說吳化）承繼父志，繼續招募壯丁向南拓展開墾範圍，待這片土地開墾完成後，為酬謝隨行壯丁的辛勞貢獻，依開墾先後或分配順序，將墾地劃分為壯一、壯二、壯三……直到壯七等區塊，分別賞賜給參與拓墾的壯丁，這片區域統稱「壯圍」，也稱「民壯圍」，意指由民間招募的壯丁所圍墾的土地。壯圍鄉地處蘭陽平原濱海地帶，因地勢平坦、水源充足，是宜蘭縣重要的哈密瓜與蔬果產地，境內東港榕樹公園與濱海自行車道，也讓壯圍兼具農業生產與濱海休閒的雙重風貌。"],
    ["宜蘭縣","員山鄉","員山","員山因東側有一座孤立突起、外形渾圓的小山丘而得名。","","員山鄉地名由來相對單純，源自當地的地形地標：這一帶東側有一座獨立於平原之上、外形渾圓飽滿的小山丘，先民依此顯眼的地形特徵，直接以「員山」（「員」通「圓」）為地名，這種依境內顯著地標山形直接命名地方的方式，在台灣各地相當常見。員山鄉地處蘭陽平原西側、雪山山脈東麓，因地勢由平原漸次爬升至丘陵山區，加上宜蘭河、蘭陽溪等水系流經，是宜蘭縣重要的水稻與蔬果產地。境內的員山機堡（二戰時期日軍戰鬥機掩體）、望龍埤與宜蘭美酒博物館，加上鄰近的雙連埤生態濕地，讓員山兼具戰爭歷史記憶與豐富生態景觀的多元面貌。"],
    ["宜蘭縣","冬山鄉","冬瓜山","冬山因境內南方有一座外形狀似冬瓜的山丘而得名，另一說因五結鄉利澤簡居民利用冬山河運送薪柴而得名。","","冬山鄉地名由來主要有兩種說法：第一種說法指出，這一帶南方有一座山丘，因外形輪廓神似冬瓜，先民依此地形特徵，將此地稱為「冬瓜山」，1920年簡化為「冬山」；第二種說法則從水運貿易出發，指五結鄉利澤簡（今利澤村）一帶的居民，習慣經由這條流貫此地的河川運送薪柴（冬季所需的柴薪），這條河流因而得名「冬山河」，冬山鄉便以此河為名。冬山鄉因冬山河親水公園的整治開發，成為每年舉辦國際童玩藝術節的重要場地，加上梅花湖、香格里拉休閒農場等景點，讓冬山從原本描述山形或柴薪貿易的地名，發展成宜蘭縣最具代表性的親水休閒觀光鄉鎮之一。"],
    ["宜蘭縣","五結鄉","五結","五結因清代蘭陽平原採「結首制」開墾，此地是依開墾順序劃分的第五個「結」（開墾單位）而得名。","","五結鄉地名源自清代蘭陽平原獨特的「結首制」開墾組織：吳沙率眾入墾蘭陽平原時，為有效管理眾多移民的拓墾工作，將墾民依人數劃分為若干小組，每組推舉一位領袖稱為「小結首」，數個小結再合組推舉「大結首」統籌管理，這種開墾單位稱為「結」，宜蘭地區至今仍留有頭城、二結、四結、五結等一系列依結首制開墾順序命名的地名，五結正是這套開墾單位系統中第五個「結」的所在地。五結鄉地處蘭陽平原東側出海口，因冬山河與蘭陽溪匯流入海，是重要的水產養殖與稻米產地，境內國立傳統藝術中心與五結利澤簡老街，讓五結兼具傳統藝術文化保存與親水休閒觀光的雙重特色。"],
    ["宜蘭縣","三星鄉","叭哩沙喃","三星舊稱叭哩沙喃，源自噶瑪蘭族語「Pressinowan」，意指竹林，因日治時期遷移庄治至三星山麓而改稱三星。","","三星鄉舊稱「叭哩沙喃」，源自噶瑪蘭族語「Pressinowan」的音譯，意指「竹林」，反映這一帶清代原是竹林密布的荒埔地帶，也是噶瑪蘭族與泰雅族傳統領域的交界地帶：沿著蘭陽溪往上游追溯，越過叭哩沙便進入泰雅族的傳統獵場範圍。19世紀中葉，清朝軍隊曾在此駐紮防守，逐漸發展成聚落市街；光緒元年（1875年），陳輝煌率眾入墾，是這一帶較晚期開發的地區之一。大正9年（1920年），因庄治遷移至三星山山麓，日本殖民政府遂將地名改為「三星」，沿用至今。三星鄉因土壤肥沃、灌溉便利，是宜蘭縣重要的三星蔥、銀柳與上將梨產地，加上境內清水地熱（台灣第一座地熱發電廠所在地），讓三星兼具精緻農業與地熱能源開發的特色。"],
    ["宜蘭縣","大同鄉","濁水鄉/太平鄉","大同因源自蘭陽溪舊稱濁水溪而設濁水鄉，後因境內太平山改稱太平鄉，1958年因與台中太平鄉同名，抽籤改為大同鄉。","","大同鄉地名歷經多次演變：戰後初期，這片位於蘭陽溪（舊稱濁水溪）上游、以泰雅族為主要居民的山地行政區，最初以流經境內的濁水溪為名，設立「濁水鄉」；1947年，因境內著名的太平山林場而改稱「太平鄉」。然而，台中縣（今台中市）境內也有一處同樣稱為「太平鄉」的行政區，兩地名稱重複，容易造成行政與郵務上的混淆，1958年，經過抽籤決定的方式，這片山地行政區改稱「大同鄉」，沿用至今，這種以抽籤方式決定行政區重新命名的作法，是台灣地名史上相當特殊的案例。大同鄉因太平山國家森林遊樂區與明池、棲蘭等森林景觀聞名，是宜蘭縣重要的高山林業與生態觀光重鎮，也是泰雅族重要的傳統領域。"],
    ["宜蘭縣","南澳鄉","南澳社","南澳因是泰雅族南澳社的傳統領域，該社族人祖先自南湖大山遷徙而下，因而以社名為地名。","","南澳鄉地名源自居住於此的泰雅族「南澳社」：根據泰雅族口傳歷史，這一帶族人的祖先原本居住在中央山脈的南湖大山一帶，其後逐漸遷徙下山，在這片臨海山區建立聚落定居，族人便以原有的社名「南澳」，作為這片新居地的稱呼。清代這一帶隸屬「後山」範圍，清廷為防範外國勢力覬覦，同治13年（1874年）命提督羅大春開闢北路（今蘇花公路前身），清軍進駐後與當地泰雅族屢生衝突；光緒16年（1890年），劉銘傳更派兵討伐，南澳泰雅族因而遭受重創。南澳鄉是宜蘭縣面積最大、人口密度最小的行政區，因蘇花公路貫穿其間，加上東岳湧泉、南澳古道等自然景觀，是宜蘭縣南側重要的泰雅族文化與生態觀光鄉鎮。"],
    ["宜蘭縣","南方澳","南方澳","南方澳因位於蘇澳港南側、由沙頸岬連接內埤海灘所形成的天然港澳而得名，是台灣三大近海漁港之一。","","南方澳地名由來相對單純，源自其相對於蘇澳港的地理位置：這處港灣地處蘇澳港南側，因海岸沙頸岬地形，將原本的沙洲與陸地連接成一處天然良港，先民依方位特徵，將此地稱為「南方澳」，以與北側的蘇澳港區作出區隔。日治時期起，日本政府積極建設南方澳漁港的基礎設施，加上鄰近黑潮暖流經過的優良漁場，使南方澳迅速發展成台灣重要的遠洋與近海漁業基地，與台灣其他知名漁港並列全台三大漁港之一。如今南方澳因南天宮媽祖廟、內埤海灘（情人灣）與豆腐岬等景觀，加上新鮮漁獲與海鮮餐飲，是宜蘭縣極具代表性的漁港觀光重鎮。"],
    ["宜蘭縣","四城","四城","四城因清代吳沙率眾依結首制向南拓墾蘭陽平原，此地是依開墾順序建立的第四座防禦土城而得名。","","四城地名源自清代蘭陽平原拓墾史上的聚落防禦系統：吳沙率眾入墾蘭陽平原後，移民依開墾先後順序，沿途興建具防禦功能的土城聚落，依序稱為頭城、二圍（城）、三圍（城）、四圍（城）……這片區域正是這套拓墾防線中第四個建立的據點，因而得名「四城」，與頭城、二結等地名，同屬宜蘭地區依結首制開墾順序命名的系統。四城地處礁溪鄉境內，因鄰近宜蘭河支流與蘭陽平原精華農業地帶，是宜蘭縣重要的稻米與蔬果產地，境內四城車站與周邊聚落，也持續沿用著這個記錄清代拓墾防線順序的古老地名。"],
    ["宜蘭縣","二結","二結","二結因清代蘭陽平原採結首制開墾，此地是依開墾順序劃分的第二個「結」（開墾單位）而得名。","","二結地名同樣源自清代蘭陽平原獨特的「結首制」開墾組織：與五結鄉的命名邏輯相同，這片區域是墾民依開墾單位「結」劃分順序中的第二個據點，因而得名「二結」，與頭城、四城、五結等地名，共同構成宜蘭地區依結首制開墾先後順序命名的完整系統，是台灣地名史上相當獨特的拓墾組織制度地名見證。二結地處五結鄉境內，因二結王公廟（威惠廟）與二結穀倉稻農文化館等地標，加上鄰近冬山河與蘭陽溪出海口，是五結鄉重要的信仰與農業文化聚落，境內保存的舊穀倉建築，也見證了這片土地作為蘭陽平原重要糧倉的歷史記憶。"],
    ["宜蘭縣","龜山島","龜山島","龜山島因島嶼外形自海上遠望神似一隻浮游於海面的海龜而得名，是宜蘭縣的精神地標與象徵。","","龜山島地名由來直接取自其獨特的地形外貌：這座位於宜蘭外海的火山島，從海岸線遠望，島嶼輪廓神似一隻昂首浮游於太平洋海面的海龜，「龜首」與「龜甲」的形狀清晰可辨，先民依此生動的視覺意象，將這座島嶼命名為「龜山島」。龜山島過去曾有居民定居捕魚維生，1977年因軍事需要，島上居民全數遷至宜蘭本島的龜山島社區，龜山島自此成為無人島並劃入軍事管制區，直到1990年代後期才逐步開放生態觀光。龜山島因海底溫泉、鯨豚生態與獨特的海龜島形地標，成為宜蘭縣最具代表性的精神象徵，「龜山朝日」更被列為蘭陽八景之首，是宜蘭人心中永恆的故鄉印記。"],

    // --- 【花蓮縣】 ---
    ["花蓮縣","花蓮市","洄瀾","花蓮舊稱洄瀾，因花蓮溪出海口海浪與溪水衝擊迴旋而得名，清代因台語諧音雅化為花蓮，日治簡稱沿用至今。","","花蓮市舊稱「洄瀾」，這個地名生動描繪了當地特殊的海岸水文現象：花蓮溪出海口一帶，黑潮暖流由南向北流經，遇上向外凸出的海岸地形，加上溪水奔流入海與海浪相互衝擊激盪，形成明顯的迴旋狀水流，早期自宜蘭南下拓墾的漳州移民見此景象，便以河洛話脫口稱之為「洄瀾」（Hoe-liân）。由於台語「洄瀾」與「花蓮」發音相近，清代將地名雅化為「花蓮港」，日治時期簡化為「花蓮」，沿用至今；另因西班牙人文獻記載花蓮溪一帶盛產沙金，曾稱「哆囉滿」，加上境內原是阿美族支系「撒奇萊雅族」（Sakiraya，意為「真正的人」）的傳統領域，外人誤將族名當作地名，諧音稱為「奇萊」，因此花蓮同時擁有洄瀾、哆囉滿、奇萊等多個歷史地名。花蓮市因四面環山、東臨太平洋，享有「臺灣後花園」的美譽。"],
    ["花蓮縣","鳳林鎮","馬里勿","鳳林舊稱馬里勿，阿美族語意指上坡，因林木茂密、樹藤攀繞如鳳鳥展翅而漢人改稱鳳林，另一說源自清代「奉鄉」諧音。","","鳳林鎮地名由來主要有兩種說法：第一種說法指出，這一帶舊稱「馬里勿」，是阿美族語彙，意指「上坡」，反映當地地勢由平原漸次爬升的地形特徵；早期此地森林茂密，藤蔓植物攀繞樹梢生長，遠望宛如鳳鳥展翅飛翔的姿態，漢人移民入墾後，便依此意象將地名改為「鳳林」。第二種說法則從行政區劃出發，指清代這一帶隸屬台東直隸州「奉鄉」管轄，「奉」與「鳳」發音相同，加上地處「西鳳林山」東麓，南有鳳信村、北有林榮村，居中的交通要站便稱為「鳳林」。鳳林鎮因純樸的客家聚落與菸樓建築聞名，享有「校長之鄉」與「花蓮縣文化城」的美譽，是花東縱谷北段重要的客家文化重鎮。"],
    ["花蓮縣","玉里鎮","璞石閣","玉里舊稱璞石閣，1875年開山撫番時中路統領吳光亮見此地大理石如未經雕琢的璞玉、設撫墾局立閣樓街道而得名，日治簡化為玉里。","","玉里鎮舊稱「璞石閣」，地名由來有三種說法：一說源自阿美族語音譯，意指「灰塵」，因秀姑巒溪流貫境內，久旱不雨時溪水乾涸，風吹沙土漫天飛揚而得名；二說源自「派派可」的譯音，阿美族稱「蕨類」為派派可，因本地盛產蕨類而得名；三說也是最廣為流傳的版本，指光緒元年（1875年）清廷推行開山撫番政策，「中路統領」吳光亮率兵在此設置撫墾局，因當地盛產尚未經過雕琢的大理石，質地如同「璞玉」，官兵便在此建造閣樓式街道，因而得名「璞石閣」。日治時期，考量「璞」字本意即為未經琢磨之玉，遂簡化地名為「玉里」，沿用至今。玉里鎮因玉里神社遺址、玉里橋與客家麵店聞名，是花東縱谷南段重要的商業與農業重鎮。"],
    ["花蓮縣","新城鄉","大魯宛","新城因泰雅族大魯宛社領域，清嘉慶年間吳全率眾墾荒屢遭太魯閣族攻擊而築城防禦，加上光緒元年開路後移民建立新聚落而得名。","","新城鄉舊稱「大魯宛」，是泰雅族（今太魯閣族傳統領域）對這一帶的稱呼，漢人音譯記為「哆囉滿」，這個地名也與西班牙文獻中記載的產金傳說地「Turumoan」有關。清嘉慶年間，淡水廳人吳全率領招募的墾民來此開墾荒地，卻屢遭太魯閣族出草攻擊，先民被迫構築防禦城牆自保。同治13年（1874年），閩浙總督沈葆楨奏准開闢台灣後山三條道路，光緒元年（1875年），羅大春率軍開闢北路（自宜蘭蘇澳至花蓮），道路貫通後，移民陸續在此建立新的聚落，因而正式得名「新城」，意指新建立的城鎮聚落。新城鄉因鄰近花蓮機場與太魯閣國家公園入口，加上七星潭風景區，是花蓮縣北側重要的交通門戶與觀光重鎮。"],
    ["花蓮縣","吉安鄉","七腳川/吉野","吉安清代為阿美族「竹腳宣社」（七腳川社）所在地，日治時期設吉野移民村，光復後因「吉野」帶有日本色彩，取「吉祥安定」之意改稱吉安。","","吉安鄉清代為阿美族「崇爻九社」之一「竹腳宣社」（又稱七腳川社）的傳統領域。日治時期，日本殖民政府在此推行官營移民政策，招募日本本土農民前來開墾定居，因移民多來自日本四國德島縣的吉野川流域，便將這處新建的移民村命名為「吉野村」，是台灣東部最早的日本官營移民村之一。台灣光復後，政府考量「吉野」二字帶有濃厚的日本語意色彩，加上這一帶原住民族與漢人、日本移民後裔等多元族群共處，為求各族群和平共存，遂取「吉」祥「安」定的美好期許，正式改稱「吉安鄉」，沿用至今。吉安鄉因慶修院（日式佛寺）等移民村遺跡，加上鄰近花蓮市區，是花蓮縣人口第二多的行政區。"],
    ["花蓮縣","壽豐鄉","里鬧/鯉魚尾","壽豐舊稱里鬧，泰雅語意指叢林，因鄰近鯉魚潭南端而稱鯉魚尾，光復後取「壽」村與日治「豐」田村二字合稱壽豐。","","壽豐鄉舊稱「里鬧」，源自泰雅族語，意指「叢林」，反映這一帶早期是林木蓊鬱、後來成為阿美族狩獵活動範圍的地帶。光緒元年（1875年），羅大春開闢北路行經奇萊山一帶時，發現山北側有一座天然湖泊，潭中棲息大量鯉魚，因而得名「鯉魚潭」，潭南方一座小山則稱「鯉魚山」，這處聚落恰好位於鯉魚山的南端末尾，因而又稱「鯉魚尾」。台灣光復後，政府將鄰近的「壽」村，與日治時期日本移民村「豐」田村的地名各取一字，合稱「壽豐鄉」，沿用至今。壽豐鄉因鯉魚潭風景區、東華大學與花蓮觀光糖廠聞名，是花東縱谷北段重要的休閒與教育重鎮。"],
    ["花蓮縣","光復鄉","馬太鞍/上大和","光復為阿美族馬太鞍社領域，1937年日人改稱上大和，因「大和」為日本古國名與民族名，光復後取「台灣光復」之意改稱光復。","","光復鄉這一帶原是阿美族「馬太鞍社」的傳統聚落領域，「馬太鞍」在阿美族語中意指一種可食用的樹豆。1937年（昭和12年），日本殖民政府將這一帶改稱「上大和」。台灣光復後，政府有感於「大和」二字既是日本古代國名，也是日本大和民族的自稱，帶有強烈的殖民統治象徵意涵，遂將地名改為「光復」，直接紀念台灣脫離日本殖民統治、重歸中華民國版圖的歷史時刻，這與台灣許多在戰後直接以「光復」為名的路名、學校名稱，屬於同一波政治意涵鮮明的命名浪潮。光復鄉因馬太鞍濕地生態與大農大富平地森林園區聞名，是花東縱谷重要的阿美族文化與生態觀光重鎮。"],
    ["花蓮縣","豐濱鄉","貓公","豐濱清代為阿美族貓公社領域，因地名不雅，光復後取東臨太平洋、漁產豐富、海岸風光旖旎之意改稱豐濱。","","豐濱鄉清代居民以阿美族為主，這一帶依阿美族社名音譯稱為「貓公」，「貓公」一詞可能與當地原生的文珠蘭（阿美族語稱貓公）植物有關。日治時期，這一帶隸屬鳳林郡新社庄管轄。台灣光復後，地方政府考量「貓公」二字作為正式地名不甚雅觀，加上這片鄉鎮東臨太平洋，漁業資源豐沛，海岸風景秀麗宜人，遂取「豐」饒「濱」海之意，正式改稱「豐濱鄉」，沿用至今。豐濱鄉因石梯坪海蝕地形、石梯港賞鯨與親不知子海上古道聞名，加上噶瑪蘭族、阿美族多元原住民文化，是花蓮縣海岸山脈東側最具代表性的生態與人文觀光鄉鎮。"],
    ["花蓮縣","瑞穗鄉","水尾","瑞穗因位處富源溪、紅葉溪等多條溪流匯入秀姑巒溪的末段而稱水尾，日治時期因稻作豐收，取「豐葦原之瑞穗國」典故改稱瑞穗。","","瑞穗鄉舊稱「水尾」，阿美族語稱此地為「可可」，意指平原遼闊；漢人則因這一帶地處富源溪、紅葉溪、塔比拉溪、馬蘭鉤溪等大小河流匯入秀姑巒溪的末段位置，依此水文特徵稱之為「水尾」。日治時期，日本移民見當地稻米農作結穗纍纍、豐收在望，便援引日本天皇詔書中「豐葦原之瑞穗國」的典故字句，將「水尾」改稱「瑞穗」，取其稻穗豐盛之意，這也巧妙利用了「水尾」與「瑞穗」日語發音相近的雙關（水尾讀作Mizuo，瑞穗讀作Mizuho）。瑞穗鄉因瑞穗溫泉（全台少見的泥漿溫泉）與舞鶴台地紅茶、咖啡產業聞名，是花東縱谷重要的溫泉與精緻農業重鎮。"],
    ["花蓮縣","富里鄉","公埔","富里舊稱公埔，是平埔族公共牧場所在地，意指公有待墾的小片平原，1937年日人取「富裕鄉里」吉祥之意改稱富里。","","富里鄉開發始於清道光年間，因地廣人稀、土壤肥沃，逐漸吸引移民前來聚居拓墾，這片區域最初被稱為「公埔」，意指「公有待開墾的一片小小平原」，是平埔族共同使用的公共放牧場地。1937年（昭和12年），日本殖民政府考量這片土地日益肥沃富饒，遂取「富裕鄉里」的吉祥寓意，將地名改為「富里」，沿用至今。富里鄉地處花東縱谷最南端，因秀姑巒溪沖積平原與純淨水源，是台灣重要的優質稻米產區，「富麗米」享譽全台，加上六十石山金針花海與羅山有機村，讓富里成為花蓮縣南側兼具農業生產與生態觀光特色的鄉鎮。"],
    ["花蓮縣","秀林鄉","太魯閣族社名","秀林為太魯閣族社名譯音，原意指菅茅經砍伐燒燬後再度萌發新芽之處，漢字譯音之餘又寓含「山林之秀」的美意。","","秀林鄉地名源自太魯閣族（原歸類為泰雅族支系）社名的音譯，原始社名意指「菅茅（一種芒草類植物）經過砍伐燒燬後，重新萌發嫩芽的地方」，反映了原住民族傳統的燒墾游耕生活方式。漢人依其發音譯寫為「秀林」時，除了保留原有讀音，也巧妙賦予「山林之秀」的文雅意涵，讓這個原本描述燒墾地貌的原住民語地名，兼具音譯與意譯的雙重美感。秀林鄉是花蓮縣面積最大的行政區，境內涵蓋太魯閣國家公園大部分範圍，因太魯閣峽谷、清水斷崖等世界級地質景觀，加上太魯閣族傳統文化，是台灣最富盛名的山地生態與峽谷觀光重鎮之一。"],
    ["花蓮縣","萬榮鄉","森阪村","萬榮日治時期稱森阪村，因太魯閣族「馬里巴西」社而得名，1958年因位於萬里溪南岸取「萬」字，加吉祥義之「榮」字合稱萬榮。","","萬榮鄉日治時期稱為「森阪村」，境內原是太魯閣族「馬里巴西」社的傳統領域。民國47年（1958年），地方政府為這片行政區重新命名時，考量聚落地處「萬里溪」南岸，遂取「萬」字為地名首字，再加上寓意吉祥興旺的「榮」字，組合成「萬榮」，這種截取溪流名稱一字、搭配吉祥用字命名地方的方式，在台灣戰後地名雅化過程中相當常見。萬榮鄉地處花蓮縣中部山區，是太魯閣族與布農族的傳統領域，因鄰近萬里溪與紅葉溫泉，加上林田山林業文化園區（保留完整的日治至戰後林業聚落建築），讓萬榮鄉成為認識花蓮林業發展史與原住民文化的重要據點。"],
    ["花蓮縣","卓溪鄉","巴內大/乾溪","卓溪原稱巴內大，因當地溪流終年幾近無水、僅雨季暴漲而稱乾溪，光復後取布農族卓社、卡社群譯音改稱卓溪。","","卓溪鄉原稱「巴內大」，這一帶因境內溪流特殊的水文特徵——終年幾乎乾涸見底，唯有降下豪雨時才會暴漲成河，先民依此特徵，將這條溪流及周邊聚落稱為「乾溪」。台灣光復後，地方政府成立鄉治，考量這片山區是布農族「卓社」與「卡社」兩個支系群的傳統領域，遂取兩個族群名稱中的「卓」字，加上原有的「溪」字，重新組合命名為「卓溪鄉」，這種截取原住民族群譯音用字、結合原有地形特徵命名地方的方式，讓卓溪的地名同時保留了水文特色與原住民族群認同的雙重意涵。卓溪鄉地處中央山脈東側，是花蓮縣布農族主要分布區域，因清水溪與卓溪部落文化，是花東縱谷南段重要的布農族生態與人文鄉鎮。"],
    ["花蓮縣","太魯閣","Truku","太魯閣源自太魯閣族語「Truku」，原意指「山腰的平台」，是族人祖先翻越中央山脈遷徙至此、選擇平坦河階台地定居而得名。","","太魯閣地名源自太魯閣族語「Truku」，原意是指「山腰間的平坦台地」，反映了太魯閣族祖先自中央山脈西側（今南投仁愛鄉一帶）翻山越嶺遷徙而來時，選擇立霧溪、木瓜溪流域中地勢較為平緩的河階台地作為定居點的歷史記憶，族人便以此地形特徵作為自我族群認同的名稱，日後也成為這片區域與國家公園的正式名稱。太魯閣峽谷因立霧溪長期切割大理石與石灰岩層，形成雄偉壯麗的峽谷地形，加上九曲洞、燕子口、長春祠等景觀，1986年正式成立太魯閣國家公園，是台灣最具國際知名度的峽谷景觀與世界級地質公園之一，也是太魯閣族傳統文化保存最完整的重要據點。"],
    ["花蓮縣","七星潭","七星潭","七星潭原指花蓮新城鄉境內七個小湖泊，因狀似北斗七星排列而得名，後因湖泊被機場與農地填平，地名轉移指稱今日的新月形海灣。","","七星潭地名由來，經歷了一段地理位置上的轉移：這個地名最初是指花蓮新城鄉境內一連串大小不一的天然湧泉湖泊群，因湖泊分布的位置排列狀似天空中的北斗七星（或說七星連珠），因而得名「七星潭」。然而，日治時期因應軍事需求，在原本七星潭湖泊群所在地興建花蓮港南濱機場（今花蓮機場前身），加上周邊農地開發填土，這些天然湖泊逐漸消失殆盡。有趣的是，「七星潭」這個地名並未隨著湖泊的消失而被廢棄，反而轉移套用到鄰近一處呈新月形的美麗海灣之上，也就是今日遊客熟知、擁有滿佈礫石海岸與清澈海水的「七星潭風景區」，讓這個原本描述內陸湖泊群的地名，意外在花蓮的地理版圖上「搬家」，成為濱海景觀的代稱。"],
    ["花蓮縣","志學","知伯","志學舊稱知伯，源自阿美族語音譯，因鄰近東華大學設站，取「立志向學」之意，將車站與地名改稱志學。","","志學舊稱「知伯」，是阿美族語彙的音譯，確切原意已不易考證，這一帶清代及日治時期原是花東縱谷中一處相對僻靜的小聚落。隨著台灣鐵路管理局在此設站，加上鄰近的國立東華大學於1994年創校，因大批師生往來，車站周邊逐漸發展成具有濃厚學術氛圍的生活圈，地方便取「立志向學」的美好期許，將原本的「知伯」改稱發音相近、寓意深遠的「志學」，車站也隨之更名為志學車站，這種因鄰近學校而賦予地名求學勵志意涵的命名方式，讓志學成為花蓮縣境內獨具文教色彩的地名案例。志學車站因鄰近東華大學，是花蓮縣壽豐鄉重要的學生通勤與生活機能聚落。"],
    ["花蓮縣","平和","平和","平和因1937年日治移民政策而設立的農業移民聚落，戰後取「和平安樂」之意，將地名定為平和，沿用至今。","","平和地名由來，反映了戰後台灣地名去日本化與追求祥和願景的普遍趨勢：這一帶在日治時期是官方規劃的農業移民聚落之一，原本沿用帶有日本色彩的舊稱。台灣光復後，政府考量去除殖民統治色彩、並寄託地方社會和睦安樂的期許，將這處聚落正式命名為「平和」，取「和平安樂」的吉祥寓意，這與吉安鄉（原吉野，取「吉祥安定」）、光復鄉（原大和，取「台灣光復」）等地名，同屬戰後花蓮縣境內因政治情勢轉變而重新命名的地名系統。平和地區地處花東縱谷平原地帶，因土壤肥沃、灌溉便利，是花蓮縣壽豐鄉境內重要的稻米與農業生產聚落之一。"],
    ["花蓮縣","三民","三笠","三民舊稱三笠，為日治時期移民聚落名稱，戰後取「三民主義」之意，將地名改為三民，沿用至今。","","三民地名由來，同樣屬於戰後台灣地名去日本化的命名浪潮：這一帶在日治時期是官方規劃的移民聚落，原名「三笠」，可能與日本傳統文化中「三笠山」等地名意象有關。台灣光復後，政府基於推行「三民主義」的政治理念，並考量「三民」二字恰好與原本日式地名「三笠」的發音有幾分相近之處，遂將這處聚落正式改稱「三民」，這種截取政治理念用詞、同時兼顧發音近似性的命名方式，與台灣其他地區因「三民主義」而命名的路名、里名，屬於同一波戰後政治教化式地名的產物。三民地區地處花東縱谷，是花蓮縣境內農業生產聚落之一，境內仍保留部分日治移民村的街廓紋理與建築遺跡。"],
    ["花蓮縣","大富","大和","大富舊稱大和，因日治時期在此設立的官營移民村而得名，戰後因「大和」帶有日本民族色彩，取諧音「大富」之意改稱，寓意富足昌盛。","","大富地名由來，與光復鄉地名的更迭歷程密切相關：這一帶在日治時期同樣是官方規劃的農業移民村，因鄰近光復（原稱大和，馬太鞍社領域）而同樣沿用「大和」的地名系統。台灣光復後，政府基於相同的去日本化考量，將帶有日本古國名與民族色彩的「大和」地名替換，考量發音相近，遂改稱寓意「富足昌盛」的「大富」，這種以發音相近的吉祥詞彙取代原有日式地名的命名方式，與宜蘭「大同」（原太平鄉，因撞名而改）等地名演變邏輯有異曲同工之妙。大富地區因鄰近大農大富平地森林園區，是花蓮縣光復鄉境內重要的生態造林與休閒農業聚落，如今已從日治移民村轉型為花東縱谷知名的自行車道與森林浴景點。"],
    ["花蓮縣","天祥","塔比多","天祥舊稱塔比多，為太魯閣族語，意指盛產一種植物之地，1960年為紀念南宋民族英雄文天祥而改稱天祥，沿用至今。","","天祥舊稱「塔比多」，源自太魯閣族語，一般認為與當地曾經盛產某種植物有關，是太魯閣峽谷深處一處太魯閣族的傳統活動範圍。民國49年（1960年），中部橫貫公路（含支線）陸續通車，政府為紀念南宋末年堅貞不屈、以死報國的民族英雄文天祥，將這處位於中橫公路要衝、風景秀麗的山中台地，正式命名為「天祥」，這種以歷史忠烈人物姓名直接命名風景區的方式，與谷關（原明治溫泉，中橫通車後改為描述地形的谷關）雖同屬中橫公路沿線地名，命名邏輯卻截然不同。天祥因地處立霧溪上游河階台地，四周高山環繞、風景清幽，加上文天祥雕像與祥德寺等地標，是太魯閣國家公園深處重要的中繼景點與遊憩據點。"],

    // --- 【台東縣】 ---
    ["台東縣","台東市","寶桑","台東市舊稱寶桑，因卑南族「巴布麓社」（寶桑庄）而得名，光緒13年設台東直隸州，因位居台灣島之東而得名台東。","","台東市舊稱「寶桑」，源自卑南族「巴布麓社」（Papulu）的社名音譯轉化，這個部落是日治時期由卑南族核心部落「普悠瑪社」（今南王里）部分族人另闢建立的支社。清咸豐年間，漢人與平埔族陸續移入此地，逐漸形成聚落，稱為「寶桑庄」，範圍大致涵蓋今日台東市文化、中山、寶桑等里。光緒13年（1887年），清廷將原本的「卑南廳」升格改設為「台東直隸州」，因這片行政區位居台灣本島的東側，因而得名「台東」，這是台北、台南、台東等以方位命名的行政區中，較晚才出現的地名之一，當時管轄範圍甚至涵蓋今日的花蓮縣。台灣光復後設台東鎮，民國65年（1976年）升格為台東市，如今是台東縣的政治、經濟與交通核心。"],
    ["台東縣","成功鎮","麻荖漏","成功舊稱麻荖漏，源自阿美族社名音譯，1929年因興築漁港改稱新港，戰後因紀念鄭成功登台而改稱成功。","","成功鎮舊稱「麻荖漏」，是阿美族「麻荖漏社」的社名音譯，該部落是東海岸阿美族的重要聚落之一。昭和4年（1929年），日本殖民政府在此興築漁港，1932年竣工後，因應港埠機能，將「麻荖漏」改稱「新港」，這也是成功鎮至今仍稱「新港漁港」的由來。台灣光復後，政府考量「新港」與台灣其他多處同名地名（如嘉義新港）容易混淆，加上有意紀念明鄭時期驅逐荷蘭人、開創台灣新局的民族英雄鄭成功，遂將地名改為「成功」，這種以歷史人物功業寄託地方期許的命名方式，讓成功鎮的地名兼具紀念意義與吉祥寓意。成功鎮因新港漁港的旗魚產業聞名，加上比西里岸（白守蓮）部落與三仙台景觀，是台東縣東海岸重要的漁業與觀光重鎮。"],
    ["台東縣","關山鎮","里壠","關山舊稱里壠，源自阿美族語音譯，意指紅蟲滋生之地，1920年因地處山谷與平原間的出關口而改稱關山。","","關山鎮舊稱「里壠」（或作里隴），源自阿美族語彙的音譯，一般認為與當地溪流曾滋生大量紅色蟲類的生態現象有關。1920年（一說1937年），日本殖民政府推行地方行政改制，考量這一帶地處中央山脈與海岸山脈之間的花東縱谷通道，恰好位居山谷地形與開闊平原交界的出入口要衝，猶如把守關隘的門戶，遂將地名改為「關山」，取其地理形勢之意，與台東其他因地形出關口而得名的地名邏輯相似。關山鎮因擁有全台第一條環鎮自行車道「關山親水公園」，加上關山米享譽全台，是花東縱谷南段重要的稻米產區與單車觀光重鎮，也是南橫公路東段的重要門戶城鎮。"],
    ["台東縣","卑南鄉","Puyuma","卑南源自卑南族語自稱「Puyuma」，意指「團結、集中的地方」，清代因卑南王統轄勢力遍及台東，使卑南成為整個東部區域的代稱。","","卑南鄉地名源自卑南族的自稱「Puyuma」，意指族人團結一致、集中居住的地方，反映卑南族傳統社會強調部落凝聚力的文化特質。清代，卑南族「大巴六九社」頭目比那賴（一說其後代文杰）勢力強盛，因協助清廷平定民變有功，獲封「卑南大王」（俗稱卑南王），統轄勢力範圍一度涵蓋整個台東平原，甚至及於恆春、花蓮等地的多個原住民族群，使「卑南」一詞從單純的族群自稱，擴大成為整個台灣東部區域的代稱，清代官方甚至一度以「卑南覓」統稱整個台東地區。如今卑南鄉境內的初鹿、賓朗、利嘉等部落，仍是卑南族「八社十部落」傳統體系的重要成員，卑南鄉也因初鹿牧場、鸞山森林博物館等景點，是台東縣重要的農牧與生態觀光鄉鎮。"],
    ["台東縣","鹿野鄉","鹿寮","鹿野因清光緒年間官府招漢人與平埔族入墾，先民搭建捕鹿用的鹿寮而得名，日治時期招募日本新潟移民開墾茶園，簡化為鹿野。","","鹿野鄉舊稱「鹿寮」，清光緒年間，清政府招募漢人與平埔族人前來這片區域開墾，當時共有約五十戶平埔族人在此落腳，因這一帶原是野生梅花鹿群聚棲息的地帶，先民狩獵之餘，習慣搭建簡易寮舍作為捕鹿與處理獸皮的據點，久而久之，這片區域便被稱為「鹿寮」。日治時期，台東製糖株式會社在此招募日本新潟縣移民前來墾殖茶園與甘蔗田，1920年，地方行政改制時，將「鹿寮」簡化雅化為「鹿野」，沿用至今。鹿野鄉因鹿野高台的熱氣球嘉年華聞名全台，加上鹿野紅烏龍茶產業，是台東縣花東縱谷北段重要的休閒觀光與茶葉產地。"],
    ["台東縣","池上鄉","新開園","池上因位於大坡池上方而得名，另一說清同治年間先民在此開墾田園稱新開園，是池上鄉較早的舊稱。","","池上鄉地名由來主要與境內一座天然湖泊「大坡池」有關：這片區域地處大坡池的上方位置，先民依此地理特徵，將此地稱為「池上」，意指位於池塘上方的聚落，1920年正式定名。池上鄉另有一個更早的舊稱「新開園」，據傳清同治年間，已有漢人在此新闢田園墾殖，因而得名，反映這一帶開發的時間脈絡。池上鄉地處花東縱谷精華地帶，因濁水溪與卑南大溪沖積形成的肥沃土壤，加上純淨無汙染的水源，孕育出享譽全台的「池上米」，米質Q彈飽滿、粒粒分明，成為台灣優質稻米的代名詞；境內伯朗大道、金城武樹等田園景觀，更讓池上從單純的農業聚落，發展成結合稻田美景與人文氣息的知名觀光勝地。"],
    ["台東縣","東河鄉","馬武窟","東河舊稱馬武窟，源自阿美族語「mabukuru」，意指撒網捕魚，1937年取大馬武窟頭二字改稱大馬，光復後改稱東河。","","東河鄉舊稱「馬武窟」，源自阿美族語「mabukuru」，意思是「撒網捕魚」，反映這一帶阿美族「大馬武窟社」（另譯貓武骨社、武突社）族人依溪河捕魚維生的傳統生活方式，這條流貫此地、注入太平洋的溪流也因而得名「馬武窟溪」。1937年（昭和12年），日本殖民政府推行地方行政簡化，取「大馬武窟」的頭兩字，將地名改為「大馬」。台灣光復後，政府考量這一帶地處馬武窟溪東側河谷地帶，遂改稱「東河」，沿用至今。東河鄉因東河橋（新舊雙橋並列的特殊景觀）與都蘭山、金樽等海岸地景聞名，加上東河包子的知名度，是台東縣東海岸重要的觀光與部落文化重鎮。"],
    ["台東縣","長濱鄉","加走灣","長濱舊稱加走灣，源自阿美族語「Pikak Sauwan」音譯，意指瞭望所，因清代阿美族曾在此設瞭望台防禦而得名，1937年因海岸線狹長改稱長濱。","","長濱鄉舊稱「加走灣」，是阿美族語「Pikak Sauwan」簡化的音譯漢字，意思是「瞭望所」或「守望台」。光緒14年（1888年），清軍討伐反抗的阿美族奇密社時，當地阿美族人曾在此地設置瞭望台因應戰事；另一說則指清廷勢力由台東逐漸向北擴展之際，官吏曾雇用阿美族青年在海岸突出的岩岬上擔任守望任務，因而得名。昭和12年（1937年），日本殖民政府考量這一帶海岸線長達近兩公里、呈現狹長沙濱地形，遂將地名改為「長濱」，沿用至今。長濱鄉因八仙洞史前遺址（長濱文化發源地，是台灣目前所知最早的史前文化）與烏石鼻海岸地景，是台東縣東海岸北段重要的史前文化與生態觀光重鎮。"],
    ["台東縣","太麻里鄉","大貓狸","太麻里源自排灣族語「Tjavualji」，意指陽光照耀的肥沃土地，因每逢晴朗清晨可見旭日自綠島蘭嶼間躍出而享有「日升之鄉」美名。","","太麻里舊稱「大貓狸」，源自排灣族語「Tjavualji」，意指「陽光照耀的肥沃土地」。相傳約一千年前，排灣族始祖率眾遷居於此開荒闢地，族人依當地日照充足、土壤肥沃的特徵為地命名；另一種民間流傳的說法則充滿詩意：每逢四、五月天氣晴朗的清晨，站在金針山遠眺東方，可見旭日自綠島與蘭嶼兩座離島之間的太平洋海面躍出，霞光萬道宛如鵲橋橫跨兩島，太麻里因而博得「日升之鄉」的美名，2000年千禧年台灣本島第一道曙光即在太麻里迎接。光緒3年（1877年），漢人依原住民語音譯將地名定為「太麻里」，是全台少數維持三個字地名的鄉鎮之一。太麻里因金針花海與太麻里溫泉聞名，是台東縣南迴線重要的排灣族文化與農業觀光重鎮。"],
    ["台東縣","大武鄉","巴塱衛","大武舊稱巴塱衛，源自排灣族社名，語意為「拿棒子打」，相傳因當地多沼澤地，族人須以棒子敲擊地面尋覓可用之地而得名。","","大武鄉舊稱「巴塱衛」，源自排灣族「巴塱衛社」（Palangoe）的社名，在排灣族語中意指「拿棒子打」，據傳這一帶早年遍布沼澤濕地，族人為了在濕軟泥濘的地表尋找可供行走或耕作的堅實立足點，習慣手持棒子敲擊試探地面，因而得名，反映了先民克服惡劣地形環境、胼手胝足求生存的拓墾記憶。日治明治34年（1901年），日本政府在此設置憲兵屯所，其後成立「巴塱衛支廳」，是台東廳南部治理排灣族事務的行政中心。1920年，地方行政改制正式將地名簡化為「大武」，沿用至今。大武鄉因是南迴公路與南迴鐵路的重要中繼站，加上大武山自然保留區的生態資源，是連接台東與屏東枋寮的交通門戶。"],
    ["台東縣","綠島鄉","火燒島","綠島舊稱火燒島，相傳因清代先民為開墾焚燒林木、或因當地終年強風燥熱、草木枯黃如火燒過而得名，戰後取翠綠海島之意改稱綠島。","","綠島鄉舊稱「火燒島」，地名由來眾說紛紜：一說是清代最早登島的先民，為了開闢墾地而大規模焚燒原始林木，島嶼一度陷入火海，因而得名；另一說則從氣候特徵出發，指這座孤懸外海的小島終年強風炎熱、乾燥少雨，島上草木時常呈現枯黃焦褐的樣貌，遠望彷彿被大火燒過一般，因而得名「火燒島」。台灣光復後，政府考量「火燒島」給人負面聯想，加上這座島嶼四周海域清澈、植被翠綠，遂改稱寓意優美的「綠島」，沿用至今。綠島因海底溫泉（全球僅有的三處海底溫泉之一）、朝日溫泉與豐富的珊瑚礁潛水生態聞名，加上戒嚴時期曾是政治犯監禁地（今綠島人權文化園區），讓綠島兼具自然生態觀光與台灣近代政治歷史記憶的雙重意義。"],
    ["台東縣","蘭嶼鄉","紅頭嶼","蘭嶼舊稱紅頭嶼，因島上一處山頭岩壁受風化侵蝕呈現紅色而得名，1947年因島上盛產蝴蝶蘭而改稱蘭嶼。","","蘭嶼鄉舊稱「紅頭嶼」，這個地名源自島上一處山頭的地質特徵：這座山頭的岩壁因長期風化侵蝕作用，表面呈現顯著的紅褐色澤，先民依此顯眼的地形地貌，將整座島嶼稱為「紅頭嶼」。民國36年（1947年），台灣省政府鑑於島上原生的蝴蝶蘭資源豐富、花色典雅美麗，遂將島名改為更具詩意與觀光吸引力的「蘭嶼」，沿用至今。蘭嶼是台灣達悟族（雅美族）的傳統領域，達悟族語稱這座島嶼為「Pongso no Tao」，意指「人之島」，族人世代傳承地下屋建築、拼板舟文化與飛魚祭等海洋祭儀信仰，讓蘭嶼成為台灣原住民族中，保留傳統海洋文化最為完整的離島鄉鎮之一，也是台灣本島以外重要的生態與人文觀光勝地。"],
    ["台東縣","延平鄉","延平","延平因境內布農族與鄒族傳統領域，戰後政府為紀念驅逐荷蘭人、開創台灣新局的延平郡王鄭成功而命名。","","延平鄉地名由來，源自對明鄭時期民族英雄鄭成功的紀念：這片位於中央山脈東側的山地行政區，是布農族與少數鄒族的傳統領域，台灣光復後，政府設立山地鄉行政區時，考量鄭成功曾受南明朝廷冊封為「延平郡王」，其驅逐荷蘭人、開創台灣漢人政權的歷史功業深具意義，遂以其封號「延平」作為鄉名，這種以歷史人物封號直接命名山地行政區的方式，與台東大武鄉（原巴塱衛，亦間接呼應鄭成功紀念脈絡的鄰近鄉鎮命名邏輯）等地，共同反映了戰後台灣山地鄉命名時，常見的漢人歷史人物崇敬色彩。延平鄉因鸞山部落的森林博物館與布農族傳統文化聞名，是台東縣重要的布農族生態與人文觀光鄉鎮。"],
    ["台東縣","海端鄉","海端","海端因布農族語意指山棱與溪谷間的緩坡台地，形容當地三面環山、地勢起伏和緩的地形特徵而得名。","","海端鄉地名源自布農族語彙，原意描述當地地處山稜與溪谷之間、地勢相對平緩起伏的台地地形，這片山區三面環山，中央地帶則是較為開闊平坦的河階台地，先民依此地形特徵為地方命名，日治及戰後沿用其音譯漢字「海端」。海端鄉是台東縣布農族的重要傳統領域，境內延平鄉、海端鄉共同構成台東縣布農族主要分布區域。海端鄉因南橫公路貫穿其間，加上霧鹿峽谷、天龍吊橋等壯麗峽谷景觀，以及布農族部落文化與紅葉少棒紀念館（紅葉村原為布農族部落，1968年紅葉少棒隊曾締造台灣棒球史上重要的一頁），是台東縣中段重要的生態觀光與棒球歷史紀念鄉鎮。"],
    ["台東縣","達仁鄉","阿塱衛/安朔","達仁為排灣族「阿塱衛」（阿塑衛）社聚落，因族人分散各處為防禦外敵而漸集合成一聚落，境內安朔村排灣語意指「最多人」。","","達仁鄉地名源自排灣族「阿塱衛」（正確應為「阿塑衛」）社的聚落名稱，這片山區原本居民分散在四面八方各自為居，為了共同抵禦外敵侵擾，逐漸集合聚居形成一個較具規模的聚落，因而得名。境內規模最大的聚落「安朔村」，排灣族語稱「Ajogetsu」，意指「最多人」，反映該聚落匯聚族人之多的特色；「阿塱衛」與「安朔」雖同源於相近的原住民語音譯，如今卻分屬達仁鄉境內兩個不同的地名，這種同源卻分化的地名演變，也出現在著名的「阿塱壹古道」（從達仁鄉南田村通往屏東牡丹鄉，是台灣少數僅存未開發公路的海岸古道）名稱之中。達仁鄉因阿塱壹古道的原始海岸地貌，是台東縣南端重要的生態保育與排灣族文化鄉鎮。"],
    ["台東縣","金峰鄉","虷仔崙/金崙","金峰因境內主要為排灣族部落分布地帶，其中虷仔崙（Kanalung）因與日語「金」（kane）讀音相近，日治時期改稱金崙，1946年設鄉沿用金峰之名。","","金峰鄉境內主要是排灣族傳統領域，鄉名「金峰」據信與境內知名聚落「金崙」的地名演變有關：這一帶原稱「虷仔崙」，源自排灣族語「Kanalung」的音譯，日治時期，日本殖民政府發現「kana」音與日語漢字「金」的讀音（kane，轉音為kana）相同，便以「金」字取代原本的音譯用字，將地名改為「金崙」；台灣光復後，這片以排灣族為主的山地行政區設鄉時，取境內「金」崙山勢「峰」巒之意，正式定名為「金峰鄉」。金峰鄉因嘉蘭村的長濱文化遺址、多良車站（有「全台最美車站」之稱，行政區劃上位於太麻里鄉但緊鄰金峰鄉）周邊景觀，加上金崙溫泉，是台東縣南迴線重要的排灣族文化與溫泉觀光鄉鎮。"],
    ["台東縣","三仙台","比西里岸","三仙台原是海岸阿美族比西里岸部落領域，因島上三塊巨石相傳為八仙過海時李鐵拐、何仙姑、呂洞賓歇腳處而得名。","","三仙台地名由來，源自一則八仙過海的民間傳說：這座位於成功鎮外海、由海蝕地形發育而成的離岸小島，島上矗立著三塊巨大的礁岩，相傳八仙過海途經此地時，八仙之中的李鐵拐、何仙姑、呂洞賓三位仙人曾在此歇腳停留，因而得名「三仙台」，這種將自然奇石地景附會為神仙傳說的命名方式，在台灣各地沿海地區相當常見。三仙台原是海岸阿美族「比西里岸部落」（Pisirian，阿美族語意指「放羊的地方」，因部落附近小山曾有大量山羊棲息而得名）的傳統活動領域，1987年興建的八拱跨海步橋，成為連接台灣本島與三仙台島嶼的重要地標。三仙台因獨特的海蝕地形與跨海步橋景觀，是台東縣東海岸最具代表性的地標之一。"],
    ["台東縣","知本","卡大地布","知本源自卑南族卡大地布部落（Katratripulr）語尾音節音譯，「卡大地布」意指團結在一起，是卑南族傳統四大部落之一。","","知本地名源自卑南族「卡大地布部落」（Katratripulr，又稱卡地布、Katripulr）的部落名稱，這個名稱在卑南族語中意指「團結在一起」或「合併為一」，反映該部落由不同氏族凝聚整合而成的歷史淵源，是卑南族傳統「八社十部落」中的四大核心部落之一，舊稱「卡砦卡蘭部落」（Kazekalan）。日治時代與戰後官方，從部落名「Katratripulr」中擷取中段音節「tripulr」，以閩南語漢字音譯轉寫為「知本」（Ti-pún），此後這個簡化的漢字地名，廣泛套用於知本車站、知本溫泉等周邊事物的命名。明治37年（1904年），族人從知本溫泉北方山麓遷移至知本溪左岸河階，形成今日卡大地布部落所在地；卡大地布部落至今仍保存猴祭、大獵祭等完整的卑南族傳統祭儀文化，加上知本溫泉的觀光開發，讓知本兼具原住民文化傳承與溫泉觀光的雙重面貌。"],
    ["台東縣","都蘭","Idulan","都蘭源自阿美族語「Idulan」，意指用石頭堆砌的籬笆，因當地都蘭山下部落以石牆圍籬防禦而得名，都蘭山更是卑南族信仰中的聖山。","","都蘭地名源自阿美族語「Idulan」，意指以石塊堆砌而成的圍籬或石牆，反映當地阿美族部落早期為防禦外敵侵擾，習慣在聚落周圍以石材堆砌籬笆的傳統建築方式，這種因防禦石牆而得名地方的邏輯，與台北木柵（木造柵欄）、桃園龍潭三坑仔等地名，同屬先民依防禦工事命名聚落的常見案例。都蘭山是這一帶最顯著的地標，海拔約1190公尺，不僅是阿美族心目中祖靈居住的聖山，在卑南族的信仰體系中，都蘭山同樣被尊為守護台東平原的聖山，兩個不同族群共同尊崇同一座山峰的現象，展現了東海岸原住民族信仰文化的交融。都蘭因保留完整的阿美族部落文化，加上都蘭糖廠藝術聚落與衝浪勝地金樽，是台東縣東海岸重要的原住民文化與藝術觀光重鎮。"],
    ["台東縣","多良","多多良","多良舊稱多多良，因排灣族部落多良社而得名，境內多良車站因面向太平洋的絕美景色，享有「全台最美車站」的美稱。","","多良地名源自排灣族「多良社」的部落名稱，是太麻里鄉境內排灣族傳統聚落之一，這一帶清代與日治時期原是排灣族「泰武勇」（太麻里總社頭目）勢力範圍內的部落所在地。日治時期為配合台東線鐵路（今南迴線）的興建，在此設置「多多良驛」，戰後簡化為「多良車站」。這座車站因坐落於山坡台地之上，月台正對著蔚藍的太平洋海岸線，居高臨下、視野遼闊，被譽為「全台最美的車站」，加上鐵路截彎取直後車站雖已停用，卻因絕美景致持續吸引大批遊客與攝影愛好者前來朝聖，讓這個源自排灣族部落名稱的地名，意外因鐵道美景而聲名遠播，成為台東縣南迴線最具代表性的觀光地標之一。"],
    ["台東縣","初鹿","Mulivelivek","初鹿源自卑南族「Mulivelivek」，是卑南族八社之一，漢人依當地早期梅花鹿群聚出沒的生態特徵，將地名譯寫為初鹿。","","初鹿地名源自卑南族「Mulivelivek」的部落名稱，是卑南族傳統「八社十部落」體系中的重要一員，該部落與同樣源自初鹿、於1980年代分開獨立舉行祭儀的「龍過脈」部落，共同構成這一帶卑南族的聚落網絡。漢人依原住民部落名音譯之餘，考量這一帶山區早期是梅花鹿群聚棲息、出沒頻繁的地帶，便將地名意譯結合為「初鹿」，兼顧音譯與地方生態特徵的雙重意涵。初鹿地區因擁有全台面積數一數二的初鹿牧場，加上卑南族傳統的猴祭、大獵祭等祭儀文化保存完整，是台東縣卑南鄉境內重要的酪農休閒與原住民文化觀光聚落，初鹿鮮乳更是台東知名的農特產品牌。"],
    ["台東縣","金崙","虷仔崙","金崙原稱虷仔崙，源自排灣族語「Kanalung」音譯，日治時期因「kana」音與日語「金」字讀音相同，遂改稱金崙，境內金崙溫泉聞名。","","金崙地名由來，源自一次因日語發音巧合而生的地名轉化：這一帶原稱「虷仔崙」，是排灣族語「Kanalung」的音譯漢字，確切原意已不易考證。日治時期，日本殖民政府發現原住民語地名中「kana」這個音節，恰好與日語漢字「金」的讀音（kane，轉音為kana）完全相同，便順勢以「金」字取代原本的音譯用字，將地名簡化改稱「金崙」，這種借用發音巧合、以日語漢字替換原住民語音譯的命名方式，與屏東春日鄉（喀蘇柏幹與日語春日Kasuga發音相近）屬於相似的案例。金崙因擁有天然溫泉資源，金崙溫泉是台東縣南迴線知名的野溪溫泉與旅宿聚落，加上金崙車站與周邊排灣族部落文化，是太麻里鄉南側重要的溫泉觀光重鎮。"],
