Emoji": "📚", "pages": ["你知道『卓蘭鎮』這個地方，是怎麼來的嗎？卓蘭原稱塔連，是巴宰族語「Tarien」音譯，意指美麗的原野，歷經罩蘭、打難等多次寫法變化，1920年定名卓蘭。", "卓蘭地名源自巴宰族（巴則海族）「Tarien」的音譯，意思是「美麗的原野」，清雍正年間的契字上寫作「塔連」，這是目前所知最早的漢字記錄；乾隆51年繪製的《岸番把守圖》中，大安溪出山口北岸平原（今三義鯉魚潭附近）已標註「罩蘭埔」地名，當時罩蘭仍屬清廷劃定的生番界內，是泰雅族傳統領域。道光16年（1836年）刊行的《彰化縣志》改稱「罩蘭」，同治年間的《臺灣府輿圖纂要》又寫作「打難」，", "可見這個地名歷經多次不同的漢字音譯版本。乾隆55年（1790年）林爽文事件後，清廷實施「番屯制」，巴宰族取得罩蘭地區作為屯丁贍養埔地，漢人得以持續在此開墾，但與泰雅族的關係長期緊繃，直到光緒10年（1884年）仍爆發武裝衝突。1920年，日本殖民政府正式將地名定為「卓蘭」，沿用至今。卓蘭因耕地多為旱田，盛產葡萄、楊桃、水梨與柑橘，享有「水果王國」的美譽。"], "quiz": {"q": "關於「卓蘭鎮」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "卓蘭原稱塔連，是巴宰族語「Tarien」音譯，意指美麗的原野，歷經罩蘭、打難等多次寫法變化，1920年定名卓蘭。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！卓蘭原稱塔連，是巴宰族語「Tarien」音譯，意指美麗的原野，歷經罩蘭、打難等多次寫法變化，1920年定名卓蘭。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 127, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『造橋鄉』這個地方，是怎麼來的嗎？造橋因清雍正年間居民為了跨越南港溪、解決頭份與造橋兩地交通問題而集資造橋得名。", "造橋地名由來相當直白：清雍正9年（1731年），頭份與造橋兩地之間的交通因南港溪河床阻隔而諸多不便，當地居民為了解決往來問題，集資合力興建一座橋梁，命名為「登雲橋」，又稱「長橋」，這座橋的興建，便成為「造橋」這個地名的由來。另有一說指出，是一位苗栗客籍拓荒者與商旅合作，共同出資建造這座跨越南港溪的橋梁，為了紀念這項工程，", "便以「造橋」作為當地地名，兩種說法雖細節略有出入，但核心都圍繞著這座解決交通問題的橋梁而生。造橋鄉地處苗栗縣北側丘陵地帶，因土壤與氣候條件適合種植南瓜，近年舉辦的「苗栗縣南瓜節」（原稱造橋瓜瓜節）已成為地方重要的農特產推廣活動，讓這個因造橋通行而得名的鄉鎮，也發展出獨具特色的瓜果產業。"], "quiz": {"q": "關於「造橋鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "造橋因清雍正年間居民為了跨越南港溪、解決頭份與造橋兩地交通問題而集資造橋得名。"], "correct": 3, "rightFb": "沒錯！造橋因清雍正年間居民為了跨越南港溪、解決頭份與造橋兩地交通問題而集資造橋得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 128, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『西湖鄉』這個地方，是怎麼來的嗎？西湖舊稱四湖，因附近有頭湖、二湖至九湖等一連串河谷小盆地，四湖位居中央，為避免與雲林縣四湖鄉同名而改稱西湖。", "西湖鄉舊稱「四湖」，這個地名源自當地特殊的地形分布：西湖溪流域沿岸分布著一連串大小不一的河谷小盆地，客家人慣以「湖」稱呼這種山間盆地地形，先民依序將這些盆地由下游往上游命名為頭湖、二湖、三湖、四湖、五湖，一路排列至九湖，其中「四湖」恰好位居這片區域的中央地帶，因而成為整個鄉鎮的代表性地名。戰後台灣行政區重新命名時，", "因雲林縣也有一個同樣稱為「四湖」的鄉鎮，兩地容易混淆，苗栗的四湖鄉便依其地理位置改稱「西湖」，沿用至今，這也是台灣少數因與他縣地名重複、而非因語音演變或行政改制才更名的案例。西湖鄉境內丘陵地形發達，適合種植地瓜，近年舉辦的「西湖蕃薯文化節」是地方重要的農特產推廣活動。"], "quiz": {"q": "關於「西湖鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "西湖舊稱四湖，因附近有頭湖、二湖至九湖等一連串河谷小盆地，四湖位居中央，為避免與雲林縣四湖鄉同名而改稱西湖。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 1, "rightFb": "沒錯！西湖舊稱四湖，因附近有頭湖、二湖至九湖等一連串河谷小盆地，四湖位居中央，為避免與雲林縣四湖鄉同名而改稱西湖。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [125, 126, 127, 128]}, {"id": "main-苗栗縣-3", "title": "苗栗縣．頭屋鄉至三義鄉", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識苗栗縣的幾個地方：頭屋鄉、公館鄉、銅鑼鄉、三義鄉。」", "stops": [{"placeId": 129, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『頭屋鄉』這個地方，是怎麼來的嗎？頭屋舊稱崁頭屋，因位於老田寮溪沿岸河階地形的第一個河階（崁）上而得名，後簡化為頭屋。", "頭屋鄉舊稱「崁頭屋」，這個地名結合了地形與聚落兩種概念：老田寮溪沿岸分布著多層河階地形，客家話稱這種因河流侵蝕堆積形成的階地為「崁」，而這處聚落恰好位於沿岸第一個（最下游或最前端）河階之上，因而得名「崁頭屋」，其後簡化為「頭屋」，沿用至今。頭屋鄉境內另有「天花湖」一地，地名由來眾說紛紜，有一說指過去天花或性病患者曾被送至此地隔離；另一說則稱此地過去風月場所林立，", "因而得名，但確切緣由已難以考證。清光緒年間，墾戶黃南球率眾進墾頭屋一帶，境內流傳的「番王」傳說，據信與當地原住民貓閣社道卡斯族人的後裔有關，反映出頭屋是漢人與平埔族群交會拓墾的重要地帶。頭屋鄉因水源充足、氣候適宜，是苗栗縣重要的蘿蔔產地，每年舉辦「頭屋蘿蔔節」推廣地方農特產。"], "quiz": {"q": "關於「頭屋鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "頭屋舊稱崁頭屋，因位於老田寮溪沿岸河階地形的第一個河階（崁）上而得名，後簡化為頭屋。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！頭屋舊稱崁頭屋，因位於老田寮溪沿岸河階地形的第一個河階（崁）上而得名，後簡化為頭屋。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 130, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『公館鄉』這個地方，是怎麼來的嗎？公館原稱隘寮下，因清代設隘防禦原住民出草，並在隘寮下方興建處理隘務、墾務的公館而得名。", "公館鄉地名源自清代的隘防制度：這一帶因鄰近原住民傳統領域，早期先民為防範出草侵擾，在山區要隘設置「隘寮」派駐隘丁巡防，這處聚落因位於隘寮下方而俗稱「隘寮下」或「隘寮腳」；隨著開墾業務日益繁重，墾戶首領便在此興建一座專門處理隘務與墾務的辦事處，這種建築在客家話中稱為「公館」，久而久之便取代了原本的「隘寮下」，成為地名的正式稱呼，這與台灣其他各地因業戶興建辦事處而得名「公館」的地方，", "屬於相同的命名邏輯。公館鄉因四周山丘環繞、中央是後龍溪沖積而成的河谷平原，南北狹長、地勢低平，形似蛤蜊，因而也有「蛤仔市」的別稱。公館鄉境內曾是「亞洲第一口油井」出磺坑油田的所在地，加上氣候溫和、雨量充沛，適合紅棗生長，享有「紅棗的故鄉」美名，每年舉辦「公館紅棗季」推廣地方農特產。"], "quiz": {"q": "關於「公館鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "公館原稱隘寮下，因清代設隘防禦原住民出草，並在隘寮下方興建處理隘務、墾務的公館而得名。"], "correct": 3, "rightFb": "沒錯！公館原稱隘寮下，因清代設隘防禦原住民出草，並在隘寮下方興建處理隘務、墾務的公館而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 131, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『銅鑼鄉』這個地方，是怎麼來的嗎？銅鑼原稱銅鑼灣，因聚落坐落於三面環山、一面開口的弧形山麓地形，狀似樂器銅鑼而得名。", "銅鑼鄉地名由來源自地形意象：這處聚落位於銅鑼斷層線谷中、西湖溪溪谷東岸，雙峰山向北延伸的餘脈環繞四周，地形北面銜接南勢坑分割台地，西側環繞苗栗丘陵，南面則有雙峰山塊餘脈屏障，三面山勢圍成一個圓弧狀地形，僅一面開口向外，形狀神似傳統樂器「銅鑼」，因而得名「銅鑼灣」，後簡化為「銅鑼」。銅鑼鄉境內的雙峰山，", "因山形俊美、氣勢雄渾，昔日文人墨客將「雙峰陵霄」列為古苗栗八景之一，是全鄉最顯著的地標。銅鑼鄉因氣候與土壤條件適合杭菊與芋頭種植，每年舉辦「銅鑼杭菊芋頭節」推廣地方農特產，秋冬時節杭菊花田盛開，也成為苗栗縣熱門的賞花景點之一，讓這個因地形似樂器而得名的山谷鄉鎮，兼具農業生產與觀光休閒的雙重機能。"], "quiz": {"q": "關於「銅鑼鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "銅鑼原稱銅鑼灣，因聚落坐落於三面環山、一面開口的弧形山麓地形，狀似樂器銅鑼而得名。"], "correct": 3, "rightFb": "沒錯！銅鑼原稱銅鑼灣，因聚落坐落於三面環山、一面開口的弧形山麓地形，狀似樂器銅鑼而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 132, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『三義鄉』這個地方，是怎麼來的嗎？三義舊稱三叉河，因打木溪、水尾溪等支流在此匯集成西湖溪、形成三叉狀地形而得名，戰後取諧音改稱三義。", "三義鄉舊稱「三叉河」，這個地名直接描述了當地的水文地形：發源於雙連潭與十六份一帶的水尾溪（原名打木溪）與其他支流，在廣盛、雙湖交界的三興橋附近會合，匯流成西湖溪，因河道在此呈現三叉分歧的形狀，因而得名「三叉河」。道光22年（1842年），李藤華等人在此設街立庄，正式命名為「三叉河庄」；1842年，漢人組織「金華生」墾號，看中此地樟林茂密，於十六份等地搭寮蒸煉樟腦，", "逐漸發展出以山林物產交易為核心的市街聚落，並在聚落高處興建五穀宮作為信仰中心。1953年，「三叉」正式改名為「三義」，一般認為是因「義」字的簡寫字形與「叉」字相近，加上「義」字寓意更為正面吉祥，因而順勢改名。如今三義因舊山線鐵道與魚藤坪斷橋等歷史遺跡，加上木雕產業聞名全台，每年舉辦「三義國際木雕藝術節」，是苗栗縣重要的觀光與工藝重鎮。"], "quiz": {"q": "關於「三義鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["三義舊稱三叉河，因打木溪、水尾溪等支流在此匯集成西湖溪、形成三叉狀地形而得名，戰後取諧音改稱三義。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 0, "rightFb": "沒錯！三義舊稱三叉河，因打木溪、水尾溪等支流在此匯集成西湖溪、形成三叉狀地形而得名，戰後取諧音改稱三義。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [129, 130, 131, 132]}], "sideQuests": [{"id": "side-苗栗縣-1", "title": "苗栗縣．大湖鄉至南庄鄉", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識苗栗縣的幾個地方：大湖鄉、獅潭鄉、三灣鄉、南庄鄉。」", "stops": [{"placeId": 133, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『大湖鄉』這個地方，是怎麼來的嗎？大湖原稱馬凹，因泰雅族見此地形如大湖而得名，清咸豐年間吳定新兄弟入墾後正式以「大湖」為名。", "大湖鄉在漢人入墾前，東部山區為泰雅族汶水群、大湖群的傳統領域，原住民依當地遍生山胡椒，將此地稱為「馬凹」（Ma-Ao，意即山胡椒）；大南勢一帶的泰雅族則另稱此地為「巴價拉崎」（Bagalagya），有一說是為了紀念一位頭目，另一說則指周圍溪水環繞之意。清咸豐7年（1857年），居住在銅鑼新雞隆的吳定新、吳定連兄弟翻越關刀山，見這片由後龍溪沖積而成、四周群山環繞、形似盆地大湖的地形，", "因而以「大湖」稱之，兄弟倆並組成「金和成」墾號武裝入墾，從事製材與製腦事業，但仍時常遭到泰雅族的抵抗與偷襲，開墾進度因而受限。1913年，抗日志士羅福星曾在此策劃武裝起義，遭日方鎮壓後演變為「大湖事件」。如今大湖鄉因氣候溫和多雨，發展出全國聞名的草莓產業，享有「草莓王國」美譽，每年舉辦「大湖草莓文化季」吸引大量遊客前來採果。"], "quiz": {"q": "關於「大湖鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "大湖原稱馬凹，因泰雅族見此地形如大湖而得名，清咸豐年間吳定新兄弟入墾後正式以「大湖」為名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！大湖原稱馬凹，因泰雅族見此地形如大湖而得名，清咸豐年間吳定新兄弟入墾後正式以「大湖」為名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 134, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『獅潭鄉』這個地方，是怎麼來的嗎？獅潭因當地一道山稜遠望似獅子俯臥、獅頭伸入一潭飲水而得名，另一說為賽夏族語音轉而來。", "獅潭鄉地名由來流傳著一個頗富傳奇色彩的故事：在今永興村與百壽村交界處，橫亙著一道山稜，遠遠望去，山勢彷彿一頭獅子俯臥於地，而獅頭部位恰好延伸入一旁的水潭中飲水，當地居民因而將這座潭稱為「獅潭」，地名便沿用至今；據說早年每逢元宵節前後，附近居民還能聽見潭邊傳出鑼鼓喧天的聲響，增添了幾分神秘色彩，不過中豐公路開闢、切斷這道山脈之後，", "便再也沒有這樣的傳聞。另一種說法則認為，「獅潭」其實是賽夏族「西潭社」（Sawi'）語音轉變而來，與獅子毫無關聯。清同治年間，獅潭仍是原住民的傳統領域，直到光緒年間，墾首黃南球率領客家移民入墾，才開始有漢籍居民定居。獅潭鄉境內因氣候溫和、土質適合，近年發展出仙草種植與加工產業，每年舉辦的「獅潭仙草花節」是地方重要的觀光活動。"], "quiz": {"q": "關於「獅潭鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「獅潭鄉」市集而得名", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "獅潭因當地一道山稜遠望似獅子俯臥、獅頭伸入一潭飲水而得名，另一說為賽夏族語音轉而來。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！獅潭因當地一道山稜遠望似獅子俯臥、獅頭伸入一潭飲水而得名，另一說為賽夏族語音轉而來。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 135, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『三灣鄉』這個地方，是怎麼來的嗎？三灣因中港溪流經此地形成連續三個大彎曲的河階地形，聚落恰好位於第三個曲流河階而得名。", "三灣鄉地名由來源自中港溪的河道地形：這條溪流流經三灣一帶時，因地勢與地質因素形成連續彎曲的曲流，先民依序將沿岸的河階聚落稱為頭灣、二灣、三灣，三灣正是這條河道上第三個彎曲處所形成的河階平地，因而得名，這種依河道彎曲次序命名地方的方式，與新北市三峽舊稱「三角湧」同樣是描述河川地形的典型範例。三灣鄉清代因鄰近北埔、南庄一帶泰雅族與賽夏族的傳統領域，", "是漢人拓墾山區前緣的重要據點，客家移民與原住民之間互動頻繁，既有貿易往來，也曾發生武裝衝突。三灣鄉因丘陵地形、氣候涼爽，適合種植水梨，是苗栗縣重要的水梨產地之一，每年舉辦「三灣梨觀光季」推廣地方農特產，讓這個因河道彎曲得名的山區鄉鎮，發展出獨具特色的果樹經濟。"], "quiz": {"q": "關於「三灣鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「三灣鄉」市集而得名", "三灣因中港溪流經此地形成連續三個大彎曲的河階地形，聚落恰好位於第三個曲流河階而得名。"], "correct": 3, "rightFb": "沒錯！三灣因中港溪流經此地形成連續三個大彎曲的河階地形，聚落恰好位於第三個曲流河階而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 136, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『南庄鄉』這個地方，是怎麼來的嗎？南庄因聚落位於清代最早開墾的據點「田尾公館」南方而得名。", "南庄鄉地名由來相對單純，源自其地理位置：清代這一帶最早開墾成形的據點稱為「田尾公館」，隨著拓墾範圍逐漸向南擴展，在田尾公館南方新形成的聚落，便被稱為「南庄」，以區別於北側較早開發的核心區域。南庄鄉是賽夏族的傳統領域，也是台灣少數賽夏族與客家族群密切共居、文化交融的地區，", "賽夏族兩年一度舉行的矮靈祭（paSta'ay），是全鄉極具代表性的原住民祭典，吸引大量遊客與研究者前來觀禮。南庄老街保留了完整的客家、閩南與日治時期建築風貌，加上鄰近的向天湖、蓬萊溪護漁區等自然景觀，已被劃入參山國家風景區範圍，是苗栗縣山城觀光的重要據點之一。"], "quiz": {"q": "關於「南庄鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因清代此地盛產某種作物，官府設「南庄鄉」市集而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "南庄因聚落位於清代最早開墾的據點「田尾公館」南方而得名。"], "correct": 3, "rightFb": "沒錯！南庄因聚落位於清代最早開墾的據點「田尾公館」南方而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [133, 134, 135, 136]}, {"id": "side-苗栗縣-2", "title": "苗栗縣．泰安鄉至崎頂", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識苗栗縣的幾個地方：泰安鄉、勝興、龍騰、崎頂。」", "stops": [{"placeId": 137, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『泰安鄉』這個地方，是怎麼來的嗎？泰安舊稱大安，因是大安溪發源地而得名，1954年因與台中大安鄉同名，取諧音及「國泰民安」之意改名。", "泰安鄉是苗栗縣唯一的山地鄉，境內幾乎全境深入雪山山脈，早期因是大安溪的發源地，被稱為「大安」。1947年，這處山地行政區正式成立時，初期命名為「大安鄉」，然而由於名稱與台中縣（今台中市）大安鄉完全重複，容易造成行政與郵務混淆，因此於1954年申請改名；新地名一方面保留「大安」的諧音，另一方面則取「國泰民安」的吉祥寓意，", "正式定名為「泰安鄉」，沿用至今，是台灣少數因與他鄉鎮同名而更改名稱、且巧妙保留原音同時賦予嶄新吉祥意涵的案例。泰安鄉境內主要居民為泰雅族與客家人，由於溫泉資源豐富，素有「泰安溫泉鄉」的雅號，加上鄉內一半以上土地劃入雪霸國家公園範圍，保留了豐富的高山生態與瀕危物種，是苗栗縣重要的生態旅遊與溫泉觀光重鎮。"], "quiz": {"q": "關於「泰安鄉」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "泰安舊稱大安，因是大安溪發源地而得名，1954年因與台中大安鄉同名，取諧音及「國泰民安」之意改名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！泰安舊稱大安，因是大安溪發源地而得名，1954年因與台中大安鄉同名，取諧音及「國泰民安」之意改名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 138, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『勝興』這個地方，是怎麼來的嗎？勝興舊稱十六份，因清代此地設有十六座蒸餾樟腦的腦灶而得名，境內勝興車站是台鐵海拔最高的車站。", "勝興地名源自清代盛極一時的樟腦產業：道光22年（1842年）漢人組織「金華生」墾號進入三叉河一帶開墾，因當地樟樹林密布，在十六份等處搭建腦寮蒸餾樟腦，依熬製樟腦所需的灶數計算，此處恰好設有十六座腦灶，因而得名「十六份」，這與苗栗地區另有「二十份」等以腦灶或墾股數量命名的地名，屬於同一套計量式命名邏輯。1908年台鐵縱貫線山線通車，", "在十六份設站，因海拔402.326公尺，是台鐵目前海拔最高的車站；戰後車站與周邊聚落更名為「勝興」，車站鐵道邊坡上，至今仍保留著「十六份」的舊名標示，供旅客追憶這段樟腦產業史。勝興車站因鄰近龍騰斷橋、舊山線鐵道等歷史遺跡，加上木造車站建築保存完整，已成為苗栗縣熱門的鐵道懷舊觀光景點之一。"], "quiz": {"q": "關於「勝興」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["勝興舊稱十六份，因清代此地設有十六座蒸餾樟腦的腦灶而得名，境內勝興車站是台鐵海拔最高的車站。", "因清代此地盛產某種作物，官府設「勝興」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！勝興舊稱十六份，因清代此地設有十六座蒸餾樟腦的腦灶而得名，境內勝興車站是台鐵海拔最高的車站。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 139, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『龍騰』這個地方，是怎麼來的嗎？龍騰舊稱魚藤坪，相傳因先民種植魚藤毒殺作怪的鯉魚精，後因「魚藤」不雅改稱龍騰，境內龍騰斷橋是知名地標。", "龍騰舊稱「魚藤坪」，地名由來流傳著一則生動的民間傳說：相傳先民初墾此地時，附近鯉魚潭中有一尾鯉魚精經常興風作浪、危害地方，村民為了克制鯉魚精，便在龍騰一帶的山區廣植具有毒性的魚藤，並將東側的高山改稱「關刀山」，寓意藉關刀之力斬除魚藤、毒殺鯉魚精，此後鯉魚精果然不再作怪，居民得以安居樂業。後來村民認為「魚藤」二字不夠雅致，遂改稱寓意飛龍騰躍的「龍騰」。這裡最知名的地標是1907年完工的「魚藤坪橋」（即龍騰斷橋），", "是縱貫線鐵路全線通車前興建的磚造、鋼鈑梁及桁架梁混合式橋梁，屬台灣鐵道工程技術的代表作之一。這座橋梁在1935年新竹台中大地震中嚴重震毀，僅存拱型橋墩挺立至今，1999年921大地震又再度震裂部分橋墩，如今已列為苗栗縣定古蹟，供後人憑弔這段鐵道與地震交織的歷史。"], "quiz": {"q": "關於「龍騰」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因清代此地盛產某種作物，官府設「龍騰」市集而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "龍騰舊稱魚藤坪，相傳因先民種植魚藤毒殺作怪的鯉魚精，後因「魚藤」不雅改稱龍騰，境內龍騰斷橋是知名地標。"], "correct": 3, "rightFb": "沒錯！龍騰舊稱魚藤坪，相傳因先民種植魚藤毒殺作怪的鯉魚精，後因「魚藤」不雅改稱龍騰，境內龍騰斷橋是知名地標。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 140, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『崎頂』這個地方，是怎麼來的嗎？崎頂舊稱老衢崎，因位於一段長崎路（衢崎）頂端的聚落而得名。", "崎頂舊稱「老衢崎」，「衢」在漢語中意指四通八達的道路，「崎」則指崎嶇不平的坡地，「老衢崎」意指一段古老崎嶇道路的最頂端處，這處聚落因坐落於這段坡路的頂點而得名，後簡化為「崎頂」。崎頂地處竹南鎮西北側沿海地帶，是苗栗縣最北端的聚落，因縱貫鐵路行經而設有崎頂車站；車站旁保留了兩座建於日治時期的雙軌鐵路隧道，", "一號隧道興建較早，二號隧道建於1928年，因兩座隧道相距僅約50公尺，並列如母子相依，被稱為「崎頂子母隧道」，是台灣早期少見的雙線鐵路隧道之一，也是苗栗縣境內僅存的鐵路舊隧道， [{"placeId": 143, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『東區』這個地方，是怎麼來的嗎？東區舊稱頂橋頭，因位居台中盆地最低窪處、旱溪上架有橋梁而得名，日治後因區位於台中舊城之東而改稱東區。", "東區地處台中盆地最低窪之處，清代因當地旱溪上架設一座橋梁，且此地相對於下游其他橋梁位置較高，因而被稱為「頂橋頭」，透過這座橋梁，水路交通得以南抵大里、阿罩霧（今霧峰）等地，是早期台中盆地重要的水陸轉運節點。日治時期，隨著台中市街規劃向四周擴展，這一帶因地處台中舊城核心（今中區）之東側，", "正式定名為「東區」。台中盆地地勢低窪的東區，日治後期因汽車零件加工業與材料行林立，曾有「武市」之稱，是台中重要的黑手（黑手師傅）產業聚落；戰後隨著國立中興大學在此創校，東區逐漸從工業氣息濃厚的「武市」，轉型出兼具學術文風的城市風貌，成為台中市區東側重要的文教與住宅地帶。"], "quiz": {"q": "關於「東區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "東區舊稱頂橋頭，因位居台中盆地最低窪處、旱溪上架有橋梁而得名，日治後因區位於台中舊城之東而改稱東區。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！東區舊稱頂橋頭，因位居台中盆地最低窪處、旱溪上架有橋梁而得名，日治後因區位於台中舊城之東而改稱東區。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 144, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『南區』這個地方，是怎麼來的嗎？南區舊稱半平厝，因鄰近大里溪畔地勢低平的聚落而得名，日治後因位於台中舊城之南改稱南區。", "南區清代原是台中盆地南側的農業聚落地帶，舊稱「半平厝」，這個地名的確切語源已不易考證，一般認為與當地地勢平坦、聚落規模不大有關。1920年代，台中市街依日式棋盤式規劃向外擴展，這一帶因地處台中舊城核心之南，正式劃入「台中市」並定名為「南區」。南區境內設有台中州立台中農業試驗場等日治時期農業研究機構，", "加上鄰近台中車站與縱貫鐵路，逐漸發展成兼具農業試驗與鐵道運輸機能的市郊地帶。戰後，國立中興大學、台中榮民總醫院等重要機構陸續在南區周邊設立，加上台灣大道與復興路等主要幹道貫穿，南區逐漸從清代單純的農業聚落，轉型為台中市區南側重要的文教醫療與住宅生活圈。"], "quiz": {"q": "關於「南區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "南區舊稱半平厝，因鄰近大里溪畔地勢低平的聚落而得名，日治後因位於台中舊城之南改稱南區。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！南區舊稱半平厝，因鄰近大里溪畔地勢低平的聚落而得名，日治後因位於台中舊城之南改稱南區。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 145, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『西區』這個地方，是怎麼來的嗎？西區舊稱麻園頭，因清代此地遍植黃麻、作為紡織原料而得名，日治後因位於台中舊城之西改稱西區。", "西區地名源自清代的經濟作物種植：這一帶因土壤與氣候適合黃麻生長，先民大量栽植黃麻作為紡織繩索的原料，因而得名「麻園頭」，是台灣地名中依經濟作物直接命名的常見案例之一，與台北「麻園頭」等地同樣反映清代台灣麻類作物種植的普遍性。1920年代，因地處台中舊城核心之西側，「麻園頭」正式改制為「西區」。日治時期，", "台中州廳、台中刑務所等重要官署機構陸續在西區周邊設立，加上台中公園、綠川、柳川等綠帶水岸貫穿其間，西區逐漸發展成台中市重要的行政與商業核心地帶。如今西區因鄰近國立自然科學博物館、審計新村與草悟道等文創景點，已從清代單純的黃麻產地，轉型為台中市極具人文氣息的生活商圈。"], "quiz": {"q": "關於「西區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東 d": 148, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『西屯區』這個地方，是怎麼來的嗎？西屯舊稱西大墩，因位於大墩（今中區）之西側而得名，早期為廖姓宗親聚落，日治後簡化為西屯。", "西屯地名由來相對單純：這一帶因位於清代台中盆地核心聚落「大墩街」（今中區）的西方，加上當地也有一座類似大墩的小土丘（俗稱墩仔頂），故稱「西大墩」，與東側的大墩街合稱「東大墩、西大墩」；西大墩地當犁頭店（今南屯區）與壩雅（今大雅區）之間的交通要衝，清道光年間發展成街肆。西大墩早期是廖姓宗親的主要聚居地，至今西屯一帶仍有許多廖姓家族世居於此。1920年，", "日本殖民政府推行地方行政改制，將「西大墩」簡化為「西屯」，隸屬台中州大屯郡，這也是「大屯」（今北屯、西屯、南屯共同的郡名淵源）一詞的由來。如今西屯區因台灣大道、台中國家歌劇院與逢甲商圈的發展，已從清代廖姓宗親聚落，轉型為台中市最重要的新興都會核心區之一。"], "quiz": {"q": "關於「西屯區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「西屯區」市集而得名", "因鄭成功部隊行經此地時隨口命名而流傳下來", "西屯舊稱西大墩，因位於大墩（今中區）之西側而得名，早期為廖姓宗親聚落，日治後簡化為西屯。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 2, "rightFb": "沒錯！西屯舊稱西大墩，因位於大墩（今中區）之西側而得名，早期為廖姓宗親聚落，日治後簡化為西屯。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 149, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『南屯區』這個地方，是怎麼來的嗎？南屯舊稱犁頭店，因清代此地聚集打造犁頭、鋤頭等農具的鐵匠店鋪而得名，日治後因位於大墩之南改稱南屯。", "南屯是台中盆地開發最早的漢人聚落之一，地名由來直接反映了清初的產業型態：拓荒時期，這一帶聚集了許多專門打造犁、鋤等墾耕用具的鐵匠店鋪，因而得名「犁頭店」，是台灣地名中依手工業聚落直接命名的典型案例，與台南、彰化等地同名的犁頭店聚落，都反映了清初農具鍛造業對聚落發展的重要性。犁頭店因地處貓霧捒社（平埔族拍瀑拉族分支）傳統領域，", "加上鄰近旱溪、筏子溪，是漢人與平埔族群交會拓墾的重要據點。1920年，日本殖民政府推行地方行政改制，因地處大墩（今中區）之南方，「犁頭店」正式改稱「南屯」。如今南屯區因鄰近台中高鐵站與台中市政府所在的七期重劃區，已從清代打造農具的鐵匠聚落，蛻變為台中市最具代表性的新市政中心與豪宅聚落。"], "quiz": {"q": "關於「南屯區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因清代此地盛產某種作物，官府設「南屯區」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "南屯舊稱犁頭店，因清代此地聚集打造犁頭、鋤頭等農具的鐵匠店鋪而得名，日治後因位於大墩之南改稱南屯。"], "correct": 3, "rightFb": "沒錯！南屯舊稱犁頭店，因清代此地聚集打造犁頭、鋤頭等農具的鐵匠店鋪而得名，日治後因位於大墩之南改稱南屯。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 150, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『太平區』這個地方，是怎麼來的嗎？太平舊稱鳥榕頭，因霧峰林家先人故居前有兩棵大榕樹而得名，另有一說源自清代漢人與洪雅族衝突後祈求太平之意。", "太平地名的由來流傳著多種說法。「鳥榕頭」一說源自清乾隆末年，霧峰林家第四房林石之四子林棣，在開渠闢田成功後，成為當地最大墾首，其故居前種有兩棵大榕樹（台語「鳥榕」即榕樹之意），因而得名；另一說則因入山口福德祠附近有一棵大榕樹而得名。此外，《彰化縣志》等古文書中，也多以「鳥銃頭」稱呼此地，「鳥銃」是清代常見的火器，因當地鄰近內山、原為土牛界外，居民為防禦原住民威脅而擁槍自保，", "加上林棣之孫林瑞麟平日雙槍不離腰，居民尊稱其「鳥銃頭」，這也是另一種地名由來的說法。至於「太平」這個吉祥地名，一說是清乾隆年間漢人與洪雅族衝突頻繁、傷亡慘重，村莊建立之初便寄託「太平」的願望而命名；另一說則指日治初期日軍推進至此，因當地居民溫和未加抵抗，日軍指揮官讚嘆「此地真是太平」，因而定名。如今太平區因枇杷、龍眼等丘陵農作聞名，是台中市面積第二大的行政區。"], "quiz": {"q": "關於「太平區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "太平舊稱鳥榕頭，因霧峰林家先人故居前有兩棵大榕樹而得名，另有一說源自清代漢人與洪雅族衝突後祈求太平之意。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 2, "rightFb": "沒錯！太平舊稱鳥榕頭，因霧峰林家先人故居前有兩棵大榕樹而得名，另有一說源自清代漢人與洪雅族衝突後祈求太平之意。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [147, 148, 149, 150]}, {"id": "main-台中市-3", "title": "台中市．大里區至豐原區", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識台中市的幾個地方：大里區、霧峰區、烏日區、豐原區。」", "stops": [{"placeId": 151, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『大里區』這個地方，是怎麼來的嗎？大里舊稱大里杙，源自平埔族洪雅族社名譯音，「杙」則指早期船隻停靠時用來繫船固定的木樁。", "大里舊稱「大里杙」，這個地名結合了平埔族社名與河運聚落的雙重意涵：「大里」一詞普遍認為源自洪雅族社名的音譯，反映當地原是平埔族傳統領域；「杙」則是閩南語中指稱木樁的用字，早期大里地處大肚溪支流大里溪（大里杙溪）沿岸，往來船隻停靠時，須以木樁「杙」將船身固定於岸邊，因而在社名之後加上「杙」字，合稱「大里杙」，", "形容這是一處設有繫船木樁的河港聚落。清代大里杙因水運便利，一度是台中盆地重要的物產集散地，霧峰林家的崛起也與大里杙的拓墾開發密切相關。1920年，日本殖民政府推行地方行政改制，將「大里杙」簡化為「大里」，沿用至今。如今大里區因鄰近台中市區、交通便利，是台中市人口成長最快速的行政區之一。"], "quiz": {"q": "關於「大里區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["大里舊稱大里杙，源自平埔族洪雅族社名譯音，「杙」則指早期船隻停靠時用來繫船固定的木樁。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！大里舊稱大里杙，源自平埔族洪雅族社名譯音，「杙」則指早期船隻停靠時用來繫船固定的木樁。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 152, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『霧峰區』這個地方，是怎麼來的嗎？霧峰舊稱阿罩霧，一說因聚落地處鳳山山麓、晨間常有濃霧籠罩而得名，一說源自平埔族社名音譯，因霧峰林家而聞名全台。", "霧峰地名由來流傳著兩種說法：第一種說法認為，這一帶聚落建於鳳山山麓，因地形因素每逢清晨常有濃霧瀰漫籠罩，因而得名「阿罩霧」；第二種說法則指出，「阿罩霧」實際上是當地平埔族貓霧捒社群「阿罩霧社」的社名音譯，台灣地名中凡冠以「阿」字者，多屬原住民社名的音譯，例如阿束、阿冷等地皆是如此，漢人初入墾時原稱此地為「貓羅新莊」，其後才改稱「阿罩霧」。無論何種由來，", "霧峰因清代「霧峰林家」的崛起而聲名遠播：林家先祖林石自福建渡海來台，其後代林文察、林朝棟等人因協助清廷平定戴潮春事件、中法戰爭有功，官位顯赫，成為清代台灣少數官居高位的本土家族，林家花園（今霧峰林家宮保第園區）至今仍是全台規模最大的清代官宅建築群。1920年，「阿罩霧」正式改稱「霧峰」，沿用至今。"], "quiz": {"q": "關於「霧峰區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "霧峰舊稱阿罩霧，一說因聚落地處鳳山山麓、 縣志》則以諧音記載為「新廣莊」，這種依原鄉地名為新墾地命名的方式，在客家移民拓墾史上相當常見；另一種在地流傳的說法則認為，道光年間台灣分類械鬥頻仍之際，", "神岡路上的八仙寺曾因李仙祖神明指示族人聚集於此便能保平安，靈驗的庇護傳說（「神講」）以諧音轉化為「神岡」地名。1920年，日本殖民政府推行地方行政改制，正式將「新廣」改稱「神岡」，沿用至今。神岡境內的岸裡社，清代曾是巴宰族岸裡社群的核心聚落，也是清廷推行「以番制番」政策、借重岸裡社武力平定多次民變的重要據點。"], "quiz": {"q": "關於「神岡區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "神岡舊稱新廣，因最初移民多來自廣東嘉應州「神岡社」而得名，另有一說與道光年間分類械鬥時神明庇護傳說有關。"], "correct": 3, "rightFb": "沒錯！神岡舊稱新廣，因最初移民多來自廣東嘉應州「神岡社」而得名，另有一說與道光年間分類械鬥時神明庇護傳說有關。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [159, 160, 161, 162]}, {"id": "main-台中市-6", "title": "台中市．大肚區至梧棲區", "kind": "main", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識台中市的幾個地方：大肚區、沙鹿區、龍井區、梧棲區。」", "stops": [{"placeId": 163, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『大肚區』這個地方，是怎麼來的嗎？大肚地名源自平埔族拍瀑拉族大肚社，清代這一帶更曾是統轄中部十餘社群的「大肚王國」核心領域。", "大肚地名源自平埔族拍瀑拉族「大肚社」的社名。更令人驚訝的是，早在荷蘭統治時期的文獻記載中，大肚一帶其實是一個跨部落政治實體「大肚王國」的核心領域：這個王國統治期間約自16世紀中葉延續至1732年，轄下涵蓋拍瀑拉、巴則海、道卡斯、洪雅、巴布薩等不同語族共十九至二十個部落，1722年巡臺御史黃叔璥的《臺海使槎錄》甚至記載「大肚山形，遠望如百雉高城，昔有番長名大眉」，", "印證了17世紀台灣中部確實存在一個具有相當規模的原住民政治組織。1731年，因清廷官員濫殺前來協助運糧的大肚社「良番」，引爆大肚社聯合沙轆社、牛罵頭社等十餘社群圍攻彰化縣城的武裝抗爭事件，史稱「大甲西社事件」，事件平定後大肚王國的勢力也隨之瓦解，其後裔多遷往埔里盆地定居。如今大肚區境內的磺溪書院，是台中僅存少數保存完整的清代書院建築之一。"], "quiz": {"q": "關於「大肚區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["大肚地名源自平埔族拍瀑拉族大肚社，清代這一帶更曾是統轄中部十餘社群的「大肚王國」核心領域。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！大肚地名源自平埔族拍瀑拉族大肚社，清代這一帶更曾是統轄中部十餘社群的「大肚王國」核心領域。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 164, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『沙鹿區』這個地方，是怎麼來的嗎？沙鹿舊稱沙轆，源自平埔族拍瀑拉族沙轆社社名，1731年大甲西社事件後遭清廷強迫更名遷善社，1920年改稱沙鹿。", "沙鹿地名源自平埔族拍瀑拉族「沙轆社」（Salach）的社名，該社世居於大肚山西麓的沙鹿平原，是拍瀑拉族四大社群之一。1731年（雍正9年）「大甲西社事件」爆發，沙轆社加入反抗清廷的行列，隔年遭到官兵血腥鎮壓，幾乎慘遭滅族，清廷平定亂事後，為表達「懲戒與教化」之意，強迫將沙轆社改名為「遷善社」，與同時期被改名的大甲西社「德化社」、牛罵社「感恩社」、貓盂社「興隆社」，", "都帶有清廷刻意羞辱、施加政治教化色彩的意味，是清代原住民政策中相當黑暗的一頁。事件過後，沙轆社元氣大傷，土地逐漸被閩粵 , "placeIds": [163, 164, 165, 166]}, {"id": "main-台中市-7", "title": "台中市．清水區至大安區", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識台中市的幾個地方：清水區、大甲區、外埔區、大安區。」", "stops": [{"placeId": 167, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『清水區』這個地方，是怎麼來的嗎？清水舊稱牛罵頭，源自平埔族拍瀑拉族牛罵社社名，1920年因當地「埤仔口泉」水質清澈而改稱清水。", "清水舊稱「牛罵頭」，源自平埔族拍瀑拉族「牛罵社」（Gomach）的社名音譯，是拍瀑拉族四大社群中最北的一支，1731年大甲西社事件後，牛罵社同樣遭清廷強迫改名為「感恩社」，以示教化之意。1920年，日本殖民政府推行地方行政改制，考量牛罵頭街上有一處名為「埤仔口泉」的湧泉，泉水終年清澈甘美，因而以「清水」二字取代原本的「牛罵頭」，", "是台灣少數因當地水質特色而更名、且沿用至今廣為人知的地名案例。清水地區因大甲溪沖積扇與清水隆起海岸平原地形，自古便是重要的農業與航運據點，境內牛罵頭遺址是台灣中部重要的史前文化遺跡，見證此地數千年來的人類活動歷史；清水鰲峰山、高美濕地與清水眷村文化園區，也讓這座因清澈泉水得名的海線市鎮，兼具生態、歷史與文化觀光的多重魅力。"], "quiz": {"q": "關於「清水區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因清代此地盛產某種作物，官府設「清水區」市集而得名", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "清水舊稱牛罵頭，源自平埔族拍瀑拉族牛罵社社名，1920年因當地「埤仔口泉」水質清澈而改稱清水。"], "correct": 3, "rightFb": "沒錯！清水舊稱牛罵頭，源自平埔族拍瀑拉族牛罵社社名，1920年因當地「埤仔口泉」水質清澈而改稱清水。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 168, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『大甲區』這個地方，是怎麼來的嗎？大甲地名源自平埔族道卡斯族聚落，「道卡斯」（Taokas）一詞的學術族名，甚至反過來是因發音近似「大甲」而得名。", "大甲與台灣其他多數「因原住民社名而得漢語地名」的案例不同，兩者的命名關係其實是雙向的：大甲地區清代是道卡斯族的主要活動範圍，涵蓋大甲東社、大甲西社、日南社、雙寮社等聚落，漢人依當地原住民自稱的音譯，將此地稱為「大甲」；然而，1904年日本學者伊能嘉矩為這群分布於新竹、苗栗、台中沿海一帶的平埔族群，以語言學方法歸類命名時，卻是因「道卡斯」（Taokas）一詞的閩南語發音類似「大甲」，", "才反過來將這個族群正式命名為「道卡斯族」，這種地名與族名相互影響、甚至倒果為因的命名過程，是台灣地名史上相當特殊的案例。1731年「大甲西社事件」（林武力抗清事件）爆發，是清代台灣中部平埔族群規模最大的武裝反抗行動之一，事件平定後，大甲西社遭清廷改名為「德化社」。大甲如今以媽祖遶境進香、奶油酥餅與藺草編織聞名全台，是台灣海線最具代表性的信仰與物產重鎮。"], "quiz": {"q": "關於「大甲區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "大甲地名源自平埔族道卡斯族聚落，「道卡斯」（Taokas）一詞的學術族名，甚至反過來是因發音近似「大甲」而得名。"], "correct": 3, "rightFb": "沒錯！大甲地名源自平埔族道卡斯族聚落，「道卡斯」（Taokas）一詞的學術族名，甚至反過來是因發音近似「大甲」而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 169, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『外埔區』這個地方，是怎麼來的嗎？外埔因位處內埔（今后里）外側的埔地而得名，是道卡斯族大甲東社的傳統領域。", "外埔地名由來相對單純，源自其與鄰近聚落的相對地理位置：清代漢人拓墾勢力由海岸線一帶（近海處，俗稱「外」）向東側內陸擴展時，將位於「內埔」（今后里區，因地處聚落內側而得名）之外的這片埔地，稱為「外埔」，以區別兩處拓墾範圍的先後與相對位置，這種依內外方位對應命名的方式，與台北「內湖」對應「外湖」等地名，屬於相似的邏輯。外埔原是平埔族道卡斯族「大甲東社」的傳統領域，", "蓬山八社中的大甲東、大甲西兩社，便是以境內的鐵砧山為界劃分，鐵砧山以東屬大甲東社，因該社在1731年大甲西社事件中選擇配合清廷而未遭波及，得以保留原有社名，未如大甲西社般被強迫改稱。外埔區因地勢平坦、水源充足，是台中市重要的水稻與葡萄產區，境內鐵砧山風景區因鄭成功「劍井」傳說而聞名，是台中海線地區重要的歷史與農業觀光景點。"], "quiz": {"q": "關於「外埔區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "外埔因位處內埔（今后里）外側的埔地而得名，是道卡斯族大甲東社的傳統領域。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！外埔因位處內埔（今后里）外側的埔地而得名，是道卡斯族大甲東社的傳統領域。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 170, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『大安區』這個地方，是怎麼來的嗎？大安在明末稱海翁窟港，因港灣時有鯨魚（海翁）出沒而得名，另有一稱勞施港，形容航道迂迴如螺殼紋路。", "大安舊稱由來相當富有畫面感：明末文獻記載，這處港灣因時常有鯨魚（閩南語稱鯨魚為「海翁」）洄游出沒，因而得名「海翁窟港」；另有一稱「勞施港」（又寫作螺絲港），形容船隻進出這處港灣時，航道必須迂迴繞轉兩處沙嘴，路徑彎曲有如螺殼上的螺旋紋路，1764年（乾隆29年）《續修臺灣府志》中即已記載「勞施港」之名。這片海岸沙洲地帶因地勢低平、緊鄰海岸，先民依方位稱之為「海墘」（意指海邊），", "也是大安地名演變過程中曾出現的另一種稱呼。大安因大安溪出海口的優良港灣條件，清代曾是中部重要的貿易港口之一，1841年鴉片戰爭期間，英國商船「阿吶號」在此觸礁擱淺，遭岸上民勇圍攻俘虜，史稱「大安之役」，是清代台灣少見與西方列強直接軍事衝突的歷史事件之一。如今大安以濱海樂園、西瓜產業與大安漁港聞名，是台中海線最北端的行政區。"], "quiz": {"q": "關於「大安區」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "大安在明末稱海翁窟港，因港灣時有鯨魚（海翁）出沒而得名，另有一稱勞施港，形容航道迂迴如螺殼紋路。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！大安在明末稱海翁窟港，因港灣時有鯨魚（海翁）出沒而得名，另有一稱勞施港，形容航道迂迴如螺殼紋路。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [167, 168, 169, 170]}], "sideQuests": [{"id": "side-台中市-1", "title": "台中市．梨山至高美", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識台中市的幾個地方：梨山、谷關、逢甲、高美。」", "stops": [{"placeId": 171, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『梨山』這個地方，是怎麼來的嗎？梨山舊稱斯拉茂（Slamaw），是泰雅族先祖翻越雪山山脈北遷擴散的重要據點，因日治後引進溫帶水果種植而改稱梨山。", "梨山地名源自泰雅族語「Slamaw」（日治時期日文寫作「サラマオ」，音譯為斯拉茂、薩拉矛或沙拉茅），是大甲溪上游流域重要的泰雅族傳統聚落。根據泰雅族口傳歷史，族人祖先自更南方的原居地沿北港溪上游向北翻越分水嶺遷徙擴散，在大甲溪谷尾端與蘭陽溪分水嶺的思源埡口一帶，Pinsbkan家族衍生出向北、向東、向東北遷徙的三大支系，斯拉茂正是這波遷徙擴散過程中位於大甲溪上游流域的重要據點之一，", "與松茂、佳陽、環山（志佳陽）等地並稱「斯拉茂群」（或薩拉茅群）。1956年中橫公路動工興建後，這處高山地區因氣候冷涼、日夜溫差大，特別適合溫帶水果生長，政府引進蘋果、水梨等果樹試種成功後，便將這片山區改稱「梨山」，取代了原本的泰雅族地名，如今梨山已是台灣最知名的高山水果與茶葉產區之一，也是中橫公路最重要的中繼站。"], "quiz": {"q": "關於「梨山」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "梨山舊稱斯拉茂（Slamaw），是泰雅族先祖翻越雪山山脈北遷擴散的重要據點，因日治後引進溫帶水果種植而改稱梨山。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！梨山舊稱斯拉茂（Slamaw），是泰雅族先祖翻越雪山山脈北遷擴散的重要據點，因日治後引進溫帶水果種植而改稱梨山。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 172, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『谷關』這個地方，是怎麼來的嗎？谷關因1960年中部橫貫公路通車，行經此地的溪谷有如一道天然關卡而得名，日治時期曾稱明治溫泉。", "谷關舊稱「明治溫泉」，因1907年當地泰雅族人發現溫泉露頭，直到1927年才由台中州政府撥款、配合民眾捐獻興建公共浴場正式開發，並依日本明治天皇年號命名，且依海拔高低分為上明治（今上谷關）、下明治（今下谷關）。1956年，政府為貫通台灣東西兩岸，選定大甲溪河谷路線動工興建中部橫貫公路，谷關正位於這條路線的重要節點；由於中橫公路行經此地的谷口地形險要，", "山岩崢嶸矗立，兩側高山夾峙，形如一道天然關卡，因而在1960年5月中橫公路通車典禮時，正式將此地命名為「谷關」，取代了日治時期的「明治」舊稱。谷關溫泉屬弱鹼性碳酸泉，泉質清澈無硫磺味，相傳日本明治天皇曾泡湯後得子，因而衍生出「生男湯」的民間傳說。如今谷關因溫泉觀光與谷關、捎來等歷史吊橋景觀，是中部橫貫公路沿線最重要的溫泉度假勝地。"], "quiz": {"q": "關於「谷關」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因清代此地盛產某種作物，官府設「谷關」市集而得名", "谷關因1960年中部橫貫公路通車，行經此地的溪谷有如一道天然關卡而得名，日治時期曾稱明治溫泉。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！谷關因1960年中部橫貫公路通車，行經此地的溪谷有如一道天然關卡而得名，日治時期曾稱明治溫泉。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 173, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『逢甲』這個地方，是怎麼來的嗎？逢甲因鄰近私立逢甲大學而得名，該校為紀念清末抗日保台的愛國詩人丘逢甲而命名，逢甲商圈已是全台知名夜市。", "逢甲地區的地名由來，與一位清末抗日愛國詩人密切相關：丘逢甲是清光緒年間的進士，1895年馬關條約割讓台灣後，他曾號召台灣仕紳成立「台灣民主國」，力主抗日保台，雖然行動最終失敗，仍留下「宰相有權能割地，孤臣無力可回天」等膾炙人口的詩句，被後世視為台灣近代史上重要的愛國象徵人物。1961年，一群有志之士在西屯區籌辦私立學校時，為紀念丘逢甲的愛國精神，", "將學校命名為「逢甲工商學院」（今逢甲大學），校址周邊的地區也因此逐漸以「逢甲」作為通稱，取代了原本的行政區劃地名。隨著逢甲大學師生人數增加，加上鄰近文華夜市（今逢甲夜市）的興起，逢甲商圈迅速發展成全台規模數一數二、以小吃聞名的觀光夜市，每年吸引大量國內外遊客造訪，讓「逢甲」從單純紀念歷史人物的校名，演變成台中市最具代表性的商業與觀光地標之一。"], "quiz": {"q": "關於「逢甲」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的  176, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『追分』這個地方，是怎麼來的嗎？追分因日治時期海線、山線鐵路在此交會分岔而得名，「追分」為日語詞彙，意指道路的分歧點。", "追分地名直接借用自日語詞彙：「追分」（おいわけ，Oiwake）在日語中原意指道路或鐵道的分歧點，日本本土本就有多處同名地名。1920年，台灣總督府鐵道部完成縱貫線海線鐵路的興建，這條新闢的海線鐵路與原本的山線鐵路，恰好在今日烏日、大肚交界處會合分岔，鐵道部便依日語「分歧點」的詞彙，將這處新設車站命名為「追分驛」，戰後沿用為「追分車站」，並成為周邊地區的通稱地名。追分車站至今仍保留日治時期興建的木造站房，", "是台灣少數保存完整的日治小型車站建築之一；因「追分」與「永保安康」（大甲車站舊稱「日南」的諧音）等鐵路車站名稱，被鐵道迷賦予「追分（永不）分手、永保安康」的祝福意涵，追分車站的車票因而成為情侶間熱門的紀念小物，讓這個原本單純描述鐵道地形的日語地名，意外演變成充滿浪漫寓意的觀光話題。"], "quiz": {"q": "關於「追分」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "追分因日治時期海線、山線鐵路在此交會分岔而得名，「追分」為日語詞彙，意指道路的分歧點。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！追分因日治時期海線、山線鐵路在此交會分岔而得名，「追分」為日語詞彙，意指道路的分歧點。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 177, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『日南』這個地方，是怎麼來的嗎？日南因源自平埔族道卡斯族蓬山八社之一的「日南社」而得名，境內日南車站因與「永保安康」車票組合聞名。", "日南地名源自平埔族道卡斯族「日南社」的社名，是清代「蓬山八社」（原稱崩山八社）之一，與大甲東社、大甲西社、雙寮社等同屬蓬山地區平埔族部落聯盟成員，主要分布於今日大甲、大安一帶。日治時期，縱貫鐵路海線通車後，在日南社傳統領域範圍內設立「日南驛」，戰後沿用為日南車站。日南車站因與另一座知名車站「追分」搭配，", "衍生出「日南（永保）安康、追分（永不）分手」的祝福諧音組合，兩地車票因而成為台灣鐵道迷與情侶間熱門的紀念小物，帶動一波車站觀光風潮，讓這個源自平埔族社名的百年小站，意外因鐵道文化而重新受到矚目。日南車站至今仍保留日治時期興建的木造站房建築，是海線鐵路沿線珍貴的歷史車站之一。"], "quiz": {"q": "關於「日南」（台中市）這個地名，下列何者才是真正的由來？", "opts": ["日南因源自平埔族道卡斯族蓬山八社之一的「日南社」而得名，境內日南車站因與「永保安康」車票組合聞名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！日南因源自平埔族道卡斯族蓬山八社之一的「日南社」而得名，境內日南車站因與「永保安康」車票組合聞名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 178, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『泰安』這個地方，是怎麼來的嗎？台中泰安舊站原稱大安，因位於大安溪畔而得名，1954年為與苗栗泰安鄉同名而不便，改稱「泰安」，如今舊站已轉型為鐵道文化園區。", "台中后里的泰安車站，其地名演變與苗栗縣泰安鄉頗有淵源：這座位於山線鐵路上的車站，因鄰近大安溪畔，最初命名為「大安驛」，然而由於台中州（今台中縣市）與新竹州（今苗栗縣）境內，皆有以「大安」為名的行政區或車站，容易造成混淆，1954年遂比照苗栗大安鄉改名為泰安鄉的邏輯，將車站正式改稱「泰安車站」，取「國泰民安」的吉祥寓意，同時也巧妙保留了「大安」的諧音。1998年，", "隨著山線鐵路截彎取直、新泰安車站啟用，這座興建於1908年、擁有超過百年歷史的舊泰安車站因而功成身退，卻幸運地未遭拆除，反而因保存完整的檜木站房建築與周邊鐵道遺跡，被指定為台中市歷史建築，  "🍃", "sceneEmoji": "🍃", "pages": ["你知道『彰化市』這個地方，是怎麼來的嗎？彰化市舊稱半線，源自平埔族巴布薩族「半線社」譯音，清雍正元年設縣時取「彰顯皇化」之意改稱彰化。", "彰化市舊稱「半線」，源自平埔族巴布薩族「半線社」的社名音譯，該社原居於今彰化市光南里一帶，是清代彰化平原十個平埔族社之一。雍正元年（1723年），清廷鑑於半線一帶開發日盛、人口漸增，遂在此地另設新縣，福建巡撫王紹蘭於〈彰化縣碑記〉中寫下「實獲眾心、保域保民、彰聖天子、丕昌海隅之化歟」，取其中「彰」「化」二字，寓意「彰顯皇化」，正式定名為彰化縣，", "縣治便設於半線。值得一提的是，彰化在地文史工作者曾考證指出，清代文獻中「半線社」與「半線莊」「半線街」實為不同層級的聚落單位，不應混為一談，甚至主張彰化市真正的舊稱應是「磺溪」（因大肚溪支流磺溪流經而得名），而非籠統地稱為半線，顯示地方史考據仍存在不同觀點。彰化市因八卦山大佛而聞名全台，是中台灣重要的信仰與交通樞紐。"], "quiz": {"q": "關於「彰化市」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "彰化市舊稱半線，源自平埔族巴布薩族「半線社」譯音，清雍正元年設縣時取「彰顯皇化」之意改稱彰化。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！彰化市舊稱半線，源自平埔族巴布薩族「半線社」譯音，清雍正元年設縣時取「彰顯皇化」之意改稱彰化。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 181, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『和美鎮』這個地方，是怎麼來的嗎？和美原稱卡里善，源自巴布薩族語「冷熱交界地」，因漳泉械鬥頻繁，民國9年取「和睦美鄰」之意改稱和美。", "和美舊稱「卡里善」（也寫作朥狸散），源自平埔族巴布薩族語，意指「冷與熱的交界地」，反映當地氣候溫和宜人的特徵，此後因發音相近，又演變出「和美線」「和美散」等不同寫法。和美地處泉州移民與漳州移民拓墾範圍的接觸地帶，以境內詔安橋為界，橋西是泉州移民墾地，橋東則是來自彰化的漳州移民墾地，兩籍移民雜處而居，清代分類械鬥頻仍、衝突不斷。民國9年（1920年），", "日本殖民政府推行地方行政改制，鑑於此地長期作為漳泉械鬥的衝突地帶，特別取「和睦美鄰」之意，將「和美線」正式改稱「和美」，期望藉由地名寄託化解族群衝突、促進和睦相處的願景，是台灣地名中少數直接以「族群和解」為命名初衷的案例。和美如今是彰化縣重要的紡織與針織工業重鎮，享有「和美織仔」的美稱。"], "quiz": {"q": "關於「和美鎮」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "和美原稱卡里善，源自巴布薩族語「冷熱交界地」，因漳泉械鬥頻繁，民國9年取「和睦美鄰」之意改稱和美。", "因清代此地盛產某種作物，官府設「和美鎮」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！和美原稱卡里善，源自巴布薩族語「冷熱交界地」，因漳泉械鬥頻繁，民國9年取「和睦美鄰」之意改稱和美。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 182, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『線西鄉』這個地方，是怎麼來的嗎？線西舊稱下見口，因聚落位於四股圳入海口，可望見河口而得名，1920年因隸屬線西堡而改稱線西。", "線西鄉舊稱「下見口」，也寫作「下徑口」，這個地名描述了當地的地理位置特徵：聚落坐落在四股圳注入台灣海峽的出海口附近，站在此處可以望見河海交會的水口，因而得名「見口」，加上「下」字表示地勢較低或位置偏下游之意。1920年，日本殖民政府推行地方行政改制，因這一帶清代隸屬「線西堡」的行政區劃範圍，遂直接沿用堡名，將「下見口」改稱為「線西」，", "這種以清代堡里舊名取代原本聚落俗稱的命名方式，在台灣地名演變中相當常見。線西鄉地處彰化縣濱海地帶，因地勢平坦、鄰近福馬圳等水利設施，加上近年推廣的哈密瓜與蔬果種植，是彰化縣重要的沿海農業鄉鎮之一，境內的臭青龜仔（哈利波特風車）觀光工廠等特色景點，也讓這個描述河口地形的舊地名，逐漸發展出濱海觀光的新面貌。"], "quiz": {"q": "關於「線西鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「線西鄉」市集而得名", "線西舊稱下見口，因聚落位於四股圳入海口，可望見河口而得名，1920年因隸屬線西堡而改稱線西。"], "correct": 3, "rightFb": "沒錯！線西舊稱下見口，因聚落位於四股圳入海口，可望見河口而得名，1920年因隸屬線西堡而改稱線西。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 183, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『伸港鄉』這個地方，是怎麼來的嗎？伸港原稱新港，因是新闢的港口而得名，1959年因與嘉義縣新港鄉同名而改稱伸港。", "伸港鄉地名由來相對單純，清代這一帶因新開闢一處港口，便直接以「新港」為名，意指新設立的港埠。然而，台灣行政區劃中另有嘉義縣「新港鄉」同樣以「新港」為名，兩地容易在行政公文、郵政系統上造成混淆，民國48年（1959年）7月1日，彰化的新港鄉正式更名為「伸港鄉」，以「伸」字近音替代「新」字，同時避開重名問題，這與苗栗西湖鄉（原四湖鄉，", "因與雲林四湖鄉同名而改名）、台中后里（原內埔鄉，因與屏東內埔鄉同名而改名）屬於同一類因行政區重名而更改地名的特殊案例。伸港鄉地處彰化縣最北端濱海地帶，鄰近台中大肚溪出海口，境內慶安水道自然生態中心（俗稱白色海豚屋）與伸港濕地是熱門的生態旅遊景點，也讓這個因新闢港口得名、又因撞名而改名的鄉鎮，發展出獨具特色的濕地生態觀光資源。"], "quiz": {"q": "關於「伸港鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["伸港原稱新港，因是新闢的港口而得名，1959年因與嘉義縣新港鄉同名而改稱伸港。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！伸港原稱新港，因是新闢的港口而得名，1959年因與嘉義縣新港鄉同名而改稱伸港。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [179, 181, 182, 183]}, {"id": "main-彰化縣-2", "title": "彰化縣．福興鄉至芬園鄉", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識彰化縣的幾個地方：福興鄉、秀水鄉、花壇鄉、芬園鄉。」", "stops": [{"placeId": 184, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『福興鄉』這個地方，是怎麼來的嗎？福興因福建移民期許在此振興事業、建莊興隆而得名。", "福興鄉地名由來直接寄託了先民的拓墾期許：清代福建移民渡海來到這片土地開墾定居時，希望能在異鄉振興家業、發展興隆，因而以「福興」為莊名，「福」代表原鄉福建，也有福氣之意，「興」則寄託事業興旺的願景，是台灣地名中相當常見的一種吉祥式命名方式。福興鄉地處鹿港鎮南側，清代因鄰近鹿港港口，同樣受惠於鹿港作為清中葉台灣第二大港的貿易繁榮，", "加上濁水溪沖積形成的肥沃平原，農業發展條件優異。福興鄉境內的番社村，地名則源自當地平埔族馬芝遴社的傳統領域，顯示這一帶在漢人大規模拓墾之前，同樣是平埔族巴布薩族的生活範圍。如今福興鄉因地勢平坦、水源充足，是彰化縣重要的稻米與甘藷產地之一。"], "quiz": {"q": "關於「福興鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "福興因福建移民期許在此振興事業、建莊興隆而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！福興因福建移民期許在此振興事業、建莊興隆而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 185, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『秀水鄉』這個地方，是怎麼來的嗎？秀水原稱臭水，因地處灌溉水路末端、排水不佳而積水發臭，後取諧音雅字改稱秀水。", "秀水鄉地名由來反映了先民對地形排水問題的直白描述：清代這一帶正好位於整片灌溉水系的末端，來自上游各處的餘水匯聚於此，由於地勢低平、排水不易，長期積水導致水質混濁發臭，因而被稱為「臭水」，這種依水質狀況直接命名的方式雖不甚雅觀，卻真實反映了早期農業聚落面臨的排水困境。隨著行政區劃調整與地名雅化的趨勢，「臭水」後來改以發音相近、字義優美的「秀水」取代，", "徹底扭轉了原本不甚討喜的地名印象。秀水鄉地處彰化平原核心地帶，因濁水溪沖積帶來的肥沃土壤，加上灌溉水利設施逐漸完善，早已從昔日排水不良的積水之地，轉型為彰化縣重要的花卉與蔬果專業區，境內的彰化花卉generation生產專區更是全台知名的花卉批發集散地之一。"], "quiz": {"q": "關於「秀水鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "秀水原稱臭水，因地處灌溉水路末端、排水不佳而積水發臭，後取諧音雅字改稱秀水。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！秀水原稱臭水，因地處灌溉水路末端、排水不佳而積水發臭，後取諧音雅字改稱秀水。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 186, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『花壇鄉』這個地方，是怎麼來的嗎？花壇原稱茄苳腳，因早期此地茄苳樹茂生成林，經移民砍伐開墾成耕地建莊而得名。", "花壇鄉舊稱「茄苳腳」，這個地名直接反映了當地早期的自然植被景觀：清代移民初入墾此地時，發現一帶茄苳樹生長茂密、成林遍布，先民便著手砍伐林木、開墾為可耕作的農地，並在這片曾經林木茂盛之處建立聚落，因而以「茄苳腳」為莊名，意指茄苳樹林下方或周邊的聚落。1920年，日本殖民政府推行地方行政改制，將「茄苳腳」改以較為典雅的「花壇」取代，", "沿用至今。花壇鄉地處八卦山台地西側山麓，因地勢略高、排水良好，加上氣候條件適宜，是台灣重要的花卉與盆景苗木專業產區，尤其以杜鵑花、七里香等園藝植物聞名，花壇之名雖非源自花卉產業，卻恰好與今日的花卉重鎮形象不謀而合，成為地名巧合呼應在地特色的有趣案例。"], "quiz": {"q": "關於「花壇鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["花壇原稱茄苳腳，因早期此地茄苳樹茂生成林，經移民砍伐開墾成耕地建莊而得名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 0, "rightFb": "沒錯！花壇原稱茄苳腳，因早期此地茄苳樹茂生成林，經移民砍伐開墾成耕地建莊而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 187, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『芬園鄉』這個地方，是怎麼來的嗎？芬園原稱芬園新莊，相傳因清代在此廣植菸草（芬）而得名。", "芬園鄉舊稱「芬園新莊」，關於「芬園」二字的由來，民間相傳與清代在此廣泛種植菸草有關：早期移民入墾這片新開闢的莊園時，大量栽植菸草作為經濟作物，「芬」字或許取自菸草特有的氣味或菸園之意，「園」則指旱地作物栽培的田園，兩字合稱反映了當地曾以菸草種植為主要產業的拓墾歷史。芬園鄉地處彰化縣東側、八卦山台地北端，", "與南投縣草屯鎮相鄰，是彰化縣唯一不靠海、地勢最高的山地型鄉鎮。境內舊社村之名，則源自平埔族洪雅族「貓羅社」的傳統領域，顯示這一帶在漢人拓墾之前，同樣是平埔族群的生活範圍。如今芬園鄉因八卦山台地地形，發展出荔枝、龍眼、鳳梨等丘陵果樹產業，是彰化縣重要的水果產地之一。"], "quiz": {"q": "關於「芬園鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "芬園原稱芬園新莊，相傳因清代在此廣植菸草（芬）而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！芬園原稱芬園新莊，相傳因清代在此廣植菸草（芬）而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [184, 185, 186, 187]}, {"id": "main-彰化縣-3", "title": "彰化縣．員林市至大村鄉", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識彰化縣的幾個地方：員林市、溪湖鎮、田中鎮、大村鄉。」", "stops": [{"placeId": 188, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『員林市』這個地方，是怎麼來的嗎？員林原稱員林仔，因清代先民開墾森林、刻意留下一塊圓形林地建莊而得名。", "員林地名由來源自清代拓墾時的一種特殊留林習慣：康熙末年之後，大批移民湧入這片區域開墾，隨著雍正初年村莊逐漸成形、發展成市街，墾民在大規模砍伐林木闢地的過程中，特意保留了一塊圓形的林地未予砍伐，並在其周邊建立聚落，因而得名「員林仔」（「員」通「圓」），後來才簡化刪去「仔」字，成為今日的「員林」。這種刻意保留圓形林地的做法，", "可能兼具風水考量與生態調節的實用目的。員林憑藉地處彰化平原交通要衝的優勢，加上鐵路縱貫線設站帶動，逐漸發展成彰化縣南部最重要的商業與工業重鎮，人口規模長期位居彰化縣各鄉鎮市之冠，2015年正式由鎮改制為縣轄市，員林蜜餞、芭樂等農產加工業也讓這座因保留圓林而得名的城市聲名遠播。"], "quiz": {"q": "關於「員林市」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「員林市」市集而得名", "員林原稱員林仔，因清代先民開墾森林、刻意留下一塊圓形林地建莊而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！員林原稱員林仔，因清代先民開墾森林、刻意留下一塊圓形林地建莊而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 189, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『溪湖鎮』這個地方，是怎麼來的嗎？溪湖舊稱湖厝，因舊濁水溪與麥嶼厝溪環流交會、周圍多沙丘窪地（湖）而得名。", "溪湖鎮舊稱「湖厝」，地名由來源自其獨特的水文地形：溪湖鎮地處彰化縣中央位置，舊濁水溪與麥嶼厝溪兩條溪流由此斜貫而過，支流環繞流經聚落周邊，加上周圍分布著許多沙丘群與低窪盆地地形，閩南語慣以「湖」稱呼這種盆狀窪地，先民便取溪流環繞之「溪」與盆地窪地之「湖」，合併命名為「溪湖」，「湖厝」則是更早期以「厝」（房舍聚落）為後綴的稱呼方式。溪湖鎮因地勢平坦、水源充沛，", "清代以來便是彰化平原重要的農業聚落，日治時期因製糖會社在此設立溪湖糖廠，一度是台灣中部重要的製糖重鎮，如今糖廠雖已停止製糖，但保留的五分車鐵道與園區，已轉型為觀光鐵道與地方文化資產，讓溪湖從單純的水文地名，發展出獨特的糖業觀光魅力。"], "quiz": {"q": "關於「溪湖鎮」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["溪湖舊稱湖厝，因舊濁水溪與麥嶼厝溪環流交會、周圍多沙丘窪地（湖）而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！溪湖舊稱湖厝，因舊濁水溪與麥嶼厝溪環流交會、周圍多沙丘窪地（湖）而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 190, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『田中鎮』這個地方，是怎麼來的嗎？田中鎮名源自清代田中央莊，因聚落建於一片水田中央而得名，後因濁水溪氾濫沖毀田地，才轉型為市街。", "田中鎮地名由來相對直白，源自清代「田中央莊」之名：這處聚落最初建立於一片廣闊水田的中央位置，四周環繞著農田，因而得名。然而，隨著濁水溪多次氾濫改道，這片水田大半遭洪水沖毀流失，原本以農業為主的聚落被迫轉型，先民另擇地勢較高、較不易淹水之處重新發展，逐漸從單純的水田聚落蛻變為商業市街，", "「田中」之名卻仍保留下來，成為這段從農田到市街轉型歷程的歷史見證。田中鎮因位處清代八堡圳與十五庄圳（今八堡二圳）分水口附近，加上縱貫鐵路設站帶動，逐漸發展成彰化縣南端重要的交通與商業樞紐，鄰近的濁水溪畔沖積平原，至今仍是優質白柚與蔬果的重要產地。"], "quiz": {"q": "關於「田中鎮」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "田中鎮名源自清代田中央莊，因聚落建於一片水田中央而得名，後因濁水溪氾濫沖毀田地，才轉型為市街。", "因清代此地盛產某種作物，官府設「田中鎮」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！田中鎮名源自清代田中央莊，因聚落建於一片水田中央而得名，後因濁水溪氾濫沖毀田地，才轉型為市街。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 191, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『大村鄉』這個地方，是怎麼來的嗎？大村原稱燕霧大莊，因位於燕霧山（八卦台地）下、規模較大的集村聚落而得名。", "大村鄉舊稱「燕霧大莊」，這個地名結合了地形與聚落規模兩種概念：「燕霧」指的是境內鄰近的燕霧山，也就是今日所稱的八卦台地，因山勢地形而得名；「大莊」則說明這是燕霧山下規模較大的一處集村聚落，與周邊其他較小型的莊社有所區別，兩者合稱「燕霧大莊」，後簡化為「大村」，沿用至今。大村鄉地處彰化平原與八卦台地交界地帶，", "因土壤肥沃、日照充足，加上地勢略高、排水良好，成為台灣重要的葡萄產區，尤其以巨峰葡萄聞名全台，享有「巨峰葡萄之鄉」的美譽，每年葡萄產季更吸引大量遊客前來採果，讓這個源自山勢與聚落規模命名的鄉鎮，因葡萄產業而聲名遠播。"], "quiz": {"q": "關於「大村鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "大村原稱燕霧大莊，因位於燕霧山（八卦台地）下、規模較大的集村聚落而得名。"], "correct": 3, "rightFb": "沒錯！大村原稱燕霧大莊，因位於燕霧山（八卦台地）下、規模較大的集村聚落而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [188, 189, 190, 191]}, {"id": "main-彰化縣-4", "title": "彰化縣．埔鹽鄉至社頭鄉", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識彰化縣的幾個地方：埔鹽鄉、埔心鄉、永靖鄉、社頭鄉。」", "stops": [{"placeId": 192, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『埔鹽鄉』這個地方，是怎麼來的嗎？埔鹽因早期是蒲鹽菁（一種植物）茂生的荒埔，或因土地鹽分偏高的荒埔地而得名。", "埔鹽鄉地名由來主要有兩種說法：第一種說法認為，這一帶移民建村之初，是一片盛產「蒲鹽菁」的荒埔地，蒲鹽菁是一種可能與染料或藥用植物相關的作物，先民依此特徵稱之為「埔鹽」；第二種說法則從土壤特性出發，指出這片濱海荒埔地因地下水位偏鹹、土質鹽分含量偏高，不利一般作物生長，因而直接以「鹽」字描述其土壤特徵，", "加上「埔」字表示尚未大規模開墾的荒地，合稱「埔鹽」。無論何種說法為真，都反映了這一帶土地在拓墾初期面臨的自然條件挑戰。埔鹽鄉地處彰化平原西側，鄰近鹿港與福興，清代同樣受惠於鹿港貿易的繁榮腹地效應，如今則以稻米、蔬果等農業生產為 禦工事的小城，因而得名「大城厝」，", "後簡化為「大城」。大城鄉地處彰化縣最南端，緊鄰濁水溪出海口，因地勢低平、土壤含鹽分較高，農業生產條件相對嚴苛，居民多從事西瓜、花生等耐旱耐鹽作物種植，加上沿海的漁業與蚵仔養殖，是彰化縣濱海地帶重要的農漁業鄉鎮，境內的台灣西瓜促銷活動也讓大城西瓜享有一定知名度。"], "quiz": {"q": "關於「大城鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "大城原稱大城厝，因清道光初年移民聚落遭械鬥威脅，築土成壘防禦盜匪而形成規模較大的集村，故得名。"], "correct": 3, "rightFb": "沒錯！大城原稱大城厝，因清道光初年移民聚落遭械鬥威脅，築土成壘防禦盜匪而形成規模較大的集村，故得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 203, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『竹塘鄉』這個地方，是怎麼來的嗎？竹塘因清初墾民儲水為塘以利灌溉，且周邊水塘一帶蘆竹叢生茂密而得名。", "竹塘鄉地名由來結合了水利設施與植被特徵兩種元素：清初移民入墾這片區域時，因灌溉水源不易取得，便挖掘池塘蓄積雨水與地下水，以供農業灌溉之用；而這些人工開鑿的水塘周邊，恰好生長著大片茂密的蘆竹，先民依此特徵，將這片以蓄水池塘與蘆竹叢生為特色的區域，", "命名為「竹塘」。竹塘鄉地處彰化平原西南側，鄰近濁水溪沖積扇末端，因灌溉水利系統的持續改善，早已從清初依賴蓄水塘灌溉的拓墾聚落，發展成彰化縣重要的稻米與蔬果產區，境內的醒靈宮等百年廟宇，也見證了這段先民開鑿水塘、克服水源不足困境的拓墾歷史。"], "quiz": {"q": "關於「竹塘鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["竹塘因清初墾民儲水為塘以利灌溉，且周邊水塘一帶蘆竹叢生茂密而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！竹塘因清初墾民儲水為塘以利灌溉，且周邊水塘一帶蘆竹叢生茂密而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 204, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『溪州鄉』這個地方，是怎麼來的嗎？溪州因地處東螺溪與西螺溪之間的氾濫沖積平原（洲）而得名。", "溪州鄉地名由來源自其獨特的河川地形：這片區域坐落於東螺溪與西螺溪兩條溪流之間，是濁水溪多次氾濫改道所沖積形成的浮覆地帶，閩南語慣以「洲」稱呼這種由河流泥沙堆積而成的沙洲地形，加上位處兩溪之間，因而得名「溪州」。溪州鄉境內另有一處聚落「舊眉」，地名源自平埔族巴布薩族「眉里社」的傳統領域，", "是了解這一帶平埔族分布歷史的重要線索。溪州因地處濁水溪沖積扇末端，土壤肥沃、水源充沛，是台灣重要的水稻與蔬果產區，享有「濁水米故鄉」的美譽，境內的台灣糖業公司溪州糖廠與周邊的森林公園，也讓這個因河川沙洲地形得名的鄉鎮，兼具農業生產與生態休閒的多重面貌。"], "quiz": {"q": "關於「溪州鄉」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["溪州因地處東螺溪與西螺溪之間的氾濫沖積平原（洲）而得名。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！溪州因地處東螺溪與西螺溪之間的氾濫沖積平原（洲）而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [201, 202, 203, 204]}, {"id": "side-彰化縣-3", "title": "彰化縣．八卦山至枋橋頭", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識彰化縣的幾個地方：八卦山、永靖、東螺、枋橋頭。」", "stops": [{"placeId": 205, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『八卦山』這個地方，是怎麼來的嗎？八卦山最早稱望寮山，因可登高瞭望彰化縣城而得名，清嘉慶年間知縣胡應魁因山形如八卦而改名。", "八卦山最早見於1717年《諸羅縣志》，當時稱為「寮望山」或「望寮山」，因地處彰化縣城制高點，可綜觀全城動靜，清代即在山頂設置瞭望台戒備。雍正9年（1731年）大甲西社事件平定後，台灣道倪象愷在山上建立「鎮番亭」；道光年間又依地方士紳建議，興築「定軍山寨」戍守縣城，一度改稱「定軍山」，有「定寨望洋」的美稱。嘉慶3年（1798年），知縣胡應魁鑒於山勢輪廓神似《易經》中的八卦圖形，遂將此山正式更名為「八卦山」，", "並建太極亭，取「太極生兩儀，兩儀生四象，四象生八卦」之義；民間另有一說，認為此名與清代秘密會黨「天地會」分支「八卦會」曾在此地聚集活動有關。光緒21年（1895年）乙未戰爭中，八卦山之役是這場戰事規模最大、傷亡最慘烈的一戰，客家義軍領袖吳湯興、黑旗軍統領吳彭年皆壯烈犧牲。1961年，山頂建成當時亞洲最大的釋迦牟尼佛像，成為今日彰化最具代表性的地標。"], "quiz": {"q": "關於「八卦山」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "八卦山最早稱望寮山，因可登高瞭望彰化縣城而得名，清嘉慶年間知縣胡應魁因山形如八卦而改名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！八卦山最早稱望寮山，因可登高瞭望彰化縣城而得名，清嘉慶年間知縣胡應魁因山形如八卦而改名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 478, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『永靖』這個地方，是怎麼來的嗎？廣東移民，寓意永久安靖。", "永靖境內清代原有東門、西門、南門、北門四座隘門，是粵籍移民為防禦閩粵械鬥與盜匪侵擾而興建的防禦性聚落設施，其中最初的市街核心稱為「關帝廳」，因當地建有主祀關聖帝君的廟宇而得名，這也是永靖鄉境內至今仍可見的舊地名之一。永靖與員林、社頭等地同屬清代粵籍移民與閩籍移民犬牙交錯的拓墾地帶，族群關係曾一度相當緊張，", "永靖的命名正是官方試圖以行政手段化解衝突的具體例證。如今永靖鄉境內的餘三館，是台灣少數保存完整的清末閩南式合院建築，也見證了這段閩粵移民共同開發永靖的歷史，加上當地盛產的胡蘿蔔（俗稱永靖菜頭），讓永靖從一個寄託族群和諧願景的地名，發展出兼具歷史建築與農業特產的雙重風貌。"], "quiz": {"q": "關於「永靖」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "廣東移民，寓意永久安靖。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！廣東移民，寓意永久安靖。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 509, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『東螺』這個地方，是怎麼來的嗎？北斗一帶舊稱，源自平埔族巴布薩族「東螺社」譯音，清代因舊街遭洪水沖毀而遷至今北斗鎮重建。", "東螺社是清代彰化平原巴布薩族的重要聚落之一，清初文獻記載其活動範圍以舊濁水溪（今東螺溪）沿岸為中心，是漢人尚未大規模入墾前，這片區域最主要的原住民部落。東螺社與周邊的眉裡社、二林社等同屬巴布薩族分支，各社之間雖語言文化相近，卻各自擁有獨立的頭目與領域範圍。隨著漢人移民自18世紀起大量湧入東螺溪流域拓墾，", "東螺社的傳統領域逐漸被侵占，族人被迫與漢人雜居或往內山遷徙，其漢化程度也隨之加深。道光元年（1821年）東螺街遭洪水沖毀後，倖存居民遷至今北斗鎮另闢新街，東螺社的社名雖仍保留在地名之中，其原有的部落組織與文化卻已隨著這次遷徙而逐漸消散，僅留下「東螺」這個詞彙，供後人追溯這片土地上曾經活躍的平埔族歷史。"], "quiz": {"q": "關於「東螺」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["北斗一帶舊稱，源自平埔族巴布薩族「東螺社」譯音，清代因舊街遭洪水沖毀而遷至今北斗鎮重建。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「東螺」市集而得名"], "correct": 0, "rightFb": "沒錯！北斗一帶舊稱，源自平埔族巴布薩族「東螺社」譯音，清代因舊街遭洪水沖毀而遷至今北斗鎮重建。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 510, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『枋橋頭』這個地方，是怎麼來的嗎？社頭鄉舊稱之一，相傳清代此地設有木造隘門枋橋以防禦盜匪，因而得名。", "枋橋頭是社頭鄉境內另一個與「社頭」並存的舊地名，兩者分屬同一鄉鎮不同聚落的歷史稱呼。清代社頭一帶因鄰近八卦山區，是漢人拓墾前緣與山區盜匪、原住民出草風險較高的地帶，先民為保護聚落與往來商旅安全，在交通要道上設置木造隘門「枋橋」作為防禦與警戒據點，這座枋橋所在的聚落因而得名「枋橋頭」，與新北市板橋區舊稱「枋橋」（因架設木板橋而得名）雖字面相似，", "命名緣由卻截然不同——板橋的枋橋指的是橋梁，社頭枋橋頭的枋橋則是防禦性隘門。枋橋頭與社頭鄉境內其他因平埔族「社頭」（大武郡社頭目居所）而得名的區域相互並存，共同勾勒出社頭鄉在清代同時面對族群防禦與拓墾開發的雙重歷史脈絡，如今枋橋頭一帶已完全融入社頭鄉的市街發展範圍。"], "quiz": {"q": "關於「枋橋頭」（彰化縣）這個地名，下列何者才是真正的由來？", "opts": ["社頭鄉舊稱之一，相傳清代此地設有木造隘門枋橋以防禦盜匪，因而得名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因鄭成功部隊行經此地時隨口命名而流傳下來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 0, "rightFb": "沒錯！社頭鄉舊稱之一，相傳清代此地設有木造隘門枋橋以防禦盜匪，因而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [205, 478, 509, 510]}]}, "南投縣": {"mainChains": [{"id": "main-南投縣-1", "title": "南投縣．南投市至集集鎮", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識南投縣的幾個地方：南投市、草屯鎮、竹山鎮、集集鎮。」", "stops": [{"placeId": 206, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『南投市』這個地方，是怎麼來的嗎？南投源自洪雅族「南投社」，因位居「北投社」（今草屯）之南而得名，與台北北投無關。", "南投地名由來與草屯的舊稱密切相關：清代文獻《諸羅縣志》記載「虎尾之北有大武郡山，東為南投山，內社二，溪南為南投，溪北為北投」，說明貓羅溪南北兩岸各有一個平埔族洪雅族聚落，溪北稱「北投社」（即今草屯鎮，古稱北投堡），溪南則相對稱為「南投社」，兩地地名互為對照，與台北市北投區並無地緣關聯，純屬巧合同名。關於「北投社」原名的考證另有一說，指其原稱「Tausabata」，", "漢人取其後半「bata」音譯為北投社，南投社之名則是相對於北投社而生；另有學者主張南投社本身即源自洪雅族支族阿立昆族語「Ramtau」的音譯。乾隆24年（1759年），彰化縣在南投正式設縣丞，是南投地區有政教建制之始，光緒元年更因開山撫番設立埔里社廳，逐步奠定今日南投縣治所在地的地位，如今南投市因糖業歷史與縣政府進駐，是全台唯一不臨海縣份的行政中樞。"], "quiz": {"q": "關於「南投市」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "南投源自洪雅族「南投社」，因位居「北投社」（今草屯）之南而得名，與台北北投無關。", "因清代此地盛產某種作物，官府設「南投市」市集而得名", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！南投源自洪雅族「南投社」，因位居「北投社」（今草屯）之南而得名，與台北北投無關。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 208, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『草屯鎮』這個地方，是怎麼來的嗎？草屯舊稱草鞋墩，因位處交通要衝，往來挑夫商旅在此更換磨損的草鞋，廢棄草鞋堆積如山而得名。", "草屯舊稱「草鞋墩」，這個地名生動描繪了清代交通往來的真實場景：草屯地處通往埔里、水沙連等內山地帶的必經要道，往來的挑夫、商旅在此長途跋涉後，草鞋早已磨損不堪，於是紛紛在此更換新鞋，卸下的破舊草鞋日積月累、堆積如山，形成一座顯眼的「墩」（小丘），因而得名「草鞋墩」，是台灣地名中相當生動寫實的交通民生案例。草屯古稱「北投社」，是洪雅族阿里坤支族的傳統領域，", "與溪南的「南投社」相對而得名。1920年，日本殖民政府推行地方行政改制，將「草鞋墩」簡化雅化為「草屯」，沿用至今。草屯鎮境內的坪頂里七股遺址、中原里頂崁仔遺址，出土了牛罵頭文化與營埔文化的史前器物，顯示這一帶自新石器時代便已有人類活動，如今草屯是南投縣人口最多的市鎮，也是中彰投都會區重要的衛星城市。"], "quiz": {"q": "關於「草屯鎮」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「草屯鎮」市集而得名", "因鄭成功部隊行經此地時隨口命名而流傳下來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "草屯舊稱草鞋墩，因位處交通要衝，往來挑夫商旅在此更換磨損的草鞋，廢棄草鞋堆積如山而得名。"], "correct": 3, "rightFb": "沒錯！草屯舊稱草鞋墩，因位處交通要衝，往來挑夫商旅在此更換磨損的草鞋，廢棄草鞋堆積如山而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 209, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『竹山鎮』這個地方，是怎麼來的嗎？竹山舊稱林圮埔，為紀念明鄭參軍林圮率眾入墾此地、力抗原住民而戰死得名，日治時期因竹林茂密改稱竹山。", "竹山舊稱「林圮埔」，是南投縣漢人開發史上的第一站：明永曆22年（1668年），鄭成功麾下參軍林圮（也寫作林圯）奉命率領部屬進入竹山一帶屯墾，這裡地屬水沙連番界，漢番交界局勢緊張，林圮在此設置社商休息用的草寮與原住民議和交易，境內「社寮」地名即由此而來；然而林圮其後行經東埔蚋（今竹山延平里）一帶時，遭逢原住民出草殺害而身亡，", "後人感念他開拓竹山的功績，便以其名為這片墾地命名「林圮埔」。1920年，日本殖民政府推行地方行政改制，因當地竹林密布、竹產業發達，將「林圮埔」改稱「竹山」，沿用至今，竹山也因此發展出全台重要的竹藝加工產業。境內因車籠埔斷層通過，1999年921大地震震央即在附近，如今設有車籠埔斷層保存園區，見證這段地質變動的歷史記憶。"], "quiz": {"q": "關於「竹山鎮」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "竹山舊稱林圮埔，為紀念明鄭參軍林圮率眾入墾此地、力抗原住民而戰死得名，日治時期因竹林茂密改稱竹山。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！竹山舊稱林圮埔，為紀念明鄭參軍林圮率眾入墾此地、力抗原住民而戰死得名，日治時期因竹林茂密改稱竹山。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 210, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『集集鎮』這個地方，是怎麼來的嗎？集集地名由來有二說，一為平埔族「集集社」譯音，一為早期移民將收穫物資集中交易而得名。", "集集地名由來主要有兩種說法：第一種說法認為，「集集」源自水沙連番界內平埔族「Chipu-chipu社」（集埔集埔社）的音譯漢字；第二種說法則從拓墾過程著眼，指出移民入墾此地後，習慣將各自開墾收穫的農產物資，集中運送到固定場所進行交易，這種「集中交易」的功能性聚落，因而得名「集集」或「聚集」。集集與鄰近的中寮鄉境內都曾出現「半路店」這個地名，", "指的是移民開發路段中途所形成的店鋪街市，反映了清代拓墾沿交通路線逐步向內山推進的過程。集集因地處濁水溪畔，日治時期興建集集線鐵路作為水力發電工程的運輸線，如今已轉型為觀光鐵道，加上綠色隧道與集集火車站的懷舊氛圍，是南投縣熱門的鐵道觀光小鎮，其舊稱「半路店」則已鮮少為人所知。"], "quiz": {"q": "關於「集集鎮」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "集集地名由來有二說，一為平埔族「集集社」譯音，一為早期移民將收穫物資集中交易而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！集集地名由來有二說，一為平埔族「集集社」譯音，一為早期移民將收穫物資集中交易而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [206, 208, 209, 210]}, {"id": "main-南投縣-2", "title": "南投縣．名間鄉至中寮鄉", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識南投縣的幾個地方：名間鄉、鹿谷鄉、中寮鄉。」", "stops": [{"placeId": 211, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『名間鄉』這個地方，是怎麼來的嗎？名間舊稱湳仔，因地勢低窪潮濕多爛泥而得名，日治時期因其日語發音近似「湳仔」台語音而改稱名間。", "名間鄉舊稱「湳仔」，「湳」在閩南語中意指濕軟泥濘的低窪地形，這一帶因排水不易、土地經常潮濕泥濘，先民便以此地形特徵為聚落命名，這種因低窪濕地而得名「湳仔」「大湳」的地名在台灣各地相當常見。1920年，日本殖民政府推行地方行政改制，選定漢字「名間」取代原本的「湳仔」，原因是「名間」二字的日語讀音「なま」（na-ma）與台語「湳仔」的發音十分相近，", "這種利用日語發音近似性來選字更名的方式，與新竹鎮西堡、關西等地借用日語地名的邏輯類似，但名間更特別之處在於是刻意挑選字義吉祥、發音又相近的漢字組合。名間鄉因八卦山台地南端地形，加上濁水溪沖積平原的加持，是全台重要的茶葉（尤其是松柏長青茶）與生薑產地，境內松柏嶺受天宮更是全台玄天上帝信仰的重要進香中心。"], "quiz": {"q": "關於「名間鄉」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「名間鄉」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "名間舊稱湳仔，因地勢低窪潮濕多爛泥而得名，日治時期因其日語發音近似「湳仔」台語音而改稱名間。"], "correct": 3, "rightFb": "沒錯！名間舊稱湳仔，因地勢低窪潮濕多爛泥而得名，日治時期因其日語發音近似「湳仔」台語音而改稱名間。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 212, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『鹿谷鄉』這個地方，是怎麼來的嗎？鹿谷舊稱羌仔寮，因早期羌群棲息於此，獵羌者搭寮居住而得名，1920年因「羌」與「鹿」相似、境內多溪谷而改稱鹿谷。", "鹿谷鄉舊稱「羌仔寮」，這個地名反映了當地開墾前的野生動物生態：清代此地尚未開墾之前，是山羌群聚棲息之地，前來狩獵羌隻的獵人在此搭建簡易茅寮暫居，隨著聚落逐漸擴大發展成村莊，便以「羌仔寮」為名，這個地名還曾出現「羌雅寮」「獐仔寮」「猐仔寮」等多種不同音譯寫法。1920年，日本殖民政府推行地方行政改制，考量「羌」與「鹿」外形相似，", "加上境內因濁水溪支流切割而多溪谷地形，便將「羌仔寮」改稱「鹿谷」，沿用至今。乾隆年間，漳州人程志成、泉州人許廷瑄先後率眾入山開墾，途中屢遭原住民出草威脅，歷經艱辛才逐步拓墾出羌仔寮、坪仔頂、車輄寮、小半天等聚落。如今鹿谷因氣候與地形適宜，是台灣最富盛名的凍頂烏龍茶產地，境內溪頭自然教育園區也是熱門的森林遊憩景點。"], "quiz": {"q": "關於「鹿谷鄉」（南投縣） 而流傳下來"], "correct": 0, "rightFb": "沒錯！魚池舊稱五城堡，因清道光末年在新城、貓蘭、司馬垵、水社、銃櫃五處聚落外築竹圍防禦而得名，另一舊稱魚池仔則因日月潭漁產豐富而來。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 215, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『國姓鄉』這個地方，是怎麼來的嗎？國姓因鄭成功部將劉國軒追擊平埔族大肚社時曾行經此地而得名，「國姓」則源自鄭成功受南明皇帝賜姓朱、人稱「國姓爺」的典故。", "國姓鄉地名由來與明鄭時期的一段軍事行動有關：鄭成功因獲南明隆武帝賜予「朱」姓，被尊稱為「國姓爺」，其麾下部將劉國軒在追擊反抗明鄭政權的平埔族拍瀑拉族大肚社族人時，曾率軍行經這片區域，後人為紀念這段與鄭成功「國姓爺」相關的歷史淵源，便將此地命名為「國姓」，是南投縣境內少數直接承襲明鄭時期人物典故的地名。國姓鄉地處烏溪上游河谷地帶，", "是漢人與泰雅族、布農族接觸拓墾的前緣地帶之一，境內因氣候與土壤條件適宜，是台灣重要的青梅與樹薯產地，每年梅花季更吸引大量遊客前來賞梅，讓這個源自鄭成功部將行軍典故的山區鄉鎮，發展出獨具特色的農業觀光資源。"], "quiz": {"q": "關於「國姓鄉」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "國姓因鄭成功部將劉國軒追擊平埔族大肚社時曾行經此地而得名，「國姓」則源自鄭成功受南明皇帝賜姓朱、人稱「國姓爺」的典故。"], "correct": 3, "rightFb": "沒錯！國姓因鄭成功部將劉國軒追擊平埔族大肚社時曾行經此地而得名，「國姓」則源自鄭成功受南明皇帝賜姓朱、人稱「國姓爺」的典故。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 216, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『水里鄉』這個地方，是怎麼來的嗎？水里原稱水裡坑，源自邵族「水裡社」（水社）社名，因鄰近日月潭畔部落而得名，1950年設鄉時簡化為水里。", "水里鄉地名源自居住於日月潭畔的邵族「水裡社」（又稱水社），日月潭舊稱「水裡湖」或「水社湖」正是因鄰近水裡社而得名，郁永河《裨海紀遊》記載日月潭因「水分丹碧二色，故名日月潭」，可見這座湖泊擁有雙重舊稱系統。水里鄉地處水裡溪匯入濁水溪之處，這片河階地帶因而得名「水裡坑」，1950年水里正式設鄉時，簡化為今日的「水里」。水里鄉境內的「社子」「拔社埔」等地名，", "同樣顯示這一帶曾是拍瀑拉族等南島原住民族群的傳統聚落所在地。日治大正2年（1914年），為了運輸埔里糖廠所需甘蔗與物資，鋪設連接外界的輕便鐵道，沿線設置多個中繼站，其中「車埕」因經常停放數百輛台車而得名，成為水里鄉重要的木材與交通運輸重鎮，如今車埕已轉型為知名的鐵道觀光景點。"], "quiz": {"q": "關於「水里鄉」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "水里原稱水裡坑，源自邵族「水裡社」（水社）社名，因鄰近日月潭畔部落而得名，1950年設鄉時簡化為水里。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！水里原稱水裡坑，源自邵族「水裡社」（水社）社名，因鄰近日月潭畔部落而得名，1950年設鄉時簡化為水里。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 217, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『信義鄉』這個地方，是怎麼來的嗎？信義鄉為布農族傳統領域，戰後國民政府取「四維八德」中的「信義」二字為山地鄉命名，境內羅娜為布農族最大部落。", "信義鄉是南投縣境內布農族的主要傳統領域，戰後國民政府治台，仿效「忠孝仁愛信義和平」等儒家傳統道德教條，為新設立的山地鄉命名，將這片布農族聚居的山地行政區定名為「信義」，與鄰近仁愛鄉（取「仁愛」二字）同屬這波政治教化式命名的產物。境內的「羅娜」是信義鄉規模最大的布農族部落，人口眾多、部落文化保存完整；「東埔」則是另一處著名的布農族部落，", "因鄰近溫泉、風景秀麗而聞名，境內東埔吊橋更是全台最高的吊橋之一。信義鄉境內還有台灣最高峰玉山，布農族稱之為「Tongku Saveq」（意指高大的山），清代文獻中則因終年雲霧繚繞、遠望皆白石而得名「玉山」，日治時期因比日本富士山更高，一度改稱「新高山」，戰後才恢復玉山舊名，成為認識台灣多元族群與外來政權更迭的絕佳例證。"], "quiz": {"q": "關於「信義鄉」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["信義鄉為布農族傳統領域，戰後國民政府取「四維八德」中的「信義」二字為山地鄉命名，境內羅娜為布農族最大部落。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！信義鄉為布農族傳統領域，戰後國民政府取「四維八德」中的「信義」二字為山地鄉命名，境內羅娜為布農族最大部落。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [214, 215, 216, 217]}, {"id": "side-南投縣-2", "title": "南投縣．仁愛鄉至溪頭", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識南投縣的幾個地方：仁愛鄉、清境、日月潭、溪頭。」", "stops": [{"placeId": 218, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『仁愛鄉』這個地方，是怎麼來的嗎？仁愛鄉舊稱霧社，源自泰雅語「終年雲霧繚繞」之意，戰後國民政府取「四維八德」中的「仁愛」二字為山地鄉命名。", "仁愛鄉境內的「霧社」，地名源自泰雅族語，意指這一帶地勢高聳、終年雲霧繚繞的地理特徵，是南投縣境內泰雅族與賽德克族的重要傳統領域。1930年，賽德克族在此發動震驚台灣社會的抗日行動「霧社事件」，是台灣原住民武裝抗日史上規模最大、影響最深遠的一次起義。事件後，日本當局將部分遺族強制遷移至北港溪與眉原溪之間的河階台地，因三條溪流匯集形似「川」字，日人稱之為「川中島」，", "族人則自稱「谷路邦」（Alan-Gluban）部落，戰後因去日本化考量改稱「清流部落」，如今兩個名稱仍並行使用。戰後，國民政府比照信義鄉的命名邏輯，將這片山地行政區定名為「仁愛」。仁愛鄉境內的清境農場，前身為「見晴農場」，1965年因時任行政院長蔣經國讚嘆「清新空氣任君取，境地幽雅是仙居」而改名清境，如今已是台灣中部最負盛名的高山觀光勝地之一。"], "quiz": {"q": "關於「仁愛鄉」（南投縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "仁愛鄉舊稱霧社，源自泰雅語「終年雲霧繚繞」之意，戰後國民政府取「四維八德」中的「仁愛」二字為山地鄉命名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 2, "rightFb": "沒錯！仁愛鄉舊稱霧社，源自泰雅語「終年雲霧繚繞」之意，戰後國民政府取「四維八德」中的「仁愛」二字為山地鄉命名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 219, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『清境』這個地方，是怎麼來的嗎？清境農場原名見晴農場，1965年因時任行政院長蔣經國讚嘆「清新空氣任君取，境地幽雅是仙居」而改名清境。", "清境農場前身為「見晴農場」，民國50年（1961年）由行政院退除役官兵輔導委員會創立，最初以安置退伍軍人從事高山農牧開墾為主要目的，「見晴」之名可能與當地地勢高聳、視野開闊、易見晴朗天色有關。民國54年（1965年），時任行政院長蔣經國先生造訪此地，見這片坐落於海拔約1750公尺高原上的牧場，四季景致如畫、氣候溫和清爽，讚嘆「清新空氣任君取，", "境地幽雅是仙居」，遂賜名「清境農場」，這句頗具詩意的題詞也成為地名由來的重要典故。清境地處中部橫貫公路霧社支線通往合歡山的必經之地，因終
