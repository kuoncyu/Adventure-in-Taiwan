的臨港鐵路濱線而得名。", "哈瑪星地名直接借用自日語詞彙：日治時期，日本殖民政府在打狗港（今高雄港）西南側進行填海造陸工程，並鋪設一條連接縱貫鐵路與港埠碼頭的臨港鐵路支線，日語稱這種沿海岸鋪設、通往港埠的鐵路線為「濱線」（はません，讀音Hamasen），當地居民依台語發音直接音譯為「哈瑪星」，這片新生的填海市街便以此為名。哈瑪星是高雄現代化都市發展的起點，", "日治時期高雄州廳、警察署、驛站等重要機關皆設於此，是當時高雄最繁華的政經核心地帶，也是全台第一個依都市計畫概念興建的街區。如今哈瑪星因保存打狗鐵道故事館、武德殿等歷史建築，加上鄰近駁二藝術特區與西子灣，是高雄市重要的歷史街區與觀光景點。"], "quiz": {"q": "關於「哈瑪星」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "哈瑪星源自日語「濱線」（はません，Hamasen）音譯，因日治時期填海造陸興建通往港埠碼頭的臨港鐵路濱線而得名。", "因清代此地盛產某種作物，官府設「哈瑪星」市集而得名"], "correct": 2, "rightFb": "沒錯！哈瑪星源自日語「濱線」（はません，Hamasen）音譯，因日治時期填海造陸興建通往港埠碼頭的臨港鐵路濱線而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 353, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『愛河』這個地方，是怎麼來的嗎？愛河舊稱打狗川、高雄川，1948年因河畔一間「愛河遊船所」在颱風中招牌被吹落、僅存「愛河」二字而意外得名，成為高雄最浪漫的地標。", "愛河的名稱演變歷經多次更迭：清代文獻曾稱這條河為「硫磺水」「硫磺港」，日治時期因加以疏濬整治成運河，正式定名為「打狗川」，其後改稱「高雄川」，戰後初期沿用「高雄川」或稱「高雄河」。關於「愛河」這個充滿詩意名稱的由來，民間流傳最廣的說法是：民國37年（1948年），有人在河畔開設一間名為「愛河遊船所」的划船生意店家，供情侶划舟談情說愛，", "某次颱風過境，招牌上「遊船所」三字遭強風吹落，僅剩「愛河」二字懸掛橋畔，加上當地曾發生殉情事件經媒體以「愛河」為題報導，這個名稱便逐漸廣為流傳、深植人心。1970年，政府為向蔣中正夫婦祝壽，一度將河名改為「仁愛河」，1991年市議會順應民意，才又正式改回「愛河」，這段數度更名的歷程，恰好也映照出高雄近代政治社會的變遷軌跡。"], "quiz": {"q": "關於「愛河」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "愛河舊稱打狗川、高雄川，1948年因河畔一間「愛河遊船所」在颱風中招牌被吹落、僅存「愛河」二字而意外得名，成為高雄最浪漫的地標。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「愛河」市集而得名"], "correct": 1, "rightFb": "沒錯！愛河舊稱打狗川、高雄川，1948年因河畔一間「愛河遊船所」在颱風中招牌被吹落、僅存「愛河」二字而意外得名，成為高雄最浪漫的地標。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 354, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『駁二』這個地方，是怎麼來的嗎？駁二源自「第二號接駁碼頭」倉庫，因日治時期興建、專供接駁轉運貨物的港埠倉庫群而得名，現已轉型為高雄重要的藝術特區。", "駁二地名由來相對單純直白：日治時期，高雄港區興建了一系列編號倉庫，專門作為貨物由船舶接駁上岸、轉運至鐵路或卡車的中繼儲放場所，這處倉庫因編號第二，被稱為「第二號接駁碼頭」倉庫，簡稱「駁二」。隨著高雄港區機能轉型，這些老舊倉庫一度面臨拆除命運，2000年代起，在地方文史工作者與藝術家的倡議下，", "市政府決定保留倉庫建築群並加以活化再利用，轉型為結合當代藝術展演、文創商店與親子遊憩空間的「駁二藝術特區」，是台灣港埠倉庫活化再生的成功典範之一。如今駁二因鄰近哈瑪星、西子灣與輕軌路線，已成為高雄市最具代表性的文創觀光地標，也是每年跨年城市光廊活動的重要場域。"], "quiz": {"q": "關於「駁二」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["駁 剛的故事裡。"}}, {"placeId": 357, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『凹子底』這個地方，是怎麼來的嗎？凹子底因當地地勢中央低窪、四周較高，狀似凹陷的盆地地形而得名。", "凹子底地名由來相對直白，源自當地的地形特徵：這一帶因周邊地勢略高、中央區域相對低窪，形成類似淺盆的凹陷地形，先民依此地貌特徵，將此地稱為「凹子底」，意指位於凹陷地形底部的聚落，這種依地勢高低直接命名地方的方式，在台灣各地相當常見。凹子底地處高雄市鼓山區與左營區交界地帶，", "因高雄捷運紅線凹子底站的設置，加上凹子底森林公園、農十六重劃區的開發，已從原本低窪的農業地帶，轉型為高雄市近年發展最為蓬勃的新興住宅與商業重劃區之一，高雄市立圖書館總館等地標建築也座落於此，讓這個描述地形的舊地名，發展出與過去截然不同的現代都會風貌。"], "quiz": {"q": "關於「凹子底」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "凹子底因當地地勢中央低窪、四周較高，狀似凹陷的盆地地形而得名。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！凹子底因當地地勢中央低窪、四周較高，狀似凹陷的盆地地形而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 358, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『內惟』這個地方，是怎麼來的嗎？內惟因清代此地設有防禦性柵欄（惟），聚落建於柵欄內側而得名，境內內惟埤現已闢為美術館公園。", "內惟地名由來源自清代的聚落防禦設施：「惟」在此處意指柵欄或圍籬一類的防禦性建物，這一帶清代因鄰近漢人與原住民接觸的前緣地帶，先民為求自保，在聚落周圍設置柵欄防禦，這處建於柵欄內側的聚落，因而得名「內惟」。內惟境內原有一處埤塘「內惟埤」，是重要的灌溉水源，如今這片埤塘已整治闢建為「內惟埤文化園區」，", "園區內坐落著高雄市立美術館、雕塑公園等藝文設施，加上鄰近的忠烈祠、英國領事館舊址等歷史古蹟，讓內惟從清代具有防禦機能的柵欄聚落，轉型為高雄市重要的藝術文化與生態休憩重鎮，也讓埤塘與藝術館舍相互輝映，成為高雄市區獨特的水岸文化地景。"], "quiz": {"q": "關於「內惟」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["內惟因清代此地設有防禦性柵欄（惟），聚落建於柵欄內側而得名，境內內惟埤現已闢為美術館公園。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 0, "rightFb": "沒錯！內惟因清代此地設有防禦性柵欄（惟），聚落建於柵欄內側而得名，境內內惟埤現已闢為美術館公園。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 359, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『九曲堂』這個地方，是怎麼來的嗎？九曲堂因下淡水溪（今高屏溪）流經此處河道曲折蜿蜒、形成多處水塘而得名，是台灣鐵路史上重要的舊鐵橋所在地。", "九曲堂地名由來源自當地的河川地形特徵：下淡水溪（今高屏溪）流經此處時，因地勢與地質因素形成多處曲折蜿蜒的河道與水塘，先民依此蜿蜒曲折的水文景觀，將此地稱為「九曲堂」，「堂」在此可能指匯聚成塘的水域。九曲堂因地處下淡水溪西岸，是日治時期糖業鐵道與縱貫鐵路的重要交會點，1913年完工的下淡水溪鐵橋（今高屏舊鐵橋），", "是當時亞洲第一長的鐵路橋樑，連接九曲堂與屏東地區，對台灣南部的糖業運輸與城鄉往來貢獻卓著。如今舊鐵橋雖已功成身退，卻與周邊的鐵橋濕地公園共同保存下來，成為認識台灣鐵道工程史與高屏溪流域生態的重要景點，讓這個因河道曲折得名的地方，留下深刻的近代交通建設記憶。"], "quiz": {"q": "關於「九曲堂」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "九曲堂因下淡水溪（今高屏溪）流經此處河道曲 」中的「民族」主義。", "民族地區地名源自高雄市區一條重要的南北向幹道「民族路」：這條道路的命名，取自國父孫中山先生所提出的「三民主義」政治理念中的「民族」主義，與高雄市其他道路如「民權」「民生」等，共同構成一套以三民主義精神命名市區道路的系統，這種以政治理念作為路名的作法，在戰後台灣各城市的道路命名中相當普遍。隨著民族路沿線逐漸發展成商業與住宅機能兼具的生活圈，", "「民族」也順勢成為這一帶地區的通稱地名。民族路貫穿高雄市三民區、鼓山區等多個行政區，沿線經過高雄車站周邊商圈與住宅社區，是高雄市區交通與生活機能的重要軸線之一。"], "quiz": {"q": "關於「民族」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "民族因高雄市內一條重要南北向道路「民族路」而得名，路名取自國父孫中山「三民主義」中的「民族」主義。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！民族因高雄市內一條重要南北向道路「民族路」而得名，路名取自國父孫中山「三民主義」中的「民族」主義。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 518, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『五塊厝』這個地方，是怎麼來的嗎？相傳清代最初僅有五戶人家在此開墾定居，因而得名，即今高雄市三民區一帶。", "五塊厝與三民區主地名「三塊厝」屬於相近邏輯、卻各自獨立發展的聚落地名：三塊厝源自王、蔡、鄭三姓移民各自搭屋開墾，五塊厝則相傳最初僅有五戶人家在此落地生根，共同開墾這片土地，因而以實際開墾戶數為地名，這種依開墾戶數多寡直接命名聚落的方式，與六腳（六家佃）、頭份（抓鬮第一份）等地名，", "同屬台灣拓墾史上常見的計量式命名邏輯。五塊厝地處三民區境內，日治時期因鄰近縱貫鐵路與愛河水運，逐漸發展成人口聚集的市街，如今雖已完全融入三民區的都市紋理之中，但透過鄰近的五塊厝派出所、五塊厝街等地名沿用，仍可追溯這段清代移民依戶數命名聚落的拓墾記憶。"], "quiz": {"q": "關於「五塊厝」（高雄市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「五塊厝」市集而得名", "相傳清代最初僅有五戶人家在此開墾定居，因而得名，即今高雄市三民區一帶。"], "correct": 3, "rightFb": "沒錯！相傳清代最初僅有五戶人家在此開墾定居，因而得名，即今高雄市三民區一帶。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [481, 482, 483, 518]}]}, "屏東縣": {"mainChains": [{"id": "main-屏東縣-1", "title": "屏東縣．潮州鎮至萬丹鄉", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識屏東縣的幾個地方：潮州鎮、東港鎮、恆春鎮、萬丹鄉。」", "stops": [{"placeId": 361, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『潮州鎮』這個地方，是怎麼來的嗎？潮州因清雍正4年廣東潮州府移民入墾此地，為紀念原鄉故里而沿用「潮州」為地名。", "潮州鎮地名由來，是台灣地名中典型的「移民懷鄉命名」案例：清雍正4年（1726年），來自廣東省潮州府的客家移民陸續渡海來到這片土地開墾定居，為了紀念自己的原鄉故里，便將新墾聚落直接命名為「潮州」，沿用至今，這種將原鄉地名移植到台灣新墾地的命名方式，與屏東佳冬（原稱源自原鄉茄苳）、台南東石（源自福建晉江東石鎮）等地名，", "屬於相同的思鄉命名邏輯。潮州鎮地處屏東平原中心地帶，因鐵路潮州線設站，加上地理位置適中，是屏東縣南部重要的交通樞紐與商業中心，境內的潮州鎮民族路夜市與胡家古厝等地標，也讓這個承載廣東移民鄉愁的城鎮，發展出屏東平原重要的生活機能核心地位。"], "quiz": {"q": "關於「潮州鎮」（屏東縣）這個地名，下列何者才是真 ps": [{"placeId": 369, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『鹽埔鄉』這個地方，是怎麼來的嗎？鹽埔因明代福建移民以十車食鹽外加菸酒火柴，向平埔族換取這片位於山地與平原間的荒埔而得名，另一說因溪埔地含鹽分重而得名。", "鹽埔鄉地名由來主要有兩種說法：第一種說法帶有濃厚的交易色彩，相傳明代福建移民葉唐山，以十台車份量的食鹽，外加一車菸酒火柴，向原本居住此地的平埔族交換這片介於山地與平原之間的草埔地，因當地地形屬於「埔」（未開墾的草原地帶），", "加上是以食鹽交換而來，因而得名「鹽埔」；第二種說法則從土壤特性出發，指這一帶溪埔地含鹽分較重，故稱「鹹埔莊」，後來才改稱較為文雅的「鹽埔」。鹽埔鄉地處隘寮溪沖積平原，因土壤肥沃，是屏東縣重要的檳榔、椰子與蜜棗產地。"], "quiz": {"q": "關於「鹽埔鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "鹽埔因明代福建移民以十車食鹽外加菸酒火柴，向平埔族換取這片位於山地與平原間的荒埔而得名，另一說因溪埔地含鹽分重而得名。"], "correct": 3, "rightFb": "沒錯！鹽埔因明代福建移民以十車食鹽外加菸酒火柴，向平埔族換取這片位於山地與平原間的荒埔而得名，另一說因溪埔地含鹽分重而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 370, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『高樹鄉』這個地方，是怎麼來的嗎？高樹原名大車路，因道路寬闊可容多輛牛車並行而得名，另有一說因庄頭大木棉樹高聳如車蓋，或因高地河階水量充沛、林木高大而改稱高樹。", "高樹鄉原名「大車路」，因這條聯外道路寬闊，可同時容納多輛牛車並行通過而得名。關於後來改稱「高樹」的原因，主要有兩種說法：一說是庄頭曾有一株高大的木棉樹，樹身雄偉挺拔，樹冠形狀宛如一頂碩大的車蓋，因而得名「高樹」；另一說則從地理環境出發，", "指漢人開墾初期，選擇在地勢較高的河階台地建立聚落，加上這一帶河川網絡縱橫、水量充沛，孕育出高大茂密的樹林景觀，因而得名。高樹鄉地處隘寮溪沖積扇頂端，因水源豐沛、土壤肥沃，是屏東縣重要的鳳梨與檳榔產地，也是全台最大的檳榔產區之一。"], "quiz": {"q": "關於「高樹鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["高樹原名大車路，因道路寬闊可容多輛牛車並行而得名，另有一說因庄頭大木棉樹高聳如車蓋，或因高地河階水量充沛、林木高大而改稱高樹。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！高樹原名大車路，因道路寬闊可容多輛牛車並行而得名，另有一說因庄頭大木棉樹高聳如車蓋，或因高地河階水量充沛、林木高大而改稱高樹。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 371, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『萬巒鄉』這個地方，是怎麼來的嗎？萬巒地名一說因先民見大武山峰巒綿延如萬座山巒而得名，一說因當地盛產鰻魚，「萬鰻」因客語發音近似轉為萬巒。", "萬巒鄉地名由來主要有兩種說法：第一種說法充滿詩意，相傳先民初入墾此地時，遙望大武山脈翠峰綿延起伏，宛如萬座山巒層疊而立，因而以「萬巒」為地名；第二種說法則帶有生活趣味，指清代這一帶溪流水塘中隨處可捕捉到鰻魚，居民因而稱此處為「萬鰻」，因客家話中「鰻」與「巒」發音十分相近，", "逐漸演變為今日的「萬巒」。萬巒鄉是屏東縣客家六堆文化區的核心聚落之一，以萬巒豬腳聞名全台，加上萬金天主堂（台灣現存最古老的天主教堂之一）與五溝水客家聚落，讓萬巒兼具客家傳統文化與多元宗教信仰的豐富人文底蘊。"], "quiz": {"q": "關於「萬巒鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "萬巒地名一說因先民見大武山峰巒綿延如萬座山巒而得名，一說因當地盛產鰻魚，「萬鰻」因客語發音近似轉為萬巒。", "因清代此地盛產某種作物，官府設「萬巒鄉」市集而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！萬巒地名一說因先民見大武山峰巒綿延如萬座山巒而得名，一說因當地盛產鰻魚，「萬鰻」因客語發音近似轉為萬巒。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 372, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『內埔鄉』這個地方，是怎麼來的嗎？內埔因先民在茂密森林中開闢出的旱田（客語稱埔），且位於森林內部而得名，清康熙年間由閩粵移民墾成。", "內埔鄉地名由來相對直白：這一帶早年是一片茂密的原始森林，最早入墾的先民在森林中間披荊斬棘，開闢出一片可耕作的旱田，客家話稱這種未開墾轉而闢成的旱地為「埔」，因這片埔地深藏於森林內部，因而得名「內埔」，意指位居內側森林之中的未墾埔地，", "清康熙年間由閩、粵籍移民共同開墾而成。內埔鄉是屏東縣客家六堆文化區中「後堆」的核心聚落，境內的六堆天后宮、內埔老街與台灣糖業博物館，加上檳榔、可可等農產，讓內埔成為認識屏東客家拓墾史與六堆聯防文化的重要據點。"], "quiz": {"q": "關於「內埔鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "內埔因先民在茂密森林中開闢出的旱田（客語稱埔），且位於森林內部而得名，清康熙年間由閩粵移民墾成。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！內埔因先民在茂密森林中開闢出的旱田（客語稱埔），且位於森林內部而得名，清康熙年間由閩粵移民墾成。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [369, 370, 371, 372]}, {"id": "main-屏東縣-4", "title": "屏東縣．竹田鄉至新園鄉", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識屏東縣的幾個地方：竹田鄉、新埤鄉、枋寮鄉、新園鄉。」", "stops": [{"placeId": 373, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『竹田鄉』這個地方，是怎麼來的嗎？竹田舊稱頓物，因是商家囤積貨物（頓物）之處而得名，日治時期因竹林多於水田而改稱竹田。", "竹田鄉地名由來主要有兩種說法：第一種說法指出，這一帶清代曾有一條熱鬧街道，路旁商家習慣在此囤積存放各類貨品物資，「頓物」在此意指堆放囤積貨物，因而得名「頓物庄」，日治時期考量此地竹林分布多於水田，取「竹是農村、田是農田」的意象，將地名改為「竹田」；第二種說法則認為，", "本地原稱「頓物潭」，昔日有池沼濕地，是居民丟棄廢棄雜物之處，故有此稱，1920年同樣改稱較為典雅的「竹田」。竹田鄉是屏東縣客家六堆文化區中「中堆」的核心聚落，境內竹田火車站與西勢忠義祠（六堆忠義祠），是了解客家先民拓墾與聯防歷史的重要地標。"], "quiz": {"q": "關於「竹田鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["竹田舊稱頓物，因是商家囤積貨物（頓物）之處而得名，日治時期因竹林多於水田而改稱竹田。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因清代此地盛產某種作物，官府設「竹田鄉」市集而得名"], "correct": 0, "rightFb": "沒錯！竹田舊稱頓物，因是商家囤積貨物（頓物）之處而得名，日治時期因竹林多於水田而改稱竹田。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 374, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『新埤鄉』這個地方，是怎麼來的嗎？新埤因清代客家移民興建人工蓄水池（埤）後，在其前方建立新聚落，與內埔鄉老埤南北對稱而得名新埤頭，日治簡化為新埤。", "新埤鄉地名由來源自清代客家移民的水利拓墾工程：先民為了灌溉農田，在此興建人工蓄水池「埤」，並在埤塘前方建立新的聚落，因與內埔鄉境內另一處較早開發的「老埤」（老埤頭）南北相互對稱，這處新建的聚落便被稱為「新埤頭」，1920年，日本殖民政府推行地方行政改制，", "簡化去除「頭」字，改稱「新埤」，沿用至今。新埤鄉是屏東縣客家六堆文化區中「先鋒堆」的所在地，因土壤與氣候條件適宜，是台灣重要的檳榔與蓮霧產地，境內的餉潭、萬隆等聚落，也保留著客家先民依水築埤、拓墾定居的歷史記憶。"], "quiz": {"q": "關於「新埤鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "新埤因清代客家移民興建人工蓄水池（埤）後，在其前方建立新聚落，與內埔鄉老埤南北對稱而得名新埤頭，日治簡化為新埤。"], "correct": 3, "rightFb": "沒錯！新埤因清代客家移民興建人工蓄水池（埤）後，在其前方建立新聚落，與內埔鄉老埤南北對稱而得名新埤頭，日治簡化為新埤。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 375, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『枋寮鄉』這個地方，是怎麼來的嗎？枋寮因清初此地林木茂盛、盛產可製木板的檀木（俗稱枋仔樹），先民砍伐後搭建工寮暫住而得名。", "枋寮鄉地名由來相對直白：清代初期，這一帶山林茂密，盛產一種質地優良、可製作木板的樹種「檀木」，當地俗稱這類木材為「枋仔樹」，先民入墾時，砍伐這些樹木製成木板，並就地搭建簡易工寮暫時棲身，隨著人口聚集逐漸發展成聚落，因而得名「枋寮」，意指以木板搭建工寮居住之地。枋寮鄉地處屏東縣西南沿海地帶，", "是南迴鐵路與南迴公路的重要起點，因鄰近台灣海峽，是黑珍珠蓮霧與漁業養殖的重要產地，享有「黑珍珠的故鄉」美譽，加上枋寮鐵路藝術村，讓這個因搭建木板工寮得名的聚落，發展成屏東縣南側重要的交通門戶與農漁業重鎮。"], "quiz": {"q": "關於「枋寮鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "枋寮因清初此地林木茂盛、盛產可製木板的檀木（俗稱枋仔樹），先民砍伐後搭建工寮暫住而得名。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因清代此地盛產某種作物，官府設「枋寮鄉」市集而得名"], "correct": 1, "rightFb": "沒錯！枋寮因清初此地林木茂盛、盛產可製木板的檀木（俗稱枋仔樹），先民砍伐後搭建工寮暫住而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 376, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『新園鄉』這個地方，是怎麼來的嗎？新園因明末福建移民將高屏溪畔原野開墾為新闢的田園（旱田）而得名。", "新園鄉地名由來相對單純：明末，來自福建的黃姓等移民渡海來到高屏溪畔，將這片原本荒蕪的原野逐步開墾為可耕作的田園，至清乾隆年間，這片墾地大多已開發完成，並陸續形成多個村莊聚落，因這些村莊是建立在新闢成的田園（旱田稱為「園」）之上，", "因而得名「新園」，沿用至今。新園鄉地處高屏溪出海口北岸，因土壤肥沃、水源充足，是屏東縣重要的水稻與蓮霧產地，境內的鹽埔漁港與高屏溪畔的自行車道，也讓新園兼具傳統農業聚落與濱溪休閒觀光的雙重風貌。"], "quiz": {"q": "關於「新園鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "新園因明末福建移民將高屏溪畔原野開墾為新闢的田園（旱田）而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！新園因明末福建移民將高屏溪畔原野開墾為新闢的田園（旱田）而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [373, 374, 375, 376]}, {"id": "main-屏東縣-5", "title": "屏東縣．崁頂鄉至佳冬鄉", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識屏東縣的幾個地方：崁頂鄉、林邊鄉、南州鄉、佳冬鄉。」", "stops": [{"placeId": 377, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『崁頂鄉』這個地方，是怎麼來的嗎？崁頂因地勢較周邊高亢，雨季河水氾濫時此處不易淹水，故取「地勢高聳頂端」之意得名。", "崁頂鄉地名由來源自其獨特的地形優勢：這一帶四周地勢低平，加上河流經過，每逢雨季容易氾濫成災，唯獨這處聚落所在的位置地勢較為高亢，即使暴雨來襲也少受水患侵擾，先民依此優越的地理條件，將此地稱為「崁頂」，取其「地勢高聳、宜於居住的頂端之地」之意，", "這種依相對地勢高低命名地方、藉以凸顯免受水患威脅優勢的方式，在台灣沿海與河濱平原地帶相當常見。崁頂鄉地處東港溪下游沖積平原，因土壤肥沃，是屏東縣重要的水稻與蓮霧產地，也是屏東平原南側典型的農業鄉鎮之一。"], "quiz": {"q": "關於「崁頂鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "崁頂因地勢較周邊高亢，雨季河水氾濫時此處不易淹水，故取「地勢高聳頂端」之意得名。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！崁頂因地勢較周邊高亢，雨季河水氾濫時此處不易淹水，故取「地勢高聳頂端」之意得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 378, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『林邊鄉』這個地方，是怎麼來的嗎？林邊因這一帶早期林木茂盛，先民在森林邊緣地帶建立聚落而得名，日治時期統一稱為林邊。", "林邊鄉地名由來與大樹區、林園區等地相似，皆源自早期茂密的森林景觀：這一帶在漢人拓墾之初，原是林木蔥鬱的原始林地，先民考量深入林地開墾風險較高，選擇在森林邊緣地帶建立聚落、逐步向內拓展，因而得名「林仔邊」，日治時期以「林邊」統一稱呼這處行政區，沿用至今。林邊鄉地處東港溪與林邊溪之間的沿海沖積平原，", "因地勢低窪，加上地層下陷問題，早年曾因養殖漁業超抽地下水而導致嚴重水患，如今則以蓮霧、櫻花蝦及淺坪式養殖漁業聞名，境內崎峰社區更以彩繪村活化滯洪池周邊社區，讓林邊從水患陰影中逐步轉型為兼具農漁業與社區營造特色的濱海鄉鎮。"], "quiz": {"q": "關於「林邊鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「林邊鄉」市集而得名", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "林邊因這一帶早期林木茂盛，先民在森林邊緣地帶建立聚落而得名，日治時期統一稱為林邊。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！林邊因這一帶早期林木茂盛，先民在森林邊緣地帶建立聚落而得名，日治時期統一稱為林邊。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 379, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『南州鄉』這個地方，是怎麼來的嗎？南州原名溪州，因位於溪流沖積沙洲（溪州）南岸而得名，因台灣多地皆稱溪州易生混淆，加上地處台灣南端而改稱南州。", "南州鄉原名「溪州」，因這片區域地處東港溪沖積沙洲南岸地帶，先民依此地形特徵，將此地稱為「溪州」，最初隸屬於林邊鄉管轄，後來才劃分出來獨立設鄉。由於台灣各地有為數不少同樣稱為「溪州」的地名（如彰化縣亦有溪州鄉），容易造成行政區劃與郵務往來的混淆，", "加上這處溪州地處屏東平原南端，地方遂決定將鄉名改為「南州」，既保留原本方位的意涵，又能與台灣其他溪州地名有所區隔。南州鄉因土壤肥沃，是屏東縣重要的甘蔗、蓮霧與檳榔產地，境內南州糖廠舊址與鐵馬道，也讓南州保留了部分糖業歷史的產業記憶。"], "quiz": {"q": "關於「南州鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外 eneEmoji": "🌾", "pages": ["你知道『車城鄉』這個地方，是怎麼來的嗎？車城因清代先民為抵禦原住民攻擊，以載運農作物的牛車環繞聚落圍成防禦城牆而得名。", "車城鄉地名由來，源自清代先民就地取材的防禦智慧：這一帶因地處恆春半島前緣，時常面臨原住民出草侵擾的威脅，先民便將平日用來載運農作物的牛車，環繞聚落排列圍成臨時防禦城牆，抵禦外敵攻擊，因而得名「車城」；民間也流傳先民曾在一次遭遇突襲的危急時刻，", "急中生智以牛車圍城成功擊退攻勢，因而以此命名紀念這段驚險的拓墾歷程。車城鄉因地處恆春半島門戶，福安宮（土地公廟）是全台規模最大的土地公廟之一，加上四重溪溫泉與國立海洋生物博物館，是恆春半島北側重要的信仰、溫泉與海洋教育觀光重鎮。"], "quiz": {"q": "關於「車城鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["車城因清代先民為抵禦原住民攻擊，以載運農作物的牛車環繞聚落圍成防禦城牆而得名。", "因清代此地盛產某種作物，官府設「車城鄉」市集而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！車城因清代先民為抵禦原住民攻擊，以載運農作物的牛車環繞聚落圍成防禦城牆而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 383, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『滿州鄉』這個地方，是怎麼來的嗎？滿州原稱蚊蟀埔，源自排灣族語形容獵獲過剩、棄置腐爛發出臭氣的譯音，因字義不雅，1920年改稱滿州。", "滿州鄉舊稱「蚊蟀埔」，這個地名由來頗具生活趣味：這一帶原是排灣族的傳統獵場，族人狩獵豐收時，往往獵獲數量遠超過所需食用份量，多餘的獵物只能棄置在原野上任其腐敗，日積月累造成陣陣難聞的臭氣瀰漫，排灣族語中形容「臭氣」的詞彙音譯為「蚊蟀」，這片區域因而得名「蚊蟀埔」。1920年，", "日本殖民政府推行地方行政改制，考量「蚊蟀」二字字義不甚雅觀，遂以同音異義的方式，改稱較為中性文雅的「滿州」，沿用至今。滿州鄉因位處恆春半島東側，是台灣賞鷹勝地，每年秋季灰面鵟鷹過境時吸引大量賞鳥人士造訪，加上港口吊橋與哭麒麟等自然景觀，是恆春半島重要的生態觀光鄉鎮。"], "quiz": {"q": "關於「滿州鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "滿州原稱蚊蟀埔，源自排灣族語形容獵獲過剩、棄置腐爛發出臭氣的譯音，因字義不雅，1920年改稱滿州。"], "correct": 3, "rightFb": "沒錯！滿州原稱蚊蟀埔，源自排灣族語形容獵獲過剩、棄置腐爛發出臭氣的譯音，因字義不雅，1920年改稱滿州。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 384, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『枋山鄉』這個地方，是怎麼來的嗎？枋山相傳因古時附近有山突然崩裂而稱崩山，因字義不吉，取閩南語諧音改稱枋山。", "枋山鄉地名由來，相傳與一起古代山崩事件有關：這一帶附近曾有一座山頭無預警發生大規模崩裂，先民目睹這起驚人的自然災變後，便將此地命名為「崩山」，直接記錄下這段山崩的歷史記憶。然而，「崩山」二字帶有不祥的意涵，容易讓人聯想到災禍與厄運，地方後來便以閩南語發音相近的「枋山」取代，", "既保留原本的地名發音，又避開了「崩」字的負面聯想，這種因避諱不吉字義而改用諧音字的命名方式，在台灣地名演變中相當常見。枋山鄉地處恆春半島西側沿海，因南迴公路貫穿其間，加上愛文芒果與洋蔥產業，是連接屏東平原與恆春半島的重要交通門戶。"], "quiz": {"q": "關於「枋山鄉」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "枋山相傳因古時附近有山突然崩裂而稱崩山，因字義不吉，取閩南語諧音改稱枋山。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！枋山相傳因古時附近有山突然崩裂而 ": 395, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『歸來』這個地方，是怎麼來的嗎？歸來相傳因胡姓兄弟遷居他處後，見此地水土宜人又重新遷回定居，因而得名「歸來」，寓意遊子歸鄉之意。", "歸來地名由來，相傳與一段先民遷徙又折返的故事有關：據傳早年有胡姓兩兄弟渡海來到這片土地開墾定居，其後因故遷居他處另謀發展，然而經過一段時間後，兄弟倆思念這片土地的水土環境，認為此地更適宜安身立命，於是決定重新遷回原本的墾地定居，鄉里便以「歸來」為這片土地命名，", "紀念這段遊子去而復返的拓墾歷程，這種以先民具體遷徙經歷命名地方的方式，為屏東市周邊地名增添了幾分人情故事的溫度。歸來地處屏東市南側，因鄰近縱貫鐵路歸來車站，加上蓮霧與檳榔等農產，是屏東市郊區重要的住宅與農業生活圈。"], "quiz": {"q": "關於「歸來」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "歸來相傳因胡姓兄弟遷居他處後，見此地水土宜人又重新遷回定居，因而得名「歸來」，寓意遊子歸鄉之意。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！歸來相傳因胡姓兄弟遷居他處後，見此地水土宜人又重新遷回定居，因而得名「歸來」，寓意遊子歸鄉之意。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 396, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『西勢』這個地方，是怎麼來的嗎？西勢因地處屏東平原客家聚落分布範圍的西側而得名，是六堆客家文化區中常見的方位型地名。", "西勢地名由來相對單純，源自其相對於周邊客家聚落的方位：這一帶因地處屏東平原客家六堆聚落分布範圍的西側地帶，先民依此相對位置，將此地稱為「西勢」，「勢」在此處作為方位詞的後綴使用，這種依方位直接命名地方的方式，在台灣客家聚落地名中相當常見，類似的地名邏輯也可見於台灣其他地區的「西勢」「東勢」等地名。西勢地區因是六堆客家文化圈的一部分，", "境內保留部分傳統客家夥房建築與信仰習俗，加上鄰近的忠義祠等六堆重要地標，讓西勢成為屏東平原客家拓墾史與聚落分布研究中，一處具有方位參照意義的地名。"], "quiz": {"q": "關於「西勢」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因清代此地盛產某種作物，官府設「西勢」市集而得名", "西勢因地處屏東平原客家聚落分布範圍的西側而得名，是六堆客家文化區中常見的方位型地名。"], "correct": 3, "rightFb": "沒錯！西勢因地處屏東平原客家聚落分布範圍的西側而得名，是六堆客家文化區中常見的方位型地名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [393, 394, 395, 396]}, {"id": "side-屏東縣-3", "title": "屏東縣．加祿至六堆", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識屏東縣的幾個地方：加祿、六塊厝、鎮安、六堆。」", "stops": [{"placeId": 397, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『加祿』這個地方，是怎麼來的嗎？加祿源自排灣族部落社名的音譯，是枋寮鄉境內排灣族傳統聚落所在地，地名沿用至今。", "加祿地名源自排灣族部落社名的音譯，是漢人尚未大規模入墾枋寮一帶之前，這片區域排灣族傳統聚落的所在地，反映了恆春半島北側枋寮沿海地帶，同樣曾是原住民族生活領域的歷史痕跡。隨著漢人移民逐漸遷入拓墾，加祿的原住民語地名仍持續沿用，成為枋寮鄉境內饒富原住民語言色彩的地名之一。加祿地區因鄰近南迴鐵路加祿車站，", "是連接屏東平原與恆春半島、南迴鐵公路沿線的重要中繼站之一，境內仍可見排灣族文化與漢人拓墾聚落交融並存的地方風貌，是了解恆春半島北端族群互動歷史的重要據點。" 」即為「隊」的客語同音異寫，指軍事編組單位而非行政區劃，這與六甲、林鳳營等源自明鄭軍屯的地名邏輯不同，", "六堆是清代民間自發組成的地方防衛體系。此後六堆團練歷經多次動員，包括平定吳福生事件、林爽文事件等，逐漸從臨時性義勇軍組織，演變為凝聚屏東客家族群認同的文化象徵。如今「六堆」已超越單純的軍事聯防意涵，成為涵蓋語言、信仰、建築與生活習俗的整體客家文化圈代稱，六堆客家文化園區便設立於內埔鄉，作為保存與推廣這段歷史記憶的重要據點。"], "quiz": {"q": "關於「六堆」（屏東縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "清代六堆客家先民為自保而組成的六個聯防區域（前、後、左、右、中、先鋒堆），為屏東平原重要的客家文化區。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！清代六堆客家先民為自保而組成的六個聯防區域（前、後、左、右、中、先鋒堆），為屏東平原重要的客家文化區。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [397, 484, 485, 517]}]}, "宜蘭縣": {"mainChains": [{"id": "main-宜蘭縣-1", "title": "宜蘭縣．宜蘭市至礁溪鄉", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識宜蘭縣的幾個地方：宜蘭市、羅東鎮、蘇澳鎮、礁溪鄉。」", "stops": [{"placeId": 398, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『宜蘭市』這個地方，是怎麼來的嗎？宜蘭市舊稱五圍，因位居適中、噶瑪蘭通判楊廷理築土城時遍植九芎樹而雅稱九芎城，光緒元年設縣，取「蘭」字加「宜」字定名宜蘭。", "宜蘭市清嘉慶7年（1802年）漢人拓墾至此，依結首制開墾順序稱為「五圍」。嘉慶17年（1812年）噶瑪蘭設廳後，官方認為五圍地處適中、腹地開闊，適合建築城垣，遂委由知府楊廷理督造土城；當時台灣西部城池多以刺竹圍築，楊廷理卻認為宜蘭盛產的九芎樹木質堅實、隨栽即活，比插竹為城更加堅固耐久，因而遍植九芎樹作為城牆屏障，其詩作〈重定噶瑪蘭全圖偶成〉更留下「他日濃陰懷舊澤，", "聽人談說九芎城」的詩句，後人便據此將宜蘭城稱為「九芎城」，但學者考證指出，這其實是後人依詩意附會而成的浪漫想像，官方文獻中未必真正如此稱呼。光緒元年（1875年），清廷正式設縣，取原名「蛤仔難」「噶瑪蘭」中的「蘭」字，加上寓意美好的「宜」字，定名「宜蘭縣」，沿用至今。"], "quiz": {"q": "關於「宜蘭市」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "宜蘭市舊稱五圍，因位居適中、噶瑪蘭通判楊廷理築土城時遍植九芎樹而雅稱九芎城，光緒元年設縣，取「蘭」字加「宜」字定名宜蘭。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！宜蘭市舊稱五圍，因位居適中、噶瑪蘭通判楊廷理築土城時遍植九芎樹而雅稱九芎城，光緒元年設縣，取「蘭」字加「宜」字定名宜蘭。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 399, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『羅東鎮』這個地方，是怎麼來的嗎？羅東源自噶瑪蘭平埔族語，因當地一塊巨石形狀似猴，族語稱猴子發音近似「羅東」而得名。", "羅東地名由來，源自平埔族噶瑪蘭族語言的音譯：相傳這一帶境內道路旁有一塊天然巨石，外形輪廓神似猴子蹲踞的姿態，噶瑪蘭族語言中稱呼猴子的發音，恰好與漢字「羅東」的讀音十分相近，先民依此音譯將這片區域命名為「羅東」，這種依動物外形巨石命名地方、又巧妙融入原住民語音譯的方式，", "在宜蘭地名史上獨具特色。羅東因地處蘭陽平原中心地帶，加上羅東林場（原太平山林場貯木池）的設立，日治時期一度是台灣三大林業重鎮之一，如今羅東林業文化園區已 me": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『壯圍鄉』這個地方，是怎麼來的嗎？壯圍因清代吳沙之子吳光裔招募壯丁拓墾，依序劃分壯一至壯七等墾地分賞壯丁，統稱壯圍而得名。", "壯圍鄉地名由來，與吳沙家族拓墾蘭陽平原的歷史直接相關：吳沙率眾開墾頭城一帶後，其子吳光裔（一說吳化）承繼父志，繼續招募壯丁向南拓展開墾範圍，待這片土地開墾完成後，為酬謝隨行壯丁的辛勞貢獻，依開墾先後或分配順序，將墾地劃分為壯一、壯二、壯三……直到壯七等區塊，", "分別賞賜給參與拓墾的壯丁，這片區域統稱「壯圍」，也稱「民壯圍」，意指由民間招募的壯丁所圍墾的土地。壯圍鄉地處蘭陽平原濱海地帶，因地勢平坦、水源充足，是宜蘭縣重要的哈密瓜與蔬果產地，境內東港榕樹公園與濱海自行車道，也讓壯圍兼具農業生產與濱海休閒的雙重風貌。"], "quiz": {"q": "關於「壯圍鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「壯圍鄉」市集而得名", "壯圍因清代吳沙之子吳光裔招募壯丁拓墾，依序劃分壯一至壯七等墾地分賞壯丁，統稱壯圍而得名。"], "correct": 3, "rightFb": "沒錯！壯圍因清代吳沙之子吳光裔招募壯丁拓墾，依序劃分壯一至壯七等墾地分賞壯丁，統稱壯圍而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 404, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『員山鄉』這個地方，是怎麼來的嗎？員山因東側有一座孤立突起、外形渾圓的小山丘而得名。", "員山鄉地名由來相對單純，源自當地的地形地標：這一帶東側有一座獨立於平原之上、外形渾圓飽滿的小山丘，先民依此顯眼的地形特徵，直接以「員山」（「員」通「圓」）為地名，這種依境內顯著地標山形直接命名地方的方式，在台灣各地相當常見。員山鄉地處蘭陽平原西側、雪山山脈東麓，", "因地勢由平原漸次爬升至丘陵山區，加上宜蘭河、蘭陽溪等水系流經，是宜蘭縣重要的水稻與蔬果產地。境內的員山機堡（二戰時期日軍戰鬥機掩體）、望龍埤與宜蘭美酒博物館，加上鄰近的雙連埤生態濕地，讓員山兼具戰爭歷史記憶與豐富生態景觀的多元面貌。"], "quiz": {"q": "關於「員山鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "員山因東側有一座孤立突起、外形渾圓的小山丘而得名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！員山因東側有一座孤立突起、外形渾圓的小山丘而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 405, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『冬山鄉』這個地方，是怎麼來的嗎？冬山因境內南方有一座外形狀似冬瓜的山丘而得名，另一說因五結鄉利澤簡居民利用冬山河運送薪柴而得名。", "冬山鄉地名由來主要有兩種說法：第一種說法指出，這一帶南方有一座山丘，因外形輪廓神似冬瓜，先民依此地形特徵，將此地稱為「冬瓜山」，1920年簡化為「冬山」；第二種說法則從水運貿易出發，指五結鄉利澤簡（今利澤村）一帶的居民，習慣經由這條流貫此地的河川運送薪柴（冬季所需的柴薪），", "這條河流因而得名「冬山河」，冬山鄉便以此河為名。冬山鄉因冬山河親水公園的整治開發，成為每年舉辦國際童玩藝術節的重要場地，加上梅花湖、香格里拉休閒農場等景點，讓冬山從原本描述山形或柴薪貿易的地名，發展成宜蘭縣最具代表性的親水休閒觀光鄉鎮之一。"], "quiz": {"q": "關於「冬山鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "冬山因境內南方有一座外形狀似冬瓜的山丘而得名，另一說因五結鄉利澤簡居民利用冬山河運送薪柴而得名。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！冬山因境內南方有一座外形狀似冬瓜的山丘而得名，另一說因五結鄉利澤簡居民利用冬山河運送薪柴而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [403, 404, 405]}], "sideQuests": [{"id": "side-宜蘭縣-1", "title": "宜蘭縣．五結鄉至南澳鄉", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識宜蘭縣的幾個地方：五結鄉、三星鄉、大同鄉、南澳鄉。」", "stops": [{"placeId": 406, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『五結鄉』這個地方，是怎麼來的嗎？五結因清代蘭陽平原採「結首制」開墾，此地是依開墾順序劃分的第五個「結」（開墾單位）而得名。", "五結鄉地名源自清代蘭陽平原獨特的「結首制」開墾組織：吳沙率眾入墾蘭陽平原時，為有效管理眾多移民的拓墾工作，將墾民依人數劃分為若干小組，每組推舉一位領袖稱為「小結首」，數個小結再合組推舉「大結首」統籌管理，這種開墾單位稱為「結」，宜蘭地區至今仍留有頭城、二結、四結、五結等一系列依結首制開墾順序命名的地名，", "五結正是這套開墾單位系統中第五個「結」的所在地。五結鄉地處蘭陽平原東側出海口，因冬山河與蘭陽溪匯流入海，是重要的水產養殖與稻米產地，境內國立傳統藝術中心與五結利澤簡老街，讓五結兼具傳統藝術文化保存與親水休閒觀光的雙重特色。"], "quiz": {"q": "關於「五結鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["五結因清代蘭陽平原採「結首制」開墾，此地是依開墾順序劃分的第五個「結」（開墾單位）而得名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因鄭成功部隊行經此地時隨口命名而流傳下來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！五結因清代蘭陽平原採「結首制」開墾，此地是依開墾順序劃分的第五個「結」（開墾單位）而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 407, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『三星鄉』這個地方，是怎麼來的嗎？三星舊稱叭哩沙喃，源自噶瑪蘭族語「Pressinowan」，意指竹林，因日治時期遷移庄治至三星山麓而改稱三星。", "三星鄉舊稱「叭哩沙喃」，源自噶瑪蘭族語「Pressinowan」的音譯，意指「竹林」，反映這一帶清代原是竹林密布的荒埔地帶，也是噶瑪蘭族與泰雅族傳統領域的交界地帶：沿著蘭陽溪往上游追溯，越過叭哩沙便進入泰雅族的傳統獵場範圍。19世紀中葉，清朝軍隊曾在此駐紮防守，逐漸發展成聚落市街；光緒元年（1875年），", "陳輝煌率眾入墾，是這一帶較晚期開發的地區之一。大正9年（1920年），因庄治遷移至三星山山麓，日本殖民政府遂將地名改為「三星」，沿用至今。三星鄉因土壤肥沃、灌溉便利，是宜蘭縣重要的三星蔥、銀柳與上將梨產地，加上境內清水地熱（台灣第一座地熱發電廠所在地），讓三星兼具精緻農業與地熱能源開發的特色。"], "quiz": {"q": "關於「三星鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "三星舊稱叭哩沙喃，源自噶瑪蘭族語「Pressinowan」，意指竹林，因日治時期遷移庄治至三星山麓而改稱三星。"], "correct": 3, "rightFb": "沒錯！三星舊稱叭哩沙喃，源自噶瑪蘭族語「Pressinowan」，意指竹林，因日治時期遷移庄治至三星山麓而改稱三星。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 408, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『大同鄉』這個地方，是怎麼來的嗎？大同因源自蘭陽溪舊稱濁水溪而設濁水鄉，後因境內太平山改稱太平鄉，1958年因與台中太平鄉同名，抽籤改為大同鄉。", "大同鄉地名歷經多次演變：戰後初期，這片位於蘭陽溪（舊稱濁水溪）上游、以泰雅族為主要居民的山地行政區，最初以流經境內的濁水溪為名，設立「濁水鄉」；1947年，因境內著名的太平山林場而改稱「太平鄉」。然而，台中縣（今台中市）境內也有一處同樣稱為「太平鄉」的行政區，兩地名稱重複，容易造成行政與郵務上的混淆，", "1958年，經過抽籤決定的方式，這片山地行政區改稱「大同鄉」，沿用至今，這種以抽籤方式決定行政區重新命名的作法，是台灣地名史上相當特殊的案例。大同鄉因太平山國家森林遊樂區與明池、棲蘭等森林景觀聞名，是宜蘭縣重要的高山林業與生態觀光重鎮，也是泰雅族重要的傳統領域。"], "quiz": {"q": "關於「大同鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "大同因源自蘭陽溪舊稱濁水溪而設濁水鄉，後因境內太平山改稱太平鄉，1958年因與台中太平鄉同名，抽籤改為大同鄉。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！大同因源自蘭陽溪舊稱濁水溪而設濁水鄉，後因境內太平山改稱太平鄉，1958年因與台中太平鄉同名，抽籤改為大同鄉。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 409, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『南澳鄉』這個地方，是怎麼來的嗎？南澳因是泰雅族南澳社的傳統領域，該社族人祖先自南湖大山遷徙而下，因而以社名為地名。", "南澳鄉地名源自居住於此的泰雅族「南澳社」：根據泰雅族口傳歷史，這一帶族人的祖先原本居住在中央山脈的南湖大山一帶，其後逐漸遷徙下山，在這片臨海山區建立聚落定居，族人便以原有的社名「南澳」，作為這片新居地的稱呼。清代這一帶隸屬「後山」範圍，清廷為防範外國勢力覬覦，同治13年（1874年）命提督羅大春開闢北路（今蘇花公路前身），", "清軍進駐後與當地泰雅族屢生衝突；光緒16年（1890年），劉銘傳更派兵討伐，南澳泰雅族因而遭受重創。南澳鄉是宜蘭縣面積最大、人口密度最小的行政區，因蘇花公路貫穿其間，加上東岳湧泉、南澳古道等自然景觀，是宜蘭縣南側重要的泰雅族文化與生態觀光鄉鎮。"], "quiz": {"q": "關於「南澳鄉」（宜蘭縣）這個地名，下列何者才是真正的由來？", "opts": ["南澳因是泰雅族南澳社的傳統領域，該社族人祖先自南湖大山遷徙而下，因而以社名為地名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 0, "rightFb": "沒錯！南澳因是泰雅族南澳社的傳統領域，該社族人祖先自南湖大山遷徙而下，因而以社名為地名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [406, 407, 408, 409]}, {"id": "side-宜蘭縣-2", "title": "宜蘭縣．南方澳至龜山島", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識宜蘭縣的幾個地方：南方澳、四城、二結、龜山島。」", "stops": [{"placeId": 410, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『南方澳』這個地方，是怎麼來的嗎？南方澳因位於蘇澳港南側、由沙頸岬連接內埤海灘所形成的天然港澳而得名，是台灣三大近海漁港之一。", "南方澳地名由來相對單純，源自其相對於蘇澳港的地理位置：這處港灣地處蘇澳港南側，因海岸沙頸岬地形，將原本的沙洲與陸地連接成一處天然良港，先民依方位特徵，將此地稱為「南方澳」，以與北側的蘇澳港區作出區隔。日治時期起，日本政府積極建設南方澳漁港的基礎設施，", "加上鄰近黑潮暖流經過的優良漁場，使南方澳迅速發展成台灣重要的遠洋與近海漁業基地，與台灣其他知名漁港並列全台三大漁港之一。如今南方澳因南天宮媽祖廟、內埤海灘（情人灣）與豆腐岬等景觀，加上新鮮漁獲與海鮮餐飲，是宜蘭縣極具代表性的漁港觀光重鎮。"], "quiz": { 保。同治13年（1874年），", "閩浙總督沈葆楨奏准開闢台灣後山三條道路，光緒元年（1875年），羅大春率軍開闢北路（自宜蘭蘇澳至花蓮），道路貫通後，移民陸續在此建立新的聚落，因而正式得名「新城」，意指新建立的城鎮聚落。新城鄉因鄰近花蓮機場與太魯閣國家公園入口，加上七星潭風景區，是花蓮縣北側重要的交通門戶與觀光重鎮。"], "quiz": {"q": "關於「新城鄉」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["新城因泰雅族大魯宛社領域，清嘉慶年間吳全率眾墾荒屢遭太魯閣族攻擊而築城防禦，加上光緒元年開路後移民建立新聚落而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！新城因泰雅族大魯宛社領域，清嘉慶年間吳全率眾墾荒屢遭太魯閣族攻擊而築城防禦，加上光緒元年開路後移民建立新聚落而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 419, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『壽豐鄉』這個地方，是怎麼來的嗎？壽豐舊稱里鬧，泰雅語意指叢林，因鄰近鯉魚潭南端而稱鯉魚尾，光復後取「壽」村與日治「豐」田村二字合稱壽豐。", "壽豐鄉舊稱「里鬧」，源自泰雅族語，意指「叢林」，反映這一帶早期是林木蓊鬱、後來成為阿美族狩獵活動範圍的地帶。光緒元年（1875年），羅大春開闢北路行經奇萊山一帶時，發現山北側有一座天然湖泊，潭中棲息大量鯉魚，因而得名「鯉魚潭」，潭南方一座小山則稱「鯉魚山」，", "這處聚落恰好位於鯉魚山的南端末尾，因而又稱「鯉魚尾」。台灣光復後，政府將鄰近的「壽」村，與日治時期日本移民村「豐」田村的地名各取一字，合稱「壽豐鄉」，沿用至今。壽豐鄉因鯉魚潭風景區、東華大學與花蓮觀光糖廠聞名，是花東縱谷北段重要的休閒與教育重鎮。"], "quiz": {"q": "關於「壽豐鄉」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "壽豐舊稱里鬧，泰雅語意指叢林，因鄰近鯉魚潭南端而稱鯉魚尾，光復後取「壽」村與日治「豐」田村二字合稱壽豐。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！壽豐舊稱里鬧，泰雅語意指叢林，因鄰近鯉魚潭南端而稱鯉魚尾，光復後取「壽」村與日治「豐」田村二字合稱壽豐。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [415, 416, 417, 419]}, {"id": "main-花蓮縣-2", "title": "花蓮縣．光復鄉至富里鄉", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識花蓮縣的幾個地方：光復鄉、豐濱鄉、瑞穗鄉、富里鄉。」", "stops": [{"placeId": 420, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『光復鄉』這個地方，是怎麼來的嗎？光復為阿美族馬太鞍社領域，1937年日人改稱上大和，因「大和」為日本古國名與民族名，光復後取「台灣光復」之意改稱光復。", "光復鄉這一帶原是阿美族「馬太鞍社」的傳統聚落領域，「馬太鞍」在阿美族語中意指一種可食用的樹豆。1937年（昭和12年），日本殖民政府將這一帶改稱「上大和」。台灣光復後，政府有感於「大和」二字既是日本古代國名，也是日本大和民族的自稱，帶有強烈的殖民統治象徵意涵，遂將地名改為「光復」，", "直接紀念台灣脫離日本殖民統治、重歸中華民國版圖的歷史時刻，這與台灣許多在戰後直接以「光復」為名的路名、學校名稱，屬於同一波政治意涵鮮明的命名浪潮。光復鄉因馬太鞍濕地生態與大農大富平地森林園區聞名，是花東縱谷重要的阿美族文化與生態觀光重鎮。"], "quiz": {"q": "關於「光復鄉」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "光復為阿美族馬太鞍社領域 eneEmoji": "🍵", "pages": ["你知道『七星潭』這個地方，是怎麼來的嗎？七星潭原指花蓮新城鄉境內七個小湖泊，因狀似北斗七星排列而得名，後因湖泊被機場與農地填平，地名轉移指稱今日的新月形海灣。", "七星潭地名由來，經歷了一段地理位置上的轉移：這個地名最初是指花蓮新城鄉境內一連串大小不一的天然湧泉湖泊群，因湖泊分布的位置排列狀似天空中的北斗七星（或說七星連珠），因而得名「七星潭」。然而，日治時期因應軍事需求，在原本七星潭湖泊群所在地興建花蓮港南濱機場（今花蓮機場前身），加上周邊農地開發填土，", "這些天然湖泊逐漸消失殆盡。有趣的是，「七星潭」這個地名並未隨著湖泊的消失而被廢棄，反而轉移套用到鄰近一處呈新月形的美麗海灣之上，也就是今日遊客熟知、擁有滿佈礫石海岸與清澈海水的「七星潭風景區」，讓這個原本描述內陸湖泊群的地名，意外在花蓮的地理版圖上「搬家」，成為濱海景觀的代稱。"], "quiz": {"q": "關於「七星潭」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "七星潭原指花蓮新城鄉境內七個小湖泊，因狀似北斗七星排列而得名，後因湖泊被機場與農地填平，地名轉移指稱今日的新月形海灣。"], "correct": 3, "rightFb": "沒錯！七星潭原指花蓮新城鄉境內七個小湖泊，因狀似北斗七星排列而得名，後因湖泊被機場與農地填平，地名轉移指稱今日的新月形海灣。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 429, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『志學』這個地方，是怎麼來的嗎？志學舊稱知伯，源自阿美族語音譯，因鄰近東華大學設站，取「立志向學」之意，將車站與地名改稱志學。", "志學舊稱「知伯」，是阿美族語彙的音譯，確切原意已不易考證，這一帶清代及日治時期原是花東縱谷中一處相對僻靜的小聚落。隨著台灣鐵路管理局在此設站，加上鄰近的國立東華大學於1994年創校，因大批師生往來，車站周邊逐漸發展成具有濃厚學術氛圍的生活圈，地方便取「立志向學」的美好期許，", "將原本的「知伯」改稱發音相近、寓意深遠的「志學」，車站也隨之更名為志學車站，這種因鄰近學校而賦予地名求學勵志意涵的命名方式，讓志學成為花蓮縣境內獨具文教色彩的地名案例。志學車站因鄰近東華大學，是花蓮縣壽豐鄉重要的學生通勤與生活機能聚落。"], "quiz": {"q": "關於「志學」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "志學舊稱知伯，源自阿美族語音譯，因鄰近東華大學設站，取「立志向學」之意，將車站與地名改稱志學。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！志學舊稱知伯，源自阿美族語音譯，因鄰近東華大學設站，取「立志向學」之意，將車站與地名改稱志學。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [426, 427, 428, 429]}, {"id": "side-花蓮縣-2", "title": "花蓮縣．平和至天祥", "kind": "side", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識花蓮縣的幾個地方：平和、三民、大富、天祥。」", "stops": [{"placeId": 430, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『平和』這個地方，是怎麼來的嗎？平和因1937年日治移民政策而設立的農業移民聚落，戰後取「和平安樂」之意，將地名定為平和，沿用至今。", "平和地名由來，反映了戰後台灣地名去日本化與追求祥和願景的普遍趨勢：這一帶在日治時期是官方規劃的農業移民聚落之一，原本沿用帶有日本色彩的舊稱。台灣光復後，政府考量去除殖民統治色彩、並寄託地方社會和睦安樂的期許，將這處聚落正式命名為「平和」，取「和平安樂」的吉祥寓意，", "這與吉安鄉（原吉野，取「吉祥安定」）、光復鄉（原大和，取「台灣光復」）等地 "🌾", "pages": ["你知道『天祥』這個地方，是怎麼來的嗎？天祥舊稱塔比多，為太魯閣族語，意指盛產一種植物之地，1960年為紀念南宋民族英雄文天祥而改稱天祥，沿用至今。", "天祥舊稱「塔比多」，源自太魯閣族語，一般認為與當地曾經盛產某種植物有關，是太魯閣峽谷深處一處太魯閣族的傳統活動範圍。民國49年（1960年），中部橫貫公路（含支線）陸續通車，政府為紀念南宋末年堅貞不屈、以死報國的民族英雄文天祥，將這處位於中橫公路要衝、風景秀麗的山中台地，正式命名為「天祥」，", "這種以歷史忠烈人物姓名直接命名風景區的方式，與谷關（原明治溫泉，中橫通車後改為描述地形的谷關）雖同屬中橫公路沿線地名，命名邏輯卻截然不同。天祥因地處立霧溪上游河階台地，四周高山環繞、風景清幽，加上文天祥雕像與祥德寺等地標，是太魯閣國家公園深處重要的中繼景點與遊憩據點。"], "quiz": {"q": "關於「天祥」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "天祥舊稱塔比多，為太魯閣族語，意指盛產一種植物之地，1960年為紀念南宋民族英雄文天祥而改稱天祥，沿用至今。"], "correct": 3, "rightFb": "沒錯！天祥舊稱塔比多，為太魯閣族語，意指盛產一種植物之地，1960年為紀念南宋民族英雄文天祥而改稱天祥，沿用至今。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [430, 431, 432, 433]}, {"id": "side-花蓮縣-3", "title": "花蓮縣．奇萊至砂卡礑", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識花蓮縣的幾個地方：奇萊、薄薄社、清水斷崖、砂卡礑。」", "stops": [{"placeId": 513, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『奇萊』這個地方，是怎麼來的嗎？花蓮舊稱之一，源自阿美族語譯音，泛指花蓮溪出海口一帶的平原地帶，今奇萊山之名亦源於此。", "「奇萊」一詞的由來，其實源自一場語言誤會：花蓮平原原是阿美族支系「撒奇萊雅族」（Sakiraya）的世居之地，這個族名在該族語言中意指「真正的人」，是族人對自身的驕傲自稱。清代及日治初期外來的漢人與日本人初次接觸這支原住民族群時，誤將其族名當作地名使用，並依諧音簡化為「奇萊」，這片族人世代生活的平原因而被稱為「奇萊平原」，範圍大致涵蓋今日新城鄉、花蓮市與吉安鄉一帶；中央山脈北段的奇萊山，", "也是因鄰近這片平原而得名，而非山名在先、平原地名在後。1878年，加禮宛事件與達固湖灣事件後，撒奇萊雅族遭清軍重創，被迫隱身於阿美族部落之中長達百餘年，直到2007年才獲得政府正式承認為台灣第13個原住民族，「奇萊」這個因誤會而生的地名，如今反而成為追溯撒奇萊雅族身分認同與歷史記憶的重要線索。"], "quiz": {"q": "關於「奇萊」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「奇萊」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "花蓮舊稱之一，源自阿美族語譯音，泛指花蓮溪出海口一帶的平原地帶，今奇萊山之名亦源於此。"], "correct": 3, "rightFb": "沒錯！花蓮舊稱之一，源自阿美族語譯音，泛指花蓮溪出海口一帶的平原地帶，今奇萊山之名亦源於此。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 514, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『薄薄社』這個地方，是怎麼來的嗎？吉安鄉舊稱，因當地為阿美族「薄薄社」（Cikasuan）聚落所在地而得名。", "薄薄社（阿美族語稱Cikasuan）是花蓮平原阿美族最古老、規模也最大的部落之一，與吉安鄉主要舊稱「七腳川社」同屬阿美族在花蓮平原上的重要聚落，兩者雖同處吉安鄉境內，卻是各自獨立發展的部落單位：七腳川社後來因日治時期「七腳川事件」（阿美族抗日行動）遭日方鎮壓、社域被劃為官營移民村「吉野村」，族人被迫遷散；薄薄社則相對持續保有部落聚落型態，", "維繫阿美族傳統祭儀與社會組織至今。薄薄部落至今仍保留完整的阿美族年齡階級制度與豐年祭（Ilisin）文化，是花蓮縣阿美族傳統文化保存相對完整的部落之一，也讓吉安鄉境內同時並存著「吉野／吉安」（日治移民村系統）與「薄薄」（阿美族傳統部落系統）兩套不同淵源的地名記憶，共同勾勒出這片土地多元族群交疊的歷史層次。"], "quiz": {"q": "關於「薄薄社」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因清代此地盛產某種作物，官府設「薄薄社」市集而得名", "吉安鄉舊稱，因當地為阿美族「薄薄社」（Cikasuan）聚落所在地而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！吉安鄉舊稱，因當地為阿美族「薄薄社」（Cikasuan）聚落所在地而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 550, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『清水斷崖』這個地方，是怎麼來的嗎？清水斷崖因大部分岩層由潔白清澈的大理石構成、峭壁在陽光照射下純白耀眼而得名，是蘇花公路沿線太魯閣國家公園最著名的斷崖絕景。", "清水斷崖地處太魯閣國家公園東北側、蘇花公路沿線，是清水山東側一段長達約21公里、平均坡度超過80度的沿海峭壁，因構成峭壁的岩層大部分是質地潔白清澈的大理石與片麻岩，在陽光照射下呈現耀眼的純白色澤，加上山勢近乎垂直插入蔚藍的太平洋，海天山色相互輝映，先民依此清澈潔白的視覺印象，將此地命名為「清水斷崖」。清水斷崖是蘇花公路最驚險也最壯麗的路段，", "公路緊貼峭壁邊緣蜿蜒而築，一側是萬丈懸崖、一側是浩瀚太平洋，自古便有「台灣八景」之一的美譽，清代文獻中則另稱「大魯閣斷崖」；1874年台灣總兵吳光亮率領飛虎軍開闢蘇花公路前身「北路」時，這段斷崖工程之艱鉅，堪稱蘇花公路開闢史上最險峻的一段，如今仍是台灣東部海岸線最具代表性、也最受遊客讚嘆的地質景觀之一。"], "quiz": {"q": "關於「清水斷崖」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["清水斷崖因大部分岩層由潔白清澈的大理石構成、峭壁在陽光照射下純白耀眼而得名，是蘇花公路沿線太魯閣國家公園最著名的斷崖絕景。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「清水斷崖」市集而得名"], "correct": 0, "rightFb": "沒錯！清水斷崖因大部分岩層由潔白清澈的大理石構成、峭壁在陽光照射下純白耀眼而得名，是蘇花公路沿線太魯閣國家公園最著名的斷崖絕景。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 551, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『砂卡礑』這個地方，是怎麼來的嗎？砂卡礑源自太魯閣族語「Skadang」，意指「臼齒」，因族人早年在此拾獲一顆狀似臼齒的巨大獸骨而得名，是太魯閣國家公園著名的親水峽谷步道。", "砂卡礑地名源自太魯閣族語「Skadang」，意思是「臼齒」：相傳早年一支太魯閣族先民狩獵隊伍行經這處溪谷時，意外拾獲一顆體積碩大、外形神似人類或大型動物臼齒的獸骨化石，族人依此奇特的發現，將這條溪流與周邊部落命名為「Skadang」，漢人依音譯記為「砂卡礑」。日治時期，這條溪流一度因發電廠興建而稱「大山溪」，但族人與在地居民多年來仍慣稱「砂卡礑溪」，", "如今官方也已恢復使用這個承載族語記憶的舊名。砂卡礑溪切穿大理石岩層，溪水因富含礦物質而呈現獨特的藍綠色澤，清澈見底、終年不絕，沿溪開闢的砂卡礑步道（又稱神秘谷步道）行走於峭壁與溪流之間，是太魯閣國家公園中最受歡迎的親水生態步道之一，讓這個源自臼齒發現傳說的地名，成為深受遊客喜愛的峽谷勝景代名詞。"], "quiz": {"q": "關於「砂卡礑」（花蓮縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "砂卡礑 38, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『鹿野鄉』這個地方，是怎麼來的嗎？鹿野因清光緒年間官府招漢人與平埔族入墾，先民搭建捕鹿用的鹿寮而得名，日治時期招募日本新潟移民開墾茶園，簡化為鹿野。", "鹿野鄉舊稱「鹿寮」，清光緒年間，清政府招募漢人與平埔族人前來這片區域開墾，當時共有約五十戶平埔族人在此落腳，因這一帶原是野生梅花鹿群聚棲息的地帶，先民狩獵之餘，習慣搭建簡易寮舍作為捕鹿與處理獸皮的據點，久而久之，這片區域便被稱為「鹿寮」。日治時期，", "台東製糖株式會社在此招募日本新潟縣移民前來墾殖茶園與甘蔗田，1920年，地方行政改制時，將「鹿寮」簡化雅化為「鹿野」，沿用至今。鹿野鄉因鹿野高台的熱氣球嘉年華聞名全台，加上鹿野紅烏龍茶產業，是台東縣花東縱谷北段重要的休閒觀光與茶葉產地。"], "quiz": {"q": "關於「鹿野鄉」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因清代此地盛產某種作物，官府設「鹿野鄉」市集而得名", "鹿野因清光緒年間官府招漢人與平埔族入墾，先民搭建捕鹿用的鹿寮而得名，日治時期招募日本新潟移民開墾茶園，簡化為鹿野。"], "correct": 3, "rightFb": "沒錯！鹿野因清光緒年間官府招漢人與平埔族入墾，先民搭建捕鹿用的鹿寮而得名，日治時期招募日本新潟移民開墾茶園，簡化為鹿野。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 439, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『池上鄉』這個地方，是怎麼來的嗎？池上因位於大坡池上方而得名，另一說清同治年間先民在此開墾田園稱新開園，是池上鄉較早的舊稱。", "池上鄉地名由來主要與境內一座天然湖泊「大坡池」有關：這片區域地處大坡池的上方位置，先民依此地理特徵，將此地稱為「池上」，意指位於池塘上方的聚落，1920年正式定名。池上鄉另有一個更早的舊稱「新開園」，據傳清同治年間，已有漢人在此新闢田園墾殖，因而得名，反映這一帶開發的時間脈絡。池上鄉地處花東縱谷精華地帶，", "因濁水溪與卑南大溪沖積形成的肥沃土壤，加上純淨無汙染的水源，孕育出享譽全台的「池上米」，米質Q彈飽滿、粒粒分明，成為台灣優質稻米的代名詞；境內伯朗大道、金城武樹等田園景觀，更讓池上從單純的農業聚落，發展成結合稻田美景與人文氣息的知名觀光勝地。"], "quiz": {"q": "關於「池上鄉」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "池上因位於大坡池上方而得名，另一說清同治年間先民在此開墾田園稱新開園，是池上鄉較早的舊稱。", "因清代此地盛產某種作物，官府設「池上鄉」市集而得名", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！池上因位於大坡池上方而得名，另一說清同治年間先民在此開墾田園稱新開園，是池上鄉較早的舊稱。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [435, 436, 438, 439]}, {"id": "main-台東縣-2", "title": "台東縣．東河鄉至大武鄉", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識台東縣的幾個地方：東河鄉、長濱鄉、太麻里鄉、大武鄉。」", "stops": [{"placeId": 440, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『東河鄉』這個地方，是怎麼來的嗎？東河舊稱馬武窟，源自阿美族語「mabukuru」，意指撒網捕魚，1937年取大馬武窟頭二字改稱大馬，光復後改稱東河。", "東河鄉舊稱「馬武窟」，源自阿美族語「mabukuru」，意思是「撒網捕魚」，反映這一帶阿美族「大馬武窟社」（另譯貓武骨社、武突社）族人依溪河捕魚維生的傳統生活方式，這條流貫此地、注入太平洋的溪流也因而得名「馬武窟溪」。1937年（昭和12年），日本殖民政府推行地方行政簡化，", " "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『三仙台』這個地方，是怎麼來的嗎？三仙台原是海岸阿美族比西里岸部落領域，因島上三塊巨石相傳為八仙過海時李鐵拐、何仙姑、呂洞賓歇腳處而得名。", "三仙台地名由來，源自一則八仙過海的民間傳說：這座位於成功鎮外海、由海蝕地形發育而成的離岸小島，島上矗立著三塊巨大的礁岩，相傳八仙過海途經此地時，八仙之中的李鐵拐、何仙姑、呂洞賓三位仙人曾在此歇腳停留，因而得名「三仙台」，這種將自然奇石地景附會為神仙傳說的命名方式，在台灣各地沿海地區相當常見。三仙台原是海岸阿美族「比西里岸部落」（Pisirian，", "阿美族語意指「放羊的地方」，因部落附近小山曾有大量山羊棲息而得名）的傳統活動領域，1987年興建的八拱跨海步橋，成為連接台灣本島與三仙台島嶼的重要地標。三仙台因獨特的海蝕地形與跨海步橋景觀，是台東縣東海岸最具代表性的地標之一。"], "quiz": {"q": "關於「三仙台」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "三仙台原是海岸阿美族比西里岸部落領域，因島上三塊巨石相傳為八仙過海時李鐵拐、何仙姑、呂洞賓歇腳處而得名。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因清代此地盛產某種作物，官府設「三仙台」市集而得名"], "correct": 1, "rightFb": "沒錯！三仙台原是海岸阿美族比西里岸部落領域，因島上三塊巨石相傳為八仙過海時李鐵拐、何仙姑、呂洞賓歇腳處而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [447, 448, 449, 450]}, {"id": "side-台東縣-2", "title": "台東縣．知本至初鹿", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識台東縣的幾個地方：知本、都蘭、多良、初鹿。」", "stops": [{"placeId": 451, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『知本』這個地方，是怎麼來的嗎？知本源自卑南族卡大地布部落（Katratripulr）語尾音節音譯，「卡大地布」意指團結在一起，是卑南族傳統四大部落之一。", "知本地名源自卑南族「卡大地布部落」（Katratripulr，又稱卡地布、Katripulr）的部落名稱，這個名稱在卑南族語中意指「團結在一起」或「合併為一」，反映該部落由不同氏族凝聚整合而成的歷史淵源，是卑南族傳統「八社十部落」中的四大核心部落之一，舊稱「卡砦卡蘭部落」（Kazekalan）。日治時代與戰後官方，從部落名「Katratripulr」中擷取中段音節「tripulr」，", "以閩南語漢字音譯轉寫為「知本」（Ti-pún），此後這個簡化的漢字地名，廣泛套用於知本車站、知本溫泉等周邊事物的命名。明治37年（1904年），族人從知本溫泉北方山麓遷移至知本溪左岸河階，形成今日卡大地布部落所在地；卡大地布部落至今仍保存猴祭、大獵祭等完整的卑南族傳統祭儀文化，加上知本溫泉的觀光開發，讓知本兼具原住民文化傳承與溫泉觀光的雙重面貌。"], "quiz": {"q": "關於「知本」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "知本源自卑南族卡大地布部落（Katratripulr）語尾音節音譯，「卡大地布」意指團結在一起，是卑南族傳統四大部落之一。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 1, "rightFb": "沒錯！知本源自卑南族卡大地布部落（Katratripulr）語尾音節音譯，「卡大地布」意指團結在一起，是卑南族傳統四大部落之一。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 452, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『都蘭』這個地方，是怎麼來的嗎？都蘭源自阿美族語「Idulan」，意指用石頭堆砌的籬笆，因當地都蘭山下部落以石牆圍籬防禦而得名，都蘭山更是卑南族信仰中的聖山。", "都蘭地名源自阿美族語「Idulan」，意指以石塊堆砌而成的圍籬或石牆，反映當地阿美族部落早期為防禦外敵侵擾，習慣在聚落周圍以石材堆砌籬笆的傳統建築方式，這種因防禦石牆而得名地方的邏輯，與台北木柵（木造柵欄）、桃園龍潭三坑仔等地名，同屬先民依防禦工事命名聚落的常見案例。都蘭山是這一帶最顯著的地標，海拔約1190公尺，", "不僅是阿美族心目中祖靈居住的聖山，在卑南族的信仰體系中，都蘭山同樣被尊為守護台東平原的聖山，兩個不同族群共同尊崇同一座山峰的現象，展現了東海岸原住民族信仰文化的交融。都蘭因保留完整的阿美族部落文化，加上都蘭糖廠藝術聚落與衝浪勝地金樽，是台東縣東海岸重要的原住民文化與藝術觀光重鎮。"], "quiz": {"q": "關於「都蘭」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "都蘭源自阿美族語「Idulan」，意指用石頭堆砌的籬笆，因當地都蘭山下部落以石牆圍籬防禦而得名，都蘭山更是卑南族信仰中的聖山。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 1, "rightFb": "沒錯！都蘭源自阿美族語「Idulan」，意指用石頭堆砌的籬笆，因當地都蘭山下部落以石牆圍籬防禦而得名，都蘭山更是卑南族信仰中的聖山。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 453, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『多良』這個地方，是怎麼來的嗎？多良舊稱多多良，因排灣族部落多良社而得名，境內多良車站因面向太平洋的絕美景色，享有「全台最美車站」的美稱。", "多良地名源自排灣族「多良社」的部落名稱，是太麻里鄉境內排灣族傳統聚落之一，這一帶清代與日治時期原是排灣族「泰武勇」（太麻里總社頭目）勢力範圍內的部落所在地。日治時期為配合台東線鐵路（今南迴線）的興建，在此設置「多多良驛」，戰後簡化為「多良車站」。這座車站因坐落於山坡台地之上，", "月台正對著蔚藍的太平洋海岸線，居高臨下、視野遼闊，被譽為「全台最美的車站」，加上鐵路截彎取直後車站雖已停用，卻因絕美景致持續吸引大批遊客與攝影愛好者前來朝聖，讓這個源自排灣族部落名稱的地名，意外因鐵道美景而聲名遠播，成為台東縣南迴線最具代表性的觀光地標之一。"], "quiz": {"q": "關於「多良」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「多良」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "多良舊稱多多良，因排灣族部落多良社而得名，境內多良車站因面向太平洋的絕美景色，享有「全台最美車站」的美稱。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！多良舊稱多多良，因排灣族部落多良社而得名，境內多良車站因面向太平洋的絕美景色，享有「全台最美車站」的美稱。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 454, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『初鹿』這個地方，是怎麼來的嗎？初鹿源自卑南族「Mulivelivek」，是卑南族八社之一，漢人依當地早期梅花鹿群聚出沒的生態特徵，將地名譯寫為初鹿。", "初鹿地名源自卑南族「Mulivelivek」的部落名稱，是卑南族傳統「八社十部落」體系中的重要一員，該部落與同樣源自初鹿、於1980年代分開獨立舉行祭儀的「龍過脈」部落，共同構成這一帶卑南族的聚落網絡。漢人依原住民部落名音譯之餘，考量這一帶山區早期是梅花鹿群聚棲息、出沒頻繁的地帶，", "便將地名意譯結合為「初鹿」，兼顧音譯與地方生態特徵的雙重意涵。初鹿地區因擁有全台面積數一數二的初鹿牧場，加上卑南族傳統的猴祭、大獵祭等祭儀文化保存完整，是台東縣卑南鄉境內重要的酪農休閒與原住民文化觀光聚落，初鹿鮮乳更是台東知名的農特產品牌。"], "quiz": {"q": "關於「初鹿」（台東縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「初鹿」市集而得名", "初鹿源自卑南族「Muliveliv : "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 460, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『望安鄉』這個地方，是怎麼來的嗎？望安舊稱八罩，因四周海域被將軍澳嶼、東吉嶼等八個島嶼環繞罩住而得名，另一說明鄭成功東渡遙望八罩島，冀望能平安抵達而改稱望安。", "望安鄉舊稱「八罩」（另有八罩嶼、八罩山、挽門嶼等寫法），這個地名由來眾說紛紜：一說認為「罩」字意指「兜」（湊合之意），指望安島周圍恰好被將軍澳嶼、東吉嶼、西吉嶼、東嶼坪嶼、西嶼坪嶼、七美嶼、花嶼及虎井嶼等八個島嶼環繞罩住，因而得名「八罩」，這是學界較採信的說法；另一則流傳更廣的民間傳說則指出，明永曆15年（1661年），", "鄭成功率軍由金門東渡台灣，途經七美嶼，遙望八罩群島時，內心冀望船隊能夠平安順利抵達，因而將此地命名為「望安」。望安鄉由八罩群島組成，是台灣省轄最西的鄉鎮之一，境內花宅聚落（中社村）保存完整的閩南傳統建築群，已列入世界文化遺址潛力點，加上綠蠵龜產卵棲地，是澎湖縣重要的離島人文與生態保育鄉鎮。"], "quiz": {"q": "關於「望安鄉」（澎湖縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "望安舊稱八罩，因四周海域被將軍澳嶼、東吉嶼等八個島嶼環繞罩住而得名，另一說明鄭成功東渡遙望八罩島，冀望能平安抵達而改稱望安。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！望安舊稱八罩，因四周海域被將軍澳嶼、東吉嶼等八個島嶼環繞罩住而得名，另一說明鄭成功東渡遙望八罩島，冀望能平安抵達而改稱望安。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [457, 458, 459, 460]}, {"id": "main-澎湖縣-2", "title": "澎湖縣．七美鄉", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識澎湖縣的幾個地方：七美鄉。」", "stops": [{"placeId": 461, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『七美鄉』這個地方，是怎麼來的嗎？七美原稱大嶼，因位居澎湖群島最南端且面積廣大而得名，1949年因紀念七位女子為保貞節投井殉難、感念其貞烈事蹟改稱七美。", "七美鄉舊稱「大嶼」（另有南天島、南嶼等稱呼），因這座島嶼位居澎湖群島最南端、且面積在周邊離島中相對廣大，因而得名。關於後來改稱「七美」的由來，流傳著一則淒美的傳說：相傳明朝時期，一群海盜登陸島上燒殺擄掠，七名女子為了保全貞節、不甘受辱，在走投無路之下，集體投井自盡，鄉民為感念這七位女子的貞烈事蹟，", "將水井填土立碑紀念，事後井旁竟奇蹟般長出七株枝葉茂盛的香楸樹，彷彿七位美人顯靈庇佑，民國38年（1949年），地方正式將「大嶼」改稱「七美嶼」，紀念這段感人的貞節故事。七美鄉因雙心石滬、七美人塚等景觀聞名，是澎湖群島最南端、也是最具傳奇色彩的離島鄉鎮之一。"], "quiz": {"q": "關於「七美鄉」（澎湖縣）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "七美原稱大嶼，因位居澎湖群島最南端且面積廣大而得名，1949年因紀念七位女子為保貞節投井殉難、感念其貞烈事蹟改稱七美。"], "correct": 3, "rightFb": "沒錯！七美原稱大嶼，因位居澎湖群島最南端且面積廣大而得名，1949年因紀念七位女子為保貞節投井殉難、感念其貞烈事蹟改稱七美。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [461]}], "sideQuests": [{"id": "side-澎湖縣-1", "title": "澎湖縣．吉貝嶼至虎井嶼", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識澎湖縣的幾個地方：吉貝嶼、二崁、通樑古榕、虎井嶼。」", "stops": [{"placeId": 525, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『吉貝嶼』這個地方，是怎麼來的嗎？吉貝嶼因島嶼形狀宛如一枚螺貝漂浮海面，先民稱嘉貝嶼，後以諧音雅化為吉貝，是澎湖北海最大島嶼、石滬密度最高之地。", "吉貝嶼舊稱「嘉貝嶼」，因整座島嶼的地形輪廓，從高處俯瞰宛如一枚螺貝漂浮於海面之上，先民依此形似特徵為地方命名，其後以台語諧音雅化，將「嘉貝」改為更具吉祥意涵的「吉貝」，沿用至今。吉貝嶼是澎湖群島北海海域中最大的有人島，島嶼地勢東高西低，西南方由西崁山向外延伸出一道長達七百餘公尺的沙嘴地形，", "沖積而成的金黃色沙灘是遊客造訪的重點，周邊廣大的潮間帶更聚集了約八十餘座傳統石滬，是全澎湖石滬分布最密集的地方，堪稱先民智慧捕魚工法的活教材。清雍正5年（1727年），吉貝從鎮海澳分設獨立為「吉貝澳」，如今則是澎湖縣白沙鄉轄下的離島社區，因水上活動盛行，是澎湖夏季觀光最熱門的離島之一。"], "quiz": {"q": "關於「吉貝嶼」（澎湖縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因清代此地盛產某種作物，官府設「吉貝嶼」市集而得名", "吉貝嶼因島嶼形狀宛如一枚螺貝漂浮海面，先民稱嘉貝嶼，後以諧音雅化為吉貝，是澎湖北海最大島嶼、石滬密度最高之地。"], "correct": 3, "rightFb": "沒錯！吉貝嶼因島嶼形狀宛如一枚螺貝漂浮海面，先民稱嘉貝嶼，後以諧音雅化為吉貝，是澎湖北海最大島嶼、石滬密度最高之地。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 526, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『二崁』這個地方，是怎麼來的嗎？二崁因聚落座落於東西兩處台地之間而得名「崁」（意指高地），是明末金門陳姓移民所建立的單姓聚落，為台灣第一個傳統聚落保存區。", "二崁地名中的「崁」字，在台語中意指山丘或高地，二崁聚落因坐落於東、西兩處台地之間而得名。相傳明末清初，金門下坑（今金湖鎮夏興）陳姓先祖陳延益渡海遷居澎湖大池角，因當地可耕地已被先期移民占據，才輾轉遷居到龜山腳下的海濱，傳至第三代後，子孫日益增加分為四房，才陸續遷移至二崁定居，逐漸發展成清代道光年間成形的單姓血緣聚落，甲午戰爭後因生計艱難，", "青壯人口大量外流至台灣本島謀生。聚落內保存完整的閩南式古厝，以硓𥑮石與玄武岩為建材，最具代表性的陳家古厝，是兩位陳姓兄弟經商致富返鄉興建的三落大厝。民國90年（2001年），二崁經內政部指定為全台第一個「傳統聚落保存區」，如今活化為常民生活館、褒歌館等社區博物館群，是澎湖保存最完整的傳統聚落之一。"], "quiz": {"q": "關於「二崁」（澎湖縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "二崁因聚落座落於東西兩處台地之間而得名「崁」（意指高地），是明末金門陳姓移民所建立的單姓聚落，為台灣第一個傳統聚落保存區。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！二崁因聚落座落於東西兩處台地之間而得名「崁」（意指高地），是明末金門陳姓移民所建立的單姓聚落，為台灣第一個傳統聚落保存區。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 527, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『通樑古榕』這個地方，是怎麼來的嗎？通樑古榕相傳三百多年前一艘商船在吼門水道遇難，僅存一株榕樹苗漂流上岸，村民拾獲種植於保安宮前，如今已長成枝葉茂密的巨型老榕。", "通樑古榕的由來，源自一則海難漂流的傳說：相傳約三百多年前，一艘商船航經澎湖白沙鄉通樑村外海的「吼門水道」（因水流湍急、聲如虎吼而得名）時不幸觸礁沉沒，船貨盡失，唯獨一株小小的榕樹苗漂流上岸，被當地村民拾獲後，栽種於保安宮廟埕之前。這株榕樹歷經三百餘年的歲月滋養，主幹早已分化出上百條氣根盤根錯節，", "枝葉開展覆蓋面積廣達六百多平方公尺，形成一片枝繁葉茂的天然綠蔭，是澎湖跨海大橋通車後遊客北環必訪的知名地標。通樑古榕不僅是澎湖現存樹齡最老、樹冠最大的老榕樹，村民更在樹蔭下設置石桌石椅供人乘涼歇息，讓這株因海難奇蹟漂流而來的樹苗，成為通樑村最具代表性的守護象徵與觀光名片。"], "quiz": {"q": "關於「通樑古榕」（澎湖縣）這個地名，下列何者才是真正的由來？", "opts": ["通樑古榕相傳三百多年前一艘商船在吼門水道遇難，僅存一株榕樹苗漂流上岸，村民拾獲種植於保安宮前，如今已長成枝葉茂密的巨型老榕。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！通樑古榕相傳三百多年前一艘商船在吼門水道遇難，僅存一株榕樹苗漂流上岸，村民拾獲種植於保安宮前，如今已長成枝葉茂密的巨型老榕。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 528, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『虎井嶼』這個地方，是怎麼來的嗎？虎井嶼舊稱船篷嶼、檯嶼，因島嶼地形中央裂開一道港灣、遠望形似猛虎而得名，是北回歸線穿越的澎湖第七大島。", "虎井嶼舊稱「船篷嶼」或「檯嶼」，清代《台灣府志》記載此島「形如猛虎，中裂一港，故名」，另一版本府志則描述其地形「形如虎臨深」，兩種記載雖用詞略有出入，但都指出「虎井」之名源自島嶼地形神似猛虎的視覺意象，島嶼中央又因地勢裂陷形成一道天然港灣，恰似虎口一般，因而得名「虎井」，「井」字或許正呼應了這處中裂如井的港灣地形。虎井嶼是澎湖群島面積排名第七大的島嶼，", "特殊的是，北回歸線恰好穿越這座小島，具有地理座標上的獨特意義。島上的觀音公園立有一尊高達四公尺的漢白玉觀音巨像，由旅港鄉親捐贈故鄉，因運送過程一度斷裂為三截，如今仍可見接合痕跡。虎井嶼因地形隱密、漁業資源豐富，是澎湖群島中保留較多傳統漁村風貌的離島之一。"], "quiz": {"q": "關於「虎井嶼」（澎湖縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "虎井嶼舊稱船篷嶼、檯嶼，因島嶼地形中央裂開一道港灣、遠望形似猛虎而得名，是北回歸線穿越的澎湖第七大島。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 2, "rightFb": "沒錯！虎井嶼舊稱船篷嶼、檯嶼，因島嶼地形中央裂開一道港灣、遠望形似猛虎而得名，是北回歸線穿越的澎湖第七大島。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [525, 526, 527, 528]}, {"id": "side-澎湖縣-2", "title": "澎湖縣．桶盤嶼至天后宮", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識澎湖縣的幾個地方：桶盤嶼、澎湖跨海大橋、雙心石滬、天后宮。」", "stops": [{"placeId": 541, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『桶盤嶼』這個地方，是怎麼來的嗎？桶盤嶼因整座島嶼由柱狀玄武岩環繞而成、從空中俯瞰輪廓渾圓平坦，狀似傳統木製圓形托盤（桶盤）而得名，是澎湖玄武岩地景保存最壯觀的島嶼。", "桶盤嶼地名由來，源自島嶼的整體地形樣貌：這座島嶼四周由排列緊密、紋理分明的柱狀玄武岩石柱環繞拱衛而成，從高空俯瞰，全島輪廓渾圓且地勢平坦，形狀神似早期閩南家庭常見的木製圓形托盤「桶盤」，因而得名。桶盤嶼是澎湖群島中玄武岩柱狀節理發育最壯觀、規模最大的島嶼，每根石柱高約20公尺、寬約1.5公尺，因風化氧化而呈現淺棕色調，頂部因長期風化形成球狀構造，", "加上柱體因差異侵蝕形成蜂窩狀孔洞（當地稱「貓公石」），景色壯麗猶如海上的黃石公園，已被劃入澎湖玄武岩自然保留區的範圍，並成立澎湖桶盤地質公園，中華民國護照內頁更選用桶盤嶼的玄武岩景觀作為背景圖案。如今桶盤嶼因人口外移，聚落規模日漸縮小，卻因獨特的地質景觀，成為澎湖生態旅遊與地質教育的  "pages": ["你知道『金沙鎮』這個地方，是怎麼來的嗎？金沙因清末民初在原金山港河海交會處發現金沙，遂將港名改為金沙港，注入此港的溪流也隨之改稱金沙溪，此為鎮名之由來。", "金沙鎮地名由來，源自清末民初一段與淘金相關的地方傳聞：這一帶原有一處港口稱為「金山港」，相傳當時曾在河海交會處發現含有金沙的沙土，居民因而將港口易名為「金沙港」，注入此港的溪流也隨之改稱「金沙溪」，這座市鎮便以「金沙」為名，沿用至今。金沙鎮地處金門島東北側，", "境內太武山脈南側與榮湖相互輝映，湖光山色景色宜人；瓊林、山后民俗文化村等聚落，保存完整的閩南傳統建築群與宗族聚落文化，加上馬山觀測所（金門本島距中國大陸最近之處）等戰地據點，讓金沙鎮兼具閩南傳統文化與兩岸對峙歷史記憶的雙重色彩。"], "quiz": {"q": "關於「金沙鎮」（金門縣）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "金沙因清末民初在原金山港河海交會處發現金沙，遂將港名改為金沙港，注入此港的溪流也隨之改稱金沙溪，此為鎮名之由來。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！金沙因清末民初在原金山港河海交會處發現金沙，遂將港名改為金沙港，注入此港的溪流也隨之改稱金沙溪，此為鎮名之由來。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 464, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『金湖鎮』這個地方，是怎麼來的嗎？金湖原稱滄湖，因鎮內成功、太湖一帶水塘遼闊而得名，民國43年因應行政需要改稱金湖鄉，46年再升格為金湖鎮。", "金湖鎮原稱「滄湖」，這個地名反映了當地水域遼闊的地形特徵，境內的「太湖」（人工蓄水湖）至今仍是金門重要的淡水資源與生態景觀。民國43年（1954年）7月，因應戰地政務時期行政管理的實際需要，地方政府將「滄湖鎮公所」改制為「金湖鄉公所」，取代原本的「滄湖」，「金湖」之名既呼應金門「金」字系列鄉鎮命名的整體邏輯，", "也保留了原有「湖」字的水域意象；民國46年（1957年）12月，金湖鄉進一步升格改制為「金湖鎮」，沿用至今。金湖鎮因保留完整的閩南建築聚落瓊林村，加上金門國家公園部分範圍與太湖畔的金門酒廠，是金門縣重要的傳統聚落與觀光重鎮。"], "quiz": {"q": "關於「金湖鎮」（金門縣）這個地名，下列何者才是真正的由來？", "opts": ["金湖原稱滄湖，因鎮內成功、太湖一帶水塘遼闊而得名，民國43年因應行政需要改稱金湖鄉，46年再升格為金湖鎮。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！金湖原稱滄湖，因鎮內成功、太湖一帶水塘遼闊而得名，民國43年因應行政需要改稱金湖鄉，46年再升格為金湖鎮。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 465, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『金寧鄉』這個地方，是怎麼來的嗎？金寧因1949年古寧頭大捷後成立古寧、金盤兩區公所，民國40年合併更名金寧區，取「古寧頭安寧」之意，42年正式定名金寧鄉。", "金寧鄉地名由來，同樣與古寧頭戰役的歷史直接相關：民國38年（1949年）古寧頭大捷後，地方成立「古寧」與「金盤」兩個區公所，分別管理古寧頭一帶及周邊區域事務。民國40年（1951年），兩個區公所合併，取「古寧頭」與「金門」的部分字義組合，更名為「金寧區」，寄託這片歷經戰火洗禮的土地能夠恢復平靜安寧的期許；民國42年（1953年）金門恢復縣治，", "本鄉合併古寧、安美、湖埔、榜林、盤山、后盤等六個行政區村，正式定名為「金寧鄉」，沿用至今。金寧鄉因古寧頭戰史館、慈湖三角堡等戰地史蹟聞名，是金門島上重要的歷史戰役紀念與生態賞鳥（慈湖候鳥保護區）重鎮。"], "quiz": {"q": "關於「金寧鄉」（金門縣）這個地名，下列何者才是真正的由來？", "opts": ["金寧因1949年古寧頭大捷後成立古寧、金盤兩區公所，民國40年合併更名金寧區，取「古寧頭安寧」之意，42年正式定名金寧鄉。", "因荷蘭東印度公司文獻直接音譯 落』這個地方，是怎麼來的嗎？山后聚落因旅日僑領王國珍、王敬祥父子出資興建十八棟閩南二進式大厝，分贈族人居住，俗稱「山后十八間大厝」而聞名。", "山后聚落位於金門金沙鎮山后村中堡，是清光緒26年（1900年）由旅居日本經商致富的僑領王國珍、王敬祥父子，斥資興建的宗族聚落。這對父子從大陸購入建材，耗費二十餘年光陰，陸續興建包含住宅、家祠與學堂（海珠堂）在內共十八棟房舍，全部依山面海而築、格局壯闊整齊，統一採用閩南傳統二進式建築樣式，落成後分贈給王氏族人居住，因而被金門人習稱「山后十八間大厝」，", "是金門僑鄉「落番」（下南洋經商）致富回饋鄉里的代表性建築群。民國68年（1979年），金門縣政府整修規劃後正式定名為「山后民俗文化村」，開闢成民俗文物、禮儀、喜慶、生產、武道、休閒等主題展館，加上一座古代官邸，集中展示金門地方民俗文物，成為認識金門傳統聚落建築藝術與僑鄉歷史的重要觀光據點。"], "quiz": {"q": "關於「山后聚落」（金門縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "山后聚落因旅日僑領王國珍、王敬祥父子出資興建十八棟閩南二進式大厝，分贈族人居住，俗稱「山后十八間大厝」而聞名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！山后聚落因旅日僑領王國珍、王敬祥父子出資興建十八棟閩南二進式大厝，分贈族人居住，俗稱「山后十八間大厝」而聞名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [467, 529, 530, 531]}, {"id": "side-金門縣-2", "title": "金門縣．水頭聚落至莒光樓", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識金門縣的幾個地方：水頭聚落、太武山、古寧頭、莒光樓。」", "stops": [{"placeId": 532, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『水頭聚落』這個地方，是怎麼來的嗎？水頭聚落因地處金門島西南海濱、村落附近有一處終年不涸的泉源而得名，因僑匯興盛而洋樓林立，得月樓是最具代表性的僑鄉地標。", "水頭聚落地名由來，一般認為與當地地理環境中曾有一處泉水源頭有關，「水頭」意指水源匯聚湧出之處，這座位於金門島西南海濱的聚落，因鄰近優良港灣，自古便是商賈往來與對外貿易的重要據點。清末民初，金門因土地貧脊，大量青壯人口渡海前往南洋（下南洋俗稱「落番」）經商謀生，水頭因地利之便，成為僑民匯款回鄉興建洋樓最集中的聚落之一，僑匯所建的西式洋樓與傳統閩南古厝交錯並存，", "形成獨特的僑鄉建築景觀，其中最富盛名的「得月樓」，是水頭富商黃輝煌僑匯興建、樓高突出的銃樓式建築，兼具防禦盜匪與彰顯家族財富的雙重功能，樓名取自「近水樓台先得月」的詩意，如今已成為金門僑鄉文化最具代表性的地標，水頭聚落也因此享有「有水頭厝，無山仔兜富」俗諺中所形容的富庶美名。"], "quiz": {"q": "關於「水頭聚落」（金門縣）這個地名，下列何者才是真正的由來？", "opts": ["水頭聚落因地處金門島西南海濱、村落附近有一處終年不涸的泉源而得名，因僑匯興盛而洋樓林立，得月樓是最具代表性的僑鄉地標。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 0, "rightFb": "沒錯！水頭聚落因地處金門島西南海濱、村落附近有一處終年不涸的泉源而得名，因僑匯興盛而洋樓林立，得月樓是最具代表性的僑鄉地標。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 542, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『太武山』這個地方，是怎麼來的嗎？太武山海拔253公尺，為金門最高峰，因山勢巍峨磅礡、氣度雄渾如武士盤坐而得名，山頂海印寺與毋忘在莒勒石，是金門重要的信仰與精神地標。", "太武山是金門島上最高的山峰，海拔僅253公尺，卻因四周地勢平坦而顯得格外巍峨聳立、氣 , "sideQuests": [{"id": "side-連江縣-1", "title": "連江縣．芹壁至津沙聚落", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識連江縣的幾個地方：芹壁、牛角聚落、鐵板聚落、津沙聚落。」", "stops": [{"placeId": 472, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『芹壁』這個地方，是怎麼來的嗎？芹壁位於北竿鄉，因村落前方海面有一狀似烏龜的「龜島」，芹壁閩東語發音近似「龜島」而得名，是馬祖保存最完整的閩東建築聚落。", "芹壁地名由來，源自當地海上一座地標島嶼：這處聚落面前的海域中，矗立著一座外形神似烏龜的小島，馬祖當地稱之為「龜島」，村落依傍這座島嶼而建，「芹壁」一詞的馬祖閩東語發音，據信與「龜島」的稱呼有著音轉關聯，村落也因而得名。芹壁村依山面海而建，以花崗石砌成的傳統閩東式建築層層疊疊，錯落有致，", "保存之完整堪稱馬祖聚落之最，因景致優美、建築特色鮮明，享有「亞洲地中海」的美譽，深受國內外建築、文化與藝術界人士青睞。隨著人口外移而一度荒廢的空屋群，經政府修繕活化後，重新改建為民宿與藝文空間，讓芹壁從傳統漁村聚落，轉型為馬祖北竿最具代表性的觀光地標與閩東建築文化保存重鎮。"], "quiz": {"q": "關於「芹壁」（連江縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "芹壁位於北竿鄉，因村落前方海面有一狀似烏龜的「龜島」，芹壁閩東語發音近似「龜島」而得名，是馬祖保存最完整的閩東建築聚落。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！芹壁位於北竿鄉，因村落前方海面有一狀似烏龜的「龜島」，芹壁閩東語發音近似「龜島」而得名，是馬祖保存最完整的閩東建築聚落。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 533, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『牛角聚落』這個地方，是怎麼來的嗎？牛角聚落位於南竿島東北方，因島形似犀牛、聚落恰好座落於形似犀牛角的岬角處而得名，現正式行政名稱為復興村。", "牛角聚落舊名「牛角」，現為連江縣南竿鄉復興村：相傳南竿島整體地形輪廓神似一頭犀牛，而這處聚落恰好座落於島嶼東北方、形貌如犀牛角般向海突出的岬角地帶，兩側山頭伸入海中的形貌，漁民從海上望去猶如一對牛角，因而得名。牛角聚落依循馬祖傳統「一澳一村」的聚落型態，沿著大澳灣澳而建，以花崗岩砌成的方正石屋層層錯落，蔚為特色。牛角在戰地政務時期一度發展成馬祖行政中樞與南竿商業中心，", "是當年第一大村，繁華程度獨領風騷，村內至今仍保留昔日「軍中樂園」特約茶室的歷史遺跡。如今牛角聚落雖已沒落沉寂，卻因保留較少觀光化痕跡、原汁原味的漁村風貌，加上每年秋季在此舉辦、感念臨水夫人庇佑孩童平安成長的地方青年成年禮，讓牛角持續散發獨特的馬祖在地文化魅力。"], "quiz": {"q": "關於「牛角聚落」（連江縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "牛角聚落位於南竿島東北方，因島形似犀牛、聚落恰好座落於形似犀牛角的岬角處而得名，現正式行政名稱為復興村。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！牛角聚落位於南竿島東北方，因島形似犀牛、聚落恰好座落於形似犀牛角的岬角處而得名，現正式行政名稱為復興村。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 534, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『鐵板聚落』這個地方，是怎麼來的嗎？鐵板聚落因海邊一塊沉積岩板在大退潮時露出水面、經陽光照射閃閃發光宛如鐵板而得名，現正式行政名稱為仁愛村。", "鐵板聚落舊名「鐵板」，現為連江縣南竿鄉仁愛村：這處三面環山、一面向海的漁村聚落，因海岸邊有一塊天然沉積岩板，每逢大退潮時便會完全露出水面，在陽光照射下閃閃發亮，遠望宛如一塊鋪展於海邊的鐵板，因而得名。鐵板村擁有可追溯至元代的重要歷史見證：村內大王宮保存一方石碑，碑文記載「林酉才喜捨中統鈔二十貫」，中統鈔是元世祖時期流通的貨幣，", "證明南竿島早在元代便已有漢人聚落形成，是馬祖地區有文字記載最早的人類活動證據之一。鐵板村曾因設有大型菜市場與連江縣政府機關而繁華一時，享有「南竿不夜城」的美稱，惜隨著縣府與市場遷移逐漸沉寂，如今僅存少數閩東式漁家老屋與百年歷史的鐵板天后宮，靜靜訴說著這段漁村曾經的輝煌歲月。"], "quiz": {"q": "關於「鐵板聚落」（連江縣）這個地名，下列何者才是真正的由來？", "opts": ["鐵板聚落因海邊一塊沉積岩板在大退潮時露出水面、經陽光照射閃閃發光宛如鐵板而得名，現正式行政名稱為仁愛村。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！鐵板聚落因海邊一塊沉積岩板在大退潮時露出水面、經陽光照射閃閃發光宛如鐵板而得名，現正式行政名稱為仁愛村。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 535, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『津沙聚落』這個地方，是怎麼來的嗎？津沙聚落因擁有一片如金砂般細緻的沙灘，原稱「金沙」，後改寫作「津沙」，是南竿最靠近中國大陸的第一大漁村聚落。", "津沙聚落位於南竿島西南方雲台山下的一處灣澳，因當地擁有一片沙質格外細緻、在陽光照射下宛如黃金粉末般閃耀的沙灘，先民最初將此地命名為「金沙」，其後才改寫作發音相近的「津沙」，沿用至今。津沙是馬祖列島中地理位置最靠近中國大陸的第一大漁村聚落，清末以來，陸續有連江、長樂、琅岐島等地的福建沿海居民移入定居，是馬祖地區原籍大陸連江縣移民比例最高的村莊。早年津沙漁業興盛，", "居民除了出海捕撈，也兼營釀酒、藥鋪、商號等行業，一度是南竿第二大村，並因村內設有私塾而文風興盛。抗戰時期，日軍為控制閩江口航道，曾派兵駐守津沙西邊山的「雁廬」。如今津沙聚落經社區營造活化，頹圮的老屋重現生機，轉型為老酒館與特色民宿，是馬祖列島中最受遊客青睞的傳統聚落之一。"], "quiz": {"q": "關於「津沙聚落」（連江縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因清代此地盛產某種作物，官府設「津沙聚落」市集而得名", "津沙聚落因擁有一片如金砂般細緻的沙灘，原稱「金沙」，後改寫作「津沙」，是南竿最靠近中國大陸的第一大漁村聚落。"], "correct": 3, "rightFb": "沒錯！津沙聚落因擁有一片如金砂般細緻的沙灘，原稱「金沙」，後改寫作「津沙」，是南竿最靠近中國大陸的第一大漁村聚落。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [472, 533, 534, 535]}, {"id": "side-連江縣-2", "title": "連江縣．大坵嶼至芹壁龜島", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識連江縣的幾個地方：大坵嶼、亮島、高登、芹壁龜島。」", "stops": [{"placeId": 543, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『大坵嶼』這個地方，是怎麼來的嗎？大坵嶼位於北竿島北方，因1990年最後居民遷出成為無人島，1997年北竿軍方野放十餘頭梅花鹿於島上，如今已繁殖上百頭，享有「海上奈良」美稱。", "大坵嶼地處連江縣北竿鄉北方海域，與高登、亮島相鄰，「坵」字在此泛指小島。這座島嶼曾有居民定居捕撈維生，全盛時期人口多達三百餘人，隨著台灣經濟發展與人口外流，民國79年（1990年）最後一戶居民舉家遷往北竿橋仔，大坵自此一度成為無人島。民國86年（1997年），南竿三民畜牧場因戰地政務終止、經營成本過高，北竿指揮部與縣政府協調後，將原本飼養的十三頭梅花鹿野放至已無人居住的大坵島，", "1998年駐軍全數撤離後，這群梅花鹿在無人打擾的環境下自在繁衍，數量從十三頭增長至上百頭，意外讓大坵 // =====================================================================
// 音訊系統
//   背景音樂：外部 mp3（與本 HTML 放在同一個資料夾即可，檔名如下）
//   音效：Web Audio API 即時合成，不需任何外部檔案
// =====================================================================
const BGM_FILES = {
  lobby:   "bgm_lobby.mp3",    // 大廳／標題／地圖／圖鑑／挑戰
  north:   "bgm_north.mp3",    // 北部
  central: "bgm_central.mp3",  // 中部
  south:   "bgm_south.mp3",    // 南部
  east:    "bgm_east.mp3",     // 東部
  island:  "bgm_island.mp3"    // 離島
};
const BGM_FOLDER = "";   // 若把音樂放在子資料夾，改成 "audio/" 即可

const Audio_ = {
  enabled: true,
  bgmVol: 0.45,
  sfxVol: 0.55,
  cur: null,          // 目前播放的 key
  els: {},            // key -> HTMLAudioElement
  unlocked: false,
  ctx: null,
  fadeTimer: null,

  el(key){
    if (!this.els[key]){
      const a = new Audio(BGM_FOLDER + BGM_FILES[key]);
      a.loop = true; a.preload = "none"; a.volume = 0;
      a.addEventListener("error", ()=>{ /* 檔案不存在就安靜略過 */ });
      this.els[key] = a;
    }
    return this.els[key];
  },

  play(key){
    if (!BGM_FILES[key]) return;
    if (this.cur === key && this.enabled) return;
    const prev = this.cur ? this.els[this.cur] : null;
    this.cur = key;
    if (!this.enabled || !this.unlocked) return;
    const next = this.el(key);
    next.play().catch(()=>{});
    this.fade(prev, next);
  },

  fade(prev, next){
    if (this.fadeTimer) clearInterval(this.fadeTimer);
    const target = this.bgmVol;
    let t = 0;
    this.fadeTimer = setInterval(()=>{
      t += 0.06;
      if (prev) prev.volume = Math.max(0, target * (1 - t));
      if (next) next.volume = Math.min(target, target * t);
      if (t >= 1){
        clearInterval(this.fadeTimer); this.fadeTimer = null;
        if (prev && prev !== next){ prev.pause(); prev.currentTime = 0; }
      }
    }, 45);
  },

  applyVolume(){
    Object.keys(this.els).forEach(k=>{
      this.els[k].volume = (this.enabled && k === this.cur) ? this.bgmVol : 0;
    });
  },

  setEnabled(on){
    this.enabled = on;
    if (!on){
      Object.keys(this.els).forEach(k=>{ this.els[k].pause(); });
    } else if (this.cur){
      const a = this.el(this.cur); a.volume = this.bgmVol; a.play().catch(()=>{});
    }
  },

  unlock(){
    if (this.unlocked) return;
    this.unlocked = true;
    try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ this.ctx = null; }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
    const k = this.cur || "lobby";
    this.cur = null; this.play(k);
  },

  // ---- 音效：以振盪器合成 ----
  tone(freq, dur, type, vol, delay, sweepTo){
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, (vol||0.3) * this.sfxVol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  noise(dur, vol){
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = (vol||0.15) * this.sfxVol;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start();
  },
  sfx(name){
    switch(name){
      case "click":    this.tone(660, 0.07, "triangle", 0.22); break;
      case "type":     this.tone(1400, 0.02, "square", 0.05); break;
      case "page":     this.tone(520, 0.09, "triangle", 0.18); this.tone(780, 0.09, "triangle", 0.12, 0.05); break;
      case "correct":  this.tone(784, 0.13, "sine", 0.32); this.tone(988, 0.13, "sine", 0.3, 0.1);
                       this.tone(1319, 0.3, "sine", 0.28, 0.2); break;
      case "wrong":    this.tone(300, 0.2, "sawtooth", 0.22, 0, 150);
                       this.tone(220, 0.28, "sawtooth", 0.18, 0.12, 110); break;
      case "discover": this.tone(880, 0.1, "sine", 0.26); this.tone(1175, 0.1, "sine", 0.24, 0.09);
                       this.tone(1568, 0.36, "sine", 0.26, 0.18); break;
      case "yokai":    this.tone(180, 0.5, "sawtooth", 0.2, 0, 90); this.noise(0.5, 0.12); break;
      case "complete": [523,659,784,1047].forEach((f,i)=> this.tone(f, 0.32, "sine", 0.28, i*0.13)); break;
      case "select":   this.tone(523, 0.08, "sine", 0.25); this.tone(784, 0.12, "sine", 0.22, 0.07); break;
      case "fail":     this.tone(392, 0.25, "triangle", 0.25); this.tone(294, 0.4, "triangle", 0.22, 0.2); break;
    }
  }
};
["pointerdown","keydown","touchstart"].forEach(ev=>{
  window.addEventListener(ev, ()=>Audio_.unlock(), {once:true});
});

let state = {
  playerName: "旅人",
  charKey: null,        // 選定的主角
  gender: null,
  homeRegion: "north",  // 起始區域（依主角而定）
  discovered: {},      // placeId -> true

  seenIntro: false,
  challengeBest: 0
};

function resetState(){
  state = { playerName:"旅人", charKey:null, gender:null, homeRegion:"north",
            discovered:{}, loreScore:0, regionDone:{}, party:[], seenIntro:false, challengeBest:0 };
}

// 目前主角 / 顯示名稱
function curChar(){ return state.charKey ? CHAR_BY_KEY[state.charKey] : null; }
function playerName(){ const c = curChar(); return state.playerName || (c ? c.name : "旅人"); }
function playerIcon(){ const c = curChar(); return c ? c.icon : "🧭"; }

// 旅程順序：以主角家鄉為起點，依序輪轉一圈
function regionOrder(){
  const home = state.homeRegion || REGION_ORDER[0];
  const i = Math.max(0, REGION_ORDER.indexOf(home));
  return REGION_ORDER.slice(i).concat(REGION_ORDER.slice(0, i));
}
function isRegionUnlocked(regionId){
  const order = regionOrder();
  const idx = order.indexOf(regionId);
  if (idx <= 0) return true;
  return !!state.regionDone[order[idx-1]];
}
function nextRegionName(afterId){
  const order = regionOrder();
  const i = order.indexOf(afterId);
  if (i < 0 || i+1 >= order.length) return null;
  const r = REGIONS.find(x=>x.id===order[i+1]);
  return r ? r.name : null;
}
// 這一區在旅程中的位置（0 = 主角家鄉、最後一個 = 旅程終點）
function isFirstRegion(regionId){ return regionOrder().indexOf(regionId) === 0; }
function isLastRegion(regionId){ const o = regionOrder(); return o.indexOf(regionId) === o.length-1; }
// 夥伴台詞守門：還沒入隊的夥伴不會在劇情裡說話
function castAllowed(key, region){
  if (!COMPANIONS[key]) return true;                       // 青苔婆婆、忘名妖等不受限
  if (state.party && state.party.indexOf(key) >= 0) return true;
  if (region && (key === region.companion || key === region.extraCompanion)) return true;
  return false;
}
// 條件台詞：#done:east# / #!done:east# 前綴，依旅程進度決定是否出現
function lineCondOk(cond){
  const neg = cond.charAt(0) === "!";
  const c = neg ? cond.slice(1) : cond;
  let v = true;
  if (c.indexOf("done:") === 0) v = !!state.regionDone[c.slice(5)];
  return neg ? !v : v;
}
function filterCastLines(lines, region){
  const out = [];
  (lines||[]).forEach(l => {
    let t = l;
    const cm = /^#([^#]+)#/.exec(t);
    if (cm){ if (!lineCondOk(cm[1])) return; t = t.slice(cm[0].length); }
    const m = /^@(\w+)@/.exec(t);
    if (m && !castAllowed(m[1], region)) return;
    out.push(t);
  });
  return out;
}

function regionStats(region){
  let total=0, done=0;
  region.counties.forEach(c => {
    (placesByCounty[c]||[]).forEach(p => { total++; if (state.discovered[p.id]) done++; });
  });
  return {total, done};
}

];
function sceneForText(t){

function stopScene(stop){

  const txt = (stop.pages||[]).join("") + (p ? (p.n||"")+(p.d||"") : "");
  stop._sc = sceneForText(txt);
  return stop._sc;
}
// 各大區的預設開場場景（同樣是通用圖，只是挑一張最貼近該區印象的）

function sceneNarration(id, seed){

let dlgSteps = [], dlgIdx = -1, typing=null, dlgOnDone=null, dlgCurScene="🌫️", dlgCurLabel="";
let challengeScore = 0;

function speakerInfo(key){
  if (key==="mentor") return MENTOR;
  if (key==="player" || key==="me") return {name: playerName(), icon: playerIcon()};
  if (COMPANIONS[key]) return COMPANIONS[key];
  return null;
}

// 取一句符合主角個性的台詞（kind: greet/arrive/curious/yokai/right/clear）
function pline(kind){
  const c = curChar();
  const v = (c && VOICE_LINES[c.voice]) ? VOICE_LINES[c.voice] : VOICE_LINES.bold;
  const pool = v[kind] && v[kind].length ? v[kind] : (v.curious || ["……"]);
  return { type:"line", speaker: playerName(), icon: playerIcon(),
           text: pool[Math.floor(Math.random()*pool.length)], isPlayer:true };
}
function isPlayerSpeaker(name){ return name === playerName(); }

function parseLine(raw, fallback){
  const m = /^@(\w+)@([\s\S]*)$/.exec(raw);
  if (m){
    const sp = speakerInfo(m[1]);
    if (sp) return {speaker:sp.name, icon:sp.icon, text:m[2]};
  }
  return {speaker:fallback.name, icon:fallback.icon, text:raw};
}

function stripPrefix(text, name){
  const re = new RegExp("^"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[：:]\\s*");
  return text.replace(re,"");
}

function linesToSteps(lines, fallback){
  return lines.map(l => { const p = parseLine(l, fallback); return {type:"line", speaker:p.speaker, icon:p.icon, text:p.text}; });
}

function buildStopSteps(stop, region, ctx){
  const fb = {name:stop.npcName, icon:stop.npcIcon};
  const steps = [];
  const pages = linesToSteps(filterCastLines(stop.pages, region), fb);
  pages[0].scene = stop.sceneEmoji;
  // 通用場景：換景時先來一句旁白鋪陳畫面
  const sc = stopScene(stop);
  if (ctx && ctx.bg !== sc){
    ctx.bg = sc;
    const nar = sceneNarration(sc, stop.placeId);
    if (nar){ nar.scene = stop.sceneEmoji; steps.push(nar); }
  }
  // 主角抵達時先開口
  const arrive = pline("arrive"); arrive.scene = stop.sceneEmoji; arrive.bg = sc;
  steps.push(arrive);
  pages.forEach(p => steps.push(p));
  // 聽完介紹後的反應／追問
  steps.push(pline("curious"));
  if (stop.interference){
    steps.push({type:"line", speaker:"忘名妖", icon:"🌫️", text:stop.interference[0], sfx:"yokai"});
    steps.push(pline("yokai"));
    steps.push({type:"line", speaker:stop.npcName, icon:stop.npcIcon, text:stripPrefix(stop.interference[1], stop.npcName)});
  }
  steps.push({type:"quiz", quiz:stop.quiz, placeId:stop.placeId, npcName:stop.npcName, npcIcon:stop.npcIcon});
  steps.push(pline("right"));
  if (stop.afterQuiz){
    linesToSteps(filterCastLines(stop.afterQuiz, region), fb).forEach(s=>steps.push(s));
  }
  return steps;
}

function buildMainQuestSteps(region){
  let steps = [];
  const first = isFirstRegion(region.id), last = isLastRegion(region.id);
  // 柯世安固定在「旅程的第一區」一開場就先入隊（早於該區任何一站的劇情），
  // 這樣他在該區本身站點、以及後續其他區域裡的台詞才能正常銜接、不會被跳過。
  // 他「正式登場、自我介紹」的台詞（JOURNEY.firstClosing）則保留在該區結尾，
  // 因為那段台詞裡會提到「你們剛剛講的那幾個地名由來」，需要接在該區站點之後才合理。
  if (first && state.party.indexOf("keshian")===-1) state.party.push("keshian");
  // 開場：旅程起點／終點的框架台詞 + 該區本身的介紹（未入隊夥伴不發言）
  let openLines = [];
  if (first) openLines = openLines.concat(JOURNEY.firstOpening(region));
  if (last)  openLines = openLines.concat(JOURNEY.lastOpening);
  openLines = openLines.concat(filterCastLines(region.opening, region));
  const opening = linesToSteps(openLines, MENTOR);
  const regionBg = REGION_BG[region.id] || "field";
  if (opening.length){ opening[0].scene = region.stops&&region.stops[0]?region.stops[0].sceneEmoji:"🧭"; opening[0].label = region.title; opening[0].bg = regionBg; }
  steps = steps.concat(opening);
  steps.push(pline("greet"));
  const ctx = {bg: regionBg};
  region.stops.forEach(stop => { steps = steps.concat(buildStopSteps(stop, region, ctx)); });
  // 結尾：該區夥伴入隊 →（第一區）柯世安正式登場自我介紹 →（最後一區）全隊大結局
  let closeLines = filterCastLines(region.closing, region);
  if (first) closeLines = closeLines.concat(JOURNEY.firstClosing);
  if (last)  closeLines = closeLines.concat(JOURNEY.lastClosing);
  const closing = linesToSteps(closeLines, MENTOR);
  if (closing.length){ closing[0].scene = "🧭"; closing[0].label = region.title+"・完"; closing[0].bg = regionBg; }
  steps = steps.concat(closing);
  steps.push(pline("clear"));
  const nxt = nextRegionName(region.id);
  if (nxt){
    steps.push({type:"line", speaker:MENTOR.name, icon:MENTOR.icon,
      text:"羅盤的指針，已經轉向「"+nxt+"」了。走吧，"+playerName()+"。"});
  } else {
    steps.push({type:"line", speaker:MENTOR.name, icon:MENTOR.icon,
      text:"全島的記憶，都被你一一拾起了。"+playerName()+"，你已經是真正的拾憶者了。"});
  }
  return steps;
}

function playSequence(steps, onDone){
  dlgSteps = steps; dlgIdx = -1; dlgOnDone = onDone;
  dlgCurScene = "🌫️"; dlgCurLabel = ""; curSceneBg = null;
  if (curTopbarSceneName !== null){ curTopbarSceneName = null; renderTopbar(); }
  const bgEl = dlgSceneBgEl(); if (bgEl) bgEl.classList.remove("on");
  showScreen("dialogue");
  nextDlgStep();
}

function nextDlgStep(){
  dlgIdx++;
  if (dlgIdx >= dlgSteps.length){
    const cb = dlgOnDone; dlgOnDone=null;
    if (cb) cb();
    return;
  }
  const step = dlgSteps[dlgIdx];
  if (step.sfx) sfx(step.sfx); else if (dlgIdx > 0) sfx("page");
  if (step.bg !== undefined) setSceneBg(step.bg);
  if (step.scene){ dlgCurScene = step.scene; }
  if (step.label){ dlgCurLabel = step.label; }
  // 場景上的重複篇章標題徽章已移除，篇章標題僅顯示於頂部列(topbar-chapter)
  updateStageVisual(step.type==="line" ? step.speaker : (step.type==="quiz" ? step.npcName : null));

  if (step.type === "line"){
    dlgChoicesEl().classList.add("hidden"); dlgChoicesEl().innerHTML="";
    dlgBoxEl().classList.remove("hidden");
    renderTyping(step.speaker, step.icon, step.text);
  } else if (step.type === "quiz"){
    renderQuiz(step);
  }
}

function updateStageVisual(speakerName){
  const stage = dlgSceneEmojiEl();
  const art = speakerName ? artFor(speakerName) : null;
  if (art){
    stage.innerHTML = '<img class="stage-portrait" src="'+art.full+'" alt="'+escapeHtml(speakerName)+'">';
  } else if (speakerName && isPlayerSpeaker(speakerName)){
    stage.innerHTML = "";
    stage.textContent = playerIcon();
  } else {
    // 背景已有場景插畫，旁白時不再疊加裝飾用表情符號圖示
    stage.innerHTML = "";
    stage.textContent = "";
  }
}

function renderTyping(speaker, icon, text){
  const art = artFor(speaker);
  const mine = isPlayerSpeaker(speaker);
  const isNarration = (speaker === "旁白");
  dlgBoxEl().classList.toggle("player", !!mine);
  dlgBoxEl().classList.toggle("narration", isNarration);
  dlgSpeakerEl().innerHTML = isNarration ? "" : ((art ? '<img class="sp-face" src="'+art.face+'">' : (icon?icon+" ":"")) + escapeHtml(speaker));
  const el = dlgTextEl();
  el.textContent = "";
  dlgTapHintEl().style.visibility = "hidden";
  if (typing) clearInterval(typing);
  let i = 0, tick = 0;
  const full = text;
  typing = setInterval(()=>{
    i += 2; tick++;
    if (tick % 4 === 0) sfx("type");
    if (i >= full.length){
      el.textContent = full;
      clearInterval(typing); typing=null;
      dlgTapHintEl().style.visibility = "visible";
    } else {
      el.textContent = full.slice(0,i);
    }
  }, 16);
}

function skipOrAdvance(){
  if (typing){
    clearInterval(typing); typing=null;
    const step = dlgSteps[dlgIdx];
    if (step && step.type==="line"){ dlgTextEl().textContent = step.text; dlgTapHintEl().style.visibility="visible"; }
    return;
  }
  const step = dlgSteps[dlgIdx];
  if (step && step.type==="quiz") return; // 測驗中不可用點擊跳過
  nextDlgStep();
}
document.getElementById("dlg-box").addEventListener("click", skipOrAdvance);
document.querySelector(".dlg-stage").addEventListener("click", skipOrAdvance);

function renderQuiz(step){
  dlgBoxEl().classList.remove("hidden");
  dlgBoxEl().classList.remove("player");
  const qArt = artFor(step.npcName);
  dlgSpeakerEl().innerHTML = (qArt ? '<img class="sp-face" src="'+qArt.face+'">' : (step.npcIcon?step.npcIcon+" ":"🌀 ")) + "記憶考驗";
  dlgTextEl().textContent = step.quiz.q;
  dlgTapHintEl().style.visibility = "hidden";
  const box = dlgChoicesEl();
  box.classList.remove("hidden");
  box.innerHTML = "";
  const fbDiv = document.createElement("div");

  // ---- 選項隨機排序：每次作答（含重答）正確答案的位置都不一樣 ----
  const order = step.quiz.opts.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }

  order.forEach(origIdx => {
    const btn = document.createElement("button");
    btn.className = "dlg-choice-btn";
    btn.textContent = step.quiz.opts[origIdx];
    btn.dataset.orig = String(origIdx);
    btn.addEventListener("click", () => {
      if (btn.dataset.locked) return;
      Array.from(box.querySelectorAll(".dlg-choice-btn")).forEach(b=>b.dataset.locked="1");
      const isCorrect = (origIdx === step.quiz.correct);
      if (isCorrect){
        btn.style.background = "#d9ecd9"; btn.style.borderColor="#4f7a63";
        sfx("correct");
        if (step.isChallenge){ challengeScore++; }
        else {
          const isNew = !state.discovered[step.placeId];
          markDiscovered(step.placeId, true);
          if (isNew){ sfx("discover"); toast("✦ 記憶結晶已獲得："+placesData[step.placeId].n); }
        }
        showFeedback(step.quiz.rightFb, true, step);
      } else {
        btn.style.background = "#f3d9d3"; btn.style.borderColor="#a13d2e";
        sfx("wrong");
        if (step.isChallenge){
          const correctBtn = Array.from(box.querySelectorAll(".dlg-choice-btn"))
            .find(b => b.dataset.orig === String(step.quiz.correct));
          if (correctBtn){ correctBtn.style.background = "#d9ecd9"; correctBtn.style.borderColor="#4f7a63"; }
          showFeedback(step.quiz.wrongFb+"（正確答案：「"+step.quiz.opts[step.quiz.correct]+"」）", true, step);
        } else {
          showFeedback(step.quiz.wrongFb, false, step);
        }
      }
    });
    box.appendChild(btn);
  });
  box.appendChild(fbDiv);

  function showFeedback(text, allowContinue, stepRef){
    fbDiv.className = "quiz-fb";
    fbDiv.style.marginTop="10px";
    fbDiv.textContent = text;
    if (allowContinue){
      const cont = document.createElement("button");
      cont.className = "brass-btn small"; cont.style.marginTop="10px";
      cont.textContent = "繼續 ▸";
      cont.addEventListener("click", ()=>{ sfx("click"); box.classList.add("hidden"); box.innerHTML=""; nextDlgStep(); });
      box.appendChild(cont);
    } else {
      const retry = document.createElement("button");
      retry.className = "brass-btn ghost small"; retry.style.marginTop="10px";
      retry.textContent = "再想想 ▸";
      retry.addEventListener("click", ()=>{ sfx("click"); renderQuiz(stepRef); });
      box.appendChild(retry);
    }
  }
}

function startMainQuest(regionId){
  const region = REGIONS.find(r=>r.id===regionId);
  setBgmRegion(regionId);
  setChapterLabel(region.title);
  const steps = buildMainQuestSteps(region);
  playSequence(steps, () => {
    if (!state.regionDone[regionId]){
      state.regionDone[regionId] = true;
      if (region.companion && state.party.indexOf(region.companion)===-1) state.party.push(region.companion);
      // 柯世安已改為在「旅程第一區」一開場（buildMainQuestSteps）就入隊，這裡不再重複處理
      if (region.extraCompanion && state.party.indexOf(region.extraCompanion)===-1) state.party.push(region.extraCompanion);
      sfx("complete");
      toast("🎉 已完成「"+region.title+"」");
      renderTopbar();
    }
    setChapterLabel("");
    renderRegionScreen(regionId);
    showScreen("region");
  });
}

function buildChainSteps(chain){
  const persona = {name: chain.stops[0].npcName, icon: chain.stops[0].npcIcon};
  let steps = [];
  const chainBg = stopScene(chain.stops[0]);
  const openText = stripPrefix(chain.opening, persona.name);
  steps.push({type:"line", speaker:persona.name, icon:persona.icon, text:openText, scene:persona.icon, label:chain.title, bg:chainBg});
  steps.push(pline("arrive"));
  let lastBg = chainBg;
  chain.stops.forEach(stop => {
    const sc = stopScene(stop);
    if (sc !== lastBg){
      lastBg = sc;
      const nar = sceneNarration(sc, stop.placeId);
      if (nar){ nar.scene = stop.sceneEmoji; steps.push(nar); }
    }
    stop.pages.forEach((pg,i) => {
      const s = {type:"line", speaker:stop.npcName, icon:stop.npcIcon, text:pg};
      if (i===0){ s.scene = stop.sceneEmoji; s.bg = sc; }
      steps.push(s);
    });
    steps.push(pline("curious"));
    steps.push({type:"quiz", quiz:stop.quiz, placeId:stop.placeId, npcName:stop.npcName, npcIcon:stop.npcIcon});
    steps.push(pline("right"));
  });
  const closeText = stripPrefix(chain.closing, persona.name);
  steps.push({type:"line", speaker:persona.name, icon:persona.icon, text:closeText});
  return steps;
}

function playChain(county, kind, idx){
  setBgmRegion(regionOf[county]);

  if (!chain) return;
  setChapterLabel(chain.title);
  const steps = buildChainSteps(chain);
  playSequence(steps, () => {
    setChapterLabel("");
    renderCountyScreen(county);
    showScreen("county");
  });
}

const REGION_LABEL_POS = {
  north:   {x:615, y:15},
  central: {x:268, y:258},
  south:   {x:248, y:478},
  east:    {x:630, y:345},
  island:  {x:145, y:155}
};

function countyPolys(countyName){
  const c = countyMapData[countyName];
  if (!c) return [];
  const list = [];
  if (c.pts) list.push(c.pts);
  if (c.shapes) c.shapes.forEach(s=>list.push(s.pts));
  if (c.extraIslands) c.extraIslands.forEach(s=>list.push(s.pts));
  return list;
}

function renderWorldMap(){
  const svg = document.getElementById("worldmap");
  svg.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";

  REGIONS.forEach(region=>{
    const unlocked = isRegionUnlocked(region.id);
    const done = !!state.regionDone[region.id];
    const g = document.createElementNS(ns,"g");
    g.setAttribute("class","region-node"+(unlocked?"":" locked"));
    g.setAttribute("fill", `var(--${region.color})`);
    g.setAttribute("fill-opacity", done?"0.88":"0.58");
    g.setAttribute("stroke","#fdf3da");
    g.setAttribute("stroke-width","1");
    g.setAttribute("stroke-opacity","0.55");
    g.setAttribute("stroke-linejoin","round");

    region.counties.forEach(cname=>{
      countyPolys(cname).forEach(pts=>{
        const poly = document.createElementNS(ns,"polygon");
        poly.setAttribute("points", pts);
        poly.setAttribute("class","shape");
        g.appendChild(poly);
      });
    });

    const lp = REGION_LABEL_POS[region.id];
    const label = document.createElementNS(ns,"text");
    label.setAttribute("x", lp.x); label.setAttribute("y", lp.y);
    label.setAttribute("class","region-label"); label.setAttribute("text-anchor","middle");
    label.textContent = (unlocked? region.name : "🔒 "+region.name);
    g.appendChild(label);

    const stat = regionStats(region);
    const sub = document.createElementNS(ns,"text");
    sub.setAttribute("x", lp.x); sub.setAttribute("y", lp.y+15);
    sub.setAttribute("class","region-sub"); sub.setAttribute("text-anchor","middle");
    sub.textContent = unlocked ? (stat.done+"/"+stat.total+(done?" ✓":"")) : "尚未解鎖";
    g.appendChild(sub);

    if (unlocked){
      g.addEventListener("click", ()=>{ sfx("click"); renderRegionScreen(region.id); showScreen("region"); });
    } else {
      g.addEventListener("click", ()=>{ toast("🔒 尚未解鎖，請先完成前一段旅程的主線劇情"); });
    }
    svg.appendChild(g);
  });

  // legend
  const legend = document.getElementById("worldmap-legend");
  legend.innerHTML = "";
  REGIONS.forEach(r=>{
    const chip = document.createElement("div");
    chip.className = "legend-chip";
    chip.innerHTML = '<span class="legend-dot" style="background:var(--'+r.color+')"></span>'+r.name;
    legend.appendChild(chip);
  });

  renderPartyRow(document.getElementById("party-row"));
}
