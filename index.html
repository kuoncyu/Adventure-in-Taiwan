    ["苗栗縣","苑裡鎮","彎麗","苑裡地名源自道卡斯族「苑裡社」，清代文獻曾寫作宛里、彎里、灣麗等多種音譯用字。","","苑裡鎮地名源自道卡斯族「苑裡社」（Wanrie）的社名音譯，這個平埔族部落原是清初「蓬山八社」（初稱崩山八社）之一，清代文獻中曾出現宛里、里灣里、彎里、灣麗等多種不同的音譯用字，直到日治時期才統一定為「苑裡」。除了苑裡社，苑裡鎮境內還涵蓋房裡社、貓盂社等蓬山八社成員的傳統領域，各社頭目分別管理各自轄下的聚落與土地事務，清光緒年間的官方文書中仍可見到這些頭目的姓名紀錄。苑裡因地勢平坦、水源充沛，適合種植稻米，是苗栗縣最大稻米產地，有「苗栗穀倉」的美譽；此外，苑裡與鄰近的大甲同為台灣藺草編織業的重要產地，早期大量出口草蓆、草帽等生活用品，藺草編織業沒落後，近年成立蘭草文物館重新推廣這項傳統工藝，讓苑裡從單純的平埔族社名，逐漸發展出兼具稻米與藺草雙重代表性的地方特色。"],
    ["苗栗縣","卓蘭鎮","罩蘭","卓蘭原稱塔連，是巴宰族語「Tarien」音譯，意指美麗的原野，歷經罩蘭、打難等多次寫法變化，1920年定名卓蘭。","","卓蘭地名源自巴宰族（巴則海族）「Tarien」的音譯，意思是「美麗的原野」，清雍正年間的契字上寫作「塔連」，這是目前所知最早的漢字記錄；乾隆51年繪製的《岸番把守圖》中，大安溪出山口北岸平原（今三義鯉魚潭附近）已標註「罩蘭埔」地名，當時罩蘭仍屬清廷劃定的生番界內，是泰雅族傳統領域。道光16年（1836年）刊行的《彰化縣志》改稱「罩蘭」，同治年間的《臺灣府輿圖纂要》又寫作「打難」，可見這個地名歷經多次不同的漢字音譯版本。乾隆55年（1790年）林爽文事件後，清廷實施「番屯制」，巴宰族取得罩蘭地區作為屯丁贍養埔地，漢人得以持續在此開墾，但與泰雅族的關係長期緊繃，直到光緒10年（1884年）仍爆發武裝衝突。1920年，日本殖民政府正式將地名定為「卓蘭」，沿用至今。卓蘭因耕地多為旱田，盛產葡萄、楊桃、水梨與柑橘，享有「水果王國」的美譽。"],
    ["苗栗縣","造橋鄉","造橋","造橋因清雍正年間居民為了跨越南港溪、解決頭份與造橋兩地交通問題而集資造橋得名。","","造橋地名由來相當直白：清雍正9年（1731年），頭份與造橋兩地之間的交通因南港溪河床阻隔而諸多不便，當地居民為了解決往來問題，集資合力興建一座橋梁，命名為「登雲橋」，又稱「長橋」，這座橋的興建，便成為「造橋」這個地名的由來。另有一說指出，是一位苗栗客籍拓荒者與商旅合作，共同出資建造這座跨越南港溪的橋梁，為了紀念這項工程，便以「造橋」作為當地地名，兩種說法雖細節略有出入，但核心都圍繞著這座解決交通問題的橋梁而生。造橋鄉地處苗栗縣北側丘陵地帶，因土壤與氣候條件適合種植南瓜，近年舉辦的「苗栗縣南瓜節」（原稱造橋瓜瓜節）已成為地方重要的農特產推廣活動，讓這個因造橋通行而得名的鄉鎮，也發展出獨具特色的瓜果產業。"],
    ["苗栗縣","西湖鄉","四湖","西湖舊稱四湖，因附近有頭湖、二湖至九湖等一連串河谷小盆地，四湖位居中央，為避免與雲林縣四湖鄉同名而改稱西湖。","","西湖鄉舊稱「四湖」，這個地名源自當地特殊的地形分布：西湖溪流域沿岸分布著一連串大小不一的河谷小盆地，客家人慣以「湖」稱呼這種山間盆地地形，先民依序將這些盆地由下游往上游命名為頭湖、二湖、三湖、四湖、五湖，一路排列至九湖，其中「四湖」恰好位居這片區域的中央地帶，因而成為整個鄉鎮的代表性地名。戰後台灣行政區重新命名時，因雲林縣也有一個同樣稱為「四湖」的鄉鎮，兩地容易混淆，苗栗的四湖鄉便依其地理位置改稱「西湖」，沿用至今，這也是台灣少數因與他縣地名重複、而非因語音演變或行政改制才更名的案例。西湖鄉境內丘陵地形發達，適合種植地瓜，近年舉辦的「西湖蕃薯文化節」是地方重要的農特產推廣活動。"],
    ["苗栗縣","頭屋鄉","崁頭屋","頭屋舊稱崁頭屋，因位於老田寮溪沿岸河階地形的第一個河階（崁）上而得名，後簡化為頭屋。","","頭屋鄉舊稱「崁頭屋」，這個地名結合了地形與聚落兩種概念：老田寮溪沿岸分布著多層河階地形，客家話稱這種因河流侵蝕堆積形成的階地為「崁」，而這處聚落恰好位於沿岸第一個（最下游或最前端）河階之上，因而得名「崁頭屋」，其後簡化為「頭屋」，沿用至今。頭屋鄉境內另有「天花湖」一地，地名由來眾說紛紜，有一說指過去天花或性病患者曾被送至此地隔離；另一說則稱此地過去風月場所林立，因而得名，但確切緣由已難以考證。清光緒年間，墾戶黃南球率眾進墾頭屋一帶，境內流傳的「番王」傳說，據信與當地原住民貓閣社道卡斯族人的後裔有關，反映出頭屋是漢人與平埔族群交會拓墾的重要地帶。頭屋鄉因水源充足、氣候適宜，是苗栗縣重要的蘿蔔產地，每年舉辦「頭屋蘿蔔節」推廣地方農特產。"],
    ["苗栗縣","公館鄉","隘寮下","公館原稱隘寮下，因清代設隘防禦原住民出草，並在隘寮下方興建處理隘務、墾務的公館而得名。","","公館鄉地名源自清代的隘防制度：這一帶因鄰近原住民傳統領域，早期先民為防範出草侵擾，在山區要隘設置「隘寮」派駐隘丁巡防，這處聚落因位於隘寮下方而俗稱「隘寮下」或「隘寮腳」；隨著開墾業務日益繁重，墾戶首領便在此興建一座專門處理隘務與墾務的辦事處，這種建築在客家話中稱為「公館」，久而久之便取代了原本的「隘寮下」，成為地名的正式稱呼，這與台灣其他各地因業戶興建辦事處而得名「公館」的地方，屬於相同的命名邏輯。公館鄉因四周山丘環繞、中央是後龍溪沖積而成的河谷平原，南北狹長、地勢低平，形似蛤蜊，因而也有「蛤仔市」的別稱。公館鄉境內曾是「亞洲第一口油井」出磺坑油田的所在地，加上氣候溫和、雨量充沛，適合紅棗生長，享有「紅棗的故鄉」美名，每年舉辦「公館紅棗季」推廣地方農特產。"],
    ["苗栗縣","銅鑼鄉","銅鑼灣","銅鑼原稱銅鑼灣，因聚落坐落於三面環山、一面開口的弧形山麓地形，狀似樂器銅鑼而得名。","","銅鑼鄉地名由來源自地形意象：這處聚落位於銅鑼斷層線谷中、西湖溪溪谷東岸，雙峰山向北延伸的餘脈環繞四周，地形北面銜接南勢坑分割台地，西側環繞苗栗丘陵，南面則有雙峰山塊餘脈屏障，三面山勢圍成一個圓弧狀地形，僅一面開口向外，形狀神似傳統樂器「銅鑼」，因而得名「銅鑼灣」，後簡化為「銅鑼」。銅鑼鄉境內的雙峰山，因山形俊美、氣勢雄渾，昔日文人墨客將「雙峰陵霄」列為古苗栗八景之一，是全鄉最顯著的地標。銅鑼鄉因氣候與土壤條件適合杭菊與芋頭種植，每年舉辦「銅鑼杭菊芋頭節」推廣地方農特產，秋冬時節杭菊花田盛開，也成為苗栗縣熱門的賞花景點之一，讓這個因地形似樂器而得名的山谷鄉鎮，兼具農業生產與觀光休閒的雙重機能。"],
    ["苗栗縣","三義鄉","三叉河","三義舊稱三叉河，因打木溪、水尾溪等支流在此匯集成西湖溪、形成三叉狀地形而得名，戰後取諧音改稱三義。","","三義鄉舊稱「三叉河」，這個地名直接描述了當地的水文地形：發源於雙連潭與十六份一帶的水尾溪（原名打木溪）與其他支流，在廣盛、雙湖交界的三興橋附近會合，匯流成西湖溪，因河道在此呈現三叉分歧的形狀，因而得名「三叉河」。道光22年（1842年），李藤華等人在此設街立庄，正式命名為「三叉河庄」；1842年，漢人組織「金華生」墾號，看中此地樟林茂密，於十六份等地搭寮蒸煉樟腦，逐漸發展出以山林物產交易為核心的市街聚落，並在聚落高處興建五穀宮作為信仰中心。1953年，「三叉」正式改名為「三義」，一般認為是因「義」字的簡寫字形與「叉」字相近，加上「義」字寓意更為正面吉祥，因而順勢改名。如今三義因舊山線鐵道與魚藤坪斷橋等歷史遺跡，加上木雕產業聞名全台，每年舉辦「三義國際木雕藝術節」，是苗栗縣重要的觀光與工藝重鎮。"],
    ["苗栗縣","大湖鄉","大湖","大湖原稱馬凹，因泰雅族見此地形如大湖而得名，清咸豐年間吳定新兄弟入墾後正式以「大湖」為名。","","大湖鄉在漢人入墾前，東部山區為泰雅族汶水群、大湖群的傳統領域，原住民依當地遍生山胡椒，將此地稱為「馬凹」（Ma-Ao，意即山胡椒）；大南勢一帶的泰雅族則另稱此地為「巴價拉崎」（Bagalagya），有一說是為了紀念一位頭目，另一說則指周圍溪水環繞之意。清咸豐7年（1857年），居住在銅鑼新雞隆的吳定新、吳定連兄弟翻越關刀山，見這片由後龍溪沖積而成、四周群山環繞、形似盆地大湖的地形，因而以「大湖」稱之，兄弟倆並組成「金和成」墾號武裝入墾，從事製材與製腦事業，但仍時常遭到泰雅族的抵抗與偷襲，開墾進度因而受限。1913年，抗日志士羅福星曾在此策劃武裝起義，遭日方鎮壓後演變為「大湖事件」。如今大湖鄉因氣候溫和多雨，發展出全國聞名的草莓產業，享有「草莓王國」美譽，每年舉辦「大湖草莓文化季」吸引大量遊客前來採果。"],
    ["苗栗縣","獅潭鄉","獅潭","獅潭因當地一道山稜遠望似獅子俯臥、獅頭伸入一潭飲水而得名，另一說為賽夏族語音轉而來。","","獅潭鄉地名由來流傳著一個頗富傳奇色彩的故事：在今永興村與百壽村交界處，橫亙著一道山稜，遠遠望去，山勢彷彿一頭獅子俯臥於地，而獅頭部位恰好延伸入一旁的水潭中飲水，當地居民因而將這座潭稱為「獅潭」，地名便沿用至今；據說早年每逢元宵節前後，附近居民還能聽見潭邊傳出鑼鼓喧天的聲響，增添了幾分神秘色彩，不過中豐公路開闢、切斷這道山脈之後，便再也沒有這樣的傳聞。另一種說法則認為，「獅潭」其實是賽夏族「西潭社」（Sawi'）語音轉變而來，與獅子毫無關聯。清同治年間，獅潭仍是原住民的傳統領域，直到光緒年間，墾首黃南球率領客家移民入墾，才開始有漢籍居民定居。獅潭鄉境內因氣候溫和、土質適合，近年發展出仙草種植與加工產業，每年舉辦的「獅潭仙草花節」是地方重要的觀光活動。"],
    ["苗栗縣","三灣鄉","三灣","三灣因中港溪流經此地形成連續三個大彎曲的河階地形，聚落恰好位於第三個曲流河階而得名。","","三灣鄉地名由來源自中港溪的河道地形：這條溪流流經三灣一帶時，因地勢與地質因素形成連續彎曲的曲流，先民依序將沿岸的河階聚落稱為頭灣、二灣、三灣，三灣正是這條河道上第三個彎曲處所形成的河階平地，因而得名，這種依河道彎曲次序命名地方的方式，與新北市三峽舊稱「三角湧」同樣是描述河川地形的典型範例。三灣鄉清代因鄰近北埔、南庄一帶泰雅族與賽夏族的傳統領域，是漢人拓墾山區前緣的重要據點，客家移民與原住民之間互動頻繁，既有貿易往來，也曾發生武裝衝突。三灣鄉因丘陵地形、氣候涼爽，適合種植水梨，是苗栗縣重要的水梨產地之一，每年舉辦「三灣梨觀光季」推廣地方農特產，讓這個因河道彎曲得名的山區鄉鎮，發展出獨具特色的果樹經濟。"],
    ["苗栗縣","南庄鄉","南庄","南庄因聚落位於清代最早開墾的據點「田尾公館」南方而得名。","","南庄鄉地名由來相對單純，源自其地理位置：清代這一帶最早開墾成形的據點稱為「田尾公館」，隨著拓墾範圍逐漸向南擴展，在田尾公館南方新形成的聚落，便被稱為「南庄」，以區別於北側較早開發的核心區域。南庄鄉是賽夏族的傳統領域，也是台灣少數賽夏族與客家族群密切共居、文化交融的地區，賽夏族兩年一度舉行的矮靈祭（paSta'ay），是全鄉極具代表性的原住民祭典，吸引大量遊客與研究者前來觀禮。南庄老街保留了完整的客家、閩南與日治時期建築風貌，加上鄰近的向天湖、蓬萊溪護漁區等自然景觀，已被劃入參山國家風景區範圍，是苗栗縣山城觀光的重要據點之一。"],
    ["苗栗縣","泰安鄉","大安","泰安舊稱大安，因是大安溪發源地而得名，1954年因與台中大安鄉同名，取諧音及「國泰民安」之意改名。","","泰安鄉是苗栗縣唯一的山地鄉，境內幾乎全境深入雪山山脈，早期因是大安溪的發源地，被稱為「大安」。1947年，這處山地行政區正式成立時，初期命名為「大安鄉」，然而由於名稱與台中縣（今台中市）大安鄉完全重複，容易造成行政與郵務混淆，因此於1954年申請改名；新地名一方面保留「大安」的諧音，另一方面則取「國泰民安」的吉祥寓意，正式定名為「泰安鄉」，沿用至今，是台灣少數因與他鄉鎮同名而更改名稱、且巧妙保留原音同時賦予嶄新吉祥意涵的案例。泰安鄉境內主要居民為泰雅族與客家人，由於溫泉資源豐富，素有「泰安溫泉鄉」的雅號，加上鄉內一半以上土地劃入雪霸國家公園範圍，保留了豐富的高山生態與瀕危物種，是苗栗縣重要的生態旅遊與溫泉觀光重鎮。"],
    ["苗栗縣","勝興","十六份","勝興舊稱十六份，因清代此地設有十六座蒸餾樟腦的腦灶而得名，境內勝興車站是台鐵海拔最高的車站。","","勝興地名源自清代盛極一時的樟腦產業：道光22年（1842年）漢人組織「金華生」墾號進入三叉河一帶開墾，因當地樟樹林密布，在十六份等處搭建腦寮蒸餾樟腦，依熬製樟腦所需的灶數計算，此處恰好設有十六座腦灶，因而得名「十六份」，這與苗栗地區另有「二十份」等以腦灶或墾股數量命名的地名，屬於同一套計量式命名邏輯。1908年台鐵縱貫線山線通車，在十六份設站，因海拔402.326公尺，是台鐵目前海拔最高的車站；戰後車站與周邊聚落更名為「勝興」，車站鐵道邊坡上，至今仍保留著「十六份」的舊名標示，供旅客追憶這段樟腦產業史。勝興車站因鄰近龍騰斷橋、舊山線鐵道等歷史遺跡，加上木造車站建築保存完整，已成為苗栗縣熱門的鐵道懷舊觀光景點之一。"],
    ["苗栗縣","龍騰","魚藤坪","龍騰舊稱魚藤坪，相傳因先民種植魚藤毒殺作怪的鯉魚精，後因「魚藤」不雅改稱龍騰，境內龍騰斷橋是知名地標。","","龍騰舊稱「魚藤坪」，地名由來流傳著一則生動的民間傳說：相傳先民初墾此地時，附近鯉魚潭中有一尾鯉魚精經常興風作浪、危害地方，村民為了克制鯉魚精，便在龍騰一帶的山區廣植具有毒性的魚藤，並將東側的高山改稱「關刀山」，寓意藉關刀之力斬除魚藤、毒殺鯉魚精，此後鯉魚精果然不再作怪，居民得以安居樂業。後來村民認為「魚藤」二字不夠雅致，遂改稱寓意飛龍騰躍的「龍騰」。這裡最知名的地標是1907年完工的「魚藤坪橋」（即龍騰斷橋），是縱貫線鐵路全線通車前興建的磚造、鋼鈑梁及桁架梁混合式橋梁，屬台灣鐵道工程技術的代表作之一。這座橋梁在1935年新竹台中大地震中嚴重震毀，僅存拱型橋墩挺立至今，1999年921大地震又再度震裂部分橋墩，如今已列為苗栗縣定古蹟，供後人憑弔這段鐵道與地震交織的歷史。"],
    ["苗栗縣","崎頂","崎頂","崎頂舊稱老衢崎，因位於一段長崎路（衢崎）頂端的聚落而得名。","","崎頂舊稱「老衢崎」，「衢」在漢語中意指四通八達的道路，「崎」則指崎嶇不平的坡地，「老衢崎」意指一段古老崎嶇道路的最頂端處，這處聚落因坐落於這段坡路的頂點而得名，後簡化為「崎頂」。崎頂地處竹南鎮西北側沿海地帶，是苗栗縣最北端的聚落，因縱貫鐵路行經而設有崎頂車站；車站旁保留了兩座建於日治時期的雙軌鐵路隧道，一號隧道興建較早，二號隧道建於1928年，因兩座隧道相距僅約50公尺，並列如母子相依，被稱為「崎頂子母隧道」，是台灣早期少見的雙線鐵路隧道之一，也是苗栗縣境內僅存的鐵路舊隧道，如今已規劃為崎頂隧道文化公園，隧道磚牆上仍可見戰爭時期留下的彈孔痕跡，是了解台灣鐵道史與戰爭記憶的重要景點。"],
    ["苗栗縣","白沙屯","白沙墩","白沙屯舊稱白沙墩，因海邊風沙長期堆積成沙丘（墩）而得名，是白沙屯媽祖徒步進香的起駕地。","","白沙屯舊稱「白沙墩」，這個地名直接描述了當地的海岸地貌：清乾隆年間，陳志城等移民入墾此地時，海濱一帶因長期受風力與潮汐作用，堆積出一片片白色沙丘，閩南語稱這種沙丘地形為「墩」，因而得名「白沙墩」，後簡化為「白沙屯」。白沙屯先民早期奉請一尊軟身媽祖神像供奉於爐主民宅，直到咸豐晚年，居民集資興建廟宇，於同治2年（1863年）建成「拱天宮」，正式成為地方信仰中心。事實上，白沙屯媽祖徒步前往雲林北港朝天宮進香的習俗，早在拱天宮建廟之前便已存在，距今已有兩百多年歷史，是全台媽祖進香活動中徒步距離最遠的一項，來回約三、四百公里；其最大特色是完全沒有固定路線與行程天數，全程依媽祖鑾轎的指示前進，充滿神秘色彩，2010年更獲文化部指定為國家重要無形文化資產，與大甲媽祖遶境並列台灣兩大媽祖進香盛事。"],

    // --- 【台中市】 ---
    ["台中市","中區","大墩","台中舊稱大墩，因清代此地有一座隆起的土墩（今台中公園砲台山）而得名，日治初期改稱台中，取「位居台灣中部」之意。","","台中的舊稱「大墩」，源自清雍正年間台中盆地仍是一片沼澤地，其中隆起一塊高地，先民依此凸起地形而得名，並在周邊建立「大墩庄」，乾隆年間發展成「大墩街」，即今日中區大墩里、中墩里一帶。1899年台灣總督府在這座土丘上（今台中公園內的砲台山）架設大砲以防禦抗日義軍，1903年台中公園開園時更將其納入園區，成為台灣最早設置三角測量標準點的地方之一。1896年日本殖民政府調整行政區域，因台中縣署設於此地，大墩街隨之改稱「台中街」；1920年台中設州，州治定於台中市，「台中」之名正式確立，取其「位居台灣中部」之意。有趣的是，多數人誤以為今日的「大墩路」與舊地名大墩有直接關聯，但其實最初的大墩位於台中公園西側的老街一帶，與後來另闢的大墩路實為兩地，是台中地名史上常見的一項誤解。"],
    ["台中市","東區","頂橋頭","東區舊稱頂橋頭，因位居台中盆地最低窪處、旱溪上架有橋梁而得名，日治後因區位於台中舊城之東而改稱東區。","","東區地處台中盆地最低窪之處，清代因當地旱溪上架設一座橋梁，且此地相對於下游其他橋梁位置較高，因而被稱為「頂橋頭」，透過這座橋梁，水路交通得以南抵大里、阿罩霧（今霧峰）等地，是早期台中盆地重要的水陸轉運節點。日治時期，隨著台中市街規劃向四周擴展，這一帶因地處台中舊城核心（今中區）之東側，正式定名為「東區」。台中盆地地勢低窪的東區，日治後期因汽車零件加工業與材料行林立，曾有「武市」之稱，是台中重要的黑手（黑手師傅）產業聚落；戰後隨著國立中興大學在此創校，東區逐漸從工業氣息濃厚的「武市」，轉型出兼具學術文風的城市風貌，成為台中市區東側重要的文教與住宅地帶。"],
    ["台中市","南區","半平厝","南區舊稱半平厝，因鄰近大里溪畔地勢低平的聚落而得名，日治後因位於台中舊城之南改稱南區。","","南區清代原是台中盆地南側的農業聚落地帶，舊稱「半平厝」，這個地名的確切語源已不易考證，一般認為與當地地勢平坦、聚落規模不大有關。1920年代，台中市街依日式棋盤式規劃向外擴展，這一帶因地處台中舊城核心之南，正式劃入「台中市」並定名為「南區」。南區境內設有台中州立台中農業試驗場等日治時期農業研究機構，加上鄰近台中車站與縱貫鐵路，逐漸發展成兼具農業試驗與鐵道運輸機能的市郊地帶。戰後，國立中興大學、台中榮民總醫院等重要機構陸續在南區周邊設立，加上台灣大道與復興路等主要幹道貫穿，南區逐漸從清代單純的農業聚落，轉型為台中市區南側重要的文教醫療與住宅生活圈。"],
    ["台中市","西區","麻園頭","西區舊稱麻園頭，因清代此地遍植黃麻、作為紡織原料而得名，日治後因位於台中舊城之西改稱西區。","","西區地名源自清代的經濟作物種植：這一帶因土壤與氣候適合黃麻生長，先民大量栽植黃麻作為紡織繩索的原料，因而得名「麻園頭」，是台灣地名中依經濟作物直接命名的常見案例之一，與台北「麻園頭」等地同樣反映清代台灣麻類作物種植的普遍性。1920年代，因地處台中舊城核心之西側，「麻園頭」正式改制為「西區」。日治時期，台中州廳、台中刑務所等重要官署機構陸續在西區周邊設立，加上台中公園、綠川、柳川等綠帶水岸貫穿其間，西區逐漸發展成台中市重要的行政與商業核心地帶。如今西區因鄰近國立自然科學博物館、審計新村與草悟道等文創景點，已從清代單純的黃麻產地，轉型為台中市極具人文氣息的生活商圈。"],
    ["台中市","北區","賴厝廍","北區舊稱賴厝廍，因清代賴姓家族在此經營製糖廍（糖廠）而得名，日治後因位於台中舊城之北改稱北區。","","北區地名由來與清代的糖業經濟密切相關：這一帶清代由賴姓家族族人聚居開墾，並在此設立「廍」——即傳統以牛力或水力帶動石車榨甘蔗汁、熬煮成糖的加工設施，因賴姓為當地主要姓氏，這座糖廍便被稱為「賴厝廍」，是台灣早期糖業聚落常見的姓氏加產業設施命名模式，類似地名在台灣中南部糖業興盛地區相當普遍。1920年代，因地處台中舊城核心之北側，「賴厝廍」正式改制為「北區」。北區境內因國立台中科技大學、國立中興大學（部分校地）等高等教育機構林立，加上一中商圈的興起，已從清代的糖業加工聚落，發展成台中市重要的文教與青年商圈，一中街更是全台知名的學生商圈之一，與其糖業起源形成饒富趣味的今昔對比。"],
    ["台中市","北屯區","三十張犁","北屯舊稱三十張犁，因清代開墾面積達一百五十甲（三十張犁）而得名，日治後因位於西大墩之北改稱北屯。","","北屯地名源自清代拓墾面積的計算方式：台灣早期漢人拓墾以「張犁」作為計算開墾規模的單位，一張犁約可耕作五甲土地，這片墾地面積恰好達到一百五十甲，換算下來正好是三十張犁，因而得名「三十張犁」，與台北大安、桃園龍潭、新竹六家等地的「張犁」系列地名，屬於同一套計量式命名邏輯。清代因此地開闢了聯繫台中盆地與大坑山區的官道（約今自由路、雙十路、北屯路一帶），三十張犁逐漸發展成往來要衝。1920年代，因地處西屯（西大墩）之北方，「三十張犁」正式改制為「北屯」，這也呼應了與其相對的西屯、南屯，共同構成因大墩（今中區）東西南北方位而命名的行政區劃系統。北屯區因面積廣闊、人口眾多，如今是台中市人口最多的行政區。"],
    ["台中市","西屯區","西大墩","西屯舊稱西大墩，因位於大墩（今中區）之西側而得名，早期為廖姓宗親聚落，日治後簡化為西屯。","","西屯地名由來相對單純：這一帶因位於清代台中盆地核心聚落「大墩街」（今中區）的西方，加上當地也有一座類似大墩的小土丘（俗稱墩仔頂），故稱「西大墩」，與東側的大墩街合稱「東大墩、西大墩」；西大墩地當犁頭店（今南屯區）與壩雅（今大雅區）之間的交通要衝，清道光年間發展成街肆。西大墩早期是廖姓宗親的主要聚居地，至今西屯一帶仍有許多廖姓家族世居於此。1920年，日本殖民政府推行地方行政改制，將「西大墩」簡化為「西屯」，隸屬台中州大屯郡，這也是「大屯」（今北屯、西屯、南屯共同的郡名淵源）一詞的由來。如今西屯區因台灣大道、台中國家歌劇院與逢甲商圈的發展，已從清代廖姓宗親聚落，轉型為台中市最重要的新興都會核心區之一。"],
    ["台中市","南屯區","犁頭店","南屯舊稱犁頭店，因清代此地聚集打造犁頭、鋤頭等農具的鐵匠店鋪而得名，日治後因位於大墩之南改稱南屯。","","南屯是台中盆地開發最早的漢人聚落之一，地名由來直接反映了清初的產業型態：拓荒時期，這一帶聚集了許多專門打造犁、鋤等墾耕用具的鐵匠店鋪，因而得名「犁頭店」，是台灣地名中依手工業聚落直接命名的典型案例，與台南、彰化等地同名的犁頭店聚落，都反映了清初農具鍛造業對聚落發展的重要性。犁頭店因地處貓霧捒社（平埔族拍瀑拉族分支）傳統領域，加上鄰近旱溪、筏子溪，是漢人與平埔族群交會拓墾的重要據點。1920年，日本殖民政府推行地方行政改制，因地處大墩（今中區）之南方，「犁頭店」正式改稱「南屯」。如今南屯區因鄰近台中高鐵站與台中市政府所在的七期重劃區，已從清代打造農具的鐵匠聚落，蛻變為台中市最具代表性的新市政中心與豪宅聚落。"],
    ["台中市","太平區","鳥榕頭","太平舊稱鳥榕頭，因霧峰林家先人故居前有兩棵大榕樹而得名，另有一說源自清代漢人與洪雅族衝突後祈求太平之意。","","太平地名的由來流傳著多種說法。「鳥榕頭」一說源自清乾隆末年，霧峰林家第四房林石之四子林棣，在開渠闢田成功後，成為當地最大墾首，其故居前種有兩棵大榕樹（台語「鳥榕」即榕樹之意），因而得名；另一說則因入山口福德祠附近有一棵大榕樹而得名。此外，《彰化縣志》等古文書中，也多以「鳥銃頭」稱呼此地，「鳥銃」是清代常見的火器，因當地鄰近內山、原為土牛界外，居民為防禦原住民威脅而擁槍自保，加上林棣之孫林瑞麟平日雙槍不離腰，居民尊稱其「鳥銃頭」，這也是另一種地名由來的說法。至於「太平」這個吉祥地名，一說是清乾隆年間漢人與洪雅族衝突頻繁、傷亡慘重，村莊建立之初便寄託「太平」的願望而命名；另一說則指日治初期日軍推進至此，因當地居民溫和未加抵抗，日軍指揮官讚嘆「此地真是太平」，因而定名。如今太平區因枇杷、龍眼等丘陵農作聞名，是台中市面積第二大的行政區。"],
    ["台中市","大里區","大里杙","大里舊稱大里杙，源自平埔族洪雅族社名譯音，「杙」則指早期船隻停靠時用來繫船固定的木樁。","","大里舊稱「大里杙」，這個地名結合了平埔族社名與河運聚落的雙重意涵：「大里」一詞普遍認為源自洪雅族社名的音譯，反映當地原是平埔族傳統領域；「杙」則是閩南語中指稱木樁的用字，早期大里地處大肚溪支流大里溪（大里杙溪）沿岸，往來船隻停靠時，須以木樁「杙」將船身固定於岸邊，因而在社名之後加上「杙」字，合稱「大里杙」，形容這是一處設有繫船木樁的河港聚落。清代大里杙因水運便利，一度是台中盆地重要的物產集散地，霧峰林家的崛起也與大里杙的拓墾開發密切相關。1920年，日本殖民政府推行地方行政改制，將「大里杙」簡化為「大里」，沿用至今。如今大里區因鄰近台中市區、交通便利，是台中市人口成長最快速的行政區之一。"],
    ["台中市","霧峰區","阿罩霧","霧峰舊稱阿罩霧，一說因聚落地處鳳山山麓、晨間常有濃霧籠罩而得名，一說源自平埔族社名音譯，因霧峰林家而聞名全台。","","霧峰地名由來流傳著兩種說法：第一種說法認為，這一帶聚落建於鳳山山麓，因地形因素每逢清晨常有濃霧瀰漫籠罩，因而得名「阿罩霧」；第二種說法則指出，「阿罩霧」實際上是當地平埔族貓霧捒社群「阿罩霧社」的社名音譯，台灣地名中凡冠以「阿」字者，多屬原住民社名的音譯，例如阿束、阿冷等地皆是如此，漢人初入墾時原稱此地為「貓羅新莊」，其後才改稱「阿罩霧」。無論何種由來，霧峰因清代「霧峰林家」的崛起而聲名遠播：林家先祖林石自福建渡海來台，其後代林文察、林朝棟等人因協助清廷平定戴潮春事件、中法戰爭有功，官位顯赫，成為清代台灣少數官居高位的本土家族，林家花園（今霧峰林家宮保第園區）至今仍是全台規模最大的清代官宅建築群。1920年，「阿罩霧」正式改稱「霧峰」，沿用至今。"],
    ["台中市","烏日區","湖日","烏日舊稱湖日，一說源自平埔族語音轉，一說因境內多條溪流匯入大肚溪、地勢呈現凹陷（烏日）之勢而得名。","","烏日地名由來眾說紛紜，早期文獻曾出現「凹入」「湖日」「烏日」等多種寫法。第一種說法認為，這一帶是拍瀑拉族傳統領域，「烏日」可能源自平埔族語的音譯轉寫；第二種說法則從地形出發，指出貓羅溪、烏溪、草湖溪、旱溪等多條河川皆在此匯入大肚溪，因而地勢呈現明顯的凹陷之勢，閩南語稱這種低窪地形為「凹入」，清代文獻便以諧音字「湖日」「烏日」記載，反映了先民依地形特徵命名地方的普遍作法。烏日因地處大肚溪、烏溪、貓羅溪等多條河川交會之處，是清代台中盆地重要的水運轉運據點；如今更因高鐵台中站、台鐵烏日站雙鐵共構於此，成為中台灣最重要的軌道運輸樞紐，這個曾經因河川匯集而地勢凹陷得名的地方，如今反而因交通匯集而成為中台灣的門戶。"],
    ["台中市","豐原區","葫蘆墩","豐原舊稱葫蘆墩，源自巴宰族語音譯，一說因境內屯腳、屯頭、屯身三座小丘形似葫蘆而得名，日治時期取「豐葦原之瑞穗國」典故改稱豐原。","","豐原舊稱「葫蘆墩」，這個地名的由來主要有兩種說法：一說源自平埔族巴宰族「葫蘆墩社」社名的音譯，該社原是境內岸裡社群的重要聚落之一；另一說則從地形出發，指境內有屯腳、屯頭、屯身三座相連的小土丘，因整體形狀神似葫蘆，因而得名。清末，因當地土壤肥沃、物產豐饒，台灣巡撫劉銘傳曾將此地稱為「富春鄉」，並有「小蘇州」的美譽。1920年，日本殖民政府推行地方行政改制，取自日本天皇詔書中「豐葦原之瑞穗國」的典故字句，將「葫蘆墩」正式改稱「豐原」，這也是台灣少數直接引用日本皇室詔書典故命名的地名案例。豐原境內豐原區公所所在地一帶因盛產優質稻米「葫蘆墩米」而聞名，如今則以廟東夜市、豐原漆藝與伴手禮糕餅業聞名，是台中市山城與海線交會的重要商業與交通樞紐。"],
    ["台中市","后里區","內埔","后里舊稱內埔，因聚落建於平埔族巴宰族麻薯社（岸裡社群）之後方而得名，1955年因與屏東縣內埔鄉同名而改稱后里。","","后里舊稱「內埔」，這個地名由來相對單純：這一帶清代聚落最初創建於平埔族巴宰族「麻薯社」（岸裡社群的一支）居住地的後方，因而得名「內埔」，其聚落核心早期又稱「屯子腳」，並分為屯頂、屯下兩部分。1955年，因台灣行政區劃中屏東縣同樣設有一個「內埔鄉」，兩地容易造成郵務與行政上的混淆，台中的內埔鄉便依「後」與「后」同音同義的關係，正式改稱「后里鄉」，這與苗栗西湖鄉因與雲林四湖鄉同名而改名的案例，屬於同一類因行政區重名而更改地名的特殊情形。后里因大甲溪沖積而成的河階台地，土壤肥沃、氣候適宜，是台灣重要的花卉（尤其是百合花）與馬場產業重鎮，每年舉辦的台灣國際花卉博覽會（2018年）便選定后里作為主要展區之一，讓這個因地處平埔族聚落後方而得名的地方，發展出獨具特色的花卉觀光產業。"],
    ["台中市","石岡區","石崗仔","石岡舊稱石崗仔，因上坑溪與下坑溪在此匯流、河流出谷口形似陶缸（硿）而得名。","","石岡地名由來源自當地特殊的河谷地形：上坑溪與下坑溪兩條溪流在石岡區南方匯合，河水流出谷口時因地形收束，形狀神似傳統陶製容器「缸」（閩南語亦寫作「硿」），加上大甲溪河床在此堆積大量石礫，因而得名「石崗仔」，其後簡化為「石岡」。石岡地處大甲溪沖積扇頂端，是台中山城地區重要的水利樞紐：1976年完工的石岡壩，是大甲溪引水灌溉與提供大台中地區民生用水的重要水利設施；1999年921大地震震央即位於石岡附近，石岡壩壩體因斷層錯動而嚴重受損，是當年地震重建的重要地標之一，如今壩區已規劃為地震紀念公園，供後人認識這段天災與水利建設交織的歷史。石岡因客家人口比例較高，也是大台中地區重要的客家文化聚落之一。"],
    ["台中市","東勢區","東勢角","東勢舊稱東勢角，客家話「勢角」意指某一方向的角落，因位於台中盆地東側山區的一個角落而得名。","","東勢地名由來源自客家語彙對地理方位的獨特表達方式：客家話中「勢角」一詞，意指某一個方向的角落地帶，東勢地處台中盆地東側、緊鄰大甲溪與雪山山脈餘脈交界的丘陵地帶，客籍移民依其相對於盆地的方位，將此地稱為「東勢角」，日治時期簡化為「東勢」，沿用至今。東勢清代原是平埔族巴宰族「樸仔籬社」的傳統領域，因地處漢人與泰雅族交界前緣，是重要的樟腦、木材集散地，客家移民大量湧入後，逐漸發展成大甲溪上游山城地帶的商業重鎮，境內至今仍保留完整的東勢老街與客家伙房建築群。東勢因氣候溫和、日夜溫差大，是台灣重要的高接梨（東勢高接梨）產地，享有「水果之鄉」美譽，每年舉辦的「東勢客家歌謠比賽」與采風節，也是地方重要的客家文化推廣活動。"],
    ["台中市","和平區","和平","和平區清代至日治時期屬不設街庄界的高山原住民地帶，戰後取「四維八德」中的「和平」二字為區名。","","和平區是台中市面積最大、唯一的山地原住民區，境內大部分為雪山山脈與中央山脈北段的高山地帶，是泰雅族傳統領域。這片山區在清代及日治時期，長期被劃為不設一般街庄行政界線的「高山地帶」，直接由理蕃機構或警察系統管轄，未如平地聚落般擁有正式的漢語地名。戰後，國民政府在此設立山地鄉行政區時，取「四維八德」傳統道德教條中的「和平」二字作為鄉名，賦予這片曾經是原漢衝突前緣地帶的山區一個充滿期許的嶄新名稱，2010年台中縣市合併升格直轄市後，改制為和平區，沿用至今。和平區境內因海拔落差大，蘊藏豐富的溫泉、高山蔬果與林業資源，谷關溫泉、梨山果園、大甲溪上游的松鶴、環山部落等地，都是境內著名的觀光與泰雅族部落所在地。"],
    ["台中市","新社區","新社仔","新社原稱新社仔，因平埔族巴宰族山頂社人受漢人拓墾壓力所迫，向東遷移至此另建新聚落而得名。","","新社地名由來與一段平埔族被迫遷徙的歷史密切相關：清代中葉以前，巴宰族朴仔籬社群原分布於豐原、東勢、石岡一帶，隨著漢人拓墾勢力不斷向山區推進，其中一支「山頂社」（Santonton）族人被迫離開原居地，向東遷移至今日新社一帶另建聚落，這處新建立的小型聚落因而被稱為「新社仔」，簡化後成為今日的「新社」地名，未待這些族人遷入埔里盆地之前，新社便是他們暫居的過渡之地。新社區因地處大甲溪河階台地，海拔約400至700公尺，日夜溫差大、雲霧繚繞，氣候條件類似高山茶區，發展出獨具特色的新社高接梨、香菇與莊園式葡萄酒產業，境內的「新社古堡」歐式莊園與「花海節」更是台中市熱門的觀光景點，讓這個因平埔族遷徙而得名的山城，轉型為結合農業與休閒觀光的知名景區。"],
    ["台中市","潭子區","潭仔墘","潭子舊稱潭仔墘，因聚落建於柳川上游凹岸深水處旁，閩南語稱深水處為「潭」、水邊為「墘」而得名。","","潭子地名由來源自當地的河川地形：柳川（舊稱邱厝仔溪）上游流經此地時，因河道彎曲形成凹岸侵蝕坡，水流在此處匯聚成較深的水潭，閩南語稱溪流中的深水處為「潭」，水邊際緣則稱「墘」，這處建於深水潭岸邊的聚落，因而得名「潭仔墘」，1920年簡化為「潭子」，沿用至今。潭子區清代原是平埔族巴宰族「阿里史社」的傳統領域，境內石牌公園內保存的「禁示碑」，見證了清代官府調解漢人與阿里史社土地糾紛的歷史；1731年「大甲西社事件」爆發後，阿里史社等十餘個平埔族社群曾聯合圍攻彰化縣城，是清代台灣中部平埔族群反抗漢人拓墾壓迫的重要歷史事件之一。如今潭子區因鄰近豐原、台中市區，加上潭子加工出口區的設立，已從清代平埔族聚落，發展成台中市重要的工商業與住宅衛星市鎮。"],
    ["台中市","大雅區","壩仔","大雅原稱壩仔，源自平埔族巴宰族岸裡社群「阿河巴」荒埔之意，客家話稱河邊草埔為「壩仔」，與台語「埔仔」同義。","","大雅地名由來源自平埔族語與客家拓墾用語的結合：這一帶清代原是巴宰族岸裡社群所屬「阿河巴」（或稱阿河壩）荒埔，是尚未開墾、水源尚稱豐沛的河濱草埔地。漢人（尤其是客籍移民）進墾後，依平埔族原有的「阿河巴」稱呼，並套用客家話中稱呼河壩草埔為「壩仔」的用語（與台語「埔仔」意義相通），將此地簡稱為「壩仔」。1920年，日本殖民政府推行地方行政改制，將「壩仔」改以較為典雅的近音字「大雅」取代，沿用至今，這種因追求文雅而選字、卻與地名原始語意（河邊荒埔）幾乎無關的更名方式，在台灣地名史上並不少見。大雅區因大甲溪沖積扇地形，土壤肥沃、氣候適宜，是全台最大的小麥產區，享有「小麥的故鄉」美譽，也是台中市重要的花卉與蔬果專業區。"],
    ["台中市","神岡區","新廣","神岡舊稱新廣，因最初移民多來自廣東嘉應州「神岡社」而得名，另有一說與道光年間分類械鬥時神明庇護傳說有關。","","神岡地名由來流傳著幾種說法：第一種說法指出，最初移入這片墾地的移民，大多來自廣東省嘉應州鎮平縣一處名為「神岡社」的原鄉聚落，因而依原鄉地名稱此地為「神岡」，《彰化縣志》則以諧音記載為「新廣莊」，這種依原鄉地名為新墾地命名的方式，在客家移民拓墾史上相當常見；另一種在地流傳的說法則認為，道光年間台灣分類械鬥頻仍之際，神岡路上的八仙寺曾因李仙祖神明指示族人聚集於此便能保平安，靈驗的庇護傳說（「神講」）以諧音轉化為「神岡」地名。1920年，日本殖民政府推行地方行政改制，正式將「新廣」改稱「神岡」，沿用至今。神岡境內的岸裡社，清代曾是巴宰族岸裡社群的核心聚落，也是清廷推行「以番制番」政策、借重岸裡社武力平定多次民變的重要據點。"],
    ["台中市","大肚區","大肚","大肚地名源自平埔族拍瀑拉族大肚社，清代這一帶更曾是統轄中部十餘社群的「大肚王國」核心領域。","","大肚地名源自平埔族拍瀑拉族「大肚社」的社名。更令人驚訝的是，早在荷蘭統治時期的文獻記載中，大肚一帶其實是一個跨部落政治實體「大肚王國」的核心領域：這個王國統治期間約自16世紀中葉延續至1732年，轄下涵蓋拍瀑拉、巴則海、道卡斯、洪雅、巴布薩等不同語族共十九至二十個部落，1722年巡臺御史黃叔璥的《臺海使槎錄》甚至記載「大肚山形，遠望如百雉高城，昔有番長名大眉」，印證了17世紀台灣中部確實存在一個具有相當規模的原住民政治組織。1731年，因清廷官員濫殺前來協助運糧的大肚社「良番」，引爆大肚社聯合沙轆社、牛罵頭社等十餘社群圍攻彰化縣城的武裝抗爭事件，史稱「大甲西社事件」，事件平定後大肚王國的勢力也隨之瓦解，其後裔多遷往埔里盆地定居。如今大肚區境內的磺溪書院，是台中僅存少數保存完整的清代書院建築之一。"],
    ["台中市","沙鹿區","沙轆","沙鹿舊稱沙轆，源自平埔族拍瀑拉族沙轆社社名，1731年大甲西社事件後遭清廷強迫更名遷善社，1920年改稱沙鹿。","","沙鹿地名源自平埔族拍瀑拉族「沙轆社」（Salach）的社名，該社世居於大肚山西麓的沙鹿平原，是拍瀑拉族四大社群之一。1731年（雍正9年）「大甲西社事件」爆發，沙轆社加入反抗清廷的行列，隔年遭到官兵血腥鎮壓，幾乎慘遭滅族，清廷平定亂事後，為表達「懲戒與教化」之意，強迫將沙轆社改名為「遷善社」，與同時期被改名的大甲西社「德化社」、牛罵社「感恩社」、貓盂社「興隆社」，都帶有清廷刻意羞辱、施加政治教化色彩的意味，是清代原住民政策中相當黑暗的一頁。事件過後，沙轆社元氣大傷，土地逐漸被閩粵移民以租、買等方式取得，族人或遠徙、或逐漸漢化融入。1920年，日本殖民政府推行地方行政改制，將「沙轆」正式改稱「沙鹿」，沿用至今，如今沙鹿因臺中港開發帶動，已從拍瀑拉族傳統領域轉型為工商業重鎮。"],
    ["台中市","龍井區","龍目井","龍井原稱龍目井，源自大肚台地西麓斷層線上一處湧泉，因井旁兩塊石頭狀似龍的雙眼而得名。","","龍井地名源自一處真實存在的天然湧泉：大肚台地西麓的斷層線上，地下水源豐沛，形成一處終年湧流不絕的泉井，清代文人郁永河在其著作《裨海紀遊》中記載：「龍目井，……旁有兩石，狀若龍目，故名」，直接說明了因井旁兩塊石頭形似龍的雙眼，因而得名「龍目井」，是清代台灣中部拓墾史上相當知名的一處水源地標。這處湧泉在清代是當地重要的灌溉水源，也是漢人選擇在此定居拓墾的關鍵因素之一。1920年，日本殖民政府推行地方行政改制，將「龍目井」簡化為「龍井」，沿用至今。龍井區清代原是平埔族拍瀑拉族「水裡社」的傳統領域，如今因台中港特定區與台中彩虹眷村等景點，已從清代單純依賴湧泉灌溉的農業聚落，發展成兼具工業區與觀光景點的行政區。"],
    ["台中市","梧棲區","五汊港","梧棲舊稱五汊港，因牛罵頭溪出海口分為五條扇狀水道分流而得名，後取諧音雅字改稱梧棲港。","","梧棲地名由來源自河口三角洲的水文地形：牛罵頭溪（今清水地區溪流）流至出海口附近時，因泥沙沖積形成小型三角洲，河道在此分歧為五條扇狀分流的水汊，因而得名「五汊港」，《彰化縣志》中則寫作「五叉港」。其後，先民取「五汊」的諧音，選用較為典雅的「梧棲」二字取代，這種因追求字面優雅、而以同音或諧音字取代原本地形描述用字的命名方式，在台灣地名演變中相當常見。梧棲另有一別稱「鰲西」，因地處鰲峰山（即今清水牛罵頭山）之西側而得名。梧棲因位處大甲溪與大肚溪之間的海岸線中段，清代已是重要的漁港與貨物吞吐口，日治及戰後時期，隨著台中港（原稱台中商港）於梧棲外海興建完工，梧棲從傳統的河口小漁港，躍升為中台灣最重要的國際商港門戶，也是全台知名的漁獲直銷與海鮮餐飲聚落。"],
    ["台中市","清水區","牛罵頭","清水舊稱牛罵頭，源自平埔族拍瀑拉族牛罵社社名，1920年因當地「埤仔口泉」水質清澈而改稱清水。","","清水舊稱「牛罵頭」，源自平埔族拍瀑拉族「牛罵社」（Gomach）的社名音譯，是拍瀑拉族四大社群中最北的一支，1731年大甲西社事件後，牛罵社同樣遭清廷強迫改名為「感恩社」，以示教化之意。1920年，日本殖民政府推行地方行政改制，考量牛罵頭街上有一處名為「埤仔口泉」的湧泉，泉水終年清澈甘美，因而以「清水」二字取代原本的「牛罵頭」，是台灣少數因當地水質特色而更名、且沿用至今廣為人知的地名案例。清水地區因大甲溪沖積扇與清水隆起海岸平原地形，自古便是重要的農業與航運據點，境內牛罵頭遺址是台灣中部重要的史前文化遺跡，見證此地數千年來的人類活動歷史；清水鰲峰山、高美濕地與清水眷村文化園區，也讓這座因清澈泉水得名的海線市鎮，兼具生態、歷史與文化觀光的多重魅力。"],
    ["台中市","大甲區","大甲","大甲地名源自平埔族道卡斯族聚落，「道卡斯」（Taokas）一詞的學術族名，甚至反過來是因發音近似「大甲」而得名。","","大甲與台灣其他多數「因原住民社名而得漢語地名」的案例不同，兩者的命名關係其實是雙向的：大甲地區清代是道卡斯族的主要活動範圍，涵蓋大甲東社、大甲西社、日南社、雙寮社等聚落，漢人依當地原住民自稱的音譯，將此地稱為「大甲」；然而，1904年日本學者伊能嘉矩為這群分布於新竹、苗栗、台中沿海一帶的平埔族群，以語言學方法歸類命名時，卻是因「道卡斯」（Taokas）一詞的閩南語發音類似「大甲」，才反過來將這個族群正式命名為「道卡斯族」，這種地名與族名相互影響、甚至倒果為因的命名過程，是台灣地名史上相當特殊的案例。1731年「大甲西社事件」（林武力抗清事件）爆發，是清代台灣中部平埔族群規模最大的武裝反抗行動之一，事件平定後，大甲西社遭清廷改名為「德化社」。大甲如今以媽祖遶境進香、奶油酥餅與藺草編織聞名全台，是台灣海線最具代表性的信仰與物產重鎮。"],
    ["台中市","外埔區","外埔","外埔因位處內埔（今后里）外側的埔地而得名，是道卡斯族大甲東社的傳統領域。","","外埔地名由來相對單純，源自其與鄰近聚落的相對地理位置：清代漢人拓墾勢力由海岸線一帶（近海處，俗稱「外」）向東側內陸擴展時，將位於「內埔」（今后里區，因地處聚落內側而得名）之外的這片埔地，稱為「外埔」，以區別兩處拓墾範圍的先後與相對位置，這種依內外方位對應命名的方式，與台北「內湖」對應「外湖」等地名，屬於相似的邏輯。外埔原是平埔族道卡斯族「大甲東社」的傳統領域，蓬山八社中的大甲東、大甲西兩社，便是以境內的鐵砧山為界劃分，鐵砧山以東屬大甲東社，因該社在1731年大甲西社事件中選擇配合清廷而未遭波及，得以保留原有社名，未如大甲西社般被強迫改稱。外埔區因地勢平坦、水源充足，是台中市重要的水稻與葡萄產區，境內鐵砧山風景區因鄭成功「劍井」傳說而聞名，是台中海線地區重要的歷史與農業觀光景點。"],
    ["台中市","大安區","海翁窟港","大安在明末稱海翁窟港，因港灣時有鯨魚（海翁）出沒而得名，另有一稱勞施港，形容航道迂迴如螺殼紋路。","","大安舊稱由來相當富有畫面感：明末文獻記載，這處港灣因時常有鯨魚（閩南語稱鯨魚為「海翁」）洄游出沒，因而得名「海翁窟港」；另有一稱「勞施港」（又寫作螺絲港），形容船隻進出這處港灣時，航道必須迂迴繞轉兩處沙嘴，路徑彎曲有如螺殼上的螺旋紋路，1764年（乾隆29年）《續修臺灣府志》中即已記載「勞施港」之名。這片海岸沙洲地帶因地勢低平、緊鄰海岸，先民依方位稱之為「海墘」（意指海邊），也是大安地名演變過程中曾出現的另一種稱呼。大安因大安溪出海口的優良港灣條件，清代曾是中部重要的貿易港口之一，1841年鴉片戰爭期間，英國商船「阿吶號」在此觸礁擱淺，遭岸上民勇圍攻俘虜，史稱「大安之役」，是清代台灣少見與西方列強直接軍事衝突的歷史事件之一。如今大安以濱海樂園、西瓜產業與大安漁港聞名，是台中海線最北端的行政區。"],
    ["台中市","梨山","斯拉茂","梨山舊稱斯拉茂（Slamaw），是泰雅族先祖翻越雪山山脈北遷擴散的重要據點，因日治後引進溫帶水果種植而改稱梨山。","","梨山地名源自泰雅族語「Slamaw」（日治時期日文寫作「サラマオ」，音譯為斯拉茂、薩拉矛或沙拉茅），是大甲溪上游流域重要的泰雅族傳統聚落。根據泰雅族口傳歷史，族人祖先自更南方的原居地沿北港溪上游向北翻越分水嶺遷徙擴散，在大甲溪谷尾端與蘭陽溪分水嶺的思源埡口一帶，Pinsbkan家族衍生出向北、向東、向東北遷徙的三大支系，斯拉茂正是這波遷徙擴散過程中位於大甲溪上游流域的重要據點之一，與松茂、佳陽、環山（志佳陽）等地並稱「斯拉茂群」（或薩拉茅群）。1956年中橫公路動工興建後，這處高山地區因氣候冷涼、日夜溫差大，特別適合溫帶水果生長，政府引進蘋果、水梨等果樹試種成功後，便將這片山區改稱「梨山」，取代了原本的泰雅族地名，如今梨山已是台灣最知名的高山水果與茶葉產區之一，也是中橫公路最重要的中繼站。"],
    ["台中市","谷關","明治溫泉","谷關因1960年中部橫貫公路通車，行經此地的溪谷有如一道天然關卡而得名，日治時期曾稱明治溫泉。","","谷關舊稱「明治溫泉」，因1907年當地泰雅族人發現溫泉露頭，直到1927年才由台中州政府撥款、配合民眾捐獻興建公共浴場正式開發，並依日本明治天皇年號命名，且依海拔高低分為上明治（今上谷關）、下明治（今下谷關）。1956年，政府為貫通台灣東西兩岸，選定大甲溪河谷路線動工興建中部橫貫公路，谷關正位於這條路線的重要節點；由於中橫公路行經此地的谷口地形險要，山岩崢嶸矗立，兩側高山夾峙，形如一道天然關卡，因而在1960年5月中橫公路通車典禮時，正式將此地命名為「谷關」，取代了日治時期的「明治」舊稱。谷關溫泉屬弱鹼性碳酸泉，泉質清澈無硫磺味，相傳日本明治天皇曾泡湯後得子，因而衍生出「生男湯」的民間傳說。如今谷關因溫泉觀光與谷關、捎來等歷史吊橋景觀，是中部橫貫公路沿線最重要的溫泉度假勝地。"],
    ["台中市","逢甲","逢甲","逢甲因鄰近私立逢甲大學而得名，該校為紀念清末抗日保台的愛國詩人丘逢甲而命名，逢甲商圈已是全台知名夜市。","","逢甲地區的地名由來，與一位清末抗日愛國詩人密切相關：丘逢甲是清光緒年間的進士，1895年馬關條約割讓台灣後，他曾號召台灣仕紳成立「台灣民主國」，力主抗日保台，雖然行動最終失敗，仍留下「宰相有權能割地，孤臣無力可回天」等膾炙人口的詩句，被後世視為台灣近代史上重要的愛國象徵人物。1961年，一群有志之士在西屯區籌辦私立學校時，為紀念丘逢甲的愛國精神，將學校命名為「逢甲工商學院」（今逢甲大學），校址周邊的地區也因此逐漸以「逢甲」作為通稱，取代了原本的行政區劃地名。隨著逢甲大學師生人數增加，加上鄰近文華夜市（今逢甲夜市）的興起，逢甲商圈迅速發展成全台規模數一數二、以小吃聞名的觀光夜市，每年吸引大量國內外遊客造訪，讓「逢甲」從單純紀念歷史人物的校名，演變成台中市最具代表性的商業與觀光地標之一。"],
    ["台中市","高美","高密","高美舊稱高密，因清代此地聚落地勢較高、林木茂密而得名，日治後改為較文雅的「高美」，境內高美濕地聞名全台。","","高美地名由來相對單純，清代這一帶因地勢略高、林木植被茂密，先民依此地形特徵稱之為「高密」。1920年，日本殖民政府推行地方行政改制，考量「高密」二字字面略顯粗獷，遂取其諧音、改以較為典雅美觀的「高美」取代，沿用至今，這種單純因字面美感考量而更改用字、卻與原始地形意涵幾乎無關的命名調整，在台灣地名演變史上相當常見。高美地處清水區大甲溪出海口南側，因地勢平坦、潮間帶廣闊，加上台中港防波堤興建後改變了當地的水文與泥沙沉積條件，意外形成一片面積廣達1500公頃的高美濕地，是台灣少數幾處大規模雁鴨集體棲息與繁殖地之一，園區內特有的雲林莞草生態、風力發電風車林立的景觀，加上夕陽美景，讓高美濕地成為台中市近年最熱門的生態旅遊景點之一，也讓這個原本描述地形的舊地名，因濕地生態保育而重新聲名大噪。"],
    ["台中市","成功","成功嶺","成功因鄰近成功嶺（大專院校集訓中心）而得名，取「精誠團結、邁向成功」的訓練期許之意。","","成功地區的地名由來，與戰後台灣大專院校學生軍事訓練的歷史密切相關：這一帶原是台中盆地南側的丘陵台地，戰後政府在此設立軍事訓練基地，做為大專院校學生接受入伍前基礎軍事訓練（俗稱「成功嶺集訓」）的重要場所，數十年來一屆又一屆的青年學子在此接受磨練，「上成功嶺」一度成為台灣男性青年成長過程中共同的重要記憶，訓練基地便以寄託「邁向成功」期許的「成功嶺」為名。隨著這座訓練基地的知名度不斷提升，周邊地區也逐漸以「成功」作為通稱，甚至超越了原本行政區劃上的地名。如今成功嶺仍是國軍重要的教育訓練基地之一，雖然大專集訓的規模已不若從前，但「成功嶺」這個充滿時代記憶與勵志意涵的地名，至今仍深植於許多台灣民眾的共同記憶之中。"],
    ["台中市","追分","追分","追分因日治時期海線、山線鐵路在此交會分岔而得名，「追分」為日語詞彙，意指道路的分歧點。","","追分地名直接借用自日語詞彙：「追分」（おいわけ，Oiwake）在日語中原意指道路或鐵道的分歧點，日本本土本就有多處同名地名。1920年，台灣總督府鐵道部完成縱貫線海線鐵路的興建，這條新闢的海線鐵路與原本的山線鐵路，恰好在今日烏日、大肚交界處會合分岔，鐵道部便依日語「分歧點」的詞彙，將這處新設車站命名為「追分驛」，戰後沿用為「追分車站」，並成為周邊地區的通稱地名。追分車站至今仍保留日治時期興建的木造站房，是台灣少數保存完整的日治小型車站建築之一；因「追分」與「永保安康」（大甲車站舊稱「日南」的諧音）等鐵路車站名稱，被鐵道迷賦予「追分（永不）分手、永保安康」的祝福意涵，追分車站的車票因而成為情侶間熱門的紀念小物，讓這個原本單純描述鐵道地形的日語地名，意外演變成充滿浪漫寓意的觀光話題。"],
    ["台中市","日南","日南社","日南因源自平埔族道卡斯族蓬山八社之一的「日南社」而得名，境內日南車站因與「永保安康」車票組合聞名。","","日南地名源自平埔族道卡斯族「日南社」的社名，是清代「蓬山八社」（原稱崩山八社）之一，與大甲東社、大甲西社、雙寮社等同屬蓬山地區平埔族部落聯盟成員，主要分布於今日大甲、大安一帶。日治時期，縱貫鐵路海線通車後，在日南社傳統領域範圍內設立「日南驛」，戰後沿用為日南車站。日南車站因與另一座知名車站「追分」搭配，衍生出「日南（永保）安康、追分（永不）分手」的祝福諧音組合，兩地車票因而成為台灣鐵道迷與情侶間熱門的紀念小物，帶動一波車站觀光風潮，讓這個源自平埔族社名的百年小站，意外因鐵道文化而重新受到矚目。日南車站至今仍保留日治時期興建的木造站房建築，是海線鐵路沿線珍貴的歷史車站之一。"],
    ["台中市","泰安","大安","台中泰安舊站原稱大安，因位於大安溪畔而得名，1954年為與苗栗泰安鄉同名而不便，改稱「泰安」，如今舊站已轉型為鐵道文化園區。","","台中后里的泰安車站，其地名演變與苗栗縣泰安鄉頗有淵源：這座位於山線鐵路上的車站，因鄰近大安溪畔，最初命名為「大安驛」，然而由於台中州（今台中縣市）與新竹州（今苗栗縣）境內，皆有以「大安」為名的行政區或車站，容易造成混淆，1954年遂比照苗栗大安鄉改名為泰安鄉的邏輯，將車站正式改稱「泰安車站」，取「國泰民安」的吉祥寓意，同時也巧妙保留了「大安」的諧音。1998年，隨著山線鐵路截彎取直、新泰安車站啟用，這座興建於1908年、擁有超過百年歷史的舊泰安車站因而功成身退，卻幸運地未遭拆除，反而因保存完整的檜木站房建築與周邊鐵道遺跡，被指定為台中市歷史建築，並轉型為「泰安鐵道文化園區」，成為鐵道迷與遊客造訪山城時，認識台灣鐵道發展史的重要景點。"],

    // --- 【彰化縣】 ---
    ["彰化縣","彰化市","半線","彰化市舊稱半線，源自平埔族巴布薩族「半線社」譯音，清雍正元年設縣時取「彰顯皇化」之意改稱彰化。","","彰化市舊稱「半線」，源自平埔族巴布薩族「半線社」的社名音譯，該社原居於今彰化市光南里一帶，是清代彰化平原十個平埔族社之一。雍正元年（1723年），清廷鑑於半線一帶開發日盛、人口漸增，遂在此地另設新縣，福建巡撫王紹蘭於〈彰化縣碑記〉中寫下「實獲眾心、保域保民、彰聖天子、丕昌海隅之化歟」，取其中「彰」「化」二字，寓意「彰顯皇化」，正式定名為彰化縣，縣治便設於半線。值得一提的是，彰化在地文史工作者曾考證指出，清代文獻中「半線社」與「半線莊」「半線街」實為不同層級的聚落單位，不應混為一談，甚至主張彰化市真正的舊稱應是「磺溪」（因大肚溪支流磺溪流經而得名），而非籠統地稱為半線，顯示地方史考據仍存在不同觀點。彰化市因八卦山大佛而聞名全台，是中台灣重要的信仰與交通樞紐。"],
    ["彰化縣","鹿港鎮","鹿仔港","鹿港舊稱鹿仔港，因清代此地曾是鹿群聚集的港灣，也是重要的稻米集散地而得名，清中葉曾為僅次台南的全台第二大港市。","","鹿港舊稱「鹿仔港」，地名由來流傳多種說法：一說荷蘭時期到清領初期，台灣西部平原鹿群遍布，海口草埔常有鹿群聚集，因而得名；一說源自當地平埔族巴布薩族「Rokau-an社」的閩南語音譯轉化；一說因港灣地形彎曲，形狀似鹿角而得名；另一說則指清雍正6年（1728年）彰化縣在鹿仔港米市街設立方形穀倉，方形倉庫稱為「鹿」，故以此命名，鹿港米市街的存在也印證了此地確實是重要稻米集散地。學者莊展鵬考證後，認為「鹿群聚集說」較為可信。鹿港憑藉優良的港灣條件，清乾隆49年（1784年）與福建蚶江對渡通商後，商業迅速興盛，與台南府城、台北艋舺並列「一府二鹿三艋舺」，是清中葉台灣第二大港市，天后宮、龍山寺、鹿港老街等古蹟至今仍完整保留這段全盛時期的歷史風貌。"],
    ["彰化縣","和美鎮","卡里善","和美原稱卡里善，源自巴布薩族語「冷熱交界地」，因漳泉械鬥頻繁，民國9年取「和睦美鄰」之意改稱和美。","","和美舊稱「卡里善」（也寫作朥狸散），源自平埔族巴布薩族語，意指「冷與熱的交界地」，反映當地氣候溫和宜人的特徵，此後因發音相近，又演變出「和美線」「和美散」等不同寫法。和美地處泉州移民與漳州移民拓墾範圍的接觸地帶，以境內詔安橋為界，橋西是泉州移民墾地，橋東則是來自彰化的漳州移民墾地，兩籍移民雜處而居，清代分類械鬥頻仍、衝突不斷。民國9年（1920年），日本殖民政府推行地方行政改制，鑑於此地長期作為漳泉械鬥的衝突地帶，特別取「和睦美鄰」之意，將「和美線」正式改稱「和美」，期望藉由地名寄託化解族群衝突、促進和睦相處的願景，是台灣地名中少數直接以「族群和解」為命名初衷的案例。和美如今是彰化縣重要的紡織與針織工業重鎮，享有「和美織仔」的美稱。"],
    ["彰化縣","線西鄉","下見口","線西舊稱下見口，因聚落位於四股圳入海口，可望見河口而得名，1920年因隸屬線西堡而改稱線西。","","線西鄉舊稱「下見口」，也寫作「下徑口」，這個地名描述了當地的地理位置特徵：聚落坐落在四股圳注入台灣海峽的出海口附近，站在此處可以望見河海交會的水口，因而得名「見口」，加上「下」字表示地勢較低或位置偏下游之意。1920年，日本殖民政府推行地方行政改制，因這一帶清代隸屬「線西堡」的行政區劃範圍，遂直接沿用堡名，將「下見口」改稱為「線西」，這種以清代堡里舊名取代原本聚落俗稱的命名方式，在台灣地名演變中相當常見。線西鄉地處彰化縣濱海地帶，因地勢平坦、鄰近福馬圳等水利設施，加上近年推廣的哈密瓜與蔬果種植，是彰化縣重要的沿海農業鄉鎮之一，境內的臭青龜仔（哈利波特風車）觀光工廠等特色景點，也讓這個描述河口地形的舊地名，逐漸發展出濱海觀光的新面貌。"],
    ["彰化縣","伸港鄉","新港","伸港原稱新港，因是新闢的港口而得名，1959年因與嘉義縣新港鄉同名而改稱伸港。","","伸港鄉地名由來相對單純，清代這一帶因新開闢一處港口，便直接以「新港」為名，意指新設立的港埠。然而，台灣行政區劃中另有嘉義縣「新港鄉」同樣以「新港」為名，兩地容易在行政公文、郵政系統上造成混淆，民國48年（1959年）7月1日，彰化的新港鄉正式更名為「伸港鄉」，以「伸」字近音替代「新」字，同時避開重名問題，這與苗栗西湖鄉（原四湖鄉，因與雲林四湖鄉同名而改名）、台中后里（原內埔鄉，因與屏東內埔鄉同名而改名）屬於同一類因行政區重名而更改地名的特殊案例。伸港鄉地處彰化縣最北端濱海地帶，鄰近台中大肚溪出海口，境內慶安水道自然生態中心（俗稱白色海豚屋）與伸港濕地是熱門的生態旅遊景點，也讓這個因新闢港口得名、又因撞名而改名的鄉鎮，發展出獨具特色的濕地生態觀光資源。"],
    ["彰化縣","福興鄉","福興","福興因福建移民期許在此振興事業、建莊興隆而得名。","","福興鄉地名由來直接寄託了先民的拓墾期許：清代福建移民渡海來到這片土地開墾定居時，希望能在異鄉振興家業、發展興隆，因而以「福興」為莊名，「福」代表原鄉福建，也有福氣之意，「興」則寄託事業興旺的願景，是台灣地名中相當常見的一種吉祥式命名方式。福興鄉地處鹿港鎮南側，清代因鄰近鹿港港口，同樣受惠於鹿港作為清中葉台灣第二大港的貿易繁榮，加上濁水溪沖積形成的肥沃平原，農業發展條件優異。福興鄉境內的番社村，地名則源自當地平埔族馬芝遴社的傳統領域，顯示這一帶在漢人大規模拓墾之前，同樣是平埔族巴布薩族的生活範圍。如今福興鄉因地勢平坦、水源充足，是彰化縣重要的稻米與甘藷產地之一。"],
    ["彰化縣","秀水鄉","臭水","秀水原稱臭水，因地處灌溉水路末端、排水不佳而積水發臭，後取諧音雅字改稱秀水。","","秀水鄉地名由來反映了先民對地形排水問題的直白描述：清代這一帶正好位於整片灌溉水系的末端，來自上游各處的餘水匯聚於此，由於地勢低平、排水不易，長期積水導致水質混濁發臭，因而被稱為「臭水」，這種依水質狀況直接命名的方式雖不甚雅觀，卻真實反映了早期農業聚落面臨的排水困境。隨著行政區劃調整與地名雅化的趨勢，「臭水」後來改以發音相近、字義優美的「秀水」取代，徹底扭轉了原本不甚討喜的地名印象。秀水鄉地處彰化平原核心地帶，因濁水溪沖積帶來的肥沃土壤，加上灌溉水利設施逐漸完善，早已從昔日排水不良的積水之地，轉型為彰化縣重要的花卉與蔬果專業區，境內的彰化花卉generation生產專區更是全台知名的花卉批發集散地之一。"],
    ["彰化縣","花壇鄉","茄苳腳","花壇原稱茄苳腳，因早期此地茄苳樹茂生成林，經移民砍伐開墾成耕地建莊而得名。","","花壇鄉舊稱「茄苳腳」，這個地名直接反映了當地早期的自然植被景觀：清代移民初入墾此地時，發現一帶茄苳樹生長茂密、成林遍布，先民便著手砍伐林木、開墾為可耕作的農地，並在這片曾經林木茂盛之處建立聚落，因而以「茄苳腳」為莊名，意指茄苳樹林下方或周邊的聚落。1920年，日本殖民政府推行地方行政改制，將「茄苳腳」改以較為典雅的「花壇」取代，沿用至今。花壇鄉地處八卦山台地西側山麓，因地勢略高、排水良好，加上氣候條件適宜，是台灣重要的花卉與盆景苗木專業產區，尤其以杜鵑花、七里香等園藝植物聞名，花壇之名雖非源自花卉產業，卻恰好與今日的花卉重鎮形象不謀而合，成為地名巧合呼應在地特色的有趣案例。"],
    ["彰化縣","芬園鄉","芬園新莊","芬園原稱芬園新莊，相傳因清代在此廣植菸草（芬）而得名。","","芬園鄉舊稱「芬園新莊」，關於「芬園」二字的由來，民間相傳與清代在此廣泛種植菸草有關：早期移民入墾這片新開闢的莊園時，大量栽植菸草作為經濟作物，「芬」字或許取自菸草特有的氣味或菸園之意，「園」則指旱地作物栽培的田園，兩字合稱反映了當地曾以菸草種植為主要產業的拓墾歷史。芬園鄉地處彰化縣東側、八卦山台地北端，與南投縣草屯鎮相鄰，是彰化縣唯一不靠海、地勢最高的山地型鄉鎮。境內舊社村之名，則源自平埔族洪雅族「貓羅社」的傳統領域，顯示這一帶在漢人拓墾之前，同樣是平埔族群的生活範圍。如今芬園鄉因八卦山台地地形，發展出荔枝、龍眼、鳳梨等丘陵果樹產業，是彰化縣重要的水果產地之一。"],
    ["彰化縣","員林市","林仔街","員林原稱員林仔，因清代先民開墾森林、刻意留下一塊圓形林地建莊而得名。","","員林地名由來源自清代拓墾時的一種特殊留林習慣：康熙末年之後，大批移民湧入這片區域開墾，隨著雍正初年村莊逐漸成形、發展成市街，墾民在大規模砍伐林木闢地的過程中，特意保留了一塊圓形的林地未予砍伐，並在其周邊建立聚落，因而得名「員林仔」（「員」通「圓」），後來才簡化刪去「仔」字，成為今日的「員林」。這種刻意保留圓形林地的做法，可能兼具風水考量與生態調節的實用目的。員林憑藉地處彰化平原交通要衝的優勢，加上鐵路縱貫線設站帶動，逐漸發展成彰化縣南部最重要的商業與工業重鎮，人口規模長期位居彰化縣各鄉鎮市之冠，2015年正式由鎮改制為縣轄市，員林蜜餞、芭樂等農產加工業也讓這座因保留圓林而得名的城市聲名遠播。"],
    ["彰化縣","溪湖鎮","湖厝","溪湖舊稱湖厝，因舊濁水溪與麥嶼厝溪環流交會、周圍多沙丘窪地（湖）而得名。","","溪湖鎮舊稱「湖厝」，地名由來源自其獨特的水文地形：溪湖鎮地處彰化縣中央位置，舊濁水溪與麥嶼厝溪兩條溪流由此斜貫而過，支流環繞流經聚落周邊，加上周圍分布著許多沙丘群與低窪盆地地形，閩南語慣以「湖」稱呼這種盆狀窪地，先民便取溪流環繞之「溪」與盆地窪地之「湖」，合併命名為「溪湖」，「湖厝」則是更早期以「厝」（房舍聚落）為後綴的稱呼方式。溪湖鎮因地勢平坦、水源充沛，清代以來便是彰化平原重要的農業聚落，日治時期因製糖會社在此設立溪湖糖廠，一度是台灣中部重要的製糖重鎮，如今糖廠雖已停止製糖，但保留的五分車鐵道與園區，已轉型為觀光鐵道與地方文化資產，讓溪湖從單純的水文地名，發展出獨特的糖業觀光魅力。"],
    ["彰化縣","田中鎮","田中央","田中鎮名源自清代田中央莊，因聚落建於一片水田中央而得名，後因濁水溪氾濫沖毀田地，才轉型為市街。","","田中鎮地名由來相對直白，源自清代「田中央莊」之名：這處聚落最初建立於一片廣闊水田的中央位置，四周環繞著農田，因而得名。然而，隨著濁水溪多次氾濫改道，這片水田大半遭洪水沖毀流失，原本以農業為主的聚落被迫轉型，先民另擇地勢較高、較不易淹水之處重新發展，逐漸從單純的水田聚落蛻變為商業市街，「田中」之名卻仍保留下來，成為這段從農田到市街轉型歷程的歷史見證。田中鎮因位處清代八堡圳與十五庄圳（今八堡二圳）分水口附近，加上縱貫鐵路設站帶動，逐漸發展成彰化縣南端重要的交通與商業樞紐，鄰近的濁水溪畔沖積平原，至今仍是優質白柚與蔬果的重要產地。"],
    ["彰化縣","大村鄉","燕霧大莊","大村原稱燕霧大莊，因位於燕霧山（八卦台地）下、規模較大的集村聚落而得名。","","大村鄉舊稱「燕霧大莊」，這個地名結合了地形與聚落規模兩種概念：「燕霧」指的是境內鄰近的燕霧山，也就是今日所稱的八卦台地，因山勢地形而得名；「大莊」則說明這是燕霧山下規模較大的一處集村聚落，與周邊其他較小型的莊社有所區別，兩者合稱「燕霧大莊」，後簡化為「大村」，沿用至今。大村鄉地處彰化平原與八卦台地交界地帶，因土壤肥沃、日照充足，加上地勢略高、排水良好，成為台灣重要的葡萄產區，尤其以巨峰葡萄聞名全台，享有「巨峰葡萄之鄉」的美譽，每年葡萄產季更吸引大量遊客前來採果，讓這個源自山勢與聚落規模命名的鄉鎮，因葡萄產業而聲名遠播。"],
    ["彰化縣","埔鹽鄉","埔鹽","埔鹽因早期是蒲鹽菁（一種植物）茂生的荒埔，或因土地鹽分偏高的荒埔地而得名。","","埔鹽鄉地名由來主要有兩種說法：第一種說法認為，這一帶移民建村之初，是一片盛產「蒲鹽菁」的荒埔地，蒲鹽菁是一種可能與染料或藥用植物相關的作物，先民依此特徵稱之為「埔鹽」；第二種說法則從土壤特性出發，指出這片濱海荒埔地因地下水位偏鹹、土質鹽分含量偏高，不利一般作物生長，因而直接以「鹽」字描述其土壤特徵，加上「埔」字表示尚未大規模開墾的荒地，合稱「埔鹽」。無論何種說法為真，都反映了這一帶土地在拓墾初期面臨的自然條件挑戰。埔鹽鄉地處彰化平原西側，鄰近鹿港與福興，清代同樣受惠於鹿港貿易的繁榮腹地效應，如今則以稻米、蔬果等農業生產為主，是彰化縣典型的農業鄉鎮之一。"],
    ["彰化縣","埔心鄉","大埔心","埔心原稱大埔心，因聚落位於一片廣闊未墾荒地（埔）的中心位置而得名。","","埔心鄉舊稱「大埔心」，與台灣其他地方常見的「埔心」地名同屬一套命名邏輯：「埔」指尚未開墾的平坦荒地，「心」則表示中心、中央的位置，這處聚落恰好座落在一片範圍廣闊的荒埔地帶正中央，因而得名「大埔心」，後簡化為「埔心」，是彰化縣境內少數與桃園埔心、南投埔里等地名概念相通、卻各自獨立發展的案例。埔心鄉地處彰化平原核心地帶，清代以來便是重要的農業聚落，如今因氣候與土壤條件適宜，發展出獨具特色的葡萄與蜜紅葡萄柚等果樹產業，加上鄰近的芥菜、酸菜加工業，是彰化縣農業經濟多元發展的代表性鄉鎮之一，境內的舊館社區與芥菜產業館，也讓這個描述地理位置的舊地名注入嶄新的產業文化意涵。"],
    ["彰化縣","永靖鄉","關帝廳","永靖因清代粵籍移民聚居地屢遭閩粵械鬥波及，知縣楊桂森取「永久安靖」之意命名，勸誡雙方停止械鬥。","","永靖鄉地名由來與清代台灣社會常見的閩粵械鬥問題密切相關：這一帶自乾隆末年起，因是廣東客籍移民的主要聚居範圍，與周邊閩南聚落之間屢屢因土地、水源等資源競爭而爆發分類械鬥，雙方傷亡損失慘重。相傳當時的知縣楊桂森有感於械鬥頻仍對地方發展的嚴重危害，特地取「永久安靖」的期許之意，將這一帶命名為「永靖」，希望藉由地名本身承載的祝願，勸誡閩粵雙方族群放下仇隙、和睦共處，這與和美鎮「取和睦美鄰之意」命名的初衷不謀而合，顯示彰化縣境內至少有兩處地名，是清代官府或仕紳試圖以命名化解族群衝突的具體嘗試。永靖鄉如今仍保有典型的客家夥房建築，是彰化縣少數保留客家文化特色的鄉鎮。"],
    ["彰化縣","社頭鄉","社頭","社頭因清乾隆年間移民舉族在平埔族洪雅族大武郡社的社頭（頭目居所或聚落核心）之上建莊而得名。","","社頭鄉地名由來與平埔族聚落的空間結構有關：清乾隆年間，漢人移民舉族遷入此地開墾時，選擇在當地平埔族洪雅族「大武郡社」的「社頭」——也就是該社聚落的核心或頭目居所所在的位置——建立自己的莊社，因而將新建的莊名直接稱為「社頭」，社頭鄉境內至今仍保留「舊社村」的地名，正是當年大武郡社所在地的直接見證。社頭鄉地處八卦山台地西麓，因丘陵地形、氣候涼爽，加上桑樹種植歷史悠久，發展成全台最重要的織襪產業重鎮，享有「襪子的故鄉」美譽，每年生產的襪子占全台總產量相當高的比例，讓這個源自平埔族聚落核心命名的山腳鄉鎮，意外成為台灣紡織產業版圖中舉足輕重的一角。"],
    ["彰化縣","二水鄉","二八水","二水舊稱二八水，因八堡圳在此以「八」字形分為兩條水圳灌溉彰化平原而得名，另有取道「過二幅水」諧音的說法。","","二水鄉舊稱「二八水」，地名由來主要有兩種考證。第一種說法與清代重大水利工程有關：康熙58年（1719年）與60年（1721年），施世榜與黃仕卿兩位先賢分別在二水開鑿八堡圳（施厝圳，即今八堡一圳）與十五庄圳（今八堡二圳），兩條渠道行經二水鼻仔頭時，以「八」字形分流為一圳、二圳，蜿蜒灌溉整個彰化平原，因而得名「二八水」。第二種說法則出自學者陳國典的考證：明鄭時期，自林圮埔（今南投竹山）前往此地，必須渡過清水溪、濁水溪兩條溪流，稱為「過二幅水」，因「二幅水」與台語「二八水」發音雷同，加上早期移民識字不多，便將地名寫成「二八水」，1920年才簡化為「二水」。二水鄉因八堡圳分水工程，是全台重要的水利文化資產所在地，境內的水圳文化園區至今仍展示這段治水拓墾的歷史。"],
    ["彰化縣","北斗鎮","寶斗","北斗舊稱寶斗，因源自平埔族巴布薩族東螺支族「Baoata社」音譯，另有街道規劃方正、形似量米方斗之說。","","北斗鎮舊稱「寶斗」，地名由來主要有兩種說法：一說源自居住於此的平埔族巴布薩族東螺支族「Baoata社」的社名音譯，直接轉寫為「寶斗」；另一說則從地形著眼，指北斗街道規劃整齊方正，形狀酷似古代用來量米的方形量斗「寶斗仁」，因而得名。北斗原稱「東螺街」，因清道光元年（1821年）舊街遭東螺溪（今舊濁水溪）洪水沖毀，居民被迫遷移至今日北斗鎮所在地重建街市，並依繼承東螺地區行政機能之意，另建新街，其後才將「寶斗」雅化為發音相近的「北斗」，取北斗七星之意，沿用至今。北斗因清代重建後迅速發展成彰化平原南側的重要商業市街，與員林、鹿港並稱彰化縣三大早期市街，境內奠安宮、北斗老街等古蹟至今仍見證這段因水患遷城的歷史。"],
    ["彰化縣","二林鎮","二林社","二林因是平埔族巴布薩族「二林社」的傳統領域而得名，荷蘭時代文獻記載為Gielim。","","二林鎮地名源自平埔族巴布薩族「二林社」的社名，這個平埔族部落是荷蘭統治時期文獻中記載的「Gielim」，是彰化沿海地區重要的原住民聚落之一，漢人入墾後直接沿用其社名音譯，定名為「二林」。二林因地處彰化縣西南沿海，土壤與氣候條件適合甘蔗種植，日治時期糖業興盛，1925年爆發的「二林事件」（又稱二林蔗農事件），是台灣農民運動史上第一次農民組織性的集體抗爭行動，蔗農為爭取合理的甘蔗收購價格，與林本源製糖會社及日本警方發生激烈衝突，這起事件被視為台灣農民運動的重要里程碑，也讓二林這個源自平埔族社名的濱海鄉鎮，在台灣社會運動史上留下重要的一頁。如今二林以葡萄、蔬果等農業生產聞名，也是彰化縣重要的酒莊產業聚落。"],
    ["彰化縣","田尾鄉","田尾","田尾因清代先民在十五庄圳灌溉水田地帶的末端建莊而得名。","","田尾鄉地名由來相對直白，與秀水鄉「臭水」（位於灌溉末端而積水發臭）的命名邏輯類似：清代墾民在十五庄圳這套灌溉水利系統所澆灌的水田地帶，選擇位置相對偏向末端之處建立聚落，因而得名「田尾」，意指水田灌溉範圍的尾端。田尾鄉地處彰化平原南側，因濁水溪沖積帶來的肥沃土壤，加上溫和的氣候條件，逐漸從單純的稻作水田地帶，轉型發展成全台最重要的花卉苗木專業區之一，享有「花的故鄉」美譽，境內公路花園沿線苗圃林立，各式盆栽、園藝景觀造景批發買賣熱絡，每年吸引大量遊客前來賞花購苗，讓這個原本描述水田末端位置的地名，蛻變為台灣花卉產業的重要地標。"],
    ["彰化縣","埤頭鄉","埤頭","埤頭因清雍正年間漢人在莿仔埤圳的圳頭附近建莊而得名。","","埤頭鄉地名由來源自清代的水利建設：雍正年間，漢人移民入墾這片區域時，選擇在灌溉水圳「莿仔埤圳」的取水口（圳頭）附近建立聚落，「埤」在閩南語中泛指蓄水池或水圳，「頭」則表示源頭或起始位置，兩字合稱「埤頭」，意指水圳源頭處的聚落，這種依水利設施位置命名的方式，反映了清代台灣農業拓墾對灌溉水源的高度依賴。埤頭鄉地處彰化平原西南側，因濁水溪沖積形成的肥沃沖積扇地形，加上完善的埤圳灌溉系統，自清代以來便是重要的稻作生產區，如今則以蔬菜、水稻等農業生產為主，是彰化縣典型的農業鄉鎮之一，境內的合興村百年老樹等地標，也見證了這段依水而興的拓墾歷史。"],
    ["彰化縣","芳苑鄉","番仔挖","芳苑原稱番仔挖，因是平埔族巴布薩族居住地（番仔），且溪流在此轉折入海（挖）而得名，光復後取當地舉人洪算諒宅號改稱芳苑。","","芳苑鄉舊稱「番仔挖」，這個地名結合了族群與地形兩種元素：「番仔」是清代漢人對這一帶平埔族巴布薩族居民的慣稱，反映此地曾是該族群的傳統領域；「挖」則是台語用來形容溪流或海岸線轉折彎曲之處的用字，境內有一條溪道在流入台灣海峽前呈現明顯的彎折走向，因而得名「番仔挖」。台灣光復後，鑑於「番仔」一詞帶有歧視意味，地方政府決定以當地清代舉人洪算諒的宅號「芳苑」取代舊名，作為新的鄉名，這種以在地知名仕紳宅號重新命名地方、藉此淡化帶有歧視色彩舊稱的做法，在台灣戰後地名雅化過程中具有代表性。芳苑鄉地處彰化縣濱海地帶，境內王功漁港、芳苑潮間帶生態與燈塔等景點，讓這個曾經因族群與地形命名的濱海鄉鎮，發展出獨特的海線觀光魅力。"],
    ["彰化縣","大城鄉","大城厝","大城原稱大城厝，因清道光初年移民聚落遭械鬥威脅，築土成壘防禦盜匪而形成規模較大的集村，故得名。","","大城鄉地名由來與清代地方治安狀況密切相關：清道光初年，陸續有移民前來這片濁水溪出海口附近的荒埔地開墾聚居，然而當時分類械鬥與盜匪侵擾頻繁，居民為了自保，紛紛在聚落四周構築土牆壁壘，形成具防禦功能的集村聚落，隨著人口聚集規模逐漸擴大，形同一座具備防禦工事的小城，因而得名「大城厝」，後簡化為「大城」。大城鄉地處彰化縣最南端，緊鄰濁水溪出海口，因地勢低平、土壤含鹽分較高，農業生產條件相對嚴苛，居民多從事西瓜、花生等耐旱耐鹽作物種植，加上沿海的漁業與蚵仔養殖，是彰化縣濱海地帶重要的農漁業鄉鎮，境內的台灣西瓜促銷活動也讓大城西瓜享有一定知名度。"],
    ["彰化縣","竹塘鄉","竹塘","竹塘因清初墾民儲水為塘以利灌溉，且周邊水塘一帶蘆竹叢生茂密而得名。","","竹塘鄉地名由來結合了水利設施與植被特徵兩種元素：清初移民入墾這片區域時，因灌溉水源不易取得，便挖掘池塘蓄積雨水與地下水，以供農業灌溉之用；而這些人工開鑿的水塘周邊，恰好生長著大片茂密的蘆竹，先民依此特徵，將這片以蓄水池塘與蘆竹叢生為特色的區域，命名為「竹塘」。竹塘鄉地處彰化平原西南側，鄰近濁水溪沖積扇末端，因灌溉水利系統的持續改善，早已從清初依賴蓄水塘灌溉的拓墾聚落，發展成彰化縣重要的稻米與蔬果產區，境內的醒靈宮等百年廟宇，也見證了這段先民開鑿水塘、克服水源不足困境的拓墾歷史。"],
    ["彰化縣","溪州鄉","溪州","溪州因地處東螺溪與西螺溪之間的氾濫沖積平原（洲）而得名。","","溪州鄉地名由來源自其獨特的河川地形：這片區域坐落於東螺溪與西螺溪兩條溪流之間，是濁水溪多次氾濫改道所沖積形成的浮覆地帶，閩南語慣以「洲」稱呼這種由河流泥沙堆積而成的沙洲地形，加上位處兩溪之間，因而得名「溪州」。溪州鄉境內另有一處聚落「舊眉」，地名源自平埔族巴布薩族「眉里社」的傳統領域，是了解這一帶平埔族分布歷史的重要線索。溪州因地處濁水溪沖積扇末端，土壤肥沃、水源充沛，是台灣重要的水稻與蔬果產區，享有「濁水米故鄉」的美譽，境內的台灣糖業公司溪州糖廠與周邊的森林公園，也讓這個因河川沙洲地形得名的鄉鎮，兼具農業生產與生態休閒的多重面貌。"],
    ["彰化縣","八卦山","望寮山","八卦山最早稱望寮山，因可登高瞭望彰化縣城而得名，清嘉慶年間知縣胡應魁因山形如八卦而改名。","","八卦山最早見於1717年《諸羅縣志》，當時稱為「寮望山」或「望寮山」，因地處彰化縣城制高點，可綜觀全城動靜，清代即在山頂設置瞭望台戒備。雍正9年（1731年）大甲西社事件平定後，台灣道倪象愷在山上建立「鎮番亭」；道光年間又依地方士紳建議，興築「定軍山寨」戍守縣城，一度改稱「定軍山」，有「定寨望洋」的美稱。嘉慶3年（1798年），知縣胡應魁鑒於山勢輪廓神似《易經》中的八卦圖形，遂將此山正式更名為「八卦山」，並建太極亭，取「太極生兩儀，兩儀生四象，四象生八卦」之義；民間另有一說，認為此名與清代秘密會黨「天地會」分支「八卦會」曾在此地聚集活動有關。光緒21年（1895年）乙未戰爭中，八卦山之役是這場戰事規模最大、傷亡最慘烈的一戰，客家義軍領袖吳湯興、黑旗軍統領吳彭年皆壯烈犧牲。1961年，山頂建成當時亞洲最大的釋迦牟尼佛像，成為今日彰化最具代表性的地標。"],
    
    // --- 【南投縣】 ---
    ["南投縣","南投市","南投社","南投源自洪雅族「南投社」，因位居「北投社」（今草屯）之南而得名，與台北北投無關。","","南投地名由來與草屯的舊稱密切相關：清代文獻《諸羅縣志》記載「虎尾之北有大武郡山，東為南投山，內社二，溪南為南投，溪北為北投」，說明貓羅溪南北兩岸各有一個平埔族洪雅族聚落，溪北稱「北投社」（即今草屯鎮，古稱北投堡），溪南則相對稱為「南投社」，兩地地名互為對照，與台北市北投區並無地緣關聯，純屬巧合同名。關於「北投社」原名的考證另有一說，指其原稱「Tausabata」，漢人取其後半「bata」音譯為北投社，南投社之名則是相對於北投社而生；另有學者主張南投社本身即源自洪雅族支族阿立昆族語「Ramtau」的音譯。乾隆24年（1759年），彰化縣在南投正式設縣丞，是南投地區有政教建制之始，光緒元年更因開山撫番設立埔里社廳，逐步奠定今日南投縣治所在地的地位，如今南投市因糖業歷史與縣政府進駐，是全台唯一不臨海縣份的行政中樞。"],
    ["南投縣","埔里鎮","埔里社","埔里源自邵族「埔里社」與泰雅族「眉里社」，清道光年間因西部平埔族大舉遷入形成「平埔各社最集中的鄉里」而得名。","","埔里地名由來與台灣中部平埔族群的一段集體遷徙史密切相關：這片盆地清領前期原是邵族「Poli社」（埔里社）與泰雅族「Vairi社」（眉里社）的生活領域，清乾隆53年（1788年）《埔里社紀略》中已可見「埔里社」之名。道光元年（1820年）前後，受到閩粵漢人拓墾壓力排擠，台灣西部的道卡斯、巴則海、巴布薩、拍瀑拉等多個平埔族群，不約而同大舉遷入埔里盆地另闢生機，使埔里成為當時全台平埔各族最集中匯聚的地區，學者洪英聖便將埔里解釋為「平埔各社最集中的鄉里」。埔里境內的「愛蘭里」舊稱「烏牛欄」，源自原居台中豐原的巴宰族「烏牛欄社」遷居於此；「房里」則是苗栗苑裡道卡斯族「房里社」族人遷入後留下的地名。光緒元年設埔里社廳後，當地曾築土城牆，稱「大埔城」。埔里如今以酒廠、花卉與地理中心鎮聞名，是南投縣北部最重要的山城市鎮。"],
    ["南投縣","草屯鎮","草鞋墩","草屯舊稱草鞋墩，因位處交通要衝，往來挑夫商旅在此更換磨損的草鞋，廢棄草鞋堆積如山而得名。","","草屯舊稱「草鞋墩」，這個地名生動描繪了清代交通往來的真實場景：草屯地處通往埔里、水沙連等內山地帶的必經要道，往來的挑夫、商旅在此長途跋涉後，草鞋早已磨損不堪，於是紛紛在此更換新鞋，卸下的破舊草鞋日積月累、堆積如山，形成一座顯眼的「墩」（小丘），因而得名「草鞋墩」，是台灣地名中相當生動寫實的交通民生案例。草屯古稱「北投社」，是洪雅族阿里坤支族的傳統領域，與溪南的「南投社」相對而得名。1920年，日本殖民政府推行地方行政改制，將「草鞋墩」簡化雅化為「草屯」，沿用至今。草屯鎮境內的坪頂里七股遺址、中原里頂崁仔遺址，出土了牛罵頭文化與營埔文化的史前器物，顯示這一帶自新石器時代便已有人類活動，如今草屯是南投縣人口最多的市鎮，也是中彰投都會區重要的衛星城市。"],
    ["南投縣","竹山鎮","林圮埔","竹山舊稱林圮埔，為紀念明鄭參軍林圮率眾入墾此地、力抗原住民而戰死得名，日治時期因竹林茂密改稱竹山。","","竹山舊稱「林圮埔」，是南投縣漢人開發史上的第一站：明永曆22年（1668年），鄭成功麾下參軍林圮（也寫作林圯）奉命率領部屬進入竹山一帶屯墾，這裡地屬水沙連番界，漢番交界局勢緊張，林圮在此設置社商休息用的草寮與原住民議和交易，境內「社寮」地名即由此而來；然而林圮其後行經東埔蚋（今竹山延平里）一帶時，遭逢原住民出草殺害而身亡，後人感念他開拓竹山的功績，便以其名為這片墾地命名「林圮埔」。1920年，日本殖民政府推行地方行政改制，因當地竹林密布、竹產業發達，將「林圮埔」改稱「竹山」，沿用至今，竹山也因此發展出全台重要的竹藝加工產業。境內因車籠埔斷層通過，1999年921大地震震央即在附近，如今設有車籠埔斷層保存園區，見證這段地質變動的歷史記憶。"],
    ["南投縣","集集鎮","集集社","集集地名由來有二說，一為平埔族「集集社」譯音，一為早期移民將收穫物資集中交易而得名。","","集集地名由來主要有兩種說法：第一種說法認為，「集集」源自水沙連番界內平埔族「Chipu-chipu社」（集埔集埔社）的音譯漢字；第二種說法則從拓墾過程著眼，指出移民入墾此地後，習慣將各自開墾收穫的農產物資，集中運送到固定場所進行交易，這種「集中交易」的功能性聚落，因而得名「集集」或「聚集」。集集與鄰近的中寮鄉境內都曾出現「半路店」這個地名，指的是移民開發路段中途所形成的店鋪街市，反映了清代拓墾沿交通路線逐步向內山推進的過程。集集因地處濁水溪畔，日治時期興建集集線鐵路作為水力發電工程的運輸線，如今已轉型為觀光鐵道，加上綠色隧道與集集火車站的懷舊氛圍，是南投縣熱門的鐵道觀光小鎮，其舊稱「半路店」則已鮮少為人所知。"],
    ["南投縣","名間鄉","湳仔","名間舊稱湳仔，因地勢低窪潮濕多爛泥而得名，日治時期因其日語發音近似「湳仔」台語音而改稱名間。","","名間鄉舊稱「湳仔」，「湳」在閩南語中意指濕軟泥濘的低窪地形，這一帶因排水不易、土地經常潮濕泥濘，先民便以此地形特徵為聚落命名，這種因低窪濕地而得名「湳仔」「大湳」的地名在台灣各地相當常見。1920年，日本殖民政府推行地方行政改制，選定漢字「名間」取代原本的「湳仔」，原因是「名間」二字的日語讀音「なま」（na-ma）與台語「湳仔」的發音十分相近，這種利用日語發音近似性來選字更名的方式，與新竹鎮西堡、關西等地借用日語地名的邏輯類似，但名間更特別之處在於是刻意挑選字義吉祥、發音又相近的漢字組合。名間鄉因八卦山台地南端地形，加上濁水溪沖積平原的加持，是全台重要的茶葉（尤其是松柏長青茶）與生薑產地，境內松柏嶺受天宮更是全台玄天上帝信仰的重要進香中心。"],
    ["南投縣","鹿谷鄉","羌仔寮","鹿谷舊稱羌仔寮，因早期羌群棲息於此，獵羌者搭寮居住而得名，1920年因「羌」與「鹿」相似、境內多溪谷而改稱鹿谷。","","鹿谷鄉舊稱「羌仔寮」，這個地名反映了當地開墾前的野生動物生態：清代此地尚未開墾之前，是山羌群聚棲息之地，前來狩獵羌隻的獵人在此搭建簡易茅寮暫居，隨著聚落逐漸擴大發展成村莊，便以「羌仔寮」為名，這個地名還曾出現「羌雅寮」「獐仔寮」「猐仔寮」等多種不同音譯寫法。1920年，日本殖民政府推行地方行政改制，考量「羌」與「鹿」外形相似，加上境內因濁水溪支流切割而多溪谷地形，便將「羌仔寮」改稱「鹿谷」，沿用至今。乾隆年間，漳州人程志成、泉州人許廷瑄先後率眾入山開墾，途中屢遭原住民出草威脅，歷經艱辛才逐步拓墾出羌仔寮、坪仔頂、車輄寮、小半天等聚落。如今鹿谷因氣候與地形適宜，是台灣最富盛名的凍頂烏龍茶產地，境內溪頭自然教育園區也是熱門的森林遊憩景點。"],
    ["南投縣","中寮鄉","中寮","中寮因清代先民沿二重溪東岸築寮拓墾，此聚落恰好位居六寮、十八甲寮、後寮等眾多寮舍聚落之中央而得名。","","中寮鄉地名由來源自清代拓墾聚落的相對位置：先民沿二重溪東岸一帶搭建簡易草寮、逐步開墾定居，陸續形成六寮、十八甲寮、後寮等多個以「寮」為名的小型聚落，其中位置恰好座落於這些聚落中央地帶的一處，便直接被稱為「中寮」。中寮鄉境內因清代拓墾規模與產業活動，留下大量以「股」「份」計算開墾規模的地名，如十八股寮、六股、十四股、二十份等，加上「打鐵坑」（打鐵業聚落）、「大丘園」（大片田園菜圃）等依產業與地形命名的聚落，共同呈現這一帶豐富多樣的拓墾地名文化。中寮鄉地處南投縣西側丘陵地帶，因氣候與土壤條件適合，是台灣重要的龍眼與柳丁產地，1999年921大地震震央雖在集集，中寮卻是受創最嚴重的鄉鎮之一，如今已從地震重建中逐漸恢復農村風貌。"],
    ["南投縣","魚池鄉","五城堡","魚池舊稱五城堡，因清道光末年在新城、貓蘭、司馬垵、水社、銃櫃五處聚落外築竹圍防禦而得名，另一舊稱魚池仔則因日月潭漁產豐富而來。","","魚池鄉有兩個歷史脈絡不同的舊稱。「五城堡」之名，源自道光末年（1840年代）漢人移民入墾這一帶後，為防禦原住民與盜匪侵擾，分別在新城、貓蘭、司馬垵、水社、銃櫃五個聚居點外圍構築竹圍防禦工事，「銃櫃」即指存放槍砲的堡壘據點，五個聚落合稱「五城堡」；另一個舊稱「魚池仔」則因日月潭在興建水庫、進行水力發電工程之前，原本就是一座漁產豐盛的天然湖泊，入墾的漢人依此漁業資源特色，將這一帶稱為「魚池仔」，1920年簡化為「魚池」。魚池鄉境內的日月潭是台灣最大的天然湖泊，也是邵族傳統領域，加上得天獨厚的氣候條件，是台灣紅茶（日月潭紅玉紅茶）的重要產地，讓這個因防禦聚落與漁業資源命名的山區鄉鎮，兼具觀光、生態與茶葉產業的多重魅力。"],
    ["南投縣","國姓鄉","國姓","國姓因鄭成功部將劉國軒追擊平埔族大肚社時曾行經此地而得名，「國姓」則源自鄭成功受南明皇帝賜姓朱、人稱「國姓爺」的典故。","","國姓鄉地名由來與明鄭時期的一段軍事行動有關：鄭成功因獲南明隆武帝賜予「朱」姓，被尊稱為「國姓爺」，其麾下部將劉國軒在追擊反抗明鄭政權的平埔族拍瀑拉族大肚社族人時，曾率軍行經這片區域，後人為紀念這段與鄭成功「國姓爺」相關的歷史淵源，便將此地命名為「國姓」，是南投縣境內少數直接承襲明鄭時期人物典故的地名。國姓鄉地處烏溪上游河谷地帶，是漢人與泰雅族、布農族接觸拓墾的前緣地帶之一，境內因氣候與土壤條件適宜，是台灣重要的青梅與樹薯產地，每年梅花季更吸引大量遊客前來賞梅，讓這個源自鄭成功部將行軍典故的山區鄉鎮，發展出獨具特色的農業觀光資源。"],
    ["南投縣","水里鄉","水裡坑","水里原稱水裡坑，源自邵族「水裡社」（水社）社名，因鄰近日月潭畔部落而得名，1950年設鄉時簡化為水里。","","水里鄉地名源自居住於日月潭畔的邵族「水裡社」（又稱水社），日月潭舊稱「水裡湖」或「水社湖」正是因鄰近水裡社而得名，郁永河《裨海紀遊》記載日月潭因「水分丹碧二色，故名日月潭」，可見這座湖泊擁有雙重舊稱系統。水里鄉地處水裡溪匯入濁水溪之處，這片河階地帶因而得名「水裡坑」，1950年水里正式設鄉時，簡化為今日的「水里」。水里鄉境內的「社子」「拔社埔」等地名，同樣顯示這一帶曾是拍瀑拉族等南島原住民族群的傳統聚落所在地。日治大正2年（1914年），為了運輸埔里糖廠所需甘蔗與物資，鋪設連接外界的輕便鐵道，沿線設置多個中繼站，其中「車埕」因經常停放數百輛台車而得名，成為水里鄉重要的木材與交通運輸重鎮，如今車埕已轉型為知名的鐵道觀光景點。"],
    ["南投縣","信義鄉","羅娜","信義鄉為布農族傳統領域，戰後國民政府取「四維八德」中的「信義」二字為山地鄉命名，境內羅娜為布農族最大部落。","","信義鄉是南投縣境內布農族的主要傳統領域，戰後國民政府治台，仿效「忠孝仁愛信義和平」等儒家傳統道德教條，為新設立的山地鄉命名，將這片布農族聚居的山地行政區定名為「信義」，與鄰近仁愛鄉（取「仁愛」二字）同屬這波政治教化式命名的產物。境內的「羅娜」是信義鄉規模最大的布農族部落，人口眾多、部落文化保存完整；「東埔」則是另一處著名的布農族部落，因鄰近溫泉、風景秀麗而聞名，境內東埔吊橋更是全台最高的吊橋之一。信義鄉境內還有台灣最高峰玉山，布農族稱之為「Tongku Saveq」（意指高大的山），清代文獻中則因終年雲霧繚繞、遠望皆白石而得名「玉山」，日治時期因比日本富士山更高，一度改稱「新高山」，戰後才恢復玉山舊名，成為認識台灣多元族群與外來政權更迭的絕佳例證。"],
    ["南投縣","仁愛鄉","霧社","仁愛鄉舊稱霧社，源自泰雅語「終年雲霧繚繞」之意，戰後國民政府取「四維八德」中的「仁愛」二字為山地鄉命名。","","仁愛鄉境內的「霧社」，地名源自泰雅族語，意指這一帶地勢高聳、終年雲霧繚繞的地理特徵，是南投縣境內泰雅族與賽德克族的重要傳統領域。1930年，賽德克族在此發動震驚台灣社會的抗日行動「霧社事件」，是台灣原住民武裝抗日史上規模最大、影響最深遠的一次起義。事件後，日本當局將部分遺族強制遷移至北港溪與眉原溪之間的河階台地，因三條溪流匯集形似「川」字，日人稱之為「川中島」，族人則自稱「谷路邦」（Alan-Gluban）部落，戰後因去日本化考量改稱「清流部落」，如今兩個名稱仍並行使用。戰後，國民政府比照信義鄉的命名邏輯，將這片山地行政區定名為「仁愛」。仁愛鄉境內的清境農場，前身為「見晴農場」，1965年因時任行政院長蔣經國讚嘆「清新空氣任君取，境地幽雅是仙居」而改名清境，如今已是台灣中部最負盛名的高山觀光勝地之一。"],
    ["南投縣","清境","見晴農場","清境農場原名見晴農場，1965年因時任行政院長蔣經國讚嘆「清新空氣任君取，境地幽雅是仙居」而改名清境。","","清境農場前身為「見晴農場」，民國50年（1961年）由行政院退除役官兵輔導委員會創立，最初以安置退伍軍人從事高山農牧開墾為主要目的，「見晴」之名可能與當地地勢高聳、視野開闊、易見晴朗天色有關。民國54年（1965年），時任行政院長蔣經國先生造訪此地，見這片坐落於海拔約1750公尺高原上的牧場，四季景致如畫、氣候溫和清爽，讚嘆「清新空氣任君取，境地幽雅是仙居」，遂賜名「清境農場」，這句頗具詩意的題詞也成為地名由來的重要典故。清境地處中部橫貫公路霧社支線通往合歡山的必經之地，因終年雲霧繚繞、氣候宜人，享有「霧上桃源」的美譽，如今已從退輔會的高山農場，轉型為結合綿羊放牧、歐式民宿與高山景觀的台灣中部最知名觀光勝地之一，每年吸引大量遊客前來避暑賞景。"],
    ["南投縣","日月潭","水裡社潭","日月潭因潭水一側形如日輪、一側形如月鉤而得名，舊稱水裡社潭或水沙連，是邵族傳統領域，潭中拉魯島為邵族祖靈聖地。","","日月潭舊稱「水裡社潭」或「水社湖」，因鄰近邵族「水裡社」（水社）而得名；清代文獻中，這一帶連同周邊地區泛稱「水沙連」，範圍曾記載有三十六社、二十四社等不同說法，其中頭社、水社、貓蘭社、沈鹿社、埔裏社、眉社合稱「水沙連六社」。「日月潭」之名則描述了潭水的地形特徵：道光初年北路理番同知鄧傳安在〈遊水里社記〉中記載「水分丹碧二色，故名日月潭」，一般認為潭的北側形狀渾圓如太陽，南側狹長彎曲如月鉤，因而得名。潭中的拉魯島，是邵族心目中祖靈安息的聖地，「拉魯」即「祖靈聖島」之意；國民政府時期因強調中華意識，一度將此島改稱「光華島」，直到1999年921大地震重創該島、經整頓後，時值陳水扁總統執政，才正式恢復「拉魯島」的原名，這段島名變遷完整見證了台灣不同政權更迭下的文化政策轉變。"],
    ["南投縣","溪頭","溪頭","溪頭因位於北勢溪（麒麟潭溪）的源頭附近而得名，境內為台灣大學實驗林場，以孟宗竹林與大學池聞名。","","溪頭地名由來相對單純，因這片區域地處北勢溪上游、溪流發源地附近，先民依此地理位置直接命名為「溪頭」，意指溪流的源頭之地。溪頭與鄰近鹿谷鄉「羌仔寮」（今鹿谷）的開發脈絡緊密相連，同屬國立台灣大學實驗林管理處管轄範圍內的重要林場基地，日治時期便已規劃為林業試驗與教學用地，園區內遍植孟宗竹、柳杉、台灣杉等人工林，森林覆蓋率極高、負氧離子豐富，是台灣最早開發的森林遊樂區之一。境內的大學池（初稱竹廬），是台大實驗林場為蓄水灌溉及景觀造景所闢建的人工池塘，池上的獨木橋與竹拱橋已成為溪頭最具代表性的景觀地標。如今溪頭與鄰近的杉林溪、小半天等地共同構成南投縣鹿谷鄉重要的森林生態旅遊廊帶，是台灣中部避暑賞景的熱門去處。"],
    ["南投縣","車埕","車埕","車埕因1914年埔里糖廠興建輕便鐵道運輸蔗糖，此地作為台車中繼休息與修理站，經常停放數百部台車而得名。","","車埕地名由來與日治時期的糖業與林業運輸密切相關：大正2年（1914年），為了運送埔里地區生產的蔗糖，總督府鋪設一條對外連接的輕便鐵道，車埕因地處交通要衝，被規劃為沿線重要的中繼休息站與修理站，經常有數百部人力輕便台車在此停放、調度，因而得名「車埕」，「埕」在閩南語中泛指開闊的空地或廣場，恰好貼合這裡作為台車調度場地的功能。隨著集集線鐵路的興建與延伸，車埕進一步發展成南投山區重要的木材集散與運輸重鎮，日治至戰後全盛時期，這裡林業加工廠林立，是木業經濟的核心地帶。隨著林業政策轉變與鐵路運輸功能式微，車埕一度沒落，近年透過保存舊車站建築、木業歷史廠房與周邊明潭水庫的湖光山色，成功轉型為集集線鐵路端點站的熱門觀光小鎮。"],
    ["南投縣","武界","Vogai","武界因位處泰雅族與布農族早年交戰後議和劃定的獵域界線而得名，另一說源自布農語「Vogai」，意指翻越山嶺或界線。","","武界地名由來主要有兩種說法：第一種說法指出，這裡是南投信義鄉與仁愛鄉的交界地帶，早年北側泰雅族與南側布農族時常因爭奪獵域而發生衝突，雙方經過協調後，議定以干卓萬山為界、互不越界，這條劃定的界線正好通過武界現址，因而得名「武界」；第二種說法則認為地名源自布農語「Buqaiz」（也拼寫作Vogai或Bogai）的音譯，意指「翻越某物」，例如翻過一座山頭或跨越一條界線，恰好呼應了武界地處山區要衝、族群往來必經之地的地理特徵。1919年，台灣總督府為統一管理布農族卓社群，推行「集團移住」政策，將原本分散各處的卓社群部落族人集中遷移到濁水溪沖積平原上安置，形成今日的武界部落（法治村），是台灣布農族分布最北的一支，如今武界因鄰近武界壩與雲龍瀑布，是南投縣深具原始風貌的部落型觀光景點。"],

    // --- 【雲林縣】 ---
    ["雲林縣","斗六市","斗六門","斗六舊稱斗六門，源自平埔族洪雅族斗六社，一說因族人狩獵慶賀的呼聲而得名，一說因地處諸羅縣東方門戶而加「門」字。","","斗六舊稱「斗六門」，地名由來主要有兩種說法：一說源自平埔族洪雅族「斗六社」（原居於今斗六市柴裡一帶，即今三興里）的社名音譯；另一說則帶有生動的民俗色彩，指原住民族人出獵捕獲山鹿時，會發出「ㄉㄨ ㄌㄨ ㄇㄣˋ」的歡呼慶賀聲，先民便以此擬聲詞為地方命名。至於「門」字的由來，一般認為是因斗六門地處諸羅縣（今嘉義）東側進入內山地帶的門戶要衝，地勢險要、自古為兵家必爭之地，因而加上「門」字強調其關口地位，後來才簡化去除，成為今日的「斗六」。光緒13年（1887年）台灣建省，首任巡撫劉銘傳原擬在林圮埔（今南投竹山）雲林坪設縣治，因清水溪、濁水溪夏秋氾濫交通不便，光緒19年將縣治遷至斗六門，「雲林」之名卻因此隨縣治沿用下來，如今斗六市是雲林縣政府所在地，也是全縣唯一的市轄區。"],
    ["雲林縣","斗南鎮","他里霧","斗南原稱他里霧，源自洪雅族「他里霧社」音譯，意指蒼莽草原，1920年因位居斗六之南而改稱斗南。","","斗南舊稱「他里霧」，源自平埔族洪雅族「他里霧社」（Tarubu或Dalivoe）的社名音譯，平埔語原意為「蒼莽草原」，反映當地早期未墾荒野的地貌特徵。根據荷蘭統治時期文獻記載，平埔族在雲林縣境內曾設有五個社，斗南地區便占有兩社：他里霧社與猴悶社（今將軍里溫厝角），其中他里霧社人數最多，原址即在今斗南市區與舊社里一帶，康熙23年（1684年）《福建通志》台灣府三縣圖中已見他里霧社的記載。1920年，日本殖民政府推行地方行政改制，因這一帶位於斗六以南，遂將「他里霧」改稱「斗南」；饒富趣味的是，日本本州青森縣陸奧市剛好也有一處相同讀音的「斗南藩」（となみはん），部分文獻認為這項巧合也促成了改名的選擇。斗南地處雲林縣交通地理中心，因縱貫鐵路、公路與糖廠小火車交會，長期是雲林對外的重要交通門戶。"],
    ["雲林縣","虎尾鎮","五間厝","虎尾舊稱五間厝，因清代僅有五棟草厝而得名，原稱「后尾」因與「虎」台語發音相近而訛傳為虎尾。","","虎尾地名的演變頗為曲折：清康熙56年（1717年），諸羅縣在此設「大坵田一堡」，因當地地形起伏如丘陵，最初稱為「大崙腳」；乾隆24年（1756年），福建人郭六才前來大崙腳開墾，在東北邊俗稱「后尾」之處興建五間草寮定居，這處聚落因而被稱為「五間厝」。日治時期，因當地台語發音的「后」與「虎」十分相近，加上日本人不熟悉台語、當地居民也未加以辨明澄清，「后尾」便逐漸被誤傳、書寫為「虎尾」，這種因語音訛傳而流傳至今的地名演變過程，是台灣地名史上相當特殊的案例。明治40年（1907年），大日本製糖株式會社選定五間厝設立糖廠，並設「五間厝驛」運輸蔗糖，1920年隨行政區改制正式定名「虎尾」，車站也隨之更名虎尾驛。如今虎尾因保存完整的日治糖廠建築群與郡役所等歷史建物，是雲林縣重要的歷史文化與教育重鎮。"],
    ["雲林縣","西螺鎮","西螺社","西螺源自平埔族巴布薩族「西螺社」，相傳因地形似田螺，與濁水溪對岸北斗（東螺）協議分稱西螺、東螺。","","西螺地名源自平埔族巴布薩族「西螺社」，該族人自稱居住地為「Soreau」。相傳三百多年前，這一帶的地形輪廓神似田螺，而濁水溪對岸的北斗一帶恰好也呈現類似的地形樣貌，兩地墾民於是協議，將位於溪流南端的一方稱為「西螺」，北端（今北斗）則稱為「東螺」，這種依相似地形、輔以方位區分兩地地名的方式，在台灣地名史上相當少見。西螺又有「螺陽」的雅稱，一說是依「北辰南陽」的方位命名，因西螺恰好位於濁水溪南畔；另一說則是開拓先民為追思福建原鄉「螺陽」（今福建惠安一帶）而取名，寄託思鄉之情。西螺因地處濁水溪畔，土壤肥沃，是台灣重要的蔬菜（尤其是西螺醬油與濁水米）產地，戰後興建的西螺大橋一度是東亞最長的橋樑，是連接雲林、彰化兩地的重要地標。"],
    ["雲林縣","土庫鎮","塗庫","土庫舊稱塗庫，因是鹿港通北港必經之地，道路狹隘泥濘如穿「土褲」而得名，另一說源自洪雅族猴悶社自稱「土庫」音譯。","","土庫舊稱「塗庫」，地名由來主要有兩種說法：第一種說法從交通地形著眼，指這一帶是清代鹿港通往北港的必經之路，沿線兩側地勢高聳、中央低窪，且道路特別狹隘，每逢下雨便泥濘不堪，行人通過時往往泥水沒過小腿，猶如穿著沾滿泥巴的「土褲」，因而得名「塗褲莊」，後轉為「塗庫」；第二種說法則認為，地名源自當地平埔族洪雅族「猴悶社」自稱「土庫」的音譯轉化，與地形描述無關。1920年，日本殖民政府推行地方行政改制，將「塗庫」正式改稱「土庫」，沿用至今。土庫鎮地處雲林縣中央地帶，因土壤肥沃，是重要的花生、蒜頭與蔬果產地，加上鄰近的順天宮媽祖信仰，是雲林縣海線與山線交界的重要商業市鎮之一。"],
    ["雲林縣","北港鎮","笨港","北港舊稱笨港，因笨港溪氾濫將街市沖毀分為南北兩岸，北岸稱笨北港，簡稱北港，清代曾有「一府二笨三艋舺」之稱。","","北港舊稱「笨港」，這是台灣清領時期最重要的港口之一，享有「一府二笨三艋舺」的美譽，與台南府城、艋舺並列全台三大港市。「笨港」地名由來眾說紛紜，有一說認為源自平埔族語「Ponkan」的音譯，也有一說指當地多沙丘，形狀似「畚」箕而得名，古文獻中至少留下八種不同的地名解釋版本，至今仍無定論。乾隆15年（1750年），笨港溪（今北港溪）爆發山洪，將原本的笨港街沖毀，一分為二：溪南岸稱「笨南港」（簡稱南港，即今嘉義縣新港鄉南港村），溪北岸則稱「笨北港」，簡稱「北港」。其後因漳泉械鬥，漳州人另遷至北港東側的麻園寮居住，形成「新港」聚落（今嘉義新港鄉），這也是台灣「北港在南部、南港在北部」這個常令人困惑的地名謎題由來。北港朝天宮是全台歷史最悠久的媽祖廟之一，每年進香期間吸引數十萬信眾參與，是北港最重要的信仰與觀光資產。"],
    ["雲林縣","古坑鄉","庵古坑","古坑舊稱庵古坑，一說因移民在坑谷種植菴瓜而得名，一說源自打鐵店主人恩愛故事「尪婆仔坑」，因不雅日治時期改稱庵古坑。","","古坑鄉舊稱「庵古坑」，地名由來流傳兩種說法：第一種說法認為，早期入墾者在坑谷地帶種植一種稱為「菴瓜」的作物，因而以此為地名；第二種說法則帶有民間故事色彩，相傳古時此地住著一對恩愛的打鐵夫婦，其住處因而被稱為「打鐵坑」，因鄉民羨慕這對夫妻鶼鰈情深，又稱此地為「尪婆仔坑」，日治時期官方認為這個稱呼不夠文雅，遂改稱「庵古坑」，「庵」字帶有溫暖古窩的意涵。1920年，地方行政改制時進一步簡化為「古坑」，沿用至今。古坑鄉因地處阿里山山脈西麓，海拔落差大、氣候與土壤條件類似巴西頂級咖啡產區，發展出享譽全台的「古坑咖啡」，加上境內知名遊樂園劍湖山世界的加持，讓這個源自坑谷地形與打鐵夫妻傳說的山區鄉鎮，成為雲林縣最具知名度的觀光鄉鎮之一。"],
    ["雲林縣","大埤鄉","大埤頭","大埤舊稱大埤頭，一說因位於荷包連圳埤塘之頭而得名，一說因鄰近明末荷蘭人所建紅毛埤的頭頂位置而得名。","","大埤鄉舊稱「大埤頭」，地名由來主要有兩種說法：第一種說法指出，先民最初建村於灌溉水圳「荷包連圳」蓄水埤塘的源頭附近，這條水圳引倒孔溪之水向西北流向大埤頭匯入，因當地設有埤塘儲水，故稱「大埤頭」；第二種說法則追溯至明末荷蘭統治時期，指荷蘭人曾在大埤西北方興建一座蓄水埤塘「紅毛埤」（台灣民間慣以「紅毛」稱呼荷蘭人），而這處聚落恰好位於紅毛埤上游、埤塘頭頂的位置，居民便依此方位稱作「大埤頭庄」。無論何種說法為真，都反映了大埤鄉自清代以來便高度仰賴埤塘蓄水灌溉的農業發展背景。大埤鄉因土壤與氣候條件適宜，是台灣最重要的酸菜（大埤酸菜）產地，享有「酸菜的故鄉」美譽，每年生產的酸菜供應全台大部分市場需求。"],
    ["雲林縣","莿桐鄉","莿桐巷","莿桐原稱莿桐巷，因清康熙年間漢人村莊一巷兩側多莿桐樹而得名，1920年簡化為莿桐。","","莿桐鄉地名由來相對直白，源自當地早期的自然植被景觀：清康熙年間，這一帶已形成漢人聚居的村莊，村內一條主要巷道的兩側恰好種植著大量莿桐樹，先民依此特徵，將這處聚落稱為「莿桐巷」，莿桐是一種樹幹帶刺、春季開紅花的豆科植物，在台灣多地皆有以此命名的地名案例。1920年，日本殖民政府推行地方行政改制，將「莿桐巷」簡化為「莿桐」，沿用至今。莿桐鄉地處濁水溪沖積平原，因土壤肥沃、水源充沛，是雲林縣重要的水稻、花生與蔬果產區，境內饒平村（舊稱樹子腳）因客家移民拓墾歷史，也保留部分客家文化痕跡，讓這個因莿桐樹巷得名的平原鄉鎮，兼具農業生產與族群多元的地方特色。"],
    ["雲林縣","林內鄉","林內","林內因清朝以前是濃密如蔭的大片林野，閩人鄭萃徘率眾入墾後，因村莊建於森林之內而得名。","","林內鄉地名由來相對單純，這一帶在清代以前是林木蔥鬱、濃密如蔭的原始林野地帶。相傳來自福建漳浦的閩籍移民鄭萃徘，率眾前來此地開墾定居，在乾隆、嘉慶年間因協助平定地方民亂有功，獲得清廷封賞，家族從此在此傳家立業、人丁興旺，聚落人口逐漸集結成莊；由於這座村莊正是建立在原本茂密森林的內部，因而得名「林內」。林內鄉地處濁水溪出山口，是灌溉整個雲林平原的重要水利樞紐，境內的濁水溪引水工程與八堡圳系統，長期扮演彰雲平原農業命脈的角色；林內也是通往竹山、鹿谷等南投山區的交通門戶，鄰近的湖本村因螢火蟲生態保育聞名，是雲林縣重要的生態旅遊景點之一。"],
    ["雲林縣","二崙鄉","二崙","二崙因聚落建於兩座沙丘（崙）之間而得名，舊稱義崙，因客語「義」與「二」同音而演變成今名。","","二崙鄉地名由來源自其地形特徵：這一帶因河流沖積作用，形成兩座相鄰的沙丘（閩南語稱「崙」），先民在這兩座沙丘之間建立聚落，因而得名「二崙」。二崙鄉境內另有舊稱「義崙」，這與早期入墾此地的客籍移民有關：客家話中「義」與「二」發音十分相近，因而「義崙」與「二崙」兩種寫法一度並存混用，後來才統一定名為「二崙」，這種因客語發音相近而產生地名混用現象的案例，在雲林縣崙背、二崙一帶的客家移民聚落中並不罕見。二崙鄉地處濁水溪沖積平原，因土壤肥沃、氣候溫和，是台灣重要的蔬菜與水稻產區，尤其以九層塔、韭菜花等特色蔬菜聞名，境內詔安客家文化保存完整，是雲林縣少數仍保留客家語言與習俗的鄉鎮之一。"],
    ["雲林縣","崙背鄉","崙背","崙背因聚落建於一座沙丘背後而得名，先民依沙丘南北兩面分別稱「崙前」「崙背」，本鄉多屬沙丘北側而得名崙背。","","崙背鄉地名由來源自當地沙丘地形的相對位置：開拓先民為躲避強勁的東北季風與洪水侵襲，選擇在地勢較高的沙丘偏南地帶優先定居，隨著人口增加，逐漸以這座沙丘為分界，將沙丘南面已開發的聚落稱為「崙前」，後續移居到沙丘北面的村莊則稱為「崙背」，「崙」即指沙丘，「背」則表示位於沙丘背面之意。由於崙背鄉境內大部分聚落偏屬沙丘北側區域，因而以「崙背」作為整個鄉的名稱。崙背鄉與鄰近的二崙鄉同屬雲林縣詔安客家移民的主要聚居地，客家語言與傳統習俗保存相對完整，加上濁水溪沖積帶來的肥沃土壤，是重要的蔬菜與水稻產地，境內每年舉辦的詔安客家文化活動，也讓這個因沙丘地形得名的平原鄉鎮，成為雲林縣客家文化的重要據點。"],
    ["雲林縣","麥寮鄉","麥寮","麥寮因清代墾殖初期有農民種植小麥、搭建草寮居住而得名。","","麥寮鄉地名由來相對單純直白，據傳清代墾殖初期，先民在這片濱海荒地上試種小麥等雜糧作物，並在田間搭建簡易草寮作為看顧作物與暫時棲身之用，這片以種麥、搭寮為特徵的聚落，因而得名「麥寮」，這種依作物與臨時建物命名地方的方式，在台灣沿海拓墾聚落中相當常見。麥寮鄉地處濁水溪出海口北側，因地勢低平、土壤含鹽分較高，早期農業發展條件較為嚴苛，居民多兼營漁業與耐鹽作物種植。1990年代，台塑六輕工業區選定在麥寮鄉外海填海造陸興建，帶動麥寮從傳統農漁業鄉鎮迅速轉型為雲林縣重要的石化工業重鎮，也讓這個源自種麥搭寮拓墾史的濱海鄉鎮，在產業發展上出現戲劇性的轉變。"],
    ["雲林縣","東勢鄉","東勢厝","東勢因黃姓家族遷居於海豐港東側聚落，或因先民從海豐港登陸後在其東方立庄而得名，「勢」取閩南語方位與人旺勢振之意。","","東勢鄉地名由來有兩種說法：其一指出，清乾隆13年（1748年），一支黃姓家族遷入此地，隨著人口增加逐漸形成聚落，居民便以聚落所在的東側部分稱為「東勢厝」；另一說法則認為，早期移民多由「海豐港」（今地名已不存，位於東勢鄉西側沿海）登陸開墾，因這處聚落恰好位於海豐港的東方，故稱「東勢」，「勢」字在閩南語中除有方位之意，也隱含著人丁興旺、氣勢振興的吉祥寓意。東勢鄉地處雲林縣沿海平原地帶，因鄰近台西、麥寮等海口鄉鎮，同樣以農漁業為主要經濟活動，境內廣植花生、甘藷等耐旱耐鹽作物，是雲林縣典型的濱海農業鄉鎮之一。"],
    ["雲林縣","褒忠鄉","埔姜崙","褒忠原稱埔姜崙，因林爽文事件時，當地生員張源懃率鄉勇力抗叛軍有功，獲清廷賜「褒忠」二字為庄名。","","褒忠鄉舊稱「埔姜崙」，因最初移民在遍生埔姜（一種灌木植物）的沙丘（崙）上建立聚落而得名。乾隆51年（1786年）林爽文事件爆發，這場清代台灣規模最大的民變席捲全台，當地一位名為張源懃的生員（秀才），號召鄉勇數千人奮力抵抗叛軍侵擾，堅守鄉里數月之久，屢次擊退林爽文部隊的攻勢，事後更協助官府平定其他地區的動亂。事平之後，清廷除了封官獎賞張源懃之外，更特別賜予其居住地「褒忠」二字作為庄名，以表彰當地軍民對朝廷的忠誠貢獻，「埔姜崙」自此改稱「褒忠」。日治時期一度廢除褒忠舊名、恢復原稱埔姜崙，直到台灣光復後，才重新以「褒忠」定為鄉名，沿用至今，是雲林縣少數直接源自清代平亂事蹟、由官方賜名的鄉鎮地名。"],
    ["雲林縣","台西鄉","海口厝","台西原稱海口厝，因地處舊虎尾溪出海口而得名，戰後因位於台灣島西側，與台北、台南、台東、台中相對稱而改名台西。","","台西鄉舊稱「海口厝」，這個地名直接描述了當地的地理位置：這一帶地處舊虎尾溪注入台灣海峽的出海口附近，先民依此地形特徵，將聚落稱為「海口厝」，這種以「海口」直接命名濱海聚落的方式，在台灣沿海地區相當普遍。台灣光復後，政府為了行政區劃命名的系統性考量，將原本的「海口厝」改稱為「台西」，取其位處台灣本島西側之意，與台北、台南、台東、台中等以方位命名的地名相互對稱、呼應。台西鄉地處濁水溪與北港溪之間的沿海地帶，因地層下陷與海水倒灌問題較為嚴重，加上漁業資源豐富，是雲林縣重要的漁業鄉鎮，台西海口生態園區與夕陽美景，也讓這個源自「海口」地形描述的濱海鄉鎮，發展出獨特的海線觀光魅力。"],
    ["雲林縣","元長鄉","元掌","元長因清乾隆年間泉州人傅元掌率眾來此開墾建莊，鄉民感念其恩德，以其名「元掌」為莊名，後因諧音改稱元長。","","元長鄉地名由來直接紀念一位拓墾先驅：清乾隆6年（1741年），來自福建泉州府的傅元掌，率領族人渡海來到這片土地開墾，建立莊社，並熱心為地方公共事務服務，深受居民愛戴。傅元掌去世後，當地鄉民為感念他的開墾恩德與貢獻，便以其本名「元掌」作為莊名，這種直接以拓墾先賢姓名命名地方的案例，在雲林縣境內相當獨特，也反映了移民社會對開拓者的崇敬與紀念。至於「元掌」如何演變為今日的「元長」，說法有二：一說純粹是文字訛傳所致；另一說則指清嘉慶年間，當地居民曾協助平亂有功，獲清廷嘉許表揚，因「掌」與「長」發音相近，官方便將地名改為更具吉祥意涵的「元長」。元長鄉地處雲林縣西南沿海平原，是花生、蒜頭等雜糧作物的重要產地。"],
    ["雲林縣","四湖鄉","四湖","四湖因早期聚落沿境內四個潟湖陸化後遺留的池沼建立而得名。","","四湖鄉地名由來源自當地特殊的海岸地貌演變：這一帶原是台灣西南沿海常見的潟湖地形，隨著漫長歲月的泥沙淤積作用，這些潟湖逐漸陸化萎縮，僅在低窪處遺留下四個較大的淡水池沼，先民依傍這四處池塘建立聚落，因而得名「四湖」，鄰近的口湖、崙後湖、施厝湖等同樣帶有「湖」字的地名，都是同一套潟湖陸化過程留下的地形見證。四湖鄉地處雲林縣西南沿海地帶，因地層下陷與海水倒灌問題，加上鄰近的箔子寮漁港，是雲林縣重要的漁業與養殖鄉鎮，境內台灣寢具產業與周邊的花生、蒜頭等雜糧作物，共同構成四湖鄉多元的農漁業經濟樣貌。"],
    ["雲林縣","口湖鄉","烏麻園","口湖原稱烏麻園，因早期遍植烏麻而得名，後因四周魚池廣闊如湖，或因地處四湖等以湖為名的聚落群入口而改稱口湖。","","口湖鄉舊稱「烏麻園」，因早期這片土地上遍植一種稱為「烏麻」的作物而得名。關於後來改稱「口湖」的原因，主要有兩種說法：第一種說法指出，台灣光復後，這一帶因四周遍布廣闊如湖的魚塭養殖池，居民便依此景觀改稱「口湖」；第二種說法則從地理位置著眼，指這處聚落恰好位於四湖、後湖、內湖、施厝湖等一系列以「湖」為名的潟湖陸化聚落群的入口位置，因而得名「口湖」。口湖鄉地處雲林縣最西南端的沿海地帶，因地層下陷嚴重，加上1986年韋恩颱風重創當地養殖漁業，造成慘重傷亡，是台灣近代重大天然災害史上的傷痛記憶之一。如今口湖鄉以烏魚子、鰻魚等漁業養殖聞名，成龍濕地生態園區也是雲林縣重要的生態旅遊景點。"],
    ["雲林縣","水林鄉","水燦林","水林原稱水燦林，因早期是潟湖陸化後多沼澤地，沼澤內水漆樹（水燦）茂生而得名。","","水林鄉舊稱「水燦林」，這個地名描述了當地特殊的植被與地形演變：這一帶原本是台灣西南沿海常見的大片潟湖，隨著長期泥沙淤積而逐漸陸化，形成低窪多沼澤的地貌，沼澤地帶因而茂密生長著一種稱為「水漆」（水燦）的植物，這種植物生長於海泥濕地中，葉片布滿粗毛，觸碰後會引起皮膚腫痛過敏反應，與台灣民間俗稱「咬人狗」的植物有相似特性，先民依此特徵，將這片沼澤林地稱為「水燦林」，1920年簡化為「水林」。水林鄉與北港鎮同屬古笨港文化圈範圍，境內的番薯厝聚落更是知名藝人的故鄉，加上蕃薯、花生等雜糧作物種植興盛，是雲林縣沿海平原重要的農業鄉鎮之一。"],
    ["雲林縣","劍湖山","珠螺湖","劍湖山因山頂天然湖泊相傳鄭成功插劍求水湧泉成湖而得名，湖中原多無尾田螺，故舊稱珠螺湖。","","劍湖山地名源自古坑鄉永光村山頂上一座天然湖泊「劍湖」，關於這座湖的由來，流傳著兩種傳說：一說是玄天上帝出巡遊歷時，不慎將隨身寶劍遺落湖底；另一說則更廣為人知，相傳明鄭時期鄭成功行經此地時，將寶劍插立於大堀頂的台地上，劍拔出後泉水竟汩汩湧出、終年不絕，逐漸匯聚成湖，因而得名「劍湖」，這與台北劍潭、台中劍井等地流傳鄭成功插劍或拋劍的傳說，屬於同一類在台灣各地反覆出現的民族英雄地名附會現象。劍湖湖中原本棲息大量尾部退化的無尾田螺，因而又有「珠螺湖」的舊稱；也因湖水清澈見底，另稱「淨水湖」。1986年，企業家陳鏡村選在劍湖山附近的荒山野地開發遊樂園，1988年正式命名「劍湖山世界」對外營業，如今已是中南台灣規模最大的主題樂園之一，讓這座源自鄭成功傳說的山中湖泊，成為雲林縣最知名的觀光地標。"],
    ["雲林縣","石榴","石榴班","石榴班是斗六門出入內山的咽喉要地，地名最早見於清代諸羅縣志「石榴班陂」的水利工程記載，確切語源已難詳考。","","石榴班（今作石榴）是斗六市北側的傳統地域名稱，地名最早見於清代文獻《諸羅縣志》：「石榴班陂，在柴裡社東北，源由阿拔泉溪出，康熙49年（1710年），庄民合築」，可見早在18世紀初，這一帶便已因興建水利埤塘設施而留下「石榴班」的地名記錄，是雲林縣少數自清初沿用至今、未曾更名的古老地名之一。石榴班因地處斗六門進出阿里山內山地帶的咽喉要道，正是今日台3線石榴路的所在位置，自古便是交通往來的必經之地，光緒20年（1894年）《雲林縣采訪冊》記載當地已有五百三十戶、一千七百餘丁口，發展成僅次於斗六街本身的重要聚落。至於「石榴」二字的確切語源，究竟是因當地曾遍植石榴樹，或另有他解，文獻中並未明確記載，仍待進一步考證。如今石榴車站是雲林縣境內少數保留完整的鐵道車站建築之一，是鐵道迷造訪雲林時的重要景點。"],
    
    // --- 【嘉義縣市】 ---
    ["嘉義市","東區","諸羅山","東區源自嘉義古名「諸羅山」，因洪雅族社名而得名，乾隆年間因城民協助平定林爽文之亂，皇帝「嘉其忠義」賜名嘉義。","","嘉義市古名「諸羅山」，源自平埔族洪雅族「諸羅山社」的社名音譯，清康熙年間設縣治時，即以此為縣名「諸羅縣」。乾隆51年（1786年），林爽文起兵反清，戰事席捲全台，諸羅城遭叛軍圍困長達數月，城內軍民同心協力堅守城池，最終成功抵禦攻勢、力保城池不失。乾隆皇帝得知後，感念城中軍民對朝廷的忠誠義氣，御筆親賜「嘉義」二字，取「嘉其忠義」之意，將諸羅縣改名為嘉義縣，這是台灣少數由皇帝親自賜名、且與具體歷史事件緊密相連的地名案例。1982年嘉義市升格省轄市後，以中山路一帶為界劃分東西兩區，東區涵蓋嘉義公園、蘭潭等丘陵地帶，因鄰近阿里山森林鐵路起點，是嘉義市重要的文教與林業歷史發展區域。"],
    ["嘉義市","西區","諸羅山","西區同樣源自嘉義古名「諸羅山」，1982年劃分行政區時，因位於中山路以西、地勢較為平坦而得名西區。","","西區與東區同樣源自「諸羅山」這個嘉義最古老的地名淵源，是1982年嘉義市升格省轄市後，行政區劃分東西兩區時所產生的行政區。西區地勢相對平坦開闊，清代嘉義築城時，城池格局在地圖上俯瞰形似一顆桃子，因而嘉義又有「桃城」的雅稱，這個別稱至今仍常見於地方文史介紹與商家命名之中。西區境內因阿里山森林鐵路的木材運輸與集散功能，日治時期發展出繁榮的木材加工產業，林森路一帶當年甚至被稱為「木材街」，木材行、製材工廠林立，帶動嘉義市商業的蓬勃發展，如今西區仍是嘉義市人口最稠密、商業機能最完整的行政區，嘉義火車站與周邊商圈也座落於此。"],
    ["嘉義縣","太保市","溝尾","太保原稱溝尾庄，因清代武將王得祿平定林爽文、蔡牽有功，獲封「太子太保」而得名，是嘉義縣政府所在地。","","太保市舊稱「溝尾庄」，是清代台籍官員中官位最高者王得祿的故鄉。王得祿生於乾隆35年（1770年），十七歲時林爽文事件爆發，他主動率眾五百人擔任聯絡官，其後參與五十九次戰鬥而嶄露頭角；嘉慶年間又協助平定海盜蔡牽，屢建戰功，官拜浙江提督；道光18年（1838年）返台後，清廷加封他「太子太保」銜，是清代台灣本土出身、武將位階最高的一人，逝後更追贈伯爵、太子太師銜。鄉民為感念這位鄉賢的殊榮，將他的出生地「溝尾庄」改稱「太保庄」，「太保」二字自此成為地名，與坊間戲稱不良少年的「太保」用語純屬巧合，並無關聯。民國80年（1991年），因嘉義縣政府遷至此地，太保鄉升格為縣轄市，如今是嘉義縣的行政中心，境內並設有故宮南院。"],
    ["嘉義縣","朴子市","朴仔腳","朴子舊稱朴仔腳，相傳康熙年間信眾迎請媽祖神像返鄉途中，在牛稠溪畔一棵朴子樹下休息，因而在樹下建廟供奉，聚落因此得名。","","朴子舊稱「朴仔腳」，這個地名源自一段媽祖信仰的傳說：康熙26年（1687年），半月庄人林馬自鹿港恭請媽祖神像返家奉祀，途經牛稠溪（今朴子溪）南畔時，在一棵朴子樹下稍作休息，沒想到附近居民聞訊而來，紛紛請求讓媽祖神像暫留供人膜拜，此後信眾便在這棵朴子樹下建廟安奉，地方也因這株神蹟樹木而得名「朴仔腳」，意指朴子樹下之地，後簡化為「朴子」。這座因媽祖駐蹕而生的廟宇，日後發展成香火鼎盛的配天宮，是朴子的信仰中心，也讓朴子市與媽祖信仰的淵源，比多數台灣媽祖廟的建廟故事更增添了幾分機緣巧合的色彩。朴子市因地處嘉南平原西側，是嘉義縣西部重要的行政與商業中心，嘉義縣議會即設於此。"],
    ["嘉義縣","布袋鎮","布袋嘴","布袋舊稱布袋嘴，因地形位於一處內灣北岸突出的尖嘴狀沙洲上，遠望形似布袋開口而得名，另有蚊港、松仔港等舊稱。","","布袋地名由來與其獨特的海岸地形有關：這一帶地處鹽水溪出海口北側，外圍環繞著沙嘴地形，深居潟湖之內，整體輪廓神似一只布袋，因而得名「布袋嘴」，「嘴」指沙洲向海突出的尖端部位。布袋在歷史上還曾有多個不同稱呼：因台灣與廈門之間的航運以布袋為捷徑，加上附近海水浴場一帶松樹蒼鬱，曾稱「松仔港」；又因港邊蚊蟲肆虐，夏季風平浪靜時更為猖獗，也曾被稱為「蚊港」；日治時期地方士紳更取佛教七福神中「布袋和尚」的雅號，延用「布袋」之名至今，文人雅士則稱之為「岱江」。布袋因優良的潟湖地形，自清代以來便是重要的曬鹽產地與漁港，如今以布袋鹽田生態、新鮮海產與嘉義布袋往返澎湖的客輪航線聞名，是嘉義縣濱海觀光的重要門戶。"],
    ["嘉義縣","大林鎮","大莆林","大林舊稱大莆林，因開墾之初是一片廣大的森林地帶而得名，另一說指移民多來自廣東潮州府大埔之林地。","","大林舊稱「大莆林」，地名由來主要有兩種說法：第一種說法認為，這一帶在漢人拓墾之初，原是一片範圍廣大的森林地帶，先民依此景觀特徵，稱之為「大莆林」，意指大片的森林；第二種說法則從移民原鄉出發，指出當地部分先民是來自廣東潮州府大埔縣「林地」一帶的客家移民，將原鄉地名與新墾地結合而成「大莆林」。1920年，日本殖民政府推行地方行政改制，將「大莆林」簡化為「大林」，沿用至今。大林鎮因地處嘉南平原與阿里山山區交界的緩坡地帶，土壤與氣候條件適合鳳梨與稻米種植，加上大林糖廠的設立，日治至戰後初期曾是嘉義地區重要的製糖重鎮，如今雖已停止製糖，舊廠區與周邊的鳳梨田景觀，仍是大林鎮重要的農業與工業歷史記憶。"],
    ["嘉義縣","民雄鄉","打貓","民雄舊稱打貓，源自平埔族洪雅族「打貓社」音譯，1920年因日語近音「民雄」（Tamio）較為文雅而改名。","","民雄舊稱「打貓」，源自平埔族洪雅族「打貓社」的社名音譯，是漢人尚未大規模入墾前，這片區域原住民聚落的所在地。1920年，日本殖民政府推行地方行政改制，考量「打貓」二字的台語發音，與日語中「民雄」（讀作Tamio）的發音頗為相近，加上「民雄」二字字面意涵較為正面吉祥，遂以此取代原本的「打貓」，這與高雄舊稱「打狗」被改為日語同音的「高雄」（Takao），屬於同一波日治時期「以雅音同化不雅地名」的地名政策案例。民雄鄉境內因舊時打貓社範圍廣闊，衍生出頂菜園、大丘園等多個舊地名；境內廣播電台密集設置的「民雄放送所」，以及以老鷹咖啡莊園聞名的鴨母寮，讓這個承載平埔族記憶的地名，同時發展出廣播文化與觀光農業的多元面貌，民雄鵝肉更是全台知名的地方美食。"],
    ["嘉義縣","溪口鄉","雙溪口","溪口舊稱雙溪口，因聚落建於石龜溪與三疊溪兩條溪流的匯合處而得名。","","溪口鄉地名由來源自其所在的河川匯流位置：這處聚落座落於石龜溪與三疊溪兩條溪流交會之處，先民依此地形特徵，將此地稱為「雙溪口」，意指兩溪匯合的口岸，後簡化為「溪口」，沿用至今，這種依溪流交會點命名地方的方式，在台灣各地相當常見。溪口鄉地處嘉南平原核心地帶，因濁水溪沖積帶來的肥沃土壤，加上灌溉水源充足，自清代以來便是重要的農業聚落，如今以稻米、蒜頭等農產聞名，是嘉義縣典型的平原農業鄉鎮之一，境內的五通宮等地方廟宇，也是居民重要的信仰中心。"],
    ["嘉義縣","新港鄉","麻園寮","新港因笨港遭洪水沖毀後，居民遷此另闢新港口而得名，原稱麻園寮，因早期遍植胡麻而得名。","","新港鄉地名由來，與清代笨港的一段水患遷徙史密切相關：這一帶原稱「麻園寮」，因乾隆初年當地遍地種植胡麻而得名。乾隆年間，原本聚居於笨南港的大批漳州移民，因笨港溪（今北港溪）氾濫沖毀街市，加上漳泉械鬥的威脅，被迫遷居至此另闢新的港口市街，久而久之發展成繁榮大鎮，因而得名「新港」；因與笨港淵源深厚，也曾稱「笨新港」，後因「笨」字不雅而僅稱「新港」。新港鄉境內的奉天宮，供奉的媽祖神像相傳與北港朝天宮同源，是嘉義地區香火鼎盛的媽祖信仰中心之一，每年與北港朝天宮之間仍保有密切的宗教文化交流，新港鄉也是知名文學家、雲門舞集創辦人林懷民的故鄉，「新港文教基金會」推動的社區營造，更讓新港成為台灣社區總體營造的重要典範。"],
    ["嘉義縣","六腳鄉","六家佃","六腳原名六家佃，相傳明永曆年間陳士政等人招募六戶佃農入墾而得名，「家」與「腳」台語發音相近而轉為六腳。","","六腳鄉舊稱「六家佃」，相傳明永曆8年（1654年）閩籍漳州龍溪縣人陳士政等墾首，招募六戶佃農前來此地開墾，因而以「六家佃」為地名，其中「家」與「腳」在台語發音上十分相近，附近居民逐漸以諧音稱之為「六腳佃」，後簡化為「六腳」，沿用至今。六腳鄉地處嘉南平原西側，境內雙涵村保存的王得祿墓園，是全台規模數一數二的清代名墓，墓園周遭仍留有石翁仲、石馬、石羊、石虎等清代石刻，已列為國家一級古蹟，見證了太保市名人王得祿身後長眠於此的歷史淵源。六腳鄉因土壤肥沃，是嘉義縣重要的水稻與蔬果產區。"],
    ["嘉義縣","東石鄉","東石(泉州原鄉)","東石因清嘉慶末年福建泉州府晉江縣東石鎮的移民渡海來此，將故鄉地名移植於新墾漁村而得名。","","東石鄉地名由來，是台灣地名中「移民懷鄉命名」的典型案例：清嘉慶末年，來自福建泉州府晉江縣東石鎮的移民渡海來到這片沿海地帶，見當地地形與物產條件適合開闢魚塭、養殖牡蠣維生，便決定在此落腳定居，並將故鄉「東石」的地名直接移植到這處新開闢的漁村，藉此寄託對原鄉的思念之情，這種將原鄉地名複製到台灣新墾地的命名方式，也出現在雲南、大埔等地名的由來之中。東石鄉地處北港溪出海口南側，因潟湖與潮間帶地形發達，是台灣重要的牡蠣（蚵仔）養殖產地，享有「東石蚵」的美譽，加上東石漁人碼頭的觀光開發，讓這個承載泉州移民鄉愁的地名，發展成嘉義縣濱海漁業與觀光並重的重鎮。"],
    ["嘉義縣","義竹鄉","二竹圍","義竹原稱二竹圍，因是先民依序興建的第二座環植竹樹防禦聚落而得名，第一座稱頭竹圍。","","義竹鄉舊稱「二竹圍」，這個地名反映了清代沿海聚落防禦強風與盜匪的建村方式：這一帶因地處濱海地帶，冬季東北季風強勁，加上治安風險，先民習慣在聚落四周環植竹林作為防風、禦盜的天然屏障，稱為「竹圍」。這片區域最初建立的竹圍聚落稱為「頭竹圍」，隨後在其西南方另建的第二座竹圍聚落，便依序稱為「二竹圍」，後來才改稱較具正面意涵的「義竹圍」，簡化為「義竹」，沿用至今。義竹鄉地處嘉義縣最南端，因濱海地勢低窪，是嘉義縣重要的水稻、豆類與果蔗（可生食甘蔗）產地，境內的過路店、六桂等聚落，仍延續著清代竹圍防禦聚落一脈相承的拓墾記憶。"],
    ["嘉義縣","鹿草鄉","鹿仔草","鹿草原稱鹿仔草，因早期此地遍生一種鹿群喜食的植物「鹿仔草」（楮樹）而得名。","","鹿草鄉地名由來相當寫實：清代《臺灣府志》記載「鹿仔草即楮樹也，以其枝葉為鹿所嗜，因名之」，說明這一帶早期廣泛生長著楮樹，因其枝葉是野生梅花鹿群偏好的食物來源，先民便依此植物特徵，將此地稱為「鹿仔草」，1920年簡化為「鹿草」，沿用至今，這也從側面印證了清代嘉南平原一帶野生鹿群數量豐富、與台灣早期鹿皮貿易興盛的歷史背景相互呼應。鹿草鄉地處嘉南平原核心地帶，因土壤肥沃、水源充足，是嘉義縣重要的水稻與豆類產地，境內的圈仔內、後厝等聚落，仍保留著典型嘉南平原農村的聚落景觀與生活型態。"],
    ["嘉義縣","水上鄉","水堀頭","水上舊稱水堀頭，因地處灌溉水圳的源頭而得名，日治後依原意雅化為水上，意指位於水圳上源地帶。","","水上鄉舊稱「水堀頭」，這個地名直接描述了當地的水利地形特徵：這一帶恰好位於嘉南平原重要灌溉水圳的源頭處，「堀」意指水流匯聚或引水的坑窪之地，先民依此水利樞紐的地理位置，將此地稱為「水堀頭」。1920年，日本殖民政府推行地方行政改制，依循原本地名「位於水圳源頭」的意涵，將其雅化為「水上」，意指這處聚落位居水圳上游源頭地帶，沿用至今。水上鄉因地處嘉義市南側，是嘉義縣重要的交通門戶，境內設有嘉義機場與高鐵嘉義站，加上南靖糖廠（原稱蒜頭糖廠系統之一）等日治糖業設施舊址，讓水上鄉兼具傳統水利農業聚落與現代交通樞紐的雙重面貌。"],
    ["嘉義縣","中埔鄉","中埔","中埔因位處南南東方的頂埔與東北方竹崎鄉內埔的相對位置中央而得名，「埔」意指未開墾的荒地。","","中埔鄉地名由來源自清代拓墾聚落間的相對地理位置：「埔」字在閩南語中泛指尚未開墾的平坦荒地，中埔鄉恰好座落於南南東方的「頂埔」與東北方竹崎鄉境內「內埔」兩處埔地之間的中央位置，先民依此相對方位，將此地稱為「中埔」，這種依鄰近聚落相對位置命名地方的方式，反映了清代拓墾範圍逐步擴展、需要以既有地名為參照座標的普遍作法。中埔鄉地處嘉義縣東側丘陵與平原交界地帶，因氣候與土壤條件適宜，是知名的柿子（牛心柿）與冬筍產地，境內的觸口自然生態教育館與獼猴生態園區，是嘉義縣通往阿里山公路沿線重要的生態旅遊據點。"],
    ["嘉義縣","竹崎鄉","竹頭崎","竹崎原稱竹頭崎庄，因全鄉多山坡地形，早期竹林遍布，砍伐開墾後遍地留存竹頭而得名。","","竹崎鄉地名由來相當直白：這一帶因地勢多屬丘陵山坡地形，早期竹林茂密叢生，先民入墾時大規模砍伐竹林、開闢為可耕作的坡地，砍伐後的坡地上遍布著大量竹頭殘株，因而得名「竹頭崎庄」，1920年簡化為「竹崎」，沿用至今。竹崎鄉地處嘉義縣通往阿里山的必經要道，境內海拔落差極大，從平原一路爬升至高山地帶，是阿里山森林鐵路行經的重要中繼站，也是知名景點奮起湖、太興岩等地的所在鄉鎮，加上木材、竹筍與高山茶等林業與農業資源，竹崎鄉可說是連結嘉南平原與阿里山山區的重要地理與交通樞紐。"],
    ["嘉義縣","梅山鄉","梅仔坑","梅山原稱梅仔坑，因位於倒孔溪南岸寬闊坑谷、早期廣植梅樹而得名，另一說因坑內有人販售米糜（粥）而稱糜仔坑。","","梅山鄉舊稱「梅仔坑」，地名由來主要有兩種說法：第一種說法指出，這一帶位於倒孔溪南岸一處寬闊的坑谷地形內，早期廣泛種植梅樹，梅花盛開時景色宜人，因而得名「梅仔坑」；第二種說法則別具生活趣味，指本地地處山腳地帶、是行旅往來必經之處，曾有人在溪畔搭屋販售「米糕粥」（閩南語稱粥為「糜」），因而被稱為「糜仔坑」，因發音相近，「糜仔坑」與「梅仔坑」兩種說法逐漸混用，1920年正式定名為「梅山」。梅山鄉地處嘉義縣東北側山區，是全台海拔最低的高山鄉鎮之一，因日出美景聞名的「小百岳」大尖山與瑞里、太平雲梯等景點，加上高山茶、甜柿等農特產，讓梅山鄉兼具生態觀光與精緻農業的發展優勢。"],
    ["嘉義縣","番路鄉","番仔路","番路因位居嘉義通往阿里山鄒族部落的必經道路上而得名，「番」為清代漢人對原住民的慣稱。","","番路鄉地名由來相對直白：這一帶清代因地處嘉南平原漢人聚落，通往阿里山鄒族傳統領域的必經要道之上，先民依此交通機能特徵，將此地稱為「番仔路」，「番」是清代漢人對原住民的慣用稱呼，「路」則指這條連接平地與山地的重要通道，後簡化為「番路」，沿用至今。番路鄉地處嘉義縣東側丘陵地帶，是嘉義市通往阿里山公路（台18線）沿線的重要門戶，因氣候與土壤條件適宜，是台灣重要的芒果與龍眼產地，境內觸口一帶的天長地久橋、獼猴保護區，也讓番路鄉成為嘉義市近郊熱門的生態休閒去處。"],
    ["嘉義縣","大埔鄉","後大埔","大埔鄉舊稱後大埔，因與台南東山鄉境內較早開發的大埔庄相對，本地位置較後，故稱後大埔，先民多來自廣東潮州府大埔縣。","","大埔鄉地名由來與移民原鄉及聚落開發先後順序皆有關聯：「大埔」原是廣東省潮州府下轄的一個縣名，清代大批來自大埔縣的客家移民渡海來台開墾時，習慣將原鄉地名移植到新墾地，作為對故土的追念；由於台南縣（今台南市）東山鄉境內，已有一處較早形成、同樣稱為「大埔庄」的聚落，為了區別兩地，本地便相對稱為「後大埔」，台南者則稱「前大埔」，1920年簡化為「大埔」，沿用至今。大埔鄉地處曾文溪上游、嘉義縣東南側山區，因大埔水庫（曾文水庫的重要調節水庫）的興建，加上高山茶產業的發展，如今是嘉義縣人口最少、卻擁有豐富水域生態景觀的山區鄉鎮。"],
    ["嘉義縣","阿里山鄉","吳鳳鄉","阿里山鄉原名吳鳳鄉，紀念清代通事吳鳳，1989年因吳鳳「捨身取義」故事被指為虛構且醜化原住民，正式更名為阿里山鄉。","","阿里山鄉在1945年台灣光復後，最初命名為「吳鳳鄉」，是為了紀念清代擔任阿里山地區通事的吳鳳；官方教科書長期宣揚吳鳳「捨身取義、感化原住民革除出草陋習」的故事，並在鄉內設有吳鳳廟與銅像。然而，隨著原住民族權益意識抬頭，鄒族與學術界陸續提出質疑，指出這段廣為流傳的故事情節多有杜撰成分，且以「野蠻」形象醜化原住民族，經過長期的正名運動與社會討論，教育部於1980年代將教科書中的吳鳳故事刪除，鄉公所也在1989年3月正式將「吳鳳鄉」更名為「阿里山鄉」，改以境內最知名的地標「阿里山」為鄉名，這是台灣少數因歷史敘事爭議而修正行政區名稱的案例。「阿里山」之名本身則相傳源自鄒族一位傳說中的首領「阿巴里」，鄒族人稱其獵場為「阿里山」，如今阿里山鄉以日出雲海、森林鐵路與高山茶聞名，是全台最具代表性的高山觀光勝地之一。"],
    ["嘉義縣","奮起湖","畚箕湖","奮起湖舊稱畚箕湖，因地形三面環山、中間下凹，狀如畚箕而得名，「湖」在此指盆地，非真有湖泊，後取諧音改為奮起湖。","","奮起湖並非真正的湖泊，其舊稱「畚箕湖」直接描述了當地的地形特徵：這處海拔約1405公尺的聚落，因大凍山、光崙山及摩天嶺三面環繞、中央低窪下凹，從高處俯瞰狀似農具「畚箕」，加上台語慣稱盆地為「湖仔」，因而得名「畚箕湖」；民國時期，地方認為此名不夠雅致，取「畚」與「奮」諧音、「箕」改為「起」，寓意「奮發圖強」，正式改稱「奮起湖」。奮起湖的興盛完全拜阿里山森林鐵路所賜：這裡是森林鐵路最大的中途站，早年蒸汽火車行駛至此需要加水、填煤，加上時值中午用餐時刻，車員與乘客紛紛下車休息，逐漸帶動便當、小吃等商家聚集，孕育出奮起湖鐵路便當的獨特飲食文化，也讓這個因盆地地形得名的山中聚落，成為阿里山鐵道沿線最具人氣的老街景點。"],
    ["嘉義縣","達娜伊谷","Tanayiku","達娜伊谷（Tanayiku）為鄒族語，意指「忘記憂愁的地方」，因1989年山美部落齊心推動溪流護漁復育成功而聞名全台。","","達娜伊谷（Tanayiku）位於阿里山鄉山美部落境內，是鄒族傳統獵場之一，其名稱在鄒族語中意指「忘記憂愁的地方」。這裡曾因非法毒魚、電魚等破壞性捕撈方式，導致溪流生態嚴重受創，1989年，時任山美村長的高正勝發起護溪保育計畫，村民打破鄒族傳統氏族各自擁有漁場的慣例，將原屬各家族的漁場捐獻出來，共同投入達娜伊谷溪的生態復育工作，經過多年努力，終於讓俗稱「苦花」的鯝魚族群重新繁盛，成群優游於清澈見底的溪流之中，也讓達娜伊谷成為台灣民間自主發起生態保育的先驅案例，2002年山美部落更因此獲頒總統文化獎。如今每年11月固定舉辦的「寶島鯝魚節」，結合鄒族迎神祭儀、小米祭與戰祭歌舞展演，讓達娜伊谷不僅是生態保育的成功典範，更成為認識鄒族文化的重要窗口。"],
    ["嘉義市","檜意森活村","檜町","檜意森活村因日治時期興建的官舍建材多取自阿里山檜木而稱「檜町」，是台灣保存最完整的林業宿舍建築群。","","檜意森活村所在的「檜町」，是日治時期因應阿里山林業開發而興建的官方宿舍聚落：1899年阿里山林場開始開發，總督府為運送珍貴的檜木資源，自1906年起興建阿里山森林鐵路，1914年全線通車，起點便設於嘉義市北門驛，木材由此運至嘉義集散加工，帶動嘉義躍升為當時台灣四大都市之一，享有「木材都市」的美稱。營林所自大正3年（1914年）起陸續興建職員宿舍群，因建材大量採用阿里山檜木，整片街區仿若檜木森林，因而得名「檜町」，範圍北側為基層職員宿舍、南側則是高級職等官舍，全區占地約3.4公頃，共存留65戶木造建築。戰後由台灣省林務局接收作為員工宿舍，2005年起陸續登錄為嘉義市歷史建築，2007年獲列入行政院振興經濟公共建設計畫，歷經整建修復，2013年以「檜意森活村」之名重新對外開放，成為台灣保存最完整、規模最大的日式林業官舍建築群，也是嘉義市重要的文創觀光景點。"],
    ["嘉義縣","南靖","南靖(福建原鄉)","南靖因清代福建漳州府南靖縣移民渡海來此開墾，將原鄉縣名移植於新墾聚落而得名，境內南靖糖廠曾是嘉義重要的製糖廠。","","南靖地名同樣是台灣「移民懷鄉命名」的典型案例：清代來自福建漳州府南靖縣的移民渡海來到嘉義水上鄉一帶開墾定居，依循台灣移民社會常見的命名習慣，將原鄉「南靖」的縣名移植到新開闢的聚落，藉此寄託對故土的思念，這與東石、大埔等地名的由來邏輯相同。日治時期，南靖因蔗糖產業興盛，設立「南靖製糖所」（南靖糖廠），一度是嘉義地區規模數一數二的製糖廠，並鋪設糖業鐵道運輸甘蔗與蔗糖，帶動周邊聚落的商業發展；戰後由台灣糖業公司接手經營，直到製糖產業式微才停止運作。如今南靖糖廠舊址雖已走入歷史，但這段因移民懷鄉命名、又因製糖產業興盛的雙重歷史記憶，仍是水上鄉地方文史的重要篇章。"],

    // --- 【台南市】 ---
    ["台南市","中西區","赤崁","中西區古名赤崁，源自西拉雅族「赤崁社」音譯，鄭成功攻克後改稱東都明京，是台灣最早的行政中心所在地。","","台南市中西區古名「赤崁」，源自西拉雅族赤崁社的漢字音譯，1624年荷蘭人在此建立普羅民遮城（今赤崁樓），作為統治台灣的行政中心。永曆15年（1661年），鄭成功攻陷普羅民遮城，將赤崁地方改為「東都明京」，設一府二縣，府治「承天府」即設於此；永曆18年，鄭經改東都為東寧，並劃分東安、西定、寧南、鎮北四坊，是台南市最早的行政區劃。清康熙23年設台灣府後，府治與台灣縣治皆設於東安坊，是「府城」之名的由來。1920年，「台南市」正式定名沿用至今。2004年，台南市原有的中區與西區合併，因兩區同屬清代府城核心地帶，遂合稱「中西區」，是全台南市歷史古蹟密度最高的行政區，赤崁樓、孔子廟、祀典武廟等重要古蹟皆座落於此。"],
    ["台南市","東區","東安坊","東區源自清代台灣府城「東安坊」，是府城東側的行政區劃，因鄭經時期劃分四坊而得名。","","東區地名源自明鄭時期永曆18年（1664年），鄭經將承天府劃分為東安、西定、寧南、鎮北四坊時所設立的「東安坊」，是台南市最古老的行政區劃系統之一。清代台灣府與台灣縣治皆設於東安坊內，是當時全台的政治中心；乾隆15年，縣治雖遷往鎮北坊，東安坊仍持續是府城重要的核心地帶。1920年台南市正式定名後，東安坊一帶逐漸簡稱為「東區」。東區因鄰近成功大學，加上府城歷史尚未過度都市化的丘陵地帶，日治時期發展成文教機構聚集之地，境內的台南公園、大東夜市與東門城遺跡，讓東區兼具歷史底蘊與現代生活機能，是台南市人口最多的行政區之一。"],
    ["台南市","南區","鯤鯓","南區地名源自安平外海一連串沙洲「鯤鯓」，因沙洲狀似大魚（鯤）浮游海面而得名。","","南區地名與台南沿海特殊的沙洲地形密切相關：17世紀時，安平外海分布著七座相連的沙洲島，由北而南依序稱為一鯤鯓、二鯤鯓、三鯤鯓……直到七鯤鯓，因古人想像這些狹長的沙洲宛如神話中的大魚「鯤」浮游於海面，故以「鯤鯓」為名，今日南區境內的「鯤鯓里」正是這段沙洲地形歷史的直接見證。隨著台江內海逐漸淤積陸化，這些原本各自獨立的沙洲才與台灣本島相連。1920年台南市定名後，這片位於府城南側、涵蓋部分鯤鯓沙洲地帶的區域，正式劃為「南區」。南區因鄰近安平港與台南漁光島，是台南市重要的漁業與港口腹地，境內保留的鯤鯓王平和堂等廟宇，仍延續著這段與海共生的沙洲聚落信仰傳統。"],
    ["台南市","北區","鎮北坊","北區源自清代台灣府城「鎮北坊」，乾隆年間台灣縣治由東安坊遷此後，成為府城北側的行政核心。","","北區地名源自明鄭永曆18年劃設府城四坊之一的「鎮北坊」，意指鎮守府城北側的行政區劃。清乾隆15年（1750年），台灣縣治由東安坊遷移至鎮北坊，使這一帶躍升為府城行政與軍事的重要核心地帶，加上東安坊仍保有部分機能，「東安、鎮北二坊俱在今台南市」，這也是台南市自清代以來被稱為「府城」的由來之一。1920年台南市定名後，鎮北坊簡化為「北區」，沿用至今。北區境內的台南公園（前身為鎮北坊一帶）、開基天后宮、大觀音亭等歷史建築，見證了這片區域自清代以來作為府城行政核心的悠久歷史，如今北區也是台南市重要的住宅與商業機能區域。"],
    ["台南市","安平區","大員","安平舊稱大員，源自西拉雅族「台窩灣社」音譯，「台灣」一名即由此輾轉而來，是全台最早的漢人與西方勢力接觸據點。","","安平地名的演變過程，直接牽動了「台灣」這個名稱的由來：這一帶最初是西拉雅族「台窩灣社」（Tayouan）的傳統領域，漢人依音譯稱之為「大員」，這個詞彙後來擴大指稱整個台灣島，並輾轉演變出「台灣」這個沿用至今的名稱。1624年，原盤據澎湖的荷蘭人轉而登陸大員沙洲，興建熱蘭遮城（今安平古堡）作為統治中心，開啟台灣近代史上第一個西方統治政權的據點；1661年鄭成功攻克熱蘭遮城後，改稱「安平鎮」，取其部將家鄉福建泉州安平之名，兼有「永保安寧太平」之意。清代於此設水師協鎮署，日治大正9年（1920年）正式定名為「安平街」，戰後改制為安平區。境內的安平老街（延平街）是全台第一條街道，安平古堡、億載金城等古蹟林立，是認識台灣近代史開端的重要據點。"],
    ["台南市","安南區","安順","安南區因1920年地方行政改制，取「安平」之南方之意，設「安順庄」，戰後改稱安南區。","","安南區這一帶原是台江內海的一部分，隨著溪流長期泥沙淤積，逐漸陸化形成新生海埔地，清代以來吸引移民入墾。1920年，日本殖民政府推行地方行政改制，因這片新生地位於安平的北方偏南地帶，且行政區劃上歸屬安平轄區延伸範圍，遂設立「安順庄」，隸屬台南州新豐郡。戰後，行政區域調整，因這片區域位於台南市安平區以北、府城以南的浮覆地帶，改稱「安南區」，取其方位意涵。安南區因地勢低窪、水系發達，早期以曬鹽、養殖漁業為主要產業，境內的四草綠色隧道、鹿耳門天后宮等地標，加上鄭成功登陸鹿耳門的歷史典故，讓安南區成為兼具生態濕地與歷史記憶的台南市行政區。"],
    ["台南市","永康區","埔姜頭","永康舊稱埔姜頭，因早期是埔姜樹叢生的荒埔而得名，明鄭時期因隸屬永康里而改稱永康。","","永康區舊稱「埔姜頭」，地名由來與清初的鹿皮貿易產業有關：這一帶原是埔姜樹（一種灌木）叢生的未開墾荒地，「埔」指平地、「羌」則指鹿隻，反映當時漢人以米、鹽等民生物資向平埔族交換鹿皮的貿易活動，鹿皮多輸往日本製作武士鎧甲，鹿肉乾則運回大陸，永康正位於這條貿易通路的要衝。明鄭時期，部將林、黃等人率眾駐屯開墾此地，隸屬「永康里」，取「永保安康」之意；日治時期地方制度改革，便沿用「永康里」舊稱，改稱「永康庄」，戰後改制為永康鄉，民國81年（1992年）升格為永康市，2010年台南縣市合併後改為永康區。永康因緊鄰台南市區，是台南都會區人口成長最快速的衛星市鎮之一。"],
    ["台南市","歸仁區","紅瓦厝","歸仁舊稱紅瓦厝，因當地居民多以紅瓦覆蓋屋頂而得名，明鄭時期因勸導平埔族歸化、設「歸仁里」而改稱歸仁。","","歸仁區舊稱「紅瓦厝」，這個地名直接描述了當地聚落的建築特色：早期移民建屋時普遍採用紅瓦覆蓋屋頂，形成一片紅瓦屋舍的聚落景觀，因而得名。明鄭時期，鄭氏政權積極勸導鄰近的西拉雅族平埔族群歸順教化、接受漢人統治體制，並在此設立「歸仁里」，取「歸化仁德」之意，這與台南其他因鄭氏教化政策命名的地名（如仁德、新化）屬於同一套政治教化式命名邏輯。戰後，「歸仁里」正式改制為「歸仁鄉」，2010年台南縣市合併升格後改為歸仁區。歸仁區因鄰近台南高鐵站與歸仁十三窯遺址，加上關廟、龍崎等周邊丘陵地形，是台南市東南側重要的交通樞紐與新興重劃區。"],
    ["台南市","新化區","大目降","新化舊稱大目降，源自西拉雅族「大目降社」音譯，鄭成功平定該社後劃入承天府新化里，取「新歸化之番社」之意。","","新化區舊稱「大目降」，源自西拉雅族「大目降社」的社名音譯，是台南平原西拉雅族四大社之一。永曆15年（1662年），鄭成功平定大目降社後，將此地劃入承天府管轄的「新化里」，取「新歸化之番社」的政治教化意涵，這與歸仁、仁德等地因鄭氏教化政策命名的邏輯相同。清代設「大目降庄」，隨著漢人移入日益繁榮，改稱「大穆降街」，日治時期又改回「大目降街」；直到大正9年（1920年）地方制度改革，才正式簡化定名為「新化街」，成為新化郡的行政中心，戰後定名新化鎮，2010年改制為新化區。新化因保存完整的日治老街建築群與新化果菜市場，是台南市郊區重要的歷史文化與農產集散重鎮。"],
    ["台南市","左鎮區","拔馬","左鎮因明鄭時期在轄內左側隅角設侍衛營鎮駐兵而得名，境內拔馬則源自西拉雅族社名。","","左鎮區地名由來，據傳源自明鄭時期軍事佈防的相對位置：鄭氏政權在這片轄地的左側隅角設置侍衛營鎮、駐紮兵力，因而得名「左鎮」。左鎮區境內的「拔馬」（今左鎮里一帶），則是另一個更古老的地名，源自西拉雅族部落社名的音譯，是漢人尚未大規模入墾前，這片丘陵地帶原住民的傳統聚落所在。左鎮區地處惡地地形（月世界）與丘陵交界地帶，因1931年在菜寮溪流域發現「左鎮人」頭骨化石（後經研究修正年代），一度被認為是台灣最早的人類化石紀錄，境內設有台灣化石館，加上草山月世界的惡地景觀，讓左鎮成為認識台灣史前史與特殊地質景觀的重要據點。"],
    ["台南市","玉井區","噍吧哖","玉井舊稱噍吧哖，源自西拉雅族支族「大武壠」社群語言音譯，1920年因日語近似音改稱玉井，1915年噍吧哖事件為台灣武裝抗日最後一役。","","玉井區在荷蘭與清代文獻中稱為「大武壠」，是西拉雅族支族「四社熟番」中噍吧哖社、芒仔芒社、宵里社等部落的傳統領域。1920年，日本殖民政府推行地方行政改制，取「噍吧哖」（Tapani）的日語近似讀音「玉井」（Tamai），將地名雅化為玉井，沿用至今。玉井最為人所知的歷史事件，是1915年由余清芳、江定、羅俊等人發起的「噍吧哖事件」（又稱西來庵事件），這是台灣武裝抗日行動中規模最大、犧牲也最慘烈的一次，事件平定後，日方進行大規模報復性屠殺，遇難者估計逾千人，是台灣武裝抗日史畫下句點的關鍵事件。如今玉井以芒果產業聞名全台，享有「芒果的故鄉」美譽，每年舉辦芒果節推廣地方農特產。"],
    ["台南市","楠西區","茄拔","楠西舊稱茄拔，源自阿里山四社群「茄拔社」社名，因清代隸屬楠梓仙溪之西的「楠梓仙溪西里」而改稱楠西。","","楠西區舊稱「茄拔」，源自曹族（鄒族）支系阿里山四社群中「茄拔社」的社名音譯，是漢人入墾前這片丘陵地帶原住民的傳統聚落。清代，這一帶因地處楠梓仙溪（今旗山溪）西岸，行政區劃上隸屬「楠梓仙溪西里」，1920年，日本殖民政府推行地方改制，將此地名簡化為「楠西」，沿用至今。楠西區地處曾文水庫上游集水區，因氣候與土壤條件適宜，是台灣重要的芒果與楊桃產地，境內的曾文水庫、密枝里的萬佛寺與梅嶺風景區，讓楠西兼具水庫生態與丘陵農業觀光的多重魅力，是台南市東側山區重要的休閒農業鄉鎮。"],
    ["台南市","南化區","南庄","南化舊稱南庄，因位於北寮（今北寮村）南方而得名，1920年取「南庄」之南與「內新化南里」之化，合稱南化。","","南化區舊稱「南庄」，這個地名由來源自其相對於鄰近聚落的地理位置：這一帶位處北方另一處聚落「北寮」的南側，先民依此方位關係，將此地稱為「南庄」。1920年，日本殖民政府推行地方行政改制時，取「南庄」的「南」字，加上此地清代隸屬「內新化南里」的「化」字，兩者組合成「南化」，這種截取兩個舊地名或行政區劃用字重新組合命名的方式，與苗栗寶山鄉（草山+寶斗仁）的命名邏輯相似。南化區地處台南市東側山區，因南化水庫的興建，是重要的水源保護區，加上龍眼、破布子等丘陵農產，是台南市面積廣闊卻人口稀少的山區鄉鎮之一。"],
    ["台南市","仁德區","土庫","仁德舊稱土庫，因是竹編塗泥、用來儲存穀物的庫倉而得名，1920年因明鄭時期隸屬仁德里而改稱仁德。","","仁德區舊稱「土庫」，這個地名描述了當地早期常見的穀物儲存設施：先民以竹子編織成籠狀結構，外層塗抹泥土加固防潮，作為儲藏稻穀的倉庫，這種「土庫」在當地數量眾多，因而成為地方代稱。1920年，日本殖民政府推行地方行政改制，考量此地明鄭時期隸屬「仁德里」的行政區劃淵源，取「仁德」二字重新命名，這與歸仁、新化等地同樣沿用明鄭教化政策下的舊里名。仁德區因鄰近台南市區與台南高鐵站，加上台南都會公園、十鼓文創園區（原仁德糖廠）等文創觀光設施，已從清代單純的穀倉聚落，發展成台南市重要的文創觀光與住宅衛星市鎮。"],
    ["台南市","關廟區","香洋","關廟原名香洋，因清代此地遍植可製成染料的「香洋草」而得名，後因境內山西堂主祀關聖帝君香火鼎盛而改稱關廟。","","關廟區舊稱「香洋」，因清代此地廣泛種植一種可提煉染料的植物「香洋」（可能與大菁類似），先民依此經濟作物特徵，將此地稱為「香洋」。境內的「關廟村」因建有主祀關聖帝君的廟宇「山西堂」，香火十分鼎盛，隨著這座廟宇的知名度日益提升，逐漸取代原本的「香洋」，成為整個地區的代稱「關廟」，是台灣少數因廟宇香火鼎盛而直接影響地名演變的案例。關廟區因土壤與氣候條件適宜，是台灣重要的鳳梨與竹筍產地，尤其以關廟麵（一種日曬麵條）聞名全台，讓這個因染料作物與關帝信仰交織而成的地名，發展出獨具特色的地方農產與飲食文化。"],
    ["台南市","龍崎區","龍船+崎頂","龍崎因1920年行政改制，從轄內「龍船」與「崎頂」兩個舊地名中，各取一字組合而成。","","龍崎區地名由來相當特殊，是台灣地名中少見的「拼字組合」案例：1920年，日本殖民政府推行地方行政改制時，將轄內原有的「龍船」（因地形或傳說與龍舟相關而得名）與「崎頂」（意指崎嶇坡地的頂端）兩個舊地名，各取一字重新組合，正式定名為「龍崎」，沿用至今。龍崎區地處台南市東側惡地地形與丘陵交界地帶，因土壤貧瘠、農業發展受限，是台南市人口最少的行政區，卻擁有草山月世界惡地地形與竹林密布的獨特自然景觀，加上龍崎牛埔泥岩水土保持教學園區，讓這個因地名拼字而生的山區鄉鎮，成為認識台灣惡地地形與生態工法的重要場域。"],
    ["台南市","官田區","官佃","官田舊稱官佃，源自荷蘭時期的「王田」制度，明鄭時期改為官方招募佃農耕作的官有田地而得名。","","官田區地名由來，源自台灣土地開發史上一項重要的土地制度演變：荷蘭統治時期，台灣土地名義上屬荷蘭東印度公司所有，稱為「王田」，農民須向公司繳納高額地租；明鄭政權接收台灣後，將原本的王田改為「官田」，招募移民前來耕作，這些耕作官有田地的佃農稱為「官佃」，這片區域便以此為地名。1920年，日本殖民政府推行地方行政改制，正式簡化定名為「官田」，沿用至今。官田區因地處嘉南平原水源豐沛地帶，是全台重要的菱角產地，享有「菱角的故鄉」美譽，境內的烏山頭水庫（珊瑚潭）與八田與一紀念園區，更見證了日治時期嘉南大圳的水利建設歷史。"],
    ["台南市","麻豆區","蔴荳","麻豆源自西拉雅族「麻豆社」，是台南四大社之一，地名意涵眾說紛紜，或指眼睛，或指港口，確切語源仍待考證。","","麻豆區地名源自西拉雅族「麻豆社」（Mattau）的社名音譯，是清代文獻記載台南平原西拉雅族四大社（新港、目加溜灣、蕭壠、麻豆）之一，勢力範圍涵蓋今麻豆一帶。關於「麻豆」的語意，學界說法不一：一說認為與西拉雅語中「眼睛」相關的詞彙有關；另有學者從地形推測，麻豆舊社緊鄰倒風內海港汊，可能與「港口」之意有關，但確切語源至今仍缺乏定論。荷蘭統治時期，麻豆社曾與荷蘭東印度公司爆發激烈的武裝衝突（麻豆社事件），是西拉雅族抵抗外來殖民勢力的重要歷史事件。如今麻豆以文旦柚聞名全台，享有「麻豆文旦」的美譽，加上麻豆代天府等信仰重鎮，是台南市曾文溪流域重要的農業與信仰中心。"],
    ["台南市","佳里區","蕭壠","佳里原為西拉雅族「蕭壠社」社域，1920年取境內「佳里興」之佳里二字，將舊稱蕭壠庄改為佳里街。","","佳里區原是西拉雅族四大社之一「蕭壠社」的傳統領域，「蕭壠」一詞的西拉雅語意涵，一說與「契約之地」相關，反映此地作為部落與外界交易往來的重要據點。1920年，日本殖民政府推行地方行政改制，考量境內另有一處聚落名為「佳里興」（曾是清代天興縣治所在地，地位顯赫），遂取其中「佳里」二字，將原本的「蕭壠庄」正式改稱「佳里街」，戰後沿用為佳里鎮、2010年改制為佳里區。佳里區因地處台南市北門地區交通樞紐，加上金唐殿蕭壠香、震興宮等百年信仰中心，以及蕭壠文化園區（原佳里糖廠）的活化再利用，是台南市北區重要的文化與農產集散重鎮。"],
    ["台南市","西港區","西港仔","西港因位居直加弄港（今安定）之西而得名，另一說因地處後營之西的汊港而得名。","","西港區地名由來主要有兩種說法：第一種說法指出，這一帶東方約三公里處有「直加弄港」（今安定區一帶），西港恰好位於其西側，因相對位置而得名「西港仔」；第二種說法則從地形出發，指這一帶昔日大部分屬於海埔浮覆地，西港地處台江內海的汊港地帶，因位於後營聚落之西而得名。西港區因地處曾文溪下游沖積平原，土壤肥沃，是台南市重要的胡麻與芒果產地。境內慶安宮每三年舉辦一次的「西港刈香」（西港仔香），是台灣王醮祭典中規模最大、陣頭最多元的信仰盛事之一，已登錄為國家重要民俗，香陣繞境範圍涵蓋周邊九十六個庄頭，是台灣民間信仰文化的重要活態資產。"],
    ["台南市","七股區","七股寮","七股原稱七股寮，清道光年間十六股首之一招佃開墾此地，因分得七股份額而得名，另一說為七位福建移民合股開闢魚塭而得名。","","七股區地名由來主要有兩種說法：第一種說法指出，清道光年間，這片台江內海浮覆地由官方招募十六股墾首前來開墾，其中一部分墾地依股份分配歸屬「七股」份額的佃戶所有，佃戶在此搭建茅寮聚居，因而得名「七股寮」，1920年簡化為「七股」；第二種說法則認為，這片新生海埔地形成後，曾有七位來自福建的移民結伴前來，合股開闢一處魚塭維生，因而得名「七股塭」，沿用演變為七股。七股區因台江內海長期淤積形成廣闊的潟湖與潮間帶地形，是全台最重要的黑面琵鷺度冬棲地，加上七股鹽山、七股潟湖等景觀，及虱目魚、牡蠣養殖產業，讓七股區兼具生態保育與漁業經濟的雙重價值。"],
    ["台南市","將軍區","漚汪","將軍原稱漚汪，源自西拉雅族社名，因清康熙年間施琅將軍平台有功，獲賜此地為世襲業地而改稱將軍。","","將軍區舊稱「漚汪」，源自西拉雅族部落社名的音譯，是漢人入墾前這片濱海地帶原住民的傳統領域。康熙22年（1683年），施琅將軍率軍平定台灣有功，清廷將這片浮覆荒埔地賜予施琅作為世襲業地，施家因而成為當地最大的地主（大租戶），招募漳州、泉州移民前來墾耕，並向佃農收取俗稱「施侯租」的大租，這段歷史也讓「漚汪」逐漸改稱「將軍」，以紀念施琅將軍的封賜。道光年間，遠在北京的施琅後裔出售部分租館田地，僅保留少數租館持續收租。將軍區因濱臨台灣海峽，是台南市重要的漁業與虱目魚養殖鄉鎮，境內的將軍漁港、苓仔寮天后宮，也是地方信仰與漁業經濟的重要據點。"],
    ["台南市","學甲區","學甲","學甲即西拉雅族「學甲社」譯音地名，一說即史料記載的「史椰甲社」，是台南平埔族聚落之一。","","學甲區地名源自西拉雅族部落社名的音譯，關於確切的族社對應，學界有不同看法，一說認為「學甲」即清代文獻中記載的「史椰甲社」，是台南平原西拉雅族眾多部落之一的音譯轉化，反映這片濱海平原在漢人大規模入墾之前，原是平埔族群生活繁衍之地。學甲區因地處將軍溪流域，清代以來便是重要的農漁業聚落，境內的學甲慈濟宮，主祀保生大帝，相傳其開基神像由白礁移民迎奉來台，是台灣保生大帝信仰的重要祖廟之一，每年上白礁謁祖祭典吸引大量信眾參與。學甲另以虱目魚產業聞名，享有「虱目魚的故鄉」美譽，是台南沿海重要的漁業經濟重鎮。"],
    ["台南市","北門區","北門嶼","北門舊稱北門嶼，因地處倒風內海大潟湖北側門戶處的濱外沙洲而得名，另有位居府城北方、鄰近青峰闕北口等說法。","","北門區舊稱「北門嶼」，地名由來主要有幾種說法：一說這一帶原是清代倒風內海大潟湖內側的一處濱外沙洲，因地處潟湖北側門戶要衝，故稱北門；另有說法認為，是因這片沙洲位居台灣府城的北方而得名；還有一說與鄰近的「青峰闕」（潟湖北方出入口）地理位置有關。北門區因地勢低窪、土壤含鹽分高，清代以來便是重要的曬鹽產地，境內的井仔腳瓦盤鹽田是台灣現存最古老的鹽田之一，夕陽映照鹽田水面的景觀廣受攝影愛好者喜愛。北門區同時也是烏腳病盛行的歷史記憶所在地，早年因飲用含砷地下水導致烏腳病肆虐，如今設有台灣烏腳病醫療紀念館，見證這段公共衛生史的艱辛歷程。"],
    ["台南市","新營區","新營","新營因明鄭時期屯辦何積善等人在舊營（今鹽水區）之外另闢新屯墾據點，相對於「舊營」而得名。","","新營區地名由來，源自明鄭時期屯田制度下聚落發展先後的相對關係：鄭氏政權在鹽水一帶（今鹽水區舊營里）最初設立屯田據點，稱為「舊營」；隨著拓墾範圍擴大，屯辦何積善等人另在此地開闢新的屯墾聚落，為與既有的舊營區別，便稱為「新營」，這種依開發先後順序、以新舊相對命名地方的方式，在台灣拓墾史上相當常見。新營區地處嘉南平原核心地帶，因鐵路縱貫線設站，加上糖業興盛，日治至戰後初期一度是台南縣治所在地，是嘉南平原北側重要的行政、商業與交通樞紐，境內的新營糖廠與台灣鹽博物館，也讓新營保有豐富的產業歷史記憶。"],
    ["台南市","後壁區","後壁寮","後壁因聚落座落於另一處聚落後方的簡易草寮而得名，舊稱後壁寮。","","後壁區地名由來相對單純，源自清代拓墾聚落的相對位置：這處聚落座落於當地另一處較早開發聚落的後方，先民在此搭建簡易草寮居住開墾，因而得名「後壁寮」，1920年簡化為「後壁」，沿用至今，這種依相對方位加上臨時建物命名的方式，在台灣各地聚落發展中相當常見。後壁區地處嘉南平原精華地帶，因嘉南大圳灌溉系統完善，是台灣重要的優質稻米產區，享有「無米樂」的美譽（同名紀錄片即以後壁區菁寮里為背景拍攝），境內保存完整的菁寮老街、金德興藥舖等歷史街屋，加上黃家古厝等傳統建築，讓後壁區成為認識嘉南平原農村生活文化的重要據點。"],
    ["台南市","白河區","店仔口","白河舊稱店仔口，因清乾隆年間吳姓商人在往來要道十字路口開設茶水店而得名，後因白水溪環村而流改稱白河。","","白河區舊稱「店仔口」，這個地名由來源自一段商旅往來的生活場景：清乾隆年間，白河是通往當時商業繁榮中心「下茄苳」的必經之路，一位吳姓異鄉人在往來要道的十字路口搭建簡易草廬，販售涼水、茶點，供南來北往的行旅休憩，「店仔口」便是指這處草廬商店的門口，久而久之成為整個聚落的代稱。地方人士後來認為「店仔口」一詞不夠文雅，加上白水溪由東向南、再向西環繞村落而流，溪水因流經石灰岩地質而略顯白濁，因而依此改稱「白河」，光復後正式定名白河鎮，2010年改制為白河區。白河因白河水庫與關子嶺溫泉聞名，加上全台最大的蓮花產區，是台南市著名的溫泉與生態觀光重鎮。"],
    ["台南市","東山區","哆囉嘓","東山原為西拉雅族支族洪雅族「哆囉嘓社」所在地，後因地名不雅改稱番社街，光復後因位居新營東方山區改稱東山。","","東山區在漢人入墾前，是洪雅族「哆囉嘓社」的傳統領域，隨著漢人移民日增，逐漸形成以原住民社名為基礎的「哆囉嘓庄」。此後地方一度改稱「番社街」，直接以「番社」（原住民聚落）指稱這片區域，但因「番社」一詞逐漸被認為帶有歧視意味且不夠文雅，光復後，鑑於這一帶恰好位於新營東方的丘陵山區，遂正式改稱「東山」，這種因原有地名不雅而依地理方位重新命名的案例，與台北古亭（鼓亭改古亭）等地名演變邏輯相似。東山區因丘陵地形、氣候涼爽，是台灣重要的咖啡與龍眼乾產地，境內東山吊神橋、崁頭山等景點，加上關子嶺溫泉區部分範圍，讓東山成為台南市東側山區兼具農業特色與生態旅遊的鄉鎮。"],
    ["台南市","六甲區","六甲","六甲因鄭成功參軍陳永華率眾開墾時，依開墾面積劃分二甲、六甲、七甲等村，六甲位居中心而得名。","","六甲區地名由來，相傳與明鄭時期一段大規模開墾行動有關：鄭成功麾下參軍陳永華率領部眾在此開闢荒地，依開墾面積大小將墾地劃分為二甲、六甲、七甲等不同區塊（一甲約合0.97公頃），這種以實際開墾面積直接命名地方的方式，與台灣其他地區「張犁」系列地名屬於相近的計量式命名邏輯。由於「六甲」這片墾地恰好位居整體開墾範圍的中心位置，加上面積規模適中，最終這片區域便以「六甲」作為整個鄉鎮的名稱。六甲區地處嘉南平原與丘陵交界地帶，因烏山頭水庫（珊瑚潭）水源豐沛，是台南市重要的水稻與芒果產地，境內的赤山龍湖巖是台灣最早興建的觀音廟之一，也是地方重要的信仰中心。"],
    ["台南市","下營區","下營","下營因明鄭時期在此設鎮屯田，依屯營相對位置分為頂、中、下營，本地位居下方而得名。","","下營區地名由來，源自明鄭時期軍事屯田制度下聚落分布的相對位置：鄭氏政權在這片區域設立屯田據點，依駐軍營區的地理位置，劃分為頂營、中營、下營三處，下營即因地處這套屯營系統的下方位置而得名，這種依軍事屯田相對位置命名地方的方式，與台南柳營（查畝營）、新營等地同樣源自明鄭時期的屯墾軍事體制。下營區地處嘉南平原核心地帶，因土壤肥沃、水源充足，是台南市重要的黑豆與鵝肉產地，享有「黑豆的故鄉」美譽，境內下營黑豆椪、東粿寮以及紅毛厝天主堂等特色地標，讓這個源自明鄭屯田制度的地名，發展出獨具特色的地方農產與宗教文化景觀。"],
    ["台南市","柳營區","查畝營","柳營舊稱查畝營，即明鄭時期勘查田畝的屯營之地，因當地居民多為劉姓、「劉」與「柳」同音而改稱柳營。","","柳營區舊稱「查畝營」，地名由來與明鄭時期的土地清丈制度有關：鄭氏政權在此設立屯田據點時，需詳細勘查、丈量田畝面積以利分配管理，這處負責勘查田畝事務的營區，因而得名「查畝營」；另一說則認為，此地可能與明鄭陸軍「柳宿鎮」的屯墾範圍相鄰而得名。「查畝營」這個地名沿用至大正9年（1920年），因當地居民以劉姓居多，「劉」與「柳」在台語發音上十分相近，地方遂順勢將地名改為「柳營庄」，戰後改制為柳營鄉，2010年改為柳營區。柳營區因劉氏家族興建的劉家古厝聞名，加上八翁牧場的鮮乳產業，是台南市嘉南平原上兼具歷史建築與酪農產業特色的鄉鎮。"],
    ["台南市","鹽水區","鹽水港","鹽水舊稱鹽水港，因潮汐可上溯至此、海水略帶鹹味而得名，因港道彎曲如半月，又稱月津港。","","鹽水區舊稱「鹽水港」，明鄭時期稱為「奎壁庄」，清雍正9年（1731年）闢為台灣島內重要的貿易港口。這一帶因地處八掌溪支流出海口附近，海水漲潮時可沿港道上溯至此，河水因而略帶鹹味，加上與稍北的「淡水港」（今台南六甲一帶）相對而言水質偏鹹，因而得名「鹽水港」。由於這條港道環繞街區蜿蜒而流，整體形狀有如一輪半月，鹽水港因此又有「月津港」或「月港」的雅稱，這個充滿詩意的別稱至今仍常見於地方文化活動的命名中，如著名的「月津港燈節」。鹽水區因清代商業鼎盛，一度有「一府二鹿三艋舺四月津」的俗諺流傳，境內橋南老街、八角樓等古蹟，加上元宵節舉辦的鹽水蜂炮，是全台知名的民俗慶典活動。"],
    ["台南市","善化區","灣裡","善化因明鄭時期隸屬「善化里西堡」而得名，舊稱灣裡，源自西拉雅族「目加溜灣社」音譯。","","善化區舊稱「灣裡」，源自西拉雅族「目加溜灣社」（Bakaloan）的社名音譯簡化而來，是台南平原西拉雅族四大社之一的傳統領域。明鄭時期，這一帶行政區劃隸屬「善化里西堡」，1920年，日本殖民政府推行地方行政改制，取「善化里」的「善化」二字，正式取代原本的「灣裡」，成為今日通行的地名，這也讓善化與新化、歸仁、仁德等地一樣，沿用了明鄭時期帶有教化意涵的舊里名。善化區因鄰近曾文溪，土壤肥沃，加上善化糖廠與胡麻產業，是台南市重要的農業重鎮，境內慶安宮主祀西拉雅族與漢人共同信仰的神祇，也是了解台南平埔族漢化歷程的重要地方信仰據點。"],
    ["台南市","大內區","內庄","大內因楊姓兄弟自福建漳州遷來，兄長楊內住於內庄，因而得名，日治時期改稱大內，沿用至今。","","大內區舊稱「內庄」，相傳三百多年前，楊姓兩兄弟自福建漳州府龍溪縣渡海遷來此地拓墾：兄長名為楊內，居住在「內庄」；弟弟楊石則住在鄰近的「石仔瀨」，兩處聚落因兄弟關係密切，逐漸統稱為「內庄」，意指位於曾文溪河道與嘉義丘陵末端之間、地勢內側的聚落。日治時期，因「內庄」一詞過於簡略，取其舊稱「大內」（意指範圍較大的內側聚落），正式定名，光復後改制為大內鄉，2010年改為大內區。大內區地處曾文溪中游西岸，因河谷地形與惡地景觀交錯，是台灣重要的酪梨產地，境內的走馬瀨農場、二溪吊床式咖啡園等休閒農業設施，讓大內成為台南市山區兼具農業特色與觀光休閒的鄉鎮。"],
    ["台南市","山上區","山仔頂","山上舊稱山仔頂，因全境屬丘陵地形，聚落多建於小山丘之上而得名，後簡化雅化為山上。","","山上區舊稱「山仔頂」，這個地名直接描述了當地的地形特徵：這一帶因地處丘陵地帶，境內分布著許多大小不一的小山丘，早期移民為避開低窪積水地帶，習慣將聚落建立在地勢較高的小山丘之上，因而得名「山仔頂」，後來才簡化改稱同義的「山上」，沿用至今。山上區地處曾文溪流域丘陵地帶，因水源與地質條件特殊，日治時期曾在此設立台灣第一座現代化淨水場「山上花園水道博物館」（原台南水道），供應府城自來水源，如今已轉型為國定古蹟與觀光景點。山上區也因惡地地形與龍湖岩等信仰據點，是台南市山區兼具工業遺產與自然景觀的鄉鎮。"],
    ["台南市","新市區","新市","新市因荷蘭時期將原居當地的西拉雅族新港社人遷移至此另建新社而得名，另一說因商旅在此聚集買賣而形成新興市集。","","新市區地名由來主要有兩種說法：第一種說法認為，17世紀荷蘭統治台灣期間，將原本居住於他處的西拉雅族「新港社」族人遷移至此，另闢新的部落據點，因而得名「新市」；第二種說法則從商業角度出發，指相傳三百年前，山區居民搬運農產前往台南府城販售時，習慣在此地大樹下歇腳休息，因苦於周邊無處購買食物，便鼓勵鄰近新港社居民前來擺攤零售，漸漸聚集成一條小型街市，因而得名「新市」。新市區因鄰近台南科學園區（南科），加上新市糖廠與蕃薯厝聚落，已從清代的商旅休息站與部落遷居地，轉型為台南市重要的高科技產業重鎮。"],
    ["台南市","安定區","直加弄","安定原稱直加弄，源自西拉雅族「目加溜灣社」屬社社名，1920年因清代隸屬「安定東里」而改稱安定。","","安定區舊稱「直加弄」，這個地名源自西拉雅族「目加溜灣社」轄下一處屬社的社名音譯，與善化（原稱灣裡，同樣源自目加溜灣社）淵源深厚，兩地同屬西拉雅族目加溜灣社的傳統活動範圍。1920年，日本殖民政府推行地方行政改制，考量這一帶在清代隸屬「安定東里」的行政區劃，遂取「安定」二字重新命名，取代原本的「直加弄」，沿用至今。安定區地處曾文溪南岸沖積平原，因土壤肥沃、水源充足，是台南市重要的胡蘿蔔（安定蘿蔔）與蔬果產地，境內的蘇厝真護宮等地方廟宇，也是這片西拉雅族古老領域上，漢人移民信仰文化扎根發展的見證。"],
    ["台南市","安平古堡","熱蘭遮城","安平古堡原為1624年荷蘭人興建的熱蘭遮城（Fort Zeelandia），1661年鄭成功攻克後改稱王城，是台灣最早的西式城堡建築。","","安平古堡的前身是荷蘭東印度公司於1624年起在大員沙洲興建的軍事堡壘，最初稱為「奧倫治城」，1627年改建為磚石構造的「熱蘭遮城」（Fort Zeelandia），作為荷蘭統治台灣近40年間的最高行政與軍事中心，城東並設有市鎮供對遠東貿易之用。永曆15年（1661年），鄭成功率軍經過九個月的圍城，迫使荷蘭東印度公司末任台灣長官揆一投降，結束荷蘭在台統治，鄭氏政權將熱蘭遮城改稱「安平鎮城」或「王城」，作為鄭氏三代的居城。清代因政治中心轉移至赤崁一帶，安平城逐漸傾頹荒廢；日治時期，城垣遺構多遭拆除挪用建材，僅存部分稜堡殘蹟，1930年代在城址上興建洋樓式瞭望台，即為今日安平古堡的主體建築樣貌，是全台歷史最悠久的城堡遺跡與熱門觀光地標。"],
    ["台南市","億載金城","二鯤鯓砲台","億載金城原稱二鯤鯓砲台，是清光緒元年沈葆楨聘請法國工程師設計監造的西式砲台，為台灣第一座newly式海防砲台。","","億載金城位於二鯤鯓沙洲之上，故初名「二鯤鯓砲台」，是清光緒元年（1875年），欽差大臣沈葆楨為因應牡丹社事件後台灣海防危機，聘請法國工程師帛爾陀（或譯必麒麟）設計監造的西式稜堡砲台，是台灣第一座採用歐式建築工法興建的近代化海防設施，也是全台現存最古老的西式砲台之一。城門上方沈葆楨親題「億載金城」匾額，取「億萬年屹立、堅固如金城」之意，寄託永固海疆的期許，這個充滿氣勢的題名此後便成為這座砲台廣為人知的正式名稱，逐漸取代原本依地理位置命名的「二鯤鯓砲台」。億載金城為方形稜堡砲台，四角凸出以利交叉火力防禦，外壕環繞、內置大砲，雖歷經多次戰事卻從未真正發揮實戰效果，如今已列為國定古蹟，是台南安平地區重要的歷史景點。"],
    ["台南市","林鳳營","林鳳營","林鳳營因明鄭部將林鳳率軍在此屯田開墾而得名，是明鄭時期軍屯制度留下的地名見證。","","林鳳營地名由來，直接紀念一位明鄭時期的軍事將領：鄭氏政權推行寓兵於農的屯田制度，命部將林鳳率領所屬軍隊在此地屯墾定居，這片由林鳳部隊開闢的屯墾區域，因而以其姓名命名為「林鳳營」，與新營、柳營、下營等地同樣源自明鄭時期軍事屯田制度所留下的地名系統，但林鳳營是少數直接以特定將領姓名命名、而非以屯營相對位置或勘查職務命名的案例。林鳳營地處後壁區與六甲區交界的嘉南平原地帶，因鐵路縱貫線在此設有林鳳營車站，加上林鳳營鮮乳等知名酪農產品的行銷，讓這個承載明鄭軍屯歷史記憶的地名，透過鮮乳品牌廣為現代消費者所知。"],
    ["台南市","隆田","番子田","隆田舊稱番子田，因清代此地是平埔族麻豆社遷居的聚落而得名，1920年因「番子」不雅、且期許農業興隆改稱隆田。","","隆田舊稱「番子田」，這個地名直接反映了當地的族群歷史：清代這一帶原是漢人拓墾勢力擴張後，部分被迫遷徙的西拉雅族麻豆社人另闢新居的聚落，因當地漢人慣以「番子」稱呼原住民，加上此地是原住民開墾的田地，因而得名「番子田」。1920年，日本殖民政府推行地方行政改制，考量「番子」一詞帶有歧視意味且不甚雅觀，加上期許這片農地能持續豐收興隆，遂改稱「隆田」，沿用至今，這種因族群稱謂不雅而更名的案例，與台北「番社」改稱、彰化「番挖」改稱「芳苑」的邏輯相似。隆田因縱貫鐵路設站，加上鄰近官田菱角產區，是官田區重要的交通與農產集散據點。"],
    ["台南市","拔林","芭樂林","拔林地名由台語「芭樂林」音轉而來，因當地早期遍植番石榴（芭樂）成林而得名。","","拔林地名由來相對單純，源自台語發音的轉化：這一帶早期遍植番石榴（台語稱「芭樂」）樹木，成片林立，先民依此果樹景觀特徵，將此地稱為「芭樂林」，隨著時間演變，「芭樂」二字的台語發音逐漸轉音簡化為「拔林」，這種因植物名稱音轉而形成地名的案例，在台灣地名演變中相當常見。拔林地處善化區境內，因鄰近縱貫鐵路設有拔林車站，加上周邊肥沃的嘉南平原農地，是台南市重要的水稻與雜糧產區，這個源自芭樂林蔭的地名，如今雖已不見昔日大片芭樂林的景象，卻仍持續透過拔林車站的站名，訴說著這段與果樹相關的拓墾記憶。"],
    ["台南市","保安","車路墘","保安車站原稱車路墘，因車站緊鄰縱貫鐵路軌道旁（墘）而得名，因與台語「永保安康」諧音，成為熱門的祈福車票景點。","","保安車站原稱「車路墘」，這個地名直接描述了車站所在的地理位置：「車路」指鐵路軌道，「墘」在閩南語中意指邊緣或旁側，車路墘意指聚落緊鄰鐵路軌道旁側而得名，1962年，配合行政區劃調整，車站正式更名為「保安車站」，沿用至今。近年來，保安車站因站名的台語發音與「永保安康」的祝福語諧音相近，加上鄰近台南的「永康」車站，兩站車票組合起來恰好蘊含「永保安康」的美好寓意，與台中海線的「日南」「追分」車票（永保安康、永不分手）同樣蔚為風潮，吸引大量鐵道迷與遊客前來購買紀念車票祈福，讓這個原本單純描述鐵路位置的地名，意外成為台南熱門的鐵道文化觀光景點。"],
    ["台南市","四草","北汕尾","四草舊稱北汕尾，因位於鹿耳門南方、台江內海北側沙汕（沙洲）末端而得名，是鄭成功登陸鹿耳門的重要歷史現場。","","四草舊稱「北汕尾」，這個地名描述了當地的沙洲地形位置：這一帶地處鹿耳門水道南側、台江內海北側一連串沙洲（汕）地帶的末端位置，先民依此地理特徵，稱之為「北汕尾」。永曆15年（1661年），鄭成功率軍由鹿耳門水道進入台江內海，成功登陸這片區域，展開圍攻荷蘭熱蘭遮城的軍事行動，四草因而成為台灣史上這場關鍵戰役的重要歷史現場。如今四草因保存完整的紅樹林生態與台江國家公園的設立，發展出「四草綠色隧道」（俗稱台灣版亞馬遜河）等生態觀光資源，加上四草大眾廟、鄭成功登陸紀念園區等歷史地標，讓這個曾是軍事登陸要地的沙洲地帶，轉型為結合歷史記憶與濕地生態的觀光勝地。"],

    // --- 【高雄市】 ---
    ["高雄市","鹽埕區","鹽埕","鹽埕因明鄭時期漢人在此開闢鹽田曬鹽，閩南語稱曬鹽廣場為「埕」而得名，日治後成為高雄最早發展的行政與商業中心。","","鹽埕區地名由來相當直白：明鄭與清代時期，漢人在這片臨海地帶開闢大片鹽田，從事曬鹽產業，閩南語慣稱這種開闊平坦的曬鹽場地為「埕」，因而得名「鹽埕」。日治時期，隨著打狗港（今高雄港）的開發建設，鹽埕因鄰近港區而迅速發展成高雄最早的商業與行政中心，高雄州廳、高雄地方法院等重要官署皆設於此，銀樓、布莊林立，一度是全高雄最繁華的區域，享有「金融街」的美稱。戰後，隨著高雄市區向東擴張，加上前鎮、苓雅等新興商圈崛起，鹽埕逐漸沒落，如今則因駁二藝術特區、高雄關（打狗英國領事館文化園區）等歷史建築活化，重新以文創觀光的姿態展現這片曾經曬鹽產鹽之地的城市風華。"],
    ["高雄市","鼓山區","打鼓山","鼓山源自「打狗山」（柴山），因西拉雅族馬卡道支族在此以莿竹圍籬，其語「Takau」音轉為打狗，日治因山形如鼓改稱高雄。","","鼓山區地名源自境內的「打狗山」（今壽山、柴山），這座山名的由來，源自平埔族馬卡道族的語言：族人早期以一種帶刺的莿竹圍繞住家四周作為防禦圍籬，這種莿竹在馬卡道語中稱為「Takau」，久而久之，族人便以此稱呼自己居住的地方，漢人依台語近音記為「打狗」。清代文獻中，因山形起伏似鼓，也稱「打鼓山」或「打鼓岩」。1920年，日本殖民政府推行地方行政改制，考量「打狗」漢字不甚文雅，取其日語發音相近的「高雄」（Takao）取代，這也是「高雄」市名的直接由來；而鼓山區則沿用「打鼓山」的「鼓」字精神，正式定名為「鼓山」。鼓山區境內的打狗英國領事館、西子灣與旗津之間的鼓山輪渡站，是高雄最具歷史底蘊的港灣區域之一。"],
    ["高雄市","左營區","左營","左營因明鄭時期實施屯田制度，「左衝鎮」部隊在此屯墾戍守而得名，清代並在此興建全台第一座土造縣城「鳳山舊城」。","","左營區地名源自明鄭時期的軍事屯田制度：鄭氏政權為鞏固台灣防務，將軍隊分區屯墾戍守，其中「左衝鎮」部隊奉命駐紮於此地開墾，因而得名「左營」，這與台南新營、下營、林鳳營等地同樣源自明鄭軍屯體制的地名系統一脈相承。康熙61年（1722年），清廷在左營興建鳳山縣城（今稱「鳳山舊城」），以三合土（俗稱咕咾石）夯築城垣，是台灣第一座具規模的土造縣城；乾隆51年（1786年）林爽文事件中，舊城遭攻破，福康安平亂後奏請將縣治遷往下埤頭街（今鳳山區），舊城自此逐漸沒落，僅留東門、南門城垣供後人憑弔。左營因日治及戰後長期為軍事重鎮，加上蓮池潭風景區與左營高鐵站的設立，是高雄市重要的交通樞紐與歷史古蹟聚集地。"],
    ["高雄市","楠梓區","楠仔坑","楠梓原稱楠仔坑，因當地溪畔遍植楠木、是楠木砍伐集散地而得名，日治時期簡化雅化為楠梓。","","楠梓區舊稱「楠仔坑」，這個地名直接反映了當地早期的自然植被與林業活動：這一帶溪流沿岸廣泛生長著楠木（一種質地堅硬的優良木材樹種），先民在此砍伐楠木並集中運送販售，因而得名「楠仔坑」，「坑」則指溪流沖刷形成的谷地。1920年，日本殖民政府推行地方行政改制，將「楠仔坑」簡化雅化為「楠梓」，沿用至今。楠梓區因鄰近後勁溪，日治時期起便是高雄重要的工業發展區域，戰後更因高雄煉油廠（中油楠梓廠）與加工出口區的設立，成為南台灣石化與電子產業的重鎮，加上國立中山大學、義守大學等高等院校進駐，讓楠梓區兼具工業生產與學術文教的雙重機能。"],
    ["高雄市","三民區","三塊厝","三民舊稱三塊厝，因明鄭時期王、蔡、鄭三姓移民分別在此搭屋開墾而得名，戰後取「三民主義模範區」之意改稱三民。","","三民區舊稱「三塊厝」，地名由來與一段明鄭時期的墾拓歷史有關：相傳有王、蔡、鄭三個姓氏的移民隨鄭氏軍隊來台後，分別在此地不同區塊搭屋墾耕定居——王姓在東段「橋頭」、蔡姓在南段「海墘」、鄭姓在西北段「後角」，三姓族人各自建立起傳統的方塊型四合院聚落，因而得名「三塊厝」。台灣光復後，政府取建設「三民主義模範區」的政治理想，將原本的「三塊厝」正式改稱「三民區」，這種以政治理念重新命名地方、卻巧妙保留原有「三」字諧音的手法，是戰後台灣地名演變中相當特殊的案例。三民區因高雄火車站座落於此，加上高雄醫學大學等機構林立，是高雄市人口最多、也是全國人口數一數二的行政區。"],
    ["高雄市","新興區","大港埔","新興原稱大港埔，因高雄河支流「𩻸港」（鯉魚港）流經此處未墾荒地（埔）而得名，戰後因區內蓬勃發展的新興氣象而改稱新興。","","新興區舊稱「大港埔」，相傳這條高雄河支流因棲息大量鯉魚（台語稱「𩻸仔」），加上民間流傳一則鯉魚精受媽祖庇佑、在此落地生根繁衍後代的傳說故事，這條支流因而被稱為「𩻸港」，沿岸未開墾的荒野平地則稱「𩻸港埔」，後演變為書寫較簡便的「大港埔」。台灣光復後，隨著這片區域逐漸繁榮發展，呈現一片新興蓬勃的氣象，政府便順勢將地名改為「新興區」，沿用至今。新興區因中山路、中正路口的大圓環（今高雄捷運美麗島站所在地）座落於此，加上五福商圈的興起，是高雄市區重要的商業與行政核心地帶，美麗島事件的歷史現場也位於本區境內。"],
    ["高雄市","前金區","前矜","前金舊稱前矜，因面對鼓山、緊鄰愛河，取「面山矜河」之意而得名，另有部落依開發先後分為「前矜」「後矜」之說。","","前金區舊稱「前矜」，地名由來主要有兩種說法：第一種說法認為，這一帶因地理位置面對鼓山、緊鄰愛河（打狗川），先民取「面山矜河」的意境而得名「前矜」；第二種說法則從聚落發展先後出發，指這片區域最初分為「前矜」「後矜」兩個部落，其中前矜部落開發較早，逐漸發展成清代中葉統合而成的「前金庄」，「矜」與「金」發音相近，後續便簡化統一為較吉祥的「前金」。前金區地處高雄市區核心地帶，日治時期高雄州廳（今高雄市立歷史博物館）等重要官署設於此，加上五福商圈、大立百貨等商業機能，是高雄市行政文教與商業機能兼具的核心行政區。"],
    ["高雄市","苓雅區","苓仔寮","苓雅原稱苓仔寮，因清代漁民在此搭寮、以「苓仔」漁網捕魚曬網而得名，因地名欠雅，日治後改稱較文雅的苓雅寮。","","苓雅區舊稱「苓仔寮」，這個地名直接反映了當地早期的漁業活動：清代漁民習慣使用一種稱為「苓仔」的漁網具在此捕魚，並在岸邊搭建簡易草寮，作為曬網、整理漁獲的暫棲之所，因而得名「苓仔寮」。地方人士後來認為這個名稱不夠典雅，遂取諧音較為文雅的「能雅寮」，其後又改為「苓雅寮」，這一帶清代已是高雄地區重要的商業聚落，苓雅寮的商賈勢力甚至一度與鹽埕、旗後並駕齊驅。1946年，行政區域調整時，一度取「連續幽雅」之意定名「連雅區」，民國41年（1952年）再依市議會決議，改稱沿用至今的「苓雅區」。苓雅區因鄰近高雄軟體園區與夢時代購物中心，是高雄市重要的商業與住宅核心區域。"],
    ["高雄市","前鎮區","援剿前鎮","前鎮因明鄭時期「援剿前鎮」部隊在此屯墾戍守而得名，是明鄭軍屯制度留下的地名見證。","","前鎮區地名源自明鄭時期的軍事屯田制度：鄭氏政權為鞏固台灣南部防務，派遣「援剿前鎮」部隊在此地屯墾戍守，這片由該部隊開闢的墾地，因而得名「前鎮」，與左營（左衝鎮）、燕巢（援剿中鎮、右鎮）等地同樣源自明鄭時期屯田制度下的軍事地名系統。境內前鎮港（前鎮河）自清代起便是重要的水路要道，可沿河上溯至下陂頭街（今鳳山區），是苓雅寮、打狗港區通往鳳山的必經之處。日治時期在此設「前鎮莊」，戰後正式以「前鎮」為區名。前鎮區因鄰近高雄港與高雄軟體科技園區，是高雄市重要的港埠、加工出口區與物流產業重鎮，也是全台最大的漁貨轉運據點之一。"],
    ["高雄市","旗津區","旗後","旗津原稱旗後，因聚落位於形似旗竿的旗山（旗後山）之後而得名，因扼守打狗港灣、往來船隻須渡津往返，故改稱旗津。","","旗津區舊稱「旗後」，這個地名描述了聚落所在的相對地理位置：這片狹長的沙洲地帶，緊鄰一座山勢狀似旗竿的小山丘「旗後山」，聚落建立於此山的後方，因而得名「旗後」，與「鼓山」（打狗山，形似鼓）隔著打狗港灣相互對望，構成「旗鼓相當」的地理意象。由於旗後地處港灣入口要衝，往來船舶必須經由渡口（津）進出，加上當地文人曾組織「旗津吟社」，取「旗鼓相當，維揚我武；津梁鞏固，克壯其猷」的聯語意境，台灣光復後，正式將地名改為「旗津」，沿用至今。旗津因擁有旗後燈塔、旗後砲台等歷史古蹟，加上知名的海產街與旗津海水浴場，是高雄市極具代表性的觀光漁港與歷史文化重鎮。"],
    ["高雄市","小港區","港仔墘","小港原稱港仔墘，因位於一處小型港汊的邊緣（墘）而得名，日治時期簡化為小港。","","小港區舊稱「港仔墘」，這個地名描述了當地緊鄰港汊水道的地理位置：「墘」在閩南語中意指水邊、邊緣之處，這一帶因地處一處規模較小的港汊地帶邊緣，先民依此地形特徵，將此地稱為「港仔墘」，1920年，日本殖民政府推行地方行政改制，簡化為「小港」，沿用至今。小港區地處高雄市南端，因高雄國際機場（小港機場）與高雄港貨櫃中心、臨海工業區的設立，是南台灣重要的海空聯運樞紐與重工業聚落，中鋼、中油等大型企業廠區皆座落於此，加上鄰近的鳳鼻頭史前遺址，讓小港區兼具現代工業重鎮與史前文化資產的雙重面貌。"],
    ["高雄市","鳳山區","下陂頭街","鳳山因境內珊瑚礁台地層巒疊翠、遠眺形似展翅飛鳳而得名，清代林爽文事件後縣治由左營舊城遷此，改稱鳳山新城。","","鳳山區舊稱「下陂頭街」（下埤頭街），因境內有一列弧形隆起的珊瑚礁台地，北端稱「太平頂」、南端稱「鳳鼻頭」，層巒疊翠、遠望宛如展翅飛翔的鳳凰，因而得名「鳳山」，清代並以此山名作為「鳳山縣」的縣名。下埤頭街早在明鄭時期便是軍屯汛防要地，康熙末年已發展成商賈輳集的繁榮街市。乾隆51年（1786年）林爽文事件爆發，左營鳳山舊城遭攻破，欽差大臣福康安平定亂事後，奏請將縣治由舊城遷至下埤頭街，是為「鳳山新城」，這也讓鳳山從原本的市集街庄，躍升為清代鳳山縣的政治中心。戰後，鳳山曾是高雄縣治所在地，如今因高雄地方法院、高雄市議會（原高雄縣議會）進駐，加上鳳山商圈與鳳儀書院古蹟，是高雄市東側最重要的行政與商業重鎮。"],
    ["高雄市","林園區","林仔邊","林園原稱林仔邊，因這一帶昔日森林茂密，早期移民選擇在森林邊緣地帶建立聚落而得名，1920年簡化雅化為林園。","","林園區舊稱「林仔邊」，這個地名直接描述了當地早期的自然景觀：這一帶在漢人拓墾之初，是一片茂密的原始林地，先民考量深入林地開墾風險較高，便選擇在森林邊緣地帶建立聚落、逐步向內拓展，因而得名「林仔邊」。1920年，日本殖民政府推行地方行政改制，將「林仔邊」簡化雅化為「林園」，沿用至今。林園區地處高屏溪出海口北岸，因鄰近台灣海峽與高屏溪沖積平原，是高雄市重要的石化工業重鎮，境內林園工業區是台灣規模數一數二的石化產業聚落，加上林園海洋觀光漁港與鳳鼻頭史前文化遺址，讓林園兼具現代工業發展與史前人類活動的歷史記憶。"],
    ["高雄市","大寮區","大寮","大寮相傳因清廷將此地荒埔賜予平台有功的施琅將軍，招佃搭建大型茅寮開墾而得名，另一說為溪埔寮等四寮合併而成。","","大寮區地名由來主要有兩種說法：第一種說法指出，清廷曾將這片荒埔地賜予平定台灣有功的施琅將軍，作為世襲業產，施家招募大批佃農前來開墾，初墾時可能搭建規模較大的茅寮供眾人棲身，因而得名「大寮」，這與台南將軍區（同樣源自施琅獲賜業地）屬於相關的歷史脈絡；第二種說法則認為，康熙年間百姓在此地聚集休息的場所原分為「溪埔寮」「潮州寮」「頂大寮」「下大寮」四座，後來四寮合併統稱「大寮」。大寮區地處高屏溪西岸沖積平原，因土壤肥沃，是高雄市重要的鳳梨、豆類與蔬果產地，加上大發、大寮工業區的設立，是高雄市東南側兼具農業與工業發展的重鎮。"],
    ["高雄市","大樹區","大樹腳","大樹舊稱大樹腳，相傳明鄭時期一名將領驅逐原住民後，在一棵大樹之下建立村莊而得名。","","大樹區舊稱「大樹腳」，相傳明鄭時期，有一名將領率軍驅逐原本盤據此地的原住民勢力後，選擇在一棵枝葉茂密的大樹之下建立屯墾村莊，因而得名「大樹腳」，1920年簡化為「大樹」，沿用至今。大樹區地處高屏溪中游西岸，因獨特的河階地形與沖積土壤，是全台知名的玉荷包荔枝產地，享有「荔枝的故鄉」美譽。境內的舊鐵橋濕地公園（下淡水溪鐵橋）是台灣鐵路史上重要的橋樑遺跡，佛光山寺更是全台規模最大的佛教道場之一，讓大樹區兼具農業特色、鐵道歷史與宗教文化的多重魅力。"],
    ["高雄市","大社區","阿加大社","大社原是平埔族西拉雅族馬卡道支族「阿加大社」社址，明鄭時期屯兵驅離原住民後，因區域發展以此為中心而得名大社。","","大社區地名由來，反映了台灣原住民族在漢人拓墾壓力下被迫遷徙的歷史：這一帶原是平埔族西拉雅族馬卡道支族「阿加大社」的傳統聚落所在地，明鄭時期，鄭氏屯兵進駐此地開墾，原本居住於此的阿加大社族人被迫離開家園，遷往屏東林邊鄉一帶另闢新居。民國40年（1951年），由於這一帶的經濟、文化、交通等機能皆以「大社」聚落為發展核心，地方便直接沿用這個源自平埔族部落的舊稱，正式定名為「大社」，成為鄉鎮行政區劃的名稱。大社區因鄰近仁武、楠梓工業區，加上石化廠與觀音山風景區，是高雄市兼具工業發展與丘陵生態景觀的行政區。"],
    ["高雄市","仁武區","仁武鎮","仁武因明鄭時期實施屯田制度時，派駐「仁武鎮」部隊在此開墾戍守而得名，是明鄭軍屯地名系統的一員。","","仁武區地名同樣源自明鄭時期的軍事屯田制度：鄭氏政權派遣「仁武鎮」部隊在此地屯墾戍守，這片由該部隊開闢的墾地，因而得名「仁武」，與左營（左衝鎮）、前鎮（援剿前鎮）、燕巢（援剿中鎮）等地，共同構成明鄭時期在高雄地區留下的軍事屯田地名系統，反映了鄭氏政權「寓兵於農」政策在這片土地上的深刻印記。仁武區因愛河發源於境內八卦寮，加上仁武工業區與後勁溪流域的地理位置，是高雄市重要的石化工業與住宅衛星市鎮，境內的仁武糖廠舊址與八卦寮滯洪池，也讓仁武兼具產業歷史記憶與生態滯洪功能的雙重角色。"],
    ["高雄市","鳥松區","鳥松腳","鳥松因清康熙年間移民在一棵高大茂盛的「鳥松樹」（赤榕）下建立村莊，供往來行商休憩而得名。","","鳥松區舊稱「鳥松腳」，地名由來與一棵知名的老樹有關：清康熙中葉，移民入墾此地時，發現一棵高大茂盛的「鳥松樹」（即赤榕，因枝葉茂密常吸引鳥類棲息而得名），往來的行旅商賈習慣在樹蔭下歇腳休息，先民便在這棵樹下建立聚落，因而得名「鳥松腳」，後簡化為「鳥松」。鳥松區因地處曹公圳新圳幹線流域，水源充沛、土質肥沃，自清代以來便是重要的農業聚落，如今因澄清湖風景區（大貝湖）與高雄長庚醫院的設立，是高雄市東側重要的休閒觀光與醫療重鎮，境內的鳥松濕地公園也是高雄市區近郊珍貴的生態保育據點。"],
    ["高雄市","岡山區","阿公店","岡山因初墾時菅茅密生稱竿蓁林街，後有老翁在此開設店鋪稱阿公店，因境內大小岡山珊瑚礁地形而改稱岡山。","","岡山區地名歷經多次演變：清康熙年間，閩籍移民入墾此地時，因當地菅茅（一種芒草類植物）密生叢聚，最初稱為「竿蓁林街」；乾隆年間重修府志時，文獻已記載「阿公店」之名，相傳是因一位老翁在此開設店鋪，供往來商旅休憩補給而得名，這與台北公館、桃園埔心等地因商業設施得名的邏輯相似。日治時期，因境內有大岡山、小岡山兩座隆起的珊瑚礁地形地標，遂正式將「阿公店」改稱「岡山」，沿用至今。岡山區因螺絲工業與岡山羊肉聞名全台，享有「螺絲窟」與「羊肉之鄉」的美譽，加上空軍官校與岡山之眼摩天輪，是高雄市北側重要的工業與觀光重鎮。"],
    ["高雄市","橋頭區","小店仔街","橋頭清康熙年間稱小店仔街，因乾隆年間文獻記載當地有座俗稱「橋子頭」的小店子橋，遂以此橋名取代原稱。","","橋頭區舊稱「小店仔街」，清康熙年間便已是往來商旅聚集的小型市集街道。乾隆年間重修方志時，文獻記載此地有一座名為「小店子橋」的橋梁，當地居民慣以「橋子頭」（意指橋梁附近的聚落）稱呼這座橋周邊的區域，隨著這個俗稱日益普及，逐漸取代了原本正式的「小店仔街」之名，成為地方通稱，1920年正式定名「橋頭」，沿用至今。橋頭區因清光緒年間台灣第一座新式製糖廠「橋仔頭糖廠」（今橋頭糖廠）在此設立，是台灣近代製糖工業的發源地，如今糖廠舊址已轉型為橋頭糖廠園區，加上高雄捷運橋頭糖廠站的設置，讓這個因小橋得名的聚落，成為認識台灣糖業發展史的重要據點。"],
    ["高雄市","燕巢區","援剿","燕巢因明鄭時期「援剿中鎮」與「援剿右鎮」在此屯田而稱援剿，日治時因台語諧音改為燕巢，沿用至今。","","燕巢區舊稱「援剿」，源自明鄭時期的軍事屯田制度：今燕巢區東燕、西燕兩里一帶，是「援剿中鎮」的屯墾舊址，安招里則是「援剿右鎮」的駐地，兩支部隊皆因負責增援剿撫任務而得名「援剿」，這與左營、前鎮、仁武等地同屬明鄭軍屯地名系統的一員。日治時期，日本殖民政府考量「援剿」與「燕巢」在台語發音上十分相近，加上「燕巢」二字字面較為溫和自然，便以同音異義的方式將地名改為「燕巢」，沿用至今，這種因語音相近而改字、卻與原始軍事屯墾意涵完全脫鉤的命名演變，是台灣地名史上相當特殊的案例。燕巢區因惡地地形（月世界）與阿公店水庫，加上燕巢棗子、芭樂等農產聞名，是高雄市北側兼具特殊地質景觀與精緻農業的鄉鎮。"],
    ["高雄市","田寮區","田寮","田寮因明鄭時期原為援剿中鎮屯墾地域，清乾隆末年移民入墾後，在已開墾的田地中搭建草寮而得名。","","田寮區地名由來相對直白：這一帶在明鄭時期原屬「援剿中鎮」的屯墾範圍，清乾隆末年，陸續有移民前來此地開墾定居，先民在已闢成的田地之中搭建簡易草寮，作為看顧作物與暫時棲身之用，這片區域因而得名「田寮」，這種依田地與臨時建物命名地方的方式，在台灣拓墾史上相當常見。田寮區地處高雄市北側惡地地形（月世界）核心地帶，因青灰岩地質長期受雨水侵蝕，形成寸草不生的特殊惡地景觀，加上田寮月世界、烏山頂泥火山等自然奇景，讓田寮區成為台灣認識惡地地形與泥火山地質景觀的重要據點，也是高雄市面積廣闊卻人口稀少的丘陵鄉鎮之一。"],
    ["高雄市","阿蓮區","阿嗹","阿蓮舊稱阿嗹，源自平埔族西拉雅族社名譯音，一說因原住民見漢人耕墾時招呼「阿嗹」而得名，戰後因佛教淨土意涵改稱阿蓮。","","阿蓮區舊稱「阿嗹」，地名由來流傳著幾種說法：一說最早入墾此地的漢人在今中正路一帶開墾時，一名途經的原住民上前招呼「阿嗹」（據傳為當地原住民語言中稱呼「老兄」的譯音），因而得名；另一說則認為「阿蓮」（阿嗹）可能直接源自平埔族西拉雅族部落社名的音譯。民國35年（1946年），地方人士楊玉山先生提議，認為阿蓮地區可視為佛教聖地，佛家認為「阿蓮」（阿彌陀佛居住的淨土）具有殊勝意涵，為配合這項地方特色，建議將原本的「嗹」字改為「蓮」，經鄉務會議通過後正式定名為「阿蓮」，沿用至今，這種因宗教意涵考量而調整用字的命名方式，在台灣地名演變史上相當獨特。阿蓮區因丘陵地形，是高雄市重要的芭樂與豆瓣醬產地。"],
    ["高雄市","路竹區","半路竹","路竹原稱半路竹，因地處大湖街（今湖內）與阿公店街（今岡山）之間交通必經的半路上，且當地竹林茂盛而得名。","","路竹區舊稱「半路竹」，這個地名描述了當地的交通地理位置：清代這一帶恰好位於大湖街（今湖內區）與阿公店街（今岡山區）兩處市集之間往來的必經道路中段，「半路」意指位居兩地交通路線的中點，加上沿途竹林茂密，先民依此雙重特徵，將此地稱為「半路竹」，1920年簡化為「路竹」，沿用至今。路竹區地處高雄市北側平原地帶，因鄰近國道高速公路交流道，加上樹德科技大學等院校進駐，是高雄市北側重要的交通樞紐與新興文教區域，區內的路竹科學園區也帶動了地方產業的現代化轉型。"],
