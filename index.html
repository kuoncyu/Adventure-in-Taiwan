    ["澎湖縣","馬公市","娘媽宮/媽宮","馬公舊稱媽宮，因明初移民建廟供奉媽祖，最初稱「娘媽宮」，簡稱「媽宮」，1920年因台語「媽宮」與「馬公」音近而改稱馬公。","","馬公市舊稱「媽宮」，相傳明朝初年，移民在今日馬公市正義街19號一帶，創建了一座供奉媽祖的廟宇，最初稱為「娘媽宮」，是全台灣創建歷史最悠久的媽祖廟，隨後地名刪去「娘」字，簡稱「媽宮」，這座廟宇便是今日的澎湖天后宮。1920年，日本殖民政府推行地方行政改制，考量「媽宮」的台語發音與「馬公」十分相近，加上「馬公」二字較無宗教色彩、書寫也更為簡便，遂將地名正式改為「馬公」，沿用至今。馬公市因擁有全台歷史最悠久的媽祖廟與保存完整的中央老街（施公祠、萬軍井等古蹟林立），加上澎湖天然良港的地理優勢，是澎湖縣的政治、經濟與交通核心，也是每年國際海上花火節的主要施放地點。"],
    ["澎湖縣","湖西鄉","湖東/湖西","湖西因澎湖本島東側大武山與尖山之間有一低窪盆地積水成湖，湖的東西兩側各有一村，分別稱湖東、湖西，因湖西村位居鄉中心而成為代表名稱。","","湖西鄉地名由來源自境內的地形特徵：澎湖本島東側，大武山與尖山兩座山丘之間，形成一處低窪的小型盆地，長期積水形成一座小湖，湖泊東西兩側各自發展出聚落，分別稱為「湖東村」與「湖西村」。由於湖西村地理位置恰好位居整個鄉境的中心地帶，交通與生活機能相對重要，因而以「湖西」作為整個鄉鎮的代表名稱，這也讓不少人誤以為「湖西」意指位於澎湖本島之西，事實上湖西鄉卻是位於馬公本島的東半部。湖西鄉因地勢平坦開闊、三面環海，加上土壤、水源等天然條件優於澎湖其他鄉市，是澎湖縣重要的農業生產區域，境內奎壁山摩西分海、南寮花宅等地質與聚落景觀，也是澎湖縣熱門的觀光景點。"],
    ["澎湖縣","白沙鄉","Pehou","白沙因島嶼海岸布滿珊瑚砂礫，在陽光照耀下遠望宛如一圈白色沙帶環繞而得名。","","白沙鄉地名由來源自島嶼獨特的海岸地質景觀：這座島嶼四周海岸布滿珊瑚礁風化形成的白色砂礫，每逢陽光照射，海岸線在光線映照下呈現一片耀眼的白色沙帶，遠望宛如整座島嶼被白色沙環繚繞一般，因而得名「白沙島」，這也是荷蘭時期文獻中記載的「Pehou」（白沙島）音譯由來，1920年正式定名「白沙鄉」，沿用至今。白沙鄉與澎湖本島、西嶼鄉之間，分別以跨海大橋（中正橋、澎湖跨海大橋）相連接，境內通樑古榕（樹齡逾三百年的老榕樹）、吉貝嶼與鳥嶼的沙灘生態，加上二崁傳統聚落文化，讓白沙鄉兼具珊瑚礁地質景觀與傳統漁村聚落的多重風貌，是澎湖北環重要的觀光鄉鎮。"],
    ["澎湖縣","西嶼鄉","漁翁島(Pescadores)","西嶼因位於澎湖本島西方而得名，西方文獻稱為漁翁島，因島嶼西側海域漁產豐富、漁船漁民雲集作業而得名，1875年後漁翁島之名逐漸通行於官方與民間。","","西嶼鄉地名由來相對直白，因這座島嶼地處澎湖本島的西側，先民依此相對方位，將此地稱為「西嶼」。西嶼另有一個廣為西方世界所知的別稱「漁翁島」（Pescadores），17世紀初，荷蘭人便以「Pescadores」（原意即漁翁、漁夫）作為對整個澎湖群島的通稱，這是因為台灣海峽的漁業資源自古豐沛，大量漁船與漁民聚集在西嶼西側海域作業捕魚，因而得名；1860年代台灣陸續開放通商口岸後，外國海圖多沿用「漁翁島」代表西嶼，1875年以後，這個稱呼也逐漸被清廷官方與民間普遍採用。西嶼是澎湖群島第二大島，境內西嶼西臺、西嶼燈塔（漁翁島燈塔，為台灣最古老的燈塔）等清代軍事與航運古蹟，加上二崁聚落與內垵漁港，是澎湖縣重要的歷史古蹟與觀光重鎮。"],
    ["澎湖縣","望安鄉","八罩","望安舊稱八罩，因四周海域被將軍澳嶼、東吉嶼等八個島嶼環繞罩住而得名，另一說明鄭成功東渡遙望八罩島，冀望能平安抵達而改稱望安。","","望安鄉舊稱「八罩」（另有八罩嶼、八罩山、挽門嶼等寫法），這個地名由來眾說紛紜：一說認為「罩」字意指「兜」（湊合之意），指望安島周圍恰好被將軍澳嶼、東吉嶼、西吉嶼、東嶼坪嶼、西嶼坪嶼、七美嶼、花嶼及虎井嶼等八個島嶼環繞罩住，因而得名「八罩」，這是學界較採信的說法；另一則流傳更廣的民間傳說則指出，明永曆15年（1661年），鄭成功率軍由金門東渡台灣，途經七美嶼，遙望八罩群島時，內心冀望船隊能夠平安順利抵達，因而將此地命名為「望安」。望安鄉由八罩群島組成，是台灣省轄最西的鄉鎮之一，境內花宅聚落（中社村）保存完整的閩南傳統建築群，已列入世界文化遺址潛力點，加上綠蠵龜產卵棲地，是澎湖縣重要的離島人文與生態保育鄉鎮。"],
    ["澎湖縣","七美鄉","大嶼","七美原稱大嶼，因位居澎湖群島最南端且面積廣大而得名，1949年因紀念七位女子為保貞節投井殉難、感念其貞烈事蹟改稱七美。","","七美鄉舊稱「大嶼」（另有南天島、南嶼等稱呼），因這座島嶼位居澎湖群島最南端、且面積在周邊離島中相對廣大，因而得名。關於後來改稱「七美」的由來，流傳著一則淒美的傳說：相傳明朝時期，一群海盜登陸島上燒殺擄掠，七名女子為了保全貞節、不甘受辱，在走投無路之下，集體投井自盡，鄉民為感念這七位女子的貞烈事蹟，將水井填土立碑紀念，事後井旁竟奇蹟般長出七株枝葉茂盛的香楸樹，彷彿七位美人顯靈庇佑，民國38年（1949年），地方正式將「大嶼」改稱「七美嶼」，紀念這段感人的貞節故事。七美鄉因雙心石滬、七美人塚等景觀聞名，是澎湖群島最南端、也是最具傳奇色彩的離島鄉鎮之一。"],
    ["金門縣","金城鎮","珠浦","金城為金門的行政中心，因古稱「珠浦」，1949年古寧頭大捷後設城鄉區公所，取「金門城鄉」之意簡稱金城，沿用至今。","","金城鎮舊稱「珠浦」，是金門島上歷史最悠久的市街聚落，明代即為「金門守禦千戶所城」的所在地，長期作為金門的行政與軍事中心。民國38年（1949年）10月，國軍在金門西北角古寧頭一帶擊退企圖登陸的解放軍部隊，史稱「古寧頭大捷」，是國共內戰後期扭轉台海情勢的關鍵一役。戰後同年11月，當地設立「城鄉區公所」，民國42年（1953年）金門實施地方自治，正式選舉鎮長，將原本的「城鄉」簡化定名為「金城鎮」，取「金門城」之意，沿用至今。金城鎮因金門城遺址、莒光樓與模範街等歷史建築，是金門縣治所在地，也是金門島上最主要的商業與生活機能核心。"],
    ["金門縣","金沙鎮","金山港","金沙因清末民初在原金山港河海交會處發現金沙，遂將港名改為金沙港，注入此港的溪流也隨之改稱金沙溪，此為鎮名之由來。","","金沙鎮地名由來，源自清末民初一段與淘金相關的地方傳聞：這一帶原有一處港口稱為「金山港」，相傳當時曾在河海交會處發現含有金沙的沙土，居民因而將港口易名為「金沙港」，注入此港的溪流也隨之改稱「金沙溪」，這座市鎮便以「金沙」為名，沿用至今。金沙鎮地處金門島東北側，境內太武山脈南側與榮湖相互輝映，湖光山色景色宜人；瓊林、山后民俗文化村等聚落，保存完整的閩南傳統建築群與宗族聚落文化，加上馬山觀測所（金門本島距中國大陸最近之處）等戰地據點，讓金沙鎮兼具閩南傳統文化與兩岸對峙歷史記憶的雙重色彩。"],
    ["金門縣","金湖鎮","滄湖","金湖原稱滄湖，因鎮內成功、太湖一帶水塘遼闊而得名，民國43年因應行政需要改稱金湖鄉，46年再升格為金湖鎮。","","金湖鎮原稱「滄湖」，這個地名反映了當地水域遼闊的地形特徵，境內的「太湖」（人工蓄水湖）至今仍是金門重要的淡水資源與生態景觀。民國43年（1954年）7月，因應戰地政務時期行政管理的實際需要，地方政府將「滄湖鎮公所」改制為「金湖鄉公所」，取代原本的「滄湖」，「金湖」之名既呼應金門「金」字系列鄉鎮命名的整體邏輯，也保留了原有「湖」字的水域意象；民國46年（1957年）12月，金湖鄉進一步升格改制為「金湖鎮」，沿用至今。金湖鎮因保留完整的閩南建築聚落瓊林村，加上金門國家公園部分範圍與太湖畔的金門酒廠，是金門縣重要的傳統聚落與觀光重鎮。"],
    ["金門縣","金寧鄉","古寧/金盤","金寧因1949年古寧頭大捷後成立古寧、金盤兩區公所，民國40年合併更名金寧區，取「古寧頭安寧」之意，42年正式定名金寧鄉。","","金寧鄉地名由來，同樣與古寧頭戰役的歷史直接相關：民國38年（1949年）古寧頭大捷後，地方成立「古寧」與「金盤」兩個區公所，分別管理古寧頭一帶及周邊區域事務。民國40年（1951年），兩個區公所合併，取「古寧頭」與「金門」的部分字義組合，更名為「金寧區」，寄託這片歷經戰火洗禮的土地能夠恢復平靜安寧的期許；民國42年（1953年）金門恢復縣治，本鄉合併古寧、安美、湖埔、榜林、盤山、后盤等六個行政區村，正式定名為「金寧鄉」，沿用至今。金寧鄉因古寧頭戰史館、慈湖三角堡等戰地史蹟聞名，是金門島上重要的歷史戰役紀念與生態賞鳥（慈湖候鳥保護區）重鎮。"],
    ["金門縣","烈嶼鄉","裂嶼/笠嶼","烈嶼相傳南宋末年因山勢忽然斷裂與金門本島分離而得名「裂嶼」，另一說因島嶼形狀如斗笠而稱「笠嶼」，因面積較金門本島小，俗稱小金門。","","烈嶼鄉地名由來主要有兩種說法：《金門志》記載，烈嶼原本與浯洲（金門本島）連為一體，南宋末年蒙古軍隊入侵，宋帝昺航海逃至金門海面，元兵在後急追，情況危急之際，山勢忽然斷裂，烈嶼因而與金門本島分離，「烈嶼」之名便是取自「裂」字的諧音「裂嶼」；然而，明末清初文人盧若濤在其《留庵詩文集》中則力辯此說純屬穿鑿附會，主張正確名稱應為「笠嶼」，因這座島嶼山多田少，整體地形狀似一頂斗笠，故以形取名。至於「小金門」的俗稱，則是近代才出現的說法，因以金門本島為「大金門」（烈嶼居民舊時反而統稱金門本島為「後埔」），相形之下烈嶼面積較小，因而俗稱「小金門」。烈嶼鄉因保留大量戰地坑道與陵水湖賞鳥景點，是金門重要的戰地觀光鄉鎮。"],
    ["金門縣","烏坵鄉","烏坵","烏坵鄉原隸屬福建省莆田縣，因島嶼地形為黑色丘陵而得名，民國43年奉國防部命令劃歸金門縣代管，81年解除戰地政務。","","烏坵鄉地名由來，源自島嶼本身的地質地貌特徵：這座孤懸海上的島嶼，地表覆蓋深色岩層，遠望呈現黑色丘陵的樣貌，先民依此地形特徵，將此地稱為「烏坵」，意指黑色的丘陵小島。烏坵原本行政上隸屬福建省莆田縣管轄，地理位置上距離金門本島甚遠，反而更接近台灣本島中部沿海，是連江縣與金門縣之間一處相對特殊的行政區劃案例。民國43年（1954年），國防部基於軍事戰略考量，下令將烏坵劃歸金門縣政府指揮監督，民國81年（1992年）11月7日，烏坵地區正式解除臨時戒嚴、結束長達數十年的戰地政務實驗，開始實施地方自治。烏坵鄉因獨特的烏坵語（莆仙話）與軍事據點景觀，是金門縣境內知名度較低、卻獨具地理與語言特色的離島鄉鎮。"],
    ["連江縣","南竿鄉","上竿塘","南竿鄉舊稱上竿塘，與北竿島（下竿塘）合稱「上下竿塘」或「竿塘山」，因島形似竹竿搭建的漁塘工寮而得名，是連江縣政府所在地。","","南竿鄉舊稱「上竿塘」，與北側的北竿島（下竿塘）合稱「上下竿塘」或「竿塘山」，這個地名的由來，一般認為與早期漁民在此搭建竹竿支架、曬網或搭建臨時漁寮的作業方式有關，「塘」則指沿岸適合作業的水域或灣澳地帶。南竿島考古發現顯示，早在新石器時代福澳村一帶便已有人類活動，出土文物與福建閩侯縣「曇石山文化」同屬一個文化層。民國38年（1949年）國軍進駐後，逐步在南竿成立馬祖守備區指揮部，連江縣政府也隨之遷設於此，南竿自此取代北竿，成為馬祖地區的政治、經濟、教育與文化中心，是連江縣面積最大、人口最多的行政區，也是馬祖列島對外交通（機場、台馬輪）的主要門戶。"],
    ["連江縣","北竿鄉","下竿塘","北竿鄉舊稱下竿塘，與南竿島（上竿塘）合稱竿塘，過去也曾稱官塘、吳塘，是馬祖地區考古證據最早、可追溯至八千年前人類活動遺跡的島嶼。","","北竿鄉舊稱「下竿塘」，與南側的南竿島（上竿塘）合稱「竿塘」，過去史書中也曾出現「官塘」「吳塘」等不同稱呼，這些地名多與早期漁民在此搭建竹竿漁寮、作業曬網的生活型態有關。考古證據顯示，早在距今約八千年前，鄰近北竿的亮島便已有人類活動的痕跡，北竿本島則至少六千年前便有人類足跡，北宋中期，福建長樂、連江等地沿海居民已陸續渡海遷居南北竿塘謀生。1949年國軍進駐初期，北竿一度是馬祖地區的政經中心，直到馬祖守備區指揮部與連江縣政府設於南竿後，政經地位才逐漸讓位。北竿鄉因坂里沙灘、芹壁閩東建築聚落（有「亞洲地中海」美稱）與璧山（馬祖列島第一高峰）聞名，是連江縣第二大鄉，也是馬祖重要的觀光門戶之一。"],
    ["連江縣","莒光鄉","東犬/西犬(白犬)","莒光舊稱白犬，因東西二島山勢遠望形似伏於海面的犬隻而得名東犬、西犬，民國60年國軍為配合反共復國政策，取「毋忘在莒」之意改稱莒光。","","莒光鄉舊稱「白犬」（也稱白肯，「肯」為福州話「犬」的擬音），這個地名源自東、西二島的山勢外形：由閩東沿海遠眺，兩座島嶼的輪廓神似兩隻犬隻伏臥於海面之上，因而東島稱「東犬島」、西島稱「西犬島」，合稱「白犬列島」；不過馬祖民間對這兩座島嶼的形似認定並非全然一致，也有居民認為島形更像獅子，因而並存「東獅」「西獅」等不同稱呼，反映了地名認定本就帶有主觀想像的空間。民國60年（1971年）10月15日，為配合政府反共復國的政策宣傳，行政院核定將「白犬」正式改稱「莒光」，取戰國時代田單憑藉莒城、即墨兩座孤城「毋忘在莒」、最終復國雪恥的典故，東犬島、西犬島也隨之更名為東莒島、西莒島。莒光鄉因保存完整的東莒燈塔、大埔石刻等古蹟，加上藍眼淚生態奇景，是馬祖列島最南端的離島鄉鎮。"],
    ["連江縣","東引鄉","東湧","東引舊稱東湧，因島嶼周邊終年海浪洶湧、潮水澎湃而得名，島上東引與西引原為兩座獨立島嶼，1975年因軍事需要興建中柱堤相連。","","東引鄉舊稱「東湧」，這個地名直接反映了當地的海象特徵：東引島地處馬祖列島最北端、面臨遼闊的東海海域，終年受東北季風與洋流交會影響，周邊海浪洶湧澎湃、潮水激盪不止，先民依此顯著的海象特徵，將此地稱為「東湧」，後改稱發音相近的「東引」。饒富趣味的是，東引其實原本並非單一島嶼，而是由東引島、西引島及其間的中柱島等組成，在戰地政務軍政一元化體制下，國軍基於軍事運補需要，於1975年興建「介石橋」連接中柱與東引，1989年8月再興建「中柱堤」，才將東引、中柱、西引三座島嶼實質連接成一體。東引鄉因東引燈塔、國之北疆地標與馬祖最北端的地理位置，加上濃厚的戰地風情，是馬祖列島最具邊境特色的離島鄉鎮。"],
    ["連江縣","芹壁","龜島","芹壁位於北竿鄉，因村落前方海面有一狀似烏龜的「龜島」，芹壁閩東語發音近似「龜島」而得名，是馬祖保存最完整的閩東建築聚落。","","芹壁地名由來，源自當地海上一座地標島嶼：這處聚落面前的海域中，矗立著一座外形神似烏龜的小島，馬祖當地稱之為「龜島」，村落依傍這座島嶼而建，「芹壁」一詞的馬祖閩東語發音，據信與「龜島」的稱呼有著音轉關聯，村落也因而得名。芹壁村依山面海而建，以花崗石砌成的傳統閩東式建築層層疊疊，錯落有致，保存之完整堪稱馬祖聚落之最，因景致優美、建築特色鮮明，享有「亞洲地中海」的美譽，深受國內外建築、文化與藝術界人士青睞。隨著人口外移而一度荒廢的空屋群，經政府修繕活化後，重新改建為民宿與藝文空間，讓芹壁從傳統漁村聚落，轉型為馬祖北竿最具代表性的觀光地標與閩東建築文化保存重鎮。"],

    // --- 【擴充：交通與特殊地名】 ---
    ["新北市","浮洲","浮洲","浮洲因位於大漢溪沖積形成的沙洲地帶，地勢低平、雨季易被大水淹沒若浮於水面而得名。","","浮洲地名由來與其所在的地形直接相關：這片位於板橋南側的土地，是大漢溪長期沖積作用堆積而成的沙洲地帶，地勢低平，每逢雨季河水暴漲，四周景象猶如漂浮於水面之上，因而得名「浮洲」。清代這一帶因地勢低窪、常遭水患侵擾，開發程度相對較晚，多作為農業用地。隨著板橋市區向南擴張，加上台北大學校區與周邊住宅社區的興建，浮洲逐漸從昔日的河濱沙洲農地，轉型為板橋南側重要的新興住宅與文教區域。浮洲橋橫跨大漢溪，連接板橋與土城兩地，也是這一帶居民往來對岸的重要交通動脈，見證了這片沙洲地從農業聚落發展為都市外圍生活圈的變遷過程。"],
    ["桃園市","永安","永安","永安因地處新屋溪出海口，是清代以來重要的漁業據點，日治時期設立漁港後定名永安，取平安吉祥之意。","","永安漁港位於新屋區新屋溪出海口，是桃園沿海少數具規模的天然漁港之一，地名「永安」取「永遠平安」的吉祥寓意，反映討海人家祈求出海作業平安順利的樸實心願，這種以吉祥字詞為漁村命名的方式，在台灣沿海聚落中相當常見。永安地區清代以來便是新屋一帶重要的漁業與農業並存聚落，居民多兼營近海捕撈與沿岸養殖；日治時期，當局在此闢建漁港設施，正式以「永安」為港口命名，逐漸發展成新屋沿海最重要的漁業據點。如今永安漁港周邊興建了以海洋文化為主題的「海螺文化園區」與觀光魚市，弧形的漁港堤防搭配夕陽美景，加上鄰近的永安濱海自行車道與綠色隧道，讓永安從傳統漁村轉型為桃園沿海知名的觀光景點，每年吸引大量遊客前來品嚐海鮮、欣賞海岸風光。"],
    ["新竹市","千甲","千甲","千甲因清代王世傑家族在此拓墾面積廣達逾千甲田園而得名，見證竹塹早期大規模墾殖的規模。","","千甲地名由來，直接見證了清代竹塹地區最重要的一波拓墾成果：康熙57年（1718年），福建同安人王世傑率族人渡海來台，向道卡斯族竹塹社取得土地展開開墾，短短約三十年間，從頭前溪南岸的樹林頭一路向南拓展到靠近香山的南勢地區，已開闢出逾千甲的田園，「千甲」之名便由此而來，直接以開墾面積作為地名，是台灣地名中相當寫實的計量式命名範例。王世傑家族除了廣闢田園，也修築水圳灌溉良田，其中隆恩圳最初便因可灌溉四百甲土地而稱作「四百甲圳」，可見當時竹塹平原水利建設之發達；王家同時捐地出資興建東瀛福地、新竹城隍廟、竹蓮寺等地方廟宇，奠定竹塹地區信仰與社會發展的基礎。如今千甲一帶已高度都市化，成為新竹市東區重要的住宅與商業區域，但這個源自三百年前拓墾規模的地名，仍持續提醒著人們這片土地開發的歷史起點。"],
    ["台中市","精武","精武","精武因鄰近「台中市體育場」（精武路）一帶，多以「精武」為路名或機關命名，取自精武體育會提倡強身報國之精神。","","精武地區的地名由來，與20世紀初中國興起的一項民間武術推廣運動有關：清末民初，上海成立「精武體育會」，宗旨在於推廣武術強身、培養國民體魄，藉此達到強國保種、報效國家的目標，這項運動風潮也影響到台灣，許多地方在規劃道路或機關命名時，選用「精武」二字以彰顯強身愛國的精神。台中市北區、北屯區交界一帶的精武路，便是循此脈絡命名，加上鄰近設有台中市立體育場、國立台中家事商業職業學校等重要教育體育機構，「精武」逐漸成為這一帶地區的通稱地名，用以指稱路名及周邊生活圈。如今精武商圈因鄰近一中商圈與台中科技大學，也發展成台中市重要的學生消費與夜市聚集地帶，讓這個源自近代中國強身愛國運動的地名，在台灣的日常生活中留下了印記。"],
    ["台中市","五權","五權","五權因鄰近五權路而得名，路名取自國父孫中山「五權憲法」（行政、立法、司法、考試、監察）的政治理念。","","五權地區的地名由來，源自中華民國建國初期重要的憲政理念：國父孫中山先生所提出的「五權憲法」主張，在西方三權分立（行政、立法、司法）的基礎上，另外加入源自中國傳統的考試權與監察權，合稱「五權分立」，這項政治理念在戰後台灣的道路命名中頗具影響力，許多城市皆設有以「五權」為名的道路，台中市的五權路便是其中之一。五權路及周邊地區因鄰近國立台灣美術館、國美館綠園道與勤美誠品綠園道等重要文化設施，加上台中市政府（舊址）曾設於此，逐漸發展成台中市重要的藝文與商業核心地帶，「五權」也因此成為這一帶生活圈的通稱地名。如今五權商圈與草悟道、審計新村共同構成台中市西區最具代表性的文創與生活美學廊帶，讓這個源自憲政理念的路名，演變成台中都會生活中相當熟悉的地標稱呼。"],
    ["彰化縣","永靖","永靖","廣東移民，寓意永久安靖。","","永靖境內清代原有東門、西門、南門、北門四座隘門，是粵籍移民為防禦閩粵械鬥與盜匪侵擾而興建的防禦性聚落設施，其中最初的市街核心稱為「關帝廳」，因當地建有主祀關聖帝君的廟宇而得名，這也是永靖鄉境內至今仍可見的舊地名之一。永靖與員林、社頭等地同屬清代粵籍移民與閩籍移民犬牙交錯的拓墾地帶，族群關係曾一度相當緊張，永靖的命名正是官方試圖以行政手段化解衝突的具體例證。如今永靖鄉境內的餘三館，是台灣少數保存完整的清末閩南式合院建築，也見證了這段閩粵移民共同開發永靖的歷史，加上當地盛產的胡蘿蔔（俗稱永靖菜頭），讓永靖從一個寄託族群和諧願景的地名，發展出兼具歷史建築與農業特產的雙重風貌。"],
    ["嘉義縣","嘉北","嘉北","嘉北因地處嘉義市區之北而得名，是日治時期阿里山森林鐵路增設的一處車站名稱，屬嘉義市郊區聚落。","","嘉北地名由來相當單純直白，即「嘉義之北」之意，用以指稱嘉義市區北側的一處郊區聚落。這個地名因阿里山森林鐵路在此設有「嘉北車站」而廣為人知，該站是森林鐵路自嘉義北門車站出發後的早期停靠站之一，早年主要作為運送木材、農產與旅客往來嘉義市區與周邊鄉鎮的中繼站。隨著嘉義市區逐漸向外擴張，加上公路運輸系統的興起，嘉北車站的運輸機能雖已不若從前，但「嘉北」這個單純描述方位的地名，仍持續沿用於周邊里別、學校與地方機構的命名之中，成為嘉義市北側郊區的通稱地名。"],
    ["台南市","南科","南部科學工業園區","南科為「南部科學工業園區」簡稱，1996年設立於新市、善化交界的台南科學園區，是南台灣高科技產業重鎮。","","南科全稱「南部科學工業園區」，是行政院於1995年核定、1996年正式動工開發的國家級科學園區，園區橫跨台南市新市區、善化區與安定區交界地帶，是繼新竹科學園區、中部科學園區之後，台灣第三個成立的科學園區，也是南台灣半導體與光電產業的重要聚落。南科在開發過程中，於園區內發現豐富的史前文化遺址群（包括牛尾庄、五間厝等多處遺址），出土大量新石器時代到金屬器時代的文物，為配合考古搶救工作，特別設置「南科考古館」，成為全台唯一設置於科學園區內、結合高科技產業與考古文化資產保存的特殊案例。如今南科因台積電、群創等大廠進駐，已從嘉南平原上的農地，轉型為帶動南台灣經濟發展的重要引擎，周邊也因高科技從業人口大量移入，發展出新興的住宅與商業機能。"],
    ["高雄市","美術館","美術館","美術館地區因鄰近1994年落成的高雄市立美術館而得名，是內惟埤文化園區內重要的都市重劃區與藝文地標。","","美術館地區地名由來相當直接：這片位於內惟埤文化園區內的重劃區域，因高雄市立美術館於1994年正式落成啟用而得名，館舍座落於原本內惟埤埤塘與周邊農地整治而成的大片綠地之中，是南台灣重要的現代美術典藏與展覽機構。隨著美術館館舍的知名度提升，加上周邊逐步開發為低密度、綠意盎然的高級住宅重劃區，「美術館」也順勢成為這片區域的通稱地名，用以指稱美術館園區周邊的生活圈範圍。如今美術館地區因擁有大片森林公園綠地、雕塑作品與藝文空間，是高雄市著名的藝術文化與優質住宅聚落，充分展現了以文化設施帶動周邊都市發展的成功規劃案例。"],
    ["高雄市","科工館","科工館","科工館地區因鄰近1997年開幕的國立科學工藝博物館而得名，是三民區境內重要的文教機構與生活圈地標。","","科工館地區地名由來，源自座落於此的「國立科學工藝博物館」：這座台灣第一座應用科學博物館於1997年正式開幕，館內收藏展示各類科學工藝技術文物，是南台灣重要的科普教育與親子休閒場所。隨著博物館的設立與知名度提升，周邊逐漸發展成以「科工館」為通稱的生活圈範圍，用以指稱博物館周邊的住宅與商業聚落。科工館地區地處高雄市三民區，鄰近高雄都會公園與愛河河畔，是高雄市重要的文教休閒設施聚集地，讓這個以科學博物館命名的區域，成為高雄市民假日闔家造訪、寓教於樂的熱門去處。"],
    ["高雄市","民族","民族路","民族因高雄市內一條重要南北向道路「民族路」而得名，路名取自國父孫中山「三民主義」中的「民族」主義。","","民族地區地名源自高雄市區一條重要的南北向幹道「民族路」：這條道路的命名，取自國父孫中山先生所提出的「三民主義」政治理念中的「民族」主義，與高雄市其他道路如「民權」「民生」等，共同構成一套以三民主義精神命名市區道路的系統，這種以政治理念作為路名的作法，在戰後台灣各城市的道路命名中相當普遍。隨著民族路沿線逐漸發展成商業與住宅機能兼具的生活圈，「民族」也順勢成為這一帶地區的通稱地名。民族路貫穿高雄市三民區、鼓山區等多個行政區，沿線經過高雄車站周邊商圈與住宅社區，是高雄市區交通與生活機能的重要軸線之一。"],
    ["屏東縣","六塊厝","六塊厝","六塊厝因清代最初由六戶人家遷來此地開墾定居而得名，與九如鄉九塊厝屬於相同的計量式命名邏輯。","","六塊厝地名由來相對直白，與屏東九如鄉「九塊厝」（今九如）、高雄「五塊厝」（今三民區一帶）屬於相同的命名邏輯：清代先民入墾此地之初，最初僅有六戶人家共同遷居於此，胼手胝足展開拓墾，因而以實際開墾戶數為地名，直接稱為「六塊厝」，這種依開墾戶數多寡直接命名聚落的方式，是台灣清代拓墾史上相當常見的計量式命名案例，反映了先民初墾聚落規模由小逐漸擴大的發展歷程。六塊厝如今雖已融入周邊行政區的都市紋理之中，但這個地名仍持續沿用於在地居民的日常稱呼與部分公共設施命名之中，成為追溯這片土地清代拓墾規模的重要線索。"],
    ["屏東縣","鎮安","鎮安","鎮安因清代地方治安不靖，先民期盼藉由地名寄託「鎮壓不安、祈求平安」的願望而得名。","","鎮安地名由來，反映了清代台灣社會分類械鬥與治安動盪的普遍現象：這一帶清代因族群衝突、盜匪侵擾等因素，地方治安時常面臨不穩定的威脅，先民為求聚落能夠長治久安、免於動亂侵擾，便以寄託祈願的方式，將此地命名為「鎮安」，意指「鎮壓不安、祈求平安」，這種以吉祥祝願字詞直接命名地方、藉此寄託免於禍亂期盼的方式，與屏東永靖（原意勸誡械鬥、祈求安靖）、高雄永安（祈求漁業平安）等地名，屬於相似的祈福式命名邏輯。鎮安如今是屏東縣境內沿用這個祈願地名的聚落之一，見證了清代移民社會對地方安寧的殷切期盼。"],
    ["台東縣","瑞和","瑞和","瑞和因鄰近瑞源、鹿野等地名，戰後行政區重劃時取吉祥用字「瑞氣祥和」之意而命名，是台東縣境內常見的戰後吉祥地名之一。","","瑞和地名由來，屬於戰後台灣行政區劃調整過程中常見的吉祥式命名：這一帶因鄰近瑞源等同樣以「瑞」字為名的聚落，加上戰後地方政府為新設立的行政區或車站選定名稱時，習慣選用寓意吉祥美好的字詞，遂取「瑞氣祥和」的美好期許，將此地命名為「瑞和」，這種不刻意連結特定歷史事件或族群語言、而是單純選用吉祥字詞組合命名地方的方式，在台灣戰後地名系統中相當普遍，尤其常見於鐵路車站站名的訂定。瑞和地區地處花東縱谷，因瑞和車站的設置，是台東縣鹿野鄉境內重要的鐵路沿線聚落，周邊農業生產與純樸的縱谷田園景觀，是花東鐵路沿線典型的農村風貌代表。"],
    ["台東縣","山里","山里","山里因聚落地處山區丘陵地帶、範圍不大而得名，是台東縣境內依地形直接命名的典型小聚落地名。","","山里地名由來相對單純，源自其所在的地形特徵：這處聚落地處花東縱谷邊緣的山區丘陵地帶，範圍規模不大，先民依此地理位置與聚落規模，直接以「山里」（意指山中的小聚落或小鄉里）為地名，這種依地形位置與聚落規模直接命名地方的方式，在台灣各地相當常見，尤其多見於花東地區地廣人稀、聚落分散的地理環境。山里因設有山里車站，是台東縣境內花東鐵路沿線的一處小型聚落，周邊仍保有典型的縱谷農村景觀，是了解花東鐵路沿線眾多小站聚落生活型態的代表性地點之一。"],
    ["台東縣","康樂","康樂","康樂因戰後行政區命名時，取「健康快樂」的吉祥期許之意而得名，是台東縣境內常見的戰後祈福式地名之一。","","康樂地名由來，同樣屬於戰後台灣地名系統中常見的吉祥祈福式命名：這處位於台東市郊的聚落，在戰後進行行政區劃調整或地名訂定時，地方政府考量地方發展願景，選用寓意「身體健康、生活快樂」的「康樂」二字作為地名，寄託對居民生活美滿安康的期許，這種以正面吉祥詞彙直接命名地方、不特別連結歷史事件或原住民語言的方式，與瑞和、瑞源等地名，同屬台東縣戰後地名系統中相對單純直白的命名邏輯。康樂地區因鄰近台東市區，加上康樂車站的設置，是台東市近郊重要的住宅與生活機能聚落，也是花東鐵路沿線認識戰後地名命名思維的代表性案例之一。"],
    // --- 【擴充：細部小地名 深入解說】 ---
    ["新竹市","赤土崎","紅土台地","地處清代竹塹城東側台地邊坡，因表土富含氧化鐵、土色偏紅，且地勢略高如崎坂，故稱赤土崎，今為清華大學、交通大學一帶。","s","赤土崎在清代僅是竹塹城外的紅土台地聚落，日治時期更因地處邊陲，先後被闢為競馬場、靶場、高爾夫球場，甚至一度是新竹地區的公共墓地「雞蛋面義塚」所在，是墾地、墓地與後來校地三種身分交疊的特殊區域。太平洋戰爭末期，日本海軍在此設立第六燃料廠新竹合成部，戰後改由中國石油公司接手，成為台灣重要的煉油與化工研究重地。1955年，中美簽訂原子能和平用途合作協定，清華大學決定在台復校，原先於南港、新竹兩地間擇一設校，最終因新竹縣長朱盛淇積極爭取，加上中國石油公司提撥約四十公頃原屬日本海軍燃料廠的土地，清華便選定赤土崎作為新校址，日後又陸續增撥、收購土地，逐步擴展成今日清華園的規模。有「赤土崎人標」之稱的社會運動家黃旺成，正是誕生於這片紅土台地，讓赤土崎從單純的地形地名，累積出橫跨拓墾、殖民工業、學術與社會運動的多重歷史記憶。"],
    ["新竹市","湳雅","濕軟泥地","湳為閩南語濕軟泥地之意，此地早期地勢低窪多沼澤積水，故以「湳」為名，雅則為後來的近音雅化用字。","s","湳雅原字寫作「湳仔」，因地處頭前溪天然堤防背後的低窪濕地，長年容易積水氾濫、土地泥濘難行，因而得名，日治時期正式書寫為「湳雅」。這裡在清代是南北官道出竹塹城後的必經之地：無論是從金門厝或舊社渡口渡過頭前溪、北上前往艋舺的旅人商賈，都得行經湳雅這處通衢要道，也因此，清代官府旌表節孝烈婦、孝子的石碑坊，多選址立於此地示眾，例如儒士吳國步妻蘇氏的節孝坊、國學生李鍚金的孝子坊（後者現已遷至青草湖）皆曾豎立在湳雅一帶，成為地方教化的重要地標。如今湳雅雖已高度都市化，但這段因低窪濕地而發展成交通要道、進而成為官方表彰節孝場所的歷史，仍是新竹市北區地方史中相當獨特的一頁。"],
    ["新竹市","客雅","道卡斯客雅社","地名可能源自道卡斯族「客雅社」的社名譯音，流經此地的客雅溪即因此得名。","s","客雅地名的確切語源目前仍有討論空間，一般認為與流經當地的客雅溪有關，客雅溪發源於新竹縣寶山鄉，主要流域涵蓋寶山與新竹市，經雙溪匯流後流入青草湖，再蜿蜒穿越新竹市區、由北區進入香山，最終從十七公里海岸線出海，是王世傑當年開墾竹塹的重要根據地之一；有趣的是，這條溪流其實原名「隙仔溪」，「客雅」之名很可能是後來才附加於溪流與周邊聚落的稱呼。1920年，日本殖民政府將客雅庄與水田、苦苓腳、崙仔、樹林頭、湳雅、東勢、赤土崎、埔頂、柴梳山、金山面等十餘個街庄一併併入新竹街，客雅自此成為新竹市區向東南擴展的重要腹地，今日範圍橫跨北區、東區交界，涵蓋客雅里、中雅里、西雅里等多個里，是新竹市區人口稠密的住宅生活圈之一。"],
    ["新竹市","十八尖山","十八尖峰","因山稜連綿起伏，共有十八個尖峰而得名，日治時期閩闢為登山健行步道，現為新竹市著名的森林公園。","s","十八尖山地名的由來相當寫實：這座呈新月形、蜿蜒約七、八公里、環抱新竹市東南郊的丘陵，沿線果真數得出十八個山頭起伏，因而得名，最高處海拔僅131.79公尺，最低處約50公尺，坡度平緩，適合全民健行。日治時期，這片丘陵被規劃闢建為新竹地區的「森林公園」，成為當時市民休閒運動的重要去處，山徑沿途遍植花木，尤其以杜鵑花聞名，每年花季吸引大量賞花人潮。十八尖山山林間至今仍留有一座主祀觀音的「石觀音」，以及可俯瞰新竹市區的「介壽亭」，兩者都是登山健行途中的重要地標。如今十八尖山已是新竹市區保存最完整的自然綠帶，市政府每日清晨至上午八時實施車輛管制，讓這座因十八座山頭而得名的丘陵，持續扮演著新竹市民運動休閒的最佳去處。"],
    ["新竹市","暗街仔","棚架遮陰","清代竹塹城內店家為遮陽避雨，在狹窄街道上方搭建棚架，終日光線昏暗，故稱暗街仔，即今北門街一帶。","s","暗街仔其實是新竹市歷史最悠久的街道，堪稱「新竹第一街」：明永曆36年（1682年），泉州人王世傑入墾竹塹，選擇在這條位於今東前街36巷、寬不足兩公尺、長不到百公尺的窄巷一帶落腳，以此為中心向南北開墾，奠定了新竹城市發展的源頭。這條巷弄因是市集商家聚集的長廊，店家普遍搭建「不見天」的遮棚以利遮陽避雨、方便買賣交易，終年不見天日、光線昏暗，因而被稱為「暗街仔」，這種因商業騎樓遮蔽而得名的街道稱謂，在九份、北港、彰化鹿港等台灣其他老街區也曾出現過類似用法，並非新竹獨有。清代此地以農具、鐵器等民生用品交易為主，日治時期轉型以金銀樓、佛像雕刻聞名，至今巷內仍可見創立於日治時期的錦興金香行等老字號，是新竹市區保存至今、僅存的一小段「新竹第一街」歷史遺跡。"],
    ["台北市","三板橋","三座木板橋","昔日大安一帶因灌溉溝渠密布，居民搭建三座木板橋供人通行，因而得名，範圍約在今林森北路、中山北路一帶。","s","三板橋所在的範圍，大致對應今日台北市中山區林森北路、中山北路一帶，清代因灌溉水圳「大安支渠」流經，居民為了往來兩岸，在渠道上搭建三座簡易木板橋，這片區域因而被稱為「三板橋」。日治時期，這一帶隨都市計畫發展，一度是規模宏大的日人公共墓地「三板橋墓地」所在地，戰後隨著都市發展需要，墓地陸續遷葬、改建，原址周邊逐漸發展為林森公園與康樂公園，公園內至今仍保留林安泰古厝、蒙藏文化中心等具歷史意義的設施，見證這片土地從水圳木橋、日治墓園到現代都會公園的多重身分轉換。三板橋這個描述木橋的舊地名，如今已鮮少在日常生活中被提及，但仍偶爾出現在地方文史考據與老台北人的口述記憶之中。"],
    ["台北市","內湖庄","盆地積水如湖","因地勢四周略高、中央低窪，早期積水成湖，故稱內湖，為今內湖區地名由來。","s","「內湖庄」是內湖地區在清代至日治時期的正式行政區劃名稱，範圍大致涵蓋今日內湖區全境。清代這一帶因地勢低窪、四周丘陵環繞，早期排水不易而積水成湖，先民依此地形特徵稱之為內湖；漢人入墾後，主要沿基隆河沿岸的平坦河谷地帶發展聚落，並修築陂塘、水圳排除積水、闢為良田，內湖庄因而逐漸從沼澤濕地轉型為農業聚落，以茶葉、蔬果種植為主要產業。1920年，日本殖民政府推行地方行政改制，正式設立「內湖庄」，隸屬台北州七星郡管轄；戰後，內湖庄改制為內湖鄉，1968年隨台北市擴大行政區域而併入台北市，成為內湖區。這段從清代積水窪地、到日治行政區劃「內湖庄」、再到今日科技產業重鎮的演變過程，完整呈現了內湖地區三百年來的土地利用變遷史。"],
    ["新北市","二重埔","第二次開墾埔地","清代拓墾依開墾先後次序命名，此地為第二個開發的埔地，故稱二重埔，即今三重、蘆洲一帶。","s","二重埔的命名邏輯與三重埔、頭前埔完全相同：清代先民沿淡水河岸依開墾先後順序為新生埔地編號，最早開發的稱頭前埔，其後依序為二重埔、三重埔。隨著淡水河泥沙淤積、沙洲不斷向外擴展，登陸與開墾地點也隨之外移，二重埔便是在頭前埔之後、三重埔之前開發的一段埔地，大致位於今三重、蘆洲一帶。這種依次序命名的方式，反映了清代漢人沿河系統性拓墾的過程，類似邏輯也可見於新店的頭張、二張、三張等地名。如今二重埔已完全融入三重、蘆洲的都市發展範圍，但仍可從地方志與老地圖中，追溯這段先民一步步向淡水河沙洲拓墾前進的歷史軌跡。"],
    ["新北市","和尚洲","僧侶開墾沙洲","相傳清代有僧侶在此淡水河沙洲地開墾而得名和尚洲，即今蘆洲舊稱，日治時期因諧音改為蘆洲。","s","和尚洲是蘆洲眾多舊稱中流傳最廣的一個，據傳乾隆年間，僧人梅福向官方申請開墾這片淡水河沖積沙洲，並將其做為廟宇的香油錢田產，此後常有僧侶前來巡視、設置公館收取租穀，久而久之，這片沙洲便被稱為「和尚洲」；另一種說法則認為，此地原稱「河上洲」（形容聚落如坐落於河面之上），因「河上」與「和尚」台語發音相近而逐漸混用轉化為和尚洲。日治時期，殖民政府認為和尚洲之名不甚文雅，加上沙洲濕地本吸引大量白鷺鷥棲息，遂改稱較為風雅的「鷺洲」，戰後才依諧音定名為今日的「蘆洲」。從河上洲、和尚洲、鷺洲到蘆洲，這一連串地名演變完整呈現了同一塊沙洲地形，在不同時代被賦予不同意涵與雅化考量的過程。"],
    ["新北市","海山堡","清代行政區堡名","清代在板橋、土城、三峽一帶設置的行政區劃單位，因轄內多山林而得名海山堡。","s","海山堡是清代台灣行政區劃「堡里制」下的一個堡，範圍大致涵蓋今日板橋、土城、三峽及樹林部分地區，因轄內多丘陵山林地形而得名。清代台灣的地方行政區劃由上而下分為府、廳縣、堡（或里、鄉）、莊（街）等層級，「堡」是介於縣廳與基層聚落之間的區域單位，海山堡便是台北盆地西南側、大漢溪流域眾多堡之一。板橋、土城、三峽這幾個今日各自獨立發展的行政區，在清代同屬海山堡管轄，並曾一度由林本源家族的勢力範圍所涵蓋，彼此在水利、信仰、商業網絡上關係緊密，例如枋橋城、三角湧街等市街的興起，都與海山堡整體的拓墾開發脈絡息息相關。隨著日治時期地方制度改革，堡里制逐漸被街庄制取代，「海山」之名雖不再作為正式行政區劃使用，卻仍留存於海山高中、海山煤礦等地方機構與設施名稱中，成為追溯這段清代區域治理歷史的線索。"],
    ["桃園市","桃仔園","遍植桃樹","相傳清初移民在此廣植桃樹成林，花開時節景色動人，因而得名桃仔園，後簡稱桃園。","s","「桃仔園」是桃園地名演變過程中最廣為人知的一個階段：相傳清乾隆年間，墾首薛啟隆率眾拓墾龜山、八德一帶時，在這片新墾土地上大量栽植桃樹，每逢春季花開時節，滿山遍野桃花盛開、如雲似霞，景色美不勝收，因而讓當地人以「桃仔園」稱呼這片美麗的墾地，這也是台灣少數以花卉景觀直接入名、而非依防禦工事、族群或地形命名的特殊案例。乾隆39年（1774年）《續修臺灣府志》中已可見「桃仔園莊」的正式記載，可見這個充滿詩意的地名，至遲在18世紀中葉便已廣為流傳。光緒14年，官方文書進一步簡化為「桃園」，這個因桃花美景而生的地名，最終演變成今日桃園市、桃園區的正式名稱，也讓「桃園」成為全台唯一以花卉命名、且沿用至今的直轄市名稱。"],
    ["桃園市","大嵙崁","泰雅語大水","大溪舊稱，源自泰雅族語意指「大水」，因大漢溪流經此地水勢湍急而得名。","s","「大嵙崁」是大溪地名演變史上維持時間最久、也最廣為人知的一個階段。這個名稱源自泰雅族語，意指「大水」，反映大嵙崁溪（今大漢溪）流經此地時水勢湍急、聲勢浩大的特徵。清末，劉銘傳推行「開山撫番」政策時，選擇在大嵙崁設立撫墾局，作為漢人與泰雅族交涉、開發山地資源的重要據點，當時大嵙崁因是大漢溪航運的終點，來自山區的樟腦、茶葉皆須經此地轉運至艋舺、大稻埕，商船往來絡繹不絕，市街盛極一時，孕育出今日仍完整保存的大溪老街巴洛克式牌樓立面。日治時期，這個名稱簡化為今日通行的「大溪」，但「大嵙崁」之名至今仍常見於地方文史資料、老字號商行招牌，以及大嵙崁溪這個大漢溪的舊稱之中，是認識大溪河運貿易全盛時期歷史的重要關鍵詞。"],
    ["桃園市","南崁","南崁社譯音","地名源自平埔族凱達格蘭族「南崁社」譯音，為桃園最早開發地區之一。","s","南崁其實是整個桃園地區開發史的起點，其知名度與歷史地位甚至超越了行政區劃上管轄它的蘆竹區本身。這個地名源自平埔族凱達格蘭族「南崁社」的社名音譯，是清代漢人進入桃園台地拓墾前，當地原住民的主要聚居地。由於南崁地處南崁溪出海口附近，是早期由海路進入台北盆地、桃園台地的重要登陸據點與交通門戶，漢人移民多由此登岸後再向內陸擴散開墾，因此南崁的漢人開發時間，比桃園、中壢等內陸地區都要來得早。清代南崁因扼守海運要道，一度發展成頗具規模的港口市街，直到河口逐漸淤積、鐵路與公路等陸路交通興起後，南崁的商業機能才逐漸被桃園市區取代。如今南崁因鄰近桃園國際機場與中山高速公路交流道，加上大型購物商場的進駐，已從清代的海運門戶，轉型為桃園市重要的商業與交通樞紐。"],
    ["桃園市","龍岡","滇緬移民聚落","因國民政府時期滇緬地區撤退來台的軍民在此建立眷村而聞名，形成特殊的雲南、緬甸文化聚落。","s","龍岡地名的近代知名度，主要來自一段特殊的移民歷史：1950年代，國共內戰失利後，滯留在雲南、緬甸邊境一帶的國民政府軍隊（俗稱「滇緬孤軍」）分批撤退來台，政府將其中一部分軍民安置在平鎮龍岡一帶，設立忠貞新村等眷村聚落。這些來自雲南、緬甸的軍民，將家鄉的飲食、信仰與生活習慣一併帶入龍岡，逐漸發展出全台獨樹一格的雲南、緬甸文化聚落，忠貞市場周邊的米干、大薄片、椒麻雞等雲南料理，以及潑水節等特殊民俗活動，都是龍岡最具代表性的文化資產。龍岡因鄰近中壢、平鎮交界，加上眷村改建與都市更新的推動，如今雖已從早期克難的眷村聚落轉型為現代化社區，但每逢潑水節或忠貞市場的雲南美食小吃，仍持續向外界訴說著這段跨越國界、落地生根的移民故事。"],
    ["桃園市","三坑仔","三條坑溝匯流","因地形有三條山坑溝流匯集於此而得名，即今龍潭三坑老街一帶，昔日為大漢溪河運貨物集散地。","s","三坑仔地名由來，源自當地三條坑溝匯流的地形特徵：鴨母坑、火劫尾坑與蔗部坑三條山澗坑溝，在此匯入大漢溪畔的河階台地，因而得名「三坑仔」。清代，三坑仔因地處大漢溪水運的重要據點，成為龍潭、關西一帶山區物產運往下游艋舺、大稻埕的集散轉運站，往來船隻、挑夫絡繹不絕，市街因而繁榮一時，形成今日仍保存古樸閩客混合建築風貌的「三坑老街」，老街上的黑白洗（青錢第洗衣池）、永福宮等古蹟，至今仍是了解這段河運貿易歷史的重要見證。隨著大漢溪淤積、鐵路與公路等陸路運輸系統興起，三坑仔的河港機能逐漸沒落，一度歸於平靜，直到近年因老街保存與大漢溪畔的自行車道開發，才重新成為桃園市龍潭區熱門的懷舊觀光景點。"],
    ["新竹縣","鹹菜甕","醃製鹹菜","關西舊稱，相傳因地形似甕，且當地居民多醃製鹹菜維生，故稱鹹菜甕，日治時期取諧音雅化為關西。","s","「鹹菜甕」是關西地名演變史上維持最久、也最具代表性的一個階段，這個充滿生活氣息的名稱，直接反映了當地客家族群的傳統產業與飲食文化：清代此地客家先民擅長將盛產過剩的芥菜（鹹菜）醃製於陶甕中保存，製成方便攜帶、行銷各地的醃漬食品，四處可見的醃菜陶甕成為地方一大特色，因而得名「鹹菜甕」；也有一說指出，地形本身狀似甕口，加上盛產鹹菜，兩相結合而成此名。1920年，日本殖民政府推行地方行政改制，發現「鹹菜甕」的客語發音與日語地名「關西」的發音意外相近，索性直接借用日本本州「關西」之名取代，這種純粹因語音巧合而更換地名的案例，在台灣地名史上相當罕見。如今關西鎮的仙草、柿餅等醃漬與加工農產業依然興盛，某種程度延續了「鹹菜甕」時代流傳下來的醃漬飲食文化根基。"],
    ["苗栗縣","貓貍","貓裏社譯音","苗栗舊稱，源自道卡斯族「貓裏社」譯音，清代設縣治後取其諧音雅化為苗栗。","s","「貓貍」是苗栗舊稱眾多寫法中，近年在地方最具爭議、卻也最深植人心的一個版本。清代文獻中，「貓裏」「貓里」「貓裡」「貓貍」等寫法長期混用並存，並無統一標準；1889年苗栗設縣時，官方雖採近音的「苗栗」二字，但民間口語與部分史料仍持續沿用舊稱。2010年代，苗栗縣政府曾以縣政顧問會議提案，公告將官方統一使用的舊地名版本定為「貓裏」，卻引來苗栗市地方人士的反對聲浪：反對者主張，前任苗栗市長當年廣徵民意後，是依據縣定古蹟「賴氏節孝坊」上的刻字，選定「貓貍」作為統一寫法，且這個版本早已在地方民眾心中建立共識與情感連結，貿然更改恐失去原有意義。這場舊地名寫法之爭，讓「貓貍」二字從單純的音譯用字，意外成為地方文史認同與官方治理之間拉鋸的鮮活案例。"],
    ["苗栗縣","蓬山","蓬山八社","苑裡舊稱，因附近平埔族聚落合稱「蓬山八社」而得名。","s","「蓬山」是苗栗苑裡、通霄一帶平埔族部落聯盟的統稱，清康熙、雍正年間的官方文獻最初稱其為「崩山八社」或「崩山」，乾隆以後才改稱較為文雅的「蓬山八社」或「蓬山」。這八個部落分別是大甲東社、大甲西社（德化社）、宛里社（苑裡社）、房里社、南日社（日南社）、雙寮社（擺陳社）、貓盂社，以及吞霄社，範圍橫跨今日苗栗苑裡、通霄與台中大甲、大安、外埔一帶，是台灣中部平埔族道卡斯族的重要分布區域。1670年，鄭氏部將劉國軒率軍墾殖蓬山八社與後壠五社，是漢人有計畫進入這片區域拓墾的開端；此後，隨著漢人移民日增，蓬山八社的族人逐漸漢化或向內山遷移，但各社的部分社名仍以地名的形式留存至今，例如苑裡鎮的貓盂、房裡等地，都是蓬山八社歷史的直接見證，讓「蓬山」這個統稱，成為追溯苗栗、台中沿海一帶平埔族拓墾史的重要關鍵詞。"],
    ["台中市","大甲東","大甲溪東側聚落","大甲區東側的聚落古地名，因位於大甲溪東岸而得名，清代已是重要農墾聚落。","s","大甲東其實是道卡斯族「大甲東社」的傳統領域，與大甲西社同屬蓬山八社成員，兩社以境內地標「鐵砧山」為界劃分：山以東屬大甲東社，山以西則屬大甲西社。1731年（雍正9年）大甲西社發動反抗清廷的武裝行動（史稱大甲西社事件或林武力事件）時，大甲東社因選擇配合官方、未參與叛亂，事件平定後，大甲西社遭清廷強迫改名為「德化社」以示教化懲戒，大甲東社則因立場不同而得以保留原有社名，成為蓬山八社中少數維持原名的部落，這段選邊站的歷史际遇差異，也讓大甲東這個地名意外承載了清代原住民政策中「順我者存、逆我者改」的政治色彩。如今大甲東因鄰近國道3號大甲交流道，加上緊臨鐵砧山風景區，已從清代的道卡斯族部落，發展成大甲區東側重要的農業與交通節點。"],
    ["台中市","大湳","低窪濕地","大雅區舊稱，湳為閩南語濕軟泥地之意，早期此地地勢低窪多濕地，故稱大湳。","s","大湳是大雅區境內清代便已存在的舊聚落名稱，與大雅本身舊稱「壩仔」同樣反映了這片大甲溪沖積扇地帶早期地勢低窪、排水不易的地形特徵：「湳」在閩南語中意指濕軟泥濘的低窪地，先民依此特徵稱這片區域為「大湳」，與台北八德區、新北蘆洲區等地同樣出現的「湳」系列地名，屬於台灣拓墾史上依地形特徵命名的普遍案例之一。大雅區境內因大甲溪長期沖積，土壤肥沃但排水條件不一，因而同時存在「壩仔」（河邊草埔）與「大湳」（低窪濕地）兩種不同地形特徵所衍生的舊地名，共同勾勒出這片沖積平原早期開墾的地貌樣態。如今大湳一帶因鄰近台中國際機場與大雅都市計畫區的開發，已從清代濕軟難行的低窪農地，轉型為大雅區重要的住宅與商業生活圈。"],
    ["彰化縣","東螺","東螺社譯音","北斗一帶舊稱，源自平埔族巴布薩族「東螺社」譯音，清代因舊街遭洪水沖毀而遷至今北斗鎮重建。","s","東螺社是清代彰化平原巴布薩族的重要聚落之一，清初文獻記載其活動範圍以舊濁水溪（今東螺溪）沿岸為中心，是漢人尚未大規模入墾前，這片區域最主要的原住民部落。東螺社與周邊的眉裡社、二林社等同屬巴布薩族分支，各社之間雖語言文化相近，卻各自擁有獨立的頭目與領域範圍。隨著漢人移民自18世紀起大量湧入東螺溪流域拓墾，東螺社的傳統領域逐漸被侵占，族人被迫與漢人雜居或往內山遷徙，其漢化程度也隨之加深。道光元年（1821年）東螺街遭洪水沖毀後，倖存居民遷至今北斗鎮另闢新街，東螺社的社名雖仍保留在地名之中，其原有的部落組織與文化卻已隨著這次遷徙而逐漸消散，僅留下「東螺」這個詞彙，供後人追溯這片土地上曾經活躍的平埔族歷史。"],
    ["彰化縣","枋橋頭","設隘枋橋","社頭鄉舊稱之一，相傳清代此地設有木造隘門枋橋以防禦盜匪，因而得名。","s","枋橋頭是社頭鄉境內另一個與「社頭」並存的舊地名，兩者分屬同一鄉鎮不同聚落的歷史稱呼。清代社頭一帶因鄰近八卦山區，是漢人拓墾前緣與山區盜匪、原住民出草風險較高的地帶，先民為保護聚落與往來商旅安全，在交通要道上設置木造隘門「枋橋」作為防禦與警戒據點，這座枋橋所在的聚落因而得名「枋橋頭」，與新北市板橋區舊稱「枋橋」（因架設木板橋而得名）雖字面相似，命名緣由卻截然不同——板橋的枋橋指的是橋梁，社頭枋橋頭的枋橋則是防禦性隘門。枋橋頭與社頭鄉境內其他因平埔族「社頭」（大武郡社頭目居所）而得名的區域相互並存，共同勾勒出社頭鄉在清代同時面對族群防禦與拓墾開發的雙重歷史脈絡，如今枋橋頭一帶已完全融入社頭鄉的市街發展範圍。"],
    ["南投縣","埔里社","眉溪流域平埔社","埔里舊稱，因清代眉溪流域聚居多個平埔族社群，統稱埔里社，後成為漢人拓墾入山的重要據點。","s","「埔里社」一詞在清代文獻中，其實兼指狹義的邵族「Poli社」本身，以及廣義涵蓋整個埔里盆地平埔族匯聚生活圈的行政區劃名稱，光緒元年（1875年）清廷在此設置「埔里社廳」，正是取後者的廣義用法，作為開山撫番政策下管理這片內山地帶的行政機構。埔里社廳的設立，標誌著埔里從原本邵族、泰雅族與陸續遷入的西部平埔族群共同生活的邊區地帶，正式納入清朝有效統治範圍的關鍵轉折點；官府同時在此築起土製城垣，稱為「大埔城」，作為行政中心的防禦屏障。日治時期，「埔里社」簡化為「埔里」，沿用至今。如今埔里鎮境內的地名如愛蘭（烏牛欄）、房里等，仍持續訴說著這段清代眾多平埔族社群因西部漢人拓墾壓力而遷徙匯聚於埔里盆地、形成獨特多元族群地景的歷史。"],
    ["南投縣","東埔","布農族溫泉部落","信義鄉東埔村一帶，為布農族傳統部落所在地，因鄰近溫泉、風景秀麗而聞名。","s","東埔位於南投縣信義鄉，是布農族傳統部落所在地，地處陳有蘭溪上游河谷地帶，因鄰近溫泉資源與壯麗山景，自日治時期以來便是知名的高山溫泉勝地，泉質屬弱鹼性碳酸氫鈉泉，是玉山國家公園西側入口的重要中繼站。境內的東埔吊橋橫跨八掌溪河谷，全長約200公尺，是台灣目前最高的吊橋之一，橋面採鏤空木質設計，可俯瞰橋下128公尺深的溪谷雲霧景致，吊橋入口的石雕山豬造型，也呼應了布農族傳統的狩獵文化意象。東埔部落至今仍保留布農族的祭儀傳統與八部合音（Pasibutbut）等珍貴無形文化資產，是南投縣信義鄉境內布農族文化與生態觀光資源兼具的代表性部落，也是攀登台灣最高峰玉山最主要的登山口之一。"],
    ["花蓮縣","奇萊","奇萊平原舊稱","花蓮舊稱之一，源自阿美族語譯音，泛指花蓮溪出海口一帶的平原地帶，今奇萊山之名亦源於此。","s","「奇萊」一詞的由來，其實源自一場語言誤會：花蓮平原原是阿美族支系「撒奇萊雅族」（Sakiraya）的世居之地，這個族名在該族語言中意指「真正的人」，是族人對自身的驕傲自稱。清代及日治初期外來的漢人與日本人初次接觸這支原住民族群時，誤將其族名當作地名使用，並依諧音簡化為「奇萊」，這片族人世代生活的平原因而被稱為「奇萊平原」，範圍大致涵蓋今日新城鄉、花蓮市與吉安鄉一帶；中央山脈北段的奇萊山，也是因鄰近這片平原而得名，而非山名在先、平原地名在後。1878年，加禮宛事件與達固湖灣事件後，撒奇萊雅族遭清軍重創，被迫隱身於阿美族部落之中長達百餘年，直到2007年才獲得政府正式承認為台灣第13個原住民族，「奇萊」這個因誤會而生的地名，如今反而成為追溯撒奇萊雅族身分認同與歷史記憶的重要線索。"],
    ["花蓮縣","薄薄社","阿美族部落","吉安鄉舊稱，因當地為阿美族「薄薄社」（Cikasuan）聚落所在地而得名。","s","薄薄社（阿美族語稱Cikasuan）是花蓮平原阿美族最古老、規模也最大的部落之一，與吉安鄉主要舊稱「七腳川社」同屬阿美族在花蓮平原上的重要聚落，兩者雖同處吉安鄉境內，卻是各自獨立發展的部落單位：七腳川社後來因日治時期「七腳川事件」（阿美族抗日行動）遭日方鎮壓、社域被劃為官營移民村「吉野村」，族人被迫遷散；薄薄社則相對持續保有部落聚落型態，維繫阿美族傳統祭儀與社會組織至今。薄薄部落至今仍保留完整的阿美族年齡階級制度與豐年祭（Ilisin）文化，是花蓮縣阿美族傳統文化保存相對完整的部落之一，也讓吉安鄉境內同時並存著「吉野／吉安」（日治移民村系統）與「薄薄」（阿美族傳統部落系統）兩套不同淵源的地名記憶，共同勾勒出這片土地多元族群交疊的歷史層次。"],
    ["宜蘭縣","蛤仔難","噶瑪蘭族譯音","宜蘭舊稱之一，為清代漢人對噶瑪蘭族自稱的音譯用字，後改以「噶瑪蘭」為正式譯名。","s","「蛤仔難」是清代漢人文獻中，對宜蘭平原及其原住民噶瑪蘭族最早、也最常見的音譯寫法之一，早在1723年（雍正元年）的官方文書中便已出現，此後陸續衍生出「蛤仔蘭」「甲仔難」等多種近音異字的寫法，反映了漢人初次接觸這片陌生土地與族群時，透過口耳相傳進行音譯所產生的用字分歧。1632年，西班牙人因船難漂流至此，是西方文獻中最早記載這片區域的紀錄；1768年，漢人林漢生曾嘗試探勘蛤仔難，卻遭原住民殺害，直到1796年吳沙率眾入墾後，漢人才真正在此站穩腳步。嘉慶17年（1812年）清廷設治後，官方文書逐漸統一採用發音更貼近原住民自稱、且字義較為中性的「噶瑪蘭」取代「蛤仔難」，但「蛤仔難」作為宜蘭最古老的漢字記音，至今仍是地方文史考據中不可或缺的重要參照。"],
    ["宜蘭縣","噶瑪蘭","平原之人","宜蘭舊稱，源自當地原住民自稱「Kavalan」，意為「平原的人」，清嘉慶年間設噶瑪蘭廳。","s","「噶瑪蘭」一詞源自當地原住民「Kavalan」的自稱，意指「平原的人」，相對於居住在山地的泰雅族等族群而自我定義，這個名稱後來也成為學界對這支平埔族群的正式族稱「噶瑪蘭族」。清嘉慶15年（1810年），閩浙總督方維甸來台巡視，見宜蘭地區漢人開墾已具規模，奏請清廷將這片土地正式納入版圖；嘉慶17年（1812年），清廷設「噶瑪蘭廳」，以「噶瑪蘭」取代原本較為混亂的「蛤仔難」音譯用字，作為正式的官方行政區名稱，這也是台灣清代少數以原住民族語自稱、而非漢人主觀命名的行政區地名。光緒元年（1875年），噶瑪蘭廳升格改制為宜蘭縣，正式定名「宜蘭」，但「噶瑪蘭」之名並未因此消失，如今仍廣泛使用於蘭陽平原的文化推廣、地方品牌命名，以及噶瑪蘭族正名運動之中，成為連結這片土地與其原初主人的重要文化符碼。"],
    ["屏東縣","六堆","客家六聚落聯防","清代六堆客家先民為自保而組成的六個聯防區域（前、後、左、右、中、先鋒堆），為屏東平原重要的客家文化區。","s","「六堆」之名源自清康熙60年（1721年）朱一貴事件爆發時，屏東平原客家移民為保衛家園、協助清廷平亂，仿照清代軍制自組義勇軍，依聚落地理位置劃分為前堆（麟洛、長治）、後堆（內埔）、左堆（佳冬、新埤）、右堆（美濃、高樹、六龜）、中堆（竹田）、先鋒堆（萬巒）六個區塊，「堆」即為「隊」的客語同音異寫，指軍事編組單位而非行政區劃，這與六甲、林鳳營等源自明鄭軍屯的地名邏輯不同，六堆是清代民間自發組成的地方防衛體系。此後六堆團練歷經多次動員，包括平定吳福生事件、林爽文事件等，逐漸從臨時性義勇軍組織，演變為凝聚屏東客家族群認同的文化象徵。如今「六堆」已超越單純的軍事聯防意涵，成為涵蓋語言、信仰、建築與生活習俗的整體客家文化圈代稱，六堆客家文化園區便設立於內埔鄉，作為保存與推廣這段歷史記憶的重要據點。"],
    ["高雄市","五塊厝","五戶人家開墾","相傳清代最初僅有五戶人家在此開墾定居，因而得名，即今高雄市三民區一帶。","s","五塊厝與三民區主地名「三塊厝」屬於相近邏輯、卻各自獨立發展的聚落地名：三塊厝源自王、蔡、鄭三姓移民各自搭屋開墾，五塊厝則相傳最初僅有五戶人家在此落地生根，共同開墾這片土地，因而以實際開墾戶數為地名，這種依開墾戶數多寡直接命名聚落的方式，與六腳（六家佃）、頭份（抓鬮第一份）等地名，同屬台灣拓墾史上常見的計量式命名邏輯。五塊厝地處三民區境內，日治時期因鄰近縱貫鐵路與愛河水運，逐漸發展成人口聚集的市街，如今雖已完全融入三民區的都市紋理之中，但透過鄰近的五塊厝派出所、五塊厝街等地名沿用，仍可追溯這段清代移民依戶數命名聚落的拓墾記憶。"],
    ["嘉義市","桃仔尾","嘉義舊街地名","清代嘉義城郊的舊街名，相傳因街尾一帶早期遍植桃樹而得名。","s","桃仔尾與嘉義另一個廣為流傳的別稱「桃城」其實同出一源：清代嘉義築城時，城牆格局在地圖上俯瞰宛如一顆桃子的形狀，城池尾端收窄之處恰好對應街尾這片區域，因當地又遍植桃樹，居民便稱此地為「桃仔尾」，意指桃形城池的尾端地帶，而整座城池則因此獲得「桃城」的雅稱，這個別稱至今仍廣泛出現在嘉義的商家字號、糕餅名產與地方文史介紹中，例如知名的「桃城」系列伴手禮品牌，便是直接沿用這段清代城池形狀命名典故。桃仔尾所在的街區，清代是嘉義城郊的邊緣地帶，隨著城市發展逐漸融入嘉義市區範圍，如今雖已鮮少作為正式地名使用，但透過「桃城」這個文化符號，桃仔尾當年的城郭意象仍持續在嘉義的地方認同中流傳不輟。"],
    ["嘉義縣","水汴頭","水圳分水閘","民雄鄉一帶舊地名，因當地灌溉水圳設有分水閘門（水汴）調節水量而得名。","s","水汴頭與民雄鄉主地名「打貓」分屬不同層次的地名系統：打貓源自洪雅族社名，是整個民雄地區的古老稱呼，水汴頭則是民雄境內一處更細緻的小地名，專指灌溉水圳設置分水閘門的特定地點。「汴」在水利用語中意指調節水流分配的閘門或涵管，先民在打貓地區興修水圳灌溉農田時，於水量分配的關鍵節點設置水汴，用以公平分配各處農田所需的灌溉用水，這處設施周邊逐漸形成聚落後，便直接以「水汴頭」為地名，反映了清代嘉南平原農業拓墾對水利工程與灌溉管理的高度依賴。如今水汴頭一帶已融入民雄鄉的市街發展範圍，但這個地名仍見證著先民在打貓這片土地上，如何透過精密的水利分配制度，將洪雅族的荒野墾殖為嘉南平原上的良田阡陌。"],
    ["金門縣","浯洲","牡蠣沙洲","金門舊稱，因島上盛產牡蠣（蚵）且多沙洲地形，古稱浯洲，明代因軍事地位重要改稱金門。","s","「浯洲」是金門在明代以前最主要的舊稱，另有仙洲、浯江、浯島等別稱，自晉代以來，金門便有中原移民因躲避戰亂而渡海南遷至此的紀錄，唐德宗時更在此設置牧馬區，隨牧馬監陳淵前來的蔡、許、翁、李、張、黃、王、呂、劉、洪、林、蕭等十二姓氏，至今仍是島上主要姓氏，並以血緣關係形成傳統聚落。金門自古隸屬福建同安縣管轄，明洪武年間，江夏侯周德興奉命在浯洲興建「守禦千戶所城」，考量此地內可捍衛漳州、廈門，外可牽制台灣、澎湖，具有「固若金湯、雄鎮海門」的險要形勢，遂將「浯洲」正式改稱「金門」，這個充滿軍事戰略意涵的新地名沿用至今，明清科舉時期更曾締造「八鯉渡江」「五桂聯芳」等多人同科及第的科舉佳話，顯示浯洲雖僻處海隅，文風卻頗為鼎盛。"],
    ["連江縣","馬祖","媽祖顯靈傳說","相傳媽祖曾在南竿島顯靈拯救船難漁民，鄉民感念建廟奉祀，島嶼因而得名馬祖（媽祖音轉）。","s","「馬祖」地名由來，與媽祖信仰的一則靈驗傳說密切相關：相傳媽祖之父林願因公殉海，媽祖沿海尋找父親遺體，最終尋獲後安葬於南竿島馬港村一帶的山巔，鄉民感念媽祖至孝之情與其後屢次在海上顯靈庇佑漁民船隻、拯救船難的事蹟，建廟奉祀，這座廟宇便是今日的馬祖天后宮；「馬祖」一詞即是「媽祖」的音轉寫法，此後這片列島便以「馬祖」為名，沿用至今，與金門「浯洲」因軍事戰略考量命名的邏輯截然不同，馬祖是少數直接源自民間信仰傳說的離島地名。馬祖列島由南竿、北竿、莒光、東引等數十座島嶼組成，是台澎金馬地區最北端的領土，因地理位置特殊，在兩岸對峙年代曾是保衛台澎的軍事前哨，戰地坑道與地下工事遍布全境；如今每年6至8月盛產的藍眼淚生態奇景與元宵擺暝迎神民俗，讓馬祖從昔日的戰地前線，轉型為兼具自然生態與獨特閩東文化的觀光勝地。"],
    ["嘉義市","紅毛井","蘭井","紅毛井為荷蘭人1657年在諸羅山社聚落中心開鑿的水井，因水質甘美列入諸羅八景「蘭井泉甘」，是嘉義市現存最古老的古蹟。","s","紅毛井又稱蘭井，是荷蘭聯合東印度公司於1657年在諸羅山社聚落中心「中央廣場」開鑿的水井，當時荷蘭政務員與牧師已進駐此地治理傳教多年，因派駐人員日增，遂鑿此大井供應飲水需求。台灣民間慣以「紅毛」稱呼荷蘭人，故稱「紅毛井」。明鄭時期，鎮守諸羅山的部將吳智武曾加以整修；清乾隆27年（1762年），諸羅知縣衛克堉因井水甘美冠於全縣，以「蘭井泉甘」之名列入「諸羅八景」，附近街道也因此得名「蘭井街」。日治時期水質逐漸惡化，官署甚至張貼「不適飲用」告示，1928年一度遭磚石填塞荒廢，直到民國59年（1970年）嘉義市長許世賢重修此井並立碑紀念。紅毛井是嘉義市內留存最久的古蹟，2008年公告為歷史建築，見證了諸羅山從荷治聚落發展至今的三百餘年歷史。"],
    ["嘉義市","蘭潭","紅毛埤","蘭潭古稱紅毛埤，相傳為荷蘭人所鑿的埤塘，1942年整治為水庫，「蘭潭泛月」是諸羅八景之一，是嘉義市重要的水源地與觀光勝地。","s","蘭潭位於嘉義市東郊山仔頂，古稱「紅毛埤」，相傳荷蘭統治時期，為確保灌溉水源穩定，在八掌溪上游築堰壩截流成埤，灌溉附近的「王田」，因漢人稱荷蘭人為「紅毛」而得名；此後清康熙34年（1695年），當地漢人與諸羅山社合作另築「番仔陂」（今北香湖公園），與紅毛埤分屬不同水利系統。日治昭和年間，因嘉義市民生用水激增，加上台灣拓殖株式會社設立的嘉義化學工場需要大量工業用水，遂於1942年在紅毛埤原址興建水庫，1944年完工，因潭水清澈、名稱典雅而改稱「蘭潭」，「蘭潭泛月」的皎潔夜色更被列入諸羅八景之一。如今蘭潭仍是嘉義地區自來水的主要供應源，環潭步道、蘭潭後山公園與藝術裝置「月影潭心」，讓蘭潭成為嘉義市民假日休閒的重要去處，也是嘉義大學鄰近的地標水域。"],
    ["澎湖縣","吉貝嶼","嘉貝嶼","吉貝嶼因島嶼形狀宛如一枚螺貝漂浮海面，先民稱嘉貝嶼，後以諧音雅化為吉貝，是澎湖北海最大島嶼、石滬密度最高之地。","s","吉貝嶼舊稱「嘉貝嶼」，因整座島嶼的地形輪廓，從高處俯瞰宛如一枚螺貝漂浮於海面之上，先民依此形似特徵為地方命名，其後以台語諧音雅化，將「嘉貝」改為更具吉祥意涵的「吉貝」，沿用至今。吉貝嶼是澎湖群島北海海域中最大的有人島，島嶼地勢東高西低，西南方由西崁山向外延伸出一道長達七百餘公尺的沙嘴地形，沖積而成的金黃色沙灘是遊客造訪的重點，周邊廣大的潮間帶更聚集了約八十餘座傳統石滬，是全澎湖石滬分布最密集的地方，堪稱先民智慧捕魚工法的活教材。清雍正5年（1727年），吉貝從鎮海澳分設獨立為「吉貝澳」，如今則是澎湖縣白沙鄉轄下的離島社區，因水上活動盛行，是澎湖夏季觀光最熱門的離島之一。"],
    ["澎湖縣","二崁","二崁社","二崁因聚落座落於東西兩處台地之間而得名「崁」（意指高地），是明末金門陳姓移民所建立的單姓聚落，為台灣第一個傳統聚落保存區。","s","二崁地名中的「崁」字，在台語中意指山丘或高地，二崁聚落因坐落於東、西兩處台地之間而得名。相傳明末清初，金門下坑（今金湖鎮夏興）陳姓先祖陳延益渡海遷居澎湖大池角，因當地可耕地已被先期移民占據，才輾轉遷居到龜山腳下的海濱，傳至第三代後，子孫日益增加分為四房，才陸續遷移至二崁定居，逐漸發展成清代道光年間成形的單姓血緣聚落，甲午戰爭後因生計艱難，青壯人口大量外流至台灣本島謀生。聚落內保存完整的閩南式古厝，以硓𥑮石與玄武岩為建材，最具代表性的陳家古厝，是兩位陳姓兄弟經商致富返鄉興建的三落大厝。民國90年（2001年），二崁經內政部指定為全台第一個「傳統聚落保存區」，如今活化為常民生活館、褒歌館等社區博物館群，是澎湖保存最完整的傳統聚落之一。"],
    ["澎湖縣","通樑古榕","通梁","通樑古榕相傳三百多年前一艘商船在吼門水道遇難，僅存一株榕樹苗漂流上岸，村民拾獲種植於保安宮前，如今已長成枝葉茂密的巨型老榕。","s","通樑古榕的由來，源自一則海難漂流的傳說：相傳約三百多年前，一艘商船航經澎湖白沙鄉通樑村外海的「吼門水道」（因水流湍急、聲如虎吼而得名）時不幸觸礁沉沒，船貨盡失，唯獨一株小小的榕樹苗漂流上岸，被當地村民拾獲後，栽種於保安宮廟埕之前。這株榕樹歷經三百餘年的歲月滋養，主幹早已分化出上百條氣根盤根錯節，枝葉開展覆蓋面積廣達六百多平方公尺，形成一片枝繁葉茂的天然綠蔭，是澎湖跨海大橋通車後遊客北環必訪的知名地標。通樑古榕不僅是澎湖現存樹齡最老、樹冠最大的老榕樹，村民更在樹蔭下設置石桌石椅供人乘涼歇息，讓這株因海難奇蹟漂流而來的樹苗，成為通樑村最具代表性的守護象徵與觀光名片。"],
    ["澎湖縣","虎井嶼","船篷嶼","虎井嶼舊稱船篷嶼、檯嶼，因島嶼地形中央裂開一道港灣、遠望形似猛虎而得名，是北回歸線穿越的澎湖第七大島。","s","虎井嶼舊稱「船篷嶼」或「檯嶼」，清代《台灣府志》記載此島「形如猛虎，中裂一港，故名」，另一版本府志則描述其地形「形如虎臨深」，兩種記載雖用詞略有出入，但都指出「虎井」之名源自島嶼地形神似猛虎的視覺意象，島嶼中央又因地勢裂陷形成一道天然港灣，恰似虎口一般，因而得名「虎井」，「井」字或許正呼應了這處中裂如井的港灣地形。虎井嶼是澎湖群島面積排名第七大的島嶼，特殊的是，北回歸線恰好穿越這座小島，具有地理座標上的獨特意義。島上的觀音公園立有一尊高達四公尺的漢白玉觀音巨像，由旅港鄉親捐贈故鄉，因運送過程一度斷裂為三截，如今仍可見接合痕跡。虎井嶼因地形隱密、漁業資源豐富，是澎湖群島中保留較多傳統漁村風貌的離島之一。"],
    ["金門縣","珠山聚落","山仔兜","珠山聚落舊稱山仔兜，閩南語意指丘陵環抱的聚落，元代薛氏族人避難遷居於此，因聚落四周高地環繞、中有大潭而形成風水吉穴。","s","珠山聚落舊稱「山仔兜」，閩南語中「兜」意指家或聚居之處，「山仔兜」即指坐落於丘陵環抱之中的聚落。元至正5年（1345年），同安人薛貞率領家族渡海避難至此，最初落腳於「薛厝坑」，後代子孫以聚落東側一座小山「珠山」為名，逐漸取代原本的地名。珠山聚落地形四周皆為高地環繞，中央則有一座大潭，形成風水學上「四水歸塘」的吉穴格局，象徵財富匯聚，整個聚落便以薛氏大宗宗祠為核心，環繞著這座大潭向兩側拓展開來，民間更有「有水頭厝，無山仔兜富」的俗諺，形容珠山聚落當年的富庶程度不亞於水頭聚落。珠山至今已有六百五十餘年歷史，1949年國軍進駐後一度徵用民宅作為營舍，1958年八二三砲戰更遭嚴重破壞，經過長期修復，如今是金門保存最完整的單姓宗族傳統聚落之一，也是金門國家公園劃定的重要傳統建築保存區。"],
    ["金門縣","瓊林","平林","瓊林因聚落樹木蓊鬱如傘蓋，原稱平林，明天啟皇帝以「平林」之名太過俗氣，特賜名瓊林，成為蔡氏宗族世代榮耀的里名。","s","瓊林原稱「平林」，因這座位於金門島中央蜂腰部平原地帶的聚落，遠望林木蓊鬱、樹冠儼然如蓋，因而得名。明天啟年間，皇帝垂詢金門籍官員蔡獻臣的出生地地名，聽聞「平林」之名後，認為過於俚俗，未能彰顯這座蔡氏宗族聚落人才輩出的文風氣象，遂御筆賜名「瓊林」，這個充滿皇室恩寵色彩的里名，自此成為蔡氏族人世代傳頌的無上榮耀。瓊林是金門規模最大的單姓（蔡氏）聚落，明清兩代累計出了六位進士、六位武將、七位舉人，「父子進士」蔡貴易、蔡獻臣父子，以及「五桂聯芳」的科舉佳話都出自此地，堪稱「文武世家」；村內宗祠數量之多、建築之精美，冠於金門全縣，有「七座八祠」之稱，瓊林祭祖傳統至今仍完整保存，被譽為一頁「活的閩南文化」，是金門文風鼎盛歷史的最佳見證。"],
    ["金門縣","山后聚落","山后中堡","山后聚落因旅日僑領王國珍、王敬祥父子出資興建十八棟閩南二進式大厝，分贈族人居住，俗稱「山后十八間大厝」而聞名。","s","山后聚落位於金門金沙鎮山后村中堡，是清光緒26年（1900年）由旅居日本經商致富的僑領王國珍、王敬祥父子，斥資興建的宗族聚落。這對父子從大陸購入建材，耗費二十餘年光陰，陸續興建包含住宅、家祠與學堂（海珠堂）在內共十八棟房舍，全部依山面海而築、格局壯闊整齊，統一採用閩南傳統二進式建築樣式，落成後分贈給王氏族人居住，因而被金門人習稱「山后十八間大厝」，是金門僑鄉「落番」（下南洋經商）致富回饋鄉里的代表性建築群。民國68年（1979年），金門縣政府整修規劃後正式定名為「山后民俗文化村」，開闢成民俗文物、禮儀、喜慶、生產、武道、休閒等主題展館，加上一座古代官邸，集中展示金門地方民俗文物，成為認識金門傳統聚落建築藝術與僑鄉歷史的重要觀光據點。"],
    ["金門縣","水頭聚落","金水","水頭聚落因地處金門島西南海濱、村落附近有一處終年不涸的泉源而得名，因僑匯興盛而洋樓林立，得月樓是最具代表性的僑鄉地標。","s","水頭聚落地名由來，一般認為與當地地理環境中曾有一處泉水源頭有關，「水頭」意指水源匯聚湧出之處，這座位於金門島西南海濱的聚落，因鄰近優良港灣，自古便是商賈往來與對外貿易的重要據點。清末民初，金門因土地貧脊，大量青壯人口渡海前往南洋（下南洋俗稱「落番」）經商謀生，水頭因地利之便，成為僑民匯款回鄉興建洋樓最集中的聚落之一，僑匯所建的西式洋樓與傳統閩南古厝交錯並存，形成獨特的僑鄉建築景觀，其中最富盛名的「得月樓」，是水頭富商黃輝煌僑匯興建、樓高突出的銃樓式建築，兼具防禦盜匪與彰顯家族財富的雙重功能，樓名取自「近水樓台先得月」的詩意，如今已成為金門僑鄉文化最具代表性的地標，水頭聚落也因此享有「有水頭厝，無山仔兜富」俗諺中所形容的富庶美名。"],
    ["連江縣","牛角聚落","復興村","牛角聚落位於南竿島東北方，因島形似犀牛、聚落恰好座落於形似犀牛角的岬角處而得名，現正式行政名稱為復興村。","s","牛角聚落舊名「牛角」，現為連江縣南竿鄉復興村：相傳南竿島整體地形輪廓神似一頭犀牛，而這處聚落恰好座落於島嶼東北方、形貌如犀牛角般向海突出的岬角地帶，兩側山頭伸入海中的形貌，漁民從海上望去猶如一對牛角，因而得名。牛角聚落依循馬祖傳統「一澳一村」的聚落型態，沿著大澳灣澳而建，以花崗岩砌成的方正石屋層層錯落，蔚為特色。牛角在戰地政務時期一度發展成馬祖行政中樞與南竿商業中心，是當年第一大村，繁華程度獨領風騷，村內至今仍保留昔日「軍中樂園」特約茶室的歷史遺跡。如今牛角聚落雖已沒落沉寂，卻因保留較少觀光化痕跡、原汁原味的漁村風貌，加上每年秋季在此舉辦、感念臨水夫人庇佑孩童平安成長的地方青年成年禮，讓牛角持續散發獨特的馬祖在地文化魅力。"],
    ["連江縣","鐵板聚落","仁愛村","鐵板聚落因海邊一塊沉積岩板在大退潮時露出水面、經陽光照射閃閃發光宛如鐵板而得名，現正式行政名稱為仁愛村。","s","鐵板聚落舊名「鐵板」，現為連江縣南竿鄉仁愛村：這處三面環山、一面向海的漁村聚落，因海岸邊有一塊天然沉積岩板，每逢大退潮時便會完全露出水面，在陽光照射下閃閃發亮，遠望宛如一塊鋪展於海邊的鐵板，因而得名。鐵板村擁有可追溯至元代的重要歷史見證：村內大王宮保存一方石碑，碑文記載「林酉才喜捨中統鈔二十貫」，中統鈔是元世祖時期流通的貨幣，證明南竿島早在元代便已有漢人聚落形成，是馬祖地區有文字記載最早的人類活動證據之一。鐵板村曾因設有大型菜市場與連江縣政府機關而繁華一時，享有「南竿不夜城」的美稱，惜隨著縣府與市場遷移逐漸沉寂，如今僅存少數閩東式漁家老屋與百年歷史的鐵板天后宮，靜靜訴說著這段漁村曾經的輝煌歲月。"],
    ["連江縣","津沙聚落","金沙","津沙聚落因擁有一片如金砂般細緻的沙灘，原稱「金沙」，後改寫作「津沙」，是南竿最靠近中國大陸的第一大漁村聚落。","s","津沙聚落位於南竿島西南方雲台山下的一處灣澳，因當地擁有一片沙質格外細緻、在陽光照射下宛如黃金粉末般閃耀的沙灘，先民最初將此地命名為「金沙」，其後才改寫作發音相近的「津沙」，沿用至今。津沙是馬祖列島中地理位置最靠近中國大陸的第一大漁村聚落，清末以來，陸續有連江、長樂、琅岐島等地的福建沿海居民移入定居，是馬祖地區原籍大陸連江縣移民比例最高的村莊。早年津沙漁業興盛，居民除了出海捕撈，也兼營釀酒、藥鋪、商號等行業，一度是南竿第二大村，並因村內設有私塾而文風興盛。抗戰時期，日軍為控制閩江口航道，曾派兵駐守津沙西邊山的「雁廬」。如今津沙聚落經社區營造活化，頹圮的老屋重現生機，轉型為老酒館與特色民宿，是馬祖列島中最受遊客青睞的傳統聚落之一。"],
    ["基隆市","八斗子","Pataw","八斗子源自平埔族巴賽語「Pataw」，意指女巫或溫泉，與台北北投同源；清末設有台灣第一座官營煤礦，如今為海科館與潮境公園所在地。","s","八斗子地名源自平埔族巴賽族語「Pataw」的音譯，這個詞彙意指「女巫」，與台北北投地名的由來語源相同，反映基隆與台北兩地平埔族群語言文化的關聯性；也有學者從「八斗仔」的「仔」尾綴推測，應是相對於古文獻中「八斗」這個主要大地名（可能指今和平島右岸岬角）而來的次要地名。八斗子東北側原有一座獨立於外海的「七斗山」島嶼，日治時期因興建北部火力發電所而填海造陸，與台灣本島相連成半島；光緒2年（1876年），清廷在此開設官營煤礦「清國井」，是台灣第一座官方經營的煤礦場，也讓八斗子早早便與台灣近代化礦業發展結下淵源。如今八斗子因國立海洋科技博物館、潮境公園與望幽谷（忘憂谷）等景點聞名，加上八斗子漁港豐富的海鮮，是基隆市東側最具代表性的觀光漁村。"],
    ["基隆市","和平島","社寮島","和平島舊稱社寮島，因漢人依島上平埔族聚落稱之為「社」而得名，1626年西班牙人在此建聖薩爾瓦多城，是台灣面向世界的第一站。","s","和平島舊稱「社寮島」，16世紀漢人航海文獻中最早稱此島為「大雞籠嶼」，此地原是平埔族巴賽族雞籠社的傳統聚落，清代漢人因島上住有原住民「社」（部落）而稱之「社寮」，日治時期行政區劃更直接定名為「社寮町」，「社寮島」之名因而沿用長久。1626年，西班牙人占領北台灣後，選定此島興建「聖薩爾瓦多城」作為統治據點，與同時期荷蘭人在台南興建的熱蘭遮城遙相對峙，故有「南大員、北社寮」之說，是台灣最早直接面向世界局勢、與西方勢力接觸的第一站；近年考古挖掘更在城堡遺址附近，發現當年西班牙人興建教堂的遺跡與歐洲人骸骨。1947年，「社寮島」正式改稱「和平島」，關於改名原因眾說紛紜，或因祈求島嶼自古以來戰亂頻仍能歸於和平，或與戰後基隆市街依「忠孝仁愛信義和平」命名的脈絡有關；如今和平島公園的海蝕地形與歷史遺跡，讓這座島嶼持續訴說台灣最早與世界接軌的故事。"],
    ["基隆市","仙洞巖","仙洞","仙洞巖因相傳曾有仙人在此修道登天而得名，是基隆港西北側一處天然海蝕洞，早年洞穴直接臨海，置身洞中可聞海濤拍岸之聲，故有「仙洞聽潮」之稱。","s","仙洞巖是基隆港西北側山巖上的一處天然海蝕洞穴，經過數萬年海水沖刷侵蝕而成，相傳曾有仙人在此洞中修行、最終得道升天，因而得名「仙洞」，「巖」字則呼應台灣民間佛道共存的「巖仔信仰」傳統。清同治11年（1872年），此地開始供奉釋迦牟尼佛與觀世音菩薩，另稱代明宮；日治明治39年（1906年），日本人一度將佛祖遷出，改以七福神中的弁財天神取代，稱為最勝寺，戰後才又恢復原本的佛像供奉，但弁財天神的祭祀習俗仍保留至今，形成一處佛、道、日本神道教信仰交融並存的特殊空間。在基隆港尚未興築、海岸線仍直抵山巖之時，洞穴內能聽見海浪拍打岩壁的陣陣潮聲，因而享有「仙洞聽潮」的美稱，是清代基隆八景之一，如今雖因港區開發、海岸線外移而不復聽聞，仙洞巖仍是基隆市歷史最悠久的宗教勝景之一。"],
    ["基隆市","二沙灣砲台","海門天險","二沙灣砲台因位於基隆二沙灣一帶的山路上而得名，1840年鴉片戰爭時始建，1886年台灣巡撫劉銘傳重修後，於營區城門題「海門天險」四字，因而又稱海門天險。","s","二沙灣砲台興建於清道光20年（1840年）鴉片戰爭期間，由台灣兵備道姚瑩下令在基隆二沙灣海岸邊構築，因地處二沙灣一帶山路，故稱「二沙灣砲台」。同年英國運輸船「吶爾不達號」砲擊雞籠岸防，淡水同知曹謹回擊致其觸礁擱淺，是清廷台灣守軍與英軍的第一次交戰紀錄。清法戰爭（西仔反）後，首任台灣巡撫劉銘傳鑑於基隆port防務的重要性，向英商購入新式後膛砲，聘請德國工程師重新設計督建，將砲台移築至更高的山丘之上，光緒12年（1886年）完工，並在營區正門題上「海門天險」四字匾額，這座砲台此後便多了這個充滿氣勢的別稱。「海門天險」屬於「抱山式砲台」，將砲台區設於臨海制高點、營盤區則置於背海低處，使敵艦砲火難以直接命中營區，展現精妙的地形戰術布局，歷經鴉片戰爭、清法戰爭、乙未戰爭三場戰役洗禮，如今仍保留古城門、砲座、彈藥庫等遺跡，是基隆港防禦史上最具代表性的國定古蹟之一。"],
    ["新竹市","青草湖","青草湖庄","青草湖原為新竹丘陵客雅溪谷地內一處雜草叢生的山間盆地，故稱青草湖，1956年築壩蓄水成水庫，因水庫淤積乾涸，一度被戲稱「名副其實的青草湖」。","s","青草湖地名由來相當寫實：這一帶原是新竹丘陵中、客雅溪流貫的一處山間谷地盆地，早期未經開發，雜草叢生，先民便依此景象稱之為「青草湖」，「湖」在此意指低窪的盆地地形，而非真有湖泊存在，清代這一帶已形成「青草湖庄」，隸屬竹北一堡。民國42年（1953年）起，政府在此興建攔水壩，1956年完工形成人工湖泊「青草湖山水庫」，兼具灌溉與觀光功能，山光水色一度吸引大量遊客，然而隨著水庫逐漸淤積、加上颱風破壞與上游濫墾，蓄水功能盡失，湖面因布袋蓮蔓生與泥沙淤積而縮小，意外應驗了「青草湖」字面上的景象，被戲稱為「名副其實的青草湖」。新竹市政府自2007年起推動「青草湖重生計畫」，清淤整治並興建映月橋連接淤沙堆積形成的湖中島「于飛島」，讓這處因荒地得名的山間盆地重現山水風貌，湖畔的靈隱寺也是在地知名的清幽古剎。"],
    ["澎湖縣","桶盤嶼","桶盤","桶盤嶼因整座島嶼由柱狀玄武岩環繞而成、從空中俯瞰輪廓渾圓平坦，狀似傳統木製圓形托盤（桶盤）而得名，是澎湖玄武岩地景保存最壯觀的島嶼。","s","桶盤嶼地名由來，源自島嶼的整體地形樣貌：這座島嶼四周由排列緊密、紋理分明的柱狀玄武岩石柱環繞拱衛而成，從高空俯瞰，全島輪廓渾圓且地勢平坦，形狀神似早期閩南家庭常見的木製圓形托盤「桶盤」，因而得名。桶盤嶼是澎湖群島中玄武岩柱狀節理發育最壯觀、規模最大的島嶼，每根石柱高約20公尺、寬約1.5公尺，因風化氧化而呈現淺棕色調，頂部因長期風化形成球狀構造，加上柱體因差異侵蝕形成蜂窩狀孔洞（當地稱「貓公石」），景色壯麗猶如海上的黃石公園，已被劃入澎湖玄武岩自然保留區的範圍，並成立澎湖桶盤地質公園，中華民國護照內頁更選用桶盤嶼的玄武岩景觀作為背景圖案。如今桶盤嶼因人口外移，聚落規模日漸縮小，卻因獨特的地質景觀，成為澎湖生態旅遊與地質教育的重要據點。"],
    ["金門縣","太武山","太武","太武山海拔253公尺，為金門最高峰，因山勢巍峨磅礡、氣度雄渾如武士盤坐而得名，山頂海印寺與毋忘在莒勒石，是金門重要的信仰與精神地標。","s","太武山是金門島上最高的山峰，海拔僅253公尺，卻因四周地勢平坦而顯得格外巍峨聳立、氣勢雄渾磅礡，山形渾厚穩重，宛如一位盤坐的武士，先民依此雄渾意象為山命名「太武」，這種以山勢氣度直接命名地標的方式，也可能與福建原鄉太武山系的地名傳承有關。太武山自古便是金門的精神象徵與信仰重鎮，山頂的海印寺（俗稱太武巖寺）建於南宋，主祀觀世音菩薩，寺後有「魁星樓」等古蹟；山腰的「毋忘在莒」勒石，是民國41年（1952年）先總統蔣中正巡視金門時親筆題刻，取戰國時期田單憑藉莒城、即墨兩座孤城復國雪恥的典故，勉勵軍民毋忘反攻復國的使命，這方勒石此後成為金門最具代表性的精神地標，也是連江縣莒光鄉命名典故的直接源頭。太武山區遍布戰時坑道與軍事據點，加上巨石磊磊的花崗片麻岩地質景觀，是金門島上兼具信仰、軍事歷史與地質景觀的重要象徵。"],
    ["連江縣","大坵嶼","大坵","大坵嶼位於北竿島北方，因1990年最後居民遷出成為無人島，1997年北竿軍方野放十餘頭梅花鹿於島上，如今已繁殖上百頭，享有「海上奈良」美稱。","s","大坵嶼地處連江縣北竿鄉北方海域，與高登、亮島相鄰，「坵」字在此泛指小島。這座島嶼曾有居民定居捕撈維生，全盛時期人口多達三百餘人，隨著台灣經濟發展與人口外流，民國79年（1990年）最後一戶居民舉家遷往北竿橋仔，大坵自此一度成為無人島。民國86年（1997年），南竿三民畜牧場因戰地政務終止、經營成本過高，北竿指揮部與縣政府協調後，將原本飼養的十三頭梅花鹿野放至已無人居住的大坵島，1998年駐軍全數撤離後，這群梅花鹿在無人打擾的環境下自在繁衍，數量從十三頭增長至上百頭，意外讓大坵島搖身一變成為知名的生態觀光景點，享有媲美日本奈良公園的「海上奈良」美稱。如今每年元宵「擺暝」，散居各地的大坵人仍會齊聚在信仰中心大坵大王廟，遙祭大坵、高登、亮島等昔日共同生活場域的守護神明，見證這段海島聚落人去樓空、卻因野生梅花鹿意外重獲新生的故事。"],
    ["連江縣","亮島","浪島","亮島舊稱浪島，位於馬祖最北端，因2011年出土距今約八千年的「亮島人」遺骸，是台灣海峽兩岸考古發現最古老的人類遺骸，改寫南島語族起源研究。","s","亮島是馬祖列島最北端的一座島嶼，與大坵、高登相鄰，舊稱「浪島」，因四周海象險惡、風浪較大而得名，其閩東語發音經音轉後演變為「亮島」。這座長期做為軍事管制區、罕有人跡的小島，2011年因考古團隊在島上進行搶救發掘，意外出土兩具保存完整的史前人類骨骸，經碳十四定年，確認年代距今約7500年至8300年，命名為「亮島人」，是目前台灣海峽兩岸所發現最古老的人類遺骸，這項重大考古發現，為學界研究南島語族起源與遷徙路徑，提供了關鍵的實物證據，亮島也因此從一座名不見經傳的軍事前哨小島，躍升為國際考古學界矚目的重要遺址所在地。如今亮島仍屬軍事管制範圍，未對一般遊客開放登島，僅能透過環島船班遠眺其身影，為這座島嶼增添幾分神秘色彩。"],
    ["連江縣","高登","高登島","高登位於北竿與亮島之間，舊稱下目，是馬祖列島中距離中國大陸最近的據點之一，昔日大坵、北竿居民曾在此海域採集石蚵維生，如今為軍事管制區。","s","高登是連江縣北竿鄉轄下一座小島，位於大坵與亮島之間，舊時當地居民稱之為「下目」，是馬祖列島中地理位置最靠近中國大陸沿岸的據點之一，因而在兩岸對峙時期具有極高的軍事戰略價值，長期做為前線駐軍據點，島上遍布碉堡與軍事坑道，至今仍屬軍事管制區，未對外開放觀光。根據大坵、北竿老一輩居民的口述記憶，高登海域昔日盛產石蚵，是周邊島嶼漁民重要的漁業採集場域：每逢特定季節，大坵島民便會結伴前往高登周邊礁岩採集石蚵維生，形成一套依循潮汐與物產分布、往來各島之間的傳統生活模式。如今高登雖仍籠罩著神祕的軍事色彩，卻也和大坵、亮島一同承載著馬祖北疆島民「靠海維生、四島一體」的共同歷史記憶。"],
    ["新竹縣","五指山","五峰山","五指山因五座山峰並列、形如一隻張開的手掌五指而得名，清代即列入淡水廳八景，日治與戰後皆入選台灣top勝景，是竹東、北埔一帶的信仰名山。","s","五指山地名由來源自其獨特的山形樣貌：這座橫跨新竹縣竹東、北埔、五峰等鄉鎮交界的山峰，因五個山頭相連並列、輪廓神似一隻張開的手掌五指，因而得名「五指山」，也稱「五峰山」，五峰鄉的鄉名便是由此山名而來。清代文獻中，五指山已因奇特山形與雲霧繚繞的景致，被列入「淡水廳八景」之一；日治時期，台灣日日新報舉辦「台灣八景」票選活動，五指山雖未能擠入正選八景，卻獲選為次於八景的「台灣十二勝」之一，聲名遠播全台。五指山山區廟宇林立，材源寺、灶君堂等廟宇沿著山徑錯落分布，形成獨特的朝山禮佛路線，加上茶園景觀與五指山國家森林步道，是新竹縣客家山區重要的信仰名山與生態健行勝地，山頂視野遼闊，晴朗時可遠眺新竹平原與台灣海峽。"],
    ["新竹縣","峨眉湖","大埔水庫","峨眉湖原稱大埔水庫，因水庫周邊山巒層疊、湖光倒映山影宛如古代女子彎彎的蛾眉而改稱峨眉湖，是東方美人茶的重要產地。","s","峨眉湖原稱「大埔水庫」，是民國51年（1962年）在峨眉溪上游興建攔水壩、於大埔村一帶形成的人工湖泊，主要功能為灌溉與防洪。由於水庫周邊群山環繞、層巒疊翠，湖面在晴朗無風之時，將四周山巒的倒影清晰映照於水中，山水相映的景致宛如古代女子彎彎的蛾眉，加上湖泊所在的峨眉鄉本身地名便源自「月眉」（半月形河階地形）的意象，地方遂將水庫改稱更具詩意的「峨眉湖」，沿用至今，與大埔水庫之名並行使用。峨眉湖周邊丘陵地帶因日夜溫差大、雲霧繚繞，是台灣東方美人茶（膨風茶）最重要的原鄉產地之一，相傳這種茶葉曾獲英國維多利亚女王讚賞而得名；環湖步道與獅頭山風景區相互串連，加上十二寮休閒農業區，讓峨眉湖成為新竹縣兼具水庫生態、茶葉產業與客家文化的複合觀光勝地。"],
    ["宜蘭縣","明池","池端","明池因高山湖泊終年雲霧繚繞、湖水清澈明亮如鏡而得名，日治時期因位於北橫沿線鞍部末端稱池端，海拔1150公尺，是北橫公路著名的高山林場景觀。","s","明池地處宜蘭縣大同鄉與桃園市復興區交界的北橫公路沿線，海拔約1150公尺，是一座天然形成的高山湖泊，因終年雲霧繚繞、水氣氤氳，湖面在雲霧散去時顯得格外清澈明亮、如鏡面般平靜，因而得名「明池」。日治時期，這處位於山區鞍部末端的湖泊一帶稱為「池端」，戰後政府在此設立森林遊樂區，因湖泊景致優美，正式定名「明池」，沿用至今。明池森林遊樂區保留大片台灣原生檜木林與人工柳杉林，湖畔終年氣候涼爽濕潤，四季皆有不同風貌，晨昏之際雲霧繚繞於林間湖面，宛如水墨畫中的仙境，是北橫公路沿線海拔最高、也最具代表性的高山湖泊景觀，加上鄰近棲蘭山莊與國家森林生態教育中心，讓明池成為北橫公路重要的中繼景點與生態教育場域。"],
    ["宜蘭縣","棲蘭","棲蘭山","棲蘭因蘭陽溪與田古爾溪匯流處河階台地形似鳳凰棲息之地，加上周邊山谷幽靜似有蘭花棲身而得名，是台灣珍貴檜木林的重要保育基地。","s","棲蘭地名由來，融合了地形意象與植被特徵兩種元素：這片位於蘭陽溪與田古爾溪匯流處的河階台地，四周高山環繞、地勢幽靜隱密，先民見此地形如鳳凰棲息之處，加上山谷間終年雲霧繚繞、气候濕潤，適合蘭科植物生長，彷彿蘭花棲身之所，兩相結合，將此地命名為「棲蘭」，這種結合鳥形地貌與花卉植被雙重意象的命名方式，讓棲蘭的地名格外富有詩意。棲蘭山區蘊藏台灣最珍貴的檜木林資源，林務局自民國80年代起，將棲蘭山區規劃為「棲蘭山莊」森林遊樂區，並劃設「棲蘭神木園區」，保護樹齡動輒上千年、以歷代中國君王命名的巨木群（如「孔子」「司馬遷」等神木），是台灣檜木林保育與生態教育的重要基地，加上鄰近明池、大甲溪與蘭陽溪的分水嶺地形，讓棲蘭成為北橫公路深處兼具生態保育與林業歷史意義的重要據點。"],
    ["花蓮縣","清水斷崖","女乃斷崖","清水斷崖因大部分岩層由潔白清澈的大理石構成、峭壁在陽光照射下純白耀眼而得名，是蘇花公路沿線太魯閣國家公園最著名的斷崖絕景。","s","清水斷崖地處太魯閣國家公園東北側、蘇花公路沿線，是清水山東側一段長達約21公里、平均坡度超過80度的沿海峭壁，因構成峭壁的岩層大部分是質地潔白清澈的大理石與片麻岩，在陽光照射下呈現耀眼的純白色澤，加上山勢近乎垂直插入蔚藍的太平洋，海天山色相互輝映，先民依此清澈潔白的視覺印象，將此地命名為「清水斷崖」。清水斷崖是蘇花公路最驚險也最壯麗的路段，公路緊貼峭壁邊緣蜿蜒而築，一側是萬丈懸崖、一側是浩瀚太平洋，自古便有「台灣八景」之一的美譽，清代文獻中則另稱「大魯閣斷崖」；1874年台灣總兵吳光亮率領飛虎軍開闢蘇花公路前身「北路」時，這段斷崖工程之艱鉅，堪稱蘇花公路開闢史上最險峻的一段，如今仍是台灣東部海岸線最具代表性、也最受遊客讚嘆的地質景觀之一。"],
    ["花蓮縣","砂卡礑","Skadang","砂卡礑源自太魯閣族語「Skadang」，意指「臼齒」，因族人早年在此拾獲一顆狀似臼齒的巨大獸骨而得名，是太魯閣國家公園著名的親水峽谷步道。","s","砂卡礑地名源自太魯閣族語「Skadang」，意思是「臼齒」：相傳早年一支太魯閣族先民狩獵隊伍行經這處溪谷時，意外拾獲一顆體積碩大、外形神似人類或大型動物臼齒的獸骨化石，族人依此奇特的發現，將這條溪流與周邊部落命名為「Skadang」，漢人依音譯記為「砂卡礑」。日治時期，這條溪流一度因發電廠興建而稱「大山溪」，但族人與在地居民多年來仍慣稱「砂卡礑溪」，如今官方也已恢復使用這個承載族語記憶的舊名。砂卡礑溪切穿大理石岩層，溪水因富含礦物質而呈現獨特的藍綠色澤，清澈見底、終年不絕，沿溪開闢的砂卡礑步道（又稱神秘谷步道）行走於峭壁與溪流之間，是太魯閣國家公園中最受歡迎的親水生態步道之一，讓這個源自臼齒發現傳說的地名，成為深受遊客喜愛的峽谷勝景代名詞。"],
    ["苗栗縣","火炎山","火炎山","火炎山因厚層礫石地形長期受雨水沖蝕，形成寸草不生的尖峰惡地，在夕陽映照下宛如熊熊火焰翻騰而得名，是全台三大火炎山惡地地形之一。","s","火炎山地名由來，源自其獨特的惡地地質景觀：這座橫跨苗栗縣三義鄉與苑裡鎮交界的山峰，主要由厚層礫石夾雜薄層砂岩構成，表層並有紅土化現象，長期受到雨水與河川侵蝕切割，形成一連串尖銳山峰、乾谷與沖蝕溝交錯的破碎地形，寸草難生；每當夕陽餘暉映照，山體外露的紅土與礫石在光線折射下宛如烈焰翻騰燃燒，加上山勢险峻、遠望氣勢磅礡，因而得名「火炎山」，這種因惡地地形視覺聯想而生的命名方式，與《西遊記》中描述的火焰山意象不謀而合。台灣共有三處知名的火炎山惡地地形，除苗栗三義火炎山外，另有南投九九峰、高雄六龜十八羅漢山，其中以三義火炎山的沖蝕作用最為劇烈、礫石顆粒也最大。1986年，政府依文化資產保存法在此劃設「苗栗三義火炎山自然保留區」，保護原生馬尾松林與特殊惡地地形，如今火炎山步道與鄰近的舊山線鐵道、勝興車站、龍騰斷橋等景點串連，是苗栗縣熱門的地質生態與鐵道懷舊觀光廊帶。"],
    ["嘉義市","彌陀路","彌陀寺","彌陀路因路底座落清乾隆17年創建的彌陀禪寺而得名，寺前八掌溪畔的「彌陀晨鐘」自日治時期起即列名嘉義八景，是嘉義市歷史最悠久的古剎之一。","s","彌陀路地名由來，直接取自路底座落的一座嘉義市歷史最悠久的佛寺「彌陀禪寺」（又稱彌陀寺）：清乾隆17年（1752年），福建漳州府平和縣僧侶苑藏前來諸羅城南、八掌溪畔募建寺院，是彌陀禪寺創建之始，此後歷經乾隆37年、道光年間、明治42年（1909年）、昭和17年（1942年）等多次修建，大殿至今仍保留傳統閩南寺廟的建築風格。彌陀禪寺前臨八掌溪，溪畔早年設有義渡口，方便嘉義與台南之間往來，道光27年（1847年）地方仕紳集資購田收租，以租金聘僱船夫免費擺渡行旅，後人立碑紀念，這座「八掌溪義渡碑」如今已列為嘉義市三級古蹟；寺前吊橋因遠望白鷺凌空飛越溪面，又有「鷺橋觀浪」的雅稱。民國37年（1948年）與84年（1995年）兩度評選的嘉義八景，「彌陀晨鐘」皆雙雙入列，是嘉義八景中唯一的宗教類景觀，彌陀路也因這座古剎而得名，沿用至今。"],
    ["嘉義市","嘉義舊監獄","台南刑務所嘉義支所","嘉義舊監獄興建於日治大正8年（1919年），原稱「台南刑務所嘉義支所」，是目前全世界僅存兩座「賓夕凡尼亞式」放射狀監獄建築之一，如今轉型為獄政博物館。","s","嘉義舊監獄興建於日治大正8年（1919年），歷時三年，於大正11年（1922年）竣工啟用，最初名稱為「台南刑務所嘉義支所」，承擔嘉義地區的司法矯正功能，民國83年因監獄遷至嘉義縣鹿草鄉而功成身退，原址因而閒置。這座監獄最珍貴之處，在於其建築工法完整採用18世紀末源自美國賓夕凡尼亞州的「賓夕凡尼亞式」放射狀監獄設計：獄方只需站在中央台，便能透過呈放射狀排列的走道，同時監看智舍、仁舍、勇舍等各分館的舍房動態，是極具效率的獄政管理建築典範，目前全世界僅存兩座這種形制的監獄，除嘉義舊監獄外，另一座位於日本北海道的網走監獄，兩者皆已轉型為對外開放的觀光景點。嘉義舊監獄於民國91年（2002年）公告為市定古蹟，94年（2005年）升格國定古蹟，歷經修復後於2011年以「獄政博物館」之姿重新對外開放，館內完整保留牢房、探監室、典獄長辦公室等空間，並展示各地監獄的技能訓練與更生輔導成果，是全台唯一可供民眾自由參觀的監獄建築。"],
    ["新竹市","迎曦門","竹塹城東門","迎曦門是竹塹城四座城門中僅存的東門，因面向東方、迎接朝陽初曦而得名，1902年日本人市區改正時拆除其餘城牆城門，僅保留此門，如今是新竹市的地標。","s","迎曦門是清代竹塹城僅存的一座城門，因方位座西朝東、清晨可迎接第一道曙光，取「迎曦」（迎接朝陽）之意而得名。雍正元年（1723年），竹塹設立淡水廳治，雍正11年（1733年）淡水同知徐治民以莿竹環植為城；道光6年（1826年），竹塹士紳鄭用錫（開台進士）等人奏請改建為磚石城獲准，1827年興工、1829年完工，城牆周長八百六十丈，並建四座城樓：東門迎曦門、西門挹爽門、南門歌薰門、北門拱辰門。明治35年（1902年），日本殖民政府實施市區改正，拆除城牆與其餘三座城門，唯獨保留迎曦門，使其成為竹塹城唯一的實體見證。迎曦門城座以花崗石條砌成，城樓為歇山重簷式構造、共二十四根立柱，門額上題「迎曦」二字，城門後方立有道光9年的「新建臺灣府淡水廳城碑記」石碑。民國88年（1999年）竹塹建城170週年時，周邊整建為結合護城河親水公園、詩牆與玻璃橋的「新竹之心」市民廣場，讓這座近兩百年的古城門，成為新竹市最具代表性的文化地標。"],
    ["澎湖縣","澎湖跨海大橋","通樑大橋","澎湖跨海大橋橫跨白沙與西嶼之間水流湍急的吼門水道，1970年完工時是遠東第一長的跨海大橋，是澎湖最具代表性的交通地標與觀光象徵。","s","澎湖跨海大橋橫跨白沙鄉通樑村與西嶼鄉之間的「吼門水道」，這處水道因海流湍急、浪濤拍擊聲宛如猛虎咆哮而得名，據測流速最高可達每秒三公尺，自古便是澎湖海域最險惡的航道之一，往來船隻經常翻覆遇難，白沙與西嶼兩地居民長期苦於交通阻隔。民國54年（1965年）政府決定興建跨海大橋，歷時五年，於民國59年（1970年）完工通車，全長2494公尺，是當時號稱「遠東第一長」的跨海大橋，徹底解決兩地往來的交通困境，也讓澎湖北環公路得以全線串連。由於海風鹽害嚴重侵蝕橋體結構，民國72年（1983年）政府重新興建新橋，於民國85年（1996年）完工啟用，即為今日所見的跨海大橋。橋頭矗立的白色拱形橋門，是遊客造訪澎湖必訪的拍照地標，加上鄰近的通樑古榕、漁翁島燈塔等景點，讓澎湖跨海大橋不僅是重要的交通建設，更成為澎湖觀光最鮮明的視覺象徵。"],
    ["金門縣","古寧頭","古龍頭","古寧頭舊稱古龍頭，由北山、南山、林厝三個聚落組成，因地形如龍首伸入海中而得名，1949年古寧頭戰役即在此爆發，是金門最重要的戰役紀念地。","s","古寧頭舊稱「古龍頭」，這一帶由北山、南山、林厝三個相鄰聚落共同組成，因地形向西北方海域突出、遠望宛如一顆巨龍昂首探入海中，因而得名，其後才雅化為發音相近、意涵較為平和的「古寧頭」。古寧頭是金門島西北端距離中國大陸最近的地帶之一，民國38年（1949年）10月25日凌晨，解放軍部隊在此搶灘登陸，國軍與之展開激烈的三晝夜戰鬥，最終成功殲滅登陸部隊，史稱「古寧頭大捷」，這場戰役被視為扭轉國共內戰後期台海局勢的關鍵一役，也讓「古寧頭」三字成為台灣軍事史上最具份量的地名之一。如今古寧頭設有古寧頭戰史館，館內以油畫、文物與影像完整重現戰役經過；北山聚落的「北山古洋樓」牆面至今仍保留當年戰鬥留下的密集彈孔，是最真實的歷史見證。古寧頭周邊的慈湖與雙鯉濕地，如今更成為金門重要的候鳥棲息保護區，戰地與生態在此奇妙共存。"],
    ["嘉義市","射日塔","嘉義神社","射日塔塔名取自台灣原住民「射日神話」，原址為日治時期嘉義神社本殿、戰後改建忠烈祠，1994年遭祝融焚毀後重建為塔，是嘉義市地標。","s","射日塔位於嘉義公園內「山仔頂」一帶，塔址原是台灣原住民平埔族的祭壇所在，日治時期在此興建第二代「嘉義神社」本殿，戰後神社改建為嘉義市忠烈祠，直到1994年遭祝融之災焚毀。嘉義市政府原本計畫在公園內分別重建忠烈祠與新建高塔，卻因經費不足，最終變更設計，將兩項工程合而為一、共用結構體與基礎，由成功大學建築系林憲德教授與卓建光建築師規劃設計，1998年完工。「射日塔」之名取自台灣原住民流傳的「射日神話」：相傳古代天上有兩個太陽輪流出沒，酷熱難耐、河川乾涸，勇士們遂遠征射日，歷經世代傳承終於成功，這則神話蘊含繼往開來的傳承精神。塔身高62公尺、共12層，褐色鋁條紋理取材自阿里山神木外皮，中央留有高40公尺的「一線天」，彷彿被劈開的神木，內部懸掛仿剪紙藝術的巨型青銅雕刻描繪射日傳說；入口處立有象徵台灣守護神的雲豹銅雕，底層為忠烈祠、頂層設觀景咖啡廳，是嘉義市最具代表性的現代地標。"],
    ["嘉義市","北門驛","北門乘降場","北門驛是阿里山森林鐵路的起點車站，1912年落成，因位於清代諸羅城北門外而得名，是台灣林業運輸史上最重要的木造車站。","s","北門驛因座落於清代諸羅城（嘉義古城）北門城外一帶而得名，「驛」則是日治時期對火車站的稱呼。1899年，日本政府發現阿里山蘊藏豐富的檜木資源，1906年起著手興建阿里山森林鐵路，1912年全線通車，北門驛正式落成啟用，成為這條鐵路的起點站與營林所辦公廳舍所在地。當年阿里山砍伐的檜木，皆須經由森林鐵路運抵北門驛集散，再轉運至嘉義製材所加工，使嘉義迅速躍升為台灣重要的「木材都市」，全盛時期林森路一帶木材行林立，被稱為「木材街」。北門驛站體採用阿里山檜木建造，是台灣現存最具代表性的木造車站之一，1998年曾遭祝融損毀，經修復後於2001年重新啟用，現已列為嘉義市市定古蹟。如今北門驛周邊串連檜意森活村、嘉義製材所等林業遺產，共同構成完整的阿里山林業文化聚落，見證嘉義與阿里山檜木百年來密不可分的產業淵源。"],
    ["新竹市","十七公里海岸","竹塹海岸","十七公里海岸因自南寮漁港至南港賞鳥區全長約十七公里而得名，串連紅樹林、香山濕地與看海公園，是新竹市最具代表性的濱海遊憩廊帶。","s","十七公里海岸線的命名相當直白，因這條濱海觀光帶自北端的南寮漁港一路延伸至南端的南港賞鳥區，全長約十七公里而得名，是新竹市政府整合沿線景點所規劃的自行車道與觀光廊帶。這段海岸串連了南寮漁港、看海公園、港南運河、金城湖賞鳥區、海山漁港與香山濕地等多處景點，其中香山濕地是台灣西海岸重要的潮間帶生態區，面積廣達一千多公頃，孕育大量招潮蟹、彈塗魚與貝類，每年吸引黑面琵鷺、大杓鷸等候鳥過境棲息，已被劃為野生動物保護區；區內的「賞蟹步道」以心型設計橫跨潮間帶，是熱門的生態觀察與拍照景點。沿線另有紅樹林生態區，水筆仔等紅樹林植物構成綠色隧道景觀。十七公里海岸線因兼具漁業聚落、濕地生態與夕陽美景，如今已成為新竹市最受歡迎的戶外休閒去處，也是認識竹塹濱海環境變遷的重要場域。"],
    ["澎湖縣","雙心石滬","七美石滬","雙心石滬因兩座石滬堆砌成相連的心形而得名，是澎湖現存最完整、也最著名的石滬，屬先民利用潮汐落差捕魚的傳統智慧結晶。","s","雙心石滬位於澎湖縣七美鄉頂隙北面海崖下方，因兩座石滬以玄武岩與珊瑚礁石堆砌成相連的心形而得名，是澎湖群島現存約六百餘座石滬中造型最完整、也最負盛名的一座。石滬是先民利用潮汐落差捕魚的傳統智慧：漁民在潮間帶以石塊堆砌成弧形矮牆，漲潮時魚群隨海水游入滬內覓食，退潮後海水從石縫流出，魚群卻被困在滬中無法脫逃，漁民便可輕鬆入滬捕撈，是一種完全不耗費動力、也不傷害生態的永續漁法。雙心石滬約建造於日治大正元年（1912年），由七美居民顏恭等人合力興築，歷經百年海浪沖刷仍屹立不搖，居民每年仍會定期整修維護。由於心形造型浪漫，加上七美島本身「七美人塚」的貞節傳說，雙心石滬如今已成為澎湖最具代表性的觀光意象與愛情象徵，也是台灣傳統漁業文化最珍貴的活資產之一。"],
    ["連江縣","芹壁龜島","芹囝","芹壁龜島因外形神似一隻浮游海面的烏龜而得名，馬祖話稱烏龜為「芹囝」，芹壁村正因面對此島而得名，是馬祖最知名的聚落地標。","s","芹壁龜島是矗立於北竿芹壁村前方海面上的一座礁岩小島，因整體輪廓遠望神似一隻緩緩浮游於海面的烏龜，當地居民依此形似特徵為其命名。馬祖話（閩東語）中稱烏龜為「芹囝」，聚落因面對這座「芹囝」而得名，加上村落依山面海、建築沿著峭壁層層而築，遂發展出「芹壁」這個兼具龜島音譯與地形描述的地名。早年芹壁居民以捕撈蝦皮（一種小蝦）為主要生計，漁獲豐收帶來可觀財富，村民紛紛以花崗石興建堅固講究的閩東式石屋，形成今日所見層疊錯落、氣派非凡的聚落景觀；由於村民視龜島為守護聚落的象徵，許多老屋刻意面向龜島而建。隨著漁業沒落、人口外移，芹壁一度荒廢成為「空城」，直到近年透過老屋修復與民宿活化，重現風華，因景致優美獨特而享有「馬祖地中海」美譽，龜島也成為芹壁最具識別度的天然地標。"],
    ["基隆市","廟口","玉田町","基隆廟口因座落於清同治年間創建的奠濟宮（聖王公廟）廟埕前而得名，廟旁一帶清代原為稻田，劉銘傳曾讚「田美如玉」，日治時期因而設「玉田町」。","s","基隆廟口因夜市攤販群聚於「奠濟宮」廟埕前而得名。奠濟宮又稱聖王公廟，創建於清同治12年（1873年），主祀開漳聖王陳元光——這位唐朝將軍因開墾福建漳州有功而受後世奉祀，由於基隆市區居民大多原籍漳州，開漳聖王便成為當地移民重要的心靈寄託。同治年間，基隆居民與板橋林本源家族等士紳合力捐地捐款，將廟宇遷建至今仁愛區仁三路、石硬港溪（今旭川河）右岸，與左岸主祀媽祖的慶安宮隔河相望。奠濟宮周邊原是一片稻田，光緒10年（1884年）台灣巡撫劉銘傳巡視此地時，見稻浪翻飛而讚嘆「田美如玉」，日治時期遂在此設立「玉田町」，此名歷經多次行政區劃調整，至今仍保留於「玉田里」之中。廟宇落成後香火鼎盛，節慶活動吸引大批人潮，攤販隨之聚集，從流動攤販逐步演變為統一管理的固定攤位，發展成今日24小時營業、全台最負盛名的廟口夜市。"],
    ["基隆市","正濱漁港","基隆漁港","正濱漁港原名基隆漁港，是日治時期台灣第一座現代化漁港，因位於基隆港正面濱海地帶而得名正濱，近年因彩色屋而重生為熱門景點。","s","正濱漁港位於基隆市中正區和平島南岸，日治大正年間動工興建，是台灣第一座具備現代化設施的漁港，當時稱為「基隆漁港」，設有製冰廠、冷凍庫、漁業無線電台與水產館等完整設施，一度是台灣最重要的遠洋漁業基地，遠洋漁船由此出發前往東海、南洋作業，帶動基隆漁業的黃金年代。戰後更名「正濱漁港」，取其位居基隆港正面濱海地帶之意。隨著八斗子漁港於1970年代啟用、漁業重心轉移，正濱漁港逐漸沒落，直到2018年基隆市政府推動「正濱漁港懷舊碼頭色彩塗裝計畫」，將沿岸老舊樓房漆成繽紛的馬卡龍色系，形成「正濱彩色屋」景觀，倒映於水面的色彩與停泊漁船相映成趣，意外爆紅成為熱門打卡景點；加上對岸日治時期遺留的阿根納造船廠遺構（原為金瓜石礦產裝運碼頭，戰後租予美商製造遊艇），讓正濱漁港成為基隆兼具漁業歷史與工業遺產的獨特港灣。"],
    ["嘉義市","嘉義公園","山仔頂","嘉義公園座落於「山仔頂」丘陵地帶，因地勢高於市區而得名，日治明治43年（1910年）闢建，是台灣歷史最悠久的公園之一，園內史蹟遍布。","s","嘉義公園座落於嘉義市東側俗稱「山仔頂」的丘陵地帶，因地勢相對高於市區平原而得名，日治明治43年（1910年）正式闢建，是台灣現存歷史最悠久的都市公園之一。園區佔地遼闊、古木參天，最特別的是園內史蹟密度極高，走一圈彷彿經歷一趟台灣史：有紀念清廷平定林爽文事件的「福康安紀功碑」、嘉慶年間的十二門清代古砲、全台第一座地震紀念碑「丙午烈震紀念碑」（記錄1906年梅山大地震）、紀念國共內戰一江山戰役的紀念碑、畫家陳澄波的畫架雕塑，以及國寶級的阿里山森林鐵道21號蒸汽火車頭。日治時期在此興建的嘉義神社雖已不存，社務所與齋館仍完整保留，現作為「嘉義市史蹟資料館」（昭和十八）使用，周邊石燈籠、狛犬、手水舍等附屬建物亦散布其間。加上1998年落成的射日塔與嘉義市孔廟，讓嘉義公園成為集自然綠意、歷史記憶與文化展演於一身的城市核心場域。"],
    ["澎湖縣","天后宮","娘媽宮","澎湖天后宮是全台歷史最悠久的媽祖廟，最初稱「娘媽宮」，馬公市舊名「媽宮」即由此而來，廟內保存明萬曆年間「沈有容諭退紅毛番韋麻郎等」石碑。","s","澎湖天后宮是全台灣歷史最悠久的媽祖廟，創建年代可追溯至明朝初年，最初稱為「娘媽宮」，後簡稱「媽宮」，馬公市的舊地名「媽宮」正是源自這座廟宇，1920年才因台語諧音改稱「馬公」——換言之，是先有廟、才有城市之名。天后宮最珍貴的文物，是1919年整修時在祭壇下方發現的「沈有容諭退紅毛番韋麻郎等」石碑：明萬曆32年（1604年），荷蘭東印度公司司令韋麻郎率艦隊占據澎湖，明將沈有容親赴澎湖交涉，以外交手段兵不血刃迫使荷蘭人撤離，事後立碑紀念，這方石碑是台灣現存年代最早的石碑，也是台灣與西方勢力接觸最早的實物見證。廟宇建築採三進式格局，正殿、清風閣等木雕、彩繪工藝精湛，1983年公告為國定古蹟。如今澎湖天后宮不僅是澎湖居民的信仰中心，更是認識澎湖四百年開發史與台海國際角力的關鍵地標。"],
    ["金門縣","莒光樓","莒光樓","莒光樓建於1952年，取「毋忘在莒」之意命名，為表彰國軍戰役英勇事蹟而建，是金門最具代表性的地標建築，曾登上早期新台幣鈔券。","s","莒光樓興建於民國41年（1952年），由當時金門防衛司令部司令官胡璉將軍倡議興建，委由留學日本的金門籍建築師沈學海設計，樓名取自戰國時期田單憑藉莒城、即墨兩座孤城復國雪恥的「毋忘在莒」典故，與太武山上蔣中正親題的「毋忘在莒」勒石相互呼應，用以表彰古寧頭戰役中國軍官兵的英勇事蹟，並彰顯反攻復國的精神訴求。建築採中國傳統宮殿式風格，三層樓高、黃瓦紅柱、飛簷起翹，巍峨壯麗地矗立於金城鎮西南方高地之上，是金門最具辨識度的地標建築。莒光樓的形象曾多次登上早期新台幣鈔券與郵票，成為全台民眾對金門最鮮明的視覺印象。如今樓內闢為展覽館，一樓展示金門歷史文物與戰役史料、二樓介紹金門風土民情、三樓可登高遠眺金門西半島與廈門海域，是造訪金門必訪的經典景點。"],
    // --- 【擴充：北橫．深山部落 深度考據】 ---
    ["桃園市","巴陵","Balung 巨木","巴陵（泰雅語 Balung，意為巨木）位於北橫公路中點，依海拔高低分為上、中、下巴陵，是知名的水蜜桃產地。","s","巴陵地名源自泰雅族語「Balung」，意指高大巨木。相傳早年泰雅族人沿著大漢溪上游遷徙尋找適合定居的河階地，來到今日中巴陵一帶時，見到倒臥於地的巨大枯木，便以此為地名，記錄下這片山林曾有巨木參天的印象。日治時期文獻中則出現巴崚、巴稜、巴壟、馬崙等不同譯寫，皆是同一泰雅語詞的音譯變體。巴陵位於北部橫貫公路的中點，因地勢由高而低分為上巴陵、中巴陵與下巴陵三段，各自呈現不同風貌：上巴陵鄰近拉拉山，保留大片紅檜與扁柏巨木群，其中1973年由學者發現的神木群，讓巴陵聲名大噪；中巴陵一帶可通往嘎拉賀與爺亨溫泉；下巴陵則有橫跨溪谷的吊橋景觀，橋下即是三光溪匯入大漢溪之處，形成「三龜戲珠」的溪石奇景。如今巴陵也是北台灣重要的溫帶水果產地，每年四、五月水蜜桃花開滿山，暑假則是採收旺季，吸引許多遊客上山賞遊採果，讓這個曾經只是描述巨木倒地的泰雅語地名，成為北橫公路旅遊的重要地標。"],
    ["桃園市","爺亨","Zihing 陽光難照之地","爺亨（泰雅語 Zihing／Ehen）因地形東、南兩側環山，每日上午陽光難以照入，故以此為名，今以梯田與溫泉聞名。","s","爺亨部落位於桃園市復興區三光里，緊鄰玉峰溪與馬里闊灣溪，擁有復興區僅次於角板山的第二大河階台地。關於爺亨地名的由來，目前流傳最廣的說法是源自泰雅語「Zihing」（或寫作Ehen），意指陽光不易照到之地，因為部落東、南兩側都被高聳山頭圍繞，每天要等到接近中午，陽光才會照進谷地，加上森林茂密、雨霧頻繁，此地終年顯得陰涼潮溼。此外還流傳另外兩種說法：一說爺亨意指「溪邊的台地」，描述其地形特徵；另一說則認為當地氣候濕冷，早年溪邊容易滋生水蛭，因此以泰雅語稱水蛭的詞彙音轉而來。儘管擁有廣闊平坦的河階地形，但爺亨溪水礦物質含量偏高，早年不利飲用與大規模農耕，聚落規模因此一直不大，主要部落反而發展在對岸向陽的武道能敢一帶。如今爺亨善用山泉水引灌，開闢出全區最整齊的梯田景觀，曾有「後山穀倉」美稱；附近的巴陵橋溫泉在1997年重新出露後，也以「爺亨溫泉」之名對外開放，成為北橫公路上兼具梯田美景與泡湯體驗的知名景點。"],
    ["桃園市","合流","Hbun-sinqumi 溪流匯口","合流（泰雅語 Hbun-sinqumi）位於復興區羅浮里，因坐落於溪流匯合處而得名。","s","合流部落隸屬桃園市復興區羅浮里，泰雅語稱作「Hbun-sinqumi」，「Hbun」在泰雅語中意指溪流匯合的出口或匯流處，合流之名直接描述了當地位於數條山澗匯入大漢溪支流附近的地形特徵，是台灣山區聚落常見的一種依地形命名方式。根據部落耆老口述的遷徙史，泰雅族祖先自更古老的發源地沿河谷向北遷徙時，曾有家族一支循著三光溪河谷南下，行經此處的溪流匯口而在此暫留、發展成小型聚落，因而留下這個描述性地名。如今合流仍是羅浮里所轄的一個泰雅族部落，由於鄰近北橫公路與大漢溪河谷，加上仍保有相對完整的山林環境，近年發展出「部落獵人學校」等體驗活動，帶領遊客學習泰雅族傳統的狩獵、辨識植物與野外求生知識，讓旅人在認識地名由來的同時，也能親身感受泰雅族與這片溪流山林共存的生活智慧。"],
    ["桃園市","羅浮","雅邦 Kinyopan","羅浮舊稱雅邦（Kinyopan），原為拉號社所屬的一個小社，日治時期整併聚落後逐漸發展成今日的羅浮部落。","s","羅浮位於桃園市復興區羅浮里，地處大漢溪由北轉西流的河階地形上，海拔約250至300公尺。此地原屬「拉號社」（Rahaw，泰雅語意為樹木叢密）的傳統領域，拉號社在大漢溪左岸山腹間又分為雅邦（Keyopan）、卡納、哈卡灣、卡馬告、卡巴庫灣等五個小社，村落分布於今日溪口台與羅浮之間的緩坡地帶。日治時期，日本當局進入拉號社後設置警察駐在所，並在拉號社下方興建水圳、分配梯田，未能分得田地的族人則遷往雅邦另立聚落；其後日方為便於管理，又將駐在所遷移至雅邦，另在溪口設置新的駐在所。台灣光復後，行政區域重新調整，雅邦一帶便改稱為「羅浮」，沿用至今。如今羅浮里是北橫公路沿線重要的聚落據點，除了保留泰雅族部落文化與紅色的羅浮橋、藍色的復興橋等地標景觀，近年更因地下蘊藏豐富的碳酸氫鈉溫泉（俗稱美人湯）而開發出羅浮溫泉與泰雅故事公園，成為結合部落文化體驗與溫泉遊憩的觀光景點。"],
    ["桃園市","小烏來","Ulay 溫泉","小烏來（泰雅語 Ulay，意為溫泉）因位於宇內溪支流會合處，故以此為名，與新北市烏來同源。","s","小烏來位於桃園市復興區義盛里，「烏來」一詞源自泰雅族語「Ulay」，意指溫泉，同樣的語詞也是新北市知名溫泉鄉烏來地名的由來。流經義盛里的這條溪流，泰雅族人原本同樣稱為Ulay，但為了與新北的烏來作出區別，後來便依台語音近改寫為「宇內溪」。宇內溪南、北兩條支流會合之處，正是泰雅族部落Rahu（下宇內）所在的下游河谷地帶，這一帶因此被稱為「小烏來」，以別於規模較大、開發較早的烏來地區。此地因斷層地形發達，形成落差約50公尺、氣勢磅礡的小烏來瀑布，以及風動石、龍鳳瀑布等特殊景觀，加上近年興建的透明天空步道，讓遊客能夠站在瀑布上方70公尺高處俯瞰溪谷美景，成為北橫公路上人氣極高的景點之一。鄰近的義興部落與橫跨大漢溪的義興吊橋，也因電影《賽德克·巴萊》在此取景而聲名大噪，讓小烏來從一個描述溫泉溪流的泰雅語地名，逐漸發展為結合自然景觀、部落文化與影視觀光的複合式旅遊勝地。"],
    ["桃園市","義興","Gihin 陽光普照","義興（泰雅語 Gihin，意為陽光）相傳因先民見此地陽光普照，認為子孫必能興旺，故以此為名。","s","義興部落位於桃園市復興區義盛里，地處大漢溪中游右岸的河階與斜坡地，與對岸的高坡部落隔溪相望。義興的泰雅語舊稱為「Gihin」，也曾寫作宜亨，據部落口傳，原意與陽光有關：早年雪霧鬧社的族人遷移至此，見這片台地終日陽光普照，認為若在此定居，子孫後代必能興旺繁盛，因而以Gihin為名，後來的漢字譯寫便取其吉祥之意定為「義興」。另有說法認為Gihin可能與當地山坡地形、某種草名，或是水蛭有關，但確切語源已難以考證。義興因灌溉水圳「義興一圳」「義興二圳」的開闢而擁有較多水田，山坡地則盛產竹木與香菇；大漢溪上游興建攔砂壩後，也利用水位落差在此設置義興電廠。橫跨溪谷、長約200公尺的義興吊橋，原本只是引水灌溉用的水管橋，2013年整修後開放通行，因外型優美且曾作為電影《賽德克·巴萊》彩虹橋一幕的拍攝場景而聲名大噪，如今已成為小烏來風景區周邊最具人氣的免費景點之一。"],
];

貫紅淡山與獅球嶺之間的一條河流，因兩岸岩石堅硬，清代被稱為「石硬港」，後來才改稱南榮河，這也是仁愛區南榮路一帶「石硬港庄」地名的由來。日治時期實施町名改正後，此地改稱「石牌街」，但這個名稱確切的由來已難以考證。1945年台灣光復後，國民政府仿效「忠孝仁愛信義和平」等傳統政治教化用語為基隆各區重新命名，石牌街因此改稱「仁愛區」，", "沿用至今；同一時期，基隆的「田寮港」改為信義區、「八尺門」改為中正區、「白米甕」改為中山區，都是同一波命名政策下的產物。仁愛區境內的獅球嶺，因地形是台灣東北海岸通往台北盆地的天然屏障，1884年中法戰爭時，法軍雖一度攻占基隆，卻因獅球嶺阻擋而始終無法長驅直入台北，是基隆重要的歷史戰略要地。如今仁愛區以廟口夜市聞名全台，是遊客造訪基隆時必訪的美食重鎮。"], "quiz": {"q": "關於「仁愛區」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "仁愛區境內因南榮河兩岸岩石堅硬而得名「石硬港」，日治時期改稱石牌街，戰後才定名仁愛區。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！仁愛區境內因南榮河兩岸岩石堅硬而得名「石硬港」，日治時期改稱石牌街，戰後才定名仁愛區。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 4, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『中山區』這個地方，是怎麼來的嗎？中山區舊稱白米甕，境內的牛稠港則因清代漳州移民在此搭建飼養牛隻的牛稠（牛舍）而得名。", "中山區位於基隆港北岸，清雍正元年（1723年）曾有一批漳州移民由八里坌輾轉遷居至此，在「牛稠港」與虎子山一帶落腳，並建立崁仔頂街，是基隆市街開發的起點之一；「牛稠」指的正是飼養牛隻的牛舍，因當地曾設有牛舍而得名，這也是基隆早期漢人以「牛稠港」「石硬港」「蚵殼港」「田寮港」等方式，把「港」當作「河」的通稱，為河流沿岸聚落命名的例子之一。中山區另一處著名地標白米甕，", "是清末日治時期為防禦海上入侵而興建的白米甕砲台所在地，因砲台位置居高臨下、與東岸和平島互為犄角、共同扼守基隆港口而具有重要戰略地位，甚至因傳說十七世紀西班牙人曾在此築城，而有「荷蘭城砲台」的別稱。戰後基隆市重新劃分行政區，原本的「白米甕」一帶便依政治教化用語改稱「中山區」，沿用至今，境內的白米甕砲台如今已列為市定古蹟，成為認識基隆港防禦史的重要景點。"], "quiz": {"q": "關於「中山區」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["中山區舊稱白米甕，境內的牛稠港則因清代漳州移民在此搭建飼養牛隻的牛稠（牛舍）而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「中山區」市集而得名", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！中山區舊稱白米甕，境內的牛稠港則因清代漳州移民在此搭建飼養牛隻的牛稠（牛舍）而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [1, 2, 3, 4]}, {"id": "main-基隆市-2", "title": "基隆市．安樂區至信義區", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識基隆市的幾個地方：安樂區、信義區。」", "stops": [{"placeId": 5, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『安樂區』這個地方，是怎麼來的嗎？安樂區境內的蚵殼港，因早年河岸盛產牡蠣，居民燒蚵殼製作石灰塗料而得名。", "安樂區地處基隆西部，境內的蚵殼港河發源於大竿林與內木山溪匯流處，流貫曾仔寮山與佛祖嶺之間的谷地，自古是基隆前往金包里（今金山）的必經之地。「蚵殼港」之名，顧名思義與牡蠣（蚵仔）密切相關：早年沿岸盛產牡蠣，居民採收後將大量蚵殼堆積在岸邊，甚至有人專門收集蚵殼燒製成石灰，作為建築塗牆的材料，因而使這條河與周邊街庄得名蚵殼港。另有一說，蚵殼港河上一座通往大竿林的橋梁因塗上防腐黑漆，", "或因鄰近運煤路線遭煤炭染黑，而使當地留下與顏色相關的俗稱，但正式地名仍以蚵殼港為主。戰後基隆市政府重新命名各行政區時，這一帶因取吉祥用語「安樂」而定名為安樂區，是基隆少數並非直接沿用日治舊街名、而是另取吉祥字面意義命名的行政區之一，與仁愛、信義、中正、中山等區共同構成基隆特殊的政治教化式地名系統。"], "quiz": {"q": "關於「安樂區」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「安樂區」市集而得名", "安樂區境內的蚵殼港，因早年河岸盛產牡蠣，居民燒蚵殼製作石灰塗料而得名。"], "correct": 3, "rightFb": "沒錯！安樂區境內的蚵殼港，因早年河岸盛產牡蠣，居民燒蚵殼製作石灰塗料而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 6, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『信義區』這個地方，是怎麼來的嗎？信義區舊稱田寮港，因早期先民在田野間搭建草寮而得名，境內田寮河更是台灣第一條人工運河。", "信義區清代稱為「田寮港庄」，地名由來與早期先民在此開墾田地、於田野間搭建臨時草寮居住有關，加上基隆一帶慣以「港」稱「河」，因而得名田寮港。發源於槓子寮山谷的田寮港，是注入基隆港的四條河川之一，日治時期因應鋸木業與煤礦運輸需求，將河道整治為人工運河，成為台灣史上第一條人工運河，早年更是上游山區煤礦運往港口的重要水道，兩岸堤岸經整治後平直規整，直到今日在地耆老仍習慣稱這條河為「田寮港」，", "而非後來改稱的田寮河。1931年日治時期實施町名改正，田寮港庄一帶劃分為壽町、幸町、東町等多個町；台灣光復後，國民政府依「忠孝仁愛信義和平」的命名原則，將此地重新命名為「信義區」，沿用至今。如今信義區是基隆市議會與台灣基隆地方法院所在地，境內學校林立，是基隆重要的文教行政區，而流貫市區的田寮河沿岸也整治為親水景觀廊道，成為市民休憩散步的去處。"], "quiz": {"q": "關於「信義區」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「信義區」市集而得名", "信義區舊稱田寮港，因早期先民在田野間搭建草寮而得名，境內田寮河更是台灣第一條人工運河。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！信義區舊稱田寮港，因早期先民在田野間搭建草寮而得名，境內田寮河更是台灣第一條人工運河。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [5, 6]}], "sideQuests": [{"id": "side-基隆市-1", "title": "基隆市．八堵至和平島", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識基隆市的幾個地方：八堵、百福、八斗子、和平島。」", "stops": [{"placeId": 7, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『八堵』這個地方，是怎麼來的嗎？八堵地名由來與七堵相同，或為清代第八道防禦土牆，或為基隆河河曲上第八座小山，至今仍無定論。", "八堵與五堵、六堵、七堵並列基隆河沿岸依序排列的四個地名，長期以來都以同一套邏輯來解釋其由來：傳統說法認為，清代漢人拓墾時沿河修築防禦土牆抵禦原住民，「一丈為板、五板為堵」，依修築先後編號命名，八堵即為第八道防禦據點；但這個說法近年遭到不少地名學者質疑，原因是這幾處地名之間找不出明確的關聯事件或人物，而且若真是防禦工事，依台灣慣例通常會命名為「隘」而非「堵」。另一派學者則從地形觀察出發，", "指出五堵至八堵都位於基隆河連續彎曲的河曲地形上，且鄰近皆有小山，因此認為「堵」其實是閩南移民用來比擬河曲旁小山的說法，如同「一堵牆」擋住河道，數字則可能只是早年標記地形或聚落開發順序留下的痕跡。八堵在清代已因位居基隆河谷交通要衝而發展成聚落，日治與戰後時期更因鐵路交會、礦業興盛而一度是基隆與宜蘭之間重要的轉運與維修站，如今仍保 me": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『和平島』這個地方，是怎麼來的嗎？和平島舊稱社寮島，因漢人依島上平埔族聚落稱之為「社」而得名，1626年西班牙人在此建聖薩爾瓦多城，是台灣面向世界的第一站。", "和平島舊稱「社寮島」，16世紀漢人航海文獻中最早稱此島為「大雞籠嶼」，此地原是平埔族巴賽族雞籠社的傳統聚落，清代漢人因島上住有原住民「社」（部落）而稱之「社寮」，日治時期行政區劃更直接定名為「社寮町」，「社寮島」之名因而沿用長久。1626年，西班牙人占領北台灣後，選定此島興建「聖薩爾瓦多城」作為統治據點，與同時期荷蘭人在台南興建的熱蘭遮城遙相對峙，故有「南大員、北社寮」之說，", "是台灣最早直接面向世界局勢、與西方勢力接觸的第一站；近年考古挖掘更在城堡遺址附近，發現當年西班牙人興建教堂的遺跡與歐洲人骸骨。1947年，「社寮島」正式改稱「和平島」，關於改名原因眾說紛紜，或因祈求島嶼自古以來戰亂頻仍能歸於和平，或與戰後基隆市街依「忠孝仁愛信義和平」命名的脈絡有關；如今和平島公園的海蝕地形與歷史遺跡，讓這座島嶼持續訴說台灣最早與世界接軌的故事。"], "quiz": {"q": "關於「和平島」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "和平島舊稱社寮島，因漢人依島上平埔族聚落稱之為「社」而得名，1626年西班牙人在此建聖薩爾瓦多城，是台灣面向世界的第一站。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 1, "rightFb": "沒錯！和平島舊稱社寮島，因漢人依島上平埔族聚落稱之為「社」而得名，1626年西班牙人在此建聖薩爾瓦多城，是台灣面向世界的第一站。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [7, 8, 536, 537]}, {"id": "side-基隆市-2", "title": "基隆市．仙洞巖至正濱漁港", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識基隆市的幾個地方：仙洞巖、二沙灣砲台、廟口、正濱漁港。」", "stops": [{"placeId": 538, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『仙洞巖』這個地方，是怎麼來的嗎？仙洞巖因相傳曾有仙人在此修道登天而得名，是基隆港西北側一處天然海蝕洞，早年洞穴直接臨海，置身洞中可聞海濤拍岸之聲，故有「仙洞聽潮」之稱。", "仙洞巖是基隆港西北側山巖上的一處天然海蝕洞穴，經過數萬年海水沖刷侵蝕而成，相傳曾有仙人在此洞中修行、最終得道升天，因而得名「仙洞」，「巖」字則呼應台灣民間佛道共存的「巖仔信仰」傳統。清同治11年（1872年），此地開始供奉釋迦牟尼佛與觀世音菩薩，另稱代明宮；日治明治39年（1906年），日本人一度將佛祖遷出，改以七福神中的弁財天神取代，", "稱為最勝寺，戰後才又恢復原本的佛像供奉，但弁財天神的祭祀習俗仍保留至今，形成一處佛、道、日本神道教信仰交融並存的特殊空間。在基隆港尚未興築、海岸線仍直抵山巖之時，洞穴內能聽見海浪拍打岩壁的陣陣潮聲，因而享有「仙洞聽潮」的美稱，是清代基隆八景之一，如今雖因港區開發、海岸線外移而不復聽聞，仙洞巖仍是基隆市歷史最悠久的宗教勝景之一。"], "quiz": {"q": "關於「仙洞巖」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["仙洞巖因相傳曾有仙人在此修道登天而得名，是基隆港西北側一處天然海蝕洞，早年洞穴直接臨海，置身洞中可聞海濤拍岸之聲，故有「仙洞聽潮」之稱。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因清代此地盛產某種作物，官府設「仙洞巖」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 0, "rightFb": "沒錯！仙洞巖因相傳曾有仙人在此修道登天而得名，是基隆港西北側一處天然海蝕洞，早年洞穴直接臨海，置身洞中可聞海濤拍岸之聲，故有「仙洞聽潮」之稱。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 539, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『二沙灣砲台』這個地方，是怎麼來的嗎？二沙灣砲台因位於基隆二沙灣一帶的山路上而得名，1840年鴉片戰爭時始建，1886年台灣巡撫劉銘傳重修後，於營區城門題「海門天險」四字，因而又稱海門天險。", "二沙灣砲台興建於清道光20年（1840年）鴉片戰爭期間，由台灣兵備道姚瑩下令在基隆二沙灣海岸邊構築，因地處二沙灣一帶山路，故稱「二沙灣砲台」。同年英國運輸船「吶爾不達號」砲擊雞籠岸防，淡水同知曹謹回擊致其觸礁擱淺，是清廷台灣守軍與英軍的第一次交戰紀錄。清法戰爭（西仔反）後，首任台灣巡撫劉銘傳鑑於基隆port防務的重要性，向英商購入新式後膛砲，聘請德國工程師重新設計督建，將砲台移築至更高的山丘之上，", "光緒12年（1886年）完工，並在營區正門題上「海門天險」四字匾額，這座砲台此後便多了這個充滿氣勢的別稱。「海門天險」屬於「抱山式砲台」，將砲台區設於臨海制高點、營盤區則置於背海低處，使敵艦砲火難以直接命中營區，展現精妙的地形戰術布局，歷經鴉片戰爭、清法戰爭、乙未戰爭三場戰役洗禮，如今仍保留古城門、砲座、彈藥庫等遺跡，是基隆港防禦史上最具代表性的國定古蹟之一。"], "quiz": {"q": "關於「二沙灣砲台」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "二沙灣砲台因位於基隆二沙灣一帶的山路上而得名，1840年鴉片戰爭時始建，1886年台灣巡撫劉銘傳重修後，於營區城門題「海門天險」四字，因而又稱海門天險。"], "correct": 3, "rightFb": "沒錯！二沙灣砲台因位於基隆二沙灣一帶的山路上而得名，1840年鴉片戰爭時始建，1886年台灣巡撫劉銘傳重修後，於營區城門題「海門天險」四字，因而又稱海門天險。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 563, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『廟口』這個地方，是怎麼來的嗎？基隆廟口因座落於清同治年間創建的奠濟宮（聖王公廟）廟埕前而得名，廟旁一帶清代原為稻田，劉銘傳曾讚「田美如玉」，日治時期因而設「玉田町」。", "基隆廟口因夜市攤販群聚於「奠濟宮」廟埕前而得名。奠濟宮又稱聖王公廟，創建於清同治12年（1873年），主祀開漳聖王陳元光——這位唐朝將軍因開墾福建漳州有功而受後世奉祀，由於基隆市區居民大多原籍漳州，開漳聖王便成為當地移民重要的心靈寄託。同治年間，基隆居民與板橋林本源家族等士紳合力捐地捐款，將廟宇遷建至今仁愛區仁三路、石硬港溪（今旭川河）右岸，與左岸主祀媽祖的慶安宮隔河相望。奠濟宮周邊原是一片稻田，", "光緒10年（1884年）台灣巡撫劉銘傳巡視此地時，見稻浪翻飛而讚嘆「田美如玉」，日治時期遂在此設立「玉田町」，此名歷經多次行政區劃調整，至今仍保留於「玉田里」之中。廟宇落成後香火鼎盛，節慶活動吸引大批人潮，攤販隨之聚集，從流動攤販逐步演變為統一管理的固定攤位，發展成今日24小時營業、全台最負盛名的廟口夜市。"], "quiz": {"q": "關於「廟口」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "基隆廟口因座落於清同治年間創建的奠濟宮（聖王公廟）廟埕前而得名，廟旁一帶清代原為稻田，劉銘傳曾讚「田美如玉」，日治時期因而設「玉田町」。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！基隆廟口因座落於清同治年間創建的奠濟宮（聖王公廟）廟埕前而得名，廟旁一帶清代原為稻田，劉銘傳曾讚「田美如玉」，日治時期因而設「玉田町」。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 564, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『正濱漁港』這個地方，是怎麼來的嗎？正濱漁港原名基隆漁港，是日治時期台灣第一座現代化漁港，因位於基隆港正面濱海地帶而得名正濱，近年因彩色屋而重生為熱門景點。", "正濱漁港位於基隆市中正區和平島南岸，日治大正年間動工興建，是台灣第一座具備現代化設施的漁港，當時稱為「基隆漁港」，設有製冰廠、冷凍庫、漁業無線電台與水產館等完整設施，一度是台灣最重要的遠洋漁業基地，遠洋漁船由此出發前往東海、南洋作業，帶動基隆漁業的黃金年代。戰後更名「正濱漁港」，取其位居基隆港正面濱海地帶之意。隨著八斗子漁港於1970年代啟用、漁業重心轉移，", "正濱漁港逐漸沒落，直到2018年基隆市政府推動「正濱漁港懷舊碼頭色彩塗裝計畫」，將沿岸老舊樓房漆成繽紛的馬卡龍色系，形成「正濱彩色屋」景觀，倒映於水面的色彩與停泊漁船相映成趣，意外爆紅成為熱門打卡景點；加上對岸日治時期遺留的阿根納造船廠遺構（原為金瓜石礦產裝運碼頭，戰後租予美商製造遊艇），讓正濱漁港成為基隆兼具漁業歷史與工業遺產的獨特港灣。"], "quiz": {"q": "關於「正濱漁港」（基隆市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「正濱漁港」市集而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "正濱漁港原名基隆漁港，是日治時期台灣第一座現代化漁港，因位於基隆港正面濱海地帶而得名正濱，近年因彩色屋而重生為熱門景點。"], "correct": 3, "rightFb": "沒錯！正濱漁港原名基隆漁港，是日治時期台灣第一座現代化漁港，因位於基隆港正面濱海地帶而得名正濱，近年因彩色屋而重生為熱門景點。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [538, 539, 563, 564]}]}, "台北市": {"mainChains": [{"id": "main-台北市-1", "title": "台北市．中正區至松山區", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識台北市的幾個地方：中正區、大同區、中山區、松山區。」", "stops": [{"placeId": 9, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『中正區』這個地方，是怎麼來的嗎？中正區舊稱「城內」，即清代台北府城城牆內的區域，因而得名。", "台北市中正區的舊稱「城內」，指的正是清光緒年間興建的台北府城城牆所圍起的範圍。這座台北城於光緒5年(1879年)規劃、光緒8年(1882年)動工，光緒10年(1884年)竣工，城牆周長約1506丈，設有承恩門(北門)、麗正門(南門)、重熙門(小南門)、景福門(東門)、寶成門(西門)五座城門，是當時全台規模數一數二的城池。台北府與淡水縣、乃至日後的台灣巡撫衙門、布政使司衙門等重要官署，都設置在這座城牆之內，", "使「城內」與艋舺、大稻埕並列清末台北三大聚落，卻是三者中行政地位最高、卻是最晚才發展成商業街市的區域。日治時期，總督府陸續拆除城牆、拓寬為三線道路，並在城內興建總督府（今總統府）、台北州廳等官署建築，奠定今日中正區作為台北行政中樞的基礎；戰後，這一帶依國父孫中山諡號「中正」重新命名為中正區，但「城內」一詞至今仍在部分老台北人口中沿用，用以指稱這片曾經城牆環繞的核心區域。"], "quiz": {"q": "關於「中正區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「中正區」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "中正區舊稱「城內」，即清代台北府城城牆內的區域，因而得名。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！中正區舊稱「城內」，即清代台北府城城牆內的區域，因而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 10, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『大同區』這個地方，是怎麼來的嗎？大稻埕原為平埔族「奇武卒社」居地，因漢人在此留設曬穀廣場（稻埕）而得名。", "大稻埕清初原是「大加蚋堡」的一部分，最初為平埔族奇武卒社的居住地。漢人遷入開墾後，習慣在水田之間留出一塊地勢較高的空地，供各庄輪流曝曬稻穀，農閒時也兼作臨時市集，閩南移民稱這種曬穀場地為「埕」，因面積廣大，此地便被稱為「大稻埕」。1853年艋舺發生「頂下郊拚」分類械鬥，落敗的同安人被迫遷離艋舺，轉而在大稻埕另闢碼頭與街市，加上1860年淡水開港通商後，大稻埕因臨近淡水河、便於出口茶葉，", "迅速取代艋舺成為北台灣最重要的商業與貿易中心，享有「小上海」之稱。日治時期，大稻埕持續是台籍商人與知識分子活躍的舞台，蔣渭水等人也在此推動台灣文化協會等社會運動。如今大稻埕範圍涵蓋今日的迪化街、貴德街一帶，保存大量清末至日治時期的洋樓與街屋立面，是台北少數仍保有完整歷史街廓紋理的區域，也是年貨大街與南北貨、中藥材批發的重鎮。"], "quiz": {"q": "關於「大同區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「大同區」市集而得名", "大稻埕原為平埔族「奇武卒社」居地，因漢人在此留設曬穀廣場（稻埕）而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！大稻埕原為平埔族「奇武卒社」居地，因漢人在此留設曬穀廣場（稻埕）而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 11, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『中山區』這個地方，是怎麼來的嗎？中山區舊稱牛埔，因早期為放牛吃草的荒地而得名，日治時期發展為高級住宅區大正町。", "中山區在清代原是一片供居民放牧牛隻的荒地與草埔，因而被稱為「牛埔」，範圍大致涵蓋今日中山北路一帶。日治時期，隨著台北市區改正計畫的推行，這片原本荒僻的牛埔逐漸被規劃為棋盤式街廓的新興市街，並命名為「大正町」，以紀念當時在位的日本大正天皇；由於鄰近台灣總督官邸（今台北賓館）與圓山一帶的公園綠地，大正町迅速發展成日治時期台灣人與日本人上流階層聚居的高級住宅區，", "街道兩側廣植行道樹，環境清幽。戰後，國民政府重新劃分台北市行政區，將牛埔、大正町一帶與宮前町等區域合併，並以孫中山先生之名命名為「中山區」，沿用至今。如今中山區仍延續日治時期奠定的都市紋理，中山北路林蔭大道、老洋房與精品店林立，是台北市著名的時尚與文創街區之一。"], "quiz": {"q": "關於「中山區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "中山區舊稱牛埔，因早期為放牛吃草的荒地而得名，日治時期發展為高級住宅區大正町。", "因清代此地盛產某種作物，官府設「中山區」市集而得名"], "correct": 2, "rightFb": "沒錯！中山區舊稱牛埔，因早期為放牛吃草的荒地而得名，日治時期發展為高級住宅區大正町。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 12, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『松山區』這個地方，是怎麼來的嗎？松山舊稱「錫口」，源自巴賽族語「河流彎曲處」，日治時期因發音不雅且景色似日本松山而改名。", "松山區舊稱「錫口」，這個地名源自居住於基隆河畔的巴賽族「Malysyakkaw」社，意指「河流彎曲處」，漢人陸續以「麻里折口」「貓里錫口」等音譯記錄這個地名，清嘉慶年間才簡化定名為「錫口」。當地因基隆河航運之便，在松山慈祐宮附近發展出繁榮的「錫口街」，曾有「小蘇州」之稱。1920年，日本殖民政府推行地方行政改制，決定將「錫口」改名，官方說法是當地風景與日本四國愛媛縣的松山市相似，", "因而改稱「松山」；但民間也流傳另一種說法，指「錫口」的台語發音與日語中的不雅詞彙過於相近，才促使當局決定另取新名。無論何者為主要原因，松山之名自此沿用至今，戰後國民政府設置松山區作為行政區名稱，錫口舊街則因鄰近饒河街觀光夜市，至今仍保有松山慈祐宮等百年歷史地標，成為認識這段地名變遷史的最佳見證。"], "quiz": {"q": "關於「松山區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["松山舊稱「錫口」，源自巴賽族語「河流彎曲處」，日治時期因發音不雅且景色似日本松山而改名。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！松山舊稱「錫口」，源自巴賽族語「河流彎曲處」，日治時期因發音不雅且景色似日本松山而改名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [9, 10, 11, 12]}, {"id": "main-台北市-2", "title": "台北市．大安區至內湖區", "kind": "main", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識台北市的幾個地方：大安區、信義區、士林區、內湖區。」", "stops": [{"placeId": 13, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『大安區』這個地方，是怎麼來的嗎？大安區舊稱「大灣」，因早期陂塘與水圳彎曲環繞而得名，後因閩南語諧音取「大安」吉名。", "大安區在清代原是一片水源豐沛之地，境內瑠公圳等灌溉水圳流經此處時多處彎曲盤繞，加上早年開闢的陂塘（蓄水池）分布其間，因而被稱為「大灣」，意指這片地勢低窪、水流迂迴的區域。「大灣」在閩南語中的發音與「大安」相近，加上「安」字本身帶有平安吉祥的寓意，因此後來逐漸轉寫、雅化為「大安」，並沿用至今。清代到日治初期，大安一帶仍以農業為主，", "種植水稻與蔬果，直到日治後期及戰後，隨著台北市區向東擴張，加上國立台灣大學、國立台灣師範大學等高等學府陸續設立於此，大安區才逐漸從農業地帶轉型為文教與高級住宅區。如今大安區是台北市人口最稠密、地價也最高的行政區之一，境內的大安森林公園更被視為台北市的「都市之肺」，與清代因水圳彎曲而得名的「大灣」形成有趣的今昔對照。"], "quiz": {"q": "關於「大安區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因鄭成功部隊行經此地時隨口命名而流傳下來", "大安區舊稱「大灣」，因早期陂塘與水圳彎曲環繞而得名，後因閩南語諧音取「大安」吉名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！大安區舊稱「大灣」，因早期陂塘與水圳彎曲環繞而得名，後因閩南語諧音取「大安」吉名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 15, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『信義區』這個地方，是怎麼來的嗎？信義區舊稱興雅庄，是清代已存在的聚落名，寓意興盛雅致，1990年才從松山、大安兩區劃出獨立設區。", "信義區境內的「興雅」是清代便已存在的舊聚落名稱「興雅庄」，與六張犁、三張犁等同屬大加蚋堡下的墾拓聚落，地名本身帶有興盛雅致的吉祥寓意，但確切的命名緣由已難詳細考證。信義區是台北市十二個行政區中最年輕的一區，直到1990年3月台北市進行行政區重劃，才將原松山區鐵路以南地區，以及大安區和平東路以北的部分區域合併，並依「忠孝仁愛信義和平」的命名慣例定名為「信義區」。信義區境內原本多為農田與眷村聚落，", "1970年代後配合台北市政府「信義計畫區」的都市開發計畫，逐步興建市政府、世界貿易中心、台北101等地標建築，從昔日的興雅庄農業聚落，蛻變為今日台北最重要的金融商辦與百貨購物核心地帶，也是跨年煙火固定舉辦的地點，與清代默默無聞的興雅之名形成強烈對比。"], "quiz": {"q": "關於「信義區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "信義區舊稱興雅庄，是清代已存在的聚落名，寓意興盛雅致，1990年才從松山、大安兩區劃出獨立設區。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！信義區舊稱興雅庄，是清代已存在的聚落名，寓意興盛雅致，1990年才從松山、大安兩區劃出獨立設區。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 16, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『士林區』這個地方，是怎麼來的嗎？士林舊稱八芝蘭，源自平埔族語「溫泉」，清末因文風鼎盛，取「士子如林」改稱士林。", "士林區舊稱「八芝蘭」，是平埔族凱達格蘭語「Pattsiran」的音譯，意指溫泉，這一帶原為凱達格蘭族麻少翁社的居住地。漢人入墾後，因當地林木茂盛又盛產蘭花，將地名寫作「八芝蓮林」或「八芝連林」，後簡化為「八芝蘭」，清代行政區劃上則稱「芝蘭堡」。相傳嘉慶年間，淡水廳同知胡應魁巡視此地時，見山明水秀，讚嘆「宛如芝蘭之室，", "堪稱名勝之區」，因而奠定「芝蘭」雅稱的由來。清末，當地士紳潘永清等人在芝山岩設立義塾，加上私塾、社學林立，文風鼎盛、科舉人才輩出，時有「三步一秀，五步一舉」的美譽，於是地方仕紳取「士子如林」之意，將地名改為「士林」，沿用至今。如今士林區以士林夜市、故宮博物院及陽明山國家公園聞名，是台北市面積最大的行政區。"], "quiz": {"q": "關於「士林區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["士林舊稱八芝蘭，源自平埔族語「溫泉」，清末因文風鼎盛，取「士子如林」改稱士林。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！士林舊稱八芝蘭，源自平埔族語「溫泉」，清末因文風鼎盛，取「士子如林」改稱士林。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 18, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『內湖區』這個地方，是怎麼來的嗎？內湖因地勢四周略高、中央低窪，早期積水如湖而得名。", "內湖區的地名由來相對單純直白，源自其地形特徵：這一帶四周有丘陵環繞，中央則是相對低窪的盆狀地形，早期排水不易，容易積水成湖，因而被稱為「內湖」，意指盆地內部的湖泊窪地。清代漢人入墾此地後，陸續開闢埤塘與水圳排除積水、發展農業，才逐漸將原本濕地般的內湖轉變為可耕種的良田。日治時期，內湖與大直、南港一帶同屬台北近郊的農業地帶，", "以茶葉、蔬果種植為主；戰後隨著台北市區向東北擴張，加上1980年代以後內湖科技園區的開發，內湖逐漸從農業地帶轉型為台北市重要的科技產業重鎮，成為眾多科技公司總部的所在地。如今內湖區境內仍保有大湖公園、內湖運動公園等以水域景觀為特色的公園綠地，某種程度延續了這片土地與「湖」之間的地理淵源。"], "quiz": {"q": "關於「內湖區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "內湖因地勢四周略高、中央低窪，早期積水如湖而得名。"], "correct": 3, "rightFb": "沒錯！內湖因地勢四周略高、中央低窪，早期積水如湖而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [13, 15, 16, 18]}, {"id": "main-台北市-3", "title": "台北市．南港區至關渡", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識台北市的幾個地方：南港區、文山區、社子、關渡。」", "stops": [{"placeId": 19, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『南港區』這個地方，是怎麼來的嗎？南港因相對於汐止（北港），位於基隆河南岸而得名。", "南港區的地名由來，與同樣位於基隆河沿岸、隔河相對的汐止（舊稱水返腳，昔日也稱北港）有密切關係：南港因位於基隆河南岸，相對於北岸的汐止，因而得名「南港」，是台灣許多以方位詞命名的河港聚落之典型例子。清代，南港因基隆河航運之便，成為茶葉、煤礦等物產運輸的重要口岸，加上文山、深坑一帶所產的包種茶多經此地轉運出口，", "一度發展出繁榮的港埠街市。日治時期及戰後，隨著鐵路、公路系統逐漸取代河運功能，加上南港一帶蘊藏豐富的煤礦資源，南港轉型為工業重鎮，中央研究院也在此設立院區。近年來，南港軟體園區、南港車站與台北流行音樂中心等建設陸續完工，使南港從昔日的河港與工業區，逐步蛻變為台北市東側重要的交通樞紐與新興商辦中心。"], "quiz": {"q": "關於「南港區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「南港區」市集而得名", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "南港因相對於汐止（北港），位於基隆河南岸而得名。"], "correct": 3, "rightFb": "沒錯！南港因相對於汐止（北港），位於基隆河南岸而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 20, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『文山區』這個地方，是怎麼來的嗎？文山區舊稱拳山，因山形似拳頭而得名，日治時期因「拳」字不雅，取「文山秀氣」改稱文山。", "文山區舊稱「拳山」，這個地名源自區內一座山丘的形狀，遠望山頭渾圓突起，宛如一隻緊握的拳頭，因而得名。清代這一帶原屬「拳山堡」的行政區劃範圍，涵蓋今日的景美、木柵一帶。日治時期，日本殖民政府在推行地方行政改制時，認為「拳山」二字帶有暴力、粗獷的意涵，不夠文雅，於是取附近山巒「文山秀氣」之意，", "將地名改為「文山」，這也是台北市文山區名稱的由來。1990年台北市行政區重劃，將原本各自獨立的景美區與木柵區合併，並沿用「文山」之名設立文山區，成為台北市面積第二大的行政區。如今文山區境內仍保有貓空、指南宮等丘陵地景與宗教信仰重鎮，是台北市山林景觀保存最完整的行政區之一。"], "quiz": {"q": "關於「文山區」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "文山區舊稱拳山，因山形似拳頭而得名，日治時期因「拳」字不雅，取「文山秀氣」改稱文山。", "因清代此地盛產某種作物，官府設「文山區」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！文山區舊稱拳山，因山形似拳頭而得名，日治時期因「拳」字不雅，取「文山秀氣」改稱文山。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 21, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『社子』這個地方，是怎麼來的嗎？社子舊稱社仔，因是昔日凱達格蘭族麻少翁社的聚落所在地而得名。", "社子位於基隆河與淡水河交會口附近，這片沙洲地帶清代原是平埔族凱達格蘭族「麻少翁社」的傳統聚落範圍，漢人習慣以「社」字指稱原住民部落，「仔」則是閩南語表示小型聚落的後綴，兩字合稱「社仔」，意指小型的番社聚落，後來雅化為「社子」。由於地處兩河交會的低窪沖積地帶，社子長期以來地勢低平、容易淹水，加上台北市都市計畫長期將此地劃為限制發展區，", "因此保留了相對完整的農地與傳統聚落景觀，與周邊快速都市化的士林、大同等區域形成鮮明對比，這片區域也因此被稱為「社子島」。近年來，台北市政府陸續推動社子島的區段徵收與開發計畫，試圖在防洪治水與都市發展之間取得平衡，讓這個保留平埔族記憶的古老地名，未來可能迎來新的地貌變化。"], "quiz": {"q": "關於「社子」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["社子舊稱社仔，因是昔日凱達格蘭族麻少翁社的聚落所在地而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「社子」市集而得名"], "correct": 0, "rightFb": "沒錯！社子舊稱社仔，因是昔日凱達格蘭族麻少翁社的聚落所在地而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 22, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『關渡』這個地方，是怎麼來的嗎？關渡源自平埔族語Kantou，早期漢字寫作干豆、甘答等多種音譯，因位居淡水河與基隆河交會口而成要津。", "關渡地名源自原住民語「Kantou」，另有一說是西班牙人所稱的「Casidor」，由於是原住民語言的音譯，清代文獻中出現過干豆、甘答、干荳、肩脰、墘竇、關杜等十餘種不同漢字寫法，直到乾隆25年（1760年）的《臺灣府志》才開始使用「關渡」二字，日治時期一度改稱「江頭」，戰後才恢復關渡舊名並沿用至今。關渡地處淡水河與基隆河交會之處，兩岸分別是大屯山與觀音山的餘脈，", "山勢相夾形成天然峽口，自古便是進出台北盆地的重要水運關卡與渡口，因而得名。康熙51年（1712年），通事賴科在此募建天妃廟（即今日的關渡宮），主祀媽祖，是台灣北部歷史最悠久的媽祖廟之一，民間更流傳「南有北港媽，北有干豆媽」的諺語，可見關渡宮在北台灣民間信仰中的重要地位。如今關渡因濕地生態豐富，已成為台北市重要的候鳥棲息地與自然公園。"], "quiz": {"q": "關於「關渡」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["關渡源自平埔族語Kantou，早期漢字寫作干豆、甘答等多種音譯，因位居淡水河與基隆河交會口而成要津。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！關渡源自平埔族語Kantou，早期漢字寫作干豆、甘答等多種音譯，因位居淡水河與基隆河交會口而成要津。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [19, 20, 21, 22]}, {"id": "main-台北市-4", "title": "台北市．天母至圓山", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識台北市的幾個地方：天母、石牌、大直、圓山。」", "stops": [{"placeId": 23, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『天母』這個地方，是怎麼來的嗎？天母原是日治時期「天母教」神社周邊的小地名，並非坊間流傳因美軍問路答「聽無」而來。", "天母舊稱「三角埔」，清代與日治時期官方地名皆以三角埔稱之，「天母」原本只是境內一處極小的地名。1933年，日本人中治稔郎將神道信仰與台灣民間的媽祖信仰結合，在士林三角埔東側山坡興建「天母神社」，供奉天照大神與天上聖母（媽祖），並創立「天母教」，宣稱兩者其實是同一位神明的不同化身；由於神社周邊逐漸聚集商店與溫泉旅館，這一帶便被稱為「天母」，", "地名因而流傳開來。坊間長期流傳另一種說法，指天母之名源自戰後美軍問路，當地人以台語回答「聽無」（聽不懂），因諧音而得名，但這個說法其實與史實不符，正確的由來仍是日治時期的天母教與天母神社。1945年戰後，神社遭到拆除，原本供奉的媽祖與其他神像先移至附近廟宇安置，1979年信眾另建三玉宮加以奉祀，成為今日天母地區重要的信仰中心。"], "quiz": {"q": "關於「天母」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["天母原是日治時期「天母教」神社周邊的小地名，並非坊間流傳因美軍問路答「聽無」而來。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 0, "rightFb": "沒錯！天母原是日治時期「天母教」神社周邊的小地名，並非坊間流傳因美軍問路答「聽無」而來。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 24, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『石牌』這個地方，是怎麼來的嗎？石牌因清乾隆年間官府在此豎立漢番界碑，用以劃分漢人與原住民土地界線而得名。", "石牌地名源自一塊真實存在的石碑：清雍正、乾隆年間，大量漢人移民進入北投一帶開墾，與原本居住於此的凱達格蘭族原住民時常因土地問題發生糾紛。乾隆十至十三年間（1745年至1748年），淡水廳同知曾曰瑛為釐清雙方界線、避免衝突，下令在漢人與原住民土地交界處豎立界碑，碑文寫著「奉憲分府曾批斷東勢田南勢園歸番管業界」，明確劃定雙方可耕作的範圍，", "這塊界碑就此成為當地的地標，因而得名「石牌」，閩南語稱「石牌仔」。這塊石碑歷經多次遷移，一度移至石牌派出所院內保存，1999年 伯講古。這一段路，我帶你認識台北市的幾個地方：古亭、公館。」", "stops": [{"placeId": 27, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『古亭』這個地方，是怎麼來的嗎？古亭地名由來眾說紛紜，包括防禦原住民出草的「鼓亭」、儲糧用的「穀亭」等多種說法，至今仍有爭議。", "古亭地名的由來長期眾說紛紜，最廣為流傳的說法是：清代漢人為防範新店一帶原住民出草，在今日古亭一帶設置哨站，內置大鼓作為警戒示警之用，稱為「鼓亭」，後因閩南語「鼓」與「古」同音，日治時期為求書寫方便而改寫為「古亭」。另一種說法則認為，當地早期設有許多用來儲存稻穀的「穀亭畚」，是家族財富的象徵，因而得名「穀亭」，後同樣因諧音簡化為古亭。然而近年也有學者指出，", "這兩種說法其實都有時代與地理上的矛盾：文獻中「古亭村」最早出現於十八世紀中葉，早於鼓亭傳說所指涉的十九世紀末原漢衝突事件；且古亭距離傳說中的衝突地點新店相當遙遠，以擊鼓示警在邏輯上也有疑問。無論確切由來為何，古亭作為連接台北市中心與文山、新店的交通要衝，清代已因水圳流經而形成聚落，如今則是南昌路家具街、牯嶺街舊書街等特色街區的所在地。"], "quiz": {"q": "關於「古亭」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "古亭地名由來眾說紛紜，包括防禦原住民出草的「鼓亭」、儲糧用的「穀亭」等多種說法，至今仍有爭議。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！古亭地名由來眾說紛紜，包括防禦原住民出草的「鼓亭」、儲糧用的「穀亭」等多種說法，至今仍有爭議。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 28, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『公館』這個地方，是怎麼來的嗎？公館因清代業主在此設立辦事收租的「公館」（管理處）而得名。", "公館地名由來與清代台灣常見的土地拓墾制度有關：早年來台開墾的業戶（地主）為了就近管理佃農耕作、收取田租，通常會在轄下墾地興建一座辦事處，供管理人員或業主本人居住辦公，這樣的建築在民間慣稱「公館」，久而久之便成為周邊聚落的地名，這種命名方式在台灣各地相當常見，不僅台北市有公館，桃園、苗栗等地也都有以公館為名的聚落。台北市的公館位於新店溪畔，", "清代因鄰近瑠公圳等重要水利設施，加上是台北盆地與文山、新店等山區聯繫的交通要道，逐漸發展成繁榮的市街。日治時期及戰後，隨著國立台灣大學在此設立校區，公館一帶因大量學生與教職員進駐，發展成商店、書店、小吃林立的學生商圈，也是台北捷運公館站的所在地，如今是台北市重要的年輕人消費與生活機能核心區域之一。"], "quiz": {"q": "關於「公館」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "公館因清代業主在此設立辦事收租的「公館」（管理處）而得名。"], "correct": 3, "rightFb": "沒錯！公館因清代業主在此設立辦事收租的「公館」（管理處）而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [27, 28]}], "sideQuests": [{"id": "side-台北市-1", "title": "台北市．景美至唭哩岸", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識台北市的幾個地方：景美、木柵、六張犁、唭哩岸。」", "stops": [{"placeId": 29, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『景美』這個地方，是怎麼來的嗎？景美舊稱梘尾，因位於引水灌溉的木製水槽（梘）尾端而得名，後改寫為近音的景美。", "景美舊稱「梘尾」，這個地名與清代的水利工程密切相關：早期為了將新店溪的水引入台北盆地灌溉農田，先民修築了「霧裡薛圳」等水圳，遇到低窪地形時，會架設木製或竹製的大型水槽讓水流通過，這種水槽在閩南語中稱為「梘」（或寫作「笕」）。景美一帶剛好位於這條水圳渠道尾端，因而被稱為「梘尾」，日治時期文獻中也寫作「笕尾」。由於「梘尾」與台語的「景尾」發音相近，", "加上「梘尾」字面不夠典雅，日治後期逐漸改寫為「景尾」，戰後又進一步雅化為更美觀吉祥的「景美」，並沿用至今。景美因地處台北盆地通往新店、深坑的交通要衝，加上有景美溪流經，自清代以來便是重要的物產集散地，如今則以景美夜市、景美國小旁的仙跡岩登山步道聞名。"], "quiz": {"q": "關於「景美」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "景美舊稱梘尾，因位於引水灌溉的木製水槽（梘）尾端而得名，後改寫為近音的景美。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！景美舊稱梘尾，因位於引水灌溉的木製水槽（梘）尾端而得名，後改寫為近音的景美。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 30, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『木柵』這個地方，是怎麼來的嗎？木柵因早期漢人為防禦原住民出草，在此興建木造柵欄防禦工事而得名。", "木柵地名由來與清代漢人拓墾時期的族群衝突背景密切相關：這一帶鄰近山區，是泰雅族等原住民傳統活動範圍與漢人拓墾前線的交界地帶，雙方時常因土地開墾問題發生衝突。為了防範原住民出草侵擾，當地漢人便在聚落周圍以木材搭建高聳的柵欄，作為防禦工事與警戒之用，這樣的木造防禦設施在閩南語中稱為「木柵」，久而久之便成為這片聚落的地名。清代木柵一帶隸屬「拳山堡」，", "是台北盆地南側通往深坑、石碇等地的重要山區門戶，也因鄰近丘陵地形而發展出台灣少見的鐵觀音茶產區，貓空一帶至今仍以優質茶葉聞名。1990年台北市行政區重劃，木柵與景美合併為文山區，但「木柵」之名仍廣泛使用於木柵動物園、貓空纜車等知名地標，延續這段因防禦原住民而興建柵欄的歷史記憶。"], "quiz": {"q": "關於「木柵」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["木柵因早期漢人為防禦原住民出草，在此興建木造柵欄防禦工事而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「木柵」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 0, "rightFb": "沒錯！木柵因早期漢人為防禦原住民出草，在此興建木造柵欄防禦工事而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 31, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『六張犁』這個地方，是怎麼來的嗎？六張犁地名源自清代開墾面積單位，以每張犁五甲計算，此地開墾面積共計六張犁（三十甲）。", "六張犁地名源自台灣清代拓墾時期常見的土地計算方式：早期漢人拓墾以「犁」作為計算開墾面積的單位，一張犁約可耕作五甲土地，六張犁便代表這片墾地的總面積約為三十甲，是依據實際開墾規模直接命名的典型範例。這種以犁數命名地方的方式在台北盆地相當常見，新店一帶便有七張、十二張、十四張、二十張等類似地名，都是同一套計算邏輯下的產物。清代六張犁隸屬大加蚋堡下的「六張犁庄」，", "與大安庄、三張犁庄等聚落相鄰，主要以農業墾殖為主。1990年台北市行政區重劃，六張犁東半部劃入新設立的信義區，西半部則留在大安區，因此六張犁地區現今橫跨大安、信義兩區交界。如今六張犁一帶因鄰近國防醫學院舊址與多處靈骨塔、墓園，加上臨近的和平東路商圈，兼具住宅機能與歷史記憶。"], "quiz": {"q": "關於「六張犁」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「六張犁」市集而得名", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "六張犁地名源自清代開墾面積單位，以每張犁五甲計算，此地開墾面積共計六張犁（三十甲）。"], "correct": 3, "rightFb": "沒錯！六張犁地名源自清代開墾面積單位，以每張犁五甲計算，此地開墾面積共計六張犁（三十甲）。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 32, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『唭哩岸』這個地方，是怎麼來的嗎？唭哩岸源自凱達格蘭族語，意為「海灣」，是漢人在台北盆地最早開墾的發源地。", "唭哩岸地名源自平埔族凱達格蘭語「Ki-Irigan」，一般認為意指「海灣」，因這一帶原是舊淡水河向北突出、形似海灣的彎曲地帶；另有一說認為意指「湖岸」，反映台北盆地在地質史上一度是鹹水湖或內海的地形記憶，2003年國立陽明大學鑽探地質時，曾挖出含鹹水貝殼的唭哩岸石，為這個說法提供了有力佐證。根據《淡水廳志》記載「淡水開墾，自奇里岸（唭哩岸）始」，這裡是漢人進入台北盆地開墾的第一站，", "早在清初便已形成「唭哩岸街」（即今立農街），是淡水河北側最早發展的市街，商業全盛時期甚至有「九萬廿七千」的俗諺，形容當地擁有巨額資產的富戶眾多。除了農業墾殖，唭哩岸山一帶盛產石英砂岩，質地耐酸耐高溫又便於運輸，被稱為「唭哩岸石」，曾是台北地區建築、燒磚窯業的重要建材來源。1997年捷運淡水線通車設站後，這個一度被遺忘的古老地名才重新廣為人知。"], "quiz": {"q": "關於「唭哩岸」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「唭哩岸」市集而得名", "唭哩岸源自凱達格蘭族語，意為「海灣」，是漢人在台北盆地最早開墾的發源地。"], "correct": 3, "rightFb": "沒錯！唭哩岸源自凱達格蘭族語，意為「海灣」，是漢人在台北盆地最早開墾的發源地。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [29, 30, 31, 32]}, {"id": "side-台北市-2", "title": "台北市．大龍峒至加蚋仔", "kind": "side", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識台北市的幾個地方：大龍峒、劍潭、西門町、加蚋仔。」", "stops": [{"placeId": 33, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『大龍峒』這個地方，是怎麼來的嗎？大龍峒原稱大浪泵，源自平埔族社名，後因同安人「興隆同安」之意及文風鼎盛而雅化為大龍峒。", "大龍峒是早於大稻埕、僅次於艋舺開發的台北盆地舊聚落，原為平埔族凱達格蘭「巴琅泵社」（又寫作大浪泵社）的居住地，「巴琅泵」是荷蘭文獻中「Pourompon」的音譯。1709年陳賴章墾號取得開墾許可後，漢人才大量進駐這片區域。乾隆年間，因艋舺同安人在地方械鬥中處於劣勢，開始遷移至大浪泵另闢天地，並集資興建俗稱「四十四坎」的商業街（即今哈密街），", "以及主祀保生大帝、俗稱大浪泵宮的保安宮，取「保佑同安人」之意。此後，同安人取「興隆同安」的期許，將地名雅化為「大隆同」，又因當地文風昌盛、科舉人才輩出，加上圓山仔一帶舊稱「大龍山」，最終演變為兼具吉祥與文雅意涵的「大龍峒」，成為今日台北市大同區地名的由來之一。境內的保安宮與台北孔廟至今仍是大龍峒重要的信仰與文化地標。"], "quiz": {"q": "關於「大龍峒」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["大龍峒原稱大浪泵，源自平埔族社名，後因同安人「興隆同安」之意及文風鼎盛而雅化為大龍峒。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！大龍峒原稱大浪泵，源自平埔族社名，後因同安人「興隆同安」之意及文風鼎盛而雅化為大龍峒。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 34, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『劍潭』這個地方，是怎麼來的嗎？劍潭之名有荷蘭軍人插劍於樹、及鄭成功拋劍伏魚精兩種傳說，實際上以荷蘭插劍說的文獻年代最早。", "劍潭地名的由來流傳著兩種截然不同的傳說。年代較早、文獻記載較完整的說法出自清雍正十年（1732年）成書的《臺灣志略》，記載此地潭岸有一棵高聳的茄苳巨樹，相傳荷蘭軍人曾將佩劍插入樹幹，樹皮逐漸增生包覆，將寶劍完全隱沒其中，因而得名劍潭；《淡水廳志》更記載每逢黑夜風雨，潭面便會浮現紅光，相傳是潭底荷蘭古劍所發出的靈氣，「劍潭夜光」曾被列為淡水八景之一。另一則流傳更廣、卻是日治時期才出現的版本，", "則將主角換成了民族英雄鄭成功：相傳鄭成功率軍行經此地時，遭遇興風作浪的魚精或蛟龍，鄭成功拔劍擲入潭中降服妖怪，寶劍因此沉入潭底，成為劍潭之名的由來。學者考證後認為，鄭成功插劍或擲劍的傳說並無確切史料佐證，很可能是後人將原本的荷蘭人傳說與鄭成功的歷史形象混合附會而成，但這則故事至今仍是劍潭一帶最廣為人知的地名傳說。"], "quiz": {"q": "關於「劍潭」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "劍潭之名有荷蘭軍人插劍於樹、及鄭成功拋劍伏魚精兩種傳說，實際上以荷蘭插劍說的文獻年代最早。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！劍潭之名有荷蘭軍人插劍於樹、及鄭成功拋劍伏魚精兩種傳說，實際上以荷蘭插劍說的文獻年代最早。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 35, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『西門町』這個地方，是怎麼來的嗎？西門町因位於清代台北府城西門（寶成門）外而得名，日治時期規劃為仿東京淺草的娛樂商圈。", "西門町地名的由來，直接源自清代台北府城的城門：台北城共設有五座城門，其中西側的「寶成門」由艋舺富商集資興建，是五座城門中最為華麗氣派的一座，因地處連結艋舺商圈與城內的交通要衝而格外重要。1904年，日本殖民政府以推動市區改正與鐵路修築為由，拆除了寶成門及其城牆，但「西門」作為地理位置的稱呼卻保留了下來。1908年，總督府開始整頓西門外原本荒蕪、多為墳地的沙地，並仿效日本東京淺草區的規劃模式，", "在此興建劇場、市場與商店街，發展成新興的休閒娛樂特區；1922年，這片區域正式以行政區劃名稱「西門町」定名。由於當時鄰近的八角堂（今西門紅樓）、榮座等戲院、劇場林立，加上戰後中華商場的興建，西門町逐漸成為台北市最重要的商業與娛樂中心之一，直到1980年代東區商圈崛起後才漸趨沒落，1990年代末改造為行人徒步區後才又重現生機，如今是台北年輕族群與國際觀光客熱門的朝聖去處。"], "quiz": {"q": "關於「西門町」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["西門町因位於清代台北府城西門（寶成門）外而得名，日治時期規劃為仿東京淺草的娛樂商圈。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 0, "rightFb": "沒錯！西門町因位於清代台北府城西門（寶成門）外而得名，日治時期規劃為仿東京淺草的娛樂商圈。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 36, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『加蚋仔』這個地方，是怎麼來的嗎？加蚋仔地名源自平埔族語，意為沼澤地，清代因土質肥沃盛產花卉、蔬菜而聞名。", "加蚋仔是台北市萬華區雙園一帶的舊地名，源自平埔族語「Gala」，意指沼澤或濕地，反映這片區域早期地勢低窪、排水不良的地形特徵，清康熙年間文獻中稱為「加臘仔庄」。由於當地土質鬆軟肥沃，加上鄰近新店溪沖積帶來的沙質壤土，排水良好又保水力佳，清代以來便是重要的農業生產地帶，居民多種植甘蔗、蔬菜與各類瓜果，供應艋舺、大龍峒等鄰近聚落所需；其中又以薰茶用的茉莉花、黃梔花最為知名，", "可賣給艋舺、大稻埕的茶行加工薰製包種茶。日治後期因戰爭導致茉莉花滯銷，加上地下水質甘美，居民轉而改種麻竹筍與孵製豆芽菜，因而有「加蚋仔三寶」（茉莉、麻竹筍、豆芽菜）的稱號流傳民間。加蚋仔內部又依聚落分為堀仔頭、八張犁、後庄仔、下庄仔、港仔尾等角頭，至今仍延續每年農曆三月十二日迎尪公遶境的「年例」信仰傳統，是加蚋仔重要的地方文化資產。"], "quiz": {"q": "關於「加蚋仔」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["加蚋仔地名源自平埔族語，意為沼澤地，清代因土質肥沃盛產花卉、蔬菜而聞名。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！加蚋仔地名源自平埔族語，意為沼澤地，清代因土質肥沃盛產花卉、蔬菜而聞名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [33, 34, 35, 36]}, {"id": "side-台北市-3", "title": "台北市．華山至內湖庄", "kind": "side", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識台北市的幾個地方：華山、松山菸廠、三板橋、內湖庄。」", "stops": [{"placeId": 37, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『華山』這個地方，是怎麼來的嗎？華山原名樺山町，日治時期為紀念首任台灣總督樺山資紀而命名，戰後依諧音改為華山。", "華山地區在日治時期稱為「樺山町」，是1922年台北市實施町名改正時所劃定的行政區之一，其命名是為了紀念首任台灣總督樺山資紀——他是1895年日本依馬關條約接收台灣後，第一位赴台就任的最高統治者。樺山町當時範圍大致涵蓋今日忠孝東路、林森南路、金山南路一帶，區內設有台北鐵路貨運樞紐「樺山貨物取扱所」，是日治時期重要的物流轉運據點。戰後，國民政府接管台灣，考量到「樺山」二字帶有濃厚的日本殖民統治色彩，", "便依其中文發音相近之處，將地名改為較無政治意涵的「華山」，這也是今日華山車站、華山藝文特區等地名的由來。原本的貨運倉庫與酒廠建築，一度荒廢，直到2000年代由文化部門接手活化，轉型為華山1914文化創意產業園區，成為台北市重要的藝文展演與文創聚落，也讓這個源自殖民地總督之名的地名，逐漸轉化出全新的文化意涵。"], "quiz": {"q": "關於「華山」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "華山原名樺山町，日治時期為紀念首任台灣總督樺山資紀而命名，戰後依諧音改為華山。"], "correct": 3, "rightFb": "沒錯！華山原名樺山町，日治時期為紀念首任台灣總督樺山資紀而命名，戰後依諧音改為華山。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 38, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『松山菸廠』這個地方，是怎麼來的嗎？松山菸廠1937年由台灣總督府專賣局興建，是台灣第一座現代化捲菸工廠，因位於松山區而得名。", "松山菸廠全稱「臺灣總督府專賣局松山菸草工場」，於1937年動工興建，1939年正式完工投產，是台灣日治時期第一座具規模的現代化捲菸工廠，因廠址位於當時的松山庄（今松山區、信義區交界一帶）而得名。菸廠採用「工業村」的規劃概念，除了生產線廠房，也一併考量員工福祉，興建了員工宿舍、澡堂、育嬰室與大片庭園綠地，建築風格屬於強調簡潔線條的「日本初現代主義」，在當時的工業廠房建築中相當前衛先進。戰後，", "這座工廠由台灣省菸酒公賣局接手經營，持續生產長壽、新樂園等知名香菸品牌，直到1998年因產能整併而停止生產。松山菸廠舊址在停產後保留了大片綠地，2001年獲台北市政府指定為市定古蹟，2010年正式轉型為「松山文創園區」對外開放，成為台北市東區重要的藝文展演與文創聚落；廠區內另有台北文創大樓與台北大巨蛋等新建設施，與保存完整的日治廠房古蹟比鄰而立，形成新舊並存的獨特城市地景。"], "quiz": {"q": "關於「松山菸廠」（台北市）這個地名，下列何者才是真正的由來？", "opts": ["松山菸廠1937年由台灣總督府專賣局興建，是台灣第一座現代化捲菸工廠，因位於
