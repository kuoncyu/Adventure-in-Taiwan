: "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『板橋區』這個地方，是怎麼來的嗎？板橋舊稱枋橋，因清代先民在公館溝上架設木板橋供人通行而得名，日治時期雅化為板橋。", "板橋區舊稱「枋橋」，這個地名的由來與一座實際存在過的木橋有關：清代板橋一帶原是平埔族擺接社的活動範圍，漢人入墾後，商旅貨物在「湳仔港」上岸，須經由「公館溝」才能運往聚落，先民便在溝渠上搭建一座木板橋，供人貨通行，這座橋所在的位置便被稱為「枋橋頭」，閩南語「枋」即木板之意。板橋開發史上最關鍵的推手是林本源家族：這個原籍漳州的家族在19世紀中葉遷居枋橋，", "並沿著公館溝東南岸興建「枋橋城」，設置城門與防禦工事，使枋橋逐漸發展成擺接十三庄的商業與信仰中心，林家花園（林本源園邸）至今仍是板橋最重要的古蹟地標。1920年，日本殖民政府推行地方行政改制，將「枋橋」正式改為日式讀音相近的「板橋」，戰後沿用至今，但台語仍習慣讀作「枋橋」（pang-kiô），保留著這段木板橋的歷史記憶。"], "quiz": {"q": "關於「板橋區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "板橋舊稱枋橋，因清代先民在公館溝上架設木板橋供人通行而得名，日治時期雅化為板橋。"], "correct": 3, "rightFb": "沒錯！板橋舊稱枋橋，因清代先民在公館溝上架設木板橋供人通行而得名，日治時期雅化為板橋。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 40, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『三重區』這個地方，是怎麼來的嗎？三重舊稱三重埔，是清代依淡水河沿岸開墾先後次序命名的第三段埔地。", "三重地名的由來，反映了清代淡水河沿岸拓墾聚落的一種常見命名方式：先民沿河開發土地時，依墾殖先後順序為各段埔地（未開墾的河濱平地）編號命名，最早開發的稱為「頭前埔」，其後依序為「二重埔」「三重埔」，三重正是這套次序中的第三段，意指位於二重埔外側、更晚開發的埔地。隨著淡水河逐漸淤積，原本可供船隻停靠的頭前埔碼頭機能喪失，", "泥沙沖積形成的新生沙洲不斷向外擴展，登陸地點也隨之向外遞移，三重埔便是在這樣的過程中逐漸成形的聚落。日治時期，三重埔簡化為「三重」，因與台北大稻埕、大龍峒等艋舺對岸聚落隔淡水河相望，加上鐵路、公路等交通建設帶動，戰後迅速發展為台北都會區重要的衛星市鎮，如今是新北市人口密度最高的行政區之一。"], "quiz": {"q": "關於「三重區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["三重舊稱三重埔，是清代依淡水河沿岸開墾先後次序命名的第三段埔地。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！三重舊稱三重埔，是清代依淡水河沿岸開墾先後次序命名的第三段埔地。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 41, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『中和區』這個地方，是怎麼來的嗎？中和舊稱漳和，因漳州人移民在此定居、祈求「漳州人和睦」之意而得名，後諧音轉為中和。", "中和地名的由來有兩種主要說法。第一種說法指出，中和一帶清代原稱「漳和」（或寫作彰和，1764年文獻已見記載），是由漳州籍移民所建立的聚落，取「漳州人和睦相處」之意命名；由於「漳和」與「中和」的台語發音相近，後來便逐漸轉寫為「中和」。另一種說法則認為，「中和」這個地名是從境內「中坑」與「漳和」兩個聚落名稱中，", "各取一字組合而成。中和地區清代隸屬擺接堡，與板橋、土城同屬林本源家族勢力範圍，因鄰近新店溪與景美溪，農業與樟腦業曾是重要產業。1958年，因人口增加，中和鄉劃出頂溪、上溪、網溪等地成立永和鎮，兩地雖已分治，但地名典故中「和睦」的期許，至今仍隱含在中和、永和這兩個相鄰行政區的名稱之中。"], "quiz": {"q": "關於「中和區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["中和舊稱漳和，因漳州人移民在此定居、祈求「漳州人和睦」之意而得名，後諧音轉為中和。", "因清代此地盛產某種作物，官府設「中和區」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！中和舊稱漳和，因漳州人移民在此定居、祈求「漳州人和睦」之意而得名，後諧音轉為中和。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 42, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『永和區』這個地方，是怎麼來的嗎？永和舊稱溪洲，1957年由地方耆宿楊仲佐取名，期許各籍移民和睦共處、追求「永久的和平」。", "永和地區清代原屬中和鄉的一部分，因位於新店溪沖積形成的沙洲地帶，舊稱「溪洲」。1947年，隨著人口增加，溪洲一帶劃出頂溪、上溪、網溪三村，1958年正式分鄉設鎮，脫離中和鄉獨立。關於「永和」這個新地名的由來，據地方文獻記載，是由地方耆宿楊仲佐先生所提議：他認為無論是本地原有的泉州籍居民、鄰近中和的漳州籍居民，或是戰後遷入的各省籍新移民，", "都應體認和睦團結的重要性，才能共同建設繁榮的家園，因此取「永久的和平」之意，將這座新設立的行政區命名為「永和」。這個充滿理想色彩的地名，恰好與同樣帶有「和」字、卻源自漳州移民期許的鄰居「中和」相互呼應，成為新北市地名中少見、直接寄託族群和諧願景的命名案例。1979年，永和鎮升格為縣轄市。"], "quiz": {"q": "關於「永和區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["永和舊稱溪洲，1957年由地方耆宿楊仲佐取名，期許各籍移民和睦共處、追求「永久的和平」。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！永和舊稱溪洲，1957年由地方耆宿楊仲佐取名，期許各籍移民和睦共處、追求「永久的和平」。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [39, 40, 41, 42]}, {"id": "main-新北市-2", "title": "新北市．新莊區至鶯歌區", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識新北市的幾個地方：新莊區、新店區、樹林區、鶯歌區。」", "stops": [{"placeId": 43, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『新莊區』這個地方，是怎麼來的嗎？新莊因清代雍正年間漢人在淡水河畔建立新興聚落而得名，是清代台北盆地最早開發的市街之一。", "新莊地名的由來相對直白：清康熙末年已有漢人進入此地開墾，雍正年間，隨著人口增加、聚落逐漸成形，因這是一處新興建立的莊社，便直接以「新莊」為名，另有一說認為是由原本的「新的武勞灣莊」簡化而來，武勞灣則是當地平埔族社名的音譯。新莊憑藉淡水河的航運之利，成為清代台北盆地開發最早、也最繁榮的市街之一，一度是北台灣的行政與商業中心，", "直到淡水河逐漸淤積、加上艋舺興起分食商機後，新莊的地位才逐漸被取代。境內的新莊慈祐宮、新莊武聖廟與新莊文昌祠並列台閩地區三級古蹟，見證了新莊作為早期市街的信仰與文教發展。戰後新莊迅速工業化，人口大量移入，1980年由鎮升格為市，2010年隨台北縣升格為新北市而改制為區，是新北市人口最多的行政區之一。"], "quiz": {"q": "關於「新莊區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "新莊因清代雍正年間漢人在淡水河畔建立新興聚落而得名，是清代台北盆地最早開發的市街之一。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！新莊因清代雍正年間漢人在淡水河畔建立新興聚落而得名，是清代台北盆地最早開發的市街之一。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 44, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『新店區』這個地方，是怎麼來的嗎？新店因清代嘉慶、道光年間移民在碧潭東岸新建店舖成街，有別於既有的舊店街而得名。", "新店地名的由來流傳著幾種說法，但核心都圍繞著「新建的店舖街」這個概念。一種說法是嘉慶、道光年間，墾首陳合發、李詳記等十餘人合資，招募泉州佃戶向泰雅族傳統領域拓墾，在碧潭東岸一帶興建店舖形成街市，因有別於大坪林原有的「店仔街」，故稱「新店」；另一說則指道光年間泉州人林章存在碧潭東岸開墾的店舖街曾遭山洪沖毀，", "重建後為區分新舊而稱新店；還有一說認為，光緒年間官府在上游屈尺設置撫墾機構，漢人因而在此新設店舖與原住民交易，故稱新店。新店溪由源自烏來的南勢溪與源自坪林的北勢溪匯流而成，是淡水河系最重要的支流之一。日治時期興建的新店線鐵路，帶動沿線木材、茶葉、煤礦的運輸，也讓碧潭一帶發展成台北近郊著名的觀光勝地。"], "quiz": {"q": "關於「新店區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "新店因清代嘉慶、道光年間移民在碧潭東岸新建店舖成街，有別於既有的舊店街而得名。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！新店因清代嘉慶、道光年間移民在碧潭東岸新建店舖成街，有別於既有的舊店街而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 45, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『樹林區』這個地方，是怎麼來的嗎？樹林因清乾隆年間先民在水圳堤岸廣植林木以固岸護堤，樹木繁茂而得名。", "樹林地名由來與清代的水利建設密切相關：乾隆31年（1766年），業戶張沛世、張必榮開鑿「永安陂」（俗稱張厝圳）灌溉農田時，為了鞏固水圳東側的護岸，在堤岸上栽種了大量樹木，這些樹木日漸繁茂成林，因而使這片區域得名「樹林」。隨著往來的商販與居民增多，人們逐漸砍伐林木闢地開店，形成小型市街，但圳岸上游一帶的樹林依然茂密，直到1910年因水圳改修工程才被砍伐殆盡。樹林另有一個更為人熟知的舊稱「風櫃店」，", "據考證是因當地曾有店鋪使用「風櫃」（一種手拉式鼓風設備）從事打鐵業，鍛造農具鐵器而得名；日治時期文獻也記載此地確實曾有打鐵店經營的紀錄。1920年，樹林區一度與鶯歌石區、三角湧區部分合併為「鶯歌庄」，直到後來才又獨立設區，如今是新北市重要的工商業重鎮之一。"], "quiz": {"q": "關於「樹林區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "樹林因清乾隆年間先民在水圳堤岸廣植林木以固岸護堤，樹木繁茂而得名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！樹林因清乾隆年間先民在水圳堤岸廣植林木以固岸護堤，樹木繁茂而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 46, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『鶯歌區』這個地方，是怎麼來的嗎？鶯歌因山上一塊巨石形似展翅的鷹鳥而得名，相傳鄭成功曾發箭降伏鶯歌與鳶山兩隻興風作浪的妖鳥。", "鶯歌地名源自區內一塊高約十公尺的巨大砂岩「鶯歌石」，這塊岩石因風化侵蝕露出山坡，外形宛如一隻收攏羽翼、引頸而立的猛禽，清代文獻最早記為「鷹哥石」，後因「鷹」與「鶯」發音相近，加上「哥」字被認為是無意義的語助詞，逐漸演變為今日的「鶯歌」。民間流傳一則生動的傳說：相傳鄭成功率軍北上時，鶯歌與三峽的鳶鳥相互鬥法，競吐瘴氣毒害往來行人，鄭成功聞訊後在樹林太平橋搭弓射箭，", "將兩隻妖鳥射死，化為今日的鶯歌石與鳶山。不過學者林衡道指出，鄭成功一生活動範圍僅止於台南一帶，這則傳說很可能是福建、廣東一帶巨石成精故事的在地化版本。饒富趣味的是，當地原住民則流傳另一種說法：相傳其祖先曾躲藏在鶯歌石中狙擊漢人，卻不敵砲火而被迫離開家園，反而被漢人誤傳為鳥妖作怪。如今鶯歌以陶瓷產業聞名全台，有「台灣景德鎮」之稱。"], "quiz": {"q": "關於「鶯歌區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "鶯歌因山上一塊巨石形似展翅的鷹鳥而得名，相傳鄭成功曾發箭降伏鶯歌與鳶山兩隻興風作浪的妖鳥。"], "correct": 3, "rightFb": "沒錯！鶯歌因山上一塊巨石形似展翅的鷹鳥而得名，相傳鄭成功曾發箭降伏鶯歌與鳶山兩隻興風作浪的妖鳥。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [43, 44, 45, 46]}, {"id": "main-新北市-3", "title": "新北市．三峽區至瑞芳區", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識新北市的幾個地方：三峽區、淡水區、汐止區、瑞芳區。」", "stops": [{"placeId": 47, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『三峽區』這個地方，是怎麼來的嗎？三峽舊稱三角湧，因大漢溪、三峽河、橫溪三條溪流在此匯合形成三角形沖積平原而得名。", "三峽舊稱「三角湧」，這個地名直接描述了當地的地理特徵：大漢溪（舊稱大嵙崁溪）、三峽河（舊稱三角湧溪）與橫溪三條河流在此交會，沖積出一片三角形的平原地帶，加上溪水在匯流處激盪翻騰、水勢洶湧，閩南語稱水流翻騰為「湧」，因而得名三角湧。清初，泉州人陳瑜自鶯歌招募佃丁進墾此地，其後泉州安溪人董日旭也率族人前來拓墾，逐漸在這片三角沖積平原上形成聚落。三峽因群山環繞、氣候濕潤，", "清代以來便是重要的樟腦與藍靛（大菁染料）產地，加上1860年淡水開港通商後，樟腦貿易更加興盛，帶動了三峽老街的繁榮發展，1767年興建的三峽祖師廟也成為地方信仰核心。1920年，日本殖民政府將「三角湧」簡化雅化為「三峽」，取其溪流匯聚如峽谷之意，沿用至今。"], "quiz": {"q": "關於「三峽區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "三峽舊稱三角湧，因大漢溪、三峽河、橫溪三條溪流在此匯合形成三角形沖積平原而得名。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！三峽舊稱三角湧，因大漢溪、三峽河、橫溪三條溪流在此匯合形成三角形沖積平原而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 48, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『淡水區』這個地方，是怎麼來的嗎？淡水舊稱滬尾，「滬」指石滬（利用潮汐捕魚的石堤），滬尾即石滬設置範圍的末端。", "淡水舊稱「滬尾」，關於這個地名的由來主要有兩種說法：一說「滬」是指早期漁民在海濱或河口以石塊堆砌而成、利用潮水漲退捕魚的「石滬」，滬尾便是這類石滬分布範圍最末端之處；另一說則認為閩南語中「滬」與「雨」發音相近，意指此地多雨，但經過這裡雨勢便會停歇，故稱滬尾。淡水地處淡水河出海口，17世紀西班牙人、荷蘭人相繼在此興建聖多明哥城、紅毛城等要塞，", "是台灣最早與西方接觸的據點之一。1860年天津條約簽訂後，淡水開港通商，一躍成為19世紀台灣最重要的國際貿易港口，茶葉、樟腦等物產由此出口，馬偕博士也在此展開傳教與醫療、教育事業，留下滬尾偕醫館、淡江中學等歷史建築。1920年，日本殖民政府依淡水河之名，將滬尾正式改稱「淡水」，沿用至今，如今仍是台灣著名的歷史文化與夕陽觀光勝地。"], "quiz": {"q": "關於「淡水區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["淡水舊稱滬尾，「滬」指石滬（利用潮汐捕魚的石堤），滬尾即石滬設置範圍的末端。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 0, "rightFb": "沒錯！淡水舊稱滬尾，「滬」指石滬（利用潮汐捕魚的石堤），滬尾即石滬設置範圍的末端。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 49, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『汐止區』這個地方，是怎麼來的嗎？汐止舊稱水返腳，因基隆河潮汐漲潮時海水可溯河而上，至此處便回流退去而得名。", "汐止地名的由來，直接描述了基隆河下游受潮汐影響的水文特徵：每當滿潮時分，海水會沿著淡水河溯流進入基隆河，一路上溯直到今日汐止一帶，潮水漲勢便到此為止而開始回退，因而得名「水返腳」，意指潮水返回之處。這種因應潮汐現象命名地方的方式，反映了先民對河川水文特性的細膩觀察。水返腳因扼守基隆河航運要衝，清代以來便是台北盆地與基隆之間重要的水陸轉運據點，", "加上鄰近山區盛產煤礦、茶葉，一度發展成繁榮的河港市街。1920年，日本殖民政府推行地方行政改制時，取「潮汐至此而停止」之意，將「水返腳」簡化雅化為「汐止」，沿用至今。如今汐止因鄰近台北市，加上高速公路、捷運系統陸續完工，已從昔日的河港小鎮轉型為新北市重要的科技產業與住宅聚落。"], "quiz": {"q": "關於「汐止區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["汐止舊稱水返腳，因基隆河潮汐漲潮時海水可溯河而上，至此處便回流退去而得名。", "因清代此地盛產某種作物，官府設「汐止區」市集而得名", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！汐止舊稱水返腳，因基隆河潮汐漲潮時海水可溯河而上，至此處便回流退去而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 50, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『瑞芳區』這個地方，是怎麼來的嗎？瑞芳是全台唯一以商店店名作為地名的鄉鎮，源自清末一家兼作淘金補給站的雜貨店店號。", "瑞芳是台灣三百多個鄉鎮市中，唯一以「商店名稱」直接作為地名的特例。清光緒年間，由於陸路交通不便，往來台北與噶瑪蘭（今宜蘭）之間的旅人，多仰賴基隆河水運補給，河岸渡口「柑仔瀨」附近，有陳姓、賴姓商家開設一間名為「瑞芳」的雜貨店，店內南北雜貨齊備，成為往來旅客與後來淘金客的中途補給休息站。由於往來者眾多，大家不約而同以「去瑞芳」「從瑞芳回來」相稱，", "久而久之，「瑞芳」便從一間商店的店號，演變成整個聚落的地名。光緒19年（1893年）九份溪發現砂金，隔年金瓜石也傳出金礦，瑞芳因地處往返礦區的必經之路，隨著淘金熱潮迅速發展，加上後來鐵路在龍潭堵設站，發展重心也隨之轉移到車站周邊，奠定今日瑞芳作為新北市東北角交通樞紐與觀光門戶的地位。"], "quiz": {"q": "關於「瑞芳區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "瑞芳是全台唯一以商店店名作為地名的鄉鎮，源自清末一家兼作淘金補給站的雜貨店店號。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 1, "rightFb": "沒錯！瑞芳是全台唯一以商店店名作為地名的鄉鎮，源自清末一家兼作淘金補給站的雜貨店店號。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [47, 48, 49, 50]}, {"id": "main-新北市-4", "title": "新北市．土城區至泰山區", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識新北市的幾個地方：土城區、蘆洲區、五股區、泰山區。」", "stops": [{"placeId": 51, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『土城區』這個地方，是怎麼來的嗎？土城因清代先民為防禦擺接社原住民出草，在聚落周圍構築土牆防禦工事而得名。", "土城地名由來與清初漢人拓墾時期的族群關係有關：這一帶原是平埔族擺接社的漁獵領域，清初已有先民入墾，但因與原住民時常發生衝突，為了自保，墾民便在聚落四周構築土牆作為防禦工事，這座土牆聚落因而被稱為「土城」，沿用至今。土城因地處大漢溪畔，清代以來即是重要的農業與煤礦產地，日治及戰後時期，境內天上山、大暖尖山一帶開採的煤礦，", "透過鐵道運往板橋、樹林等地轉運，帶動地方經濟發展。境內的「媽祖田」與「媽祖坑古道」等地名，相傳與清代原墾戶將田產捐獻給媽祖廟宇作為廟產有關，反映當地移民社會濃厚的民間信仰色彩。如今土城因鄰近台北市及三峽北大特區，加上台北捷運土城線、頂埔延伸線的通車，已從昔日的防禦聚落轉型為新北市重要的住宅與工業區域。"], "quiz": {"q": "關於「土城區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "土城因清代先民為防禦擺接社原住民出草，在聚落周圍構築土牆防禦工事而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！土城因清代先民為防禦擺接社原住民出草，在聚落周圍構築土牆防禦工事而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 52, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『蘆洲區』這個地方，是怎麼來的嗎？蘆洲因淡水河沙洲地帶蘆葦叢生、鷺鷥棲息，早期曾稱河上洲、和尚洲，後定名蘆洲。", "蘆洲位於淡水河下游西岸，是大漢溪與新店溪沖積而成的沙洲地帶，因地勢低平、常年積水，河岸兩側蘆草叢生，因而最早被稱為「河上洲」，形容聚落彷彿坐落在河面之上。乾隆年間，僧人梅福向官方申請開墾這片沙洲地，並將其作為廟產，向租戶徵收租穀，由於土地多由僧侶管理，加上「和尚」與「河上」發音相近，這片沙洲又被稱為「和尚洲」。日治時期，", "日本殖民政府認為「和尚洲」的稱呼不夠文雅，加上沙洲濕地本就吸引大量白鷺鷥棲息覓食，遂簡化改稱「鷺洲」（當時範圍涵蓋今三重一帶），戰後才依諧音正式定名為「蘆洲」。每當蘆花盛開時節，白鷺翱翔於蘆葦叢間的景象，曾被列為淡水八大奇景之一，稱作「蘆荻泛月」。如今蘆洲因鄰近台北市，已發展成人口稠密的都會型行政區。"], "quiz": {"q": "關於「蘆洲區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "蘆洲因淡水河沙洲地帶蘆葦叢生、鷺鷥棲息，早期曾稱河上洲、和尚洲，後定名蘆洲。", "因清代此地盛產某種作物，官府設「蘆洲區」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！蘆洲因淡水河沙洲地帶蘆葦叢生、鷺鷥棲息，早期曾稱河上洲、和尚洲，後定名蘆洲。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 53, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『五股區』這個地方，是怎麼來的嗎？五股因清代五位墾戶合股出資開墾此地，原稱五穀坑，後簡化演變為五股。", "五股地名的由來，經學者尹章義考證清乾隆38年（1773年）的古契文，證實原始地名應為「五榖坑」，記載於「興直山下外庄五榖坑口」的田契合同中，顯示這裡最初可能與五穀豐收的墾殖範圍有關，另一種民間流傳的說法則認為，是因清代有五位墾戶合股出資，共同開墾這片山谷坑地，故稱「五股坑」。清代道光、咸豐年間，隨著客家移民逐漸外移、閩南移民遷入，", "「五榖坑」的用字簡化為「五谷坑」，再轉音演變為「五股坑」，日治時期進一步簡化定名為「五股」，沿用至今。五股丘陵自清領中葉起便是茶葉與柑橘的重要產地，五股坑尾一帶更曾是同安陳氏家族製茶產業的重鎮，茶葉一度外銷至東南亞，直到戰後才逐漸沒落。如今五股因鄰近台北港與二重疏洪道，已發展成工商業與物流機能並重的行政區。"], "quiz": {"q": "關於「五股區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "五股因清代五位墾戶合股出資開墾此地，原稱五穀坑，後簡化演變為五股。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！五股因清代五位墾戶合股出資開墾此地，原稱五穀坑，後簡化演變為五股。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 54, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『泰山區』這個地方，是怎麼來的嗎？泰山舊稱山腳，因位於平頂山（今林口台地）山下而得名，後因「頂泰山巖」廟宇香火鼎盛，取「登泰山而小天下」之意改稱泰山。", "泰山地名的由來歷經一次饒富文化意涵的轉變：這一帶因座落於平頂山（今林口台地）山腳下，加上境內大窠坑溪、貴子坑溪流經，具備「地勢較高而鄰近溪澗淡水」的優越條件，成為早期移民開墾水田的首選之地，因而依地理位置直接稱為「山腳」，並發展成新莊平原最早開發的地區之一，區內的明志書院更有「北台首學」之稱，人文薈萃、文風鼎盛。後來，", "因境內三級古蹟「頂泰山巖」（供奉清水祖師）香火鼎盛、廟貌巍峨，信眾登臨其境、俯瞰台北盆地全景時，油然生出「登泰山而小天下」之慨，這句出自《孟子》、借用中國五嶽之首泰山的典故，逐漸深植人心，「山腳」之名便相沿改稱為更具氣勢的「泰山」，沿用至今。1950年，泰山正式從新莊分治設鄉，2010年隨新北市升格改制為區。"], "quiz": {"q": "關於「泰山區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["泰山舊稱山腳，因位於平頂山（今林口台地）山下而得名，後因「頂泰山巖」廟宇香火鼎盛，取「登泰山而小天下」之意改稱泰山。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因清代此地盛產某種作物，官府設「泰山區」市集而得名"], "correct": 0, "rightFb": "沒錯！泰山舊稱山腳，因位於平頂山（今林口台地）山下而得名，後因「頂泰山巖」廟宇香火鼎盛，取「登泰山而小天下」之意改稱泰山。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [51, 52, 53, 54]}, {"id": "main-新北市-5", "title": "新北市．林口區至坪林區", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識新北市的幾個地方：林口區、深坑區、石碇區、坪林區。」", "stops": [{"placeId": 55, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『林口區』這個地方，是怎麼來的嗎？林口舊稱樹林口，因林口台地早期森林茂密，是進入山區樹林地帶的入口而得名。", "林口地名的由來與其早期的自然地貌密切相關：林口台地位於台北盆地西側，早期整片台地覆蓋著茂密的森林，對於從泰山、新莊一帶往台地方向開墾的先民而言，這裡正是進入深山樹林的必經入口，因而被稱為「樹林口」，後簡化為「林口」。林口台地由於地勢較高、土壤貧瘠且缺乏地表逕流，早期農業開發程度不若台北盆地平原地帶，直到日治及戰後時期，", "隨著相思樹造林與茶葉種植的推廣，才逐漸發展出農林經濟。1970年代起，政府推動林口特定區與林口新市鎮開發計畫，加上高速公路林口交流道的設立，使林口從原本開發較晚的邊陲台地，轉型為台北都會區重要的衛星市鎮，境內三井Outlet、竹林山觀音寺等地標，也讓這個因森林入口而得名的地方，成為新北市西側熱門的購物與信仰去處。"], "quiz": {"q": "關於「林口區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "林口舊稱樹林口，因林口台地早期森林茂密，是進入山區樹林地帶的入口而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！林口舊稱樹林口，因林口台地早期森林茂密，是進入山區樹林地帶的入口而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 56, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『深坑區』這個地方，是怎麼來的嗎？深坑因地處景美溪河谷之中，四周山勢環繞、地形深陷如坑谷而得名。", "深坑地名由來相對直白，「坑」在閩南語地名中泛指山間匯水而下的溝谷，深坑因地處景美溪河谷之間，四周群山環繞、地勢低陷，形成一處深邃的坑谷地形，因而得名。清代深坑一帶原屬平埔族秀朗社（雷朗社）的傳統領域，漢人入墾必須先取得社番土目的同意並支付相當代價，才能取得開墾權。乾隆30年（1765年），泉州人張萬順開闢今日萬順里一帶土地，", "是深坑最早的拓墾中心之一；隨後大批安溪移民陸續進入，向平埔族業戶繳納費用取得土地，逐步建立起萬順寮、阿柔、烏月等聚落。深坑因地勢限制，早期以茶葉、木材與豆腐加工為主要產業，其中深坑豆腐更因水質甘美、製作技藝代代相傳，成為全台聞名的特色小吃，深坑老街也因此發展成著名的豆腐美食觀光街區，讓這個因地形得名的山谷小鎮聲名遠播。"], "quiz": {"q": "關於「深坑區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "深坑因地處景美溪河谷之中，四周山勢環繞、地形深陷如坑谷而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！深坑因地處景美溪河谷之中，四周山勢環繞、地形深陷如坑谷而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 57, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『石碇區』這個地方，是怎麼來的嗎？石碇因溪水湍急，早期先民須在溪底繫石作為船隻停泊的「碇」，或以石塊墊作過河踏腳石而得名。", "石碇地名的由來主要有兩種說法。第一種說法認為，石碇一帶昔日溪水深且湍急，小船雖可溯溪而上載運貨物，但停泊時必須以繩索繫住石塊沉入水底作為「碇」（船錨的一種形式），才能穩固船身，因而得名石碇。第二種說法則從地形出發，指出當地溪流中遍布石塊，這些石塊被當地居民安置在溪谷中做為過河時的踏腳石，其功能類似傳統房屋大門口用來擋水、防塵的石質門檻（閩南語稱「戶碇」），", "因而以「石碇」為地名。石碇區地處台北盆地南緣山區，清代與深坑、坪林同屬拳山堡範圍，因山多田少，早期以種植茶葉、大菁（藍染原料）與伐木為主要產業。境內至今保留完整的石碇老街，特殊的「不見天街」建築形式（店屋二樓向外延伸遮蔽街道）與百年茶行，見證這座山城因茶業而興盛的歷史風貌。"], "quiz": {"q": "關於「石碇區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "石碇因溪水湍急，早期先民須在溪底繫石作為船隻停泊的「碇」，或以石塊墊作過河踏腳石而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！石碇因溪水湍急，早期先民須在溪底繫石作為船隻停泊的「碇」，或以石塊墊作過河踏腳石而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 58, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『坪林區』這個地方，是怎麼來的嗎？坪林因地形多平坦的河階台地，且沿岸早期樹林茂密而得名。", "坪林地名由「坪」與「林」兩個描述地形與地貌的字組合而成：「坪」在閩南語地名中意指平坦的河階台地或高地平原，「林」則指樹林茂密之地，坪林區地處北勢溪流域，沿岸分布著多處因溪流沖積、堆疊而成的平坦河階地形，早期這些台地與岸邊林木茂盛，因而合稱「坪林」。坪林因地處台北盆地與宜蘭之間的山區要衝，清代已有先民沿淡蘭古道往來拓墾，日治及戰後時期，", "隨著北宜公路開通，坪林一度是台北通往宜蘭的必經之地，帶動沿線茶葉貿易與商業活動。坪林因氣候濕潤多霧、日夜溫差大，成為台灣重要的包種茶產區，「坪林包種茶」更享有盛名，境內設有坪林茶業博物館，展示茶葉產製的歷史與文化。隨著北宜高速公路雪山隧道通車，坪林過境交通功能雖已減弱，卻也因此保留了較為純樸的山城與茶鄉風貌。"], "quiz": {"q": "關於「坪林區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "坪林因地形多平坦的河階台地，且沿 npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『八里區』這個地方，是怎麼來的嗎？八里舊稱八里坌，源自平埔族「八里坌社」音譯，是早於艋舺、新莊開發的台北盆地早期漢人市街。", "八里地名源自平埔族社名的音譯，荷蘭時代文獻記載為「Parihoon」，清領時期漢字寫作「八里分」或「八里坌」，即凱達格蘭族「八里坌社」的所在地。八里因地處淡水河出海口南岸，是漢人進入台北盆地拓墾最早的據點之一，開發時間甚至早於新莊、艋舺。雍正9年（1731年），清廷在此設立「八里坌巡檢」，是當時管轄整個大台北及基隆一帶事務的重要文官機構；乾隆2年（1737年），", "八里坌莊民更合力集資構築土牆城堡，將巡檢辦公廳舍圍起作為駐地，可惜這座土城後因風災損毀、巡檢遷署而逐漸荒廢，僅存殘蹟。1920年，日本殖民政府將地名簡化為「八里庄」，戰後改制為八里鄉，2010年隨新北市升格改為區。如今八里以十三行博物館、渡船頭老街及左岸自行車道聞名，十三行遺址更見證了此地距今千年的史前煉鐵文化。"], "quiz": {"q": "關於「八里區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "八里舊稱八里坌，源自平埔族「八里坌社」音譯，是早於艋舺、新莊開發的台北盆地早期漢人市街。", "因清代此地盛產某種作物，官府設「八里區」市集而得名"], "correct": 2, "rightFb": "沒錯！八里舊稱八里坌，源自平埔族「八里坌社」音譯，是早於艋舺、新莊開發的台北盆地早期漢人市街。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 62, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『平溪區』這個地方，是怎麼來的嗎？平溪因基隆河上游溪谷多急流瀑布，流至此地趨於平緩而得名，舊稱石底則因盛產優質煤層而聞名。", "平溪地名由來直接描述其水文特徵：基隆河上游流經山區時溪谷狹窄、多瀑布與急流，但流抵平溪一帶後，河道趨向開闊平緩，因而得名「平溪」。平溪區境內另有一個重要的舊稱「石底」，源自當地保存最完整的地層命名——因蘊藏豐富煤層與油氣，「石底層」在礦業史上占有重要地位，清領末期至日治時期，平溪因煤礦業興盛而繁榮一時，1918年礦業家顏雲年創立台陽礦業株式會社，", "全面開採本區煤礦，並斥資興建平溪線鐵路，帶動十分、石底（今平溪）、菁桐三大聚落的形成。相傳清代道光年間，十分寮一帶因盜匪橫行，居民為了在擊退土匪後向躲避山區的老弱婦孺報平安，會在元宵節施放天燈作為訊號，這項習俗流傳至今，發展成每年吸引大量海內外遊客的「平溪天燈節」，讓這個因溪流平緩而得名的礦業山城，轉型為台灣最具代表性的節慶觀光地之一。"], "quiz": {"q": "關於「平溪區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "平溪因基隆河上游溪谷多急流瀑布，流至此地趨於平緩而得名，舊稱石底則因盛產優質煤層而聞名。"], "correct": 3, "rightFb": "沒錯！平溪因基隆河上游溪谷多急流瀑布，流至此地趨於平緩而得名，舊稱石底則因盛產優質煤層而聞名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [59, 60, 61, 62]}, {"id": "main-新北市-7", "title": "新北市．雙溪區至萬里區", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識新北市的幾個地方：雙溪區、貢寮區、金山區、萬里區。」", "stops": [{"placeId": 63, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『雙溪區』這個地方，是怎麼來的嗎？雙溪因平林溪與牡丹溪兩條溪流在此匯合而得名，因位於下游「下雙溪」之上游，故又稱頂雙溪。", "雙溪地名由來直接取自當地的水文地貌：平林溪與牡丹溪兩條溪流在此交會匯流，形成雙溪河，因而得名「雙溪」；由於下游貢寮區雙龍里一帶另有「下雙溪」之稱，位於上游的雙溪聚落便相對稱為「頂雙溪」，日治時期簡化為「雙溪」沿用至今。雙溪河流域的開發約始於清乾隆、嘉慶年間，相傳曾有平埔族人白蘭開闢自暖暖經十份寮、楓仔瀨至雙溪的道路，嘉慶12年台灣知府楊廷理又闢建經四腳亭至雙溪的官道，", "道光年間林平侯之子林國華再重修三貂嶺、草嶺古道，逐步改善交通條件，吸引漳州籍移民連喬、吳爾等人於乾隆末年入墾，至嘉慶初年已形成街肆。雙溪因地處淡蘭古道要衝，加上煤礦與茶葉貿易的帶動，一度是台灣東北角重要的山區市鎮，境內主祀文天祥、陸秀夫、張世傑的三忠廟，也是當地重要的信仰與歷史地標。"], "quiz": {"q": "關於「雙溪區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「雙溪區」市集而得名", "雙溪因平林溪與牡丹溪兩條溪流在此匯合而得名，因位於下游「下雙溪」之上游，故又稱頂雙溪。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！雙溪因平林溪與牡丹溪兩條溪流在此匯合而得名，因位於下游「下雙溪」之上游，故又稱頂雙溪。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 64, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『貢寮區』這個地方，是怎麼來的嗎？貢寮舊稱槓仔寮，因早期山豬眾多，先民設置捕獸陷阱（槓仔）並在旁搭建茅寮而得名。", "貢寮地名源自平埔族語與漢人拓墾習俗的結合：這一帶早期山豬等野獸眾多，平埔族人與漢人先民會在山林間設置捕獸陷阱，這種陷阱在平埔族語（可能為凱達格蘭語）中讀作近似「kona」的音，漢人依音譯記為「槓仔」，並在陷阱旁搭建簡易茅寮供人看守，因而得名「槓仔寮」。1920年，日本殖民政府推行地方行政改制，將「槓仔寮」簡化為「貢寮」，", "但當地居民至今仍習慣以舊稱「槓仔寮」稱呼這片土地，可見古地名的生命力之強韌。貢寮區地處新北市東北角海岸，境內的鹽寮、福隆一帶海岸線綿長優美，福隆海水浴場與福隆便當是著名的觀光名產；每年夏季在此舉辦的貢寮國際海洋音樂祭，更讓這個以捕獸陷阱得名的偏鄉聚落，轉型為台灣獨立音樂文化的重要發源地之一。"], "quiz": {"q": "關於「貢寮區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "貢寮舊稱槓仔寮，因早期山豬眾多，先民設置捕獸陷阱（槓仔）並在旁搭建茅寮而得名。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 1, "rightFb": "沒錯！貢寮舊稱槓仔寮，因早期山豬眾多，先民設置捕獸陷阱（槓仔）並在旁搭建茅寮而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 65, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『金山區』這個地方，是怎麼來的嗎？金山舊稱金包里，源自平埔族凱達格蘭族「金包里社」音譯，日治時期取其地倚山而改稱金山。", "金山地名源自平埔族凱達格蘭族「金包里社」（巴賽語：Ki-taparri）的社名音譯，這一帶自17世紀中葉以前，便已是金包里社群的傳統聚居地，古籍中也因大屯山盛產硫磺，而以「採硫之地」形容此地。清雍正年間，金包里已聚集成街市，其後福建漳、泉移民陸續前來拓墾定居，形成閩南、平埔族群交融的聚落樣貌。1920年，日本殖民政府推行地方行政改制，考量此地三面環山，便保留「金包里」中的「金」字，", "另加上「山」字，重新命名為「金山」，戰後沿用至今。金山老街（金包里老街）已有三百多年歷史，是北海岸僅存的清代商業老街，街上的慈護宮主祀媽祖，相傳廟中所供二媽神像是嘉慶初年漁民在野柳海邊石洞中拾獲，成為金山重要的信仰中心。境內的金山溫泉是台灣位置最北的溫泉，加上地瓜、芋頭、茭白筍合稱「金山三寶」，讓金山成為北海岸兼具人文與物產特色的觀光重鎮。"], "quiz": {"q": "關於「金山區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "金山舊稱金包里，源自平埔族凱達格蘭族「金包里社」音譯，日治時期取其地倚山而改稱金山。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！金山舊稱金包里，源自平埔族凱達格蘭族「金包里社」音譯，日治時期取其地倚山而改稱金山。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 66, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『萬里區』這個地方，是怎麼來的嗎？萬里舊稱瑪鋉，源自居住當地的平埔族馬賽（巴賽）族社名音譯，境內瑪鋉溪、瑪鋉路等地名至今沿用舊稱。", "萬里地名源自平埔族「馬賽族」（Basay，又稱巴賽族，屬凱達格蘭族系統）的社名音譯「瑪鋉」，這條流貫萬里市區、注入台灣海峽的溪流至今仍稱為「瑪鋉溪」，市集主要道路瑪鋉路及其上、下街也都沿用這個古老的平埔族地名。萬里另一個舊名「萬里加投」，據傳與17世紀漢人聚落發展有關；1626年西班牙人占領基隆後，已有漢人在此定居，相傳明鄭時期鄭成功討伐荷蘭東印度公司時，", "曾由萬里加投一帶的小澳灣登陸，隨軍而來的閩南人洪水閣在此屯墾並經營漁業，成為地方開闢之始。戰後，萬里加投簡化為萬里，設立萬里鄉，2010年隨台北縣升格為新北市而改制為萬里區。萬里因地質構造特殊，東北側砂岩層經海水長期侵蝕，形成著名的野柳岬地質景觀，是新北市北海岸最重要的觀光資源之一。"], "quiz": {"q": "關於「萬里區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "萬里舊稱瑪鋉，源自居住當地的平埔族馬賽（巴賽）族社名音譯，境內瑪鋉溪、瑪鋉路等地名至今沿用舊稱。"], "correct": 3, "rightFb": "沒錯！萬里舊稱瑪鋉，源自居住當地的平埔族馬賽（巴賽）族社名音譯，境內瑪鋉溪、瑪鋉路等地名至今沿用舊稱。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [63, 64, 65, 66]}, {"id": "main-新北市-8", "title": "新北市．烏來區至十分", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識新北市的幾個地方：烏來區、九份、金瓜石、十分。」", "stops": [{"placeId": 67, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『烏來區』這個地方，是怎麼來的嗎？烏來源自泰雅族語Ulay，意指溫泉，相傳因泰雅族人發現終年冒著熱氣的水窟而得名。", "烏來地名源自泰雅族語「Ulay」，意指溫泉。相傳最早是泰雅族人在南勢溪畔發現一處終年冒著熱氣、水溫滾燙的水窟，驚呼「Kilux Ulay」（意即水在滾燙），此後便以Ulay稱呼這處溫泉源頭，地名因而流傳並沿用至今。烏來原為泰雅族傳統領域，是台灣少數保有完整泰雅族部落文化的地區之一，日治時期便因溫泉資源開發成觀光地，戰後更興建纜車、台車等特殊交通設施，方便遊客往返老街、瀑布與雲仙樂園之間。境內的烏來瀑布落差約80公尺，", "是台灣少數能從市區道路直接眺望的瀑布景觀之一；南勢溪與桶后溪沿岸露天溫泉屬弱鹼性碳酸氫鈉泉，終年吸引大量遊客前來泡湯。前面提過的桃園復興區「小烏來」，其地名同樣源自這個泰雅語詞彙，因兩地皆擁有溫泉與瀑布景觀，遂借用其名以資區別，讓兩處分屬不同縣市的地方，共享著同一段泰雅語地名的淵源。"], "quiz": {"q": "關於「烏來區」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因鄭成功部隊行經此地時隨口命名而流傳下來", "烏來源自泰雅族語Ulay，意指溫泉，相傳因泰雅族人發現終年冒著熱氣的水窟而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！烏來源自泰雅族語Ulay，意指溫泉，相傳因泰雅族人發現終年冒著熱氣的水窟而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 68, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『九份』這個地方，是怎麼來的嗎？九份因早期僅九戶人家聚居，物資上岸須均分九份而得名，另有一說源自製樟腦業有九十口灶、十灶一份而來。", "九份地名由來流傳著兩種主要說法。最廣為人知的「九戶說」認為，清代九份溪與大竿林溪附近山坡最早僅有九戶人家開墾定居，交通不便，日常物資須從遠方的焿仔寮港運上岸，再均分成九份，分送各戶，久而久之，「九份」便成為這處聚落的代稱。學者考證後則提出另一種「樟腦說」，認為在金礦業興盛之前，九份一帶以採樟煮腦為業，共設有九十口熬煉樟腦的灶，依當時慣例十口灶為一「份」，恰好湊足九份，", "因而得名，此說法被認為在文獻與邏輯上更為可信。饒富趣味的是，1920年日本殖民政府實施街庄改制前，「九份」與「金瓜石」兩個地名一度所指相反，即今日的金瓜石在清代文獻中反被稱為九份，直到行政區劃調整後才確立今日的對應關係。九份因清末發現金礦而繁榮一時，礦業沒落後又因電影《悲情城市》與動畫《神隱少女》的場景聯想而重新聲名大噪，成為國際知名的山城觀光勝地。"], "quiz": {"q": "關於「九份」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["九份因早期僅九戶人家聚居，物資上岸須均分九份而得名，另有一說源自製樟腦業有九十口灶、十灶一份而來。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！九份因早期僅九戶人家聚居，物資上岸須均分九份而得名，另有一說源自製樟腦業有九十口灶、十灶一份而來。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 69, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『金瓜石』這個地方，是怎麼來的嗎？金瓜石因山頭岩石形狀渾圓，狀似南瓜（金瓜）而得名，曾與鄰近九份互換地名。", "金瓜石地名由來普遍認為，是因為當地一座山頭的岩石外形渾圓，狀似閩南語稱為「金瓜」的南瓜，因而得名。金瓜石與九份同屬台灣清末至日治時期最重要的金礦產地，兩地合稱「金九」：光緒19年（1893年）九份溪發現砂金後，隔年金瓜石也傳出淘金熱潮，吸引大批礦工湧入開採。饒富趣味的是，根據地方文史工作者考證，清代文獻中原本以「九份」指稱今日金瓜石一帶，", "而以「焿仔寮」稱呼今日的九份，直到1920年日本殖民政府實施街庄改制，才依現況重新劃定，使「九份」與「金瓜石」正式定型為今日所熟知的對應關係。金瓜石在日治時期由財團經營開採，礦業全盛時期曾有「東亞第一金都」之稱，如今已闢為黃金博物館園區，保留太子賓館、本山五坑等歷史建築，讓這個因岩石形狀得名的礦山，轉型為認識台灣近代礦業史的重要場域。"], "quiz": {"q": "關於「金瓜石」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "金瓜石因山頭岩石形狀渾圓，狀似南瓜（金瓜）而得名，曾與鄰近九份互換地名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「金瓜石」市集而得名"], "correct": 1, "rightFb": "沒錯！金瓜石因山頭岩石形狀渾圓，狀似南瓜（金瓜）而得名，曾與鄰近九份互換地名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 70, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『十分』這個地方，是怎麼來的嗎？十分因早期依股份計算開墾或製腦規模，恰好湊足十份而得名，今以十分瀑布與天燈聞名。", "十分地名的由來，與台灣清代慣以「份」計算開墾或產業規模的命名方式有關，和鄰近瑞芳的「九份」屬於同一套邏輯。一般認為，十分早期是漢人合股拓墾，或是從事製腦、製茶產業的據點，依股份或灶數計算恰好湊足十份，因而得名「十分寮」，後簡稱十分。十分因地處基隆河上游的開闊河階台地，加上平溪鐵路支線行經，發展成沿鐵軌兩側而建的特殊「十分老街」，", "火車行駛時幾乎貼著店家門口通過，是台灣少數保留鐵道與街道共構景觀的老街之一。境內的十分瀑布因水量豐沛、瀑潭寬闊，有「台灣尼加拉瀑布」之稱，是全台最寬的簾幕式瀑布。每年元宵節前後，十分也是新北市平溪天 傳「又被野人給柳去了」的說法，因而得名野柳。野柳因地處大屯山餘脈延伸入海的岬角，長期受海蝕與風化作用形成女王頭、仙女鞋等奇特地景，是台灣最富國際知名度的地質景觀之一。"], "quiz": {"q": "關於「野柳」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "野柳地名由來眾說紛紜，包括平埔族社名音譯、西班牙文「魔鬼岬角」的音轉，以及台語諧音的趣味傳說。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！野柳地名由來眾說紛紜，包括平埔族社名音譯、西班牙文「魔鬼岬角」的音轉，以及台語諧音的趣味傳說。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 73, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『碧潭』這個地方，是怎麼來的嗎？碧潭因新店溪水流至此匯聚成一潭碧綠深潭而得名，是新店最具代表性的地標景觀。", "碧潭地處新店溪流經新店市區前的一段河谷，因兩岸青山夾峙、水流至此趨緩並匯聚成一潭碧綠清澈的深潭，故稱「碧潭」，是新店最具代表性的地標景觀。潭西岸有一片因河流侵蝕作用形成的岩壁，因外形類似長江三峽的赤壁景觀，被稱為「小赤壁」，岩壁上散布的巨石，早期居民依形狀分別命名為虎嘴石、豬母石、印斗石等趣味稱呼。1937年完工的碧潭吊橋橫跨東西兩岸，", "橋身造型優美，是台灣現存少數仍在使用的歷史吊橋之一，也是無數台灣人共同的旅遊記憶。日治時期，台北經新店的私設鐵路「新店線」通車後，碧潭因交通便利、風景秀麗，成為台北近郊著名的划船與郊遊勝地，時至今日，碧潭仍是新北市新店區重要的觀光休憩景點，湖面上仍可見遊客划船遊湖的悠閒景象。"], "quiz": {"q": "關於「碧潭」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "碧潭因新店溪水流至此匯聚成一潭碧綠深潭而得名，是新店最具代表性的地標景觀。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！碧潭因新店溪水流至此匯聚成一潭碧綠深潭而得名，是新店最具代表性的地標景觀。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 74, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『江子翠』這個地方，是怎麼來的嗎？江子翠舊稱港仔嘴，因位於新店溪與大漢溪匯流處的尖嘴狀地形而得名，後取台語近音雅字改稱江子翠。", "江子翠地處大漢溪與新店溪匯流之處，因兩河交會形成一處河岸開闊、狀如尖嘴突出的地形，清代先民便稱此地為「港仔嘴」，是平埔族凱達格蘭族武朥灣社的傳統聚居地之一。清代後期，隨著江子翠地區人口增加，逐漸從港仔嘴庄獨立發展成庄，由於「港仔嘴」（台羅：káng-á-tshuì）與「江仔翠」（kang-á-tshuì）閩南語發音極為相近，為了區別兩地，", "人們便採用較為文雅的近音字「江仔翠」來稱呼這片新興聚落，後演變為今日的「江子翠」，而維持舊稱的區域則另稱「崁頂」。江子翠因鄰近台北市，加上台北捷運板南線在此設站，逐漸發展成板橋區東北側重要的住宅與商業區域，雖曾因兩起社會矚目案件而讓地名蒙上陰影，但這些事件其實與當地治安並無直接關聯，無損於這個因河岸地形得名之處的發展。"], "quiz": {"q": "關於「江子翠」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "江子翠舊稱港仔嘴，因位於新店溪與大漢溪匯流處的尖嘴狀地形而得名，後取台語近音雅字改稱江子翠。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！江子翠舊稱港仔嘴，因位於新店溪與大漢溪匯流處的尖嘴狀地形而得名，後取台語近音雅字改稱江子翠。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 75, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『秀朗』這個地方，是怎麼來的嗎？秀朗源自平埔族秀朗社社名，是清代永和、中和一帶重要的平埔族聚落。", "秀朗地名源自居住於新店溪畔的平埔族「秀朗社」（另有繡朗、雷朗等音譯寫法），是清代大加蚋堡境內重要的平埔族聚落之一，活動範圍大致涵蓋今日永和、中和沿新店溪一帶。漢人入墾這一帶後，秀朗社逐漸與周邊擺接社、里族社等平埔族群融合，統稱「雷朗族」，隨著漢化程度加深，其語言與文化特徵也逐漸消失於歷史記載中，", "僅留下秀朗這個地名作為見證。如今秀朗一帶已完全融入永和、中和的都市發展範圍內，秀朗國小、秀朗橋等公共設施仍沿用這個源自平埔族社名的古老地名，成為後人追溯這片土地上原住民族歷史痕跡的重要線索，也呼應了新北市境內許多地名皆源自平埔族凱達格蘭族分支社名的普遍現象。"], "quiz": {"q": "關於「秀朗」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「秀朗」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "秀朗源自平埔族秀朗社社名，是清代永和、中和一帶重要的平埔族聚落。", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 2, "rightFb": "沒錯！秀朗源自平埔族秀朗社社名，是清代永和、中和一帶重要的平埔族聚落。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [72, 73, 74, 75]}, {"id": "side-新北市-2", "title": "新北市．頂埔至山佳", "kind": "side", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識新北市的幾個地方：頂埔、迴龍、丹鳳、山佳。」", "stops": [{"placeId": 76, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『頂埔』這個地方，是怎麼來的嗎？頂埔因位於地勢較高的平原（埔）而得名，與依開墾先後命名的頭前埔、二重埔等地名同屬一套系統。", "頂埔是台灣鄉鎮地名中常見的「埔」系列地名之一，「埔」字在閩南語中泛指未經開墾的平坦草地或河邊沙洲，先民拓墾時常依開墾先後順序或地勢高低為這類埔地命名，例如三重的頭前埔、二重埔、三重埔，便是依開墾次序命名；而頂埔則是依地勢高低命名的例子，「頂」在閩南語中意指位置較高之處，相對於地勢較低的其他埔地，", "這片位於土城區地勢相對較高的平原便被稱為「頂埔」。清代這一帶因鄰近大漢溪沖積平原，土質肥沃，適合農耕，逐漸發展成漢人拓墾聚落。隨著台北捷運土城延伸線在此設立頂埔站，加上鄰近的三峽北大特區發展，頂埔近年已從農業聚落轉型為捷運沿線的新興住宅區，成為土城區向西南延伸發展的重要生活機能節點。"], "quiz": {"q": "關於「頂埔」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「頂埔」市集而得名", "頂埔因位於地勢較高的平原（埔）而得名，與依開墾先後命名的頭前埔、二重埔等地名同屬一套系統。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！頂埔因位於地勢較高的平原（埔）而得名，與依開墾先後命名的頭前埔、二重埔等地名同屬一套系統。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 77, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『迴龍』這個地方，是怎麼來的嗎？迴龍因當地山勢蜿蜒起伏、狀似回轉的龍形而得名，境內樂生療養院曾是台灣重要的漢生病醫療機構。", "迴龍地名由來與當地地形特徵有關：這一帶山巒地勢起伏蜿蜒，遠望山脈走勢彷彿一條盤旋回轉的巨龍，因而得名「迴龍」，是台灣常見以山形、水流意象命名地方的例子之一。迴龍位於新北市新莊、泰山、樹林三區交界處，清代因地處交通要衝，逐漸發展成聚落。台灣總督府自1916年起在此設立「樂生療養院」，是台灣第一座專門收容漢生病（痲瘋病）患者的公立醫療機構，", "讓迴龍這個地名長期與這段特殊的台灣公共衛生史緊密相連，也曾因捷運新莊線施工路線爭議引發保存樂生院區的社會運動。隨著台北捷運新莊線於2010年通車、設立迴龍站作為端點站，加上鄰近的丹鳳、輔仁大學周邊發展，迴龍逐漸從邊陲地帶轉型為捷運沿線的住宅生活圈。"], "quiz": {"q": "關於「迴龍」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "迴龍因當地山勢蜿蜒起伏、狀似回轉的龍形而得名，境內樂生療養院曾是台灣重要的漢生病醫療機構。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 1, "rightFb": "沒錯！迴龍因當地山勢蜿蜒起伏、狀似回轉的龍形而得名，境內樂生療養院曾是台灣重要的漢生病醫療機構。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 78, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『丹鳳』這個地方，是怎麼來的嗎？丹鳳因當地山形宛如一隻展翅的紅色鳳凰而得名，如今是新莊區西側重要的文教與住宅聚落。", "丹鳳地名由來源自地形意象：當地一座山丘的稜線起伏，遠望形狀彷彿一隻展翅欲飛的鳳凰，「丹」則有紅色、吉祥之意，兩字合稱寓意吉祥美好的山勢景觀。丹鳳位於新北市新莊區西側，鄰近迴龍、泰山一帶，清代開發程度較低，多為丘陵與農業用地。戰後隨著新莊都市計畫的擴張，加上鄰近輔仁大學等學術機構的設立，", "丹鳳逐漸發展為住宅聚落，並設有丹鳳國小、丹鳳高中等教育設施，是新莊區西側重要的文教與生活機能區域。台北捷運新莊線於此設有丹鳳站，進一步帶動周邊房地產與商業機能的發展，讓這個以山形意象命名的古老地名，成為捷運沿線新興的生活聚落代表。"], "quiz": {"q": "關於「丹鳳」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "丹鳳因當地山形宛如一隻展翅的紅色鳳凰而得名，如今是新莊區西側重要的文教與住宅聚落。"], "correct": 3, "rightFb": "沒錯！丹鳳因當地山形宛如一隻展翅的紅色鳳凰而得名，如今是新莊區西側重要的文教與住宅聚落。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 79, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『山佳』這個地方，是怎麼來的嗎？山佳舊稱山仔腳，因聚落位於山腳下而得名，境內山佳車站是台灣少數保存完整的日治磚造車站。", "山佳舊稱「山仔腳」，是台灣典型依地形位置命名的地名之一：「山仔」指附近的小山丘，「腳」則是閩南語表示「底下、附近」之意，兩字合稱意指聚落坐落於山腳下的位置，這樣的命名邏輯在台灣各地相當常見，例如泰山區的舊稱同樣也是「山腳」。山佳所在的樹林區山佳里，清代因鄰近大漢溪河運與丘陵地形，早期以農業與礦業為主要產業。1903年，", "台灣總督府鐵道部在此設立「山仔腳驛」，是縱貫鐵路的重要車站之一，戰後改稱山佳車站；車站建築歷經多次整建，現存站舍建於1931年，採用西洋式風格與唭哩岸石砌造，2011年被指定為新北市市定古蹟，是台灣少數保存完整的日治時期磚造車站之一，讓「山仔腳」這個描述地形位置的地名，透過百年車站建築流傳至今。"], "quiz": {"q": "關於「山佳」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "山佳舊稱山仔腳，因聚落位於山腳下而得名，境內山佳車站是台灣少數保存完整的日治磚造車站。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！山佳舊稱山仔腳，因聚落位於山腳下而得名，境內山佳車站是台灣少數保存完整的日治磚造車站。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [76, 77, 78, 79]}, {"id": "side-新北市-3", "title": "新北市．浮洲至海山堡", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識新北市的幾個地方：浮洲、二重埔、和尚洲、海山堡。」", "stops": [{"placeId": 473, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『浮洲』這個地方，是怎麼來的嗎？浮洲因位於大漢溪沖積形成的沙洲地帶，地勢低平、雨季易被大水淹沒若浮於水面而得名。", "浮洲地名由來與其所在的地形直接相關：這片位於板橋南側的土地，是大漢溪長期沖積作用堆積而成的沙洲地帶，地勢低平，每逢雨季河水暴漲，四周景象猶如漂浮於水面之上，因而得名「浮洲」。清代這一帶因地勢低窪、常遭水患侵擾，開發程度相對較晚，多作為農業用地。隨著板橋市區向南擴張，", "加上台北大學校區與周邊住宅社區的興建，浮洲逐漸從昔日的河濱沙洲農地，轉型為板橋南側重要的新興住宅與文教區域。浮洲橋橫跨大漢溪，連接板橋與土城兩地，也是這一帶居民往來對岸的重要交通動脈，見證了這片沙洲地從農業聚落發展為都市外圍生活圈的變遷過程。"], "quiz": {"q": "關於「浮洲」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「浮洲」市集而得名", "浮洲因位於大漢溪沖積形成的沙洲地帶，地勢低平、雨季易被大水淹沒若浮於水面而得名。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！浮洲因位於大漢溪沖積形成的沙洲地帶，地勢低平、雨季易被大水淹沒若浮於水面而得名。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 496, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『二重埔』這個地方，是怎麼來的嗎？清代拓墾依開墾先後次序命名，此地為第二個開發的埔地，故稱二重埔，即今三重、蘆洲一帶。", "二重埔的命名邏輯與三重埔、頭前埔完全相同：清代先民沿淡水河岸依開墾先後順序為新生埔地編號，最早開發的稱頭前埔，其後依序為二重埔、三重埔。隨著淡水河泥沙淤積、沙洲不斷向外擴展，登陸與開墾地點也隨之外移，二重埔便是在頭前埔之後、三重埔之前開發的一段埔地，大致位於今三重、蘆洲一帶。這種依次序命名的方式，", "反映了清代漢人沿河系統性拓墾的過程，類似邏輯也可見於新店的頭張、二張、三張等地名。如今二重埔已完全融入三重、蘆洲的都市發展範圍，但仍可從地方志與老地圖中，追溯這段先民一步步向淡水河沙洲拓墾前進的歷史軌跡。"], "quiz": {"q": "關於「二重埔」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "清代拓墾依開墾先後次序命名，此地為第二個開發的埔地，故稱二重埔，即今三重、蘆洲一帶。"], "correct": 3, "rightFb": "沒錯！清代拓墾依開墾先後次序命名，此地為第二個開發的埔地，故稱二重埔，即今三重、蘆洲一帶。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 497, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『和尚洲』這個地方，是怎麼來的嗎？相傳清代有僧侶在此淡水河沙洲地開墾而得名和尚洲，即今蘆洲舊稱，日治時期因諧音改為蘆洲。", "和尚洲是蘆洲眾多舊稱中流傳最廣的一個，據傳乾隆年間，僧人梅福向官方申請開墾這片淡水河沖積沙洲，並將其做為廟宇的香油錢田產，此後常有僧侶前來巡視、設置公館收取租穀，久而久之，這片沙洲便被稱為「和尚洲」；另一種說法則認為，此地原稱「河上洲」（形容聚落如坐落於河面之上），因「河上」與「和尚」台語發音相近而逐漸混用轉化為和尚洲。日治時期，", "殖民政府認為和尚洲之名不甚文雅，加上沙洲濕地本吸引大量白鷺鷥棲息，遂改稱較為風雅的「鷺洲」，戰後才依諧音定名為今日的「蘆洲」。從河上洲、和尚洲、鷺洲到蘆洲，這一連串地名演變完整呈現了同一塊沙洲地形，在不同時代被賦予不同意涵與雅化考量的過程。"], "quiz": {"q": "關於「和尚洲」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「和尚洲」市集而得名", "相傳清代有僧侶在此淡水河沙洲地開墾而得名和尚洲，即今蘆洲舊稱，日治時期因諧音改為蘆洲。"], "correct": 3, "rightFb": "沒錯！相傳清代有僧侶在此淡水河沙洲地開墾而得名和尚洲，即今蘆洲舊稱，日治時期因諧音改為蘆洲。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 498, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『海山堡』這個地方，是怎麼來的嗎？清代在板橋、土城、三峽一帶設置的行政區劃單位，因轄內多山林而得名海山堡。", "海山堡是清代台灣行政區劃「堡里制」下的一個堡，範圍大致涵蓋今日板橋、土城、三峽及樹林部分地區，因轄內多丘陵山林地形而得名。清代台灣的地方行政區劃由上而下分為府、廳縣、堡（或里、鄉）、莊（街）等層級，「堡」是介於縣廳與基層聚落之間的區域單位，海山堡便是台北盆地西南側、大漢溪流域眾多堡之一。板橋、土城、三峽這幾個今日各自獨立發展的行政區，在清代同屬海山堡管轄，", "並曾一度由林本源家族的勢力範圍所涵蓋，彼此在水利、信仰、商業網絡上關係緊密，例如枋橋城、三角湧街等市街的興起，都與海山堡整體的拓墾開發脈絡息息相關。隨著日治時期地方制度改革，堡里制逐漸被街庄制取代，「海山」之名雖不再作為正式行政區劃使用，卻仍留存於海山高中、海山煤礦等地方機構與設施名稱中，成為追溯這段清代區域治理歷史的線索。"], "quiz": {"q": "關於「海山堡」（新北市）這個地名，下列何者才是真正的由來？", "opts": ["清代在板橋、土城、三峽一帶設置的行政區劃單位，因轄內多山林而得名海山堡。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「海山堡」市集而得名"], "correct": 0, "rightFb": "沒錯！清代在板橋、土城、三峽一帶設置的行政區劃單位，因轄內多山林而得名海山堡。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [473, 496, 497, 498]}]}, "桃園市": {"mainChains": [{"id": "main-桃園市-1", "title": "桃園市．桃園區至八德區", "kind": "main", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識桃園市的幾個地方：桃園區、中壢區、平鎮區、八德區。」", "stops": [{"placeId": 80, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『桃園區』這個地方，是怎麼來的嗎？桃園原稱虎茅庄，因早期茅草叢生如虎傷人而得名，後因遍植桃樹、花開似紅雲而改稱桃仔園。", "桃園區現址在清乾隆年間文獻中最初稱為「虎茅莊」，是淡水廳下轄三十五莊之一，因開墾前這一帶長滿茂密的茅草，銳利如虎爪、容易劃傷行人，因而得名。乾隆30年（1765年）前後，隨著閩粵移民與龜崙社平埔族交易日益頻繁，原本的荒草地逐漸形成店舖聚集的市街；同一時期，墾首薛啟隆率眾拓墾龜山、八德一帶土地時，在此廣植桃樹，", "每逢花季，滿山桃花如紅雲搖曳，因而博得「桃仔園」的美稱，乾隆39年（1774年）《續修臺灣府志》已可見「桃仔園莊」的記載，光緒14年官方文書則簡化為「桃園」，沿用至今。桃園區是全台唯一與所屬直轄市同名的市轄區，也是桃園市政府所在地，境內桃園車站周邊商圈及桃園藝文特區，是全市最重要的政治、經濟與交通核心。"], "quiz": {"q": "關於「桃園區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "桃園原稱虎茅庄，因早期茅草叢生如虎傷人而得名，後因遍植桃樹、花開似紅雲而改稱桃仔園。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因清代此地盛產某種作物，官府設「桃園區」市集而得名"], "correct": 1, "rightFb": "沒錯！桃園原稱虎茅庄，因早期茅草叢生如虎傷人而得名，後因遍植桃樹、花開似紅雲而改稱桃仔園。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 81, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『中壢區』這個地方，是怎麼來的嗎？中壢舊稱澗仔壢，因老街溪、新街溪切割出的谷地而得名，又因地處竹塹與淡水間的中點，加取「中」字而成中壢。", "中壢地名由來與當地的河谷地形及地理位置密切相關：境內老街溪、新街溪兩條溪流貫穿，切割出深峻的澗谷地形，客語稱這種谷地為「壢」，因而先民最初稱此地為「澗仔壢」。乾隆年間，漳州人郭樽先在大園開墾，其後率族人自南崁、桃園一帶南下，開闢橋路，為中壢的發展奠定根基，吸引大批福建、廣東移民陸續進駐。由於澗仔壢恰好位於清代北台灣兩大城鎮——竹塹（新竹）與淡水（原指新莊，", "後指台北）之間的中途站，是商旅往來歇腳的必經之地，加上境內多壢谷地形，遂取其居中的地理位置，將「澗仔壢」簡化改稱為「中壢」，沿用至今。中壢因族群結構多元、以客家人居多，加上工業區設立帶動人口成長，如今是桃園市人口第二多的行政區，牛肉麵、花生酥糖與鐮刀並稱「中壢三寶」。"], "quiz": {"q": "關於「中壢區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "中壢舊稱澗仔壢，因老街溪、新街溪切割出的谷地而得名，又因地處竹塹與淡水間的中點，加取「中」字而成中壢。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 1, "rightFb": "沒錯！中壢舊稱澗仔壢，因老街溪、新街溪切割出的谷地而得名，又因地處竹塹與淡水間的中點，加取「中」字而成中壢。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 82, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『平鎮區』這個地方，是怎麼來的嗎？平鎮舊稱安平鎮，因清代設「張路寮」守望盜匪，或因瘟疫後改名求平安，取平安鎮守之意。", "平鎮地名的由來，流傳著幾種與「求平安」密切相關的說法。一種說法認為，這一帶最初稱為「廣興庄」，是乾隆9年（1744年）廣東嘉應州客籍移民宋姓、戴姓兩族拓墾興業而得名；另一種較廣為流傳的說法指出，此地原稱「西勢」，因客語發音與「死屍」諧音不祥，加上曾經連年爆發瘟疫，先民向土地公祈求後，依神明指示改稱「安平鎮」以求平安。也有記載指出，乾隆25年（1760年），", "為保護往來桃園與中壢間行旅的安全，先民在交通要道設置稱為「張路寮」的瞭望守衛設施，防範盜匪與原住民出草，設寮後治安好轉，因而改稱「安平鎮」。1920年日本殖民政府推行地方改制，為與台南安平有所區別，將「安平鎮」去「安」字簡化為「平鎮」，沿用至今，境內龍岡因滇緬孤軍撤台後在此落腳，形成獨具特色的雲南、緬甸文化眷村聚落。"], "quiz": {"q": "關於「平鎮區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因清代此地盛產某種作物，官府設「平鎮區」市集而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "平鎮舊稱安平鎮，因清代設「張路寮」守望盜匪，或因瘟疫後改名求平安，取平安鎮守之意。"], "correct": 3, "rightFb": "沒錯！平鎮舊稱安平鎮，因清代設「張路寮」守望盜匪，或因瘟疫後改名求平安，取平安鎮守之意。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 83, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『八德區』這個地方，是怎麼來的嗎？八德舊稱八塊厝，因清乾隆年間有謝、蕭、邱、呂、賴、黃、吳、李八姓移民各建一屋而得名，與「四維八德」無關。", "八德地名由來與「四維八德」的道德教條其實毫無關聯：據傳清乾隆6年（1741年）此地已建有八棟建築，另一說則指乾隆10年（1745年），來自閩、客不同籍貫的謝、蕭、邱、呂、賴、黃、吳、李八個姓氏的移民先後在此落地生根，每個家族各自興建一座房舍，聚落因而得名「八塊厝」。戰後初期，這一帶依台語發音簡稱為「八塊鄉」，", "後來才取「八德」之名重新命名，恰好與傳統道德「八德」諧音，賦予地名新的文化意涵，但這只是後來的巧合附會，並非最初命名的本意。八德境內另有「霄裡」一地，得名於當地平埔族「霄裡社」的社名，是八德開發甚早的舊地名之一；「大湳」則因大漢溪改道後地下水位偏高、雨後容易形成泥濘濕地（湳）而得名，是八德目前最繁華的區域。"], "quiz": {"q": "關於「八德區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "八德舊稱八塊厝，因清乾隆年間有謝、蕭、邱、呂、賴、黃、吳、李八姓移民各建一屋而得名，與「四維八德」無關。"], "correct": 3, "rightFb": "沒錯！八德舊稱八塊厝，因清乾隆年間有謝、蕭、邱、呂、賴、黃、吳、李八姓移民各建一屋而得名，與「四維八德」無關。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "風先生：「記憶如風，一晃即逝。你已接住了它，很好。」", "placeIds": [80, 81, 82, 83]}, {"id": "main-桃園市-2", "title": "桃園市．楊梅區至龍潭區", "kind": "main", "opening": "阿茶：「啊…有人來了…那個…我可以說說這裡的故事嗎…這一段路，我帶你認識桃園市的幾個地方：楊梅區、蘆竹區、大溪區、龍潭區。」", "stops": [{"placeId": 84, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『楊梅區』這個地方，是怎麼來的嗎？楊梅因清乾隆年間先民在澗谷地遍植楊梅樹而得名，因地處谷地（壢），舊稱楊梅壢。", "楊梅地名由來相當直白：清乾隆年間，漢人移民進入這片位於社仔溪上游、介於伯公崗、乳姑山與平鎮台地之間的谷地開墾時，發現當地遍植楊梅樹，因而以「楊梅」為名；又因這片谷地由老坑溪與崎頂溪切割而成，客語稱谷地為「壢」，故舊稱「楊梅壢」，直到1920年才簡化定名為「楊梅」。楊梅境內地名故事豐富：「秀才窩」一帶因窪地村落坐落於山凹出口而稱「窩」，", "相傳因鄰近一位清光緒年間考取武秀才的李祥謹住家，或因某位路過秀才讚嘆此地風水寶地而得名；「富岡」在日治時期原稱「伯公岡」，伯公是客家人對土地公的稱呼，意指設有土地公廟的小台地，1929年鐵路改道設站後，帶動站前老街的繁榮發展，戰後才改稱富岡。這些地名共同交織出楊梅這座客家山城的拓墾與信仰記憶。"], "quiz": {"q": "關於「楊梅區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "楊梅因清乾隆年間先民在澗谷地遍植楊梅樹而得名，因地處谷地（壢），舊稱楊梅壢。"], "correct": 3, "rightFb": "沒錯！楊梅因清乾隆年間先民在澗谷地遍植楊梅樹而得名，因地處谷地（壢），舊稱楊梅壢。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 85, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『蘆竹區』這個地方，是怎麼來的嗎？蘆竹因清雍正年間福建移民以蘆竹搭建屋舍而得名，是南崁與大竹兩地爭執地名未果後的折衷結果。", "蘆竹地名由來頗具地方協調色彩：這一帶原是南崁與大竹兩處知名聚落之間的小型墾地，相傳因兩地對於這片新興聚落的命名各有堅持、爭執不休，最終折衷選用當地隨處可見、且與兩者皆無關的植物「蘆竹」為名。清雍正8年（1730年），福建南安人陳仲及其兄弟四人來此開墾，以蘆竹搭建簡易屋舍居住，因而稱作「蘆竹厝」，1920年簡化為蘆竹，", "沿用至今。蘆竹境內的「南崁」，其實是比蘆竹本身更具知名度、也更早開發的聚落，地名源自平埔族「南崁社」，是桃園最早開發、也是早期由海路進入台北盆地的必經之地，可說是整個桃園地區的開發起點；境內另有「坑子」，可能源自平埔族「坑子社」，也可能因地處林口台地西側坑子溪谷而得名，如今是桃園捷運機場線的重要站點。"], "quiz": {"q": "關於「蘆竹區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "蘆竹因清雍正年間福建移民以蘆竹搭建屋舍而得名，是南崁與大竹兩地爭執地名未果後的折衷結果。"], "correct": 3, "rightFb": "沒錯！蘆竹因清雍正年間福建移民以蘆竹搭建屋舍而得名，是南崁與大竹兩地爭執地名未果後的折衷結果。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 86, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『大溪區』這個地方，是怎麼來的嗎？大溪原稱大姑陷，源自原住民語「發大水」的譯音，因「陷」字不雅屢經改名，最終於日治時期定名大溪。", "大溪地名歷經多次演變，最初稱為「大姑陷」，是當地原住民語言中形容「發大水」的譯音，反映大嵙崁溪（今大漢溪）水勢湍急、時常氾濫的特性。因「陷」字帶有負面意涵，後改稱較為中性的「大姑崁」；1866年，大溪士紳李騰芳考中科舉，地方為此增光，遂將「姑」字改為帶有文教意涵的「科」，稱作「大科崁」；清末劉銘傳治台推行「開山撫番」政策，在此設置撫墾局，", "又改回「大嵙崁」。直到日治時期，才簡化定名為今日通行的「大溪」。大溪境內河階地形發達，「三層」即因由下而上數來第三層河階、地勢最高而得名；「月眉」因大漢溪流至此形成彎曲如月眉的曲流而得名；「烏塗窟」則因蘊藏烏黑的煤炭（烏塗）而得名，見證大溪清代以來煤礦開採的產業歷史，如今大溪老街的巴洛克式牌樓立面，仍是全台保存最完整的老街建築群之一。"], "quiz": {"q": "關於「大溪區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["大溪原稱大姑陷，源自原住民語「發大水」的譯音，因「陷」字不雅屢經改名，最終於日治時期定名大溪。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！大溪原稱大姑陷，源自原住民語「發大水」的譯音，因「陷」字不雅屢經改名，最終於日治時期定名大溪。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 87, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『龍潭區』這個地方，是怎麼來的嗎？龍潭原稱菱潭陂，因潭中盛產菱角而得名，後因大旱不涸、傳說有黃龍飛騰於潭面，改稱靈潭、龍潭。", "龍潭地名的演變過程頗具傳奇色彩：這座位於桃園台地上的天然大池塘，最初因潭中盛產菱角，被稱為「菱潭陂」；相傳雖然歷經多次大旱，這座池塘卻從未乾涸見底，居民認為必有靈氣庇佑，因而改稱「靈潭陂」，《淡水廳志》更記載乾隆13年（1748年）霄裡社通事知母六招佃開闢此陂，村民逢旱祈雨常能應驗；後因「靈」與「龍」在閩南語泉州腔及客語發音相近，加上曾有人在風雨交加之際目睹潭面彷彿有黃龍飛騰而過，", "地名便逐漸轉化為今日的「龍潭」。龍潭境內「三坑子」因鴨母坑、火劫尾坑、蔗部坑三條坑溝匯入大漢溪台地而得名，昔日曾是重要的水運集散地，三坑老街至今仍保留古樸的閩客混合建築風貌；「八張犁」則沿用清代以「張犁」為單位計算開墾面積的命名邏輯，因當地開墾農地達四十甲（一張犁約五甲），故稱八張犁，與台北六張犁屬同一套命名系統。"], "quiz": {"q": "關於「龍潭區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "龍潭原稱菱潭陂，因潭中盛產菱角而得名，後因大旱不涸、傳說有黃龍飛騰於潭面，改稱靈潭、龍潭。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！龍潭原稱菱潭陂，因潭中盛產菱角而得名，後因大旱不涸、傳說有黃龍飛騰於潭面，改稱靈潭、龍潭。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [84, 85, 86, 87]}, {"id": "main-桃園市-3", "title": "桃園市．龜山區至新屋區", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識桃園市的幾個地方：龜山區、大園區、觀音區、新屋區。」", "stops": [{"placeId": 88, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『龜山區』這個地方，是怎麼來的嗎？龜山地名源自平埔族龜崙社，日治時期將「崙」改為「山」，簡化定名為龜山。", "龜山地名源自居住於此的平埔族凱達格蘭「龜崙社」（音譯自Kouroumanangh），這一帶原是龜崙社世代狩獵的荒蕪領域，直到康熙年間才有漳、泉籍移民相繼遷入拓墾。1920年，日本殖民政府推行地方行政改制，將原本的「龜崙」簡化，以字形相近、且更貼近當地丘陵地貌的「山」字取代「崙」字，正式定名為「龜山」，沿用至今。龜山境內因坑谷地形眾多，", "衍生出許多以「坑」命名的地方：「塔寮坑」因昔日先民搭建形似高塔的守望寮舍以保護行旅安全而得名；「兔子坑」原稱「社后坑」，因地處龜崙社後方而得名，清末發現煤礦後改稱「崁坑」，日本人依諧音誤讀為「兔子坑」，流傳至今。龜山因鄰近台北，加上桃園國際機場周邊產業發展，如今已從昔日的平埔族狩獵領域，轉型為工商業與住宅機能兼具的重要行政區。"], "quiz": {"q": "關於「龜山區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "龜山地名源自平埔族龜崙社，日治時期將「崙」改為「山」，簡化定名為龜山。", "因清代此地盛產某種作物，官府設「龜山區」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 1, "rightFb": "沒錯！龜山地名源自平埔族龜崙社，日治時期將「崙」改為「山」，簡化定名為龜山。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 89, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『大園區』這個地方，是怎麼來的嗎？大園舊稱大坵園，「坵」為劃分田地的單位，「園」指旱田，大坵園即指大片旱作田地。", "大園地名由來相對單純，源自清代對土地分類與計量的用詞：「坵」是劃分田地區塊的計算單位，「園」則專指不需灌溉、種植雜糧或經濟作物的旱田（與需要灌溉的水田「田」相對），這一帶因擁有大片連續的旱作田地，因而被稱為「大坵園」，1920年日本殖民政府推行地方改制時簡化為「大園」，沿用至今。大園境內的「許厝港」，是清代開墾桃園沿海地區先民最初登岸的港口之一，", "康熙年間許鳳率族人於此開墾，逐漸發展成大地主，港口因而以許姓命名，全盛時期商賈雲集，後因泥沙淤積與鐵路興建而沒落，如今已闢為濕地生態園區；「橫山」則因老街溪與新街溪之間隆起一道橫向的台地岡阜而得名。大園因緊鄰台灣海峽，加上桃園國際機場座落於此，是桃園市對外交通的重要門戶。"], "quiz": {"q": "關於「大園區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "大園舊稱大坵園，「坵」為劃分田地的單位，「園」指旱田，大坵園即指大片旱作田地。"], "correct": 3, "rightFb": "沒錯！大園舊稱大坵園，「坵」為劃分田地的單位，「園」指旱田，大坵園即指大片旱作田地。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 90, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『觀音區』這個地方，是怎麼來的嗎？觀音因清咸豐年間農民在溪中拾得一塊狀似觀音的石頭並建廟供奉，原稱石觀音，日治時期簡化為觀音。", "觀音地名由來源自一則充滿民間信仰色彩的傳說：清咸豐10年（1860年），一位農民在當地溪流中撿拾到一塊天然石頭，石頭表面的紋路酷似觀音菩薩的形貌，村民認為這是神蹟，便將石頭供奉於路旁膜拜，這一帶因而被稱為「石觀音」。隨著這尊石觀音有求必應的靈驗事蹟逐漸傳開，信眾集資興建「福龍山寺」正式供奉；明治28年（1895年），有村民在寺廟旁發現一處湧泉，據傳泉水能治百病，", "因而命名為「甘泉井」，這座寺廟此後也改稱「甘泉寺」，成為當地重要的信仰中心。日治時期，「石觀音」正式簡化更名為「觀音」，沿用至今。觀音境內的「白沙墩」因觀音溪至大堀溪間有一座灰白色的沙丘（墩）而得名，日治時期在此興建的白沙岬燈塔，是台灣現存日治時期保存最完整的燈塔之一；「草漯」則因沙質地形排水不良、沼澤遍布而得名，境內草漯沙丘更有「台版撒哈拉」之稱。"], "quiz": {"q": "關於「觀音區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "觀音因清咸豐年間農民在溪中拾得一塊狀似觀音的石頭並建廟供奉，原稱石觀音，日治時期簡化為觀音。"], "correct": 3, "rightFb": "沒錯！觀音因清咸豐年間農民在溪中拾得一塊狀似觀音的石頭並建廟供奉，原稱石觀音，日治時期簡化為觀音。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 91, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『新屋區』這個地方，是怎麼來的嗎？新屋因清代廣東客籍范姜兄弟原屋遭平埔族侵擾焚毀，遷居另建新宅「新起屋」而得名。", "新屋是南桃園開發最早的地區之一，地名由來與一段家族拓墾史密切相關：清雍正、乾隆年間，廣東客籍范姜兄弟渡海來到桃園拓墾，原本的居所後來遭到平埔族的侵擾破壞，家族被迫放棄舊屋，於咸豐5年（1855年）遷居至此，興建五棟嶄新的大宅，當地人稱之為「新起屋」，這座建築如今已列為國家三級古蹟范姜古厝。「新屋」之名便由此而來，", "意指「新蓋的房子」。新屋境內地名同樣充滿拓墾故事：「九斗」是因地主羅允玉體恤佃農收成不佳，僅收取九斗稻穀作為租金而得名；「永安」原為當地漁港名稱，因地處新屋溪出海口，是桃園沿海重要的漁業據點，如今永安漁港與周邊的海螺文化園區已發展成知名的觀光漁港。新屋因地勢平坦、水源充足，是桃園著名的「魚米之鄉」。"], "quiz": {"q": "關於「新屋區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因鄭成功部隊行經此地時隨口命名而流傳下來", "新屋因清代廣東客籍范姜兄弟原屋遭平埔族侵擾焚毀，遷居另建新宅「新起屋」而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！新屋因清代廣東客籍范姜兄弟原屋遭平埔族侵擾焚毀，遷居另建新宅「新起屋」而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [88, 89, 90, 91]}, {"id": "main-桃園市-4", "title": "桃園市．復興區至富岡", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識桃園市的幾個地方：復興區、內壢、埔心、富岡。」", "stops": [{"placeId": 92, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『復興區』這個地方，是怎麼來的嗎？復興區舊稱角板山，因清光緒年間劉銘傳見此地形平坦如板、四周山峰如角而得名，戰後為紀念民族復興基地精神改稱復興。", "復興區舊稱「角板山」，相傳光緒12年（1886年），時任台灣巡撫的劉銘傳巡視此地時，見這片位於大漢溪畔的河階台地地勢平坦開闊，四周環繞的山峰稜角分明，宛如一塊四角凸起的木板，因而將此地命名為「角板山」。角板山因地處漢人與泰雅族傳統領域的交界，清末劉銘傳在此設立「撫墾局」，推行開山撫番政策；日治時期更興建角板山貴賓館（今復興青年活動中心），", "蔣中正總統來台後也常在此避暑度假，因而又稱「介壽賓館」。戰後，政府基於「以復興基地精神、光復大陸山河」的政治期許，將角板山所在的鄉級行政區改名為「復興鄉」，2014年桃園升格直轄市後改制為復興區，是桃園市唯一的山地原住民區，境內巴陵、爺亨、羅浮、小烏來、義興等泰雅族部落，各自保有豐富多元的地名故事與部落文化。"], "quiz": {"q": "關於「復興區」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["復興區舊稱角板山，因清光緒年間劉銘傳見此地形平坦如板、四周山峰如角而得名，戰後為紀念民族復興基地精神改稱復興。", "因這裡曾發生一場械鬥，勝方直接以 見的聚落命名方式。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [96, 97]}], "sideQuests": [{"id": "side-桃園市-1", "title": "桃園市．永安至南崁", "kind": "side", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識桃園市的幾個地方：永安、桃仔園、大嵙崁、南崁。」", "stops": [{"placeId": 474, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『永安』這個地方，是怎麼來的嗎？永安因地處新屋溪出海口，是清代以來重要的漁業據點，日治時期設立漁港後定名永安，取平安吉祥之意。", "永安漁港位於新屋區新屋溪出海口，是桃園沿海少數具規模的天然漁港之一，地名「永安」取「永遠平安」的吉祥寓意，反映討海人家祈求出海作業平安順利的樸實心願，這種以吉祥字詞為漁村命名的方式，在台灣沿海聚落中相當常見。永安地區清代以來便是新屋一帶重要的漁業與農業並存聚落，居民多兼營近海捕撈與沿岸養殖；日治時期，當局在此闢建漁港設施，", "正式以「永安」為港口命名，逐漸發展成新屋沿海最重要的漁業據點。如今永安漁港周邊興建了以海洋文化為主題的「海螺文化園區」與觀光魚市，弧形的漁港堤防搭配夕陽美景，加上鄰近的永安濱海自行車道與綠色隧道，讓永安從傳統漁村轉型為桃園沿海知名的觀光景點，每年吸引大量遊客前來品嚐海鮮、欣賞海岸風光。"], "quiz": {"q": "關於「永安」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "永安因地處新屋溪出海口，是清代以來重要的漁業據點，日治時期設立漁港後定名永安，取平安吉祥之意。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！永安因地處新屋溪出海口，是清代以來重要的漁業據點，日治時期設立漁港後定名永安，取平安吉祥之意。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 499, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『桃仔園』這個地方，是怎麼來的嗎？相傳清初移民在此廣植桃樹成林，花開時節景色動人，因而得名桃仔園，後簡稱桃園。", "「桃仔園」是桃園地名演變過程中最廣為人知的一個階段：相傳清乾隆年間，墾首薛啟隆率眾拓墾龜山、八德一帶時，在這片新墾土地上大量栽植桃樹，每逢春季花開時節，滿山遍野桃花盛開、如雲似霞，景色美不勝收，因而讓當地人以「桃仔園」稱呼這片美麗的墾地，這也是台灣少數以花卉景觀直接入名、而非依防禦工事、族群或地形命名的特殊案例。乾隆39年（1774年）《續修臺灣府志》中已可見「桃仔園莊」的正式記載，", "可見這個充滿詩意的地名，至遲在18世紀中葉便已廣為流傳。光緒14年，官方文書進一步簡化為「桃園」，這個因桃花美景而生的地名，最終演變成今日桃園市、桃園區的正式名稱，也讓「桃園」成為全台唯一以花卉命名、且沿用至今的直轄市名稱。"], "quiz": {"q": "關於「桃仔園」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "相傳清初移民在此廣植桃樹成林，花開時節景色動人，因而得名桃仔園，後簡稱桃園。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 2, "rightFb": "沒錯！相傳清初移民在此廣植桃樹成林，花開時節景色動人，因而得名桃仔園，後簡稱桃園。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 500, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『大嵙崁』這個地方，是怎麼來的嗎？大溪舊稱，源自泰雅族語意指「大水」，因大漢溪流經此地水勢湍急而得名。", "「大嵙崁」是大溪地名演變史上維持時間最久、也最廣為人知的一個階段。這個名稱源自泰雅族語，意指「大水」，反映大嵙崁溪（今大漢溪）流經此地時水勢湍急、聲勢浩大的特徵。清末，劉銘傳推行「開山撫番」政策時，選擇在大嵙崁設立撫墾局，作為漢人與泰雅族交涉、開發山地資源的重要據點，當時大嵙崁因是大漢溪航運的終點，來自山區的樟腦、茶葉皆須經此地轉運至艋舺、大稻埕，", "商船往來絡繹不絕，市街盛極一時，孕育出今日仍完整保存的大溪老街巴洛克式牌樓立面。日治時期，這個名稱簡化為今日通行的「大溪」，但「大嵙崁」之名至今仍常見於地方文史資料、老字號商行招牌，以及大嵙崁溪這個大漢溪的舊稱之中，是認識大溪河運貿易全盛時期歷史的重要關鍵詞。"], "quiz": {"q": "關於「大嵙崁」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "大溪舊稱，源自泰雅族語意指「大水」，因大漢溪流經此地水勢湍急而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 1, "rightFb": "沒錯！大溪舊稱，源自泰雅族語意指「大水」，因大漢溪流經此地水勢湍急而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 501, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『南崁』這個地方，是怎麼來的嗎？地名源自平埔族凱達格蘭族「南崁社」譯音，為桃園最早開發地區之一。", "南崁其實是整個桃園地區開發史的起點，其知名度與歷史地位甚至超越了行政區劃上管轄它的蘆竹區本身。這個地名源自平埔族凱達格蘭族「南崁社」的社名音譯，是清代漢人進入桃園台地拓墾前，當地原住民的主要聚居地。由於南崁地處南崁溪出海口附近，是早期由海路進入台北盆地、桃園台地的重要登陸據點與交通門戶，漢人移民多由此登岸後再向內陸擴散開墾，", "因此南崁的漢人開發時間，比桃園、中壢等內陸地區都要來得早。清代南崁因扼守海運要道，一度發展成頗具規模的港口市街，直到河口逐漸淤積、鐵路與公路等陸路交通興起後，南崁的商業機能才逐漸被桃園市區取代。如今南崁因鄰近桃園國際機場與中山高速公路交流道，加上大型購物商場的進駐，已從清代的海運門戶，轉型為桃園市重要的商業與交通樞紐。"], "quiz": {"q": "關於「南崁」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "地名源自平埔族凱達格蘭族「南崁社」譯音，為桃園最早開發地區之一。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！地名源自平埔族凱達格蘭族「南崁社」譯音，為桃園最早開發地區之一。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [474, 499, 500, 501]}, {"id": "side-桃園市-2", "title": "桃園市．龍岡至爺亨", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識桃園市的幾個地方：龍岡、三坑仔、巴陵、爺亨。」", "stops": [{"placeId": 502, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『龍岡』這個地方，是怎麼來的嗎？因國民政府時期滇緬地區撤退來台的軍民在此建立眷村而聞名，形成特殊的雲南、緬甸文化聚落。", "龍岡地名的近代知名度，主要來自一段特殊的移民歷史：1950年代，國共內戰失利後，滯留在雲南、緬甸邊境一帶的國民政府軍隊（俗稱「滇緬孤軍」）分批撤退來台，政府將其中一部分軍民安置在平鎮龍岡一帶，設立忠貞新村等眷村聚落。這些來自雲南、緬甸的軍民，將家鄉的飲食、信仰與生活習慣一併帶入龍岡，逐漸發展出全台獨樹一格的雲南、緬甸文化聚落，", "忠貞市場周邊的米干、大薄片、椒麻雞等雲南料理，以及潑水節等特殊民俗活動，都是龍岡最具代表性的文化資產。龍岡因鄰近中壢、平鎮交界，加上眷村改建與都市更新的推動，如今雖已從早期克難的眷村聚落轉型為現代化社區，但每逢潑水節或忠貞市場的雲南美食小吃，仍持續向外界訴說著這段跨越國界、落地生根的移民故事。"], "quiz": {"q": "關於「龍岡」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因國民政府時期滇緬地區撤退來台的軍民在此建立眷村而聞名，形成特殊的雲南、緬甸文化聚落。"], "correct": 3, "rightFb": "沒錯！因國民政府時期滇緬地區撤退來台的軍民在此建立眷村而聞名，形成特殊的雲南、緬甸文化聚落。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 503, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『三坑仔』這個地方，是怎麼來的嗎？因地形有三條山坑溝流匯集於此而得名，即今龍潭三坑老街一帶，昔日為大漢溪河運貨物集散地。", "三坑仔地名由來，源自當地三條坑溝匯流的地形特徵：鴨母坑、火劫尾坑與蔗部坑三條山澗坑溝，在此匯入大漢溪畔的河階台地，因而得名「三坑仔」。清代，三坑仔因地處大漢溪水運的重要據點，成為龍潭、關西一帶山區物產運往下游艋舺、大稻埕的集散轉運站，往來船隻、挑夫絡繹不絕，市街因而繁榮一時，形成今日仍保存古樸閩客混合建築風貌的「三坑老街」，", "老街上的黑白洗（青錢第洗衣池）、永福宮等古蹟，至今仍是了解這段河運貿易歷史的重要見證。隨著大漢溪淤積、鐵路與公路等陸路運輸系統興起，三坑仔的河港機能逐漸沒落，一度歸於平靜，直到近年因老街保存與大漢溪畔的自行車道開發，才重新成為桃園市龍潭區熱門的懷舊觀光景點。"], "quiz": {"q": "關於「三坑仔」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因地形有三條山坑溝流匯集於此而得名，即今龍潭三坑老街一帶，昔日為大漢溪河運貨物集散地。"], "correct": 3, "rightFb": "沒錯！因地形有三條山坑溝流匯集於此而得名，即今龍潭三坑老街一帶，昔日為大漢溪河運貨物集散地。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 568, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『巴陵』這個地方，是怎麼來的嗎？巴陵（泰雅語 Balung，意為巨木）位於北橫公路中點，依海拔高低分為上、中、下巴陵，是知名的水蜜桃產地。", "巴陵地名源自泰雅族語「Balung」，意指高大巨木。相傳早年泰雅族人沿著大漢溪上游遷徙尋找適合定居的河階地，來到今日中巴陵一帶時，見到倒臥於地的巨大枯木，便以此為地名，記錄下這片山林曾有巨木參天的印象。日治時期文獻中則出現巴崚、巴稜、巴壟、馬崙等不同譯寫，皆是同一泰雅語詞的音譯變體。巴陵位於北部橫貫公路的中點，因地勢由高而低分為上巴陵、中巴陵與下巴陵三段，各自呈現不同風貌：上巴陵鄰近拉拉山，", "保留大片紅檜與扁柏巨木群，其中1973年由學者發現的神木群，讓巴陵聲名大噪；中巴陵一帶可通往嘎拉賀與爺亨溫泉；下巴陵則有橫跨溪谷的吊橋景觀，橋下即是三光溪匯入大漢溪之處，形成「三龜戲珠」的溪石奇景。如今巴陵也是北台灣重要的溫帶水果產地，每年四、五月水蜜桃花開滿山，暑假則是採收旺季，吸引許多遊客上山賞遊採果，讓這個曾經只是描述巨木倒地的泰雅語地名，成為北橫公路旅遊的重要地標。"], "quiz": {"q": "關於「巴陵」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["巴陵（泰雅語 Balung，意為巨木）位於北橫公路中點，依海拔高低分為上、中、下巴陵，是知名的水蜜桃產地。", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因清代此地盛產某種作物，官府設「巴陵」市集而得名", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 0, "rightFb": "沒錯！巴陵（泰雅語 Balung，意為巨木）位於北橫公路中點，依海拔高低分為上、中、下巴陵，是知名的水蜜桃產地。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 569, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『爺亨』這個地方，是怎麼來的嗎？爺亨（泰雅語 Zihing／Ehen）因地形東、南兩側環山，每日上午陽光難以照入，故以此為名，今以梯田與溫泉聞名。", "爺亨部落位於桃園市復興區三光里，緊鄰玉峰溪與馬里闊灣溪，擁有復興區僅次於角板山的第二大河階台地。關於爺亨地名的由來，目前流傳最廣的說法是源自泰雅語「Zihing」（或寫作Ehen），意指陽光不易照到之地，因為部落東、南兩側都被高聳山頭圍繞，每天要等到接近中午，陽光才會照進谷地，加上森林茂密、雨霧頻繁，此地終年顯得陰涼潮溼。此外還流傳另外兩種說法：一說爺亨意指「溪邊的台地」，描述其地形特徵；另一說則認為當地氣候濕冷，", "早年溪邊容易滋生水蛭，因此以泰雅語稱水蛭的詞彙音轉而來。儘管擁有廣闊平坦的河階地形，但爺亨溪水礦物質含量偏高，早年不利飲用與大規模農耕，聚落規模因此一直不大，主要部落反而發展在對岸向陽的武道能敢一帶。如今爺亨善用山泉水引灌，開闢出全區最整齊的梯田景觀，曾有「後山穀倉」美稱；附近的巴陵橋溫泉在1997年重新出露後，也以「爺亨溫泉」之名對外開放，成為北橫公路上兼具梯田美景與泡湯體驗的知名景點。"], "quiz": {"q": "關於「爺亨」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因日治時期一位姓氏諧音相近的官員在此駐點而得名", "因清代此地盛產某種作物，官府設「爺亨」市集而得名", "爺亨（泰雅語 Zihing／Ehen）因地形東、南兩側環山，每日上午陽光難以照入，故以此為名，今以梯田與溫泉聞名。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！爺亨（泰雅語 Zihing／Ehen）因地形東、南兩側環山，每日上午陽光難以照入，故以此為名，今以梯田與溫泉聞名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [502, 503, 568, 569]}, {"id": "side-桃園市-3", "title": "桃園市．合流至義興", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識桃園市的幾個地方：合流、羅浮、小烏來、義興。」", "stops": [{"placeId": 570, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『合流』這個地方，是怎麼來的嗎？合流（泰雅語 Hbun-sinqumi）位於復興區羅浮里，因坐落於溪流匯合處而得名。", "合流部落隸屬桃園市復興區羅浮里，泰雅語稱作「Hbun-sinqumi」，「Hbun」在泰雅語中意指溪流匯合的出口或匯流處，合流之名直接描述了當地位於數條山澗匯入大漢溪支流附近的地形特徵，是台灣山區聚落常見的一種依地形命名方式。根據部落耆老口述的遷徙史，泰雅族祖先自更古老的發源地沿河谷向北遷徙時，曾有家族一支循著三光溪河谷南下，行經此處的溪流匯口而在此暫留、發展成小型聚落，", "因而留下這個描述性地名。如今合流仍是羅浮里所轄的一個泰雅族部落，由於鄰近北橫公路與大漢溪河谷，加上仍保有相對完整的山林環境，近年發展出「部落獵人學校」等體驗活動，帶領遊客學習泰雅族傳統的狩獵、辨識植物與野外求生知識，讓旅人在認識地名由來的同時，也能親身感受泰雅族與這片溪流山林共存的生活智慧。"], "quiz": {"q": "關於「合流」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「合流」市集而得名", "合流（泰雅語 Hbun-sinqumi）位於復興區羅浮里，因坐落於溪流匯合處而得名。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 1, "rightFb": "沒錯！合流（泰雅語 Hbun-sinqumi）位於復興區羅浮里，因坐落於溪流匯合處而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 571, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『羅浮』這個地方，是怎麼來的嗎？羅浮舊稱雅邦（Kinyopan），原為拉號社所屬的一個小社，日治時期整併聚落後逐漸發展成今日的羅浮部落。", "羅浮位於桃園市復興區羅浮里，地處大漢溪由北轉西流的河階地形上，海拔約250至300公尺。此地原屬「拉號社」（Rahaw，泰雅語意為樹木叢密）的傳統領域，拉號社在大漢溪左岸山腹間又分為雅邦（Keyopan）、卡納、哈卡灣、卡馬告、卡巴庫灣等五個小社，村落分布於今日溪口台與羅浮之間的緩坡地帶。日治時期，日本當局進入拉號社後設置警察駐在所，並在拉號社下方興建水圳、分配梯田，未能分得田地的族人則遷往雅邦另立聚落；其後日方為便於管理，", "又將駐在所遷移至雅邦，另在溪口設置新的駐在所。台灣光復後，行政區域重新調整，雅邦一帶便改稱為「羅浮」，沿用至今。如今羅浮里是北橫公路沿線重要的聚落據點，除了保留泰雅族部落文化與紅色的羅浮橋、藍色的復興橋等地標景觀，近年更因地下蘊藏豐富的碳酸氫鈉溫泉（俗稱美人湯）而開發出羅浮溫泉與泰雅故事公園，成為結合部落文化體驗與溫泉遊憩的觀光景點。"], "quiz": {"q": "關於「羅浮」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["羅浮舊稱雅邦（Kinyopan），原為拉號社所屬的一個小社，日治時期整併聚落後逐漸發展成今日的羅浮部落。", "因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因清代此地盛產某種作物，官府設「羅浮」市集而得名"], "correct": 0, "rightFb": "沒錯！羅浮舊稱雅邦（Kinyopan），原為拉號社所屬的一個小社，日治時期整併聚落後逐漸發展成今日的羅浮部落。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 572, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『小烏來』這個地方，是怎麼來的嗎？小烏來（泰雅語 Ulay，意為溫泉）因位於宇內溪支流會合處，故以此為名，與新北市烏來同源。", "小烏來位於桃園市復興區義盛里，「烏來」一詞源自泰雅族語「Ulay」，意指溫泉，同樣的語詞也是新北市知名溫泉鄉烏來地名的由來。流經義盛里的這條溪流，泰雅族人原本同樣稱為Ulay，但為了與新北的烏來作出區別，後來便依台語音近改寫為「宇內溪」。宇內溪南、北兩條支流會合之處，正是泰雅族部落Rahu（下宇內）所在的下游河谷地帶，這一帶因此被稱為「小烏來」，以別於規模較大、開發較早的烏來地區。此地因斷層地形發達，", "形成落差約50公尺、氣勢磅礡的小烏來瀑布，以及風動石、龍鳳瀑布等特殊景觀，加上近年興建的透明天空步道，讓遊客能夠站在瀑布上方70公尺高處俯瞰溪谷美景，成為北橫公路上人氣極高的景點之一。鄰近的義興部落與橫跨大漢溪的義興吊橋，也因電影《賽德克·巴萊》在此取景而聲名大噪，讓小烏來從一個描述溫泉溪流的泰雅語地名，逐漸發展為結合自然景觀、部落文化與影視觀光的複合式旅遊勝地。"], "quiz": {"q": "關於「小烏來」（桃園市）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "小烏來（泰雅語 Ulay，意為溫泉）因位於宇內溪支流會合處，故以此為名，與新北市烏來同源。"], "correct": 3, "rightFb": "沒錯！小烏來（泰雅語 Ulay，意為溫泉）因位於宇內溪支流會合處，故以此為名，與新北市烏來同源。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 573, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『義興』這個地方，是怎麼來的嗎？義興（泰雅語 Gihin，意為陽光）相傳因先民見此地陽光普照，認為子孫必能興旺，故以此為名。", "義興部落位於桃園市復興區義盛里，地處大漢溪中游右岸的河階與斜坡地，與對岸的高坡部落隔溪相望。義興的泰雅語舊稱為「Gihin」，也曾寫作宜亨，據部落口傳，原意與陽光有關：早年雪霧鬧社的族人遷移至此，見這片台地終日陽光普照，認為若在此定居，子孫後代必能興旺繁盛，因而以Gihin為名，後來的漢字譯寫便取其吉祥之意定為「義興」。另有說法認為Gihin可能與當地山坡地形、某種草名，或是水蛭有關，", "但確切語源已難以考證。義興因灌溉水圳「義興一圳」「義興二圳」的開闢而擁有較多水田，山坡地則盛產竹木與香菇；大漢溪上游興建攔砂壩後，也利用水位落差在此設置義興電廠。橫跨溪谷、長約200公尺的義興吊橋，原本只是引水灌溉用的水管橋，2013年整修後開放通行，因外型優美且曾作為電 ）這個地名，下列何者才是真正的由來？", "opts": ["因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "北區同樣源自新竹古稱「竹塹」，1982年劃分行政區時，因位於中華路以北、涵蓋古竹塹城與港口而得名。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！北區同樣源自新竹古稱「竹塹」，1982年劃分行政區時，因位於中華路以北、涵蓋古竹塹城與港口而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 100, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『香山區』這個地方，是怎麼來的嗎？香山原稱番山，因是道卡斯族竹塹社所居之山，因「番」字不雅，取其字形相近改稱香山。", "香山地名由來流傳著兩種說法。第一種說法指出，這一帶原是道卡斯族竹塹社的傳統居住地，漢人最初依「原住民（番）盤據之山」的印象，將此地稱為「番山」，後因「番」字帶有歧視意味且不甚文雅，加上「番」與「香」兩字字形相近，遂改稱較為文雅的「香山」；第二種說法則來自清代惠安縣螺陽陳氏家族的口傳，指遷居至此的族人見大坪頂一帶漫山遍野花草盛開、香氣馥郁，因而直接以「香山」為地名。相傳永曆36年（1682年），", "明鄭軍隊北伐路經此地，沿途徵召竹塹社人搬運糧草，族人不堪其擾而遷離，此地漢人拓墾隨後展開，卻也一度因與原住民衝突而幾近絕跡，直到清廷劃設土牛界線、設隘寮防守後，漢人才得以再次聚集。香山因濱海地形，清代曾一度取代淤塞的竹塹港成為重要貨物集散港，如今則以生態豐富的香山濕地聞名，是北台灣最大的蚵場與候鳥棲息地之一。"], "quiz": {"q": "關於「香山區」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "香山原稱番山，因是道卡斯族竹塹社所居之山，因「番」字不雅，取其字形相近改稱香山。"], "correct": 3, "rightFb": "沒錯！香山原稱番山，因是道卡斯族竹塹社所居之山，因「番」字不雅，取其字形相近改稱香山。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 118, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『南寮』這個地方，是怎麼來的嗎？南寮因與頭前溪口北岸的「魚寮」相對而得名，原稱十塊寮，是新竹港口機能歷經多次遷移後的落腳處。", "南寮的地名由來相對單純，因這處聚落位於頭前溪出海口南岸，與北岸一處稱為「魚寮」的聚落隔溪相對，因而得名「南寮」；地方文獻另記載，南寮最初稱為「十塊寮」，是康熙50年前後北莊二十四聚落之一。南寮的發展與新竹港口機能的多次遷移密切相關：清代最早的竹塹港（舊港）因頭前溪泥沙淤積而航運受阻，嘉慶12年（1807年）商民集資在南寮另闢新港，卻不到兩年又遭淤塞，", "此後南寮逐漸萎縮為單純的漁村聚落。日治時期，南寮曾闢建海水浴場，是許多新竹人共同的青春回憶；戰後也曾安置大陳島撤退來台的居民。1980年代，因應南寮漁港持續淤積的問題，政府在南側另建新竹漁港取而代之，南寮舊港則轉型保存為觀光漁港，如今結合漁產直銷中心、17公里海岸自行車道等設施，成為新竹市最具代表性的濱海休閒去處。"], "quiz": {"q": "關於「南寮」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "南寮因與頭前溪口北岸的「魚寮」相對而得名，原稱十塊寮，是新竹港口機能歷經多次遷移後的落腳處。", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 2, "rightFb": "沒錯！南寮因與頭前溪口北岸的「魚寮」相對而得名，原稱十塊寮，是新竹港口機能歷經多次遷移後的落腳處。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [98, 99, 100, 118]}, {"id": "main-新竹市-2", "title": "新竹市．金山面至千甲", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識新竹市的幾個地方：金山面、千甲。」", "stops": [{"placeId": 119, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『金山面』這個地方，是怎麼來的嗎？金山面因地形似「金」字形的山面而得名，今為清華大學、交通大學及新竹科學園區一帶。", "金山面地名由來，源自其獨特的地形樣貌：這一帶丘陵地勢由高而低逐漸傾斜延伸，遠望形狀神似漢字「金」字的側面輪廓，因而被稱為「金山面」，是台灣地名中依山形字形命名的例子之一。金山面清代原屬竹塹社傳統領域外緣的丘陵地帶，因土壤貧瘠、水源不易取得，開發程度長期落後於竹塹城周邊的平原地帶，僅有零星的旱作農業。1950年代後，", "隨著台灣工業技術研究院、國立清華大學、國立交通大學（今陽明交通大學）相繼在此設校或設立園區，加上1980年新竹科學工業園區的成立，金山面搖身一變成為台灣高科技產業的發源地與研發重鎮，昔日單純以山形命名的丘陵荒地，如今已成為享譽國際的「台灣矽谷」核心地帶。"], "quiz": {"q": "關於「金山面」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "金山面因地形似「金」字形的山面而得名，今為清華大學、交通大學及新竹科學園區一帶。"], "correct": 3, "rightFb": "沒錯！金山面因地形似「金」字形的山面而得名，今為清華大學、交通大學及新竹科學園區一帶。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 475, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『千甲』這個地方，是怎麼來的嗎？千甲因清代王世傑家族在此拓墾面積廣達逾千甲田園而得名，見證竹塹早期大規模墾殖的規模。", "千甲地名由來，直接見證了清代竹塹地區最重要的一波拓墾成果：康熙57年（1718年），福建同安人王世傑率族人渡海來台，向道卡斯族竹塹社取得土地展開開墾，短短約三十年間，從頭前溪南岸的樹林頭一路向南拓展到靠近香山的南勢地區，已開闢出逾千甲的田園，「千甲」之名便由此而來，直接以開墾面積作為地名，是台灣地名中相當寫實的計量式命名範例。王世傑家族除了廣闢田園，", "也修築水圳灌溉良田，其中隆恩圳最初便因可灌溉四百甲土地而稱作「四百甲圳」，可見當時竹塹平原水利建設之發達；王家同時捐地出資興建東瀛福地、新竹城隍廟、竹蓮寺等地方廟宇，奠定竹塹地區信仰與社會發展的基礎。如今千甲一帶已高度都市化，成為新竹市東區重要的住宅與商業區域，但這個源自三百年前拓墾規模的地名，仍持續提醒著人們這片土地開發的歷史起點。"], "quiz": {"q": "關於「千甲」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["千甲因清代王世傑家族在此拓墾面積廣達逾千甲田園而得名，見證竹塹早期大規模墾殖的規模。", "因清代此地盛產某種作物，官府設「千甲」市集而得名", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 0, "rightFb": "沒錯！千甲因清代王世傑家族在此拓墾面積廣達逾千甲田園而得名，見證竹塹早期大規模墾殖的規模。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [119, 475]}], "sideQuests": [{"id": "side-新竹市-1", "title": "新竹市．赤土崎至十八尖山", "kind": "side", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識新竹市的幾個地方：赤土崎、湳雅、客雅、十八尖山。」", "stops": [{"placeId": 489, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『赤土崎』這個地方，是怎麼來的嗎？地處清代竹塹城東側台地邊坡，因表土富含氧化鐵、土色偏紅，且地勢略高如崎坂，故稱赤土崎，今為清華大學、交通大學一帶。", "赤土崎在清代僅是竹塹城外的紅土台地聚落，日治時期更因地處邊陲，先後被闢為競馬場、靶場、高爾夫球場，甚至一度是新竹地區的公共墓地「雞蛋面義塚」所在，是墾地、墓地與後來校地三種身分交疊的特殊區域。太平洋戰爭末期，日本海軍在此設立第六燃料廠新竹合成部，戰後改由中國石油公司接手，成為台灣重要的煉油與化工研究重地。1955年，中美簽訂原子能和平用途合作協定，清華大學決定在台復校，", "原先於南港、新竹兩地間擇一設校，最終因新竹縣長朱盛淇積極爭取，加上中國石油公司提撥約四十公頃原屬日本海軍燃料廠的土地，清華便選定赤土崎作為新校址，日後又陸續增撥、收購土地，逐步擴展成今日清華園的規模。有「赤土崎人標」之稱的社會運動家黃旺成，正是誕生於這片紅土台地，讓赤土崎從單純的地形地名，累積出橫跨拓墾、殖民工業、學術與社會運動的多重歷史記憶。"], "quiz": {"q": "關於「赤土崎」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["地處清代竹塹城東側台地邊坡，因表土富含氧化鐵、土色偏紅，且地勢略高如崎坂，故稱赤土崎，今為清華大學、交通大學一帶。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 0, "rightFb": "沒錯！地處清代竹塹城東側台地邊坡，因表土富含氧化鐵、土色偏紅，且地勢略高如崎坂，故稱赤土崎，今為清華大學、交通大學一帶。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 490, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『湳雅』這個地方，是怎麼來的嗎？湳為閩南語濕軟泥地之意，此地早期地勢低窪多沼澤積水，故以「湳」為名，雅則為後來的近音雅化用字。", "湳雅原字寫作「湳仔」，因地處頭前溪天然堤防背後的低窪濕地，長年容易積水氾濫、土地泥濘難行，因而得名，日治時期正式書寫為「湳雅」。這裡在清代是南北官道出竹塹城後的必經之地：無論是從金門厝或舊社渡口渡過頭前溪、北上前往艋舺的旅人商賈，都得行經湳雅這處通衢要道，也因此，清代官府旌表節孝烈婦、孝子的石碑坊，", "多選址立於此地示眾，例如儒士吳國步妻蘇氏的節孝坊、國學生李鍚金的孝子坊（後者現已遷至青草湖）皆曾豎立在湳雅一帶，成為地方教化的重要地標。如今湳雅雖已高度都市化，但這段因低窪濕地而發展成交通要道、進而成為官方表彰節孝場所的歷史，仍是新竹市北區地方史中相當獨特的一頁。"], "quiz": {"q": "關於「湳雅」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因清代此地盛產某種作物，官府設「湳雅」市集而得名", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "湳為閩南語濕軟泥地之意，此地早期地勢低窪多沼澤積水，故以「湳」為名，雅則為後來的近音雅化用字。"], "correct": 3, "rightFb": "沒錯！湳為閩南語濕軟泥地之意，此地早期地勢低窪多沼澤積水，故以「湳」為名，雅則為後來的近音雅化用字。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 491, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『客雅』這個地方，是怎麼來的嗎？地名可能源自道卡斯族「客雅社」的社名譯音，流經此地的客雅溪即因此得名。", "客雅地名的確切語源目前仍有討論空間，一般認為與流經當地的客雅溪有關，客雅溪發源於新竹縣寶山鄉，主要流域涵蓋寶山與新竹市，經雙溪匯流後流入青草湖，再蜿蜒穿越新竹市區、由北區進入香山，最終從十七公里海岸線出海，是王世傑當年開墾竹塹的重要根據地之一；有趣的是，這條溪流其實原名「隙仔溪」，「客雅」之名很可能是後來才附加於溪流與周邊聚落的稱呼。1920年，", "日本殖民政府將客雅庄與水田、苦苓腳、崙仔、樹林頭、湳雅、東勢、赤土崎、埔頂、柴梳山、金山面等十餘個街庄一併併入新竹街，客雅自此成為新竹市區向東南擴展的重要腹地，今日範圍橫跨北區、東區交界，涵蓋客雅里、中雅里、西雅里等多個里，是新竹市區人口稠密的住宅生活圈之一。"], "quiz": {"q": "關於「客雅」（新竹市）這個地名，下列何者才是真正的由來？", "opts": [ b": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 540, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『青草湖』這個地方，是怎麼來的嗎？青草湖原為新竹丘陵客雅溪谷地內一處雜草叢生的山間盆地，故稱青草湖，1956年築壩蓄水成水庫，因水庫淤積乾涸，一度被戲稱「名副其實的青草湖」。", "青草湖地名由來相當寫實：這一帶原是新竹丘陵中、客雅溪流貫的一處山間谷地盆地，早期未經開發，雜草叢生，先民便依此景象稱之為「青草湖」，「湖」在此意指低窪的盆地地形，而非真有湖泊存在，清代這一帶已形成「青草湖庄」，隸屬竹北一堡。民國42年（1953年）起，政府在此興建攔水壩，1956年完工形成人工湖泊「青草湖山水庫」，兼具灌溉與觀光功能，山光水色一度吸引大量遊客，", "然而隨著水庫逐漸淤積、加上颱風破壞與上游濫墾，蓄水功能盡失，湖面因布袋蓮蔓生與泥沙淤積而縮小，意外應驗了「青草湖」字面上的景象，被戲稱為「名副其實的青草湖」。新竹市政府自2007年起推動「青草湖重生計畫」，清淤整治並興建映月橋連接淤沙堆積形成的湖中島「于飛島」，讓這處因荒地得名的山間盆地重現山水風貌，湖畔的靈隱寺也是在地知名的清幽古剎。"], "quiz": {"q": "關於「青草湖」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["青草湖原為新竹丘陵客雅溪谷地內一處雜草叢生的山間盆地，故稱青草湖，1956年築壩蓄水成水庫，因水庫淤積乾涸，一度被戲稱「名副其實的青草湖」。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 0, "rightFb": "沒錯！青草湖原為新竹丘陵客雅溪谷地內一處雜草叢生的山間盆地，故稱青草湖，1956年築壩蓄水成水庫，因水庫淤積乾涸，一度被戲稱「名副其實的青草湖」。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 555, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『迎曦門』這個地方，是怎麼來的嗎？迎曦門是竹塹城四座城門中僅存的東門，因面向東方、迎接朝陽初曦而得名，1902年日本人市區改正時拆除其餘城牆城門，僅保留此門，如今是新竹市的地標。", "迎曦門是清代竹塹城僅存的一座城門，因方位座西朝東、清晨可迎接第一道曙光，取「迎曦」（迎接朝陽）之意而得名。雍正元年（1723年），竹塹設立淡水廳治，雍正11年（1733年）淡水同知徐治民以莿竹環植為城；道光6年（1826年），竹塹士紳鄭用錫（開台進士）等人奏請改建為磚石城獲准，1827年興工、1829年完工，城牆周長八百六十丈，並建四座城樓：東門迎曦門、西門挹爽門、南門歌薰門、北門拱辰門。明治35年（1902年），", "日本殖民政府實施市區改正，拆除城牆與其餘三座城門，唯獨保留迎曦門，使其成為竹塹城唯一的實體見證。迎曦門城座以花崗石條砌成，城樓為歇山重簷式構造、共二十四根立柱，門額上題「迎曦」二字，城門後方立有道光9年的「新建臺灣府淡水廳城碑記」石碑。民國88年（1999年）竹塹建城170週年時，周邊整建為結合護城河親水公園、詩牆與玻璃橋的「新竹之心」市民廣場，讓這座近兩百年的古城門，成為新竹市最具代表性的文化地標。"], "quiz": {"q": "關於「迎曦門」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "迎曦門是竹塹城四座城門中僅存的東門，因面向東方、迎接朝陽初曦而得名，1902年日本人市區改正時拆除其餘城牆城門，僅保留此門，如今是新竹市的地標。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！迎曦門是竹塹城四座城門中僅存的東門，因面向東方、迎接朝陽初曦而得名，1902年日本人市區改正時拆除其餘城牆城門，僅保留此門，如今是新竹市的地標。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 560, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『十七公里海岸』這個地方，是怎麼來的嗎？十七公里海岸因自南寮漁港至南港賞鳥區全長約十七公里而得名，串連紅樹林、香山濕地與看海公園，是新竹市最具代表性的濱海遊憩廊帶。", "十七公里海岸線的命名相當直白，因這條濱海觀光帶自北端的南寮漁港一路延伸至南端的南港賞鳥區，全長約十七公里而得名，是新竹市政府整合沿線景點所規劃的自行車道與觀光廊帶。這段海岸串連了南寮漁港、看海公園、港南運河、金城湖賞鳥區、海山漁港與香山濕地等多處景點，其中香山濕地是台灣西海岸重要的潮間帶生態區，面積廣達一千多公頃，孕育大量招潮蟹、彈塗魚與貝類，", "每年吸引黑面琵鷺、大杓鷸等候鳥過境棲息，已被劃為野生動物保護區；區內的「賞蟹步道」以心型設計橫跨潮間帶，是熱門的生態觀察與拍照景點。沿線另有紅樹林生態區，水筆仔等紅樹林植物構成綠色隧道景觀。十七公里海岸線因兼具漁業聚落、濕地生態與夕陽美景，如今已成為新竹市最受歡迎的戶外休閒去處，也是認識竹塹濱海環境變遷的重要場域。"], "quiz": {"q": "關於「十七公里海岸」（新竹市）這個地名，下列何者才是真正的由來？", "opts": ["因清代此地盛產某種作物，官府設「十七公里海岸」市集而得名", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "十七公里海岸因自南寮漁港至南港賞鳥區全長約十七公里而得名，串連紅樹林、香山濕地與看海公園，是新竹市最具代表性的濱海遊憩廊帶。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關"], "correct": 2, "rightFb": "沒錯！十七公里海岸因自南寮漁港至南港賞鳥區全長約十七公里而得名，串連紅樹林、香山濕地與看海公園，是新竹市最具代表性的濱海遊憩廊帶。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [493, 540, 555, 560]}]}, "新竹縣": {"mainChains": [{"id": "main-新竹縣-1", "title": "新竹縣．竹北市至關西鎮", "kind": "main", "opening": "土伯：「呵呵，少年仔，坐下來聽阿伯講古。這一段路，我帶你認識新竹縣的幾個地方：竹北市、竹東鎮、新埔鎮、關西鎮。」", "stops": [{"placeId": 101, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『竹北市』這個地方，是怎麼來的嗎？竹北市境內的豆子埔，因清代引水灌溉、適合種植豆類作物而得名，是竹北市行政中心所在地。", "竹北市舊稱範圍內的「豆子埔」，原寫作「豆仔埔」，是一處典型依作物命名的台灣地名：清治末期，這片位於竹北東北部的荒埔地因水利設施完善，適合種植豆類作物，因而得名「豆仔埔庄」，隸屬竹北一堡。1920年日本殖民政府推行地方改制時，將地名雅化為「豆子埔」，成為今日竹北里、竹義里、福德里、竹仁里一帶的舊稱。竹北原是新竹縣治所在地，", "因鄰近新竹科學園區與高鐵新竹站，1988年由竹北鄉改制為竹北市，是新竹縣人口成長最快速的行政區。豆子埔一帶因縣政府、縣議會等行政機關進駐，加上高鐵特區的開發，已從清代單純的豆類作物產地，蛻變為新竹縣的政治與交通核心地帶。"], "quiz": {"q": "關於「竹北市」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因鄭成功部隊行經此地時隨口命名而流傳下來", "竹北市境內的豆子埔，因清代引水灌溉、適合種植豆類作物而得名，是竹北市行政中心所在地。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！竹北市境內的豆子埔，因清代引水灌溉、適合種植豆類作物而得名，是竹北市行政中心所在地。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 102, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『竹東鎮』這個地方，是怎麼來的嗎？竹東舊稱樹杞林，因當地早期樹杞繁茂成林而得名，後因位居新竹市之東方，改稱竹東。", "竹東鎮舊稱「樹杞林」，這個地名由來相當直白：漢人尚未大規模入墾之前，此地原是泰雅族、賽夏族等原住民狩獵遊耕之地，境內樹杞（一種常綠喬木）生長茂密成林，因而得名。乾隆34年（1769年），已有廣東惠州籍移民入墾上、下七份及麻園肚一帶；乾隆39年，饒平人林欽堂向竹塹社通事承墾頭重埔、員山一帶荒埔，特地從六張犁（今竹北六家）率領四十餘名男丁前來建立村落；乾隆末年，", "陸豐人彭乾和、彭乾順兄弟自芎林南下遷往樹杞林開墾，嘉慶11年（1806年）更組成「金惠成墾號」，展開大規模拓墾。1920年，日本殖民政府因這一帶位居新竹市的東方，將「樹杞林」簡化改稱「竹東」，沿用至今。竹東因早期樟腦、林業與礦業發達，一度與東勢、羅東並稱台灣三大林業集散地，如今則是新竹縣頭前溪以南地區的交通樞紐與商業重鎮。"], "quiz": {"q": "關於「竹東鎮」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "竹東舊稱樹杞林，因當地早期樹杞繁茂成林而得名，後因位居新竹市之東方，改稱竹東。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！竹東舊稱樹杞林，因當地早期樹杞繁茂成林而得名，後因位居新竹市之東方，改稱竹東。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 103, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『新埔鎮』這個地方，是怎麼來的嗎？新埔舊稱吧哩嘓，是道卡斯族狩獵的荒埔，因是沿海開墾地帶中較晚開發的河埔地而得名新埔。", "新埔鎮舊稱「吧哩嘓」，原是平埔族道卡斯族狩獵遊耕的荒埔地帶。雍正年間，來自廣東惠州府陸豐縣、嘉應州鎮平縣、潮州府饒平縣等地的客籍移民陸續進入竹塹東北的吧哩嘓一帶拓墾，但因當時清廷渡台開墾政策未有統一規範，加上此地本屬竹塹社傳統領域，早期漢人拓墾規模並不大；乾隆12年（1747年），竹塹社人因水患之故，在土目衛阿貴與錢子白率領下整族遷入新埔地區。乾隆49年（1784年），", "已有陸豐、鎮平籍的粵籍移民聚落形成，並將荒地開發為農田，「新埔莊」之名也在此時開始使用，意即「新開發的河埔地」——因當年移民大多先從紅毛港、香山港登陸，沿海地帶已率先開發，這片內陸河埔地相對較晚開墾，因而得名「新埔」。如今新埔以生產稻米、水梨、柿子與柿餅聞名，義民廟更是台灣客家信仰的重要據點。"], "quiz": {"q": "關於「新埔鎮」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "新埔舊稱吧哩嘓，是道卡斯族狩獵的荒埔，因是沿海開墾地帶中較晚開發的河埔地而得名新埔。", "因鄭成功部隊行經此地時隨口命名而流傳下來"], "correct": 2, "rightFb": "沒錯！新埔舊稱吧哩嘓，是道卡斯族狩獵的荒埔，因是沿海開墾地帶中較晚開發的河埔地而得名新埔。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}, {"placeId": 104, "npcName": "土伯", "npcIcon": "🌾", "sceneEmoji": "🌾", "pages": ["你知道『關西鎮』這個地方，是怎麼來的嗎？關西清代稱鹹菜甕，因客籍居民擅長醃製鹹菜而得名，日治時期因「鹹菜」台語發音近似日語「關西」而改名。", "關西鎮舊名幾經演變，最初稱「美里庄」；乾隆58年，先民取「新興茂盛」之意改稱「新興庄」；道光30年，又因當地客家族群擅長將生產過剩的芥菜（鹹菜）醃製於甕中保存、行銷各地，四處可見醃製鹹菜的陶甕，因而改稱「鹹菜甕」。這片土地是竹塹社頭目衛阿貴率領客家墾佃拓墾而成，清代曾是新竹縣客家地區唯一能與竹塹城分庭抗禮的繁榮街市，也是竹東地區茶葉與樟腦貿易的重要轉運站。1920年，", "日本殖民政府推行地方改制，因「鹹菜甕」的客語發音與日語地名「關西」發音相近，索性直接借用日本本州西部「關西」之名，取代原本的「鹹菜甕」，沿用至今，與地理方位上真正的「西邊」其實毫無關聯。關西境內的馬武督部落，是泰雅族馬里闊丸系統的一支，也是關西鎮境內唯一不屬於尖石、復興的泰雅族部落。"], "quiz": {"q": "關於「關西鎮」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因鄭成功部隊行經此地時隨口命名而流傳下來", "關西清代稱鹹菜甕，因客籍居民擅長醃製鹹菜而得名，日治時期因「鹹菜」台語發音近似日語「關西」而改名。"], "correct": 3, "rightFb": "沒錯！關西清代稱鹹菜甕，因客籍居民擅長醃製鹹菜而得名，日治時期因「鹹菜」台語發音近似日語「關西」而改名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}], "closing": "土伯：「這段古早的記憶，就交給你收著了，你說是不是？」", "placeIds": [101, 102, 103, 104]}, {"id": "main-新竹縣-2", "title": "新竹縣．湖口鄉至橫山鄉", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識新竹縣的幾個地方：湖口鄉、新豐鄉、芎林鄉、橫山鄉。」", "stops": [{"placeId": 105, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『湖口鄉』這個地方，是怎麼來的嗎？湖口舊稱大窩口，「窩」指山間盆狀窪地，因地處一連串窩地窪地的出入口而得名，後簡稱湖口。", "湖口鄉舊稱「大窩口」，「窩」在客家語中意指山間盆狀的窪地地形，因湖口鄉境內新莊溪上游支流將台地切割成一連串槽狀的「窩」「湖」地形，而這處聚落恰好位於這些窪地的出入口，故稱「大窩口」；又因「大湖口」與「大窩口」的客家語發音相近，後續文獻多以「大湖口」記載，1920年才正式簡化為「湖口」。清光緒年間，劉銘傳修築台北至新竹間的鐵路行經此地，", "設立大湖口車站，讓這座原本純樸的客家散村迅速發展成繁盛的交通聚落，可惜後來鐵路改道西移至新湖口，老湖口的繁華也隨之沒落，僅留下老街供人緬懷；車站原址後由天主教會於1954年租用傳教，1966年建成今日所見的老湖口天主堂。如今湖口因鄰近新竹工業區與科學園區，已從清代的窪地聚落轉型為新竹縣重要的工業重鎮。"], "quiz": {"q": "關於「湖口鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "湖口舊稱大窩口，「窩」指山間盆狀窪地，因地處一連串窩地窪地的出入口而得名，後簡稱湖口。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 2, "rightFb": "沒錯！湖口舊稱大窩口，「窩」指山間盆狀窪地，因地處一連串窩地窪地的出入口而得名，後簡稱湖口。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 106, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『新豐鄉』這個地方，是怎麼來的嗎？新豐舊稱紅毛港，相傳明末荷蘭人（紅毛）曾在此因船難登岸而得名。", "新豐鄉舊稱「紅毛港」，因境內同名港口而得名。台灣民間長期以「紅毛」稱呼荷蘭人，《新竹縣志》記載，相傳南明隆武元年（1646年），荷蘭人曾因船隻損壞而在此地登陸，這段傳說便成為紅毛港地名的由來，距今已有三百七十餘年歷史。雍正13年（1735年），泉州閩籍移民汪淇楚等人成立「萃豐莊」墾區，開始開墾沿海一帶，並將墾務公館設於紅毛港；乾隆年間，", "擁有萃豐莊一半股權的粵籍陸豐縣人徐立鵬轉向內陸拓墾，成為客家人移入竹塹地區的開端，泉州同安縣的閩南籍鄭氏家族也陸續進駐紅毛港開墾。1920年，日本殖民政府依「物產豐饒」之意，將「紅毛港」改稱「新豐」，沿用至今。新豐鄉擁有長達七公里、全新竹縣最長的海岸線，以西瓜、洋香瓜與鴨蛋等農漁特產聞名。"], "quiz": {"q": "關於「新豐鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["新豐舊稱紅毛港，相傳明末荷蘭人（紅毛）曾在此因船難登岸而得名。", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地"], "correct": 0, "rightFb": "沒錯！新豐舊稱紅毛港，相傳明末荷蘭人（紅毛）曾在此因船難登岸而得名。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 107, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『芎林鄉』這個地方，是怎麼來的嗎？芎林舊稱九芎林，因當地早期九芎樹叢生成林而得名，後簡化為芎林。", "芎林鄉地名由來相當直接：這一帶清代原是九芎樹密布叢生的林地，先民入墾後便以「九芎林」為地名，1920年日本殖民政府推行地方改制時，簡化為今日的「芎林」。芎林與竹東、北埔一帶同屬清代客家移民拓墾竹塹丘陵地帶的一環，境內的飛鳳山因「飛鳳探梅」美景名列新竹縣八景之一，天氣晴朗時甚至可從山頂觀日亭遠眺台北101大樓，", "是台灣本島可望見101大樓的最遠地點之一。芎林同時也是北埔開拓史上重要的中繼站：金廣福墾號的核心人物姜秀鑾，其胞弟姜秀福便留居芎林九芎林一帶未隨兄長遷往北埔，其後代形成北埔姜家「新姜」一支的源頭，可見芎林在新竹客家拓墾史上，與北埔、竹東等地有著千絲萬縷的家族淵源。"], "quiz": {"q": "關於「芎林鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "芎林舊稱九芎林，因當地早期九芎樹叢生成林而得名，後簡化為芎林。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！芎林舊稱九芎林，因當地早期九芎樹叢生成林而得名，後簡化為芎林。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 108, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『橫山鄉』這個地方，是怎麼來的嗎？橫山因境內有一座橫亙於前的「大山背山」而得名。", "橫山鄉地名由來相對單純，源自地形特徵：這一帶因有一座名為「大山背山」的山脈橫亙於聚落前方，遠望山勢橫向延展、阻擋去路，因而被稱為「橫山」，是台灣地名中依山脈走向直接命名的典型例子。橫山鄉境內最負盛名的內灣，地處油羅溪上游河灣地帶，清末以前原是泰雅族生活的丘陵領域，隨著客家移民勢力沿油羅溪向山區推進，加上日治時期日本當局發現當地蘊藏檜木與煤礦資源，", "帶動林業、石灰業與水泥業的興盛，1950至1970年代吸引大量勞動人口進駐，內灣戲院、內灣車站與商店街因而繁華一時；直到礦產枯竭、林業政策轉變，內灣才逐漸沒落，直到1990年代末，漫畫家劉興欽以家鄉內灣為背景創作的「大嬸婆與阿三哥」系列作品，才讓內灣老街重新以懷舊觀光小鎮的姿態聲名遠播。"], "quiz": {"q": "關於「橫山鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "橫山因境內有一座橫亙於前的「大山背山」而得名。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 2, "rightFb": "沒錯！橫山因境內有一座橫亙於前的「大山背山」而得名。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "溪仔：「嘿嘿，很有趣吧！要記住喔，不然我會被忘名妖吃掉的！」", "placeIds": [105, 106, 107, 108]}], "sideQuests": [{"id": "side-新竹縣-1", "title": "新竹縣．北埔鄉至尖石鄉", "kind": "side", "opening": "硯叔：「且慢，此地之名，頗有來歷，容我道來。這一段路，我帶你認識新竹縣的幾個地方：北埔鄉、寶山鄉、峨眉鄉、尖石鄉。」", "stops": [{"placeId": 109, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『北埔鄉』這個地方，是怎麼來的嗎？北埔因地處姜秀鑾開墾集團「金廣福」大隘的北側荒埔而得名，「北」為方位、「埔」指未開墾荒地。", "北埔鄉與峨眉、寶山三鄉，清代原是賽夏族與道卡斯族的傳統領域，統稱「大隘」地區。道光15年（1835年），淡水廳同知李嗣鄴諭令粵籍墾首姜秀鑾與閩籍林德修、周邦正合資成立「金廣福」墾號（「金」代表官方資金，「廣」代表粵籍出資，「福」代表閩籍出資），這是台灣拓墾史上少見的閩粵合作範例。姜秀鑾率領數百武裝墾戶，由樹杞林（今竹東）突破賽夏族防線進駐這片盆地，", "因位置在整個大隘拓墾範圍的北側荒埔，故稱「北埔」，並以金廣福公館為指揮中心，在西、南、北三面種植莿竹為牆、興建四座城門防禦。姜秀鑾其後又陸續向南埔、峨眉、寶山等地推進開墾，到咸豐年間，這片山區大致已全數墾成。如今北埔以保存完整的老街古蹟群、東方美人茶與柿餅聞名，金廣福公館更是新竹縣境內唯一的國定古蹟。"], "quiz": {"q": "關於「北埔鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名", "北埔因地處姜秀鑾開墾集團「金廣福」大隘的北側荒埔而得名，「北」為方位、「埔」指未開墾荒地。", "因清代此地盛產某種作物，官府設「北埔鄉」市集而得名"], "correct": 2, "rightFb": "沒錯！北埔因地處姜秀鑾開墾集團「金廣福」大隘的北側荒埔而得名，「北」為方位、「埔」指未開墾荒地。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 110, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『寶山鄉』這個地方，是怎麼來的嗎？寶山原稱草山，因初墾時雜草叢生而得名，1920年取「草山」的山字與境內「寶斗仁」的寶字合併，改稱寶山。", "寶山鄉的命名方式相當獨特，融合了兩個舊地名的用字：這一帶清代開墾之初，因地表雜草叢生、遍布荒蕪的山丘，因而被稱為「草山」；1920年，日本殖民政府推行地方行政改制，考量境內另有一處聚落名為「寶斗仁」，便取「草山」的「山」字，加上「寶斗仁」的「寶」字，組合成兼具美感與吉祥寓意的新地名「寶山」，沿用至今，", "這種截取兩個舊地名各一字重新組合命名的方式，在台灣地名史上相當少見。寶山鄉與北埔、峨眉同屬「大隘」拓墾範圍的一部分，清道光年間由姜秀鑾率領的金廣福墾號逐步開墾而成。如今寶山鄉以紅糖、楊桃、橄欖、水梨、柑橘與綠竹筍等農特產聞名，境內的寶山第一水庫、第二水庫，也是新竹地區重要的休閒景點與水資源設施。"], "quiz": {"q": "關於「寶山鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "寶山原稱草山，因初墾時雜草叢生而得名，1920年取「草山」的山字與境內「寶斗仁」的寶字合併，改稱寶山。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 1, "rightFb": "沒錯！寶山原稱草山，因初墾時雜草叢生而得名，1920年取「草山」的山字與境內「寶斗仁」的寶字合併，改稱寶山。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 111, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『峨眉鄉』這個地方，是怎麼來的嗎？峨眉原稱月眉，因峨眉溪曲流凸岸沖積出半月形的河階地形而得名，日治時期改以近音雅字「峨眉」取代。", "峨眉鄉清代原是賽夏族的生活領域，早期稱為「月眉」，這個地名直接描述了當地的地形特徵：峨眉溪流經此地時形成彎曲的曲流，凸岸處經年累月沖積出一連串半月形的河階地，形狀神似天上的眉月，因而得名。道光15年（1835年），金廣福墾號成立後，姜秀鑾在完成北埔的據點建設後，繼續向西進逼，陸續在月眉、中興、富興等地建立防禦性的小型集村，作為開墾的中繼站，", "與北埔、寶山共同構成「大隘」拓墾範圍。1920年，日本殖民政府推行地方行政改制，將八個小庄合併為「峨眉庄」，並以發音相近、更具文學意象的「峨眉」取代原本的「月眉」，沿用至今。峨眉鄉是全台客家人比例第三高的鄉鎮，以東方美人茶（膨風茶）聞名，相傳曾獲英國維多利亞女王讚賞而得名，境內峨眉湖（大埔水庫）的湖光山色，也是熱門的觀光景點。"], "quiz": {"q": "關於「峨眉鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "峨眉原稱月眉，因峨眉溪曲流凸岸沖積出半月形的河階地形而得名，日治時期改以近音雅字「峨眉」取代。", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來"], "correct": 1, "rightFb": "沒錯！峨眉原稱月眉，因峨眉溪曲流凸岸沖積出半月形的河階地形而得名，日治時期改以近音雅字「峨眉」取代。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 112, "npcName": "硯叔", "npcIcon": "📚", "sceneEmoji": "📚", "pages": ["你知道『尖石鄉』這個地方，是怎麼來的嗎？尖石因境內那羅溪與嘉樂溪匯流處聳立一塊如尖筍般的巨石而得名，是新竹縣面積最大的行政區。", "尖石鄉的地名由來直接取自一塊真實存在的巨石：境內那羅溪與嘉樂溪匯流之處，矗立著一塊形狀尖聳如竹筍的巨大岩石，長期經受烈日曝曬與暴雨侵襲，依然堅毅挺立，這塊巨石不僅是地名的由來，更被視為象徵當地泰雅族原住民在艱困山地環境中不畏艱難、堅忍不拔精神的地標。尖石鄉是新竹縣面積最大的行政區，海拔高度自200公尺至2000公尺不等，", "境內高山林立，日治時期曾是五指山撫墾署管轄的番地，1910年至1913年更爆發過三次「李崠山事件」的隘勇線推進戰役，是泰雅族與日本殖民政府武裝衝突的重要歷史現場。尖石鄉境內的司馬庫斯、鎮西堡因擁有壯觀的紅檜巨木群而聞名，加上秀巒溫泉、大霸尖山等自然景觀，是新竹縣最重要的山地原住民文化與生態觀光重鎮。"], "quiz": {"q": "關於「尖石鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["尖石因境內那羅溪與嘉樂溪匯流處聳立一塊如尖筍般的巨石而得名，是新竹縣面積最大的行政區。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因日治時期一位姓氏諧音相近的官員在此駐點而得名"], "correct": 0, "rightFb": "沒錯！尖石因境內那羅溪與嘉樂溪匯流處聳立一塊如尖筍般的巨石而得名，是新竹縣面積最大的行政區。", "wrongFb": "唔，不太對喔！你再仔細回想一下前面聽到的內容。"}}], "closing": "硯叔：「知其名而不知其由來，猶如讀史而不知其事。望你謹記。」", "placeIds": [109, 110, 111, 112]}, {"id": "side-新竹縣-2", "title": "新竹縣．五峰鄉至內灣", "kind": "side", "opening": "風先生：「……風吹過此地，帶來了一段舊時光。這一段路，我帶你認識新竹縣的幾個地方：五峰鄉、司馬庫斯、鎮西堡、內灣。」", "stops": [{"placeId": 113, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『五峰鄉』這個地方，是怎麼來的嗎？五峰因境內五指山（五峰山）五座山峰相連、遠望形似手掌五指而得名。", "五峰鄉的地名由來源自境內一座知名地標——五指山：這座海拔1062公尺、屬雪山山脈支稜的山峰，因五個山頭相連、輪廓神似人類張開的手掌五指，因而得名「五指山」，也稱「五峰山」，清代曾入選淡水廳八景之一，日治及戰後更被評選為台灣十二勝之一，五峰鄉便是以此山為名。五峰鄉是新竹縣面積第二大、人口最少的行政區，境內同時是泰雅族與賽夏族兩個原住民族群的傳統領域，", "賽夏族兩年一度、在大隘部落舉行的矮靈祭（paSta'ay），是台灣原住民文化中極具代表性、也最受矚目的祭典之一。日治時期，五峰因實施理蕃政策而長期由警察機關直接管轄；戰後才改制為新竹縣五峰鄉。境內的清泉溫泉自日治時期便已知名，也是張學良將軍軟禁期間的居所之一。"], "quiz": {"q": "關於「五峰鄉」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["五峰因境內五指山（五峰山）五座山峰相連、遠望形似手掌五指而得名。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故"], "correct": 0, "rightFb": "沒錯！五峰因境內五指山（五峰山）五座山峰相連、遠望形似手掌五指而得名。", "wrongFb": "灰霧又濃了一分……再想想，真正的線索其實就在剛剛的故事裡。"}}, {"placeId": 114, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『司馬庫斯』這個地方，是怎麼來的嗎？司馬庫斯（泰雅語 Smangus）為紀念一位帶領族人開墾的祖先「馬庫斯」而得名，曾因與世隔絕而有「黑色部落」之稱。", "司馬庫斯位於新竹縣尖石鄉玉峰村深山，海拔約1500公尺，是泰雅族「Mrqwang」（馬里闊丸）支系的一個部落。根據耆老口述，泰雅族祖先原居於今南投縣仁愛鄉一帶，因人口增加、耕地不足而陸續向北遷徙，其中一支由名為「馬庫斯」（Mangus）的祖先率領族人翻山越嶺，來到雪山山脈稜線一帶的高地開墾定居；族人為了紀念這位開拓者，便以「Smangus」（意為紀念馬庫斯）為部落命名，沿用至今。由於地處深山、道路遙遠，", "司馬庫斯直到1979年才通電，聯外道路更晚至1995年才完全修築完成，長期與外界隔絕，因而有「黑色部落」或「上帝的部落」之稱。1991年，部落族人依據耆老口傳的線索，在山林間發現了紅檜巨木群，其中兩株更被列為全台第二、第三大神木，此後司馬庫斯逐漸從封閉的深山部落，轉型為兼具生態保育與觀光發展的知名景點，也讓司馬庫斯這個源自紀念先祖的地名，成為台灣認識泰雅族遷徙史與部落文化的重要窗口。"], "quiz": {"q": "關於「司馬庫斯」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["司馬庫斯（泰雅語 Smangus）為紀念一位帶領族人開墾的祖先「馬庫斯」而得名，曾因與世隔絕而有「黑色部落」之稱。", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "因荷蘭東印度公司文獻直接音譯自家鄉地名而來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關"], "correct": 0, "rightFb": "沒錯！司馬庫斯（泰雅語 Smangus）為紀念一位帶領族人開墾的祖先「馬庫斯」而得名，曾因與世隔絕而有「黑色部落」之稱。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 115, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『鎮西堡』這個地方，是怎麼來的嗎？泰雅族語，意清晨第一道陽光照耀處。", "鎮西堡（泰雅語：Cinsbu）位於新竹縣尖石鄉海拔約1700公尺的深山之中，地名意指「清晨第一道陽光照耀之地」，因終年日照充足、土壤肥沃，適合作物生長而得名，是全台海拔最高的原住民部落之一。相傳鎮西堡部落由泰雅族大頭目之子率眾建立於三百多年前，是秀巒村七社中最早結社的部落，也是Makanaji（基那吉）群向北遷徙擴展的重要根據地。鎮西堡隔著塔克金溪與司馬庫斯遙遙相望，兩地共同孕育出全台面積最大的紅檜原始檜木林。1986年，", "林務局在砍伐鄰近五峰鄉的原始林後，計畫將伐木線轉向尖石鄉秀巒一帶，鎮西堡與新光部落族人為了守護世代居住的傳統領域，聯合起來以「砍一棵樹、償一條命」的口號展開激烈抗爭，最終迫使林務局撤回伐木計畫，成功保住這片珍貴的巨木森林。如今鎮西堡巨木群步道中，以造型維妙維肖的「亞當」「夏娃」神木最負盛名，是台灣生態保育史上一頁重要的原住民護林運動見證。"], "quiz": {"q": "關於「鎮西堡」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "因清代此地盛產某種作物，官府設「鎮西堡」市集而得名", "泰雅族語，意清晨第一道陽光照耀處。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！泰雅族語，意清晨第一道陽光照耀處。", "wrongFb": "非也非也，答案沒有這麼玄乎，再想一次吧。"}}, {"placeId": 116, "npcName": "風先生", "npcIcon": "🍃", "sceneEmoji": "🍃", "pages": ["你知道『內灣』這個地方，是怎麼來的嗎？內灣因坐落於油羅溪彎曲河道內側形成的河灣地帶而得名，日治後期因林業、礦業興盛而繁華一時。", "內灣地名由來源自其所處的河道地形：這處聚落位於油羅溪上游、河道彎曲凹陷的內側河灣處，因而得名「內灣」。內灣清末以前原是泰雅族生活的丘陵地帶，隨著客家移民的拓墾勢力沿油羅溪逐步向山區推進，內灣才逐漸成為漢人與泰雅族接觸的前緣聚落。日治時期，日本當局沿油羅溪深入尖石山區，發現當地蘊藏豐富的檜木與煤礦資源，開啟了內灣的林業、石灰業與水泥業，", "1950至1970年代產業興盛時期，吸引大量伐木工與礦工湧入，帶動內灣戲院、商店街的繁榮；直到礦產枯竭、林業政策轉變，內灣才逐漸歸於平靜。1990年代末，因漫畫家劉興欽以家鄉內灣為背景創作的「大嬸婆與阿三哥」系列作品廣為人知，加上內灣線鐵路的觀光效益，內灣老街得以轉型復甦，成為新竹縣客家山城觀光的代表性景點之一。"], "quiz": {"q": "關於「內灣」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因鄭成功部隊行經此地時隨口命名而流傳下來", "只是地圖繪製時的抄寫誤植，將錯就錯沿用至今，與地方歷史無關", "內灣因坐落於油羅溪彎曲河道內側形成的河灣地帶而得名，日治後期因林業、礦業興盛而繁華一時。", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 2, "rightFb": "沒錯！內灣因坐落於油羅溪彎曲河道內側形成的河灣地帶而 台灣top勝景，是竹東、北埔一帶的信仰名山。", "五指山地名由來源自其獨特的山形樣貌：這座橫跨新竹縣竹東、北埔、五峰等鄉鎮交界的山峰，因五個山頭相連並列、輪廓神似一隻張開的手掌五指，因而得名「五指山」，也稱「五峰山」，五峰鄉的鄉名便是由此山名而來。清代文獻中，五指山已因奇特山形與雲霧繚繞的景致，被列入「淡水廳八景」之一；日治時期，台灣日日新報舉辦「台灣八景」票選活動，", "五指山雖未能擠入正選八景，卻獲選為次於八景的「台灣十二勝」之一，聲名遠播全台。五指山山區廟宇林立，材源寺、灶君堂等廟宇沿著山徑錯落分布，形成獨特的朝山禮佛路線，加上茶園景觀與五指山國家森林步道，是新竹縣客家山區重要的信仰名山與生態健行勝地，山頂視野遼闊，晴朗時可遠眺新竹平原與台灣海峽。"], "quiz": {"q": "關於「五指山」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因地形形似某種動物，先民依外觀直接命名，與族語或墾殖無關", "因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "五指山因五座山峰並列、形如一隻張開的手掌五指而得名，清代即列入淡水廳八景，日治與戰後皆入選台灣top勝景，是竹東、北埔一帶的信仰名山。"], "correct": 3, "rightFb": "沒錯！五指山因五座山峰並列、形如一隻張開的手掌五指而得名，清代即列入淡水廳八景，日治與戰後皆入選台灣top勝景，是竹東、北埔一帶的信仰名山。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}, {"placeId": 547, "npcName": "阿茶", "npcIcon": "🍵", "sceneEmoji": "🍵", "pages": ["你知道『峨眉湖』這個地方，是怎麼來的嗎？峨眉湖原稱大埔水庫，因水庫周邊山巒層疊、湖光倒映山影宛如古代女子彎彎的蛾眉而改稱峨眉湖，是東方美人茶的重要產地。", "峨眉湖原稱「大埔水庫」，是民國51年（1962年）在峨眉溪上游興建攔水壩、於大埔村一帶形成的人工湖泊，主要功能為灌溉與防洪。由於水庫周邊群山環繞、層巒疊翠，湖面在晴朗無風之時，將四周山巒的倒影清晰映照於水中，山水相映的景致宛如古代女子彎彎的蛾眉，加上湖泊所在的峨眉鄉本身地名便源自「月眉」（半月形河階地形）的意象，地方遂將水庫改稱更具詩意的「峨眉湖」，", "沿用至今，與大埔水庫之名並行使用。峨眉湖周邊丘陵地帶因日夜溫差大、雲霧繚繞，是台灣東方美人茶（膨風茶）最重要的原鄉產地之一，相傳這種茶葉曾獲英國維多利亚女王讚賞而得名；環湖步道與獅頭山風景區相互串連，加上十二寮休閒農業區，讓峨眉湖成為新竹縣兼具水庫生態、茶葉產業與客家文化的複合觀光勝地。"], "quiz": {"q": "關於「峨眉湖」（新竹縣）這個地名，下列何者才是真正的由來？", "opts": ["因這裡曾發生一場械鬥，勝方直接以自己姓氏重新命名此地", "因清代此地盛產某種作物，官府設「峨眉湖」市集而得名", "峨眉湖原稱大埔水庫，因水庫周邊山巒層疊、湖光倒映山影宛如古代女子彎彎的蛾眉而改稱峨眉湖，是東方美人茶的重要產地。", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關"], "correct": 2, "rightFb": "沒錯！峨眉湖原稱大埔水庫，因水庫周邊山巒層疊、湖光倒映山影宛如古代女子彎彎的蛾眉而改稱峨眉湖，是東方美人茶的重要產地。", "wrongFb": "……不是這個。仔細想想剛剛那段話，答案就藏在裡面。"}}], "closing": "阿茶：「謝…謝謝你願意聽我說完…這裡的名字，不會被忘記了…」", "placeIds": [117, 504, 546, 547]}]}, "苗栗縣": {"mainChains": [{"id": "main-苗栗縣-1", "title": "苗栗縣．頭份市至通霄鎮", "kind": "main", "opening": "溪仔：「欸欸欸！你也想知道這裡的名字喔？我最愛講這個了！這一段路，我帶你認識苗栗縣的幾個地方：頭份市、竹南鎮、後龍鎮、通霄鎮。」", "stops": [{"placeId": 121, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『頭份市』這個地方，是怎麼來的嗎？頭份因清乾隆年間客籍移民合股開墾，以抓鬮方式分配墾地，抽中第一號者稱「頭份」，因而得名。", "頭份地名完全是台灣土地拓墾制度的產物：清乾隆16年（1751年），廣東嘉應州鎮平縣人林洪、吳永忠、溫殿玉、黃日新、羅德達等約兩百人，率領宗族渡海來到頭份開墾，眾人以抓鬮方式決定各自的開墾地點，抽中第一號的區域便稱為「頭份」，其後依序為二份、三份、四份、五份，這種以合股拓墾編號命名的方式，在頭份、苗栗一帶留下了頭份、二份、三份等一系列地名。據傳林姓人數最多，", "分得頭份、二份及望更寮；黃姓分得三份及新屋下；溫姓分得四份、五份；吳姓分得河唇；羅姓分得中肚，這些姓氏開墾範圍的分布，至今仍大致對應頭份市和平里、民族里一帶。頭份更早之前的舊稱是「田寮庄」，源自乾隆4年（1739年）泉州人林耳順率眾入墾時所建立的臨時草寮聚落。如今頭份因鄰近新竹科學園區竹南園區，是苗栗縣人口最多、少數維持人口正成長的行政區。"], "quiz": {"q": "關於「頭份市」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["頭份因清乾隆年間客籍移民合股開墾，以抓鬮方式分配墾地，抽中第一號者稱「頭份」，因而得名。", "因清代此地盛產某種作物，官府設「頭份市」市集而得名", "純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "傳說是某位雲遊仙人隨手一指，就定下了這個名字"], "correct": 0, "rightFb": "沒錯！頭份因清乾隆年間客籍移民合股開墾，以抓鬮方式分配墾地，抽中第一號者稱「頭份」，因而得名。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 122, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『竹南鎮』這個地方，是怎麼來的嗎？竹南原稱三角店，因1902年縱貫鐵路通車設站於此，1920年因地處新竹之南而改稱竹南。", "竹南鎮最早發展的核心聚落其實是「中港街」，因濱臨海岸、交通便利而繁榮一時；1902年，縱貫鐵路通車，鐵道部在距離中港街約一公里處設立車站，車站周邊因道路交叉而形成聚落，被稱為「三角店」，但車站當時仍沿用「中港」為站名。隨著鐵路運輸逐漸取代港口航運，加上中港溪港口淤積，三角店的繁榮程度逐漸超越中港街，1920年，日本殖民政府正式將「三角店」改名為「竹南」，", "取其地理位置在新竹之南之意，車站也隨之更名為竹南車站，並成為竹南郡的行政中心。竹南因與相鄰的頭份市區連成一片，兩地被視為「雙子城」的都市結構，戰後以塑膠、陶瓷、玻璃、成衣等勞力密集工業起家，1980年代後隨著竹南工業區、竹科竹南園區等大型工業區陸續開闢，成為苗栗縣人口密度最高、也是全台人口密度數一數二的鎮。"], "quiz": {"q": "關於「竹南鎮」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["純粹是地方仕紳附庸風雅、隨意取的吉祥字，並無實際典故", "傳說是某位雲遊仙人隨手一指，就定下了這個名字", "因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "竹南原稱三角店，因1902年縱貫鐵路通車設站於此，1920年因地處新竹之南而改稱竹南。"], "correct": 3, "rightFb": "沒錯！竹南原稱三角店，因1902年縱貫鐵路通車設站於此，1920年因地處新竹之南而改稱竹南。", "wrongFb": "再猜一次！別被似是而非的說法騙了。"}}, {"placeId": 123, "npcName": "溪仔", "npcIcon": "💧", "sceneEmoji": "💧", "pages": ["你知道『後龍鎮』這個地方，是怎麼來的嗎？後龍舊稱後壟，源自道卡斯族後壟社，一說因聚落後方有長條狀丘陵（壟）而得名。", "後龍舊稱「後壟」，其由來主要有三種說法：第一種認為源自道卡斯族「後壟社」的原始社名，該社原名可能是「雅斯社」（Yass）或「阿蘭社」（Auran），清代入墾的漢人將其音轉為「後壟」；第二種說法則從地形出發，指「壟」意指長條狀隆起的丘陵地，因聚落後方正好有這樣的丘陵地形，故稱「後壟之村莊」；第三種較特殊的說法認為，「後壟」原是當地原住民對漢人帶有貶意的稱呼，", "意近「無用之人」，後來反而被漢人挪用作為地名。康熙33年（1694年）《台灣府志》已可見「後壟社」的記載，可見這個地名至遲在17世紀末已通行。1670年，鄭氏部將劉國軒率軍墾殖蓬山八社、後壠五社（涵蓋今通霄、苑裡、後龍、竹南一帶），是漢人有計畫開拓苗栗地區的開端。如今後龍鎮因高鐵苗栗站的設立，成為苗栗縣新興的重點發展地區。"], "quiz": {"q": "關於「後龍鎮」（苗栗縣）這個地名，下列何者才是真正的由來？", "opts": ["因戰後政府統一推行「新生活運動」而改名，與當地原本的故事無關", "後龍舊稱後壟，源自道卡斯族後壟社，一說因聚落後方有長條狀丘陵（壟）而得名。", "因地形形
