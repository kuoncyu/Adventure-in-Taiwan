// ---------- 存讀檔 ----------
function serializeSave(){
  const payload = {
    v:2, playerName:state.playerName, charKey:state.charKey, gender:state.gender, homeRegion:state.homeRegion,
    discovered:Object.keys(state.discovered).map(Number),
    loreScore:state.loreScore, regionDone:state.regionDone, party:state.party, seenIntro:state.seenIntro,
    challengeBest:state.challengeBest
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function loadSaveCode(code){
  try{
    const payload = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    state.playerName = payload.playerName || "旅人";
    state.charKey = payload.charKey || null;
    state.gender = payload.gender || null;
    state.homeRegion = payload.homeRegion || (state.charKey && CHAR_BY_KEY[state.charKey] ? CHAR_BY_KEY[state.charKey].region : "north");
    state.discovered = {}; (payload.discovered||[]).forEach(id=>state.discovered[id]=true);
    state.loreScore = payload.loreScore||0;
    state.regionDone = payload.regionDone||{};
    state.party = payload.party||[];
    state.seenIntro = !!payload.seenIntro;
    state.challengeBest = payload.challengeBest||0;
    return true;
  }catch(e){ return false; }
}

// ---------- 本地保存進度 (localStorage) ----------
const LOCAL_SAVE_KEY = "twlp-rpg-localsave-v1";
const RESOURCE_CACHE_DB = "resource-pack-cache";
function saveLocalProgress(){
  try{ localStorage.setItem(LOCAL_SAVE_KEY, serializeSave()); return true; }
  catch(e){ return false; }
}
function hasLocalProgress(){
  try{ return !!localStorage.getItem(LOCAL_SAVE_KEY); }
  catch(e){ return false; }
}
function loadLocalProgress(){
  try{
    const code = localStorage.getItem(LOCAL_SAVE_KEY);
    return code ? loadSaveCode(code) : false;
  }catch(e){ return false; }
}
function clearLocalProgress(){
  try{ localStorage.removeItem(LOCAL_SAVE_KEY); return true; }
  catch(e){ return false; }
}
function clearResourceCache(){
  return new Promise((resolve)=>{
    try{
      if (!("indexedDB" in window)) { resolve(false); return; }
      const req = indexedDB.deleteDatabase(RESOURCE_CACHE_DB);
      req.onsuccess = ()=>resolve(true);
      req.onerror = ()=>resolve(false);
      req.onblocked = ()=>resolve(true);
    }catch(e){ resolve(false); }
  });
}
function autosave(){
  // 只有在玩家已經選定主角、旅程已開始之後才自動保存
  if (state && state.charKey) saveLocalProgress();
}
function refreshContinueButton(){
  const cBtn = document.getElementById("btn-continue");
  const sBtn = document.getElementById("btn-start-new");
  if (!cBtn || !sBtn) return;
  if (hasLocalProgress()){
    cBtn.style.display = "";
    sBtn.classList.add("ghost","small");
    sBtn.textContent = "開始新旅程";
  } else {
    cBtn.style.display = "none";
    sBtn.classList.remove("ghost","small");
    sBtn.textContent = "開始旅程";
  }
}

function renderChallengeScreen(){
  setBgmRegion(null);
  const total = placesData.length;
  const doneCount = Object.keys(state.discovered).length;
  const body = document.getElementById("challenge-body");
  if (doneCount < total){
    const pct = Math.round(doneCount/total*100);
    body.innerHTML =
      '<div class="paper-panel" style="padding:20px;">'+
      '<div class="detail-title">🔒 尚未解鎖</div>'+

      '<div class="progress-bar" style="margin-top:12px;"><i style="width:'+pct+'%"></i></div>'+
      '<div style="font-size:.78rem;color:#7a6a4a;margin-top:6px;">目前進度：'+doneCount+' / '+total+'（'+pct+'%）</div>'+
      '</div>';
    return;
  }
  body.innerHTML =
    '<div class="paper-panel" style="padding:20px;">'+
    '<div class="detail-title">🎉 全島 574 則地名記憶已完整收錄！</div>'+
    '<div class="detail-body">挑戰模式會從全部地名中隨機抽出 10 題，測驗你的地名學識——答錯不能重來，全力以赴吧！<br><br>歷史最高分：<b>'+(state.challengeBest||0)+'</b> / 10</div>'+
    '<button class="brass-btn" id="btn-start-challenge" style="margin-top:14px;">🏆 開始挑戰</button>'+
    '</div>';
  document.getElementById("btn-start-challenge").onclick = startChallenge;
}

function startChallenge(){
  setBgmRegion(null);
  const pool = placesData.slice();
  for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  const picks = pool.slice(0,10);
  challengeScore = 0;
  const steps = [];
  picks.forEach((p,idx)=>{
    const qinfo = QUIZ_BY_PLACEID[p.id];
    if (!qinfo) return;
    steps.push({
      type:"quiz", quiz:qinfo.quiz, placeId:p.id, npcName:qinfo.npcName, npcIcon:qinfo.npcIcon,
      isChallenge:true, scene:"🏆", label:"自由挑戰・第 "+(idx+1)+" 題／10"
    });
  });
  playSequence(steps, () => {
    if (challengeScore > (state.challengeBest||0)){ state.challengeBest = challengeScore; sfx("complete"); toast("🎉 締造新紀錄！"); }
    else { sfx(challengeScore>=6 ? "complete" : "fail"); }
    openModal(
      '<div class="detail-title">🏆 挑戰結束</div>'+
      '<div class="detail-body">這一輪，你答對了 <b>'+challengeScore+'</b> / 10 題。<br>歷史最高分：<b>'+state.challengeBest+'</b> / 10</div>'+
      '<button class="brass-btn small" id="challenge-retry-btn" style="margin-top:10px;">再挑戰一次</button>',
      {center:true}
    );
    const back = document.querySelector("#modal-root .modal-back:last-child");
    back.querySelector("#challenge-retry-btn").addEventListener("click", ()=>{ back.remove(); startChallenge(); });
    showScreen("challenge"); renderChallengeScreen(); renderTopbar();
  });
}

    back.querySelector("#startnew-cancel").addEventListener("click", ()=>{ sfx("click"); back.remove(); });
    back.querySelector("#startnew-confirm").addEventListener("click", ()=>{
      sfx("click"); back.remove();
      enterFullscreen();
      openCharSelect();
    });
    return;
  }
  enterFullscreen();
  openCharSelect();          // 名字直接沿用所選角色，不再另外取名
});

// ---------- 音訊設定 ----------
function openAudioModal(){
  const back = openModal(
    '<div class="detail-title">🔊 音訊設定</div>'+
    '<div class="detail-body" style="font-size:.8rem;">背景音樂需要把 6 個 mp3 檔放在與本遊戲 HTML 相同的資料夾中；缺少檔案時遊戲仍可正常遊玩，只是沒有音樂。音效不需要外部檔案。</div>'+
    '<div class="audio-row"><label>背景音樂</label><input type="range" id="a-bgm" min="0" max="100" value="'+Math.round(Audio_.bgmVol*100)+'"></div>'+
    '<div class="audio-row"><label>遊戲音效</label><input type="range" id="a-sfx" min="0" max="100" value="'+Math.round(Audio_.sfxVol*100)+'"></div>'+
    '<div class="audio-row"><label>總開關</label><button class="brass-btn small" id="a-toggle">'+(Audio_.enabled?"🔊 開啟中":"🔇 已靜音")+'</button></div>'
    , {center:true});
  back.querySelector("#a-bgm").addEventListener("input", e=>{
    Audio_.bgmVol = e.target.value/100; Audio_.applyVolume();
  });
  back.querySelector("#a-sfx").addEventListener("input", e=>{
    Audio_.sfxVol = e.target.value/100;
  });
  back.querySelector("#a-toggle").addEventListener("click", e=>{
    Audio_.setEnabled(!Audio_.enabled);
    e.target.textContent = Audio_.enabled ? "🔊 開啟中" : "🔇 已靜音";
    if (Audio_.enabled) sfx("click");
  });
}

// ---------- 全螢幕 ----------
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) return;
  try{
    const p = req.call(el);
    if (p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function exitFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (!ex) return;
  try{
    const p = ex.call(document);
    if (p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function toggleFullscreen(){
  sfx("click");
  if (isFullscreen()){ exitFullscreen(); return; }
  const el = document.documentElement;
  if (!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)){
    toast("此瀏覽器不支援全螢幕功能");
    return;
  }
  enterFullscreen();
}
function syncFullscreenBtn(){
  const btn = document.getElementById("topbar-fullscreen");
  if (btn) btn.textContent = isFullscreen() ? "🗗" : "⛶";
}
["fullscreenchange","webkitfullscreenchange","msfullscreenchange"].forEach(evt=>{
  document.addEventListener(evt, syncFullscreenBtn);
});

// ---------- 回主選單 ----------
function isDialogueActive(){
  const el = document.getElementById("screen-dialogue");
  return !!el && !el.classList.contains("hidden");
}
function goToTitleMenu(){
  if (typing){ clearInterval(typing); typing = null; }
  dlgSteps = []; dlgIdx = -1; dlgOnDone = null;
  curSceneBg = null;
  setChapterLabel("");
  const bgEl = dlgSceneBgEl(); if (bgEl) bgEl.classList.remove("on");
  showScreen("worldmap");
}
function backToMainMenu(){
  sfx("click");
  if (isDialogueActive()){
    const back = openModal(
      '<div class="detail-title">回到拾憶地圖</div>'+
      '<div class="detail-body">目前劇情尚未播放完畢，返回拾憶地圖將會中斷這段對話。建議先點上方 💾 取得存檔代碼，之後可用「讀取存檔代碼」繼續旅程。確定要返回嗎？</div>'+
      '<div style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end;">'+
        '<button class="brass-btn ghost small" id="menu-cancel-btn">取消</button>'+
        '<button class="brass-btn small" id="menu-confirm-btn">確定返回</button>'+
      '</div>'
      , {center:true});
    back.querySelector("#menu-cancel-btn").addEventListener("click", ()=>{ sfx("click"); back.remove(); });
    back.querySelector("#menu-confirm-btn").addEventListener("click", ()=>{ sfx("click"); back.remove(); goToTitleMenu(); });
  } else {
    goToTitleMenu();
  }
}

window.addEventListener("beforeunload", autosave);

showScreen("title");
})();
